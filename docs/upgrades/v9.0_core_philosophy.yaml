author: "agent"

hypothesis:
  what: "扬长避短 — 定性评级替代数字评分，KS精选化，TS替代VP，禁止仓位建议"
  improves_which_dimension: "报告诚实度、可操作性、AI能力边界清晰度"
  current_baseline: "v8.0: 数字评分(X/100)、20+ VP、仓位建议、空泛预测"
  expected_after: "零数字评分、零仓位建议、KS 10-15个、TS 5-8个"
  could_regress: "报告可能感觉'不够具体'，用户习惯数字评分"

success_criteria:
  - "全文零仓位建议/加仓/减仓/持仓%"
