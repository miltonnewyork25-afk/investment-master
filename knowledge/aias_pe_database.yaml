# 使用说明
# 1. 每份SaaS报告Phase 3完成后: 追加该公司的AIAS数据
# 2. 当sample_size>=10: 运行线性回归, 更新benchmark
# 3. 新报告中PE/AIAS<8 或 >30: 自动标记为异常→Ch34式检验
# 4. 异常公司需要3种解释+概率分布(AIAS高估/市场误伤/其他)
