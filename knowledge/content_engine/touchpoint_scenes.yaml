# 林晓薇的一天：NYC程序员妈妈 × 投资洞见 场景库 v2.0
# 39岁,Park Slope Brooklyn,前Google工程师,两个女儿(Emily 9, Mia 6)
# 设计原则: NYC具体性 + 程序员系统思维 + 母亲嵌入式消费情报 + 跨文化可翻译
# Hofstadter原则: 每个场景 = 一次范畴重分配的种子

persona:
  name: "林晓薇 (Xiaowei Lin)"
  age: 39
  location: "Park Slope, Brooklyn, NYC"
  apartment: "两卧公寓, 月租$4,200"
  background: "NYU CS → Google后端工程师 → fintech技术主管"
  husband: "David, 二代华裔, 咨询公司项目经理"
  daughters:
    - "Emily, 9岁, PS 321四年级"
    - "Mia, 6岁, 一年级"
  mother: "住法拉盛, 每周三坐7号线来帮忙"
  money_philosophy: "福建移民家庭——不是抠门,是精确"

scenes:
  morning_coffee:
    time: "7:47 AM"
    location: "第七大道与Lincoln Place交叉口 Starbucks"
    company: SBUX
    scene: |
      手机7:43下的单。Grande Oat Milk Latte + Cheese Danish给Emily当早餐(昨晚忘了做三明治,又是这样)。
      Mia拽着她的手蹲下来看蚂蚁搬面包屑。"妈妈快看！它好努力！"
      前面三个人也在等。四分钟。
      上班前的四分钟和拉着六岁小孩的四分钟是不同的货币。$7.85,一周五天,一年$2,000。
    insight_bridge: |
      这就是队列管理问题——mobile order是高优先级线程,抢占walk-in线程资源,
      整个系统throughput反而下降。$900M-$1.3B系统性摩擦。
      Niccol从Chipotle来应该懂throughput——但修复分布式系统瓶颈和修复门店出餐动线是两码事。
    china_bridge: "瑞幸做对了一件事——取餐就是窗口,没有'假装第三空间'。但瑞幸没有定价权:9.9元蜂拥,16元骂声一片。"
    emotion: "低级焦虑——Mia会不会碰到湿垃圾桶,Danish凉了Emily不肯吃"
    report_link: "SBUX_v4.0 Ch7+Ch13 4分钟悖论"
    hofstadter: "标记'4分钟'→ 品牌体验重分配为制造业吞吐成本"

  school_dropoff_apple:
    time: "8:15 AM"
    location: "PS 321门口, 7th Avenue"
    company: AAPL
    scene: |
      Emily今天因iPad被没收哭了十分钟。学校作业用iPad做States of Matter,
      做完后'顺便'看了40分钟slime视频。8:05才发现,出门要迟到。
      她把iPad抽走,Emily崩溃——不是因为slime,是"我还没保存Keynote presentation!"
      一个九岁的孩子会用Keynote了。学校、作业、画画(Procreate)、跟外婆FaceTime——全在这块$329屏幕上。
    insight_bridge: |
      Emily不是'选择'了Apple,她是在Apple里长大的。
      换Android = 丢Procreate画作 + 跟同学AirDrop断连 + 重学所有操作。
      这不是switching cost,这是identity cost。
      Buffett减持74%。一个93岁的人承认他不理解AI时代的苹果。但这个生态系统的粘性不是商业分析能完全捕捉的。
    china_bridge: "中国孩子用华为平板、小天才手表。锁定逻辑一样,但品牌溢价天花板不同。Apple在中国失去的不是粘性,是'值得'的叙事。"
    emotion: "作为投资者看到pricing power;作为母亲感到不安——女儿的创造力全依赖一家公司"
    report_link: "AAPL Complete Ch6 护城河侵蚀"
    hofstadter: "重分配'生态系统'从'商业模式'到'童年基础设施'"

  lunch_amazon_packages:
    time: "12:30 PM"
    location: "家门口, Park Slope"
    company: AMZN
    scene: |
      午休回家吃饭(公司在Downtown Brooklyn,走12分钟)。门口三个Amazon包裹。
      David买的无线鼠标。给Mia买的冬靴(商场试了,回来Amazon下单便宜$30)。
      第三个——David买的'厨房收纳神器',TikTok上看起来很厉害,到手就是个塑料架子。
      她叹了口气。每月Prime消费$400-600。
    insight_bridge: |
      Mia学校头天通知pajama day,晚上8:30在Amazon找到Bluey睡衣,Prime次日7:00到。
      你告诉我哪个本地商店晚上8:30有Bluey睡衣?
      Prime锁定不是某一个功能不可替代,是渗透进生活每个缝隙。
      每一个'我需要东西'的瞬间,第一反应是打开Amazon app。习惯回路锁定 > 合同锁定。
    china_bridge: "拼多多的'仅退款'从完全不同角度理解消费者锁定。Amazon向上兼容(越有钱用越多),拼多多向下兼容(越在意价格越离不开)。"
    emotion: "convenience的guilt——试过支持本地商店,每次都输给convenience"
    report_link: "AMZN 初稿"
    hofstadter: "重分配'习惯'从'偏好'到'基础设施依赖'"

  evening_meta_scrolling:
    time: "9:45 PM"
    location: "卧室,床头"
    company: META
    scene: |
      两个孩子睡了。David在客厅看球赛。她靠在床头打开Instagram。
      每天15-20分钟无脑刷屏是她的decompression time。
      上周在Zappos搜了Sorel冬靴,今天Instagram推了三条冬靴广告——
      不是Sorel,是一个没听过的品牌,比Sorel低40%,评论区全是真人视频。她点进去看了。
      然后切WhatsApp。妈妈语音:"晓薇,周三带啥给Emily?上次红豆糕她说好吃。"
    insight_bridge: |
      Zappos cookie/SDK → Meta cross-app tracking → 精准竞品投放。
      不是巧合,是$130B广告机器的日常操作。
      Instagram = Meta赚钱引擎。WhatsApp = 新兴市场护城河。
      她一个人同时验证了两个论点。Ackman $17.6B重仓——她不完全认同(Threads的AI搜索持怀疑),但理解核心逻辑。
    china_bridge: "微信把IG+WhatsApp+Amazon+PayPal全做了,但中国用户没有选择。Meta的可怕在于'有选择的市场实现了没选择的效果'。"
    emotion: "明知自己是产品,还是停不下来。9:45PM——孩子睡后是注意力最脆弱的时刻"
    report_link: "META Complete Ch8 广告飞轮"
    hofstadter: "重分配'社交媒体'从'选择性消费'到'数据-注意力交换'"

  office_google_search:
    time: "3:20 PM"
    location: "办公室, Downtown Brooklyn"
    company: GOOGL
    scene: |
      Emily打电话说科学课要做光合作用poster。"妈妈,化学方程式是什么?"
      Google搜'光合作用化学方程式'——AI Overview直接给出6CO2+6H2O→C6H12O6+6O2。
      Emily不需要点进任何网页。
      搜'best winter boots for kids NYC'——AI Overview给了总结,她看完就够了。
      那些买了关键词广告的商家,付了钱没得到点击。
    insight_bridge: |
      Google正在吃掉自己的广告库存。每个被AI Overview回答的问题=一次没发生的点击=一条没展示的广告。
      五位传奇同时押注——巴菲特/段永平/李录/Tepper/Druckenmiller——逻辑是AI时代的'分发权'更强。
      但变现模式需要重新发明。
    china_bridge: "百度AI搜索落后一年。但中国用户已习惯在小红书/抖音搜消费决策。Google在中国的竞争对手不是百度,是社交平台。"
    emotion: "我女儿永远不会学会'在10个结果里判断哪个可信'这项技能。这是进步还是退步?"
    report_link: "GOOGL Complete Ch10 AI搜索"
    hofstadter: "重分配'搜索'从'信息获取'到'答案垄断'"

  uber_tesla:
    time: "周六 10:00 AM"
    location: "Atlantic Avenue → Brooklyn Museum"
    company: TSLA
    scene: |
      带Mia去Brooklyn Museum。Uber来了一辆白色Model 3。
      司机巴基斯坦大叔:"This car is nice, right? I saved $400 a month on gas."
      Mia:"妈妈,这个车没有按钮!"
      Park Slope最常见的车是Subaru Outback和Toyota RAV4。
      Tesla越来越少——不是因为不好,是因为在progressive社区开Tesla有微妙的社交成本。
      邻居Jason把Model Y卖了换Rivian,说"I just couldn't anymore"。
    insight_bridge: |
      两个完全不同的消费者画像：Brooklyn中产把Tesla当身份表达,Uber司机把Tesla当生产工具。
      最近十次Uber有四次是Tesla。司机的计算跟品牌无关。
      Cathie Wood减持——但品牌损伤可能是NYC/SF局部现象,全国层面不同。
    china_bridge: "比亚迪不靠品牌溢价,靠成本碾压。中国消费者不需要克服'政治不正确'。这种简单的经济决策可能才是EV终局。"
    emotion: "复杂——理解邻居的选择,但知道Uber司机的计算才是大多数"
    report_link: "TSLA Complete Ch15 品牌护城河"
    hofstadter: "重分配'品牌忠诚'从'偏好'到'身份政治'"

  lunch_chipotle:
    time: "周三 12:15 PM"
    location: "Court Street Chipotle"
    company: CMG
    scene: |
      跟同事Alex点Burrito Bowl。$17.25。
      鸡肉比上个月少了——没量过,但调试bug的职业病让她确信rice-to-protein比例变了。
      回去查Reddit r/Chipotle,果然一堆人抱怨'portions are getting smaller'。
      Emily上周说想吃Chipotle不想吃外婆炒饭。妈妈伤心了整个下午。
    insight_bridge: |
      Same CEO, two fates。Chipotle单SKU模式,吞吐优化空间有限但执行简单。
      Starbucks SKU爆炸+冷饮占比+mobile order冲突——完全不同的系统。
      同一个人能不能在不同tech stack复制成功?程序员直觉:换了stack,过去的经验可能是负资产。
    china_bridge: "$17一个碗在中国能吃三顿好的。不是口味问题,是价格锚定。中国消费者的'一顿饭应该花多少钱'的心理账户跟美国完全不同。"
    emotion: "Emily选Chipotle不选外婆炒饭让她心里复杂——文化认同的微妙松动"
    report_link: "CMG Complete + SBUX Complete"
    hofstadter: "重分配'CEO能力'从'个人才华'到'系统兼容性'"

  weekend_costco:
    time: "周六 2:00 PM"
    location: "Long Island City Costco"
    company: COST
    scene: |
      开David的二手Civic带妈妈去Costco。妈妈的购物车：
      50磅大米($25,比法拉盛超市便宜$3)、海苔、核桃、鸡腿、Kirkland维生素D。$180。
      "妈,会员费多少?"
      "$65。你爸算过,光大米一年就省回来了。"
      她爸三年前过世了。语气很平淡,像在陈述数据点。
    insight_bridge: |
      93%续费率。$65不是决策,是基础设施——跟水电费一样不需要想。
      这种'不需要想'就是最强定价权。涨到$130她妈会皱眉,但会续费。
      排队时:前面印度家庭一整车,旁边年轻白人couple只买La Croix和有机牛肉。
      Costco的天才:对所有demographic有效——不是因为便宜,是因为让你觉得'聪明'。
    china_bridge: "山姆在中国复制了核心逻辑——会员费=信任契约。但拼多多和直播带货提供了另一种'聪明感':不是量大省钱,是'抢到别人抢不到的deal'。"
    emotion: "妈妈说到爸爸时的平淡——这种对金钱的精确态度是遗传的"
    report_link: "COST Complete Ch5 会员经济学"
    hofstadter: "重分配'会员费'从'成本'到'基础设施'"

  dinner_party_nvidia:
    time: "周四 8:30 PM"
    location: "客厅"
    company: NVDA
    scene: |
      David前同事Tony来吃饭,现在AI startup做CTO,刚拿Series B。
      "We just spent $2M on H100s. Three years ago this was our entire Series A."
      她问:"如果Jensen明天把H200砍价30%,你那$2M怎么办?"
      Tony笑:"Doesn't matter — demand is so insane, idle capacity can rent on CoreWeave and break even."
      Mia跑过来:"妈妈Roblox又卡了!" 检查——WiFi没问题,Roblox服务器端。
      Roblox跑在AWS上,AWS用NVIDIA GPU。六岁女儿以$4.99 Robux礼品卡的形式消费NVIDIA算力。
    insight_bridge: |
      '史上最贵的周期股'——估值隐含AI基建需求持续指数增长。
      但她见过太多这种曲线:2000 Cisco,2007房地产。
      每次都说'this time is different',每次都对了一半:技术是真的,但估值把十年压缩进现在。
    china_bridge: "中国公司被禁止购买高端NVIDIA GPU,需求导流到华为昇腾。最大长期风险不是技术竞争,是政策强制分流。"
    emotion: "Tony的兴奋vs她的怀疑——两个程序员,两种AI判断"
    report_link: "NVDA Complete Ch71 史上最贵的周期股"
    hofstadter: "重分配'AI基建'从'永续平台投资'到'CapEx周期'"

  vacation_planning_hotels:
    time: "感恩节前周五晚"
    location: "客厅沙发"
    company: [HLT, IHG]
    scene: |
      打开Hilton Honors app。287,000积分。
      Orlando Hampton Inn 40,000/晚×4=160,000。San Diego 48,000/晚。Orlando赢了。
      IHG app对比:Holiday Inn Express便宜15%,但她只有23,000 IHG积分——不够。
      决定因素不是目的地,是哪个城市的酒店能用积分。
    insight_bridge: |
      积分锁定的本质:不是Hilton更好住,是三年积累的287K点只能在Hilton花。
      心理账户里这些积分是'免费的'(信用卡消费积的),不愿'浪费'去住别的品牌。
      Ackman赚248%退出。报告里让她印象深刻的是:Hilton本质是特许经营公司不是酒店公司。
      每间房是别人的资产、别人的员工——Hilton只收品牌费。跟McDonald's一样:资产最轻,品牌就是一切。
    china_bridge: "华住加盟比例>90%。但中国酒店品牌差异化弱——消费者选汉庭还是如家看谁便宜$3。积分经济在中国远没有美国成熟。"
    emotion: "积分决定了家庭旅行目的地——这个认知让她苦笑"
    report_link: "HLT Complete + IHG Complete"
    hofstadter: "重分配'积分'从'奖励'到'沉没成本锁定'"

  daughters_roblox:
    time: "周日 4:00 PM"
    location: "客厅地毯"
    company: RBLX
    scene: |
      Emily和Mia并排抱iPad玩Roblox。Emily在Adopt Me卖虚拟宠物,Mia在Brookhaven装修虚拟房子。
      "妈妈我需要450 Robux买Legendary Pet!"
      "上周不是刚充了$9.99?"
      "花完了……"
      两个孩子一年$300-360花在虚拟物品上。比实体玩具还多。
    insight_bridge: |
      开发者只拿约25%的Robux消费——Emily花$1,游戏开发者(可能18岁大学生)拿$0.25。
      SBC高到让实际亏损远超GAAP。这就是硅谷会计魔术:
      '投资增长' = 稀释股东支付员工工资。她在Google时RSU就是薪资核心,懂这个机制。
      Emily喊:"我卖了一个Neon Dragon! 赚了5000 Robux!"
      九岁孩子在学供需、稀缺性定价、流动性——通过游戏。教育还是上瘾?不确定。
    china_bridge: "中国未成年人游戏限制(每周三小时)让Roblox模式跑不通。保护了孩子时间,但让中国公司失去'从6岁培养平台忠诚'的渠道。"
    emotion: "程序员理解SBC的猫腻,母亲担心孩子上瘾——两种忧虑同时存在"
    report_link: "RBLX Complete Ch8 SBC"
    hofstadter: "重分配'游戏消费'从'娱乐'到'平台经济学实验'"

  david_copilot_rant:
    time: "周二晚饭桌上"
    location: "餐厅"
    company: MSFT
    scene: |
      David抱怨了十分钟Copilot。
      "It summarized a 30-page report. Impressed for five seconds. Then realized it missed
      the two most important caveats in the footnotes. If I'd sent that summary, I'd be fired."
      "So you still read the whole report?"
      "Of course. I just also wasted ten minutes trying Copilot first."
    insight_bridge: |
      $30/user/月。David公司300人全开了。实际使用:
      30%写邮件(有用)、20%会议纪要(勉强)、10%数据分析(常出错)、40%没打开。
      她用GitHub Copilot写代码——真好用,提高20-30%。但代码有编译器检测错误。
      商业文档没有编译器。微妙的语气错误、遗漏背景——只有人能检测。
      AI投资回报期可能比任何人愿意承认的都长。但没人敢停,因为'落后'比'浪费'更可怕。军备竞赛逻辑。
    china_bridge: "中国的AI办公更碎片化——钉钉/飞书/企微各有AI,没有Copilot那样的深度整合。但中国用户对'凑合能用'容忍度更高,ROI门槛更低。"
    emotion: "程序员能区分'代码Copilot'vs'商务Copilot'的质量差异——大多数投资者不能"
    report_link: "MSFT Complete Ch13 CapEx传导"
    hofstadter: "重分配'AI生产力'从'技术进步'到'军备竞赛消耗'"

  night_reddit:
    time: "10:30 PM"
    location: "床上,戴AirPods"
    company: RDDT
    scene: |
      David睡了。她刷Reddit。
      r/parenting: "My 6yo told me she hates me because I took away her iPad. Am I terrible?"
      第一条评论已经1.2K赞:"Every parent of this generation is fighting the same battle."
      她差点评论,忍住了——明天还要上班。
      切到r/investing,一个帖子"NVDA is a forever hold",下面最高赞:
      "你在2000年也是这么说Cisco的。"
    insight_bridge: |
      她每天30分钟Reddit。DAU增长40%+但ARPU只有$1.2。120x PE赌广告变现+数据授权。
      作为用户深度依赖(r/parenting是她的育儿support group,r/investing是她的同行检验)。
      作为投资者看不到盈利路径。这种分裂很常见——但r/parenting那种真实的情感连接,
      在其他平台上不存在。这可能是Reddit的真正护城河:匿名带来的诚实。
    china_bridge: "Reddit ≈ 知乎+贴吧。但中国没有平台同时拥有'专业讨论'和'匿名情感支持'。知乎太装,贴吧太乱。"
    emotion: "疲惫但放不下手机。r/parenting让她觉得不是一个人在战斗"
    report_link: "RDDT Complete Ch12 变现"
    hofstadter: "重分配'社区'从'内容消费'到'匿名情感基础设施'"

  pltr_dinner_conversation:
    time: "周五 7:30 PM"
    location: "West Village小餐馆"
    company: PLTR
    scene: |
      跟前同事Jennifer吃饭。她去年跳到了Palantir。
      "我们刚签了一个五角大楼的新合同。你知道Gotham能做什么吗?
      它能在24小时内把一个恐怖组织的全部关系网映射出来。"
      林晓薇搅着意面:"这让你不uncomfortable吗?"
      Jennifer顿了一下:"Honestly? 最开始是的。但你知道那些数据如果不被组织起来会怎样?
      9/11之后FBI有情报但没连起来。我们做的就是连接。"
    insight_bridge: |
      200x PE。Burry做空$9亿,Cathie Wood买入,Englander翻倍。
      三种完全不同的判断:Burry看到泡沫,Wood看到未来,Englander看到momentum。
      Jennifer的视角加了第四层:产品确实做了别人做不到的事。
      但政府合同的续约周期=选举周期。一个CEO可以在一条推特里毁掉一个政府合同。这是PLTR最大的非系统性风险。
    china_bridge: "中国有自己的Palantir——但名字不方便说。数据监控在中美都是巨大的生意,只是中国不需要'说服政府买',因为政府本来就在建。"
    emotion: "两个程序员关于技术伦理的微妙分歧——不是非黑即白,是灰色地带的不适感"
    report_link: "PLTR 相关分析"
    hofstadter: "重分配'国防科技'从'安全工具'到'选举周期赌注'"

  arm_tech_circles:
    time: "周三 lunch, 公司休息室"
    location: "Downtown Brooklyn fintech办公室"
    company: ARM
    scene: |
      跟CTO Marcus聊天。他之前在高通做了8年。
      "RISC-V is eating ARM's lunch in IoT. Our new project, we went RISC-V.
      Not because it's better — because it's free. And 'free' is really hard to compete with."
      她理解。在Google时用开源框架替换过商业方案——一旦开源达到'够用'阈值,付费版就很难defend定价。
      ARM的IP授权模式 = 收费公路。RISC-V = 刚建好的免费高速。
      当免费高速足够宽、足够快,谁还走收费公路?
    insight_bridge: |
      Druckenmiller加仓725%后一个季度全部清仓。不是获利了结,是论文改变。
      最伟大的宏观交易员在90天内看到了什么?
      她的理解:RISC-V的CDS(Cost-Defense-Substitution)定价权风险不是线性的。
      一旦过了'够用'拐点,ARM的IP收入增长会突然减速——不是崩盘,但增长叙事会断裂。
    china_bridge: "中国公司大规模拥抱RISC-V——部分是技术选择,部分是政策驱动(不想依赖英国公司)。这加速了'够用拐点'的到来。"
    emotion: "程序员的第一手理解:开源vs付费的竞争,她见过太多次了"
    report_link: "ARM v2.0 Complete RISC-V CDS分析"
    hofstadter: "重分配'IP授权'从'护城河'到'收费公路面对免费高速'"

  intel_nostalgia:
    time: "某天晚上,看到Emily的旧笔记本"
    location: "家"
    company: INTC
    scene: |
      整理柜子翻出她大学时的ThinkPad。背面贴着Intel Inside的贴纸。
      她第一次写Java是在这台电脑上。2004年,Intel是绝对的王者。
      现在Intel股价从高点跌了70%以上,但最近又涨了160%——赌Pat Gelsinger(已离职)的18A工艺。
      她见过太多tech turnaround的故事。大部分结局是:宣传很大声,执行很安静,最后quietly放弃。
      但Intel有一个东西其他turnaround没有:美国政府不能让唯一的本土先进制造消失。
      这不是商业逻辑,是地缘政治逻辑。
    insight_bridge: |
      我们说-72%,市场说+161%。到底谁在做梦?
      条件性判断:如果18A按时交付且良率>80%,Intel重新进入代工竞争。
      但'按时交付且良率>80%'这个前提,在半导体历史上的实现概率不到30%。
    china_bridge: "中芯国际是中国的Intel turnaround故事——同样靠政策支持,同样技术差距巨大,同样'太大不能倒'。"
    emotion: "nostalgia + skepticism的混合——她的第一台电脑代表了Intel最好的时代"
    report_link: "INTC Complete 条件性分析"
    hofstadter: "重分配'企业转型'从'商业决策'到'地缘政治赌注'"
