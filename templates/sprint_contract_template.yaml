# Sprint Contract Template v1.0
# Planner在每Phase开始前产出，Generator和Evaluator都读取

phase: "Phase N - {Phase名称}"
date: "YYYY-MM-DD"
ticker: "{TICKER}"
industry: "{INDUSTRY}"

# ── 本阶段目标 ──
objective: |
  本阶段要回答的核心问题（1-2句话）

# ── P0-P3识别结果摘要（Phase 0后填入，后续Phase引用）──
identification:
  p0_archetype: ""       # 原型：软件平台/网络基础设施/制度垄断/...
  p1_pricing_formula: "" # 行业定价公式：NRR/Rule of 40/fee stream/...
  p2_asset_identity: ""  # 资产身份：高增长/复利/债券替代/周期/...
  p3_time_frame: ""      # 时间框架：2季度/1-2年/3-5年/永续
  complexity_modifiers: [] # 触发的复杂度修正器：M0/M1/...

# ── Generator交付物 ──
generator_deliverables:
  - deliverable: "具体产出物名称"
    file_path: "staging/{TICKER}_P{N}_xxx.md"
    char_budget: 0        # 字符预算（期望产出量）
    char_hard_floor: 15000  # 字符硬底线：低于此值staging文件无法写入（PreToolUse hook强制）
    char_budget_enforcement: "hard"  # hard=低于50%即REJECT，soft=仅WARNING
    density_floor: 5.0    # 因果密度底线（/万字）— 仅在字符≥100K时有效
    dm_density_floor: 0.8 # DM密度底线（/千字，后台版本）— 仅在字符≥100K时有效

# ── 强制分析项（根据P0-P3动态生成）──
mandatory_analysis:
  # 所有公司都要做的
  - item: "增长归因分解（量×价×混合×并购）"
    trigger: "universal"
    verification: "搜索'量×价'或'volume×price'或'归因'"

  - item: "预期差显式分析（市场在定价X vs 我们认为Y）"
    trigger: "universal"
    verification: "搜索'市场在定价'或'预期差'"

  - item: "认知边界评估（黑箱比例/可推演度）"
    trigger: "universal"
    verification: "搜索'黑箱'或'认知边界'或'可推演度'"

  # 条件触发的
  - item: "定价权分层（高端vs低端剪刀差）"
    trigger: "多层客户结构"
    verification: "搜索'高端/低端'或'大客户/SMB'或'剪刀差'"

  - item: "NRR分层（大客户/中型/SMB）"
    trigger: "SaaS公司"
    verification: "搜索'NRR'+'大客户'或'segment'"

  - item: "三PE并列（GAAP/Owner/Core）"
    trigger: "SBC/Rev>5%"
    verification: "搜索'Owner PE'或'Core PE'"

  - item: "分部拆解+分部估值"
    trigger: "M0混合体"
    verification: "搜索'分部'或'segment'"

  - item: "巨头估值框架（什么条件下便宜/贵）"
    trigger: "市值>$500B"
    verification: "搜索'什么条件下'或'便宜/贵'"

  - item: "穿周期OE + 周期位置识别"
    trigger: "周期性行业"
    verification: "搜索'穿周期'或'OE'或'周期位置'"

  - item: "飞轮验证（多边网络/自加速/数据复用三判别）"
    trigger: "公司声称有飞轮效应"
    verification: "搜索'飞轮'+'验证'或'网络效应'"

  - item: "每Phase重新获取价格快照"
    trigger: "事件驱动分析"
    verification: "Phase开头有当日价格"

  - item: "First-Principles逼问（Top 3核心变量多轮因果链追溯）"
    trigger: "universal"
    variables_to_interrogate:
      - "核心收入驱动（Chain 1上游追溯）"
      - "最大风险变量（Chain 2颠覆扫描）"
      - "TAM假设（Chain 5框架构建）"
    verification: "lens_seed_registry中type=first_principles的seeds≥3"

# ── Evaluator评判标准 ──
evaluator_criteria:
  - criterion: "E12: 产出体量审计（第一项执行）"
    weight: 0.30
    threshold: 7  # 实际/目标≥80%
    fatal_if_below: 5  # 实际/目标<50% = 强制REJECT
    note: "密度指标在字符<100K时自动失效"

  - criterion: "E1: Sprint Contract强制项覆盖"
    weight: 0.15
    threshold: 10  # 10/10 = 全覆盖
    fatal_if_below: 7

  - criterion: "E2: 证据链完整性（3个抽检论点）"
    weight: 0.20
    threshold: 7
    fatal_if_below: 5

  - criterion: "E3: 断言/论证比例"
    weight: 0.10
    threshold: 7  # 断言<30%
    fatal_if_below: 4

  - criterion: "E4: CI方向分布"
    weight: 0.15
    threshold: 7  # ≥2偏空
    fatal_if_below: 5  # <2偏空 = 强制REJECT

  - criterion: "E5: 估值一致性"
    weight: 0.15
    threshold: 10  # 必须完全一致
    fatal_if_below: 8

  - criterion: "E6: 预期差显式覆盖"
    weight: 0.10
    threshold: 7
    fatal_if_below: 4

  - criterion: "E7: 增长归因分解"
    weight: 0.05
    threshold: 7
    fatal_if_below: 3

  - criterion: "E8: 定价权分层"
    weight: 0.05
    threshold: 7
    fatal_if_below: 3

  - criterion: "E9: 认知边界"
    weight: 0.03
    threshold: 6
    fatal_if_below: 0  # WARNING only

  - criterion: "E10: Lens Seeds记录"
    weight: 0.02
    threshold: 6
    fatal_if_below: 0  # WARNING only

# ── 通过条件 ──
pass_conditions:
  - "全部deliverables已提交"
  - "Evaluator加权评分≥7.0/10"
  - "无fatal issues（任何E项低于fatal_if_below）"
  - "Sprint Contract mandatory_analysis全部覆盖"

# ── 失败处理 ──
on_fail:
  minor: "Generator修正特定section，Evaluator重新评估（同Phase第2轮）"
  major: "回到Planner，重新scope本Phase目标和deliverables"
  fatal: "升级到用户决策"

# ── 成本预算 ──
cost_budget:
  max_iterations: 2       # 每Phase最多2轮Generator-Evaluator循环
  meaningful_angle_required: true  # 第2轮必须引入新角度（否则不执行）

# ── 动态Agent加载（Planner填写）──
dynamic_agents:
  loaded: []
  # - agent: "pricing-power-stratifier"
  #   reason: "多层客户结构，需要剪刀差分析"
  max_concurrent: 3

# ── Lens Seeds状态（Phase 1+更新）──
lens_seeds_status:
  total_seeds: 0
  mature_seeds: 0
  top_candidates: []
