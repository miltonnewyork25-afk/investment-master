      why_noise: "受节假日/天气/事件驱动,看季度趋势而非短期波动"
    - signal: "Sell-side目标价调整"
      why_noise: "共识PT $343几乎等于股价 — 卖方普遍不做NUG单因子定价分析,目标价缺乏区分度"
    - signal: "单次品牌发布/退出消息"
      why_noise: "品牌熵变化是缓慢过程 — 单次增减不改变结构性趋势,看年度品牌数量净变化"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: HLT
      similarity: "同为asset-light酒店特许经营巨头, 直接竞争, 品牌/会员/管线全维度对标"
      key_difference: "HLT NUG 6.7% > MAR 4.3% → P/E 49.8x vs 35.4x | HLT 26品牌聚焦度更高(ACSI 80 > MAR 78) | MAR规模更大但增速更慢"

    - ticker: IHG
      similarity: "酒店三巨头之一, asset-light模型, 忠诚度飞轮, 全球运营"
      key_difference: "IHG ROIC 22.6%(三巨头最高)但P/E 27.7x(最低) → 效率最优但增速折价 | IHG 16品牌更聚焦, A-Score 6.78 > MAR 6.40"

    - ticker: WH
      similarity: "酒店特许经营, 偏经济型/中端定位"
      key_difference: "WH纯特许经营(无管理合同) → 更纯的asset-light | MAR品牌矩阵更宽(luxury→economy全覆盖)"

  comparative:
    - dimension: "规模(房间数)"
      position: "MAR (1.78M) > HLT (1.3M) > IHG (1.01M) > WH (~0.9M)"
      reasoning: "MAR通过SPG/Delta/LHR三次大收购建立规模优势,但规模未转化为P/E溢价"

    - dimension: "增长质量(NUG)"
      position: "HLT (6.7%) > IHG (~4.7%) > MAR (4.3%)"
      reasoning: "NUG是P/E单因子定价锚 — HLT pipeline占比55% > MAR 38%,前瞻增长优势明显"

    - dimension: "运营效率(ROIC)"
      position: "IHG (22.6%) > MAR (15.6%) > HLT (11.3%)"
      reasoning: "ROIC与P/E呈负相关——市场不为效率支付溢价,只为增速支付溢价"

    - dimension: "护城河质量(A-Score)"
      position: "HLT (~6.85) > IHG (6.78) > MAR (6.40)"
      reasoning: "品类之王≠护城河之王 — 品牌数量多导致品牌熵高,拉低品牌力和运营效率评分"

    - dimension: "估值吸引力(P/E)"
      position: "IHG (27.7x, 偏低估) > MAR (35.4x, 合理) > HLT (49.8x, 增速溢价)"
      reasoning: "酒店三巨头P/E阶梯精确映射NUG差距 — 非定价错误"

  industry_position:
    quadrant: "最大规模 × 中等增速 × 中等估值"
    archetype: "品类之王夹心层 — 规模第一但增速不第一,被夹在增速溢价(HLT)和效率折价(IHG)之间"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含CAGR 7.0%(WACC 8.25%) → 翻译为NUG 4.5-5%+RevPAR 2.5-3%+margin扩张 → RevPAR和margin假设偏乐观"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1~RT-7净调整+13.4pp(单向向上) | 消费品系统性悲观偏差+10~15pp | 硬性修正+6.0pp取保守端"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "温水煮青蛙: NUG逐年-0.3pp+ACSI-0.5pt/年+杠杆+0.11x/年 → 5年后KS-01(NUG<3%)和KS-02(杠杆>4.0x)同时触发"

  novel_patterns:
    - name: "夹心层估值物理学(规模溢价递减+NUG传导系数)"
      description: "规模弹性在~500K rooms后趋零+NUG-P/E传导系数~6x → 品类之王规模#1但估值#2因增速#3"
      transferable_to: ["Intel(制造规模vs设计增速)", "Toyota(产量vs EV转型速度)", "Walmart(收入规模vs会员增速)", "Samsung(出货量vs利润率增速)"]

    - name: "品牌熵量化(信息论方法)"
      description: "品牌数量取对数加权定位重叠度→品牌熵>2.5触发护城河质量警告→品类之王≠护城河之王"
      transferable_to: ["所有多品牌消费品公司", "品牌收购型集团(LVMH/Tapestry/PVH)"]

    - name: "忠诚度金融化三阶段模型"
      description: "积分从成本中心→利润来源→准货币 | 金融产品收入占比>15%时估值框架需重定义"
      transferable_to: ["航空(DAL/UAL)", "零售(COST/AMZN)", "餐饮(SBUX储值卡)"]

    - name: "双层SOTP(收入流质量分层估值)"
      description: "特许经营费(18-22x)>管理费(14-17x)>信用卡(12-15x)>O&L(8-10x) — 同一公司不同收入流给不同倍数"
      transferable_to: ["所有asset-light特许经营公司(QSR/酒店/健身)", "多引擎收入结构公司"]

  framework_contributions:
    moat_insights:
      - insight: "品类之王(规模#1)≠护城河之王(A-Score最高) — 品牌熵超过阈值后护城河被侵蚀"
        implication: "多品牌公司护城河评估应加入品牌熵计算,不能默认'品牌多=护城河宽'"
      - insight: "规模溢价递减律 — asset-light模型中规模的边际估值贡献在~500K units后趋零"
        implication: "评估规模驱动的护城河时,需计算规模弹性而非绝对规模 — 超大规模可能是估值中性的"

    valuation_insights:
      - insight: "NUG是酒店行业P/E的单因子定价锚(传导系数~6x/pp),ROIC不是有效定价因子"
        implication: "酒店行业估值比较应用NUG-adjusted P/E而非raw P/E — 类似PEG对PE的修正"
      - insight: "双层SOTP按收入流质量分层给倍数 — 特许经营费值18-22x但IMF只值10-14x"
        implication: "asset-light公司不应用单一倍数估值 — IMF占比越高,周期风险折价越大"

    screening_insights:
      - insight: "规模#1+NUG<行业中位数='夹心层陷阱' — 规模优势无法转化为估值溢价"
        implication: "选股筛选应加入'规模弹性过滤器': 规模弹性<0.5x且增长传导系数>5x→标记为夹心层"
      - insight: "金融产品收入占比年增>2pp = 金融化转型信号 → 估值框架可能需要重定义"
        implication: "对含大规模忠诚度计划的公司,增加金融化占比追踪 — 突破15%触发审查"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "规模最大时立刻追问增速排名"
      trigger: "行业规模#1的公司,P/E不是#1"
      origin: "MAR规模1.78M rooms(#1)但P/E 35.4x(#2) — 因为NUG 4.3%(#3)"
      generalization: "在任何成熟行业中,规模第一+增速不第一=夹心层。市场为增量支付溢价,不为存量支付溢价"

    - habit: "多品牌时计算品牌熵而非数品牌数量"
      trigger: "公司品牌数>15且持续扩张"
      origin: "MAR 31品牌熵2.8 vs IHG 16品牌熵2.1 → A-Score反转(品类之王≠护城河之王)"
      generalization: "品牌数量与护城河质量的关系是非线性的 — 存在一个阈值(品牌熵~2.5)之后开始侵蚀"

    - habit: "金融产品收入占比变化速度比绝对值更重要"
      trigger: "忠诚度/联名信用卡收入增速显著快于核心业务"
      origin: "MAR信用卡费+35%(2026E) vs RevPAR +2% → 静默的商业模式迁移"
      generalization: "当边际增长引擎从核心业务转向金融产品,公司的估值可比对象集合需要重新定义"

    - habit: "消费品报告完成Phase 1-3后,检查负面结论占比"
      trigger: "消费品Tier 3报告,负面占比>65%"
      origin: "MAR/RCL/SBUX三份报告都出现+10~15pp系统性悲观偏差 — 品牌质量担忧过度外推"
      generalization: "消费品分析中,品质指标(NPS/ACSI)的情绪传染效应需要量化校准,不能让单一差指标定义整体叙事"

  quality_feedback:
    strengths:
      - "DM密度1.76/千字 — 超过1.5/千字门控,数据锚定扎实(625个DM锚点)"
      - "估值离散度≤10%(5种方法聚敛于$315-$335) — 方法间高度一致,结论可信度高"
      - "CI-01夹心层物理学(8/10) — NUG-P/E传导系数6x的精确量化,可迁移4+行业"
      - "红队系统性(RT-1~RT-7 +13.4pp) — 识别出消费品系统性悲观偏差,与RCL/SBUX交叉验证"
    weaknesses:
      - "Bonvoy会员活跃率数据缺失 — 271M会员的真实质量无法精确评估,估值范围过宽($16.5B-$38B)"
      - "单品牌RevPAR不可得 — 品牌间蚕食只能定性判断,无法精确量化"
      - "Phase 1-3悲观偏差+13.4pp — 需要框架级修复(CQ提问方式+HLT对标基准选择)"

  hypothesis_tested:
    confirmed:
      - hypothesis: "消费品Tier 3存在系统性悲观偏差+10~15pp"
        evidence: "MAR +13.4pp = RCL +12pp中值 = SBUX +13pp — 三份报告独立确认"
        confidence_after: "高(三重验证)"
      - hypothesis: "Reverse DCF P1前置有效防止结论先行(铁律O)"
        evidence: "Ch15 Reverse DCF翻译出市场隐含CAGR 7.0%后,确认市场定价偏乐观但非不合理 → 防止了'品类之王被低估'的叙事先行"
        confidence_after: "高(持续验证)"

    extended:
      - hypothesis: "品质最高≠回报最高(CME垄断三角)"
        extension: "MAR将此扩展为'规模最大≠估值最高' — 从'品质-回报'脱钩扩展到'规模-估值'脱钩"

    refuted:
      - hypothesis: "ROIC是酒店行业有效的估值定价因子"
        evidence: "ROIC与P/E在酒店三巨头中呈负相关(IHG 22.6%/27.7x → MAR 15.6%/35.4x → HLT 11.3%/49.8x)"
        lesson: "酒店行业市场定价NUG(增速)而非ROIC(效率) — 不同行业的有效定价因子不同,不能套用通用框架"

  limitations:
    - "Bonvoy会员活跃率未披露 → 271M会员的真实价值范围过宽(2x)"
    - "单品牌RevPAR不可得 → 品牌间蚕食只能定性(品牌熵是间接指标)"
    - "NUG-P/E传导系数基于仅4家大型asset-light酒店公司 → 样本量有限,极端NUG值处线性假设可能失效"
    - "信用卡费2026E +35%的持续性无法确认 → 可能是合约一次性调整而非持续加速"
    - "印度/东南亚pipeline转化率高度不确定 → NUG加速(Path A)的概率赋值30%含较大主观性"
