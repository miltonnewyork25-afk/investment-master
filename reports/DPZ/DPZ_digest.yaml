# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含终端增长3.3%→定价comp减速+回购贡献2pp/yr→整体偏保守"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "7问红队+悲观偏差校准(历史均值+8pp)→七问净-6.7pp+偏差+8pp=总+1.3pp→Phase 3结论方向正确"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "ABS到期再融资时间表→2029年大批到期→如果利率>5.5%→利息跳升→温水煮青蛙式EPS侵蚀"

  novel_patterns:
    - name: "蚕食系数模型 (Cannibalization Coefficient Model)"
      description: "CC = 新店导致老店收入损失 / 新店总收入。区分自取CC(~15%)和配送CC(~30%)的不对称性。包含临界点分析(35-40%)和距离摩擦函数(2英里悬崖)"
      transferable_to: ["SBUX密集化", "CMG扩张", "MCD自然密集", "所有Fortressing型连锁企业"]

    - name: "ROIC幻觉调整 (负权益公司)"
      description: "负权益公司的ROIC=杠杆放大幻觉。调整方法: IC + |负权益| 作为adjusted IC→重算ROIC→横向可比。DPZ 56.7%→14.5%"
      transferable_to: ["MCD", "SBUX", "YUM", "所有通过回购将equity压至负值的公司"]

    - name: "BME信念竞争估值框架"
      description: "当估值方法间分歧>30%时，将分歧定义为信念竞争(版税帝国vs杠杆比萨vs成熟窄护城河)→概率加权信念而非模型→投资机会在信念转换催化剂"
      transferable_to: ["多业务线控股公司", "SOTP vs DCF有巨大gap的公司"]

    - name: "ABS covenant双天花板分析"
      description: "区分leverage covenant(binding/紧)vs DSCR covenant(non-binding/宽)→精确定位哪个约束在实际限制公司行为→避免笼统的'高杠杆=高风险'判断"
      transferable_to: ["所有WBS/ABS融资公司", "杠杆收购后的公司"]

    - name: "特许经营PE折价5因子归因"
      description: "特许vs直营的PE差距可归因为: 增长光学+利润透明度+资本结构清洁度+增长期权+ROIC修正→结构性解释而非市场不理性"
      transferable_to: ["IHG/MAR等酒店特许经营", "YUM/QSR等QSR特许经营"]

  framework_contributions:
    moat_insights:
      - insight: "Supply Chain物理护城河被系统性低估: 22个面团工厂的复制壁垒($660M-$1.1B+3-5年)比品牌/数字化更持久"
        implication: "分析QSR/连锁企业时，物理基础设施(配送中心/中央厨房/ground lease)可能比品牌/技术更重要——因为更难复制"
      - insight: "A-Score 5.9(中等) vs SGI 7.7(专才)的gap: 专才不等于护城河强——DPZ是窄护城河+极致专注的组合"
        implication: "SGI高分可能意味着'定位独特'而非'壁垒高'→在估值时应区分专注度溢价和护城河溢价"

    valuation_insights:
      - insight: "ROIC幻觉: 负权益公司的报告ROIC全部虚高→必须调整后才能横向比较"
        implication: "选股筛选时如果用ROIC>30%过滤→会系统性选入高杠杆负权益公司→这是筛选框架的结构性偏差"
      - insight: "BME信念竞争: 估值巨大分歧不是模型误差而是认知分歧→投资机会在催化剂"
        implication: "当SOTP vs DCF差距>30%时，与其优化模型不如评估信念转换的催化剂概率"

    screening_insights:
      - insight: "特许经营公司的PE折价有结构性成因→不能简单用'低PE=便宜'筛选"
        implication: "QSR/酒店等特许经营行业筛选时，应用adjusted PE(扣除pass-through收入影响)而非GAAP PE"
      - insight: "ABS covenant headroom是杠杆公司的隐藏约束→影响回购/增长/资本配置的灵活性"
        implication: "选股时增加'covenant headroom'筛选: headroom<5%→标记为'灵活性受限'→期望回报应加covenant风险溢价"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "看到ROIC>30%时立刻检查equity正负"
      trigger: "ROIC异常高 + 负权益/高杠杆回购"
      origin: "DPZ 56.7% ROIC经调整后仅14.5% < CMG 18.9%→ROIC叙事完全逆转"
      generalization: "任何通过杠杆回购将equity压至负值的公司→报告ROIC都是幻觉→必须回到零权益重算"

    - habit: "分析连锁扩张时先算蚕食系数"
      trigger: "连锁企业门店加密/Fortressing/密集化策略"
      origin: "DPZ蚕食系数模型→自取CC 15% vs 配送CC 30%的不对称性→解释了Carryout comp持续优于Delivery"
      generalization: "蚕食系数因渠道/品类/距离不同而不同→不要用统一CC→分渠道估算→加权后判断"

    - habit: "估值方法间分歧>30%时，定义为信念竞争而非模型误差"
      trigger: "SOTP vs DCF或多方法间出现巨大分歧"
      origin: "DPZ SOTP $687(+69%) vs DCF $413(+1.6%)→差距是'DPZ是什么'的认知分歧"
      generalization: "大分歧时不要取均值→识别信念(版税/杠杆/成熟)→评估每个信念的概率→投资机会在信念转换催化剂"

    - habit: "精确区分哪个covenant是binding constraint"
      trigger: "分析高杠杆/ABS/WBS融资公司"
      origin: "DPZ leverage ratio 4.89x vs 5.0x(2.2% headroom, binding) vs DSCR 3.4x vs 1.75x(48.7%, non-binding)"
      generalization: "不要笼统说'杠杆高有风险'→找到binding covenant→测headroom→这才是真实约束→据此评估回购/资本配置/风险"

  quality_feedback:
    strengths:
      - "DM密度1.53/千字(合格以上)→520个DM锚点覆盖338K报告→数据锚定扎实"
      - "DPZ-CMG 9维度镜像+5因子PE归因→竞品分析不是列清单而是量化归因→冠军级分析"
      - "蚕食系数模型(CC)→原创可迁移框架→包含敏感性/跨公司/局限性→完整度高"
      - "BME信念竞争→将估值分歧从模型误差转化为认知分歧→高级估值方法论"
      - "红队7问+悲观偏差校准(基于4份历史报告实证)→非主观调整→|绝对值总效果|19.9pp通过有效性门控"
    weaknesses:
      - "报告框架版本v18.0(较旧)→未启用v19.x的部分门控(如因果密度脚本强制)"
      - "CQ-4最终置信度仅55%(5个CQ中最低)→相对于'极高重要性'研究投入不足"
      - "Supply Chain OPM未能独立验证(DPZ不披露segment margin)→核心护城河的利润率仍是黑箱"

  hypothesis_tested:
    confirmed:
      - hypothesis: "特许经营模式的PE折价可被结构性因子解释(非市场不理性)"
        evidence: "5因子(增长光学+利润透明+资本结构+增长期权+ROIC修正)合计~9x PE完全归因DPZ-CMG差距"
        confidence_after: "高(DPZ-CMG独立验证，可推广至所有特许vs直营对比)"

      - hypothesis: "Reverse DCF必须P1前置(铁律O)"
        evidence: "Ch12 Reverse DCF有效揭示市场隐含假设→防止了'DPZ被严重低估'的结论先行偏差"
        confidence_after: "高(连续确认)"

    extended:
      - hypothesis: "ROIC幻觉(SBUX/MCD已知)"
        extension: "DPZ将幻觉量化为56.7%→14.5%(4倍差距)→建立了可复用的调整方法论→推广至全部负权益QSR"

    refuted:
      - hypothesis: "SGI高分(专才)=应获PE溢价"
        evidence: "DPZ SGI 7.7但PE折价17%→SGI高分反映定位独特性而非护城河→专才不等于值钱"
        lesson: "SGI框架不能直接映射为PE溢价→需结合A-Score(护城河)才能判断估值→两者分离时说明市场在定价护城河而非定位"

  limitations:
    - "Cannibalization真实值依赖管理层声称(80%增量)的逆向验证→无独立一手数据源→CC 15-20%的估计精度有限"
    - "Supply Chain真实OPM是黑箱→DPZ不单独披露→所有SC利润分析基于估算"
    - "ABS covenant的精确定义需精读trustee report→10-K中的描述可能有EBITDA调整项差异"
    - "国际Master Franchisee的财务健康和unit economics依赖间接推断→DPC Dash(中国)是唯一公开数据源"
    - "BME信念概率(55%/25%/20%)含主观判断→无基准率校准"
