      why_alpha: "直接决定杠杆回购是否可能→影响EPS增长引擎的1.5pp/年→但大多数分析师只看GAAP杠杆不看covenant细节"
      current_reading: "4.89x vs 5.0x cap = 2.2% headroom (极紧)"
    - signal: "Carryout vs Delivery comp差异"
      why_alpha: "Carryout是Fortressing成功的最直接验证+渠道mix改善的lead indicator→但市场只看总comp"
      current_reading: "Carryout comp +5.8% vs Delivery comp +1.2% (FY2025Q4)→结构性渠道转移已启动"
    - signal: "SOTP隐含价值vs市场价的gap"
      why_alpha: "如果出现catalyst(activist/分拆)→$687 SOTP提供69%上行→但概率目前仅~20%"
      current_reading: "$687 SOTP vs $406.62市场价 = 69%隐含折价"

  confirmation_signals:
    - signal: "US同店销售增长(quarterly)"
      bullish_threshold: ">+3.5%(Fortressing+消费韧性确认)"
      bearish_threshold: "<+1.5%连续2Q(增长减速确认)"
    - signal: "国际门店净增数(quarterly)"
      bullish_threshold: ">275家/Q(年化1,100+，管理层指引上沿)"
      bearish_threshold: "<200家/Q(年化<800，国际增长失速)"
    - signal: "ABS refinancing公告/利率"
      bullish_threshold: "再融资利率<当前3.9%(降低利息负担)"
      bearish_threshold: "再融资利率>5.5%(利息跳升至$250M+)"

  noise_signals:
    - signal: "ROIC报告值波动"
      why_noise: "56.7%是杠杆放大幻觉→调整后14.5%才是真实信号→ROIC变动多反映回购节奏而非运营改善"
    - signal: "GLP-1相关新闻/减重药物渗透率"
      why_noise: "红队分析→GLP-1对Pizza的实际影响仅-2~-3%(非25%)→市场对此噪音过度反应"
    - signal: "内部人卖出"
      why_noise: "QSR行业管理层薪酬结构以股票为主→定期卖出是薪酬套现而非看空信号"

