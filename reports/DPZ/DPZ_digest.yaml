      key_difference: "CMG=直营模式(控制力+透明度→32x PE) vs DPZ=特许模式(轻资产+不透明→23x PE) | 9x PE差距可被5因子完全归因"

    - ticker: YUM
      similarity: "同为特许经营QSR，多品牌(KFC/Pizza Hut/Taco Bell)，高杠杆"
      key_difference: "YUM=多品牌分散(SGI ~4) vs DPZ=单品类专才(SGI 7.7) | YUM PE 28.6x反映多品类对冲价值"

  comparative:
    - dimension: "护城河深度(A-Score)"
