# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "全球第一咖啡品牌以78x P/E交易, 但RT-1/RT-7锁定OPM在13-14%使得$2B成本削减净贡献仅+45bps — 估值领先基本面改善约35%"
  rating: "审慎关注(偏中性)"
  fair_value: "$71.5(概率加权) / $87(目标价)"
  expected_return: "-8%~-15% (风险调整后)"

  key_arguments:
    - claim: "78x TTM P/E是误导性指标, 正常化后仍为46x(QSR最贵)"
      direction: bearish
      magnitude: 5
      mechanism: "FY2025异常税率41.1%压低EPS至$1.63→正常化EPS $2.10→46x P/E vs MCD 28x/YUM 26x/DPZ 30x→隐含OPM 15%+收入CAGR 5%联合成立"
      kill_switch: "Q2+Q3 FY2026 comp均>+5%→叙事升级为'确认转型'→PE扩张合理化"

    - claim: "RT-1/RT-7锁定机制: OPM终态被'钉住'在13-14%的狭窄区间"
      direction: bearish
      magnitude: 5
      mechanism: "$2B成本削减×60%实现率=+275bps(RT-1向上) 但4分钟出杯成本$1.0B=-230bps(RT-7向下)→净效果仅+45bps→OPM从9.6%恢复至13-14%需全靠收入杠杆"
      kill_switch: "AI点单+机器人制作释放50-80bps→突破14.5%上限"

    - claim: "Niccol迁移率仅52.5% — CMG playbook被SBUX组织复杂度打五折"
      direction: conditional
      magnitude: 4
      mechanism: "CMG 3,700店/零工会/零债务 vs SBUX 38,000店/550+工会店/-$8.4B权益→菜单简化(70%)和数字化(80%)可迁移, 人才密度(30%)和资本配置(40%)受硬约束"
      kill_switch: "Workers United达成全面合同→管理自主权恢复→迁移率可提升至65-70%"

    - claim: "中国市场份额崩塌不可逆, JV化是唯一体面退出"
      direction: bearish
      magnitude: 4
      mechanism: "中国市占从42%(2017)→14%(2025)→瑞幸29,000+店vs SBUX 8,011店→3.6:1门店比+$5.50 vs $3.50定价差→品牌力不等于市场份额"
      kill_switch: "JV首年份额企稳或回升(Boyu Capital执行超预期)"

    - claim: "品牌力8/10是SBUX唯一突出的护城河维度, 但定价权正在侵蚀"
      direction: conditional
      magnitude: 3
      mechanism: "Interbrand #6+95%认知度+$7.2B Nestle授权→品牌影子价值=$46.5B。但弹性系数从FY2022的-0.6恶化至FY2024的-2.0(每提价1%流失2%客流)→品牌强≠定价权强"
      kill_switch: "弹性系数回到-1.0以内(Niccol产品创新恢复感知价值)"

  moat:
    composite_score: 6.78  # A-Score调整后5.86/10, 含复杂度调整
    half_life: "品牌>15年 | 门店密度5-10年 | Rewards粘性<5年 | 定价权正在缩短"
    dimensions:
      - type: brand
        strength: 4  # 8/10映射到1-5
        evidence: "Interbrand #6, 95%+认知度, $7.2B Nestle CPG授权, 品牌支撑47% SOTP"
        vulnerability: "Gen Z偏好迁移(BROS渗透率72% vs SBUX 57%), 中国品牌价值缩水(42%→14%市占)"
      - type: switching_cost
        strength: 2  # 4/10
        evidence: "35.5M Rewards会员+$1.84B预存卡浮存金创造轻度锁定"
        vulnerability: "咖啡切换成本结构性偏低, BROS Dutch Rewards证明忠诚度计划可复制"
      - type: data
        strength: 3  # 6/10
        evidence: "35.5M会员数据+Deep Brew AI推荐, QSR行业数字化领先"
        vulnerability: "Deep Brew尚未变现, 推荐算法锦上添花而非不可或缺"
      - type: scale
        strength: 2  # 5/10 规模经济
        evidence: "38,000+门店全球最大咖啡连锁, $500M+年度营销分摊"
        vulnerability: "门店过密(627关店)→去规模化趋势, 劳动力30%成本无规模优势"

  valuation:
    reverse_dcf_implied: "市场隐含OPM恢复至15%+收入CAGR 5%联合成立; 隐含Path C(半转型)成功概率~60%——我们估计~40%"
    methods_used: ["Reverse DCF", "Forward DCF(四情景)", "SOTP(三身份)", "可比公司", "BME信念互斥", "P&L Build-out"]
    dispersion: "高 — DCF $92 vs SOTP $51 vs 可比$83"
    consensus_vs_ours: "市场定价Path C 60%成功概率+OPM 15%→我们认为40%+OPM 13-14%(RT-1/RT-7锁定)"
    entry_zone: "$75-80 (20-25%回调)"
    catalyst: "Q2+Q3 FY2026 comp miss→PE压缩至30-35x / 分红削减恐慌→$75-80入场窗口"

  # v1.2新增: 买卖决策框架
  action_framework:
    verdict: "等待买入 — 品牌资产真实但估值领先基本面35%, 等待PE压缩或转型确认"
    buy_triggers:
      - trigger: "PE压缩至30-35x(正常化EPS基准): comp miss或分红削减恐慌"
        price_zone: "$75-80"
        reasoning: "30-35x PE对应QSR合理区间+Niccol溢价→安全边际20%+"
      - trigger: "转型确认: Q2+Q3 FY2026 comp均>+3%且OPM>11%"
        price_zone: "当前价位附近(如转型确认则46x合理化)"
        reasoning: "3Q连续正增长→后验概率跳升至70%+→支持中性关注评级升级"
    hold_conditions:
      - "OPM持续恢复趋势(每季度环比改善)"
      - "FCF覆盖率>100%(分红可持续)"
      - "Rewards活跃率维持>65%"
      - "中国JV未出现品牌损害事件"
    sell_triggers:
      - signal: "FY2027E EPS<$2.80 (低于共识5%+) → 分红覆盖率<0.9x持续3年"
        severity: "action"
        action: "减仓50%, 分红削减概率升至>50%"
      - signal: "comp连续2Q为负(转型失败信号)"
        severity: "action"
        action: "全部卖出, Niccol失败的证据确认"
      - signal: "Workers United全面罢工 + 最低工资$22"
        severity: "emergency"
        action: "全部卖出, OPM将被压缩至<11%永久性"
      - signal: "PE>50x且OPM<11%(纯叙事定价无基本面支撑)"
        severity: "warning"
        action: "减仓25%, 重新评估估值假设"
    position_sizing: "当前不建议建仓(期望回报为负)。$75-80区间可考虑半仓"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "RT-1/RT-7锁定机制: 为什么OPM恢复被钉住"
    chain: >
      Niccol承诺$2B成本削减→但同时承诺4分钟出杯
      → 4分钟需要每店+2.5人(20hr/wk)→年成本$1.0B(实际工资$19/hr)
      → $1.0B = $2B成本削减×60%实现率的83%
      → 净OPM贡献从+275bps降至+45bps
      → 剩余OPM恢复(9.6%→13-14%)必须全靠收入杠杆(comp>+2%才能维持)
      → 两个CEO核心承诺在算术上互相抵消→OPM被锁定在13-14%
    transferable_to: "任何CEO同时承诺'降成本'和'提体验'的公司(航空、酒店、零售)"
    reasoning_habit: "当CEO做出两个看似独立的承诺时, 算算它们是否在成本端互相抵消——'成本削减AND服务升级'的联合叙事需要验证净效果"

  - id: "CC-2"
    name: "三重身份估值错配: 收入来源vs市场定价的断裂"
    chain: >
      SBUX收入90%+来自门店零售(身份A, 合理PE 15-20x)
      → 但市场以46x正常化PE定价→隐含用身份B(数字平台25-30x)或身份C(品牌授权28-35x)的倍数给整体公司定价
      → 按身份A收入贡献加权→合理倍数仅32x→$14/股差额是'身份溢价错配'
      → 身份B(Rewards平台)和身份C(CPG授权)贡献收入<10%但享受了30%+的估值溢价
      → 投资者以为买的是平台/品牌公司, 实际买的是咖啡零售运营商+品牌附加值
    transferable_to: "所有多身份公司——AMZN(电商vs AWS), GOOG(广告vs Cloud), TSLA(汽车vs FSD)"
    reasoning_habit: "看到高PE时追问'收入的主体来源配得上这个倍数吗'——如果核心收入的合理PE远低于当前PE, 差额就是叙事溢价"

  - id: "CC-3"
    name: "CSSPD同店纯度分解: 从标题数字到真实增长"
    chain: >
      SBUX报告Q1 FY2026 comp +4%→市场庆祝'转型成功'
      → CSSPD五维分解: 价格(+0.5) + 交易量(+3.5) + Mix(0) - 关店蚕食(-2.4) - 基数效应(-0.6) - 方法论偏差(-0.5)
      → 调整后纯comp: +0.4%至+1.6%(vs 标题+4%)
      → 与CMG的-1.7%比较: 标题差距+5.7pp→实际差距仅+2.1pp
      → 市场用标题数字判断转型进度→系统性高估复苏动能
    transferable_to: "所有报告同店增长的QSR/零售(MCD, CMG, NKE, COST)"
    reasoning_habit: "永远不要接受管理层报告的comp面值——追问'这个数字的纯度是多少', 特别关注关店蚕食和方法论偏差"

  - id: "CC-4"
    name: "BME信念互斥: 高PE转型公司的路径概率分配"
    chain: >
      78x PE(或46x正常化)隐含什么?→分解为3条逻辑路径
      → Path A(EPS最大化, 自营+OPM 15%, $91) vs Path B(倍数最大化, 特许化+OPM 20%, $98) vs Path C(半转型, OPM 13-14%, $80-90)
      → 关键发现: Path A和Path B所需组织能力几乎相反(强运营执行 vs 强战略转型)→一个CEO不太可能同时追求
      → 市场定价Path C成功概率~60%→我们估计~40%→差距=估值溢价来源
    transferable_to: "任何转型期高PE公司(INTC, BA, DIS)的估值拆解"
    reasoning_habit: "高PE+转型叙事→不要问'值多少'→问'市场在赌哪条路径, 这条路径需要什么条件'"

  - id: "CC-5"
    name: "Rewards去货币化陷阱: 忠诚度项目的S曲线后段"
    chain: >
      SBUX Rewards渗透率57%→向65%推进时边际成本急升
      → 每1pp渗透率提升需+$15M/年Star成本, 仅带来$60-80M增量收入
      → 边际Star成本/收入比从~50%恶化至~70%
      → 进一步推至70%+需要接近'买一送一'频率→彻底侵蚀品牌溢价
      → 增长引擎在高渗透率后变成margin压缩器
    transferable_to: "所有高渗透率忠诚度项目(Costco会员, 航空FFP, 酒店loyalty)"
    reasoning_habit: "忠诚度项目在增长早期是增长引擎, 在高渗透率后变成成本中心——追问'当前处于S曲线的哪一段'"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "78x P/E = 泡沫"
      final: "正常化后46x, 仍贵但没有78x暗示的那么荒谬"
      pivot: "FY2025异常税率41.1%(vs 正常23%)压低EPS→78x是税率扭曲后的幻觉"

    - initial: "Q1 FY2026 comp +4% = 转型确认"
      final: "CSSPD纯度分解后实际有机comp仅+0.4%至+1.6%"
      pivot: "关店蚕食(-2.4pp) + 基数效应(-0.6pp) + 方法论偏差(-0.5pp)吞噬了标题增长的大部分"

    - initial: "v2.0 WACC 6.3%是合理的保守估计"
      final: "v2.0 RT-5使用账面权重(73% debt / 27% equity)搞反了→CAPM精确计算应为7.5-8.0%"
      pivot: "发现v2.0红队用负权益的账面D/E比而非市值D/E比→权重错误→WACC被低估190bps"

  surprises:
    - finding: "SBUX展现正价格弹性(+0.33)——提价伴随需求增长, Veblen商品特征"
      implication: "品牌在特定消费场景下具有'越贵越受欢迎'的反直觉属性→定价策略应更大胆(但FY2024弹性已恶化至-2.0)"

    - finding: "4分钟悖论: Niccol两大核心承诺在算术上互相抵消"
      implication: "$2B成本削减的净OPM贡献仅+45bps→'降成本+提体验'的联合叙事是算术上的矛盾→没有卖方模型包含这一项"

    - finding: "CSSPD v3.0将同店纯度从v2.0的9/10下修至5/10"
      implication: "增加关店通胀/蚕食调整/基数效应三个维度后, comp的真实纯度远低于表面→v2.0系统性高估了增长质量"

    - finding: "负$8.4B权益 + 分红149% payout ratio = 延时引爆的炸弹"
      implication: "Johnson时代$19B+回购将健康公司变成负权益实体, FY2025已借债付分红→FY2027E EPS不达$2.95+则被迫削减分红"

  blind_spots:
    - area: "Niccol转型的真实执行力(仅1Q数据)"
      why_matters: "CMG复刻率52.5%的估计基于结构分析而非执行数据→3Q连续确认将是关键"
      monitor: "Q2 FY2026(2026-05-05) + Q3 FY2026(2026-08): comp和OPM趋势"

    - area: "新三层Rewards体系效果(2026-03-10刚上线)"
      why_matters: "CQ5(Rewards=天花板?)置信度停滞在55%正是因为无数据→新体系成败将决定增长天花板高度"
      monitor: "Q2+Q3 FY2026的活跃率/频次/ARPU变化"

    - area: "Workers United谈判结果"
      why_matters: "每$1/hr全面加薪=$750M/yr=~200bps OPM→工会合同是OPM恢复路径的最大不确定性"
      monitor: "集体谈判进展, 罢工风险升级信号"

    - area: "中国JV执行(Boyu Capital运营能力)"
      why_matters: "JV化后品牌控制力从100%降至40%→品牌损害风险无法直接干预"
      monitor: "JV close后首次报告(预计Q3 FY2026) + 中国市场份额趋势"

  # v1.2新增: 卖出时机教训
  sell_lessons:
    - scenario: "46x正常化PE+OPM仍在9.6%时不卖→如果comp miss则PE+EPS双杀"
      lesson: "转型故事中'估值领先基本面'是最危险的持仓状态——转型确认前的高PE=纯叙事溢价"
      transferable: "所有转型期公司(CEO新上任+高PE+基本面未改善)"
    - scenario: "分红payout ratio>100%但管理层声称'暂时性'→延迟卖出→最终被迫削减"
      lesson: "分红>NI或>FCF连续2年=结构性不可持续, 不要被'暂时性'叙事欺骗"
      transferable: "所有高杠杆+高分红公司(AT&T 2022削减分红模式)"
    - scenario: "品牌力8/10但定价权弹性从-0.6恶化至-2.0→品牌认知≠定价权"
      lesson: "品牌力和定价权是两个不同维度。品牌力反映认知度, 定价权反映经济转化效率——两者可以背离"
      transferable: "消费品行业(特别是面临低价替代品侵蚀的品牌)"

# --- Layer 2.5: 信号分级 ---
signal_hierarchy:
  alpha_signals:
    - signal: "CSSPD纯度分解后的有机comp(而非标题comp)"
      why_alpha: "市场用标题comp判断转型进度→CSSPD剥离蚕食/基数/方法论后的纯comp才是真实信号, 可领先市场判断1-2个季度"
      current_reading: "标题+4% vs 纯有机+0.4%至+1.6%(差距2.4-3.6pp)"
    - signal: "OPM季度趋势(vs 13-14%锁定区间)"
      why_alpha: "RT-1/RT-7锁定在13-14%→如果OPM连续突破14%或跌破12%=锁定假设被打破→重新评估整个thesis"
      current_reading: "FY2025 OPM 9.63%, 目标FY2028 13-14%"
    - signal: "分红FCF覆盖率"
      why_alpha: "149% NI payout + 88% FCF覆盖率=延时炸弹→一旦<80%连续2Q→削减概率跳升至>50%→触发收益型投资者被迫卖出"
      current_reading: "FY2025 FCF覆盖率88%(借债付分红)"

  confirmation_signals:
    - signal: "季度comp(标题数字)"
      bullish_threshold: ">+3%连续3Q(转型确认→评级升级至中性关注)"
      bearish_threshold: "连续2Q为负(转型失败→评级维持或下调)"
    - signal: "Rewards活跃会员数YoY增速"
      bullish_threshold: ">5% YoY(增长引擎确认)"
      bearish_threshold: "<0%(天花板确认→CQ5闭合为'天花板')"
    - signal: "工会门店数量增速"
      bullish_threshold: "增速放缓至<5%/年(管理层控制力回复)"
      bearish_threshold: "加速至>15%/年(全面工会化风险→OPM永久压缩)"

  noise_signals:
    - signal: "日度/周度客流数据(第三方)"
      why_noise: "季节性/天气/假期噪音极大, 单周数据无信号价值, 看季度趋势"
    - signal: "Sell-side目标价调整"
