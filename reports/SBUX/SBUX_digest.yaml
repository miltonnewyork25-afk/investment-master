# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含OPM 15%+CAGR 5%→vs 我们的13-14%+3-4%=核心分歧"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "7个RT红队→3向上4向下→净效应+1.5pp→双向校准确认'审慎关注'方向正确"

    - pattern_id: "competitive_benchmarking.chinese_competitor_deep_dive"
      application: "瑞幸29,000+店vs SBUX 8,011→3.6:1门店比+3x价格差→中国市场份额崩塌不可逆"

  novel_patterns:
    - name: "BME信念互斥量化(CI-01)"
      description: "将高PE转型公司的隐含假设分解为2-3条逻辑上互斥的路径, 量化每条路径的隐含OPM/EPS/市值, 计算市场的隐含概率分配"
      transferable_to: ["INTC(IDM→Foundry)", "BA(Max危机恢复)", "DIS(流媒体vs乐园vs线性TV)"]

    - name: "CSSPD同店纯度分解(CI-02)"
      description: "将SSS分解为交易量+客单价+Mix+关店蚕食+基数效应+方法论偏差, 赋予纯度评分0-10, 区分'真实增长'和'统计幻觉'"
      transferable_to: ["MCD", "CMG", "NKE", "COST", "所有报告同店增长的零售/餐饮"]

    - name: "4分钟悖论(CI-03): 服务承诺隐含成本量化"
      description: "当CEO做出具体服务承诺时, 精确量化承诺的隐含成本=受影响站点数×增量人力×工时×时薪×52周, 揭示'体验升级'和'成本削减'的算术矛盾"
      transferable_to: ["航空(行李交付)", "酒店(快速入住)", "电商(次日达)"]

    - name: "身份溢价错配(CI-04)"
      description: "多身份公司中, 市场以高价值身份的倍数给整体定价, 但收入主体来自低价值身份→差额是'身份溢价错配'"
      transferable_to: ["AMZN(电商vs AWS)", "GOOG(广告vs Cloud)", "TSLA(汽车vs FSD)"]

    - name: "Rewards去货币化陷阱(CI-05)"
      description: "忠诚度项目在S曲线后段, 边际会员获取成本上升快于边际收入贡献, 从增长引擎变为margin压缩器"
      transferable_to: ["Costco会员费", "航空FFP", "酒店loyalty项目"]

    - name: "OPM缝合假说(CI-06): 红队双向修正的净效果"
      description: "当两个红队修正方向相反且幅度接近时, 缝合为一个锁定区间→将注意力从低价值争论(OPM能到多少)转向高价值争论(WACC和概率分配)"
      transferable_to: ["制造业(自动化投资vs人工节省)", "科技(AI基建投资vs生产力提升)"]

  # v1.2新增: 框架升级贡献
  framework_contributions:
    moat_insights:
      - insight: "品牌力8/10但A-Score裸分仅4.97→单维度突出不能弥补11维度中7维度≤5的整体脆弱"
        implication: "消费品品牌公司的护城河评估不能只看品牌力——资本配置/财务堡垒/切换成本的低分会系统性侵蚀品牌优势"
      - insight: "咖啡品类的切换成本结构性偏低(4/10)→忠诚度计划是table stakes而非护城河"
        implication: "评估QSR/消费品护城河时, Rewards渗透率不应被视为护城河——它是可复制的竞争工具(BROS 72%渗透已证明)"
      - insight: "正价格弹性(+0.33, Veblen效应)可以与定价权恶化(-2.0弹性系数)共存"
        implication: "区分'品牌感知价值'(Veblen)和'实际定价空间'(弹性系数)——前者是品牌资产, 后者是竞争结果"

    valuation_insights:
      - insight: "三重身份SOTP暴露'身份溢价错配'——收入90%+来自身份A(15-20x PE), 但市场以46x定价"
        implication: "多身份公司应计算'收入加权合理PE'作为估值锚, 与市场PE的差额=叙事溢价的精确度量"
      - insight: "WACC在负权益公司中极度敏感——190bps差距决定了'审慎关注'vs'深度审慎'评级"
        implication: "负权益/高杠杆公司的WACC应使用市值权重(非账面权重), 并做情景化处理(多个WACC)而非单一估计"
      - insight: "RT-1/RT-7缝合后OPM被锁定→WACC和概率分配才是真正的价值驱动因素"
        implication: "当关键运营变量被'锁定'时, 分析精力应从争论运营细节转向争论折现率和情景概率"

    screening_insights:
      - insight: "PE(TTM)在异常年份极度误导——SBUX 78x vs 正常化46x差距32x纯属税率扭曲"
        implication: "选股筛选应使用正常化PE(标准化税率+排除一次性项目), 而非TTM PE"
      - insight: "分红payout ratio>100%持续2年+负权益=高概率分红削减信号"
        implication: "选股时增加'分红可持续性'过滤器: NI payout>100%连续2年+FCF覆盖<90%→标记分红风险"
      - insight: "CSSPD纯度<5/10的'增长'可能是统计幻觉"
        implication: "选股时对同店增长为正的零售/QSR, 检查是否有大规模关店(>5%门店)——如果有, 标题comp可能高估2-4pp"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "CEO两个承诺之间做算术: 净效果而非各自效果"
      trigger: "CEO同时承诺降成本和提体验/提速度/提质量"
      origin: "4分钟悖论: $2B成本削减和4分钟出杯在成本端互相抵消→净贡献仅+45bps"
      generalization: "任何CEO做出的两个看似独立的战略承诺都应该被量化净效果——特别当它们共享同一个成本池(人工/资本/时间)时"

    - habit: "对同店增长做纯度分解, 不接受管理层面值"
      trigger: "公司报告正comp且近期有大规模关店(>5%门店)"
      origin: "SBUX Q1 FY2026标题+4%→CSSPD后纯有机仅+0.4%至+1.6%→关店蚕食占2.4pp"
      generalization: "任何公司在大规模关店后报告comp改善→先扣除蚕食效应再判断。公式: 关店蚕食≈关店数×(该店收入÷邻店数÷原comp基数)"

    - habit: "高PE转型公司先做BME路径分解, 再判断合理性"
      trigger: "PE>30x且公司处于CEO变更/战略转型/利润腰斩的任何一种"
      origin: "SBUX 46x PE可被分解为Path A/B/C三条逻辑上所需能力不同的路径→市场的隐含赌注变得可检验"
      generalization: "高PE不是一个数字而是对未来路径的概率分配——拆解路径→验证每条路径的条件链→计算市场隐含概率→与自己的估计比较"

    - habit: "负权益公司WACC用市值权重而非账面权重"
      trigger: "公司股东权益为负"
      origin: "v2.0 RT-5用账面D/E(73%/27%)→WACC 5.6%→v3.0用市值D/E(19%/81%)→WACC 7.5%→190bps差距决定评级"
      generalization: "负权益=账面D/E无意义→必须用市值权重。这个错误在所有高杠杆/负权益公司(如航空、部分零售)中都可能出现"

  quality_feedback:
    strengths:
      - "6个Crown Insights(CI-01至CI-06)平均评分4.25/5——方法论原创性极高, CI-03(4分钟悖论)和CI-02(CSSPD)已写入excellence_catalog"
      - "DM密度1.47/千字, 525个锚点——数据锚定扎实"
      - "RT-1/RT-7锁定机制是估值分析的精华——将模糊的OPM争论收敛为可检验的窄区间"
      - "CQ置信度演化矩阵(P0.5→P5)展示了判断形成的完整过程——CQ2的非单调性(P4 63%回落至P5 60%)是诚实分析的标杆"
      - "WACC方法论修正(v2.0权重错误发现)——从技术错误中挽回了$17-24/股的估值偏差"
    weaknesses:
      - "报告~540K字符(标注)但实际~357K——字符数与标注不一致需核实"
      - "SOTP $51 vs DCF $92的巨大离散度(45%)未能完全调和——需要更好的方法论桥梁"
      - "CQ5(Rewards)置信度从P2到P5几乎不变(55%)——说明分析未能实质推进该问题"

  hypothesis_tested:
    confirmed:
      - hypothesis: "CEO叙事溢价有半衰期(KLAC/IHG报告)"
        evidence: "Niccol光环$23B但半衰期~18个月——仅Q1正向数据不足以延长半衰期"
        confidence_after: "高(三份报告独立确认)"

      - hypothesis: "Reverse DCF必须P1前置(铁律O, CRM教训)"
        evidence: "Ch17 Reverse DCF有效暴露了市场隐含Path C 60%概率→约束了后续分析方向"
        confidence_after: "高(执行确认)"

    extended:
      - hypothesis: "身份溢价错配(新模式)"
        extension: "从SBUX的'门店vs平台vs授权'三身份推广→任何收入来源与估值叙事不匹配的多身份公司"

      - hypothesis: "回购@高PE毁灭价值(MCO/CME CI)"
        extension: "SBUX验证了更极端版本: 回购不仅毁灭价值, 还摧毁了整个资本结构(-$8.4B权益)"

    refuted:
      - hypothesis: "高品牌力=强定价权(行业常识)"
        evidence: "SBUX品牌力8/10但弹性系数恶化至-2.0→品牌认知度和定价权可以背离"
        lesson: "品牌力是必要但不充分条件——定价权还取决于竞争格局(瑞幸/BROS低价替代)和消费环境"

  limitations:
    - "Niccol仅上任6个月, 仅1Q正向数据→CMG复刻率52.5%估计的置信度有限"
    - "新三层Rewards体系(2026-03-10上线)效果完全未知→CQ5无法闭合"
    - "中国JV条款和Boyu Capital执行能力→JV估值($10-13B)的不确定性仍高"
    - "WACC 5.6%(前瞻性)vs 7.5%(CAPM精确)之间的巨大差距未完全裁决→估值结论对WACC假设极度敏感"
    - "工会谈判结果完全不可预测→OPM恢复路径的最大不确定性→定性处理"
