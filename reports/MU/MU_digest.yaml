    - initial: "HBM改变了MU的商业模式——'这次不一样'"
      final: "HBM降低周期波幅但未消除周期性 — 传统DRAM仍占60-65%收入受库存周期驱动"
      pivot: "三个预期差(HBM毛利率/AI CapEx/周期免疫)全部指向下行 + 30%转产不可逆=放大下行风险"

    - initial: "Phase 1温度计+0.26(中性偏冷→倾向加仓)"
      final: "Phase 5温度计-0.45(偏冷→回避), 评级从'持有观望'翻转至'回避'"
      pivot: "Phase 2-4逐步揭示: 正常化PE陷阱 + PPDA四重背离 + 内部人2018复刻 + 看空说服力6.8>看多5.2"

  surprises:
    - finding: "AI溢价已被精确定价 — AI调整后公允价值$391 vs 当前$383.50(+2%)"
      implication: "不应期待'AI重估'带来超额收益, 市场已有效反映AI期权价值。投资MU=赌周期延续而非AI发现"

    - finding: "DCF估值$148-166仅为当前价格的39-43% — 即便考虑系统性低估, 差距仍极端"
      implication: "DCF与市价131%+的差距是所有估值方法中最大的, 暗示市场隐含了极强的HBM永续增长假设"

    - finding: "看空等权重分析(9论点)→期望下行-22%→看空说服力6.8/10 > 看多5.2/10"
      implication: "Phase 4对抗审查后, 看空案比看多案更有说服力 — 这在AI概念股中极为罕见"

    - finding: "地缘风险被过度定价3-5%(反直觉) — MU地缘暴露低于TSM但折价更大"
      implication: "CHIPS Act $6.1B + Idaho新工厂 = MU是地缘去风险受益者而非受害者, 修复空间$50-70"

  blind_spots:
    - area: "HBM4量产良率和市场份额"
      why_matters: "HBM4是2026H2的关键变量 — 份额从21%→30%=bull案, 停滞在20%=bear案"
      monitor: "2026年6月MU FY26Q3财报HBM收入占比 + 2026H2 Samsung HBM4认证结果"

    - area: "AI CapEx周期拐点时间"
      why_matters: "Hyperscaler AI CapEx放缓22%概率(Polymarket) — 一旦发生HBM需求崩塌速度可能快于传统DRAM"
      monitor: "NVIDIA/AMD/Google/Microsoft季度CapEx指引 + 数据中心租赁活动"

    - area: "供需翻转精确时间"
      why_matters: "Phase 3预测2027Q2-Q3, 但SK海力士/Samsung CapEx扩张节奏可能加速或延迟翻转"
      monitor: "TrendForce季度供需模型 + 各公司CapEx实际执行vs指引"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
