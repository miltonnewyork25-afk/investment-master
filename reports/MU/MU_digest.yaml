# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "周期股Forward P/E陷阱的识别逻辑"
    chain: >
      观察: MU Forward P/E 8.71x vs 半导体行业51.97x → 看似极度便宜
      → 追问: 这个EPS是正常化还是峰值?
      → 发现: FY23 EPS -$5.34 → FY26E $44 = 跨越$49的波幅
      → 追问: 历史上MU维持峰值EPS超过2年的次数?
      → 答案: 0/5次(1999/2006/2010/2018/2021)
      → 因此: 正常化EPS $12-16 → 正常化P/E 24-32x → 并不便宜
      → 投资含义: Forward P/E在周期股中是反指标——越低越危险,因为它隐含了峰值盈利永续
    transferable_to: "所有周期性行业: 航运/钢铁/化工/能源 — Forward P/E低≠便宜, 需用正常化EPS"
    reasoning_habit: "看到周期股极低Forward P/E时, 立刻追问'EPS的正常化水平是多少'和'历史上维持峰值EPS的次数' — 0/N次=价值陷阱"

  - id: "CC-2"
    name: "内部人交易的周期预测力(20年回测)"
    chain: >
      数据: MU过去5季153卖/3买, A/D 0.14
      → 追问: 历史上A/D<0.2出现几次?结果如何?
      → 回测: 4次出现, 后12月均跌-35%以上, 平均-42%
      → 2018年匹配度: P/E区间(7-9x vs 8.71x)✓ + A/D(<0.2)✓ + 周期位置(P3后)✓ = 92%
      → 追问: 可能是'常规薪酬变现'吗?
      → 剥离: RSU自动出售+10b5-1计划后, Open Market自主买入仅3笔/149笔卖出=0.020
      → 结论: 内部人在周期极端值时的集体行为具有高度预测性, 噪音已被过滤
    transferable_to: "所有周期股的内部人交易分析 — 关键是剥离计划性交易后看自主买入比率"
    reasoning_habit: "看到内部人卖出时, 不急于下结论 — 先剥离计划性交易, 再看Open Market自主买入比率, 最后回测历史极端值的预测命中率"

  - id: "CC-3"
    name: "HBM挤出效应的双面性"
    chain: >
      事实: MU将30%晶圆产能转产HBM(从传统DRAM)
      → 正面: HBM毛利率>70% vs 传统DRAM ~35-40% → 混合毛利率提升5-8pp
      → 反面: 传统DRAM供给减少 → 短期DRAM价格上涨 → 但长期Samsung/SKH也转产 → 供给恢复
      → 关键不对称: 上行(HBM成功) = 净增量$5-6B | 下行(HBM需求放缓) = 30%产能无法快速转回 = EPS风险-34%
      → 投资含义: HBM挤出效应让MU上下行不对称 — 上行有限(已定价), 下行放大(转产不可逆)
    transferable_to: "所有产能转移/mix shift故事 — 转产不可逆时, 下行风险被放大"
    reasoning_habit: "看到产品mix shift叙事时, 追问'转产是否可逆' — 不可逆mix shift = 下行放大器"

  - id: "CC-4"
    name: "AI确定性衰减曲线(远期AI故事的折扣方法)"
    chain: >
      问题: AI对MU的增长贡献能持续多久?
      → 分层: 1年(FY26)确定性85%(已有合同) → 3年(FY28)55%(技术路线已知但竞争未定) → 5年(FY30)30%(HBM5/CXL不确定)
      → 市场行为: DCF终值权重>40%但用线性外推AI收入
      → 修正: 应用确定性折扣因子后, 有效终值贡献<25%
      → 投资含义: 远期AI故事应大幅折扣, 不是因为AI是假的, 而是因为5年后的技术路径和竞争格局高度不确定
    transferable_to: "所有AI受益者估值 — 对远期AI收入应用确定性衰减因子(1年85%/3年55%/5年30%)"
    reasoning_habit: "看到长期AI叙事时, 追问'每一年的确定性分别是多少' — 确定性衰减是AI估值最被忽视的风险因子"

  - id: "CC-5"
    name: "PPDA四重背离的合流效应"
    chain: >
      单独看: 内部人看跌(常见) / PMSI偏冷(常见) / DCF偏低(周期股常见) / 正常化PE偏高(可争议)
      → 合流看: 四个独立信号源同时看跌 = 极其罕见
      → 历史: 三重以上背离收敛率4/4(100%)
      → 关键: 单一信号可以忽略, 多信号合流不可忽略 — 独立信号的联合概率远低于单一信号
      → 投资含义: PPDA合流 = 系统性高估信号, 收敛方式大概率是价格下行
    transferable_to: "所有估值分析 — 建立多信号背离检测系统(内部人+情绪+基本面+相对), 三重以上合流=高置信度信号"
    reasoning_habit: "永远不只看一个估值信号 — 构建至少3个独立信号源, 当≥3个同时背离时 = 系统性信号"

