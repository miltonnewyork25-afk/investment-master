      why_noise: "回购缩小权益基数→ROE数学膨胀(47%→可能60%)——但ROIC才是真实运营回报。ROE改善≠运营改善"
    - signal: "CAVA季度comp(短期)"
      why_noise: "CAVA 439家店vs CMG 4,056家, 短期comp差异主要反映规模差异和新店蜜月期, 非直接竞争替代。3-5年时间框架才有实质意义"
    - signal: "日度/周度app下载量波动"
