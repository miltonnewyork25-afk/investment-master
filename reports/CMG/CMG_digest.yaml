# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "CMG以32x P/E交易于5年估值底部，零负债+高ROIC构成安全边际，但comp转负(-1.7%)+Niccol离任折价+WACC悖论使期望回报-7.0%——等待FY2026 H1 comp数据确认方向"
  rating: "中性关注(偏审慎)"
  fair_value: "~$34.3 (红队调整后PWV)"
  expected_return: "-7.0%"

  key_arguments:
    - claim: "WACC悖论——零负债在DCF中是'劣势', 在风险中是'优势'"
      direction: neutral
      magnitude: 5
      mechanism: "零金融负债→WACC=纯权益成本9.5%→DCF结构性偏低(vs高杠杆同业SBUX WACC 5.6%)→390bps缺口无法用模型消除→估值争论被纯化为comp能否恢复这一个变量"
      kill_switch: "如果市场持续以5-6%隐含折现率定价CMG, WACC悖论将被'投票'而非'称重'解决"

    - claim: "Niccol折价~8.0x P/E可量化, 约10.6x(49%)具备修复条件"
      direction: conditional
      magnitude: 4
      mechanism: "P/E从53.8x压缩至32x, 四因子归因: comp减速(5.5x)+宏观(3.6x)+Niccol折价(8.0x)+叙事转换(4.5x)→comp+宏观可修复(9.1x), Niccol折价中2.6x取决于Boatwright证明, 叙事4.5x大概率永久"
      kill_switch: "Boatwright连续2Q战略沉默+comp<-2%→折价从'暂时'转为'结构性'"

    - claim: "回购数学不可持续——FY2026是身份定义时刻"
      direction: bearish
      magnitude: 4
      mechanism: "FY2025回购$2.43B=FCF的167%→现金从$1.42B降至$1.05B→FY2026维持同节奏年底现金归零→必须减速至FCF水平或破零负债原则举债→无论哪条路径都改变叙事"
      kill_switch: "FCF大幅恢复至$1.8B+→回购空间重新打开→身份危机延后"

    - claim: "定价权存在但正在收窄——2021-2023强(累计涨价20%客流正增长), 2024-2025拐点出现"
      direction: bearish
      magnitude: 3
      mechanism: "2021-2023累计涨价~20%客流正增长(需求弹性<1)→2024加州6-7%涨价后客流放缓→CEO承诺'尽可能不提价'暗示定价权边界被测试→关税+工资成本只能由OPM吸收"
      kill_switch: "comp恢复+2%以上→证明消费者价格敏感度是周期性而非结构性"

    - claim: "HEEP(自动化设备)是comp恢复和OPM扩张的核心杠杆, 但规模化未验证"
      direction: conditional
      magnitude: 3
      mechanism: "双面烤盘将鸡肉烹饪时间减67%→管理层声称'数百bps'利润率改善→偏差修正后真实增量~150-200bps→FY2026从350家扩至2,000家(覆盖率8.6%→49%)→2,000店是规模化验证最低阈值"
      kill_switch: "HEEP 2,000店覆盖后comp仍负+OPM无改善→证明效率被成本完全对冲"

  moat:
    composite_score: 7.0
    half_life: "~10-15年(运营体系可学习, 非专利型)"
    dimensions:
      - type: brand
        strength: 4
        evidence: "全美快休闲品牌第一, NPS行业领先, 'Food With Integrity'差异化深入人心, 24.6%品类份额"
        vulnerability: "单品牌风险——任何影响Chipotle品牌的事件直接冲击100%收入(2015 E.coli: comp-20.4%, 市值-$8B)"
      - type: scale
        strength: 4
        evidence: "4,056家直营店, AUV $2.94M远高于行业均值, G&A/Rev 5.5%接近结构性下限"
        vulnerability: "G&A杠杆接近耗尽(4.5-5.0%下限), 未来OPM改善只能来自门店层面效率或收入增长"
      - type: switching_cost
        strength: 3
        evidence: "21M忠诚会员+数字化渗透37%+Chipotlane 1,100家创造习惯黏性"
        vulnerability: "CAVA/Sweetgreen可复制运营方法论, 数字化渗透率已进入平台期(不再增长)"
      - type: pricing_power
        strength: 3
        evidence: "2021-2023累计涨价20%客流正增长, 客单价$10.31在快休闲中仍属高性价比"
        vulnerability: "2024-2025拐点: 弹性明显上升(|ε|>1), CEO承诺不提价=定价权边界被测试"

  valuation:
    reverse_dcf_implied: "市场隐含comp恢复至低单位数正增长(B1)+OPM扩张至19-21%(B2)+门店扩张8%/年(B3)+FCF CAGR 16-18%(B4)——B2是最脆弱信念(需创造CMG从未达到的利润率水平)"
    methods_used: ["Reverse DCF", "DCF(4情景概率加权)", "可比估值(9公司)", "Lynch法", "PEG法", "EV/EBITDA法"]
    dispersion: "极高——DCF $20.06(-46%) vs 可比$38.4(+4%), 根源是WACC悖论(390bps缺口)"
    consensus_vs_ours: "市场看32x P/E=5年最低可能修复 | 我们看32x仍高于成熟同业(MCD 25.5x/DPZ 23.8x)+WACC悖论使真实定价不透明"
    entry_zone: "$28-30 (P/E ~25-27x)"
    catalyst: "FY2026 H1 comp转正+HEEP 2,000店OPM增量验证——两个催化剂需同时出现才能触发评级上调"

  action_framework:
    verdict: "等待信号——不是买入信号也不是卖出信号, comp转正前观望"
    buy_triggers:
      - trigger: "FY2026 H1 comp >+1% + HEEP 2,000店验证OPM +50bps"
        price_zone: "$33-36 (P/E 29-32x, 确认后当前价位附近可建仓)"
        reasoning: "comp转正证明Niccol折价是周期性→10.6x P/E修复空间→评级升至'关注'"
      - trigger: "P/E压缩至25-27x(宏观/行业恐慌)"
        price_zone: "$28-30"
        reasoning: "零负债+品牌力8.0提供安全边际→在成熟同业估值水平买入高品质资产"
    hold_conditions:
      - "品牌力维持(NPS不降>10分, 年轻客群占比不降>3pp)"
      - "OPM ≥16%(零负债公司的利润率底线)"
      - "ROIC维持>15%(真实运营回报而非ROE幻觉)"
      - "管理层不举债回购(破零负债原则=身份危机)"
    sell_triggers:
      - signal: "连续3Q comp < -3%(品牌结构性衰退信号)"
        severity: "action"
        action: "减仓50%, 重新评估护城河"
      - signal: "OPM < 15% + comp负增长(利润率死亡螺旋)"
        severity: "emergency"
        action: "全部卖出, 温水煮青蛙加速"
      - signal: "管理层为维持回购而举债(零负债身份破坏)"
        severity: "warning"
        action: "减仓25%, 重新计算资本结构安全边际"
      - signal: "CAVA连续4Q comp > CMG comp + 10pp(品类替代加速)"
        severity: "warning"
        action: "观察2个季度, 如持续则减仓"
    position_sizing: "当前不建仓(期望回报-7.0%) | comp转正后半仓(~15%仓位) | P/E<27x全仓(~25%仓位)"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "WACC悖论——零负债公司的DCF陷阱"
    chain: >
      零金融负债→WACC=纯权益成本9.5%(无债务税盾拉低)
      → 高杠杆同业(SBUX)WACC仅5.6%→DCF对CMG系统性偏低
      → CAPM推导9.5% vs 市场隐含折现率5.6%→390bps缺口
      → 缺口来源: 品质溢价(~100bps)+增长期权(~100bps)+模型局限(~200bps)
      → 结论: DCF在零负债公司上不可信→必须降权+多方法交叉验证
      → 投资含义: 零负债在风险视角是优势(无信用风险/再融资风险)但在估值视角是劣势(WACC偏高)
    transferable_to: "所有零/低负债高品质公司(BRK/GOOG/部分科技公司)的DCF估值"
    reasoning_habit: "看到零负债公司DCF大幅低于市价时, 先检查WACC是否因缺少债务税盾而结构性偏高——不要急于判断'高估'"

  - id: "CC-2"
    name: "P/E压缩归因法——四因子拆解修复空间"
    chain: >
      P/E从53.8x压缩至32x, 总幅度21.6x
      → 拆解: comp减速(5.5x)+宏观(3.6x)+CEO折价(8.0x)+叙事转换(4.5x)
      → 分类: 可修复(comp+宏观=9.1x) vs 需验证(CEO折价中2.6x) vs 永久(叙事4.5x)
      → 投资含义: 49%(10.6x)有修复条件, 但需两个催化剂同时兑现
      → 如果仅comp恢复而CEO未验证, P/E修复仅3-5x(至35-37x), 不改变评级
    transferable_to: "所有经历P/E大幅压缩的公司——区分可修复/需验证/永久, 比简单'均值回归'更精确"
    reasoning_habit: "P/E压缩时不要笼统说'便宜了'——拆解每一块压缩的原因, 分别评估修复概率"

  - id: "CC-3"
    name: "回购可持续性的物理约束"
    chain: >
      FY2025回购$2.43B/FCF$1.45B=167%→差额$0.98B消耗现金储备
      → 现金从$1.42B降至$1.05B→按此节奏1.2年耗尽
      → 零负债身份=不会举债→回购必须减速至FCF水平
      → 回购减速→EPS增长贡献从~2.5%降至~1.4%→信号效应: 市场解读为'增长选项匮乏'
      → 正反馈循环: comp负→减速回购→市场'连管理层都不看好'→P/E压缩→更不敢回购→螺旋
    transferable_to: "所有回购/FCF>100%的公司——物理约束比管理层意愿更可靠"
    reasoning_habit: "看到回购大幅超过FCF时, 计算'现金耗尽时间'——这比讨论回购意愿更有预测力"

  - id: "CC-4"
    name: "食品通胀传导的两难——不提价=OPM吸收, 提价=客流风险"
    chain: >
      牛油果关税25%→+60bps成本+劳动力成本+50-100bps→合计+110-160bps
      → CEO承诺'尽可能不提价'→成本由OPM吸收
      → 但comp已负(-1.7%)→提价→更多客流损失(需求弹性2024后>1)
      → 两难: 吸收=利润率下降 vs 提价=客流加速流失
      → 在comp负增长环境下, 定价权是理论上存在但实操上不敢用的'纸面武器'
    transferable_to: "所有面临成本上升+需求疲软双重压力的消费品公司——定价权的实际可用性取决于需求弹性"
    reasoning_habit: "评估定价权时追问'在当前需求环境下敢不敢用'——牛市定价权和熊市定价权是两种完全不同的资产"

  - id: "CC-5"
    name: "温水煮青蛙——最可能的下行路径不是崩盘而是缓慢低于预期"
    chain: >
      品牌老化(每年-0.5pp年轻客群)+数字化停滞(37%平台期)+G&A杠杆耗尽+权益侵蚀(ROE幻觉)
      → 每个因素单独不触发KS→五年累积: EPS $1.14→$1.20(vs共识$1.40), P/E 32x→25x→$30(-19%)
      → 投资者既不止损(没有明确恶化)也不获利(没有明确改善)
      → 5年持有回报-10%至-20%, 远不如指数基金
    transferable_to: "所有成熟品牌公司——温水煮青蛙比戏剧性崩盘更难防御, 因为没有单一触发信号"
    reasoning_habit: "对成熟品牌不仅问'什么会让它崩盘', 更要问'什么会让它每年微弱地低于预期'——后者的累积危害更大"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "32x P/E = 5年最低 = 便宜"
      final: "32x仍高于MCD(25.5x)/DPZ(23.8x)/DRI(22.8x)等成熟同业, 且WACC悖论使DCF无法确认低估"
      pivot: "WACC悖论: CAPM 9.5% vs 市场隐含5.6%→390bps缺口使'便宜'判断不可靠"

    - initial: "Phase 1-3评级'审慎关注(偏中性)', 期望回报-10.7%"
      final: "红队校准后上调至'中性关注(偏审慎)', 期望回报-7.0%"
      pivot: "RT-2悲观偏差(+4.5pp): 基于RCL/SBUX/IHG三份报告的系统性悲观模式外推, 但依赖meta-judgment而非CMG特定证据"

    - initial: "HEEP能带来'数百bps'利润率改善(管理层声称)"
      final: "偏差修正后真实增量~150-200bps, 且需规模化验证"
      pivot: "管理层声称的效率数据存在选择偏差(最佳门店展示)→Phase 1对CQ-3做了偏差修正"

  surprises:
    - finding: "去掉财务健康维度后, CMG与SBUX的A-Score几乎完全相同(5.88 vs 5.86)"
      implication: "CMG相对SBUX的全部品质优势来自零负债——运营品质相当。但零负债在DCF中反而是劣势(WACC高)→品质优势和估值劣势来自同一个源头"

    - finding: "ROE 47.4%是回购缩小权益基数的数学膨胀, ROIC(18.9%)才是真实运营回报"
      implication: "量化筛选器看到ROE 47%会标记为'高质量成长股'——但分子(利润)停滞、分母(权益)缩小=增长幻觉"

    - finding: "P/E四因子归因中, 叙事转换(成长→成熟)的4.5x大概率永久——CMG已被市场重新归类"
      implication: "即使comp恢复+CEO验证, P/E也很难回到50x+→CMG的投资回报将从P/E扩张驱动转向EPS增长驱动"

    - finding: "CMG与SBUX是WACC悖论的镜像: SBUX用杠杆让DCF看起来便宜但风险高, CMG零负债让DCF看起来贵但风险低"
      implication: "两家公司评级相似但投资论点完全相反——'安全但不便宜' vs '便宜但风险高'"

  blind_spots:
    - area: "FY2026 H1 comp(最关键单一变量)"
      why_matters: "同时验证/否定comp是周期性还是结构性, 决定评级向上还是向下迁移"
      monitor: "FY2026 Q1财报(2026年4月) | Q1 comp >+1%=积极信号 | <-2%=下调触发"

    - area: "HEEP规模化效果(350→2,000店)"
      why_matters: "决定OPM是扩张(HEEP+150-200bps)还是收缩(成本压力+110-160bps净效应)"
      monitor: "HEEP覆盖门店的comp vs 非HEEP门店的comp差异 | FY2026 Q2-Q3分步验证"

    - area: "Boatwright的战略能力(CEO沉默分析: 国际化/品牌扩展均沉默)"
      why_matters: "决定Niccol折价8.0x中2.6x的修复可能性 | 运营稳定≠战略引领"
      monitor: "FY2026 earnings call中是否出现独立战略愿景(非Niccol延续)"

  sell_lessons:
    - scenario: "P/E从53.8x压缩至32x期间不止损——持有者承受-37%下跌"
      lesson: "消费品高P/E(>40x)依赖明星CEO叙事时, CEO离任=叙事崩塌=P/E立即重定价。在CEO变动时至少减仓30%"
      transferable: "所有P/E>40x且高度依赖单一管理者叙事的公司(TSLA/SBUX/NKE CEO变动期)"

    - scenario: "comp转负后等待恢复——历史恢复需3-4年(2015 E.coli先例), 期间资本被锁定"
      lesson: "品牌公司comp恢复的时间线通常比市场预期长2-3x。comp转负后应降低仓位, 等确认信号后再回补"
      transferable: "所有经历comp转负的餐饮/零售公司——恢复时间是最常被低估的变量"

    - scenario: "回购超过FCF 167%不减仓——物理约束1.2年内必须减速→信号效应压P/E"
      lesson: "回购/FCF>130%是不可持续的数学信号——不管管理层怎么说, 物理约束会迫使减速, 减速时市场通常过度反应"
      transferable: "所有积极回购但回购速度超过FCF的公司"

# --- Layer 2.5: 信号分级 ---
signal_hierarchy:
  alpha_signals:
    - signal: "FY2026 Q1 comp (同店销售增长)"
      why_alpha: "同时验证三个关键假设: comp是否触底(CQ-1), HEEP是否规模化有效(CQ-3), Niccol折价是否可修复。单一数据点解决三个问题"
      current_reading: "FY2025全年-1.7%, Q4约-2.5%, 管理层指引FY2026 'approximately flat'"

    - signal: "HEEP覆盖门店vs非HEEP门店的comp差异"
      why_alpha: "隔离HEEP的真实增量效应——如果HEEP门店comp明显优于非HEEP门店, 证明150-200bps假设成立"
      current_reading: "尚未披露, FY2026 Q2-Q3起可比较(覆盖率达49%后)"

    - signal: "FY2026回购金额vs FCF比率"
      why_alpha: "揭示管理层是否正视回购不可持续的数学约束——减速=诚实但P/E承压, 不减速=现金耗尽"
      current_reading: "FY2025回购/FCF=167%, 现金$1.05B(仅够1.2年)"

  confirmation_signals:
    - signal: "季度comp趋势(Q-by-Q)"
      bullish_threshold: ">+1%连续2Q(周期性恢复确认)"
      bearish_threshold: "<-2%连续2Q(结构性恶化确认)"
    - signal: "OPM季度趋势"
      bullish_threshold: ">17%(HEEP效率兑现)"
      bearish_threshold: "<15%(成本压力失控)"
    - signal: "SBUX在Niccol领导下的comp恢复速度"
      bullish_threshold: "SBUX comp恢复至+2%以上→压缩CMG P/E 2-3x(Niccol叙事溢价)"
      bearish_threshold: "SBUX持续恶化→修复CMG P/E 2-4x(Niccol证伪)"

  noise_signals:
