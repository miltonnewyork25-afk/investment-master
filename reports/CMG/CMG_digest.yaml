# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: SBUX
      similarity: "同一变量(Niccol)的镜像对比, 估值困境的双向映射"
      key_difference: "CMG='安全但不便宜'(零负债+WACC高) vs SBUX='便宜但风险高'(负权益+WACC低) | CMG失去Niccol vs SBUX获得Niccol"

    - ticker: CAVA
      similarity: "同为快休闲品类, 客群重叠60-70%, 菜单定位(地中海vs墨西哥)互补但胃口份额竞争"
      key_difference: "CAVA=高增长初创阶段(439店→1,500+, comp +13.4%) vs CMG=成熟放缓(4,056店, comp -1.7%) | CAVA是品类扩张者, CMG是品类守成者"

    - ticker: MCD
      similarity: "全球餐饮龙头, 经历类似comp周期(FY2023 comp减速→FY2024恢复)"
      key_difference: "MCD=特许经营(轻资产, 高margin) vs CMG=直营(重资产, 品控一致) | MCD多品类分散 vs CMG单品牌集中"

  comparative:
    - dimension: "定价权"
      position: "DRI > CMG ≈ MCD > SBUX > CAVA(未测试)"
      reasoning: "CMG 2021-2023累计涨价20%客流正增长, 但2024-2025拐点出现; DRI在通胀中更稳定"

    - dimension: "财务安全性"
      position: "CMG (Z-Score 7.28) >> MCD >> DRI >> SBUX (负权益)"
      reasoning: "CMG零金融负债, 行业唯一; SBUX负权益-$8.4B"

    - dimension: "增长动能"
      position: "CAVA (+13.4% comp) >> WING (+22.5% comp) >> DPZ >> MCD ≈ CMG (-1.7%)"
      reasoning: "CMG从增长龙头(FY2024 +7.4%)变为行业落后者(FY2025 -1.7%)"

    - dimension: "估值吸引力"
      position: "DRI (22.8x) > DPZ (23.8x) > MCD (25.5x) > CMG (32x) > CAVA (>100x)"
      reasoning: "CMG P/E 5年最低但仍高于成熟同业; 有品质溢价但不再有增长溢价"

  industry_position:
    quadrant: "高品质 × 中高估值 × 低增速 (品类领导者转型期)"
    archetype: "品牌溢价公司——品牌力创造定价权但增长依赖comp周期"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含comp恢复+OPM扩张至19-21%→B2(OPM)是最脆弱信念(CMG从未达到)"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "7个RT红队双向校准, 净修正+3.75pp(向上7.75pp-向下4.00pp), 将评级从审慎关注上调至中性关注"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "温水煮青蛙四因素(品牌老化+数字化停滞+G&A耗尽+权益侵蚀)→5年-19%"

  novel_patterns:
    - name: "WACC悖论(零负债公司的DCF陷阱)"
      description: "零负债→WACC=纯Ke→DCF系统性偏低→必须降DCF权重+多方法验证。负债不是唯一的估值视角: 零负债在风险中是优势但在DCF中是劣势"
      transferable_to: ["BRK", "GOOG/GOOGL", "所有零/低负债高品质公司"]

    - name: "P/E压缩四因子归因(可修复/需验证/永久分类)"
      description: "P/E压缩不是统一归因——拆解为周期性(可修复)、事件驱动(需验证)、叙事转换(永久)三类, 分别评估修复概率, 比'均值回归'更精确"
      transferable_to: ["所有经历P/E大幅压缩的公司", "NKE/SBUX/PYPL等CEO变动+增速放缓叠加案例"]

    - name: "定价权双态模型(牛市定价权vs熊市定价权)"
      description: "同一家公司在需求强劲时弹性<1(可涨价), 需求疲软时弹性>1(不敢涨)——定价权评估必须区分环境, 不能用牛市证据推断熊市能力"
      transferable_to: ["所有消费品公司的定价权评估", "特别是周期性消费品"]

    - name: "回购物理约束时间表"
      description: "回购/FCF>100%时计算'现金耗尽时间'→预测回购减速的必然时点→预判信号效应对P/E的冲击"
      transferable_to: ["所有回购激进的公司(回购/FCF>130%)"]

    - name: "承重墙联合概率分析"
      description: "识别商业模式的4面承重墙(品牌/运营/供应链/趋势)→独立开裂概率×影响→联合概率54%至少一面开裂, 双墙同裂概率3-5%→聚焦最脆弱的墙(供应链25%)"
      transferable_to: ["所有单品牌消费品公司", "品牌驱动型商业模式"]

  framework_contributions:
    moat_insights:
      - insight: "直营模式的护城河是运营一致性(品控+创新速度)而非专利/网络效应——可学习但学习周期长(3-5年)"
        implication: "评估直营餐饮护城河时, 关注运营体系的制度化程度(是否依赖个人), 而非是否有专利壁垒"
      - insight: "单品牌是品质的保障也是风险的集中——2015 E.coli证明单点故障可损失37%市值"
        implication: "单品牌公司的护城河评估需包含'品牌信任崩塌'的尾部风险定价"
      - insight: "定价权在需求环境中呈双态: 2021-2023强(弹性<1) vs 2024-2025弱(弹性>1)——同一个品牌, 同一个定价权, 环境改变后完全不同"
        implication: "护城河中的定价权维度应标注'需求环境'条件, 而非给一个静态评分"

    valuation_insights:
      - insight: "WACC悖论: 零负债公司WACC=纯Ke, 导致DCF结构性偏低——需降权DCF, 以可比法为主锚"
        implication: "所有零负债公司的估值框架应降低DCF权重至15-25%, 避免被WACC结构性偏差误导"
      - insight: "红队悲观偏差+4.5pp是基于meta-judgment(3份历史报告外推)而非公司特定证据——置信度应相应降低"
        implication: "红队修正中区分'公司特定证据驱动'和'框架统计外推驱动'的修正, 对后者给更低置信度"
      - insight: "P/E四因子归因比简单'便宜了/贵了'更有预测力——可修复/需验证/永久分类直接指导仓位"
        implication: "估值框架增加'P/E压缩归因'步骤: 拆解每一块压缩, 分类评估修复概率"

    screening_insights:
      - insight: "回购/FCF>130% = 不可持续信号——计算现金耗尽时间比分析回购意愿更有预测力"
        implication: "选股筛选增加'回购可持续性'指标: 回购/FCF>130%标记为'回购减速在即'"
      - insight: "去掉财务健康维度后CMG与SBUX品质几乎相同——说明A-Score中资本结构权重可能过高"
        implication: "A-Score权重审查: 财务健康20%可能过度奖励零负债, 考虑降至15%或增加运营品质权重"
      - insight: "comp<0+P/E>30x = 估值-增长错配——筛选器应标记此组合为'等待型'"
        implication: "选股增加'增长-估值匹配度'筛选: comp负增长但P/E>行业中位数1.2x = 等待信号"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "零负债公司DCF偏低时先检查WACC结构而非急于判断高估"
      trigger: "DCF隐含价格 < 市价30%+ 且 公司零/低负债"
      origin: "CMG DCF $20.06(-46%) vs 市价$36.93→发现390bps WACC缺口→不是高估而是DCF局限"
      generalization: "DCF大幅偏离市价时, 先诊断模型输入(WACC/g)的合理性, 再判断市场是否错误"

    - habit: "P/E压缩时拆解归因而非笼统说'便宜了'"
      trigger: "P/E年度压缩 > 30%"
      origin: "CMG P/E从53.8x→32x, 拆解后发现4.5x(叙事转换)大概率永久→修复空间比表面小"
      generalization: "P/E是多维变量的压缩——不拆解就无法评估修复概率"

    - habit: "回购超过FCF时计算物理约束而非分析意愿"
      trigger: "年度回购 > FCF × 130%"
      origin: "CMG回购$2.43B/FCF$1.45B=167%→1.2年现金耗尽→物理约束比管理层声明更可靠"
      generalization: "现金是有限资源——'能持续多久'比'想不想持续'更重要"

    - habit: "消费品定价权评估区分需求环境"
      trigger: "历史涨价成功但当前comp为负"
      origin: "CMG 2021-2023涨价20%客流正增长→2024-2025弹性>1, CEO不敢提价→同一品牌在不同环境下定价权完全不同"
      generalization: "定价权不是静态属性——必须在当前需求弹性下评估可用性"

  quality_feedback:
    strengths:
      - "DM密度1.64/千字(659个锚点)——数据锚定扎实"
      - "Reverse DCF+4方法+红队7问——估值方法论完整度高"
      - "WACC悖论的识别和处理——核心洞见有区分度"
      - "四因子P/E归因+承重墙分析——创造了可迁移的分析框架"
      - "温水煮青蛙情景——超越传统bull/bear二元, 刻画最可能的中间路径"
    weaknesses:
      - "HEEP效率评估依赖管理层声称的'数百bps'——偏差修正后仍有主观性"
      - "RT-2悲观偏差+4.5pp是meta-judgment而非公司特定证据——评级上调的关键依据置信度不够高"
      - "国际扩张期权($1.6-2.9B)评估粗略——仅~100家国际门店, 数据太少无法精确估值"

  hypothesis_tested:
    confirmed:
      - hypothesis: "LLM分析框架对消费品公司存在系统性悲观偏差(RCL/SBUX/IHG先例)"
        evidence: "CMG Phase 3→Phase 4悲观偏差修正+4.5pp(第四个消费品报告确认)"
        confidence_after: "中(模式持续但CMG修正幅度小于均值, 可能因Phase 3已预修正)"

      - hypothesis: "Reverse DCF P1前置有效防止结论先行偏差(铁律O)"
        evidence: "Ch13 Reverse DCF揭示B2(OPM扩张)是最脆弱信念→后续分析围绕验证B2展开, 未出现预设bias"
        confidence_after: "高(连续多报告确认)"

    extended:
      - hypothesis: "WACC悖论(CME报告中Core PE vs GAAP PE的延伸)"
        extension: "CME是'非经营性收入扭曲PE'→CMG是'资本结构扭曲WACC'——不同机制但同一个教训: 表面数字可能系统性误导"

    refuted: []

  limitations:
    - "WACC悖论的390bps缺口无法精确分割(品质溢价/增长期权/模型局限各占多少)→估值不确定性是结构性的"
    - "FY2026 H1 comp是最关键变量但报告时点无法获取→评级高度依赖未来数据"
    - "RT-2悲观偏差修正是统计外推而非公司特定分析→如果CMG是模式例外, 评级应维持审慎关注"
    - "Boatwright战略能力无法从运营数据判断→需等待独立战略决策(如国际扩张/新品牌)才能评估"
    - "CAVA竞争动态在3-5年时间框架内不确定性极高→替代比例30-35%是粗略估计"
