# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "PLTR是产品力顶级、增长质量罕见的公司, 但$135.68定价了打破全部企业软件历史先例的完美执行——牛案回报~0%, 任一承重墙裂缝下行40-80%"
  rating: "审慎关注"
  fair_value: "Core+Options $63-66 (SOTP $53-56 + PMX Options $9.7) | 条件区间: S1牛案$120-140 / S2基准案$55-75 / S3熊案$25-40"
  expected_return: "牛案(完美执行): ~3.9%/年(低于无风险利率) | 基准案: -45%至-60% | 熊案: -70%至-82%"

  key_arguments:
    - claim: "FY2025基本面质量属企业软件最顶尖5%"
      direction: bullish
      magnitude: 5
      mechanism: "Revenue +56%逐季加速(Q1+39%→Q4+70%) + NRR 139% + FCF Margin 47% + Rule of 40=103 + 零负债$7.2B现金 → AIP/Bootcamp引爆经营杠杆"
      kill_switch: "Q1 FY2026 US Commercial环比<+10% + NRR跌破125% → 增速是积压释放非结构性加速"

    - claim: "当前估值隐含打破全部企业软件历史先例, 非对称性极端偏空"
      direction: bearish
      magnitude: 5
      mechanism: "P/E 231x, EV/Sales 94x → Reverse DCF隐含5年CAGR 37%($4.5B→$22B) + FY2030仍40x P/E → 历史上$5B+规模维持37% CAGR的企业软件公司为零(最佳Salesforce仅26%且靠M&A)"
      kill_switch: "连续4季度超guidance + 国际商业破局(>20%增速) → 证明PLTR确实是历史异常值"

    - claim: "Ontology锁定效应真实但有3-5年窗口, 非永久护城河"
      direction: conditional
      magnitude: 4
      mechanism: "六层锁定模型(L1-L6)中L4-L6不可迁移 → 迁移成本$6-31M随部署深度指数增长 → 但Microsoft Fabric IQ语义契约正在追赶L1-L3 → 窗口取决于功能追赶速度"
      kill_switch: "Microsoft Fabric IQ获得3家PLTR现有客户公开部署案例 → 锁定窗口缩短至2年"

    - claim: "管理层行为与言辞存在显著矛盾"
      direction: bearish
      magnitude: 4
      mechanism: "Karp 3年卖出$2.2B+(41笔全卖零买) + 回购仅$75M(SBC的11%) + Class F永久控制权=卖出不影响控制 → 管理层行为('卖')与言辞('inexplicable growth')背离"
      kill_switch: "Karp启动大规模回购($500M+) 或连续2季度零卖出 → 矛盾消解"

    - claim: "SBC'改善'是光学效果, 非结构性变化(CI-1)"
      direction: bearish
      magnitude: 4
      mechanism: "SBC绝对值$684M基本未变(FY2024 $692M→FY2025 $684M) → 比率从50%降至15%纯靠分母Revenue+56% → 增速降至25%时SBC/Revenue将回升至18-20%"
      kill_switch: "SBC绝对值降至$500M以下 → 证明是真正的纪律改善而非分母效应"

  moat:
    composite_score: 7
    half_life: "Ontology锁定3-5年 | 政府安全认证>10年 | Bootcamp GTM可被模仿(2-3年) | 数据网络效应有限"
    dimensions:
      - type: switching_cost
        strength: 5
        evidence: "Ontology六层锁定模型: 迁移成本$6-31M随部署深度指数增长(关系网络按n^2增长); L5-L6不可迁移; 无外部强制迁移力"
        vulnerability: "Microsoft Fabric IQ + Databricks Unity Catalog追赶L1-L3; 功能达到80%水平时窗口关闭"
      - type: regulatory
        strength: 4
        evidence: "FedRAMP + IL5/IL6 + TS/SCI clearance; 竞争者需5-10年追赶; 20年政府信任积累"
        vulnerability: "Anduril在部分国防AI领域崛起; DOGE预算审查可能影响非核心合同"
      - type: network_effect
        strength: 2
        evidence: "跨客户模式学习(非数据共享); 每个客户Ontology独立, 网络效应有限"
        vulnerability: "不像社交网络有直接网络效应; 规模优势主要体现在产品迭代速度"
      - type: brand
        strength: 3
        evidence: "政府领域品牌极强(CIA/NSA/DOD 20年); 商业品牌仍在建立; 政府→商业信任传导在regulated industries有效"
        vulnerability: "'监控公司'形象在部分市场是障碍; 商业品牌依赖Bootcamp口碑而非独立品牌力"

  valuation:
    reverse_dcf_implied: "市场隐含5年CAGR 37%($4.5B→$22B) + FY2030 Net Margin 34% + Terminal P/E 40x — 四个关键变量中三个'极端'或'无先例'"
    methods_used: ["Reverse DCF", "SOTP", "FMP DCF", "OVM 7组件(期权估值)", "可比公司", "条件情景"]
    dispersion: "25.5x全范围($10.19-$260) / 5.6x核心范围($25-$140) — 已分析所有公司中最高"
    consensus_vs_ours: "市场看PLTR=AI操作系统Windows(Wedbush $260) | 我们看PLTR=Core $53-56 + Options $9.7 = $63-66, 溢价126%是未定义可能性的momentum溢价"
    entry_zone: "$50-80 (S2基准案区间, 对应PE 50-80x正常化后)"
    catalyst: "增速断崖(Q1 FY2026不达预期) 或 DOGE到期(2026-07-04)后政府合同萎缩 → 叙事崩塌→PE压缩→入场窗口"

  action_framework:
    verdict: "远离 — 当前价格定价了完美执行, 牛案回报~0%, 任一失败下行50%+"
    buy_triggers:
      - trigger: "增速断崖导致叙事崩塌: Q1 FY2026不达guidance + NRR跌破125%"
        price_zone: "$50-80 (S2基准案)"
        reasoning: "核心业务品质真实(NRR/FCF/Ontology锁定), 在合理估值下是优秀标的"
      - trigger: "系统性市场恐慌(非PLTR基本面问题)导致PE压缩"
        price_zone: "$60-80"
        reasoning: "如果基本面未恶化但PE从231x压缩至80-100x, 风险回报显著改善"
    hold_conditions:
      - "Ontology锁定未被Microsoft Fabric IQ实质侵蚀(无3家客户迁移案例)"
      - "NRR维持>125%"
      - "US Commercial季度环比增速>+10%"
      - "SBC/Revenue在增速放缓后不回升至>20%"
    sell_triggers:
      - signal: "NRR连续2季度跌破120%"
        severity: "action"
        action: "减仓50%, Ontology锁定叙事可能被证伪"
      - signal: "Microsoft Fabric IQ获得3家PLTR现有客户公开部署"
        severity: "action"
        action: "减仓50%, 护城河窗口正在关闭"
      - signal: "全年收入增速跌破+40% YoY且管理层下调guidance"
        severity: "emergency"
        action: "全部卖出, 增长叙事崩塌+PE 231x下行空间巨大"
      - signal: "Karp年度卖出加速至>$1.5B"
        severity: "warning"
        action: "减仓25%, 内部人信号进一步恶化"
    position_sizing: "当前价格: 不买(风险回报极端不对称) | $50-80区间: 小仓位探索(5-8%)"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "Ontology锁定的指数级放大机制"
    chain: >
      企业部署Ontology(L1数据管道+L2对象建模)
      → 关系网络按对象数n的平方增长(200个OT→1000+链接)
      → 每次深度升级(L3→L4→L5)的边际收益>边际成本=局部最优
      → 累积效果=全局锁定(总迁移成本$6-31M远超任何单次升级预期)
      → 且无外部强制迁移力(不像SAP有停止支持日期)
      → 理性选择=留在Palantir并持续扩展
      → 这解释了NRR 139%的架构层原因
    transferable_to: "所有通过渐进式嵌入制造锁定的企业软件(SAP/Salesforce/ServiceNow)"
    reasoning_habit: "评估锁定效应时追问'迁移成本是线性还是非线性增长' — 非线性=真正的护城河; 线性=可迁移"

  - id: "CC-2"
    name: "SBC分母效应的数学确定性"
    chain: >
      SBC绝对值$684M基本未变(FY2024 $692M→FY2025 $684M)
      → Revenue从$2.87B增至$4.48B(+56%)
      → SBC/Revenue从24%降至15% — 纯数学, 不需要任何结构性改善假设
      → 推论: 如果增速降至25%, SBC/Revenue将回升至18-20%
      → 投资者误将分母效应当作管理层纪律改善→给了不应有的估值溢价
      → 这是估值中最确定的看空论据(数学推导, 无需额外假设)
    transferable_to: "所有高增长掩盖SBC问题的科技公司(SNOW/CRWD等增速放缓后SBC比率反弹)"
    reasoning_habit: "看到SBC比率改善时, 分解分子vs分母贡献 — 纯分母效应=虚假改善"

  - id: "CC-3"
    name: "B型不确定性下传统估值框架失效"
    chain: >
      PLTR可能性宽度8/10(B型: 量级不确定)
      → 不同情景下PLTR是质的不同公司(政府承包商 vs AI操作系统)
      → 传统三情景DCF假设同一公司不同增速=类别错误
      → SOTP $53-56 + 独立期权$6.7 = $60-63仍远低于$135.68
      → 市场定价的是系统性期权成功而非独立期权
      → Optionality利用率126%(超越理论最大值) = 市场在为未定义的可能性付费
      → 需要Discovery System(映射可能性空间)而非传统估值(给点估计)
    transferable_to: "所有B型不确定性公司(TSLA/SpaceX/早期AI平台) — 传统估值给出的答案是数学正确但决策无用的"
    reasoning_habit: "当估值离散度>5x时, 放弃点估计→转为映射可能性空间+追踪Kill Switch判断哪个情景在实现"

  - id: "CC-4"
    name: "政府→商业的信任传导与收入结构转型"
    chain: >
      PLTR在CIA/NSA/DOD的20年部署→建立了处理最敏感数据的信任记录
      → 信任传导至regulated industries(金融/医疗/能源): '如果政府信任它处理机密情报, 你的供应链数据也安全'
      → Bootcamp GTM模式(5天PoC→签约)利用信任传导加速商业获客
      → US Commercial FY2025 +137% YoY vs 国际Commercial仅+2%
      → 信任传导在美国有效但在国际市场失效(美国政府客户的背书在欧洲/亚洲不被认可)
      → 这解释了CQ2(国际复制)的结构性障碍
    transferable_to: "所有从政府市场向商业市场扩展的公司(Anduril/Palantir/Booz Allen)"
    reasoning_habit: "政府背景公司拓展商业市场时, 追问'信任传导是否跨地域有效' — 地缘政治因素可能使传导完全失效"

  - id: "CC-5"
    name: "Ontology单点故障风险(飞轮反面)"
    chain: >
      PLTR的5条期权(中型企业AIP/国际扩张/DOGE/TITAN/Agent平台)全部建立在Ontology之上
      → Ontology既是最大优势(杠杆率100%)也是最大风险(单点故障)
      → 如果Microsoft Fabric IQ达到Ontology 80%功能水平
      → 不仅Ontology锁定效应减弱, 所有5条期权同时折价
      → 这与TSLA形成对比: TSLA有5个相对独立的技术路线, 单一失败不拖垮其他
      → PLTR的期权结构是高杠杆型(上行倍增/下行也倍增)而非分散型
    transferable_to: "所有单一技术平台承载多条期权的公司 — 需要评估期权相关性而非独立概率加权"
    reasoning_habit: "多期权叠加时, 检查相关性: 如果所有期权依赖同一基础设施, 独立概率加权会高估期望值"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "PLTR的SBC问题正在结构性改善(SBC/Revenue从50%降至15%)"
      final: "SBC绝对值$684M未变, 比率改善100%来自分母效应(Revenue +56%), 非结构性改善"
      pivot: "RT-7替代解释的数学推导: SBC FY2023 $476M(异常低)→FY2024 $692M→FY2025 $684M=回到$700M平台"

    - initial: "v2.0报告给出中性关注, 基本面足够好可以等待"
      final: "v3.0升级为审慎关注, 因为FY2025完整数据+红队揭示了承重墙双高脆弱性"
      pivot: "三个变化: (a)SBC分母效应确认; (b)承重墙1+墙3联动下行50%+; (c)9-CQ无一超55%"

    - initial: "NRR 139%证明产品-市场匹配极强"
      final: "NRR 139%中可能包含激进upselling成分(CI-2), GRR未披露→可能有客户流失被扩展掩盖"
      pivot: "Top 20客户$94M均值+45% YoY暗示头部驱动; 但长尾客户经济性和留存不可知"

  surprises:
    - finding: "Optionality利用率126% — 超越理论最大值, 意味着市场在为未定义的可能性付费"
      implication: "传统估值框架(Core+独立期权)根本无法解释当前价格→市场定价的是系统性叙事而非基本面"

    - finding: "PLTR增长效率$614K增量收入/人, 是Salesforce的13倍(CRM $46K/人)"
      implication: "AIP/Bootcamp实现了收入增长与人员增长的脱钩→如果可持续, 这是最强的经营杠杆证据"

    - finding: "估值离散度25.5x, 是已分析全部公司中最高的(TSLA 14.8x, AMD 4.42x)"
      implication: "B型量级不确定性的极端表现→任何单一目标价都是伪精度→只能映射可能性空间"

    - finding: "国际商业增速仅+2%, 与US Commercial +137%形成极端分化"
      implication: "PLTR目前本质是一家美国公司(US收入77%)→国际扩张可能是永久性天花板(CI-3)而非时间延迟"

  blind_spots:
    - area: "Bootcamp实际转化率"
      why_matters: "转化率>50%=产品-市场匹配极强; <20%=昂贵的销售演示 → 直接决定GTM引擎可规模化程度"
      monitor: "公司未来是否披露转化率; 客户增速vs Bootcamp频次的比例变化"

    - area: "GRR(毛收入留存率)"
      why_matters: "NRR 139%可能掩盖客户流失(GRR<90%=虚胖NRR) → 如果流失被激进upselling掩盖, 增速放缓时会暴露"
      monitor: "如果PLTR开始披露GRR; 小客户离职案例; NRR突然下降>10pp"

    - area: "FDE团队规模和产能瓶颈"
      why_matters: "FDE是Bootcamp的瓶颈; 如果FDE<600人, 571家客户已接近极限→规模化天花板"
      monitor: "员工总数增速; LinkedIn上PLTR FDE相关职位数量变化"

    - area: "AIP实际收入贡献占比"
      why_matters: "如果AIP收入<20%, 则FY2025增长加速并非AIP驱动→飞轮催化假设需修正"
      monitor: "公司是否披露AIP-specific收入; 如果披露且与四象限估算偏离>30%则需修正"

  sell_lessons:
    - scenario: "在P/E 231x持有等待完美执行→即使完美执行5年年化仅3.9%(低于无风险利率)"
      lesson: "极端估值下持有的机会成本是确定的(无风险利率), 而上行是概率性的且需要打破历史先例"
      transferable: "所有P/E>100x的高增长公司 — 完美执行的回报可能低于国债"
    - scenario: "创始人在股价高点系统性卖出$2.2B+, 市场未充分反映信号"
      lesson: "内部人行为是唯一不可伪造的信号; 当管理层言辞与交易行为背离时, 跟随交易行为"
      transferable: "所有创始人持续减持>10%持仓的公司 — Class F控制权使减持更值得警惕(不是为了维持控制)"
    - scenario: "等待国际商业破局再买入→国际增速+2%可能是永久性天花板"
      lesson: "区分'时间延迟'和'永久性障碍'是估值中最常见的乐观偏差 — GDPR/文化差异是结构性的"
      transferable: "所有US-dominant SaaS公司的国际扩张假设 — 美国成功不等于全球复制"

