      similarity: "同为企业AI/数据平台, 高毛利SaaS模式, 类似规模轨迹(NOW在$5B时增速23%)"
      key_difference: "NOW增速更成熟稳定(23% vs 56%), 估值更合理(20x EV/Sales vs 94x) | NOW是PLTR估值'正常化'后的可比锚"

    - ticker: SNOW
      similarity: "同为数据平台, 类似增速阶段(28%), B型不确定性"
      key_difference: "SNOW在数据层(storage/compute), PLTR在操作层(Ontology/Actions) | SNOW估值15x EV/Sales vs PLTR 94x → PLTR溢价6.3倍"

    - ticker: CRM
      similarity: "同为企业软件平台, CRM在$5B规模时增速26%(PLTR最佳可比锚)"
      key_difference: "CRM靠M&A增长(Slack $27.7B/Tableau $15.7B) vs PLTR纯有机 | PLTR增长效率13倍于CRM"

  comparative:
    - dimension: "增长质量(Rule of 40)"
      position: "PLTR (103) >> CRWD (63) > DDOG (58) > NOW (56) > SNOW (53) > CRM (39)"
      reasoning: "PLTR的103是企业软件历史上极罕见的数字, 由56%增速+47% FCF Margin驱动"

    - dimension: "估值水平(EV/Sales)"
      position: "PLTR (94x) >> CRWD (22x) > NOW (20x) > DDOG (18x) > SNOW (15x) > CRM (7x)"
      reasoning: "PLTR的EV/Sales是第二名的4.3倍 — 增速优势是否值得4.3倍溢价是核心争议"

    - dimension: "护城河持久性"
      position: "PLTR (Ontology锁定3-5年) < NOW (IT流程锁定>10年) < CRM (CRM数据锁定>10年)"
      reasoning: "Ontology锁定真实但有窗口; Microsoft Fabric IQ是确定性威胁; 传统企业软件锁定更持久"

    - dimension: "增长效率(增量Revenue/员工)"
      position: "PLTR ($614K) >> CRWD ($120K) > DDOG ($115K) > NOW ($110K) > CRM ($46K)"
      reasoning: "AIP/Bootcamp实现收入增长与人员增长脱钩 — 这是PLTR最强的结构性优势"

