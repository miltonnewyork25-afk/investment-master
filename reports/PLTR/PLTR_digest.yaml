    - signal: "SBC绝对值趋势(非比率)"
      why_alpha: "市场看SBC/Revenue(15%, 改善), 我们看SBC绝对值($684M, 未变) — 两者给出相反信号"
      current_reading: "$684M(FY2025) vs $692M(FY2024) — 基本持平, 分母效应确认"
    - signal: "Optionality利用率(Core+Options vs 市价)"
      why_alpha: "当利用率>100%时, 市场在为未定义的可能性付费 — 这是泡沫或涌现TAM的最早预警"
