    - signal: "国际商业季度增速"
      bullish_threshold: ">20% YoY(国际破局→TAM从$15-20B扩至$40-50B)"
      bearish_threshold: "维持<5% YoY(永久性天花板确认→CI-3成立)"
    - signal: "Microsoft Fabric IQ客户部署案例"
      bullish_threshold: "零PLTR客户迁移案例(锁定效应完整)"
      bearish_threshold: "3家PLTR现有客户采用Fabric IQ(KS-08触发)"

  noise_signals:
    - signal: "日度/周度股价波动"
      why_noise: "P/E 231x下价格波动放大→日度波动反映散户情绪而非基本面变化"
    - signal: "分析师目标价调整($70-$260范围)"
      why_noise: "离散度25.5x说明分析师对PLTR完全没有共识→单个PT调整无信息量"
    - signal: "散户情绪指标(Reddit/WSB讨论热度)"
      why_noise: "PLTR是散户最热门标的之一→情绪波动是常态, 不反映基本面变化"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
