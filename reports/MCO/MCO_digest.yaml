    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "温水煮青蛙: MA增速>MIS→OPM每年-0.3pp→5年累计EPS仅+10-15%(vs收入+30-40%)"

  novel_patterns:
    - name: "利润率混合陷阱(OPM Mix Trap)"
      description: "双分部OPM差异>20pp且低OPM分部增速更快→总OPM数学必然下行→PE天花板信号"
      transferable_to: ["所有双分部OPM差异>20pp的公司", "SaaS+Services混合体", "平台+硬件混合体"]

    - name: "回购eta效率曲线"
      description: "eta=盈利收益率/WACC → PE越高eta越低→回购越毁灭价值, 但管理层被锁定在回购循环中"
      transferable_to: ["所有PE>25x且积极回购的公司", "CME/MSCI/SPGI类垄断"]

    - name: "犯错模式2(周期错判)入场框架"
      description: "垄断+周期暴露=5-8年一次的PE暴跌→三档入场闹钟(★★★/★★/★)→等待成本vs机会成本量化"
      transferable_to: ["所有周期性暴露的垄断企业", "半导体设备/航运/能源垄断"]

    - name: "确定性溢价量化(隐含WACC vs CAPM WACC)"
      description: "反向求解隐含WACC, 与CAPM差距=市场赋予的确定性溢价→历史区间比较→判断溢价是否过高"
      transferable_to: ["所有PE>30x的'品质'公司", "消费品龙头/医药龙头/公用事业"]

    - name: "收入/利润替代比(Revenue/Profit Substitution Ratio)"
      description: "私信替代公开债时MCO收入替代比5-7:1, 利润替代比10:1→新增10个MA客户才抵消1个MIS流失"
      transferable_to: ["所有面临业务替代且新旧业务margin差异大的公司"]

    - name: "v1.0→v2.0铁律K(估值统一性)"
      description: "Phase 4修正必须回流所有前序章节→报告中同一数字只能有一个版本→防止'四方法说高估但评级说低估'的矛盾"
      transferable_to: ["所有多阶段分析框架", "任何含多人/多阶段的研究流程"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "制度嵌入有'边界裂缝'——私信市场$3.5T不受五层保护, 每条护城河都有其不适用的边界"
        implication: "护城河评估应增加'边界裂缝分析': 哪些新兴市场/模式不在护城河覆盖范围内"
      - insight: "五层嵌入的半衰期可以逐层精确量化(L1 25年/L2 15年/L3 30年+/L4不可能/L5无法定时)"
        implication: "制度嵌入型护城河应逐层评估衰减时间表——最短的一层决定变化速度, 最长的一层决定下限"
      - insight: "MIS定价权是'入场券'模型(不买=不能发债) vs MA是'功能溢价'模型(不买=用竞品)→同一公司内定价权性质可能截然不同"
        implication: "B4定价权评估应按分部分层而非统一打分——分部级定价权差异可能极大"

    valuation_insights:
      - insight: "确定性溢价可量化: 隐含WACC vs CAPM WACC的差距=市场额外支付的折扣率→有历史区间可比较"
        implication: "对所有PE>30x的品质公司, 增加'确定性溢价是否合理'检验——超出历史区间上沿=高估信号"
      - insight: "Forward PE在周期高点是幻觉——分母EPS含非经常性支撑, 衰退时实际PE可能翻倍"
        implication: "对含>30%周期性收入的公司, Forward PE应附带'衰退调整PE'(用mid-cycle EPS计算)"
      - insight: "铁律K: 报告中所有估值数字方向一致性>任何单一方法的精度——5/6说高估但评级说低估=致命矛盾"
        implication: "估值结论前增加'方向一致性检查': ≥60%方法方向一致才能定评级"

    screening_insights:
