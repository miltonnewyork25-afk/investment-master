# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-BIZ-01"
    name: "NRSRO五层制度嵌入→切换成本以'年'而非'月'计"
    chain: >
      Basel III风险权重硬编码MCO评级符号
      → 保险公司IPS引用MCO评级限制持仓
      → 债券契约嵌入MCO评级触发条款(存量30年期到2054年)
      → 央行抵押品资格认定依赖MCO评级
      → 市场惯例(Bloomberg第一筛选条件=评级)
      → 五层互锁=单层拆除无法解除依赖
      → 切换不是'高成本'而是'制度上不可能'
    transferable_to: "所有受法规强制嵌入的基础设施(清算所/支付网络/FICO)"
    reasoning_habit: "护城河分析时追问'不用的制度代价是什么'——如果代价是监管处罚而非仅不便, 护城河性质不同"

  - id: "CC-BIZ-02"
    name: "MIS/MA利润差→OPM数学必然下行(CI-MCO-001)"
    chain: >
      MIS OPM 63.6% vs MA OPM 33.1% = 30.5pp鸿沟
      → MA增速8% > MIS增速6% → MA占比每年+1-1.6pp
      → 每1pp MA占比上升 → 总OPM下降0.31pp
      → 5年后MA占比53-55% → 总OPM从52%降至49%
      → 3pp OPM下降 × $7B收入 = ~$210M利润蒸发 × 30x PE = ~$6.3B市值(8%)
      → 方向不可逆, 除非收购高OPM业务或MIS增速反超
    transferable_to: "任何双分部OPM差异>20pp且低OPM分部增速更快的公司"
    reasoning_habit: "看到混合业务时, 先算'混合效应方向'——高增速低利润+低增速高利润=OPM必然下行"

  - id: "CC-VAL-06"
    name: "Forward PE错觉→周期高点EPS的双杀陷阱"
    chain: >
      Forward PE 26.3x(基于FY2026E $16.75) → 看似'便宜'
      → 但FY2026E EPS含到期墙非经常性支撑(2027年$1.26T到期)
      → 衰退(概率35-48%)→发行冻结→EPS回落至$10-11
      → 实际Forward PE变为40-44x(历史从未维持超过6个月)
      → EPS-37% × PE压缩-27~-33% = 股价$220-275(-38~-50%)
      → '便宜'的Forward PE是建立在周期高点EPS上的幻觉
    transferable_to: "所有在周期高点用Forward PE判断估值的周期股"
    reasoning_habit: "看到低Forward PE时追问'分母EPS的持久性'——周期高点EPS给的低PE是幻觉"

  - id: "CC-VAL-07"
    name: "WACC隐含确定性溢价→$441要求债券级确定性"
    chain: >
      CAPM WACC = 9.7% → $441在此WACC下无法合理化
      → 反向求解: $441仅在隐含WACC 7.5%时合理
      → 7.5%隐含风险溢价仅3.0%(接近债券基金2-3%)
      → 市场将MCO视为'准债券'确定性
      → 但FY2022 EPS-37%证伪'债券级确定性'
      → 2.2pp确定性溢价处于历史区间上沿(合理范围1.0-1.5pp)
    transferable_to: "所有隐含WACC远低于CAPM WACC的'品质溢价'公司"
    reasoning_habit: "反向求解隐含WACC, 与CAPM比较——差距越大, 市场赋予的'确定性溢价'越高, 需要追问是否合理"

  - id: "CC-VAL-10"
    name: "eta回购效率→高PE回购是价值摧毁的自我强化循环"
    chain: >
      PE 33x → 盈利收益率3.0% → eta = 3.0%/WACC 8.75% = 0.34x
      → 每$1回购仅保留$0.34价值 → 年$1.7B回购 × 66%摧毁 = $1.1B/年
      → 但管理层无法停止: 停止=信号效应+EPS增速暴露+股东结构恶化
      → PE越高→回购效率越低→但不敢停→EPS人为膨胀→PE维持→循环
      → 只有PE<22x(eta>0.5)时回购才变中性到有利
    transferable_to: "所有PE>25x且年回购>FCF 30%的公司"
    reasoning_habit: "看到大额回购先算eta=盈利收益率/WACC——eta<0.8即价值摧毁, 不管管理层怎么说"

  - id: "CC-RISK-11"
    name: "R1+R8衰退双杀→-38~-50%的完整传导链"
    chain: >
      衰退 → 信用利差走阔(OAS 100→300bp) → 发行人推迟发债
      → MIS交易性收入-20~35% → 经营杠杆3x放大为利润-40~50%
      → MA缓冲13-18pp(CC-BIZ-04) → 但EPS仍-30~40%
      → 卖方下调→ETF再平衡卖出→正反馈回路
      → 市场身份重估: '稳定订阅'(PE 33x)→'周期股'(PE 22-25x)
      → EPS-37% × PE-30% = 股价-38~-50% → 恢复18-24月
    transferable_to: "所有含>30%周期性收入但按稳定型估值定价的混合业务公司"
    reasoning_habit: "对混合业务公司, 用'最差分部的波动率'而非'混合波动率'来校准PE合理性"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "v1.0评级'关注(偏中性)', 期望回报+15.1%"
      final: "v2.0评级'审慎关注', 期望回报+2.7% — 低于无风险利率4.3%"
      pivot: "Phase 4红队发现Bear权重不足(28%→33%)+新增5%极端Bear, 但v1.0未将修正回流Phase 5 → 铁律K诞生"

    - initial: "BRK持仓14.54%=估值背书"
      final: "BRK不卖有三层原因: 税务锁定($8-11B收益)+头寸流动性约束+确实看好, 仅第三点与当前估值相关"
      pivot: "分离'持有原因'后发现结构性约束(税+流动性)比品质判断权重更大"

    - initial: "MCO是纯信息服务公司, 应获SaaS级PE"
      final: "MCO是半周期+半SaaS混合体, 36%交易性收入使其波动率远超SaaS"
      pivot: "FY2022 EPS -37%是3年前的事实 — PE 33x隐含衰退概率<15%, 但多个模型指向35-48%"

  surprises:
    - finding: "CI-MCO-001利润率混合陷阱——MA越成功, MCO整体OPM越难突破, 这是算术必然而非管理问题"
      implication: "PE天花板信号: 如果市场按'OPM扩张→EPS加速'定价, 数学上这个叙事在FY2028+不成立"

    - finding: "CI-MCO-004回购eta=0.34x, 5年累计$5.6B价值摧毁——但管理层被锁定在回购循环中无法停止"
      implication: "回购不是资本配置纪律的信号, 而是'PE越高回购越毁灭→但越不敢停→PE越膨胀'的自我强化陷阱"

    - finding: "MCO/MSCI/CME三家CQI顶尖公司2020-2026全部跑输SPY — 品质最高≠回报最高"
      implication: "垄断企业Alpha只来自犯错瞬间(FY2022 MCO $250), 非犯错期持有=fair return at best"

    - finding: "GenAI留存率97%的'超额'被长尾传统客户加速流失(-3pp)部分对冲 — 整体改善仅1-2pp"
      implication: "管理层AI叙事存在选择性呈现, MA正经历'AI分层': 高价值客户更粘但长尾TAM缩窄"

  blind_spots:
    - area: "衰退时机和深度"
      why_matters: "衰退概率35-48%但时机不确定 — FY2027(到期墙消化)vs FY2029(下一周期) → 差别是$325入场机会何时出现"
      monitor: "NBER指标 + 信贷利差(IG OAS) + 杠杆贷款违约率 + Moody's Analytics衰退概率"

    - area: "私信替代公开债的拐点"
      why_matters: "私信AUM $3.5T→$5T, 收入/利润替代比10:1 — 拐点出现在2028-2030 → 决定MIS长期增速是6%还是3-4%"
      monitor: "私信年度AUM增速 + 公开债发行量占比趋势 + MCO私信评级业务收入(如有)"

    - area: "MA OPM改善路径"
      why_matters: "GenAI能否提升MA OPM是CI-MCO-001的唯一破解变量 — 如果MA OPM从33%升至40%+, 混合陷阱大幅缓解"
      monitor: "季度MA Adj OPM趋势 + CreditLens ARPU变化 + GenAI渗透率"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "PE>30x+周期高位EPS(如当前$441/PE 33x) → 期望年化仅+2.7%"
      lesson: "垄断企业的卖出纪律=PE上限。品质不随PE变化, 但回报随PE急剧非线性变化"
      transferable: "所有CQI>70但有机增速<10%的垄断公司(CME/MSCI/SPGI类)"
    - scenario: "v1.0未将红队修正回流Phase 5 → 评级与估值自相矛盾 → 铁律K诞生"
      lesson: "报告中估值数字必须只有一个版本——Phase 4修正必须回流所有章节, 否则结论失效"
      transferable: "所有多阶段分析流程: 后期修正必须回流前期结论"
    - scenario: "温水煮青蛙: 收入+30-40%但EPS因OPM滑落仅+10-15% → 5年年化3.8%低于国债"
      lesson: "混合业务的'慢性病'比急性危机更危险——每个季度'还行'但累积效应吃掉全部回报"
      transferable: "所有存在结构性利润率下行趋势但被掩盖在收入增长中的公司"

