        implication: "选股筛选增加'品质陷阱过滤器': CQI/增速比值>7 + PE>30x → 标记为等待型"
      - insight: "eta<0.5 = 回购价值摧毁信号 → 管理层在高PE下回购是代理人问题而非资本纪律"
        implication: "选股时增加'回购效率'筛选: eta=E/P÷WACC<0.5 + 年回购>$1B → 标记资本配置风险"
      - insight: "周期性收入占比>30%但PE>30x = 周期记忆衰退定价 → 衰退时双杀潜力-38~-50%"
        implication: "选股增加'周期记忆检查': 交易性收入占比>30% + PE>历史均值+1σ → 标记周期高位风险"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "对混合业务公司先算'混合效应方向'"
      trigger: "双分部OPM差异>15pp且增速不同"
      origin: "MCO MIS 64% vs MA 33% OPM差异30.5pp→MA更快=总OPM必然下行"
      generalization: "任何混合业务的OPM趋势不取决于'两个分部各自改善多少'而是'高OPM分部占比在增还是减'"

    - habit: "看到高PE垄断先算eta回购效率"
      trigger: "PE>25x + 年回购>FCF 30%"
      origin: "MCO eta=0.34x @PE 33x → $5.6B累计价值摧毁但管理层被锁定无法停止"
      generalization: "高PE回购是双重税: 显性(资本利得税)和隐性(eta<1的价值损耗)→PE越高双重税越重"

    - habit: "垄断企业分析时将'发现品质'和'发现价格'严格分离"
      trigger: "CQI>70 + 分析师覆盖>10"
      origin: "MCO/MSCI/CME三家CQI顶尖但全部跑输SPY→品质是共识, Alpha只在犯错瞬间"
      generalization: "品质分析的产出不是'要不要买'而是'什么价格买'→买入纪律比发现能力更重要"

    - habit: "反向求解隐含WACC评估市场定价的确定性假设"
      trigger: "PE>30x + 公司有任何周期性暴露"
      origin: "MCO隐含WACC 7.5% vs CAPM 9.7% → 市场赋予债券级确定性 → FY2022 EPS-37%证伪"
      generalization: "隐含WACC与CAPM差距>1.5pp = 确定性定价过头信号, 需寻找历史证伪事件"

  quality_feedback:
    strengths:
      - "DM密度2.57/千字(757个锚点) — 数据锚定扎实, 远超1.5/千字门控"
      - "铁律K全文估值统一性 — 从v1.0三层矛盾到v2.0零矛盾, 方法论突破"
      - "六种犯错模式+三档入场框架 — 首次将'什么时候买'量化为PE Band + 概率 + 等待成本"
      - "15条显式因果链补丁 — 将因果密度从3.89/万字提升至6+/万字"
