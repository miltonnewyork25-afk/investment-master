      - insight: "飞轮失效后规制壁垒成为核心资产 — 讽刺的是拆分可能释放更多价值(甩掉复杂度税)"
        implication: "当DOJ/FTC要求拆分时, 不应自动假设负面 — 需要做SOTP vs 整合估值的严格对比"

    valuation_insights:
      - insight: "MCR敏感性量化(每100bps→EPS $2.96)+Python验证 — 比定性'MCR恶化是负面'有效10倍"
        implication: "所有保险公司估值应首先做loss ratio敏感性建模, 用Python验证而非手工计算"
      - insight: "三层P/E折价分解精确估计了恢复上限(16-18x vs 天真的25x) — 防止被历史均值回归误导"
        implication: "面临监管结构变化的公司, 不能用历史P/E均值做目标 — 需要分离永久折价和可恢复折价"
      - insight: "五情景联合概率测试(8.3% vs 隐含35%) — 暴露了情景分析中的概率幻觉"
        implication: "所有情景分析应做条件依赖分析 — 多条件联合概率远低于单因素概率乘积"

    screening_insights:
