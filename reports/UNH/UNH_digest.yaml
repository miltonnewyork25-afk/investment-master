# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "MCR传导链: 医疗成本→利润→估值的四阶段崩塌"
    chain: >
      后COVID利用率追赶(递延手术/诊断释放)
      → GLP-1药物(Ozempic/Wegovy)成为结构性成本+80-130bps
      → CMS V28编码调整削减MA支付
      → MCR从79%(2020)飙升至89%(2025)
      → OPM从8.7%压缩至4.2%
      → 收入+74%但利润反降15%
      → MCR每变100bps→EPS变$2.96(Python验证)
      → MCR均衡落点(82%? 85%? 87%?)直接决定估值区间($668→$95)
    transferable_to: "所有MCR/loss ratio驱动的保险公司(HUM/ELV/CI/CNC)及再保险"
    reasoning_habit: "对保险公司永远先问'loss ratio的均衡水平是什么' — 收入增长在loss ratio恶化时不创造价值反而摧毁价值"

  - id: "CC-2"
    name: "有毒增长: 逆规模效应的识别逻辑"
    chain: >
      MA会员增长+755K(FY2025)
      → 新会员MCR比预期高2x
      → 增量保费<增量医疗成本
      → 增量OPM=-28%(每多$1收入亏$0.28)
      → 这是逆规模效应: 规模→亏损而非规模→利润
      → 因此2026年主动收缩(退出109个县)是正确策略
      → 收入下降是好消息(止血)而非坏消息
    transferable_to: "所有loss ratio恶化期的保险公司 + 增长但亏损的互联网/SaaS公司(GMV增长但unit economics为负)"
    reasoning_habit: "计算增量OPM而非平均OPM — 如果增量OPM为负,增长=毁灭价值,收缩=创造价值"

  - id: "CC-3"
    name: "身份决定估值框架的双向案例"
    chain: >
      保险标签→用MCR模型分析→P/E 12-15x(CI/ELV)
      平台标签→用SaaS模型分析→P/E 20-30x(Veeva/Evolent)
      → UNH当前Optum利润占53%但市场只给31%平台权重
      → 反向身份折价-22pp(vs ETN正向身份溢价+38.5pp)
      → 但Optum Health OPM仅2.3%不配平台标签
      → 只有Optum Insight(OPM 19%)接近平台级别,但仅占Optum收入7%
      → 结论: 折价部分合理(60%概率)部分过度(40%概率)
    transferable_to: "所有混合业务被单一标签定价的公司(CVS/Amazon/Berkshire) + 所有身份重定价中的转型公司"
    reasoning_habit: "追问'市场用什么模型给这家公司定价' — 模型选错=估值基础错=价格错"

  - id: "CC-4"
    name: "飞轮真伪检验: 5环节逐一量化"
    chain: >
      UNH声称飞轮: UHC会员→Optum数据→精算优势→更好产品→更多会员
      → 逐一检验5环节: 仅2/5有效(UHC→数据, 数据→精算)
      → 3/5失效: 精算→产品(MCR恶化证伪) + 产品→会员(主动退出) + 会员→利润(逆规模效应)
      → 更重要: 62%内部收入=自交易, 溢价61%(Health Affairs)=DOJ标靶
      → 飞轮是"减速带"(线性价值)而非"方向盘"(指数价值)
      → 协同$4.4B/年中约50%可能是自交易而非真实协同
    transferable_to: "所有声称有飞轮效应的垂直整合公司 — 尤其内部交易占比>50%的"
    reasoning_habit: "飞轮检验必须逐环节: (1)每环节有硬数据支持吗 (2)内部交易占比多少 (3)去除自交易后飞轮还转吗"

  - id: "CC-5"
    name: "三时代框架: 建设→膨胀→清算的周期识别"
    chain: >
      建设期(2016-2019): Optum投资期, ROE稳步提升, 护城河深化
      → 膨胀期(2020-2023): COVID利用率抑制→MCR异常低→利润膨胀→并购加速→回购加速
      → 清算期(2024-2025): 利用率反弹→MCR飙升→膨胀利润被清算→利润崩塌
      → 当前处于清算期尾声→下一阶段=均衡期(MCR 85-87%, OPM 5-7%)
      → 这不是能力丧失而是虚胖被挤出
    transferable_to: "所有后COVID利润膨胀后正在经历正常化的公司 — 识别'膨胀利润'vs'真实能力'的框架"
    reasoning_habit: "对任何利润大幅波动先问: '这是能力变化还是周期位置变化?' — 后COVID的利润高峰往往是膨胀而非能力"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "UNH跌53%是超卖,Forward P/E 14.3x是历史最低=买入机会"
      final: "P/E折价-6x中约-2.5x是永久的(制度折价), 仅-2.1x是可恢复的认知折价"
      pivot: "李录三层折价分解: 基本面-3.5x+制度-2.5x+认知-2.1x → P/E上限16-18x而非历史25x"

    - initial: "Optum是UNH护城河的核心——UHC+Optum飞轮创造超额利润"
      final: "飞轮仅2/5有效, 62%内部收入是自交易, 协同约50%可能是DOJ标靶"
      pivot: "Ch13逐环节量化验证 + Health Affairs自交易溢价61%研究 + Optum Health FY2025 GAAP亏损$278M"

    - initial: "收入增长12%是正面信号"
      final: "增量OPM=-28%意味着增长在毁灭价值, 2026收缩才是正面信号"
      pivot: "分部增量利润分解: UHC增量OPM=-11%, Optum Health N/A, Rx仅+1.4%, 仅Insight=+100%"

  surprises:
    - finding: "回购η=0.51, 5年摧毁$19.2B(市值7.4%) — 管理层在高位($450-550)大量回购而在低位($250-300)只象征性买入"
      implication: "回购顺周期陷阱是UNH级别公司的系统性问题 — 管理层追随盈利(有钱就买)而非估值(便宜才买)"

    - finding: "拆分后合计SOTP仅$147-207B vs 当前EV $312B — 30-50%的'整合溢价'可能不存在"
      implication: "DOJ强制拆分对股东可能是中性至温和负面(非灾难) — UHC-Standalone甩掉复杂度税后可能估值更高"

    - finding: "P/E恢复上限16-18x(非历史25x) — 即使MCR恢复+恐慌消退, 制度折价-2.5x是永久的"
      implication: "UNH的'准公用事业化'是结构性的(DOJ/SIFI/PBM立法) — 投资者不应期待P/E回到2020-2023水平"

    - finding: "并购ROI 6-7% < WACC 9% — 10年并购史中$100B+的收购创造的是复杂度而非协同"
      implication: "大型保险公司的垂直整合并购往往毁灭价值 — ROI<WACC应成为所有并购审计的第一道门控"

  blind_spots:
    - area: "GLP-1对MCR的精确影响(80-130bps还是200-300bps)"
      why_matters: "GLP-1是MCR均衡水平的决定性变量 — 如果影响200-300bps, MCR均衡86-87%而非85%→整体估值下移$30-50"
      monitor: "GLP-1渗透率季度数据 + biosimilar FDA批准时间线 + OTC场景($100/月)是否实现"

    - area: "DOJ刑事调查严重性(和解vs起诉)"
      why_matters: "和解$5-8B(S2)vs刑事起诉$15B+(S4) — 差距>$10B(~$11/share)"
      monitor: "DOJ正式指控/和解动态 + Hemsley个人法律风险 + 2026年下半年可能有重大进展"

    - area: "Hemsley的'维持性CEO'激励结构"
      why_matters: "期权行权价$350-500(全部水下)→最佳策略是稳态优化而非激进重建→S1($650)所需的激进重建被激励结构阻断"
      monitor: "2026 proxy filing中的薪酬结构变化 + 是否下调行权价或授予新RSU"

  # v1.2新增: 卖出时机教训
  sell_lessons:
    - scenario: "MCR连续4Q>88%不卖→γ螺旋激活→股价从$284到$95(-67%)"
      lesson: "保险公司的MCR/loss ratio是Kill Switch级别指标 — 连续恶化不是'周期性'而可能是结构性转变"
      transferable: "所有保险公司(HUM/ELV/CI) + 任何loss ratio驱动的业务"
    - scenario: "等待MCR恢复但P/E继续压缩→'盈利恢复+倍数压缩'陷阱→$17.85×12x=$214"
      lesson: "盈利恢复不等于股价恢复 — 如果市场同时在重定价倍数(从平台→公用事业), 利润恢复可能被倍数压缩完全抵消"
      transferable: "所有正在经历身份重定价的公司(从成长→价值, 从平台→传统)"
    - scenario: "高位不卖→insider在$450-550大量卖出时未作为信号→跌53%"
      lesson: "insider大规模净卖出(尤其是异常规模/频率)应作为仓位审查触发器 — 内部人对恢复的信心可能远低于市场"
      transferable: "所有insider交易数据公开的公司 — 尤其是C-suite级别的异常减持"

