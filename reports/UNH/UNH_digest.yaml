        implication: "选股时增加'回购效率'筛选: 计算η值而非仅看回购金额 — η<0.7标记资本配置风险"
      - insight: "insider异常净卖出+恢复叙事=信息不对称警告"
        implication: "选股增加insider行为与卖方叙事一致性检查 — 严重分歧时降低信心"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "保险公司首先看loss ratio均衡水平而非收入增速"
      trigger: "分析任何保险/MCO公司"
      origin: "UNH收入+74%但利润-15% — 增长在MCR恶化时不创造价值"
      generalization: "对所有利润率高度敏感的行业(保险/航空/零售), 利润率趋势比增速更重要"

    - habit: "计算增量OPM而非关注平均OPM"
      trigger: "公司收入增长但利润增速不同步"
      origin: "UNH增量OPM=-28%暴露了'增长越多亏越多'的逆规模效应"
      generalization: "增量OPM为负=stop sign。适用于所有行业 — 成本结构恶化中的增长是有毒的"

    - habit: "对P/E折价做三层分解(基本面+制度+认知)"
      trigger: "P/E大幅低于历史均值(>30%折价)"
      origin: "UNH P/E从25x→14x, 三层分解证明仅-2.1x(33%)是可恢复的"
      generalization: "不是所有折价都是买入机会 — 识别永久折价是防止价值陷阱的关键"

    - habit: "对飞轮叙事逐环节验证+检测自交易占比"
      trigger: "公司声称垂直整合创造飞轮效应"
      origin: "UNH飞轮5环节中仅2有效+62%内部收入是自交易"
      generalization: "飞轮叙事是最常被高估的护城河类型 — 大部分'协同'是强制转介而非效率提升"

  quality_feedback:
    strengths:
      - "MCR敏感性量化(每100bps→$2.96 EPS) + Python验证 — 将核心变量精确到可投资的精度"
      - "五情景概率加权+条件依赖分析(联合概率8.3% vs 35%) — 暴露概率幻觉的系统性方法"
      - "红队7问有效(5/7新发现) + 圆桌4独特洞见(维持性CEO/准公用事业/衰退盲点/凸性) — PW从$302→$277"
      - "DM密度1.13/千字, 343个锚点 — 超合格门控"
    weaknesses:
      - "GLP-1对MCR的精确影响是C级数据(80-130bps范围过宽) — 核心变量的数据质量不足"
      - "Optum内部经济学依赖大量推算(内部交易额/自交易溢价) — 10-K披露不足导致推断多于事实"
      - "缺少11维度记分卡(D1-D11) — 无法与其他报告直接比较质量分数"

  hypothesis_tested:
    confirmed:
      - hypothesis: "回购@高PE毁灭价值 (CME CI, η=0.59)"
        evidence: "UNH η=0.51@更高PE, 5年摧毁$19.2B — 更极端的确认"
        confidence_after: "高(三份报告独立确认: CME/MCO/UNH)"

      - hypothesis: "飞轮叙事通常被高估 (CME飞轮摩擦力45%)"
        evidence: "UNH飞轮仅2/5有效+自交易溢价61% — 更严重的失效"
        confidence_after: "高(CME飞轮摩擦+UNH飞轮失效=飞轮质疑应成为默认检查)"

    extended:
      - hypothesis: "身份决定估值框架 (ETN身份溢价+38.5pp)"
        extension: "UNH反向身份折价-22pp — 从正向(ETN被高估)扩展到反向(UNH被低估) → 身份错配是双向的"

      - hypothesis: "Core PE剥离非经营性收入 (CME利息$900M)"
        extension: "UNH不需要Core PE, 但三层折价分解是同一思路的升级 — 从单一调整扩展到多因子折价分解"

    refuted: []

  limitations:
    - "MCR均衡水平预测本质上依赖对未来医疗利用率的判断 — 这是一个不可精确预测的变量(置信区间极宽)"
    - "DOJ调查结果不可预测 — 和解$5B vs 刑事$15B+的差距巨大, 但概率赋值(55%和解)缺乏硬锚定"
    - "Optum内部经济学严重依赖推算 — 10-K不披露内部转移定价/VBC合约级盈利/自交易溢价的精确数据"
    - "缺少11维度记分卡 — 无法给出与其他Tier 3报告可比的质量分数"
    - "圆桌修正后PW $277 vs P4 $293 — $16差额来自衰退情景叠加, 但衰退概率(20%)本身是主观判断"
