# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含FCFF CAGR 4.5-5.5%(历史的一半)+OPM永久压缩至5.5%+永久折价-6x"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "7个RT红队 + 联合概率测试(8.3% vs P3隐含35%) + 6偏差审计 + 圆桌4洞见 → PW从$302→$277"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "MCR渐进恶化(79%→89%跨5年)=温水煮青蛙 + 管理层叙事(利润率会恢复)掩盖结构性变化"

  novel_patterns:
    - name: "有毒增长(增量OPM为负的识别)"
      description: "当loss ratio恶化时收入增长=价值摧毁(增量OPM负)→收缩是创造价值的正确策略"
      transferable_to: ["所有保险公司loss ratio恶化期", "GMV增长但unit economics为负的互联网公司", "利用率超载的医院系统"]

    - name: "反向身份折价(混合业务被单一标签低估)"
      description: "高利润业务(Optum 53%利润)被低P/E标签(保险)系统性压制→实际平台权重31%远低于利润占比53%"
      transferable_to: ["CVS(药店标签压制保险+PBM)", "Amazon(电商标签压制AWS+广告)", "Berkshire(保险标签压制实业+投资)"]

    - name: "三层P/E折价分解(基本面+制度+认知)"
      description: "P/E折价不是单一原因→分解为基本面折价(取决于恢复)+制度折价(永久)+认知折价(可恢复)→精确估计P/E恢复上限"
      transferable_to: ["所有面临监管结构性变化的公司", "所有经历身份重定价的公司"]

    - name: "回购顺周期陷阱(η函数扩展)"
      description: "管理层在高位大量回购→η<0.7→价值摧毁; 但在低位(真正该买时)却减少或停止回购→系统性逆效率"
      transferable_to: ["所有大额回购的公司", "尤其PE>20x且回购占FCF>30%的"]

    - name: "飞轮自交易检测(内部收入占比>50%=警告)"
      description: "声称飞轮效应但内部收入占62%+自交易溢价61%→'协同'可能是强制转介而非真实效率提升"
      transferable_to: ["所有垂直整合集团(内部交易占比>50%)", "零售+金融混合体(Walmart/Amazon)"]

    - name: "准公用事业化识别(制度折价永久性判断)"
      description: "SIFI级监管+两党政治靶心+PBM立法=P/E上限永久下移→不可用历史均值回归做估值"
      transferable_to: ["大型银行(SIFI)", "大型科技公司(潜在反垄断)", "烟草公司(永久监管折价)"]

  # v1.2新增: 框架升级贡献
  framework_contributions:
    moat_insights:
      - insight: "护城河三轴量化(规模x数据x规制)比单一评分更精确 — UNH综合6/10但规制8.0/数据6.5/飞轮2.0差异巨大"
        implication: "护城河评估应拆分为独立轴+各自衰减速度 — 统一评分掩盖了最脆弱的轴(数据被互操作性侵蚀)"
      - insight: "垂直整合不一定是护城河增强 — 内部交易>50%时可能是复杂度税(净负值)而非协同"
