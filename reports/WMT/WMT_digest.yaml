# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "身份溢价的数学不可能性"
    chain: >
      Reverse DCF → 市场隐含OPM需从4.18%扩至7.3%(年均+31bps×10年)
      → WMT 62年上市历史中OPM从未超过5.9%(FY2021 COVID超额)
      → 信念反演: 8个隐含信念需全部同时成立→联合概率0.3%
      → 身份溢价量化: IPI=308%=市场定价3倍"完全平台成功"
      → 即使身份B(过渡态35%概率)成立→合理价$93仍低于$126.75
      → 结论: 当前价格为"从未发生过的完美执行"全额预付
    transferable_to: "所有经历'身份转型叙事'的传统公司(零售→平台、银行→金融科技等)"
    reasoning_habit: "当PE远超行业均值时→Reverse DCF翻译'市场在赌什么'→检验每个隐含假设的历史基准率→联合概率暴露脆弱性"

  - id: "CC-2"
    name: "壁垒-利润池错配(A4陷阱)"
    chain: >
      WMT壁垒最强处=杂货(25-26%份额)→但杂货利润率仅2-4%
      → 利润池最厚处=零售媒体广告(40-60%利润率)→但壁垒最弱(远落后AMZN)
      → A4仅5/10=壁垒保护的恰恰是最不值钱的东西
      → 对比ASML(A4=10分): 壁垒(EUV唯一供应)恰好保护最高利润池(高端节点)
      → 推论: 如果把杂货视为"获客成本"→壁垒位置逻辑成立→但变现链条更长且不确定性更高
      → 46x PE赌的是"长链条变现成功"→而长链条每一环都可能断裂
    transferable_to: "所有壁垒保护低利润池、高利润池无壁垒的公司(传统零售商、物流公司)"
    reasoning_habit: "评估护城河时→不只问'壁垒有多强'→还要问'壁垒保护的利润池有多厚'→A4<5分=壁垒-利润池错配信号"

  - id: "CC-3"
    name: "广告是OPM的唯一判官(充分统计量)"
    chain: >
      广告毛利率~70% vs 杂货~25%→每$1B广告增量提升OPM~10bps
      → 但核心零售成本通胀(人工4-5%/年+关税+自动化折旧)年均消耗30-50bps
      → 广告$6.4B→OPM理应上升→但实际FY2026 OPM反降13bps=核心恶化速度>广告贡献
      → 广告→OPM→PE→身份的传导链→广告增速编码了全部关键信息
      → 因此: 只需跟踪广告有机增速一个变量→就能做出80%正确决策
    transferable_to: "所有'高利润新业务+低利润核心业务'混合公司——判断新业务能否改变公司身份"
    reasoning_habit: "在多变量公司中→寻找'充分统计量'(一个编码其他变量信息的指标)→减少跟踪噪音"

  - id: "CC-4"
    name: "EDLP飞轮的反脆弱证明"
    chain: >
      2008危机: WMT同店+3.0% vs TGT -2.6%(差距590bps)→消费降级加速客流迁移
      → 竞争对手6,100家破产→市场空间被WMT吸收→份额提升
      → 供应商其他渠道销量暴跌→WMT稳定出货量成为"避风港"→供应商主动给更优价格
      → 飞轮不仅在危机中"维持运转"而是"加速运转"
      → 2020疫情: 杂货目的地地位被放大+电商习惯养成(300%+需求暴增)
      → 推论: 经济越差WMT越强→EDLP是零售定价策略中唯一的反脆弱模式
      → 但!2022通胀暴露脆弱性: 成本端不可控时飞轮也会短路(OPM从5.9→3.8%)
    transferable_to: "所有EDLP/低价领导者(COST/ALDI/Dollar General)的危机韧性评估"
    reasoning_habit: "评估反脆弱时→必须同时检验'受益于什么冲击'和'受害于什么冲击'→单向反脆弱不是真反脆弱"

  - id: "CC-5"
    name: "增速-估值剪刀差的PE压缩必然性"
    chain: >
      EPS增速: FY2024 +34.5%→FY2025 +26.2%→FY2026 +13.3%→FY2028E CAGR ~9.8%
      → PE却从30x(10年均值)膨胀至46x→增速减速+PE扩张=经典剪刀差
      → PEG = 46/13.3 = 3.5x(vs合理1.5-2.0x)→估值倍数与增速严重脱节
      → 历史验证: WMT在PE>35x时入场的3年回报中位数约0%
      → 推论: 不需要"坏消息"→只需要"好消息不够好"→PE自然向均值压缩
    transferable_to: "所有增速减速但PE逆势扩张的公司——PEG>3x是通用警告信号"
    reasoning_habit: "看到PE创历史新高时→立刻追问'增速能支撑吗'→PEG>2.5x+增速减速=剪刀差警告"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "广告+46%增长将推动OPM持续改善"
      final: "FY2026 OPM反降13bps→核心零售成本通胀完全抵消广告增量利润"
      pivot: "OPM逆转+广告对OPM增量仅47bps的数学计算"

    - initial: "负营运资本-$22.6B是平台型资本效率优势"
      final: "负WC是供应商融资飞轮，证明WMT仍是零售商而非平台(CI-04)"
      pivot: "红队RT-3修正: 真实'零息浮存金'仅$4-6B而非$22.6B→永续价值差-$3.2/股"

    - initial: "WMT的护城河'宽且深'"
      final: "A-Score 5.54='宽而浅'——偏科形状: 5个7-8分强项+3个3分谷值=双峰双谷"
      pivot: "A4壁垒-利润池匹配仅5分(壁垒保护薄利润)+A2切换成本仅3分+A7网络效应仅4分"

  surprises:
    - finding: "8个隐含信念的联合概率仅0.3% — 信念反演法暴露的估值脆弱性"
      implication: "当前$126.75需要全部信念同时成立→任何单一信念失败都意味着PE应大幅低于46x→估值结构极端脆弱"

    - finding: "沃顿家族连续8个季度净卖出自家股票"
      implication: "最了解公司的内部人士在$80-$126区间持续减持→与97%买入评级的sell-side共识形成鲜明反差"

    - finding: "杂货60%收入占比是物理天花板而非可调变量 — '杂货陷阱'"
      implication: "即使广告从0.9%升至3%→杂货稀释力仍使公司级OPM<6%→身份转型有结构性数学约束"

    - finding: "WMT在PE>35x时入场的3年回报中位数约0%(62年历史)"
      implication: "当前46x是20年来绝对峰值→高PE零售商的历史先验回报极差"

  blind_spots:
    - area: "广告有机增速(剔除VIZIO)"
      why_matters: "FY2026的46%含VIZIO 13-16pp无机贡献→FY2027Q1有机增速是判断广告飞轮真实强度的第一个干净数据点"
      monitor: "FY2027Q1(2026年5月)管理层披露有机广告增速→<25%=黄灯→<15%=红灯"

    - area: "自动化对SGA率的实际影响"
      why_matters: "210万员工的人工成本年增4-5%是'反杠杆'→55%履约自动化目标能否逆转SGA/Rev上升趋势决定OPM上限"
      monitor: "FY2027-2028 SGA/Rev趋势→如果开始下降=自动化见效→A3从5分升级"

    - area: "AI Agent Commerce对EDLP的颠覆时间表"
      why_matters: "如果购物决策交给AI Agent→品牌认知和EDLP定位可能被绕过→5-10年远期风险但影响护城河根基"
      monitor: "AI购物助手渗透率(Google/Amazon/Apple动向)+消费者购物决策AI依赖度调研"

  # v1.2新增: 卖出时机教训
  sell_lessons:
    - scenario: "PE>35x零售商持有3年→回报中位数0%(WMT 62年数据)"
      lesson: "零售商有PE天花板——增速减速后高PE不可持续。PEG>3x是卖出/不买信号"
      transferable: "所有净利率<5%的零售商(TGT/KR/DG类)"
    - scenario: "增速从34%→13%但PE从30x→46x — 增速-估值剪刀差"
      lesson: "增速减速+PE逆势扩张=最危险的组合。不需要坏消息→只需要好消息不够好→PE压缩"
      transferable: "所有从高增速减速但PE未调整的公司"
    - scenario: "内部人士连续8季净卖出而sell-side 97%买入"
      lesson: "当管理层/大股东行为与分析师共识严重背离时→内部人士通常对时机更敏感"
      transferable: "所有存在内部人士持续减持+sell-side极度共识拥挤的公司"

# --- Layer 2.5: 信号分级 (v1.2新增) ---
signal_hierarchy:
  alpha_signals:
    - signal: "Delta OPM YoY (营业利润率年度变化)"
      why_alpha: "OPM编码了广告贡献vs核心零售成本通胀的净效应——比单独跟踪广告增速或成本更全面。报告确认OPM是'单一判断指标'"
