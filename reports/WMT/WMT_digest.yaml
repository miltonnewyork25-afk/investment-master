# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "零售商利润率(4.18%) vs 科技平台估值(PE 46x) — 市场为尚未验证的身份转型预付了44%溢价，8个隐含信念的联合概率仅0.3%"
  rating: "审慎关注 (Cautious Watch)"
  fair_value: "$88 (八源概率加权)"
  expected_return: "-30.6%"

  key_arguments:
    - claim: "身份溢价超调3倍 — IPI=308%，市场定价3x'完全平台成功'"
      direction: bearish
      magnitude: 5  # ETN身份溢价法+KLAC信念反演法双重量化确认
      mechanism: "SGI 3.6(通才) × PE 46x(专才级) → 75pp+不匹配 → A-Score 5.54仅支撑PE 28-35x → 超出部分=纯叙事溢价"
      kill_switch: "广告占营收>3%且OPM>6%(身份C验证) — 概率15%"

    - claim: "广告飞轮是'利润维持器'而非'利润提升器' — $6.4B广告对OPM增量仅47bps"
      direction: bearish
      magnitude: 4  # 数学可量化但广告仍在高速增长
      mechanism: "广告毛利率70%→每$1B提升OPM~10bps → 但核心零售成本通胀(人工+关税+自动化折旧)年均吞噬30-50bps → 广告增量被杂货稀释力基本对冲"
      kill_switch: "广告有机增速持续>35%且SGA率开始下降(自动化替代人工见效) — 预计FY2029+"

    - claim: "OPM逆转-13bps(4.31→4.18%)是最被忽视的警告信号"
      direction: bearish
      magnitude: 4  # FY2026实际数据确认
      mechanism: "广告$6.4B+46%增速 → 按理应推高OPM → 但OPM反降13bps → 说明核心零售利润率恶化速度超过广告利润贡献 → Delta OPM是单一判断指标"
      kill_switch: "FY2027连续2季OPM>4.5%(证明广告效应开始主导)"

    - claim: "EDLP飞轮在危机中反脆弱 — 杂货31.6%线上份额+4,600门店物理网络不可复制"
      direction: bullish
      magnitude: 5  # 2008/2020/2022三次危机验证
      mechanism: "经济衰退→消费降级→客流向EDLP迁移+竞争对手退出 → 份额提升+采购规模扩大 → 飞轮加速转动 → $500-635B核心零售价值有高韧性"
      kill_switch: "关税导致EDLP涨价>5%且与Hi-Lo策略价差缩小 → 飞轮'价格领导力'引擎减弱"

    - claim: "温水煮青蛙(概率35-40%)比黑天鹅更危险 — 5年静默蒸发$200B+"
      direction: bearish
      magnitude: 4  # 概率最高的不利路径
      mechanism: "广告增速自然S曲线减速→OPM停在4.4-4.6%→PE从46x渐进压缩至32x(每年-2~3x) → 不触发恐慌但5年后股价$70-85"
      kill_switch: "广告增速持续>30%打破S曲线减速预期"

  moat:
    composite_score: 5.54  # A-Score v2.0
    half_life: "物理网络>20年 | EDLP品牌>30年 | 供应链>15年 | 广告技术2-3年"
    dimensions:
      - type: scale
        strength: 5
        evidence: "4,600门店覆盖93%美国人口+$713B营收=全球最大采购规模→比竞争对手低5-15%定价"
        vulnerability: "规模保护的是4%利润率的杂货池(A4仅5分)——壁垒最强处恰是利润最薄处"
      - type: brand
        strength: 4
        evidence: "EDLP心智62年积累→87%的$100K+家庭在WMT购物→品牌从'穷人超市'向全收入段渗透"
        vulnerability: "功能性品牌(低价)而非情感品牌——关税涨价>5%将直接侵蚀品牌核心承诺"
      - type: switching_cost
        strength: 2
        evidence: "消费者随时可切COST/TGT/AMZN(A2仅3分)——Walmart+提供初步锁定但权益远薄于Prime"
        vulnerability: "Walmart+仅免配送+会员价 vs Prime(视频+音乐+阅读+购物+医疗)——生态锁定2/10"
      - type: network_effect
        strength: 2
        evidence: "Marketplace 20万卖家/4.2亿SKU初具跨边效应(A7=4分)——但vs Amazon 200万+卖家飞轮尚在早期"
        vulnerability: "广告数据飞轮需要更大数据量才能自我强化——当前$6.4B不足以形成闭环"
      - type: data
        strength: 3
        evidence: "2亿+消费者购物数据→Walmart Luminate向供应商出售洞察→Walmart Connect精准广告基础"
        vulnerability: "数据半衰期3-5年+广告技术落后Amazon 2-3年(A5数字资产评估)"

  valuation:
    reverse_dcf_implied: "市场隐含FCF CAGR 11-12%+营收CAGR 4.3%+OPM从4.18%扩至7.3%(年均+31bps持续10年)——OPM从未超5.5%，隐含增速比历史快50%"
    methods_used: ["DCF(Python验证)", "Reverse DCF", "可比PE", "PEG", "FCF Yield", "SOTP身份拆解", "信念反演", "红队校准"]
    dispersion: "~27% ($76-$101，含红队校准$76.8和独立看空$101)"
    consensus_vs_ours: "市场看WMT=消费科技平台(PE 46x) | 我们看WMT=身份转型30%完成的零售商(合理PE 28-35x)，$38.75/股溢价=纯叙事定价"
    entry_zone: "$82-$92 (PE 30-34x)"
    catalyst: "温水煮青蛙路径: 广告增速自然减速+OPM持平→PE渐进压缩→FY2028-2029可能触及$85-95入场区"

  # v1.2新增: 买卖决策框架
  action_framework:
    verdict: "不要在当前价位建仓 — 下行30% vs 上行15%(身份C)严重不对称"
    buy_triggers:
      - trigger: "PE回落至37-40x(部分溢价消化)，可能因单季度广告增速<20%触发"
        price_zone: "$100-$108"
        reasoning: "溢价从44%缩小至14-23%，风险回报开始改善"
      - trigger: "PE回落至30-34x(接近合理估值)，可能因连续2季OPM<4.0%+广告减速"
        price_zone: "$82-$92"
        reasoning: "核心建仓区 — A-Score 5.54支撑的合理PE区间+安全边际"
      - trigger: "PE回落至25-28x(零售商估值+安全边际)，宏观冲击叠加"
        price_zone: "$68-$75"
        reasoning: "EDLP飞轮反脆弱在衰退中验证→极端低估→激进买点"
    hold_conditions:
      - "广告有机增速>20%(黄灯以上)"
      - "OPM>4.0%(未进入衰退区)"
      - "同店销售正增长(EDLP飞轮正常运转)"
