# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: COST
      similarity: "同为大型零售商+会员经济模式+低利润率高周转"
      key_difference: "COST=专才(会员制仓储,SGI~6)→PE 50x有会员锁定支撑(92.7%续费) | WMT=通才(SGI 3.6)→PE 46x缺乏锁定(切换成本3/10)"

    - ticker: AMZN
      similarity: "WMT试图复制AMZN的'零售→平台'路径(广告+Marketplace+会员)"
      key_difference: "AMZN广告占营收~10%且已盈利+Prime生态8-9分网络效应 | WMT广告仅0.9%+Walmart+生态锁定2/10→差距5-10年"

    - ticker: TGT
      similarity: "同为美国大型综合零售商+直接竞争关系"
      key_difference: "TGT PE仅14x(WMT的3.3倍溢价)→两者增速相近→WMT的溢价完全来自平台化叙事，而TGT没有这个叙事"

  comparative:
    - dimension: "护城河宽度(规模+渗透)"
      position: "WMT (A-Score 5.54) > TGT (~4.5) ≈ AMZN(零售, ~5) | 但 AMZN(平台) >> WMT"
      reasoning: "WMT物理网络不可复制+$713B采购规模无可匹敌→宽度第一；但深度(切换成本/网络效应)远逊AMZN平台"

    - dimension: "估值合理性(PEG)"
      position: "TGT (~1.2x PEG) >> WMT (3.5x) ≈ COST (~3.8x)"
      reasoning: "WMT和COST同样PE高企但增速不匹配→PEG暴露真实估值水平→TGT反而最合理"

    - dimension: "增长质量(利润率改善路径)"
      position: "AMZN (AWS+广告双引擎) > COST (会员提价+电商增速) > WMT (广告增量被成本吞噬)"
      reasoning: "WMT OPM反降13bps证明增长质量存疑——收入增长≠利润率改善"

    - dimension: "防御属性(衰退韧性)"
      position: "WMT (Beta 0.67, 衰退反脆弱) > COST (Beta 0.79, 会员稳定) > TGT (Beta 1.1, 可选消费敞口)"
      reasoning: "EDLP飞轮在2008/2020危机中加速转动→WMT是零售板块最佳防御标的"

  industry_position:
    quadrant: "最大规模 × 最高PE × 最低利润率(4.18% OPM)"
    archetype: "通才型零售飞轮试图变身平台 — 身份转型30%完成(CI-01)"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "KLAC信念反演法→8个隐含信念→联合概率0.3%→暴露$126.75的脆弱结构"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "温水煮青蛙路径(P=35-40%): 广告减速+OPM停滞+PE渐进压缩→5年后$70-85"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1~RT-7双向校准→净下修-$10~-15/股→3个乐观偏差(广告天花板/身份进度/OPM)被量化修正"

    - pattern_id: "competitive_benchmarking.identity_premium"
      application: "ETN身份溢价量化法→IPI=308%→三重身份假设(零售商50%/过渡态35%/平台15%)概率加权"

  novel_patterns:
    - name: "壁垒-利润池错配(A4陷阱)"
      description: "壁垒最强处保护最薄利润池(杂货2-4%)、利润池最厚处(广告40-60%)壁垒最弱→护城河'宽而浅'→A4<5分=通才型公司不配专才级PE"
      transferable_to: ["传统零售商转型", "物流公司(壁垒在配送网络但利润在增值服务)", "银行(壁垒在牌照但利润在财富管理)"]

    - name: "广告充分统计量(单变量判断指标)"
      description: "在多变量公司中识别一个编码其他全部关键变量信息的指标→广告增速同时编码OPM走向/PE合理性/身份转型概率→跟踪1个指标替代20个"
      transferable_to: ["所有有'新利润引擎+旧利润基座'结构的公司", "DIS(流媒体是Disney身份转型的充分统计量)"]

    - name: "身份溢价定量指标(IPI)"
      description: "Identity Premium Index=当前PE/身份匹配PE→IPI>200%=市场为尚未验证的身份转型支付>2倍溢价→高度脆弱"
      transferable_to: ["所有经历身份叙事的公司(银行→金融科技、车企→科技公司)"]

    - name: "SGI-PE不匹配检测"
      description: "SGI(通才-专才指数)与PE倍数的不匹配度→通才(SGI<4)获专才级PE(>行业1.5x)=身份定价错误→回归均值概率极高"
      transferable_to: ["所有多元化集团获溢价估值的公司"]

    - name: "增速-估值剪刀差"
      description: "EPS增速递减+PE逆势扩张→PEG>3x→历史验证高PE入场3年回报约0%→剪刀差是PE压缩的先行指标"
      transferable_to: ["所有增速见顶但momentum推高PE的公司"]

  # v1.2新增: 框架升级贡献
  framework_contributions:
    moat_insights:
      - insight: "A4壁垒-利润池匹配是护城河分析中最被忽视但最关键的维度——壁垒强+利润薄=宽而浅护城河"
        implication: "护城河评估应增加'壁垒保护的利润池厚度'维度——A4<5分自动标记'通才陷阱'风险"
      - insight: "多引擎半衰期差异极大(物理网络>20年 vs 广告技术2-3年)——不能用统一半衰期评估"
        implication: "护城河半衰期应按资产拆分评估——如果高PE依赖短半衰期资产(数字/技术)→估值风险更高"

    valuation_insights:
      - insight: "身份不确定性是估值离散的主要来源——三重身份假设下估值差距高达$50/股(67%)"
        implication: "对身份转型公司→应先锁定身份概率再估值→而非用单一身份假设做DCF"
      - insight: "PEG比PE更能暴露零售商的真实估值水平——WMT PE 46x看似不算离谱但PEG 3.5x暴露严重失配"
        implication: "低利润率公司(OPM<5%)的估值比较应强制使用PEG——PE在增速减速时极具误导性"

    screening_insights:
      - insight: "SGI<4 + PE>行业1.5x = '身份溢价过载'信号——通才获专才级PE必然回归"
        implication: "选股筛选增加'SGI-PE匹配度'过滤器→不匹配>50pp=标记为高风险"
      - insight: "内部人士行为与sell-side共识的背离度→连续8季净卖出+97%买入率=极端信号"
        implication: "选股时增加'insider-consensus divergence'指标→背离>6个月=红旗"

# --- Layer 5: Meta-learning (这份报告教了AI什么) ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "身份不确定性公司先做身份概率分配再估值"
      trigger: "PE远超行业均值且公司正在'转型叙事'中"
      origin: "WMT三重身份假设(零售商50%/过渡态35%/平台15%)的概率加权估值远低于单一'平台'假设"
      generalization: "所有'传统公司→新身份'转型中的公司→先锁定身份概率→再在每个身份下独立估值→概率加权"

    - habit: "追问'壁垒保护的东西值多少钱'"
      trigger: "看到'护城河很宽'的结论时"
      origin: "WMT壁垒最强(杂货25%份额)但利润最薄(2-4%)→A4仅5分→护城河宽≠护城河深"
      generalization: "护城河分析不能只评宽度——A4壁垒-利润池匹配度低于5分=壁垒在保护不值钱的东西"

    - habit: "寻找编码多变量信息的'充分统计量'"
      trigger: "公司有>10个可跟踪指标且投资者注意力有限"
      origin: "WMT广告增速同时编码OPM/PE/身份转型概率→跟踪1个替代20个"
      generalization: "每个公司都有1-2个'充分统计量'→找到它=减少80%跟踪噪音"

    - habit: "PEG>3x + 增速减速 = 立即追问PE可持续性"
      trigger: "PE创历史新高但EPS增速在递减"
      origin: "WMT PE 46x但增速从34%→13%(PEG 3.5x)→历史上PE>35x入场回报约0%"
      generalization: "增速-估值剪刀差是PE压缩的最可靠先行指标——适用于所有行业"

  quality_feedback:
    strengths:
      - "身份溢价量化(Ch16+Ch17) — ETN法+KLAC信念反演法双重独立验证得出高度一致结论($84-93)"
      - "风险拓扑(Ch20) — 温水煮青蛙路径是全报告最有决策价值的产出，概率量化(35-40%)而非定性罗列"
      - "估值多源收敛(Ch26) — 8个独立估值中5个落在$76-90区间(62.5%集群度)→结论稳健"
      - "A-Score 12维度全量化(Ch14) — 偏科形状分析(双峰双谷)是理解'宽而浅'护城河的关键可视化"
    weaknesses:
      - "DM密度0/千字 — v17.3框架未强制DM锚点→数据来源追溯困难(v19.0+已修复)"
      - "因果密度未量化 — 报告撰写时铁律N尚未建立(v19.2+才引入因果密度门控)"
      - "部分概率赋值缺乏三重锚定 — 如身份C概率15%的基准率锚定不够硬"
      - "VIZIO并购对广告增速的影响拆分不够精确 — 13-16pp范围较宽"

  hypothesis_tested:
    confirmed:
      - hypothesis: "壁垒-利润池错配导致通才估值折价(多报告验证)"
        evidence: "WMT A4=5分(壁垒保护薄利润)→PE应折价非溢价→对比ASML(A4=10)、KLAC(A4=9)"
        confidence_after: "高(WMT是A4陷阱的教科书案例)"
      - hypothesis: "身份转型叙事可以推高PE远超基本面支撑(ETN验证)"
        evidence: "IPI=308%→市场为30%完成的转型支付了3倍完全成功的价格"
        confidence_after: "高(ETN+WMT两份报告独立确认身份溢价现象)"

    extended:
      - hypothesis: "Reverse DCF P1前置防止结论先行(铁律O)"
        extension: "WMT报告中Reverse DCF有效揭示了'市场隐含OPM 7.3%→从未实现'→防止了被广告增速叙事带偏"

    refuted: []

