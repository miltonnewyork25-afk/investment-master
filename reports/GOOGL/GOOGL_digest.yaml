  sell_lessons:
    - scenario: "PE看似便宜但P/FCF极度偏高——CapEx重投资周期中PE是陷阱"
      lesson: "重CapEx投资周期(CapEx/Revenue>20%)中，用P/FCF而非PE判断估值。PE可能显示'便宜'但FCF告诉你真实现金回报"
      transferable: "所有处于AI CapEx军备竞赛的科技公司(MSFT/META/AMZN) — 2025-2028年window"
    - scenario: "市场用Non-GAAP PE定价而忽视SBC — Buyback/SBC比率下降是隐形恶化信号"
      lesson: "追踪Buyback/SBC比率趋势。从3.06x降至1.83x意味着净稀释在加速——即使绝对回购金额在增长"
      transferable: "所有SBC占净利润>10%且Buyback/SBC趋势下降的科技公司"
    - scenario: "三个承重墙同时成立时不减仓→任一墙裂缝时估值向S2滑落→双杀"
      lesson: "当估值需要多个假设同时成立(无冗余)，任一假设证伪的影响是非线性的——不是线性扣减而是估值框架切换"
      transferable: "所有'完美定价'的成长股——估值隐含零容错的公司"

