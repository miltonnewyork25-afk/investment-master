        evidence: "DeepMind(诺贝尔奖级)+ TPU v7 Ironwood 42.5 ExaFLOPS + Gemini模型 + Willow量子芯片"
        vulnerability: "模型性能优势半衰期仅~6个月(Gemini 11月领先→GPT-5.2 12月追平)"

  valuation:
    reverse_dcf_implied: "S3($311)隐含Revenue CAGR 9-11%+OPM 30-33%+EPS CAGR 15-17% — 三个承重墙同时成立的偏乐观情景"
    methods_used: ["Reverse DCF五档", "三承重墙模型", "PPDA背离分析", "五引擎协同分析"]
    dispersion: "2.25x (S1 $200 vs S5 $450+)"
    consensus_vs_ours: "市场看Forward PE 23.29x=Big Tech第二便宜 | 我们看P/FCF 51.8x+FY2026 FCF可能接近零=没有安全边际"
    entry_zone: "$250附近(S2保守档, 与v3.0收敛价$248几乎重合)"
    catalyst: "CapEx回报延迟+折旧冲击→FY2026-2027 FCF压缩→如果市场从PE锚定切换到FCF锚定→股价可能向S2滑落"

  # ★ v1.2新增: 买卖决策框架 ★
  action_framework:
