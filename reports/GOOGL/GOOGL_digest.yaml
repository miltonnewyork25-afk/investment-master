        evidence: "Android 3.3B活跃设备预装+Chrome ~66%浏览器份额+Workspace 3B用户 → 生态粘性"
        vulnerability: "Chrome分拆(上诉中)+搜索默认协议被禁(已部分执行) → 分发优势可能被削弱"
      - type: scale
        strength: 4
        evidence: "FY2025收入$402.96B+员工190,820人+$91.4B CapEx规模 → 研发/基础设施规模优势 | TPU自研降低78%服务成本"
        vulnerability: "CapEx军备竞赛中MSFT/AMZN/META同样大规模投入 → 规模优势相对性在缩小"
      - type: ip
