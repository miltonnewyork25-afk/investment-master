        evidence: "搜索89.57%全球份额+日均8.5B+查询+广告主生态(CPC正反馈) | YouTube 60B+收入(#2视频平台不存在)"
        vulnerability: "AI Overviews覆盖率扩展→零点击率83%→内容生态退化负螺旋(创作者流量减少→内容质量下降→搜索质量下降)"
