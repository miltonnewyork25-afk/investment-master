# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "AI Overviews的CPC补偿机制——短期防线与中期拐点"
    chain: >
      AI Overviews覆盖16%查询→有机CTR从1.76%暴跌至0.61%(-61%)
      → 但CPC从$4.66升至$5.26(+12.9%)
      → 同时AIO内广告渗透从5.17%飙升至25.56%(+394%/8个月)
      → Q4搜索收入+17%(连续四季度加速: Q1+10%→Q4+17%)
      → 短期: CPC补偿>CTR损失=搜索收入增长
      → 中期拐点: 当AIO覆盖率从16%→50%+时，CTR衰退加速但CPC增速放缓(边际递减)
      → 存在非线性拐点: 补偿失效点=搜索Revenue增速跌破5%=KS-01触发
    transferable_to: "所有面临核心产品AI化改造的公司(产品改善用户体验但可能蚕食传统变现模式)"
    reasoning_habit: "当新功能同时改善用户体验和威胁商业模式时，追问'补偿机制的数学极限在哪里'——CPC能无限涨吗？历史上有没有类似CPC/CTR剪刀差失效的案例？"

  - id: "CC-2"
    name: "CapEx延迟炸弹——利润表繁荣vs现金流表警告"
    chain: >
      FY2025 CapEx $91.4B(CapEx/D&A=4.33x) → 大量资产尚未进入折旧周期
      → FY2026指引$175-185B → 两年累计$265B+物理基础设施
      → D&A从$21.1B→FY2027E $45-55B(新增$29B)
      → OPM压缩5-7pp → Cloud OPM可能从30.1%退至20-25%
      → FY2026 FCF可能接近零(OCF $164.7B - CapEx $175B = 接近零)
      → 利润表: 净利润$132.17B(+32%) — 看似极好
      → 现金流表: FCF $73.27B(仅+0.7%) — 已经在恶化
      → 投资含义: 用PE看Alphabet=便宜(23x), 用P/FCF看=极贵(51.8x)
    transferable_to: "所有处于重资产投资周期的科技公司(MSFT/META/AMZN的AI CapEx周期)"
    reasoning_habit: "看到利润高增长时，立刻对照FCF增速——如果利润+32%但FCF仅+0.7%，找出差异来源(CapEx/运营资本/其他)并判断是暂时性还是结构性"

  - id: "CC-3"
    name: "分发>模型——AI竞赛的真正决定因素"
    chain: >
      模型性能优势半衰期仅~6个月(Gemini 11月领先→GPT-5.2 12月追平)
      → 但分发渠道是结构性的: Search 89.57%+Chrome ~66%+Android 3.3B设备
      → 用户不会主动卸载Chrome或更换默认搜索引擎(被动分发>>主动选择)
      → Gemini 750M MAU主要来自预装嵌入(vs ChatGPT 810M MAU来自主动App下载)
      → 推论: AI入口争夺战的赢家不是模型最强的(周期性)，而是分发最广的(结构性)
      → 但悖论: 分发=被动用户，ChatGPT=主动用户 — 变现转化率可能天差地别
    transferable_to: "所有平台级产品竞争(新功能vs已有分发——微信vs新社交App, AWS vs新云厂商)"
    reasoning_habit: "区分'结构性优势'和'周期性优势'——模型性能是周期性的(可被超越)，分发渠道是结构性的(难以复制)。但追问: 被动分发的变现效率是否等于主动选择？"

  - id: "CC-4"
    name: "三承重墙模型——从价格反推假设再评估合理性"
    chain: >
      $311→Reverse DCF反推→需三个承重墙同时成立
      → 承重墙一(搜索韧性): CAGR≥8%, $219B→$320B — 第二脆弱
      → 承重墙二(Cloud高增长): CAGR~18%, $65B→$150B — 最稳固($240B backlog)
      → 承重墙三(CapEx正回报): ROIC>15% — 最脆弱(前所未有规模+折旧延迟)
      → 关键: 不是预测每堵墙的概率，而是理解"哪堵墙最可能先出裂缝"
      → CapEx回报最脆弱 → 追踪优先级: TS-04(CapEx执行) > TS-01(AIO覆盖) > TS-02(Cloud backlog)
    transferable_to: "所有需要多个假设同时成立才能支撑估值的公司(尤其是转型期公司)"
    reasoning_habit: "不要问'这个价格合理吗'，而是问'这个价格需要什么假设同时成立？哪个假设最脆弱？'"

  - id: "CC-5"
    name: "SBC隐形稀释——GAAP vs Non-GAAP的估值幻觉"
    chain: >
      FY2025 SBC $24.95B(占净利润18.9%)
      → Buyback/SBC从3.06x(FY2022)降至1.83x(FY2025) — 回购对冲能力减弱
      → GAAP PE 30.64x vs Non-GAAP Forward PE 23.29x — 差距7.35x
      → 市场用Non-GAAP定价 → GOOGL看似Big Tech第二便宜
      → GAAP PE下GOOGL(30.64x)反而比MSFT(25.8x)更贵
      → SBC是真实的经济成本(股东权益年度稀释) — 不是"非现金就不重要"
    transferable_to: "所有SBC占净利润>10%的科技公司(MSFT/META/CRM/SNOW等)"
    reasoning_habit: "看到非GAAP PE显示'便宜'时，立刻算GAAP PE——如果差距>5x，追问SBC占比和Buyback/SBC比率趋势"

