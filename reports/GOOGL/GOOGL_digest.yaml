      direction: bearish
      magnitude: 5  # Reverse DCF数学推导+FCF Yield 1.83%+P/FCF 51.8x
      mechanism: "$311需搜索CAGR≥8%+Cloud CAGR~18%+CapEx ROIC>15%三墙全立 → Forward PE 23.29x看似便宜但FCF Yield仅1.83%(P/FCF 51.8x) → 没有安全边际"
      kill_switch: "FY2026 FCF大幅超预期(CapEx<$150B或Cloud增速>50%) → P/FCF回落至合理区间"

    - claim: "$175B CapEx是前所未有的'延迟炸弹'——折旧冲击在FY2026-2028逐步释放"
      direction: bearish
      magnitude: 4  # 数学确定性高(折旧节奏可预测)，回报不确定
      mechanism: "FY2025 D&A $21.1B→FY2027E $45-55B(+$29B) → OPM压缩5-7pp → Cloud OPM可能从30.1%退至20-25% → FY2026 FCF可能接近零"
      kill_switch: "Cloud收入增速持续>40%跑赢折旧增速 | 延长折旧年限至6年 | TPU自研降低每美元计算成本"

    - claim: "搜索护城河从'几乎不可攻破'降级为'很强但有缺口'(8.5/10→7.5/10)"
      direction: conditional
      magnitude: 4  # AI Overviews有机CTR-61%是硬数据，但CPC补偿目前有效
      mechanism: "AI Overviews覆盖16%查询→有机CTR下降61%→但CPC+12.9%+AIO内广告从5.17%飙升至25.56%暂时补偿 → 短期安全但中期存在CTR退化压过CPC增长的非线性拐点"
      kill_switch: "覆盖率扩展至50%+且CPC增速放缓至<5% → 补偿机制失效"

    - claim: "Cloud是最稳固的承重墙——$240B backlog提供~3.4年收入覆盖"
      direction: bullish
      magnitude: 5  # $240B backlog(+55% QoQ)是硬数据
      mechanism: "Cloud Q4 +48%(三大云厂商最高) + backlog $240B + AI需求结构性(52%企业已部署AI Agent) → 至少2-3年增长可见性"
      kill_switch: "Cloud backlog环比下降(新签约速度低于收入确认速度) → 增长见顶信号"

    - claim: "Agent时代威胁真实但时间维度较长——Agent颠覆SaaS而非搜索(CI-03)"
      direction: conditional
      magnitude: 3  # Agent搜索份额当前<3%，威胁在5-10年维度
      mechanism: "Agent需完成任务(替代SaaS seat)但仍需获取信息(使用搜索引擎) → Google双重身份: Agent基础设施提供者+搜索信息源 → 短期受益者而非受害者"
      kill_switch: "Agent渠道搜索份额24个月内>10%(KS-04一半) → Agent不再依赖Google Search"

  moat:
    composite_score: 7.5  # 从AI前8.5/10降级
    half_life: "搜索: 5-7年稳健→7-10年面临Agent考验 | Cloud: >10年(结构性) | 数据: 受DOJ共享令威胁"
    dimensions:
