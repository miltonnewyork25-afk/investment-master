# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF五档→$311隐含三墙全立(S3.5偏乐观) vs 市场认为'Big Tech第二便宜'"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "CapEx折旧延迟效应: FY2025 CapEx $91.4B→D&A $21.1B(4.33x)→折旧在FY2026-2028逐步释放→温水煮青蛙式OPM压缩"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "Ch20认知偏差识别: 锚定偏差(v3.0的$248→v4.0 S2) + 叙事偏差(AI转型叙事压制FCF担忧) + 可用性偏差(反垄断新闻被过度解读)"

  novel_patterns:
    - name: "三承重墙模型(估值假设分解)"
      description: "从Reverse DCF反推当前价格隐含的多个独立假设→按脆弱性排序→识别'最可能先出裂缝的墙'→决定追踪优先级"
      transferable_to: ["所有需要多假设同时成立的转型期公司", "多引擎公司的估值分解"]

    - name: "CPC补偿机制与非线性拐点"
      description: "AI化改造核心产品时，新体验蚕食传统变现→CPC/价格提升暂时补偿→但存在数学极限(边际递减)→拐点后补偿失效=Revenue断崖"
      transferable_to: ["所有AI化改造中的广告平台(META AI搜索、TikTok Search)", "订阅转免费增值模式的ARPU补偿"]

    - name: "PE vs P/FCF分裂(重CapEx投资周期的估值陷阱)"
      description: "重CapEx周期中利润表繁荣(会计利润高增长)但现金流表恶化(FCF被CapEx吞噬)→PE显示'便宜'但P/FCF暴露真实估值水平"
      transferable_to: ["2025-2028年所有AI CapEx军备竞赛参与者(MSFT/META/AMZN)", "任何CapEx/Revenue>20%的重投资周期"]

    - name: "分发>模型(AI入口争夺的结构性vs周期性优势)"
      description: "AI模型性能半衰期~6个月(周期性)，分发渠道(OS/浏览器/搜索默认)是结构性的→入口争夺战的赢家由分发决定，但被动分发的变现效率可能远低于主动选择"
      transferable_to: ["所有平台级AI入口争夺", "新产品分发策略(嵌入vs独立App)"]

    - name: "双螺旋模型(护城河正螺旋+负螺旋共存)"
      description: "同一护城河可以同时运行正螺旋(AI强化用户留存→广告主投入)和负螺旋(零点击→创作者流失→内容退化)→净效果取决于螺旋强度竞赛"
      transferable_to: ["所有双边市场(广告/电商/社交)", "平台改善体验可能伤害供给端的场景"]

    - name: "折旧传导漏斗(CapEx→D&A→OPM的时间传导)"
      description: "将CapEx映射到折旧释放时间表→按业务线分配折旧→计算各业务OPM压缩幅度→识别折旧冲击的峰值年份"
      transferable_to: ["所有大规模CapEx周期的利润率预测", "云厂商/数据中心运营商的折旧分析"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "护城河可以同时运行正螺旋和负螺旋——双螺旋竞赛决定护城河的净方向"
        implication: "护城河评估不应只看'多强'，还应看'正在加强还是减弱'——静态评分不够，需要趋势向量"
      - insight: "模型性能优势半衰期仅6个月——AI时代的技术护城河极其短暂"
        implication: "AI公司的持久护城河不在模型层(可被追平)，在分发层(结构性)和数据层(积累性)"
      - insight: "Agent协议标准(MCP vs A2A)可能是被忽视的护城河维度"
        implication: "护城河分析应增加'协议/标准层'维度——控制协议=控制生态定价权(类似App Store)"

    valuation_insights:
      - insight: "重CapEx投资周期中PE和P/FCF可以给出相反信号——PE显示便宜而P/FCF显示极贵"
        implication: "对CapEx/Revenue>20%的公司，P/FCF应作为主估值指标(替代PE)"
      - insight: "三承重墙模型比单一DCF更能暴露'价格需要什么假设同时成立'"
        implication: "对转型期公司(多个不确定假设)，应从Reverse DCF提取'承重墙'并按脆弱性排序——比给单一fair value更诚实"
      - insight: "Non-GAAP PE隐藏了SBC稀释——Buyback/SBC比率下降趋势是隐形恶化"
        implication: "科技公司估值应同时看GAAP PE和Non-GAAP PE——差距>5x时SBC是主要驱动因素"

    screening_insights:
      - insight: "PE/FCF分裂>2x = 重CapEx投资周期警告 — PE可能误导投资者进入'估值陷阱'"
        implication: "选股筛选增加'PE vs P/FCF分裂度'指标: 分裂>2x → 标记为CapEx投资周期(需额外审视FCF恢复时间线)"
      - insight: "CapEx/Revenue>20%的科技公司不应用传统PE体系估值"
        implication: "选股框架增加CapEx强度过滤器: CapEx/Revenue>20% → 切换到P/FCF+ROIC评估体系"
      - insight: "Buyback/SBC比率下降趋势是净稀释加速的领先指标"
        implication: "选股时追踪Buyback/SBC比率: <1.5x且趋势下降 → 标记'SBC稀释风险'"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "利润高增长时立刻对照FCF增速"
      trigger: "净利润增速>20%的公司(尤其科技/AI)"
      origin: "Alphabet净利润+32%但FCF仅+0.7% — PE vs P/FCF分裂暴露CapEx对现金流的真实吞噬"
      generalization: "利润和FCF分裂=CapEx投资周期(暂时性)或会计利润不反映经济现实(结构性)。区分两者是估值正确的前提"

    - habit: "估值需要多假设同时成立时，找'最脆弱的墙'"
      trigger: "Reverse DCF隐含多个独立假设的公司(转型期/多引擎/高不确定性)"
      origin: "GOOGL $311需三墙全立→CapEx回报是最脆弱的墙→追踪优先级由脆弱性排序决定"
      generalization: "不要均匀分配分析精力——80%精力放在最脆弱的假设上。如果最脆弱的墙裂了，其他墙多稳都没用"

    - habit: "区分结构性优势和周期性优势"
      trigger: "AI竞争力评估(模型vs分发/数据/生态)"
      origin: "Gemini模型性能半衰期6个月 vs Search+Chrome+Android分发渠道是结构性的"
      generalization: "投资应赌结构性优势(分发/数据/监管) — 不应赌周期性优势(模型排名/功能领先)。前者持久，后者可被复制"

    - habit: "看到CPC持续上涨时追问'弹药还剩多少'"
      trigger: "AI化改造蚕食传统变现但价格上涨暂时补偿的场景"
      origin: "AI Overviews CTR-61%被CPC+12.9%暂时补偿——但CPC不能无限涨，存在非线性拐点"
      generalization: "补偿机制(涨价/交叉销售/新市场)都有数学极限——追问'在什么条件下补偿失效'比'目前补偿是否有效'更有价值"

  quality_feedback:
    strengths:
      - "v9.0框架'扬长避短'成功执行 — 不给目标价/零仓位/条件估值 → 避免了假精度"
      - "三承重墙模型+Reverse DCF五档=估值分析的新标杆 — 从价格反推假设比正向DCF更诚实"
      - "13个KS+7个TS+8个CQ闭环+6个CI=完整的追踪体系 — 信号设计特异性测试13/13通过"
      - "利润表vs现金流表分裂的识别和量化=报告最具区分度的洞见"
      - "Agent Stack六层对照+双螺旋模型=新建框架有复用价值"
    weaknesses:
      - "v9.0框架不使用DM锚点体系 — 与当前v19.7框架标准不兼容"
      - "未计算CQI — 缺少跨报告可比性"
      - "453K字符报告可能存在冗余(铁律M单章≤15%标准当时未建立)"
      - "CPC补偿机制的'拐点'未能量化具体的覆盖率+CPC增速组合——定性描述多于数学建模"

  hypothesis_tested:
    confirmed:
      - hypothesis: "Reverse DCF比Forward DCF更适合高不确定性公司(AMD v2.0经验)"
        evidence: "五档Reverse DCF成功暴露了$311需三墙全立的隐含假设——比给单一fair value更有投资指导价值"
        confidence_after: "高(GOOGL是最极端的不确定性案例——可能性宽度6/10)"
      - hypothesis: "重CapEx投资周期中PE误导(Amazon 2012-2015经验)"
        evidence: "PE 23.29x vs P/FCF 51.8x — 2.2x分裂度证实PE在CapEx周期中系统性低估真实估值水平"
        confidence_after: "高(Alphabet FCF断裂是当前AI CapEx周期最极端的案例)"

    extended:
      - hypothesis: "品质最高≠回报最高(CME垄断三角)"
        extension: "GOOGL扩展为'好公司≠好价格' — 即使护城河7.5/10+ROIC 37%+净利润+32%, 如果价格隐含零容错(三墙全立), 回报取决于买入价格而非公司品质"

    refuted: []

  limitations:
    - "报告基于v9.0框架(2026-02), 与当前v19.7框架存在多项差异(无DM体系/无CQI/无11维度记分卡)"
    - "$175B CapEx指引的实际执行和ROIC在报告撰写时无法验证(首个验证点: Q1 2026-04-22)"
    - "CPC补偿机制的非线性拐点位置是定性判断而非量化建模 — 缺乏精确的'覆盖率×CPC增速'失效矩阵"
    - "Agent时代时间线(5年vs10年)存在结构性不可知 — Gartner 2028年预测14%AI搜索份额但历史预测偏差大"
    - "报告使用四档评级制(v9.0) — 与当前五档制(含'低估观察')不兼容"
