        evidence: "COST 12.8%毛利率但ROIC 38%+SG&A 9.08%(同业最低) — 低毛利是护城河而非劣势"
        lesson: "利润率评估必须看来源分离度。当利润来源与产品分离(会员费/广告/数据)时, 低毛利是战略优势"

  limitations:
