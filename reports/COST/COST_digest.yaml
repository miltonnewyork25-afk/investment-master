    methods_used: ["SOTP (三情景)", "DCF (三情景)", "可比公司", "B×M品牌溢价", "FMP DCF", "PE均值回归"]
    dispersion: "SOTP $700 / DCF $591 / 可比$775 / Phase 4修正$852-$923 — 离散度约30%"
    consensus_vs_ours: "市场看53x PE的会员平台溢价 | 我们看品牌仅支撑41x PE, 12.8x是叙事泡沫"
    entry_zone: "PE 42x / $848 (KS-1开始建仓) | PE 38x / $768 (KS-2加速建仓)"
    catalyst: "PE均值回归: Q2财报miss→53x PE向40x中位数回归→-26%回撤即使EPS不变"

  # ★ v1.2新增: 买卖决策框架 ★
  action_framework:
    verdict: "等待买入 — 品质已确认(护城河7.8/品牌7.5), 等待价格回落到PE 42x以下"
    buy_triggers:
