        price_zone: "$848 (PE 42x)"
        reasoning: "历史中位数37-38x+品牌溢价=42x合理 | 估值维度从2.4升至5+ | 风险收益比翻正"
      - trigger: "KS-2: PE回调至38x (衰退恐慌)"
        price_zone: "$768 (PE 38x)"
