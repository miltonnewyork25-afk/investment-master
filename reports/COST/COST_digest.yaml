# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "低毛利如何反直觉地创造定价权"
    chain: >
      Costco主动将毛利率压至12.8%(行业25-35%)
      → 利润不依赖商品差价, 而来自会员费($5.3B, 接近100%利润率)
      → 商品端可以永远维持最低价→消费者获得确定性价值→续费率92.3%
      → 定价权不在商品而在会员费: 三次提价弹性系数接近零(-0.02)
      → 竞争者若模仿低毛利→必须同时拥有会员费收入→否则亏损
      → 低毛利本身成为进入壁垒: 没有竞争者愿意/能够接受12.8%毛利率运营
      → 定价权的悖论: 在商品上放弃定价权 = 在会员费上获得终极定价权
    transferable_to: "所有通过战略性让利锁定客户的商业模式(Amazon Prime/Costco/低成本航空会员)"
    reasoning_habit: "看到极低利润率时追问'利润到底从哪来' — 如果有独立利润来源(会员费/广告/数据), 低利润率可能是优势而非劣势"

  - id: "CC-2"
    name: "员工护城河的隐性经济学"
    chain: >
      支付行业最高时薪$31.90
      → 流失率<10%(vs行业60-80%)
      → 培训成本降低(新员工学习周期12-18个月, 低流失=培训投资回报率极高)
      → 同时: 经验员工服务质量更高→NPS 79→会员续费率支撑
      → 同时: 运营效率$1.07M收入/员工(WMT $0.29M, TGT $0.28M)
      → 结果: SG&A仅9.08%(同业最低) — 高薪反而降低了总成本
      → 竞争者模仿陷阱: Sam's提薪→其毛利率(25%)不支撑$32/hr→SG&A恶化→利润压缩
      → 这是一个"竞争者模仿反而受损"的罕见护城河类型
    transferable_to: "所有高薪低流失模型(Costco/In-N-Out/Trader Joe's) — 适用于服务密集型、培训成本高的行业"
    reasoning_habit: "看到高薪酬时追问'这是成本还是投资' — 如果高薪→低流失→高效率→低总成本, 那就是投资而非成本"

  - id: "CC-3"
    name: "品牌溢价透支的量化识别方法"
    chain: >
      B×M双轴模型: B(品牌强度)=4.3, M(货币化能力)=3.9
      → 品牌溢价系数 = 1.636x(+63.6%)
      → 行业均值PE 25x × 1.636 = 品牌支撑PE 41x
      → 当前PE 53.8x → 市场隐含溢价2.15x
      → 差距: 2.15x - 1.636x = 0.514x → 对应~$240/股叙事泡沫
      → 叙事泡沫的脆弱性: 任何负面催化(earnings miss/飞轮减速/竞争加剧)都可能触发PE从53→41的回归
      → 回归幅度-24%, 即使EPS不变
    transferable_to: "所有品牌溢价型消费公司(NKE/SBUX/LULU) — 用B×M量化品牌能支撑的精确PE上限"
    reasoning_habit: "看到高PE消费品公司时, 立刻追问'品牌到底能支撑几倍PE' — 不量化就无法区分合理溢价和叙事泡沫"

  - id: "CC-4"
    name: "营运资本飞轮 — 增长即创现的隐藏机制"
    chain: >
      CCC仅0.67天: DSO 4.3天 + DIO 32.5天 - DPO 36.2天
      → 应付账款$21.6B vs 应收$3.2B → 净供应商融资$18.4B
      → 每$1B新增营收 × (DPO-DSO)/365 ≈ $87M营运资本净流入
      → 标准DCF假设FCF Margin恒定 → 忽略了负CCC带来的增量现金
      → 结果: COST是"增长越快现金越多"的异常模型(与大多数企业相反)
      → 这解释了为什么COST的FCF经常小幅beat分析师预期
      → 但: 此低估不足以改变整体估值结论(+10% FCF → DCF仅从$574升至$631, 仍远低于$997)
    transferable_to: "所有负CCC企业(Amazon/Dell/快时尚) — 增长本身创造现金流的异常模式"
    reasoning_habit: "看到负CCC时追问'增长是消耗还是创造现金' — 如果创造, DCF模型可能系统性低估FCF"

  - id: "CC-5"
    name: "Nifty Fifty教训 — 买入价格决定回报时间线"
    chain: >
      1970年代Nifty Fifty: 优质蓝筹被推至50-90x PE
      → 1973-74熊市: 平均跌幅-51%, 恢复时间6年
      → COST当前53.8x vs Nifty Fifty平均53x — 几乎完全重合
      → 关键变量: 买入PE决定了你的回报时间线
      → 可口可乐@PE 46x买入 → 需要8年回本; @PE 20x买入 → 2年翻倍
      → COST: @PE 54x买入→年化3-10%(fair return); @PE 42x买入→年化12-15%
      → 差异: COST有92.3%续费率提供收入可见性 + ETF被动配置提供底部支撑
      → 但: 收入可见性不能消除PE压缩风险, 只能缩短恢复时间
    transferable_to: "所有PE>40x的品质蓝筹(MSFT/AAPL/V/MA) — 买入时间和价格比选股更重要"
    reasoning_habit: "看到极高PE的优质公司时, 问自己'我在用什么时间换什么回报' — Nifty Fifty证明好公司在错误的价格也能亏损10年"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "Costco是会员制服务平台, 应享受SaaS级估值(50-60x PE)"
      final: "97%收入仍是商品销售, 会员费ARR虽强但不能将整体业务重新定价为SaaS"
      pivot: "SOTP拆分后会员费分部估值$67-$119/股, 核心零售仍是传统零售估值 — 平台叙事仅支撑有限溢价"

    - initial: "飞轮正在加速(会员费+14%, 同店+6-7%)"
      final: "飞轮处于稳态偏减速 — 4加速vs4减速信号精确平衡"
      pivot: "续费率连降4Q(-70bps/年) + 新店-25.7% + 内部人零买入(5Q) + Sam's增速首超COST"

    - initial: "12.8%毛利率是盈利天花板/劣势"
      final: "低毛利是Costco最深的护城河 — 竞争者无法复制的结构性进入壁垒"
      pivot: "SG&A 9.08%(同业20-25%) + 会员费独立利润来源 → 以更低毛利实现更高营业利润率(3.72% vs 传统3%)"

  surprises:
    - finding: "品牌溢价系数1.636x仅支撑PE 41x — 当前53.8x中有~$240/股叙事泡沫"
      implication: "首次将B×M品牌强度量化映射为精确PE锚, 叙事转变可触发-24%回撤"

    - finding: "员工生产力$1.07M/人(WMT 3.7x, TGT 3.8x) — 高薪反而降低了总成本"
      implication: "华尔街模型中缺少'员工质量'变量 — SG&A被误读为'成本'而非'高回报投资'"

    - finding: "CCC仅0.67天 → 增长越快现金越多(与大多数企业相反)"
      implication: "标准DCF系统性低估COST FCF约5-10%, 解释了为什么FCF经常小幅beat"

    - finding: "内部人0.84%持股 + 5Q零公开市场买入 — 在$844-$1,078宽幅区间内无人买入"
      implication: "拥有最完整信息的人用行动(而非言辞)投票: 这个价格太贵了"

  blind_spots:
    - area: "续费率下降是周期性还是结构性"
      why_matters: "结构性下降→飞轮减速→PE支撑从53x降至40-45x | 周期性波动→仅噪音"
      monitor: "连续3Q续费率: 稳定91.5-92.5%=稳态确认; <91%=恶化; >93%=重回加速"

    - area: "Sam's Club竞争力提升的真实幅度"
      why_matters: "Sam's会员费增速首超COST(+14.4% vs +14.0%) — 如果趋势持续→护城河缩小"
      monitor: "Sam's Club季度会员数据 + Member's Mark渗透率 + Top 20市场份额变化"

    - area: "新CEO Ron Vachris缺乏衰退周期经验"
      why_matters: "在PE 54x下遭遇衰退→管理层应对经验是股价保护的关键变量"
      monitor: "Q2财报guidance语调 + 危机应对(如关税冲击)的执行质量"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "PE>50x且增速<12%时不卖→PE均值回归导致-26%回撤"
      lesson: "品质消费品的卖出纪律=PE上限。53x PE下即使EPS+10%/年, PE回到40x仍亏-15%"
      transferable: "所有PE>40x的品质消费品(NKE/SBUX/MCD/LULU)"
    - scenario: "飞轮从加速转稳态但市场仍按加速定价→滞后调整创造下跌窗口"
      lesson: "飞轮减速的信号通常领先市场定价调整2-3个季度。续费率等领先指标优于EPS等滞后指标"
      transferable: "所有依赖飞轮叙事支撑估值的订阅/会员制公司(Netflix/Spotify/gym chains)"
    - scenario: "内部人零买入+机构缓慢减仓→聪明钱退出但散户未注意"
      lesson: "关注'谁在不买'比'谁在卖'信息量更高。零买入是比净卖出更稀缺、更有信号价值的数据"
      transferable: "适用于所有内部人持股低于2%且零公开市场买入的公司"

