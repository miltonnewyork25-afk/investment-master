# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "Costco是一家卓越的公司(护城河7.8/10, 财务7.6/10, 品牌7.5/10), 但53.8x PE让它在当前价格下成为一项风险收益不对称的投资 — 好公司不等于好投资"
  rating: "审慎关注"
  fair_value: "$852-$923 (Phase 4修正后) | 综合加权$691-$800"
  expected_return: "-11%至-28% @ $997 (6种方法中位数$800)"

  key_arguments:
    - claim: "会员经济学是零售业最强的飞轮 — 92.3%续费率+$5.3B ARR+LTV/CAC>30x"
      direction: bullish
      magnitude: 5  # 三次提价弹性系数接近零, 13年平均生命周期
      mechanism: "会员费将利润来源与商品销售分离→可以在12.8%毛利率下持续运营→竞争者无法复制此成本结构→自我强化飞轮"
      kill_switch: "续费率跌破90% | 连续2季度会员净增<1M | Sam's Club续费率超过COST"

    - claim: "53.8x PE包含~$240/股叙事泡沫 — 品牌仅支撑PE至41x"
      direction: bearish
      magnitude: 5  # B×M模型量化, 品牌溢价1.636x vs 市场隐含2.15x
      mechanism: "B=4.3, M=3.9→品牌溢价系数1.636x→行业均值25x×1.636=41x→当前53.8x中有12.8x为叙事/动量溢价"
      kill_switch: "会员模式被市场重新定价为SaaS平台(50-60x PE合理化) | 飞轮重回加速"

    - claim: "飞轮正从加速转向稳态 — 4加速vs4减速信号精确平衡"
      direction: bearish
      magnitude: 4  # 续费率-70bps/年连降4Q, 新店-25.7%
      mechanism: "加速(会员费+14%/同店+6-7%/Executive占比升/数字化+34%) vs 减速(续费率连降/新店缩减/内部人零买入/Sam's增速超COST)"
      kill_switch: "续费率连续3Q稳定>92.5% | 新店计划恢复至年40家+"

    - claim: "内部人5季度零买入 — 拥有最完整信息的人不认为当前价格值得投资"
      direction: bearish
      magnitude: 4  # SEC Form 4硬数据, 持股仅0.84%
      mechanism: "0.84%持股+$844-$1,078宽幅区间内零公开市场买入→言辞看多+行动零买入=信息不对称信号"
      kill_switch: "内部人开始公开市场净买入>$500K→管理层认为被低估的强信号"

    - claim: "员工护城河是华尔街模型中消失的变量 — $1.07M收入/员工(同业3x)"
      direction: bullish
      magnitude: 4  # 硬数据可验证, 因果链实证支撑
      mechanism: "时薪$31.90(最高)→流失率<10%(vs行业60-80%)→培训成本降+服务升+效率升→SG&A仅9.08%(最低)→竞争者模仿反而受损(毛利不支撑)"
      kill_switch: "Sam's Club成功匹配薪资且SG&A不恶化 | 自动化替代人工服务"

  moat:
    composite_score: 7.8
    half_life: ">15年(规模/品牌/成本) | >10年(会员粘性) | 5-10年(员工)"
    dimensions:
      - type: scale
        strength: 5
        evidence: "$2,752亿营收, 单SKU年销售$6,880万(WMT的10.2x), 采购集中度构成不对称议价力"
        vulnerability: "电商冲击采购模型(10年15-20%概率) | 新零售模式颠覆"
      - type: brand
        strength: 4.5
        evidence: "Kirkland ~$890亿营收(全球第三大快消品牌), 33%渗透率, 品质等于/优于国家品牌但价格低20-40%"
        vulnerability: "Sam's Member's Mark品牌重塑直接竞争(30%渗透率追近) | 单品牌集中风险"
      - type: switching_cost
        strength: 4.5
        evidence: "92.3%续费率, 三次提价弹性系数接近零(-0.02), LTV $1,729-$2,574"
        vulnerability: "续费率已连降4Q(-70bps/年) | Executive会员集中度风险"
      - type: pricing_power
        strength: 4.5
        evidence: "会员费定价权: 2024年$60→$65提价后续费率仅降0.2pp | 下次提价预计+$7.7亿增量"
        vulnerability: "定价权在会员费而非商品 — 商品端主动让利是战略选择, 非定价权"
      - type: network_effect
        strength: 2
        evidence: "仅有间接网络效应(更多会员→更大采购量→更好供应商条款) | 无直接网络效应"
        vulnerability: "不是平台型企业, 网络效应是最弱维度"

  valuation:
