# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "看到低利润率时追问利润来源分离度"
      trigger: "毛利率<15%但公司持续盈利且ROIC>20%"
      origin: "COST 12.8%毛利率+38%ROIC的表面矛盾 — 会员费将利润与商品分离"
      generalization: "低利润率+高ROIC = 隐含独立利润引擎。追问'利润到底从哪来'可以发现护城河被低估的公司"

    - habit: "用B×M量化品牌能支撑的精确PE上限"
      trigger: "消费品公司PE>行业均值1.5x以上"
      origin: "COST品牌支撑PE 41x但市场给了53.8x → ~$240/股叙事泡沫的定量发现"
      generalization: "消费品高PE公司必须做B×M→PE映射。不量化就无法区分合理溢价和叙事泡沫 — 适用于所有品牌驱动型消费品"

    - habit: "关注'谁在不买'而非'谁在卖'"
      trigger: "内部人公开市场买入空窗期>3个季度"
      origin: "COST 5Q零买入+0.84%持股 — 问题不在卖出量而在零买入的信息不对称"
      generalization: "内部人卖出有多种合理解释(税务/多元化), 但零买入在宽幅价格区间内只有一种解释: 不认为值得买"

    - habit: "对飞轮公司做三态诊断而非二元判断"
      trigger: "市场对某飞轮公司存在多空极端分歧"
      origin: "COST 4加速vs4减速=稳态, 但市场按加速(53x)或崩溃(<35x)二元定价"
      generalization: "飞轮三态(加速/稳态/减速)比二元(好/坏)更准确。稳态公司应给中位PE, 市场按极端PE定价=套利机会"

  quality_feedback:
    strengths:
      - "10维度评分系统覆盖全面, 估值2.4/10精准定位核心矛盾(好公司坏价格)"
      - "5个CI非共识洞察(4/5通过删名检验), 原创性高 — CI-1品牌溢价量化和CI-4零买入视角是全报告最有区分度的洞见"
      - "20个分析框架(80%原创性), B×M品牌→PE锚和飞轮三态诊断为框架永久资产"
      - "10个Bear Case等权重分析, CQ闭环7/7(6/7被Phase 4下调) — 确认偏差修正扎实"
    weaknesses:
      - "报告使用三层标注体系而非DM锚点 — 与当前框架DM密度门控不兼容"
      - "总评分61.41/100的评分体系与当前11维度D1-D11记分卡(目标88/110)体系不同, 无法直接对比"
      - "Reverse DCF未作为独立章节前置(铁律O) — 报告使用PEG隐含增长率逆推($6.14%永续)作为替代, 但不如结构化Reverse DCF严谨"
      - "飞轮摩擦力未量化(仅定性4vs4) — CME报告的飞轮摩擦力45%量化方法未被采用"

  hypothesis_tested:
    confirmed:
      - hypothesis: "品质最高不等于机会最高 (CME垄断三角)"
        evidence: "COST护城河7.8/品牌7.5(品质极高)但估值2.4(机会极低) — 总分仅61.41"
        confidence_after: "高(消费品+金融基础设施两个行业独立确认)"

      - hypothesis: "高PE+大额回购需审视η值 (CME回购η)"
        evidence: "报告未计算η值, 但FCF配置率39%+PE 54x暗示回购效率可能<1.0"
        confidence_after: "中(未直接验证, 但逻辑一致)"

    extended:
      - hypothesis: "品牌溢价可量化 (消费品B×M框架)"
        extension: "从定性品牌评估扩展为B×M→PE精确映射 — 首次量化品牌能支撑的PE上限(41x)"

      - hypothesis: "飞轮有不同状态 (CME飞轮摩擦力)"
        extension: "从二元(驱动力vs摩擦力)扩展为三态(加速/稳态/减速) — 稳态是市场最常忽略的第三种状态"

    refuted:
