# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "MA当前$500基本合理定价(公允$491-535),温和偏低估约2%——增速调整后比Visa更便宜(PEG 1.77 vs 2.27),但Beta 1.07意味着宏观风险主导价格波动,个股Alpha有限"
  rating: "中性关注(偏积极)"
  fair_value: "$509 (+1.8%) — P4公允$491/MC中位$535/加权(60/40)$509"
  expected_return: "-1.9%~+7%(取决于宏观)"

  key_arguments:
    - claim: "Reverse DCF隐含FCF CAGR仅9%——远低于实际16%+和共识12-16%"
      direction: bullish
      magnitude: 4  # 依赖Beta假设,Beta±0.15可使结论从'保守'变'合理'
      mechanism: "Python Reverse DCF反推→市场只定价9%FCF增速→如果MA维持共识12%+,当前价格有安全边际"
      kill_switch: "Beta实际应为0.93而非1.07→WACC↓→隐含CAGR降至5.8%→市场定价变合理"

    - claim: "VAS(增值服务)是真引擎:占收入40.6%,增速+23%,75-85%有机"
      direction: bullish
      magnitude: 4  # 有机增速有数据支撑但VAS OPM仅47%
      mechanism: "网络安全+数据分析+数字身份+忠诚度四支柱→从'支付管道'转型'支付+数据平台'→打开第二增长曲线"
      kill_switch: "VAS OPM=47%(远低于核心65%)→VAS占比↑50%时混合OPM下降3pp→EPS增速<收入增速"

    - claim: "MA vs V PE溢价从+20%压缩至+2.8%,PEG 1.77 vs 2.27——增速调整后MA更便宜"
      direction: bullish
      magnitude: 3  # 数学上成立但PE压缩可能反映结构性风险定价
      mechanism: "MA收入增速16.4% > V 10-12%→PEG更低→市场可能低估增速差→PE重估空间"
      kill_switch: "MA增速回落至与V相同水平(12%)→PEG差消失→当前PE合理"

    - claim: "WACC贡献MA总估值风险的59%——MA本质上是宏观代理标的"
      direction: bearish
      magnitude: 5  # Beta 1.07 vs V 0.79,WACC±100bps=价格±22%
      mechanism: "Beta 1.07→利率/衰退每变100bps→MA价格波动±22%→个股Alpha有限,80%价格波动由折现率驱动"
      kill_switch: "Beta下降至0.9以下(5年滚动)→WACC弹性降低→个股Alpha回归"

    - claim: "CI(客户回扣)转折点仅1.8pp安全边际——跨境正常化就可能触发"
      direction: bearish
      magnitude: 4  # V走过的路(CI/毛收入从21.5%→28%),MA当前16%
      mechanism: "净收入增速降至14.65%以下时→CI增速超过收入增速→定价权侵蚀循环启动(V过去5年走过的路)"
      kill_switch: "VAS增速维持18%+→拉高净收入增速至>CI增速→转折点持续推迟"

  moat:
    composite_score: 8.5  # CQI 91, 护城河综合4.2/5
    half_life: "~12年(加权: 网络效应>15年/数据10-15年/转换8-12年/令牌化5-10年)"
    dimensions:
      - type: network_effect
        strength: 5
        evidence: "31.6亿卡/1.5亿+商户/210+国家/V+MA占全球卡支付90%——经典双边平台效应,冷启动问题几乎不可克服"
        vulnerability: "Capital One收购Discover证明'收购而非从零建设'可绕过冷启动;A2A创建并行网络"
      - type: data
        strength: 4
        evidence: "1750亿笔/年×20年+历史=全球最大消费支出数据集;排他性+实时性(毫秒级)"
        vulnerability: "AI合成数据+迁移学习可能在5-10年内缩小部分差距(20%概率)"
      - type: switching_cost
        strength: 3
        evidence: "发卡行IT系统集成6-12月/CI绑定3-5年/VAS多供应商绑定"
        vulnerability: "转换成本是对称的:MA提高费率→发卡行可以用同样时间切换到V;Capital One已证明可行"
      - type: regulatory
        strength: 5
        evidence: "EMV/PCI-DSS标准强制嵌入;每家银行/POS机/电商都内嵌V/MA协议——制度级标准嵌入"
        vulnerability: "CCCA可能要求双网络路由→打破定价权法律基础;DOJ可能要求开放token解密"
      - type: pricing_power
        strength: 3
        evidence: "制度型定价权(监管框架+双寡头HHI>2500);F500 Stage3/中型Stage4/SMB Stage4-5→加权3.5"
        vulnerability: "大客户CI可能以20%+增速上升(Capital One-Discover给大行更多议价筹码)→定价权分化"

  valuation:
    reverse_dcf_implied: "市场隐含FCF CAGR 9%持续10年——远低于实际16%和共识12-16%,但高度依赖Beta=1.07假设"
    methods_used: ["Reverse DCF(Python)", "DCF(Python)", "Monte Carlo(10K)", "可比公司/PEG", "历史PE回归", "Owner Earnings"]
    dispersion: "5.5% ($517-$547三方法) — 低离散度可能反映共享假设而非真实收敛"
    consensus_vs_ours: "市场定价'宏观代理标的'(Beta溢价)|我们认为增速调整后温和偏低估但程度极小(+1.8%)"
    entry_zone: "$420-460 (衰退恐慌+CI转折确认=深度入场)"
    catalyst: "FY2026Q1 earnings beat(收入≥14%+OPM≥57%+VAS≥20%)→确认增速持续→评级上调"

  # ★ v1.2新增: 买卖决策框架 ★
  action_framework:
    verdict: "持有/观望 — 基本合理定价(+1.8%),无明显入场机会,等待催化或回调"
    buy_triggers:
      - trigger: "FY2026Q1三指标同时beat(收入≥14%+OPM≥57%+VAS≥20%)+Polymarket衰退<20%"
        price_zone: "$480-520"
        reasoning: "确认增速持续→评级上调至'关注'→PE维持30x+合理"
      - trigger: "衰退恐慌导致Beta放大下跌(非基本面问题)"
        price_zone: "$400-440 (PE 24-26x)"
        reasoning: "MA衰退后V型恢复(2020 EPS-20%→1年新高)→恐慌=买入窗口"
      - trigger: "CI转折确认+VAS OPM=47%双重利空→市场过度反应"
        price_zone: "$420-460"
        reasoning: "VAS利润率稀释是3pp(非致命)→如果市场定价>5pp恐慌→超跌"
    hold_conditions:
      - "VAS有机增速维持15%+(当前18-20%)"
      - "CI/毛收入<20%(当前16%,V已28%)"
      - "Beta<1.2(当前1.07)"
      - "商誉/总资产<30%(当前~21%+BVNK后~24%)"
    sell_triggers:
      - signal: "CI增速连续2Q超过净收入增速>2pp→CI转折确认"
        severity: "action"
        action: "减仓30%,重新评估定价权"
      - signal: "VAS有机增速<12%连续2Q(排除收购)"
        severity: "warning"
        action: "下调增速假设,重新估值"
      - signal: "CCCA通过委员会投票→双网络路由法案推进"
        severity: "action"
        action: "减仓25%,估值下调-$40"
      - signal: "JPM/BAC效仿Capital One收购第三方网络→双寡头结构面临真正威胁"
        severity: "emergency"
        action: "减仓50%,护城河假设需根本重评"
    position_sizing: "当前$500→期望回报+1.8%→Kelly接近零(不建议新建仓);$440以下→Kelly为正(可建仓10-15%)"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "CI转折点的定量识别逻辑"
    chain: >
      观察: MA CI/毛收入~16%(远低于V 28%)
      → 但FY2024 CI增速+16%超过净收入增速12.2%→差+3.8pp=CI侵蚀中
      → FY2025收入加速至16.4%追上CI增速16%→差仅-0.4pp→暂时企稳
      → 追问: 企稳是CI减速还是收入加速?
      → 答案: 收入加速(非CI减速)→如果FY2026收入回落至12-13%→CI仍16%→差+3~4pp→侵蚀重启
      → 转折点计算: 当净收入增速<14.65%→CI增速必然>净收入增速→定价权侵蚀循环启动
      → 当前安全边际仅1.8pp(16.4%-14.65%)→跨境正常化就可能触发
      → V先例: CI/毛收入从21.5%→28%(5年+210bps/年,无逆转)
    transferable_to: "所有存在客户回扣/返点机制的双寡头(V/MA/网络平台/供应商回扣)"
    reasoning_habit: "看到'CI暂时企稳'时,追问'是CI减速还是收入加速'——后者是暂时的,前者才是结构性改善"

  - id: "CC-2"
    name: "VAS利润率稀释的数学必然"
    chain: >
      VAS OPM反推: 核心支付OPM~65% + VAS OPM=47%(反推精确匹配)
      → VAS占比从40%→50%→混合OPM计算: 65%×50%+47%×50%=56%(vs当前59%)
      → 结论: VAS增长越快→OPM下降越确定→EPS增速必然<收入增速
      → 市场隐含: 如果市场期望OPM持续扩张→VAS结构证伪这个预期
      → 反面: VAS OPM可能随规模扩张(SaaS逻辑)→从47%→55%→稀释效应减弱
      → 但即使55%仍低于核心65%→方向不变只是幅度减小
    transferable_to: "所有高利润率核心业务+低利润率新业务的增长型公司(MSFT Azure/GOOG Cloud)"
    reasoning_habit: "看到'新业务高增速'时,立刻追问新业务利润率vs核心业务——混合效应可能使增速故事变成利润率陷阱"

  - id: "CC-3"
    name: "Beta作为宏观代理的估值含义"
    chain: >
      MA Beta 1.07 vs V Beta 0.79→差异0.28
      → WACC差: MA 9.01% vs V假设7.76%→差125bps
      → WACC±100bps=估值±22%→MA的估值不确定性比V高28%(1.07/0.79-1)
      → 追问: Beta差异反映什么基本面?
      → MA跨境占比更高(6-7x费率差)+国际收入56%→汇率/地缘风险敞口更大→Beta更高是合理的
      → 投资含义: 买MA本质上是赌全球消费周期好转→个股Alpha有限,80%价格波动由折现率驱动
    transferable_to: "所有高Beta(>1.0)的大盘成长股——WACC主导估值时,宏观判断比个股分析更重要"
    reasoning_habit: "Beta>1.0时,先算'WACC贡献总风险多少%'——如果>50%,这不是个股研究标的而是宏观表达工具"

  - id: "CC-4"
    name: "A2A冲击的PIX校准"
    chain: >
      问题: A2A(如PIX/UPI/FedNow)会替代多少卡支付?
      → 巴西PIX实证: 43个月1.6亿用户,月交易量超所有卡交易
      → 但: 借记卡YoY-12%,信用卡不受影响(因为parcelamento分期付款PIX不提供)
      → 推论: A2A替代借记(低利润)而非信用(高利润)→EPS影响远小于交易量影响
      → 校准: A2A 5-10年EPS冲击从-6%修正为-3.5%(概率加权)
      → MA对冲: VocaLink(A2A基础设施)+BVNK(稳定币)+A2A Protect(安全)→不是抵抗A2A而是参与A2A
    transferable_to: "所有面临低成本替代品的双寡头(替代品更可能蚕食低利润业务而非高利润业务)"
    reasoning_habit: "看到'替代技术爆发增长'时,追问'替代的是高利润业务还是低利润业务'——交易量冲击≠EPS冲击"

  - id: "CC-5"
    name: "令牌化三层价值模型"
    chain: >
      L1防御: 令牌化后Apple/Google的数字钱包无法绕过MA网络→令牌需MA验证才能授权→保护现有市值
      → L2锁定增强: 每卡映射2-3个数字令牌→迁移成本指数级增加→转换成本↑50%
      → L3 AI期权: 1750亿笔实时数据是AI支付决策的基础设施→MA不仅是'支付管道'更是'AI支付基础设施'
      → 但反面: 如果AI agents选择最低成本通道→令牌化数据无法阻止A2A→L3期权可能永远不兑现
      → 估值含义: L1+L2已在定价(保护现有价值),L3未定价($5-15B期权价值)
    transferable_to: "所有通过技术标准锁定客户的平台(Apple生态/云厂商容器化/SaaS API集成)"
    reasoning_habit: "技术壁垒分三层评估: 防御(保护现有)/锁定(增加迁移成本)/期权(创造新价值)——前两层可靠,第三层看条件"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "MA PE溢价于V反映增速优势,溢价合理"
      final: "PE溢价从+20%压缩至+2.8%(几乎消失),EV/EBITDA MA反而更便宜(-12%)"
      pivot: "实时FMP数据确认增速差收窄+市场已定价MA增速优势→溢价已充分反映"

    - initial: "A2A(PIX/UPI/FedNow)是卡网络的重大威胁,冲击-6% EPS"
      final: "A2A冲击修正为-3.5% EPS——A2A更多是'扩大数字支付总盘'而非'替代卡支付'"
      pivot: "巴西PIX实证: 借记YoY-12%但信用不受影响(parcelamento)→A2A替代低利润借记非高利润信用"

    - initial: "VAS高增速(+23%)是纯正面——增长引擎健康"
      final: "VAS OPM=47%(远低于核心65%)→VAS增长是'低质量增长'→混合OPM必然↓3pp"
      pivot: "分部OPM反推精确匹配47%→VAS占比↑50%时数学确定OPM下降→市场不应期望利润率持续扩张"

  surprises:
    - finding: "MA CI/毛收入仅~16%,远低于V的~28%——差12pp"
      implication: "MA在CI博弈中处于更优位置(有14bps缓冲),但这也意味着MA的CI上升周期可能刚开始(V 2018-2019年也是16%水平)"

    - finding: "CI偏多14/偏空14完美平衡——30个CI中方向完全对称"
      implication: "报告结论'中性关注(偏积极)'准确反映了证据的对称性;对偏多方向仅有51-55%信心而非60%+"

    - finding: "WACC贡献MA总估值风险的59%——个股Alpha极其有限"
      implication: "买MA本质上是赌全球消费周期——不是个股研究标的而是宏观表达工具;V的低Beta(0.79)提供更好的下行保护"

    - finding: "飞轮净效应仅2.05/5(含摩擦力)——监管(3/5)是最大结构性摩擦"
      implication: "MA的增长不是自驱动飞轮而是受监管约束的半飞轮;每次利润率扩张都会引发新一轮监管压力"

  blind_spots:
    - area: "VAS OPM真实值"
      why_matters: "影响±$20/股;47%是单组假设反推,置信度B级(60%)"
      monitor: "SGA/Rev>20%连续2Q→下调VAS OPM;FY2027(18月)首次可验证"

    - area: "Beta应该是多少"
      why_matters: "影响±$70/股(最大不确定性);1.07 vs 0.93→估值差$140"
      monitor: "5年滚动Beta<0.95→WACC下调50bps→+$35"

    - area: "FY2025是峰值还是加速起点"
      why_matters: "影响±$25/股;'FY2025是峰值'叙事概率45%——几乎是抛硬币"
      monitor: "FY2026Q1有机增速<11%→确认峰值;≥14%→确认加速"

    - area: "CCCA(Credit Card Competition Act)通过概率"
      why_matters: "影响±$40/股,置信度C级(45%);通过后双网络路由可能动摇定价权法律基础"
      monitor: "委员会投票排期→概率上调至35%→Bear+10pp"

    - area: "CI按客户层分化"
      why_matters: "CEO从未按客户层拆分CI——平均数可能掩盖大客户定价权侵蚀;F500 CI可能+20%而SMB仅+8%"
      monitor: "10-K CI分层披露(可能永远不披露)或大行切换信号"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "CI增速连续超过净收入增速>2pp——V走过的路(21.5%→28%无逆转)"
      lesson: "CI转折一旦确认几乎不可逆——V 5年无逆转;MA当前1.8pp安全边际说明应在CI转折确认前而非确认后行动"
      transferable: "所有存在客户回扣/返点压力的双寡头(V/MA/云平台折扣/SaaS企业折扣)"
    - scenario: "VAS OPM<40%被确认——利润率稀释比预期严重"
      lesson: "高增速新业务如果利润率持续低于核心业务,增速越快→混合利润率下降越快→'增长陷阱'"
      transferable: "所有核心高利润率+新业务低利润率的成长型公司(MSFT Azure初期/GOOG Cloud)"
    - scenario: "PE>35x但增速回落至10%以下——宏观代理标的的PE上限"
      lesson: "Beta>1的宏观代理标的,在PE>35x时回购和增长都无法覆盖估值下行风险;应设PE上限纪律"
      transferable: "所有Beta>1.0且PE>30x的大盘成长股"

# --- Layer 2.5: 信号分级 (v1.2新增) ---
signal_hierarchy:
  alpha_signals:
    - signal: "CI增速 vs 净收入增速差(pp)"
