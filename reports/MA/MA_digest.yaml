# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: V
      similarity: "双寡头对手,几乎相同的商业模式(四方模型收费站),相同的客户和监管环境"
      key_difference: "V份额70%/MA 30%→V更防守/MA更进攻|V Beta 0.79/MA 1.07→V更稳/MA更波动|V CI/毛收入28%/MA 16%→MA定价权缓冲更大|V OPM 66%/MA 59%→V运营效率更高"

    - ticker: CME
      similarity: "同为金融基础设施垄断收费站,类似的高margin+反脆弱特征"
      key_difference: "CME=纯垄断(CQI 93)+低增速(5-7%)|MA=双寡头(CQI 91)+高增速(16%)|CME利息敏感/MA消费周期敏感"

    - ticker: PYPL
      similarity: "同在支付行业,面临类似的A2A/BNPL竞争"
      key_difference: "PYPL在Layer 3(钱包层)竞争/MA在Layer 2(网络层)→MA护城河更深|PYPL是MA的客户而非竞争者"

  comparative:
    - dimension: "护城河深度"
      position: "V (CQI ~95) > MA (CQI 91) > CME (CQI 93但不同行业)"
      reasoning: "V份额70%→网络效应更强;但MA VAS差异化可能在10年内缩小差距"

    - dimension: "增长质量"
      position: "MA (PEG 1.77) > V (PEG 2.27)"
      reasoning: "MA收入+16.4%/VAS+23% vs V +10-12%→MA增速调整后估值更便宜"

    - dimension: "定价权"
      position: "V (CI/毛收入28%已饱和) ≈ MA (CI/毛收入16%但在上升中)"
      reasoning: "V定价权已被侵蚀(5年+210bps/年);MA当前更优但可能走V的老路"

    - dimension: "衰退抗性"
      position: "V (Beta 0.79) > MA (Beta 1.07)"
      reasoning: "V低Beta+高OPM→衰退中跌幅更小;MA跨境占比高→汇率+地缘风险敞口更大"

    - dimension: "估值吸引力(期望回报)"
      position: "MA (+1.8%) ≈ V (~合理)"
      reasoning: "两者都接近合理定价——支付双寡头的品质溢价已被市场充分定价"

  industry_position:
    quadrant: "高品质 × 高增速 × 合理估值 × 高Beta"
    archetype: "双寡头收费站 — 收费确定+车流高增速,但红绿灯(监管+Beta)主导节奏"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含CAGR 9% vs 实际16%→表面'保守'但高度依赖Beta假设→实际是'Beta赌注'"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-2偏差审计: 6类中5类检测到,总校正-$55(交互修正后-$42),确认偏差(-$20)和锚定(-$15)最大"

    - pattern_id: "scenario_analysis.monte_carlo"
      application: "10K次蒙特卡洛模拟→$500=P35→65%概率被低估→温和偏低估但非深度低估"

  novel_patterns:
    - name: "CI转折点量化(客户回扣侵蚀阈值)"
      description: "精确计算净收入增速阈值(14.65%),低于此→CI增速超过收入增速→定价权侵蚀循环不可逆。安全边际=当前增速-阈值=1.8pp"
      transferable_to: ["V(同框架)", "所有存在客户回扣/返点的双寡头", "SaaS企业折扣压力"]

    - name: "VAS OPM反推(分部利润率推断)"
      description: "当公司不披露分部利润率时,用全公司OPM-核心业务OPM×核心占比→反推新业务OPM=47%"
      transferable_to: ["所有不披露分部利润率但有混合效应的公司", "MSFT(Azure OPM)", "GOOG(Cloud OPM)"]

    - name: "双寡头CI博弈矩阵"
      description: "V+MA在CI上的Nash均衡: 两者都提高CI→份额不变但利润都降→囚徒困境。MA当前CI 16%有14bps缓冲→博弈空间更大"
      transferable_to: ["所有双寡头(SPGI/MCO, Boeing/Airbus)", "客户回扣/折扣竞争"]

    - name: "宏观代理标的识别(WACC风险占比)"
      description: "当WACC贡献>50%总估值风险→个股Alpha有限→本质上是宏观赌注。MA WACC占59%→Beta是比增速更重要的估值变量"
      transferable_to: ["所有Beta>1.0的大盘成长股", "消费/跨境敞口大的全球平台"]

    - name: "令牌化三层价值(防御/锁定/期权)"
      description: "技术标准壁垒分三层: L1防御(保护现有)→L2锁定(增加迁移成本)→L3期权(创造新价值)。前两层已定价,第三层条件性"
      transferable_to: ["Apple生态(iOS锁定)", "云厂商(容器化+API集成)", "所有通过技术标准锁定客户的平台"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "双寡头护城河的转换成本是对称的——保护份额但不保护定价权(发卡行可以用同样时间切到另一家)"
        implication: "评估双寡头时,转换成本的真正壁垒不在技术而在经济激励——只有当切换后的经济收益>切换成本时才发生"
      - insight: "飞轮摩擦力中监管是结构性最大(3/5)——支付网络高OPM(>55%)是政治目标,每次利润率扩张都引发新监管"
        implication: "高利润率平台的飞轮分析必须纳入'监管摩擦'——利润率越高→政治关注度越高→监管压力越大→飞轮有天花板"

    valuation_insights:
      - insight: "Reverse DCF结论高度依赖Beta假设——Beta±0.15可使结论从'保守'变'合理',单一Beta点估计的Reverse DCF有虚假精确性"
        implication: "Reverse DCF应报告Beta敏感性区间而非单点结论;对高Beta(>1.0)标的,应同时用Beta=报告值和Beta=0.9做双Reverse DCF"
      - insight: "低离散度(5.5%)可能反映'在同一错误下的一致性'而非真实收敛——真实不确定区间应为$460-560(远大于5.5%暗示)"
        implication: "估值方法独立性审计应成为标准步骤——如果方法共享>50%输入假设,低离散度是虚假信号"

    screening_insights:
      - insight: "PEG比PE更能暴露双寡头的真实估值关系——MA PE仅比V高2.8%但PEG低22%"
        implication: "筛选同行业双寡头时用PEG而非PE——PE误导性极强(不反映增速差异)"
      - insight: "CI/毛收入比率是定价权的前瞻指标——V 28%(已饱和)vs MA 16%(仍有缓冲)→MA在博弈中位置更优"
        implication: "对存在回扣机制的公司,增加'CI/毛收入'筛选: >25%=高风险(V), <18%=有缓冲(MA)"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "CI暂时企稳时追问'是CI减速还是收入加速'"
      trigger: "CI增速差从正变为接近零"
      origin: "MA FY2025 CI差-0.4pp(看似好转)但原因是收入加速而非CI减速→FY2026收入回落则侵蚀重启"
      generalization: "所有'暂时好转'的指标都应追问是分子改善还是分母变化——分母变化是暂时的"

    - habit: "看到新业务高增速时立刻算混合利润率影响"
      trigger: "新业务增速>核心业务2倍+且利润率低于核心"
      origin: "VAS +23%/OPM 47% vs 核心+10%/OPM 65%→VAS占比↑10pp=混合OPM↓3pp→增速故事变利润率陷阱"
      generalization: "增长的'质量'不仅看增速本身,还看增量利润率——增速×(增量OPM-报告OPM)才是对EPS的真实贡献"

    - habit: "WACC占总风险>50%时,先做宏观判断再做个股分析"
      trigger: "Beta>1.0 + 大盘成长股"
      origin: "MA WACC贡献59%估值风险→花80%时间分析基本面但80%价格波动由宏观决定=资源错配"
      generalization: "对宏观代理标的,最重要的分析不是个股而是利率/衰退/汇率——个股分析的边际贡献递减"

    - habit: "双寡头分析必须包含博弈论——不是两个独立公司而是一个博弈系统"
      trigger: "HHI>2500的双寡头市场"
      origin: "MA vs V在CI上的囚徒困境——两者都提高CI→份额不变但利润都降→理解Nash均衡比单独分析更重要"
      generalization: "双寡头估值不是'公司A值多少'而是'在博弈均衡下A的最优策略是什么+均衡会被打破吗'"

  quality_feedback:
    strengths:
      - "CI注册表30个,偏多14/偏空14完美平衡——方向性偏差控制到位"
      - "DM密度1.86/千字(454个DM)——数据锚定扎实,超过1.5/千字标准"
      - "V教训贯穿始终(L1-L5)——充分利用可比公司先例约束分析偏差"
      - "CI转折点14.65%和VAS OPM=47%两个核心量化发现具有高区分度"
      - "10条一致性检验全部通过——内部逻辑一致性强"
    weaknesses:
      - "Beta不确定性(±0.15)导致Reverse DCF结论可在'保守'和'合理'之间切换——核心结论的稳健性不足"
      - "VAS OPM仅单组假设反推——置信度B级(60%),缺乏独立验证源"
      - "CI按客户层分化无法从公开数据验证——CEO沉默使关键不确定性永久悬置"
      - "P1初版CI 5/5偏多(后修正)——分析起始偏差需要更早的mini-RT纠偏"

  hypothesis_tested:
    confirmed:
      - hypothesis: "宏观代理标的: 大盘支付公司80%价格波动由WACC/宏观驱动 (V报告教训L5)"
        evidence: "MA WACC贡献59%估值风险+Beta 1.07→比V更极端地验证了这一假说"
        confidence_after: "高(两份报告独立确认)"

      - hypothesis: "CI侵蚀是双寡头结构性特征而非暂时现象 (V报告)"
        evidence: "MA CI/毛收入从12%(FY2020)→16%(FY2025)年均+1pp(V为+1.6pp/年)→方向一致仅速度不同"
        confidence_after: "高(V+MA双验证)"

      - hypothesis: "Reverse DCF必须P1前置 (铁律O, CRM教训)"
        evidence: "Ch01 Reverse DCF有效建立'市场隐含9% CAGR'基线→后续分析围绕'9%合理吗'展开→防止结论先行"
        confidence_after: "高(执行确认,无反例)"

    extended:
      - hypothesis: "VAS利润率低于核心→混合OPM必然下降 (V报告VAS分析)"
        extension: "精确量化: VAS OPM=47%(V未给出精确值)→占比每+10pp=混合OPM-3pp→数学公式化"

    refuted: []  # 本报告未明确推翻任何前报告假说

  limitations:
    - "VAS OPM=47%仅单组假设反推,置信度60%——如果真实OPM为35-40%→利润率陷阱更严重→目标价应下调$15-20"
    - "Beta 1.07→WACC 9.01%是最大估值变量(±$70/股)——但Beta本身有±0.15不确定性→核心结论不稳健"
    - "CI按客户层分化是最高风险沉默域——CEO从未拆分,公开数据无法验证→关键假设建立在推断上"
    - "'FY2025是峰值'叙事概率45%——几乎是抛硬币→如果峰值成立则整个增长叙事需重写"
    - "CCCA通过概率(C级置信度45%)——如果通过则定价权法律基础动摇→影响±$40/股"
