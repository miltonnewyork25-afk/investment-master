    - dimension: "护城河深度"
      position: "ASML (EUV垄断90%) > KLAC (检测60%) > LRCX (刻蚀~40%) > AMAT (多元化~25%)"
      reasoning: "ASML是唯一真正的'无替代'垄断→技术不可复制性最强"

    - dimension: "估值吸引力(PE/PEG)"
      position: "AMAT (PE~20x) > KLAC (PE~25x) > LRCX (PE~30x) >> ASML (PE~49x)"
      reasoning: "ASML垄断溢价已充分定价→PEG最高→风险收益最差"

    - dimension: "周期脆弱性"
      position: "ASML (EUV需求集中) > AMAT (多元化缓冲) > LRCX (安装基础服务) > KLAC (检测刚需)"
      reasoning: "ASML营收高度集中于EUV新机台→周期下行时跌幅最大"

    - dimension: "地缘政治暴露度"
      position: "ASML (出口管制核心) > LRCX/AMAT (部分限制) > KLAC (限制较少)"
      reasoning: "ASML是'芯片战争'的中心节点→政策变化影响最大"

  industry_position:
    quadrant: "最高护城河 × 最高估值 × 最高地缘风险"
    archetype: "技术垄断收费站 — 收费绝对但估值已透支, 地缘政治是外生风险变量"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含CAGR 22-25% vs 历史最佳14%→差距8-11pp=AI永续溢价+垄断永续溢价"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1~RT-6六轮红队→承重墙LBW-1(EUV不可颠覆)从HIGH→CRITICAL→最大纠偏"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "AI CapEx纪律化是温水煮青蛙路径→不会突然崩塌而是逐季放缓→ASML订单滞后12-18月传导"

  novel_patterns:
    - name: "Core vs Option分离(垄断版)"
      description: "将垄断企业市值拆分为已验证Core业务+未量产技术期权→当Option>Core=叙事泡沫信号"
      transferable_to: ["NVDA(数据中心Core vs机器人/自动驾驶期权)", "TSLA(汽车Core vs FSD/Robotaxi期权)", "所有PE>40x的科技垄断"]

    - name: "出口管制反作用加速器"
      description: "制裁短期保护垄断但长期培养替代者→替代者采用路径创新(绕过)而非正面突破(复制)→突破时间比'正面攻克'预期短50%+"
      transferable_to: ["EDA工具(Synopsys/Cadence vs 中国替代)", "先进材料(日本光刻胶vs中国替代)", "所有受出口管制影响的技术垄断"]

    - name: "垄断脆弱度升级机制"
      description: "红队攻击中承重墙脆弱度可以升级(HIGH→CRITICAL)→多条独立攻击路径汇聚时风险非线性叠加→中国+xLight+NIL三路径效应"
      transferable_to: ["所有面临多路径替代威胁的技术垄断", "任何单一护城河面临多维度攻击的公司"]

    - name: "期望收益为负的品质公司"
      description: "即使公司品质极高(ROE 48.5%/ROIC 135.6%), 当估值隐含完美执行时期望收益可以为负→品质≠回报在极端PE下更为显著"
      transferable_to: ["所有CQI>80但PE>40x的公司", "品质陷阱的极端版本"]

  framework_contributions:
    moat_insights:
      - insight: "技术垄断的'自毁悖论': 定价权越强→客户替代动力越大→替代投入越多→垄断窗口缩短"
        implication: "评估技术垄断时增加'替代压力指标': ASP年涨幅>10%且持续>3年=替代加速信号"
      - insight: "出口管制不保护垄断, 长期可能加速替代(中国LDP案例)"
        implication: "评估受政策保护的护城河时, 必须考虑'政策反作用'维度 — 保护越强, 替代越快"

    valuation_insights:
      - insight: "Core vs Option分离暴露垄断企业的'叙事泡沫'→ASML Core仅€491 vs 市价€1,407"
        implication: "所有PE>40x的科技垄断应强制执行Core vs Option分离, 当Option/Core>100%=叙事泡沫警告"
      - insight: "Reverse DCF隐含假设需WFE市场扩张12-14倍 — 用市场容量约束检验增长假设合理性"
        implication: "增加'TAM约束检验': 隐含增长要求TAM扩张>5倍且无明确驱动因素=假设不可靠"

    screening_insights:
      - insight: "品质极高(ROE>40%)+期望收益为负(-3%)=典型的'品质陷阱'在极端PE下的表现"
        implication: "选股筛选加入'品质陷阱过滤器v2': ROE>30%但PE>40x且期望收益<0%→标记为纯等待型"
      - insight: "半导体设备周期性铁律: 即使AI驱动, 设备投资的周期特征不会消失"
        implication: "半导体设备选股时机>选股标的 — 在下行周期买入胜于在上行周期选择'最好的'公司"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "看到PE>40x的垄断企业, 立刻做Core vs Option分离"
      trigger: "PE>40x 且 公司被描述为'不可替代的垄断'"
      origin: "ASML Core仅€491/股 vs 市价€1,407→期权占市值65%→不是买垄断而是买期权"
      generalization: "对所有高估值科技公司: 先分离已验证收入和未量产技术→看你实际在为什么付钱"

    - habit: "对出口管制保护的垄断追问'制裁是否在培养竞争者'"
      trigger: "公司受益于出口管制/制裁 且 被限制方有国家意志支持"
      origin: "中国LDP绕过LPP架构→路径创新比正面突破快→出口管制加速了替代时间表"
      generalization: "制裁=短期保护+长期催化。保护窗口通常<10年, 而市场常按'永续'定价"

    - habit: "在行业繁荣顶部用Reverse DCF检验'隐含假设的荒谬性'"
      trigger: "行业处于繁荣期 且 公司PE>历史均值+1σ"
      origin: "ASML隐含需WFE市场扩张12-14倍→物理约束检验暴露假设不可能性"
      generalization: "将隐含增长翻译成TAM扩张倍数→如果需要整个行业不合理扩张=估值泡沫"

    - habit: "追问'垄断脆弱度能否升级' — 多条独立攻击路径汇聚时风险非线性"
      trigger: "垄断企业面临>2条独立的技术替代路径"
      origin: "中国LDP+xLight FEL+Canon NIL三路径独立推进→单独看概率低→组合概率>40%"
      generalization: "单一替代路径概率可能只有15-25%, 但3条独立路径的'至少一条成功'概率=1-(1-p)^3→远高于直觉"

  quality_feedback:
    strengths:
      - "DM密度1.68/千字(超1.5目标) — 数据锚定扎实, 712个DM覆盖全报告"
      - "Reverse DCF+Core vs Option双框架 — 从两个独立角度得出相同结论(高估)"
      - "RT-1~RT-6六轮红队 — 承重墙脆弱度升级机制是有效的新贡献"
      - "9种估值方法7种低于市价 — 估值结论高度收敛, 稳健性强"
      - "非共识注册表+概率影响矩阵 — 风险量化系统性强"
    weaknesses:
      - "v10.0框架(早期版本) — 无D1-D11记分卡/CQI/因果密度门控等后续改进"
      - "部分估值数字不一致 — 报告中出现€1,091和€1,407两个'当前市价'(可能写作过程中股价变动)"
      - "中国LDP量产35%概率赋值缺乏足够锚定 — 需要历史基准率+压力测试三重验证"
      - "对AI需求结构性vs周期性的判断偏模糊 — 未给出明确的区分框架"

  hypothesis_tested:
    confirmed:
      - hypothesis: "品质最高≠回报最高 (CME垄断三角)"
        evidence: "ASML ROE 48.5%/ROIC 135.6%(品质极高)但期望收益-3%(回报为负)→品质陷阱的极端案例"
        confidence_after: "高(CME+ASML两个独立案例确认)"

      - hypothesis: "Reverse DCF P1前置有效防止结论先行偏差 (CRM铁律O)"
        evidence: "Reverse DCF率先暴露隐含22-25% CAGR的荒谬性→定调为审慎关注而非盲目乐观"
        confidence_after: "高(执行确认)"

    extended:
      - hypothesis: "Core vs Option分离 (通用技术)"
        extension: "ASML案例将分离从财务工具升级为'叙事泡沫检测器'→当Option>Core=市场在为故事而非业务付钱"

    refuted:
      - hypothesis: "出口管制=垄断保护伞(行业常识)"
        evidence: "中国LDP路径绕过EUV架构→制裁刺激路径创新→保护窗口比'永续'假设短得多"
        lesson: "制裁保护有半衰期。保护越严格→被保护方创新动力越弱+被限制方创新动力越强→保护半衰期越短"

  limitations:
    - "v10.0框架(2026-02), 无后续质量改进(记分卡/因果密度门控/铁律N证据链等) — 分析方法论有代际差距"
    - "报告中股价基准不一致(€1,091和€1,407交替出现) — 可能影响部分估值结论的精度"
    - "中国EUV进展数据主要来自新闻报道而非技术评审 — 量产良率/成本的核心变量缺乏硬数据"
    - "AI CapEx周期持续性判断依赖定性分析 — 未建立量化的周期位置指标(如Book-to-Bill趋势模型)"
    - "台海风险使用Polymarket概率(10.5%)但未做独立校准 — 预测市场在尾部风险定价上可能失准"
