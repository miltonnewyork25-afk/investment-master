# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "技术垄断的自强化与脆弱性悖论"
    chain: >
      ASML 15年+€数百亿研发→10万零件精密集成→全球唯一EUV商业化
      → 客户(TSM/Samsung/Intel)产线深度绑定→迁移成本=重建产线
      → 定价权绝对(EUV单台€200M+, High-NA €350M+)
      → 高利润再投入R&D(€4.3B/年)→技术领先持续扩大
      → 但: 出口管制刺激中国"不对称资源动员"→LDP绕过LPP
      → 且: 每一代技术复杂度指数增长→成本递增→客户ROI递减
      → 悖论: 技术越领先→价格越贵→客户越想找替代→替代投入越大
    transferable_to: "所有技术垄断企业(光刻/检测/先进材料) — 越强的垄断催生越强的替代动力"
    reasoning_habit: "对技术垄断追问'垄断本身是否在加速替代?' — 定价权的极限就是客户寻找替代的起点"

  - id: "CC-2"
    name: "隐含期权价值的泡沫检测"
    chain: >
      市价€1,407 × 389M股 = €547.3B
      → Core业务(EUV+DUV+服务)估值: €190.9B = €491/股
      → 差额€916/股 = 隐含期权价值 = Core价值的187%溢价
      → 期权内容: High-NA商业化 + Hyper-NA + 新应用市场 + 地理扩张
      → 检验: High-NA需2026-2028量产+客户>20台/年+良率达标
      → 且: Hyper-NA仅研发阶段(2030年代) → 时间折现后价值有限
      → 结论: 市场为不确定的远期期权支付了确定性的高溢价
    transferable_to: "所有高PE科技公司的'Core vs Option'分离分析(NVDA/TSLA/PLTR类)"
    reasoning_habit: "看到PE>40x时,先做Core vs Option分离 — 如果期权价值>Core价值, 追问期权实现条件是否合理"

  - id: "CC-3"
    name: "出口管制的非线性反作用"
    chain: >
      美国出口管制→ASML禁售EUV给中国
      → 短期: 中国收入下降(40%+→<30%)→收入损失可量化
      → 但: 制裁压力→中国启动"曼哈顿计划"式EUV研发→LDP技术路径绕过LPP
      → 2026年中国LDP进入量产阶段(超预期)
      → 且: DUV多次曝光工艺创新→在某些应用绕过EUV需求
      → 长期: 出口管制≠保护ASML垄断, 可能=加速替代技术诞生
      → 关键变量: 中国方案的良率和成本→如果达到EUV 70%性能@50%成本→颠覆开始
    transferable_to: "所有受出口管制保护的技术垄断(半导体设备/EDA/先进材料)"
    reasoning_habit: "制裁保护垄断是短期逻辑; 长期追问'制裁是否在培养竞争者' — 压力是创新最强的催化剂"

  - id: "CC-4"
    name: "周期性vs结构性的识别框架"
    chain: >
      ASML 2026年营收指引€44.2B(+35.4%)→看似结构性增长
      → 但: AI CapEx $700B+可能包含前置需求(恐慌性采购)
      → 历史: 2022年ASML营收大幅下滑→设备投资强周期性是铁律
      → 检验: 如果2027年CapEx增速放缓→ASML营收可能回落20-30%
      → 关键区分: 看订单/收入比 — >1.2x=需求超供给=结构性 | <0.8x=前置消化=周期性
      → 当前: 供应紧缺掩盖了真实需求信号→周期顶部特征
    transferable_to: "所有受AI周期驱动的半导体设备/基础设施公司(LRCX/KLAC/AMAT)"
    reasoning_habit: "在行业繁荣期问'这是需求拉动还是恐慌囤货?' — 订单/收入比是最直接的区分指标"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "EUV垄断不可突破, 中国至少需10年"
      final: "中国LDP技术2026年已进入量产, 可能比预期提前5年"
      pivot: "LDP绕过LPP架构→不需要复制ASML全栈→技术路径创新降低了突破难度"

    - initial: "48.8x PE反映EUV垄断溢价是合理的"
      final: "Reverse DCF显示需22-25% CAGR维持10年+WFE市场扩张12-14倍 — 隐含假设显著激进"
      pivot: "Core vs Option分离后发现: 核心仅值€491/股, 期权溢价187%=市场为远期不确定性支付确定性价格"

  surprises:
    - finding: "隐含期权价值€916/股 — 超过Core价值€491/股的187%"
      implication: "市场本质上在为High-NA/Hyper-NA等未量产技术支付比已验证垄断业务更高的价格 → 典型的远期叙事过度定价"

    - finding: "中国LDP技术2026年量产(比行业预期提前) — 架构绕过而非正面突破"
      implication: "技术垄断的突破方式不是正面复制(10年+)而是路径创新(5年) — 改变EUV垄断窗口评估"

    - finding: "概率加权期望收益为负(-3.0%) — 即使考虑Bull情景仍然不值得在当前价位投资"
      implication: "ASML是极好的公司但极差的投资(在当前价格) — 品质≠回报的又一个案例"

    - finding: "承重墙LBW-1(EUV不可颠覆)脆弱度从HIGH升至CRITICAL"
      implication: "红队攻击后, EUV垄断的持久性假设被显著削弱 — 中国+xLight+NIL三重路径同时推进"

  blind_spots:
    - area: "High-NA EUV良率和客户采纳进度"
      why_matters: "High-NA商业化是期权价值€916/股中最大的单一组成部分 → 延迟1年可能削减期权价值30%+"
      monitor: "2026 Q4 High-NA订单数 | Intel/TSM采纳时间表 | 良率公开数据"

    - area: "中国LDP量产的实际良率和成本"
      why_matters: "决定中国替代是'实验室成果'还是'商业威胁' → 良率>80%@成本<EUV 60%=真实威胁"
      monitor: "中国Fab先进制程良率报告 | SMIC/YMTC产品节点进展"

    - area: "AI CapEx周期的实际持续时间"
      why_matters: "ASML 2026年+35%增长完全建立在AI CapEx持续假设上 → 如果2027年放缓, 营收可能下滑20-30%"
      monitor: "微软/Google/Meta季度CapEx指引 | 数据中心利用率趋势"

  sell_lessons:
    - scenario: "在PE>45x且增长假设需'完美执行'才能支撑时不卖 → 周期下行时面临PE+EPS双杀"
      lesson: "技术垄断不免疫周期性。在设备周期顶部, 即使护城河完好, PE压缩+营收下滑可以造成40%+跌幅"
      transferable: "所有半导体设备公司(LRCX/KLAC/AMAT)和周期性科技垄断"
    - scenario: "因为'垄断溢价'而忽视期权价值>Core价值的异常 → 期权未兑现时估值崩塌"
      lesson: "当期权价值>Core价值时, 你买的不是垄断而是期权 — 期权有时间衰减, 垄断没有"
      transferable: "所有PE>40x且增长依赖未量产技术的公司(TSLA自动驾驶/NVDA机器人)"

