  fair_value: "€993-1,172/股 (核心估值中位数€1,083); 风险调整后€618-763/股"
  expected_return: "概率加权期望收益-3.0% @ €1,407 | Bull(25%): +25-30% | Base(40%): 持平~-15% | Bear(35%): -40~-55%"

  key_arguments:
    - claim: "EUV垄断护城河极深, 5-10年内无实质威胁"
      direction: bullish
      magnitude: 5
      mechanism: "15年+€数百亿研发→10万零件精密集成→全球唯一EUV供应商→90%市占率→客户(TSM/Samsung/Intel)无替代→绝对定价权"
      kill_switch: "中国EUV量产成功(35%概率2026-2027) 或 xLight FEL技术在2028年实现硅里程碑(25%概率)"

    - claim: "48.8x PE隐含了显著激进的增长假设, 当前价格缺乏安全边际"
      direction: bearish
      magnitude: 5
      mechanism: "Reverse DCF隐含: 营收CAGR 22-25%(10年) + OPM 38-40% + 永续增长4-4.5% → 需WFE市场扩张12-14倍 → 多个乐观假设必须同时成立"
      kill_switch: "AI超级周期持续超预期(CapEx $700B+持续3年+) → 隐含增长假设变为合理"

    - claim: "AI超级周期可能是周期性繁荣而非结构性变化"
      direction: bearish
      magnitude: 4
      mechanism: "半导体设备历史强周期性→2022年ASML营收曾大幅下滑→当前库存前置可能透支未来需求→资本纪律回归信号已出现"
      kill_switch: "AI应用落地持续加速(企业AI采用率>50%) → 结构性需求确认"

    - claim: "地缘政治是双刃剑: 中国业务损失vs战略稀缺性溢价"
      direction: conditional
      magnitude: 4
      mechanism: "出口管制→中国收入从40%+降至<30%→直接收入损失 | 但ASML='芯片战争'核心武器→获军工类战略溢价 | 台海冲突概率10.5%(Polymarket)→核心客户TSM风险"
      kill_switch: "台海军事冲突实际发生 → TSM产能中断 → ASML收入断崖"

    - claim: "市场隐含期权价值€916/股(Core价值187%溢价)严重高估"
      direction: bearish
      magnitude: 4
      mechanism: "Core业务(EUV+DUV+服务)仅值€491/股→差额€916来自High-NA/Hyper-NA/新市场期权→期权实现需技术+市场+政治多重条件同时满足"
      kill_switch: "High-NA EUV 2027年量产顺利+订单>20台/年 → 期权价值部分确认"

  moat:
    composite_score: 9.0
    half_life: "EUV核心>15年 | DUV>10年 | 服务>10年 | 但受中国自主化+替代技术侵蚀"
    dimensions:
      - type: ip
        strength: 5
        evidence: "38,000项专利+15年EUV研发+10万零件系统集成→全球唯一商业EUV供应商→90%市占率"
        vulnerability: "中国LDP技术路径绕过LPP架构 | xLight FEL技术$150M美政府投资 | 核心专利到期风险"
