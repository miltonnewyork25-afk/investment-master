        evidence: "CDU产能45x扩张 + 马来西亚柔佛新厂 + 美国南卡Pelzer扩建 → 产能领先竞对12-18月"
        vulnerability: "Eaton以$95B收购Boyd快速获得液冷能力, Schneider收购Motivair → 产能差距将在18月内收窄"
      - type: switching_cost
