meta_learning:
  reasoning_habits_acquired:
    - habit: "对高PE公司立刻做SOTP拆解, 量化叙事溢价"
      trigger: "PE > 同业50%+ 且 公司有'传统+新概念'混合特征"
      origin: "VRT PE 46x vs Eaton 31x, SOTP仅$70B vs 市值$93B → 33%纯叙事溢价被量化"
      generalization: "所有'旧身体新灵魂'公司: 计算SOTP缺口, 缺口>25%=叙事风险高, 必须追问兑现条件"

    - habit: "看到70%+份额时三问: 专利? 客户多元化动力? 追赶时间?"
      trigger: "供应商声称份额>50%且依赖单一大客户平台"
      origin: "VRT CDU 70% → 非专利技术+NVIDIA有多元化动力+追赶需12-18月 = 初代红利非持久护城河"
      generalization: "初代供应商红利是暂时的, 持久护城河需要ASML式的物理定律壁垒"

    - habit: "画信念依赖图找根信念, 测试单点故障级联影响"
      trigger: "估值建立在≥3个假设同时成立且PE>30x"
      origin: "VRT 6面承重墙中B4(AI CapEx)是根信念, 单独失败导致三重打击-40%至-60%"
      generalization: "高PE估值=多信念堆叠, 堆叠越高级联风险越大. 找到根信念是估值分析的第一步"

    - habit: "做翻转敏感性而非仅做区间估值"
      trigger: "估值结论处于两个评级的边界"
      origin: "VRT评级翻转仅需S3概率+3pp → 暴露了'中性关注'结论的极端脆弱性"
      generalization: "估值不仅要给区间, 还要给'翻转所需的最小参数变化' — 翻转阈值越小, 结论越不可靠"

  quality_feedback:
    strengths:
      - "竞争格局分析深度 — Eaton/Schneider/英维克各有独立量化对标, 英维克深度剖析(垂直整合/成本/泰国工厂)是竞品分析标杆"
      - "Reverse DCF+承重墙框架 — 6面承重墙+脆弱度评分+级联传导图是估值分析的最佳实践"
      - "红队七问(RT-1~RT-7) — 5个新发现全部为空头方向, 有效平衡了公司画像分析/财务分析的看多倾向"
      - "三条不依赖估值的洞见 — 独立于WACC/PE/概率假设, 对任何投资者都有实用价值"
    weaknesses:
      - "DM密度0.30/千字(远低于门控0.8) — 数据锚定严重不足, 大量推断缺乏DM锚点"
      - "液冷营收$1.2B是D级数据 — SOTP最关键分部建立在D级数据上, 系统性弱点"
      - "CDU份额70%是C级数据(管理层声称) — 核心论文变量缺乏第三方验证"
      - "因果推理密度偏低 — 158次因果标记/367K字符≈4.3/万字, 处于警告区间(3.0-5.0)"

  hypothesis_tested:
    confirmed:
      - hypothesis: "AI基础设施公司PE溢价高度依赖CapEx周期(NVDA/AVGO/VRT)"
        evidence: "VRT承重墙B4(AI CapEx)是根信念, 脆弱度60/125, 所有其他信念依赖B4"
        confidence_after: "高(VRT是继NVDA后又一个证明CapEx依赖性的案例)"

    extended:
      - hypothesis: "初代供应商红利(iPhone→富士康/立讯)"
        extension: "扩展至AI基础设施: VRT CDU 70%(GB200独供) → GB300开放 → 份额必然下降. 技术非垄断+客户有多元化动力=红利, 不是护城河"

      - hypothesis: "中国制造商通过垂直整合挑战西方品牌溢价"
        extension: "英维克>90%自研+泰国工厂→直接进入VRT亚太腹地. 不仅限于消费电子(华为/小米), 也适用于工业品B2B"

    refuted: []

  limitations:
    - "液冷营收$1.2B和CDU份额70%均为C-D级数据 → SOTP中权重最大的分部建立在最弱数据上"
    - "800V HVDC标准化时间线(3-5年)超出本报告有效期(12-18月) → CQ3只能维持35%不变"
    - "VRT不单独披露液冷/AI业务财务数据 → 分部估值高度依赖分析师推算"
    - "AI CapEx周期持续性本质上是二元判断(持续/中断), 不可用历史频率校准 → B4概率赋值主观性高"
    - "英维克A股数据可及性有限 → 竞品分析中英维克部分依赖二手信息"
