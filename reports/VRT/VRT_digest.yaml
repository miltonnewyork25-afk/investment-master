# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "AI叙事溢价的SOTP量化"
    chain: >
      VRT营收85%来自传统工业品(UPS/配电/空调/服务)
      → 按Eaton/Schneider同业倍数估传统业务=$52B
      → 液冷(15%营收)即使给55x PE也仅值$18B
      → SOTP合计$70B vs 市值$93B
      → 缺口$23B(33%)=纯AI叙事溢价
      → 溢价隐含市场赌"液冷占比从15%→30-40%"
      → 如果占比提升不及预期(竞争+800V), 溢价面临压缩
    transferable_to: "所有'传统业务体+新概念估值外衣'的公司(如传统车企的EV估值溢价)"
    reasoning_habit: "对高PE公司做SOTP拆解 — 量化'叙事溢价=市值-SOTP'的具体金额, 然后追问溢价的兑现条件"

  - id: "CC-2"
    name: "初代供应商红利的识别逻辑"
    chain: >
      VRT是GB200唯一认证CDU供应商(排他) → 70%份额
      → 追问: 份额是技术垄断还是初代红利?
      → CDU核心技术(板式换热器+泵+管路)=成熟工业技术, 非专利保护创新
      → 历史类比: iPhone初代仅富士康, 后扩展至立讯/和硕; 思科网络设备80%→30-40%
      → NVIDIA有供应链多元化核心利益(降低成本+保供)
      → GB300已加入Schneider+Motivair → 英维克获中国区50%
      → 结论: 70%是初代红利, 结构性份额可能是35-45%(双寡头)
    transferable_to: "所有'首发独供→多元化'路径的供应商(芯片代工/汽车零部件/AI芯片)"
    reasoning_habit: "看到100%或70%+份额时立刻问: 这是技术垄断(ASML式)还是初代红利(iPhone供应链式)? 核心技术是否有专利壁垒?"

  - id: "CC-3"
    name: "承重墙级联传导: 单点故障如何毁灭估值"
    chain: >
      VRT $243估值建立在6面承重墙同时成立
      → B4(AI CapEx持续)是根信念, B1/B2/B5都依赖B4
      → B4失败(超大规模2028削减CapEx) → 级联效应:
      → B1收入增速从28%降至8-12% → B2液冷需求放缓 → B5 PE从46x压缩至25-30x
      → 三重打击: 收入miss + 利润率承压 + PE压缩 = 股价-40%至-60%
      → 评级翻转仅需S3概率+3pp(30%→33%) = 一条超大规模CapEx下调新闻即可触发
    transferable_to: "所有估值建立在多个假设同时成立的高倍数公司"
    reasoning_habit: "对高PE公司画'信念依赖图' — 找到根信念(所有其他假设都依赖的那个), 测试根信念单独失败的级联影响"

  - id: "CC-4"
    name: "英维克模式: 垂直整合如何挑战品牌溢价"
    chain: >
      英维克核心部件自研>90%(微通道冷板→CDU→工质→管路) vs VRT偏系统集成+品牌溢价
      → GB300取消CDU排他认证 → 英维克即获中国区50%份额
      → 英维克泰国工厂2026Q3投产(5万台/年) → 直接进入VRT亚太腹地
      → VRT亚太利润率仅9.9%(远低于美洲26.8%) → 成本竞争中劣势
      → 如果液冷走向标准化/商品化(类似UPS历史) → 英维克成本优势放大
      → A股液冷估值泡沫回调 → 英维克可能被迫价格战 → 压低全球CDU定价基准
    transferable_to: "所有'垂直整合低成本'挑战'系统集成品牌溢价'的竞争格局(中国制造业vs西方品牌)"
    reasoning_habit: "分析竞争格局时, 找到成本最低的垂直整合者 — 追问'如果产品标准化, 品牌溢价还能维持多久?'"

  - id: "CC-5"
    name: "800V HVDC的净零影响悖论"
    chain: >
      共识: 800V HVDC将消灭传统UPS需求 → VRT核心业务承压
      → 深入分析: 即使800V架构, 数据中心仍需电力备份(UPS核心功能)
      → VRT可开发800V兼容新一代UPS, ASP可能更高
      → 净影响: UPS收入-$1.5B(传统被替代) + 800V新产品+$1.5B(如果成功转型) ≈ 零
      → 关键前提: VRT必须成功转型为800V设备供应商
      → 如果转型失败(第三方抢占) → 收入影响是-$1.5B纯负面
      → 验证窗口: 2028+(VRT尚未公布800V产品规格和定价)
    transferable_to: "所有面临技术路线转换的制造商(如燃油车→电动车)"
    reasoning_habit: "技术颠覆分析不只看'旧产品消失', 还要算'新产品创造' — 净影响可能远小于单边分析暗示的"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "PE 46x = AI基础设施公司估值, VRT定位在NVDA(60x)和Broadcom(40x)之间"
      final: "PE 46x为85%传统工业品公司定价, SOTP仅支撑$70B(vs $93B市值), 33%是纯叙事溢价"
      pivot: "SOTP拆解显示即使液冷给55x, 传统业务占主导的公司SOTP仅$70B"

    - initial: "液冷CDU 70%+份额=可持续护城河"
      final: "70%是GB200初代供应商红利, 结构性份额可能35-45%(CQ2从初始45%降至37%)"
      pivot: "GB300开放认证+英维克获中国区50%+CDU技术非专利保护+iPhone供应链类比"

    - initial: "FY25 GAAP净利润暴增169%=盈利能力飞跃"
      final: "剥离权证负债公允价值变动后真实增长36-46%, 权证噪音在FY25基本消除"
      pivot: "SPAC权证结构导致FY23-24 GAAP利润严重失真, 需用调整后数据评估"

    - initial: "800V HVDC对VRT是纯负面威胁"
      final: "净影响可能接近零(前提: VRT成功转型为800V设备供应商); 如果失败则-$1.5B纯负面"
      pivot: "DC在任何架构下都需电力备份 + 800V兼容UPS的ASP可能更高"

  surprises:
    - finding: "评级翻转仅需S3概率+3pp(30%→33%) — 一条超大规模CapEx下调新闻即可改变结论"
      implication: "VRT是一个无法给出高置信度评级的公司 — 分析精度vs结论脆弱性严重失衡"

    - finding: "ROE 41.8%中88%由杠杆驱动(PE buyout遗留), 非运营能力"
      implication: "高ROE不代表高品质 — 去杠杆后ROE将回落至正常工业品水平(15-20%)"

    - finding: "英维克PE 214x(A股) vs VRT PE 46x — 同业4.6倍估值差距"
      implication: "A股液冷估值泡沫如果破裂 → 英维克被迫价格战 → 压低全球CDU定价基准, 间接冲击VRT利润率"

    - finding: "情景离散度6.38x($63-$402) — 二元博弈属性, 结果空间跨6倍"
      implication: "VRT不适合传统估值逻辑(收敛型预测), 更适合用期权思维理解(买入=赌AI CapEx持续的看涨期权)"

  blind_spots:
    - area: "液冷营收$1.2B是D级数据(分析师推算, VRT不单独披露)"
      why_matters: "SOTP最关键分部(液冷43%估值贡献)建立在D级数据上 — 这是分析最大的结构性弱点"
      monitor: "VRT是否在未来财报中开始单独披露液冷营收"

    - area: "GB300/Rubin CDU供应商格局(2026H2前未知)"
      why_matters: "决定CQ2(液冷护城河)是37%还是50%+ → SOTP液冷分部估值$15-30B的差异"
      monitor: "2026H2 NVIDIA GB300参考架构公布 + CDU供应商名单"

    - area: "800V HVDC标准化时间线(3-5年验证延迟)"
      why_matters: "决定VRT $4B+ UPS业务是'升级'还是'被替代' → 验证前持续悬念"
      monitor: "NVIDIA GTC产品公告 | 超大规模DC新建项目的电力架构选择"

    - area: "AI CapEx周期持续性(B4根信念)"
      why_matters: "所有6面承重墙都依赖B4 → 历史上没有超过5年不回调的CapEx周期"
      monitor: "超大规模季度CapEx同比增速 | AI应用层收入(ROI验证)"

  sell_lessons:
    - scenario: "PE>40x买入后AI CapEx回调 → 三重打击(收入miss+利润率承压+PE压缩)"
      lesson: "高PE+高外部依赖性=极端脆弱组合。安全边际≈零时买入, 赌的不是公司好坏而是周期持续"
      transferable: "所有PE>35x且增速高度依赖外部CapEx周期的公司(AI基建/云基建/5G基建)"
    - scenario: "初代供应商红利消退后持有不减仓 → 份额从70%降至35-45%但PE未相应调整"
      lesson: "技术代际切换时供应商份额会剧烈变化 — 每代平台是重新评估的自然节点"
      transferable: "所有依赖单一大客户(NVIDIA/Apple/TSMC)平台认证的供应商"
    - scenario: "传统工业品公司享受概念溢价时不锁定利润 → 溢价回归=股价-30%"
      lesson: "叙事不是护城河 — 当SOTP缺口>25%时, 至少锁定一半仓位的利润"
      transferable: "所有传统业务体+新概念估值外衣的公司(传统车企EV溢价/传统银行AI溢价)"

