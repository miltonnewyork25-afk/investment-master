  moat:
    composite_score: 7.0  # 3.5/5 = 7.0/10
    half_life: "液冷技术领先12-18月(每代GPU重新洗牌) | 传统UPS/空调安装基数>10年 | NVIDIA关系随平台换代重置 | VOS运营优势>5年"
