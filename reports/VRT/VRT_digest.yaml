    - claim: "传统业务$170/股SOTP底部限制最大下行: 不是好的做空标的"
      direction: bullish
      magnitude: 4
      mechanism: "UPS+配电$19.8B + 传统热管理$13.6B + 服务$8.3B = $42B传统价值(每股~$110) + 液冷残值$60-70 = $170底部"
