        reasoning: "传统业务SOTP底部$170提供价值锚 + PE与Eaton趋近 → 以工业品价格买AI可选性"
      - trigger: "GB300 CDU VRT独占≥60%份额确认"
        price_zone: "当前价格下方10-15%(~$210)"
        reasoning: "护城河确认 → CQ2上调至50%+ → SOTP液冷上调$10-15/股 → 上调至关注"
      - trigger: "FY26 Q1大幅beat指引(>10%) + 积压环比继续正增长"
        price_zone: "$230-250"
        reasoning: "收入转化率验证 + 周期延续信号 → 短期确定性支撑持仓"
    hold_conditions:
