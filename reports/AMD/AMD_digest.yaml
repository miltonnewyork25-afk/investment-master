# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "进攻型护城河的双刃剑逻辑"
    chain: >
      AMD护城河本质是架构创新驱动而非生态锁定
      → 每一代(Zen N)都需重新证明(IPC提升+按时交付)
      → 成功时=份额增长引擎(EPYC 0%→41%)
      → 失败时=护城河1-2年内侵蚀(推土机时代2012-2016教训)
      → 估值应获增长溢价但不应获垄断溢价
      → Forward P/E 20x vs NVDA 47x部分反映此差异
      → 但如果ROCm追赶失败, 合理P/E应回落至15-18x(传统半导体)
    transferable_to: "所有依赖持续执行而非存量锁定的公司(晶圆厂/药企pipeline/内容创作)"
    reasoning_habit: "区分'进攻型护城河'(需持续证明)和'防御型护城河'(存量保护) — 两者的估值倍数和风险特征完全不同"

  - id: "CC-2"
    name: "GAAP vs Non-GAAP的巨大鸿沟如何误导估值"
    chain: >
      AMD TTM P/E 91x → 看似极度高估
      → 追问: 为什么TTM和Forward差距这么大?
      → 发现: GAAP EPS $2.65被Xilinx无形资产摊销$3B/年压低
      → Non-GAAP EPS约$5.6 → 调整后P/E约38x
      → Forward P/E 20.2x又隐含EPS从$2.65到$10.62(+300%)
      → 三个P/E(91x/38x/20x)讲了三个不同的故事
      → 投资含义: 用哪个P/E决定你在赌什么 — 91x赌现在, 38x赌正常化, 20x赌完全兑现
    transferable_to: "所有重大收购后GAAP利润被摊销扭曲的公司(AVGO/IBM/任何大型M&A)"
    reasoning_habit: "遇到GAAP和Non-GAAP巨大差距时, 追问'差距来自哪里' — 摊销/SBC/重组各有不同持久性"

  - id: "CC-3"
    name: "方法离散度本身是风险信号"
    chain: >
      6种估值方法产出$68-$300(4.42x离散)
      → 追问: 为什么离散这么大?
      → 根因: AMD双重身份 — TTM仅赚$2.65(DCF说$68)但共识两年后赚$10.62(Forward说$213)
      → 离散度反映的不是方法论缺陷而是对未来的真实分歧
      → 投资含义: 离散度>2x时任何单一目标价都是伪精度
      → 最诚实的方法是Reverse DCF(呈现假设, 不输出结论)
    transferable_to: "所有处于业务转型期、利润尚未正常化的公司"
    reasoning_habit: "计算多种方法的离散度 — 离散度>2x说明不确定性本身比任何估值结论都重要"

  - id: "CC-4"
    name: "ASIC替代而非补充的判断逻辑"
    chain: >
      市场共识: ASIC是GPU的补充品(特定工作负载)
      → 数据: ASIC增速44.6% vs GPU 16.1%(2.76倍)
      → 数据: 四大Hyperscaler全部押注自研ASIC(Google TPU v7/Amazon Trainium/Microsoft Maia/Meta MTIA)
      → 推断: 如果仅是补充为什么所有大客户都在做?
      → 关键分化: 训练(GPU仍主导) vs 推理(ASIC优势明显)
      → 推理占AI CapEx比例上升(30%→50%+)= ASIC可寻址市场持续扩大
      → 投资含义: AMD推理市场面临NVDA(上)+ASIC(下)双重挤压
    transferable_to: "所有面临客户纵向整合威胁的供应商(云厂商自研/车厂自研芯片/零售商自有品牌)"
    reasoning_habit: "当客户集体投入自研替代品时, 默认解读为'替代'而非'补充' — 除非有硬证据证明自研ROI不足"

  - id: "CC-5"
    name: "内部人信号与分析师评级的矛盾如何解读"
    chain: >
      分析师: 82% Buy评级, 0% Sell, PT均值$257
      → 内部人: A/D ratio 0.102(极度偏空), Lisa Su零买入
      → 机构: Fisher -$23.4B, Jennison -$9.3B, Baillie Gifford -$6.5B系统性清仓
      → 矛盾: 最了解公司的人在卖, 覆盖公司的人在推荐
      → 解读: 卖方Buy评级有系统性乐观偏差(55-60%覆盖率); 内部人有信息优势
      → 投资含义: 内部人信号权重应高于卖方评级
    transferable_to: "所有内部人系统性卖出但卖方仍推荐的公司"
    reasoning_habit: "当内部人和外部分析师方向矛盾时, 默认信内部人 — 他们有信息优势且用真金白银投票"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "AMD是AI周期第二赢家, Forward P/E 20x合理"
      final: "AMD AI GPU是'辛苦钱'(OpMargin天花板30-35%), 合理P/E 15-20x(成长型半导体)而非25x+(AI平台赢家)"
      pivot: "NVDA OpMargin 62% vs AMD ~20% — 34pp差距源自CUDA生态定价权, 非暂时性"

    - initial: "市场注意力在AI GPU(Instinct), 这是AMD的核心价值"
      final: "EPYC才是AMD真正的护城河 — 7年验证、50%+ OpMargin, GPU完全失败仍支撑$80-100底部"
      pivot: "EPYC份额0%→41%是硬数据验证的增长引擎; Instinct依赖ROCm(CUDA 50:1差距)不确定性极高"

    - initial: "AMD Q4暴跌-17%创造了买入机会"
      final: "暴跌是'从Bull回归Base'而非创造折价 — 概率加权$151.6 vs当前$213仍有+41%溢价"
      pivot: "Phase 4偏差修正: 锚定偏差(围绕$213收敛) + 确认偏差(ROCm数据选择性引用) + 叙事偏差(追赶成功线性外推)"

  surprises:
    - finding: "AMD AI溢价(~58%收入归因于AI)接近NVDA水平, 但AI护城河宽度远不及NVDA"
      implication: "市场为AMD的AI潜力支付了接近NVDA级别的溢价, 但AMD缺乏CUDA式生态锁定 — AI溢价可能定价过高"

    - finding: "Fisher Investments清仓$23.4B(全球最大单笔AMD减持之一), 持有周期5-10年的长期价值投资者"
      implication: "长期价值投资者集体撤退可能暗示: AI CapEx周期见顶预判 或 NVDA护城河不可逾越的判断"

    - finding: "存货$7.92B环比+38%为5年最高增幅, DIO 165天创新高, 但'备货'和'积压'两种解读均成立"
      implication: "库存歧义是AMD当前最重要的待解信号 — Q1-Q2 FY2026财报将决定是MI400备货(利好)还是需求放缓(利空)"

    - finding: "GPU利润率~20% vs CPU ~50% — GPU占比上升可能导致DC分部'增收不增利'"
      implication: "市场假设的利润率扩张路径与产品结构变化矛盾 — GPU权重越高混合利润率越低"

  blind_spots:
    - area: "MI400实际量产时间与良率"
      why_matters: "MI400是验证'AI GPU第二平台'叙事的核心事件 — 按时且性能达标→+20%; 延迟3月+良率60%→-30%"
      monitor: "AMD 2026 Q2财报(4月) — MI400时间表确认; GTC 2026(3月) — Vera Rubin benchmark对比"

    - area: "AI CapEx周期的位置(早期还是中后期)"
      why_matters: "决定$213隐含的15-17% 10年CAGR是否可信 — 早期=可信, 中后期=过度外推"
      monitor: "2026 H2四大Hyperscaler CapEx指引 — 任一下调>15%为预警"

    - area: "ROCm能否达到'生态临界质量'"
      why_matters: "决定AMD在AI GPU市场是'永久折价竞争者'(15-20x P/E)还是'第二生态平台'(25-30x P/E)"
      monitor: "ROCm 7.x release(2026 H1) — Multi-GPU差距是否从29-46%缩至<15%"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "Forward P/E看似合理(20x)但TTM P/E极高(91x) — 被Forward P/E锚定忽视了EPS+300%假设的脆弱性"
      lesson: "当Forward和TTM P/E差距>3倍时, 市场在赌极端增长 — 任何miss都会引发Forward P/E跳升。不应被Forward P/E的表面合理性迷惑"
      transferable: "所有利润正在高速正常化的成长型公司(SaaS从亏损到盈利/周期股底部翻转)"

    - scenario: "内部人系统性卖出(A/D 0.102) + 长期机构清仓($39B) 但卖方仍82% Buy"
      lesson: "内部人和长期机构的行为比卖方评级更有信息含量。当两者持续矛盾时, 应降低持仓置信度"
      transferable: "所有内部人A/D<0.2且大型价值机构同时减持的公司"

    - scenario: "好公司+坏价格的矛盾 — 10维度中'公司质量'偏强但'价格合理性'偏弱"
      lesson: "好公司≠好投资。估值吸引力和风险可控性比公司质量更直接决定回报。价格错误比分析错误更常见"
      transferable: "所有CQI>70但PE>25x的高品质成长股"

