        implication: "选股筛选加入'聪明钱一致性'过滤器: 内部人+长期机构+卖方三者方向一致时信号最强"
      - insight: "AI溢价/AI护城河宽度比值 — AMD获得~58% AI溢价但AI护城河远不及NVDA"
        implication: "对AI受益股, 计算'AI溢价效率': 溢价%/护城河评分 — 比值过高=AI溢价定价过高"
      - insight: "进攻型护城河公司的估值应有'执行折价' — 每一代需重新证明, 失败概率≠0"
        implication: "选股时对进攻型护城河公司给5-15%的P/E折价(vs防御型同行)"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "区分进攻型和防御型护城河, 给不同估值倍数"
      trigger: "分析到公司护城河依赖持续执行(每代新产品/每年新内容)而非存量锁定(生态/专利/制度)"
      origin: "AMD EPYC(进攻: 7代Zen需代代胜出) vs NVDA CUDA(防御: 18年生态+数百万开发者锁定)"
      generalization: "进攻型护城河→增长溢价(15-20x) | 防御型护城河→垄断溢价(25-40x) | 不同物种不同估值"

    - habit: "Forward和TTM P/E差距>3x时自动触发Reverse DCF"
      trigger: "公司利润正在快速正常化, GAAP利润被非经常性项目扭曲"
      origin: "AMD TTM 91x vs Forward 20.2x → 差距4.5x → Reverse DCF揭示+300% EPS假设的脆弱性"
      generalization: "差距越大, Forward P/E越不可信, Reverse DCF越有价值 — 因为它暴露的是假设而非给出结论"

    - habit: "内部人和卖方矛盾时, 默认信内部人"
      trigger: "内部人A/D<0.2 且 卖方Buy%>70%"
      origin: "AMD A/D 0.102 + Lisa Su零买入 vs 82% Buy评级 + 0% Sell → 最了解公司的人在用真金白银投票"
      generalization: "内部人有信息优势且有skin in the game; 卖方有结构性乐观偏差(55-60%永远是Buy)"

    - habit: "对多分部公司拆解利润率mix效应"
      trigger: "公司高增长分部和高利润分部不是同一个"
      origin: "AMD DC增长靠GPU(OpMargin ~20%)但利润靠CPU(~50%) → GPU占比↑= 混合利润率↓ = 增收不增利"
      generalization: "增长引擎和利润引擎分离时, 收入增速不等于利润增速 — 必须按分部拆解验证"

  quality_feedback:
    strengths:
