      transferable_to: ["药企(pipeline vs专利)", "内容公司(持续创作vs IP库)", "所有'执行依赖型'公司"]

    - name: "方法离散度作为不确定性量化指标"
      description: "6种估值方法的极差/中位数比=离散度指标 — >2x说明不确定性本身比任何估值结论都重要, 应给区间而非点估计"
      transferable_to: ["所有业务转型期公司", "利润未正常化的高增长公司"]

    - name: "GPU/CPU Mix利润率敏感性模型"
      description: "DC分部GPU/CPU占比变化→混合利润率方向: GPU占比每+10pp→DC混合OpMargin -2~3pp. 三情景(50/50→35%, 60/40→31%, 70/30→28%)"
      transferable_to: ["所有多产品线利润率差异>15pp的公司", "业务结构转型中的混合利润率预测"]

    - name: "ROCm生态折价模型"
      description: "软件生态功能对等%→定价权%→margin%的三层传导链: ROCm 93%通过率→仍需30-40%折价→GPU OpMargin天花板30-35%"
      transferable_to: ["所有依赖软件生态的硬件公司(Android vs iOS设备商)", "云计算IaaS定价"]

    - name: "ASIC侵蚀传导模型"
      description: "ASIC份额→GPU可寻址市场→AMD份额三层传导: 2028年ASIC 45%→GPU TAM缩40%→AMD Instinct天花板$15-18B"
      transferable_to: ["所有面临客户纵向整合的供应商"]

    - name: "6层半导体周期雷达"
      description: "存储价格/CapEx/设备/库存/利用率/终端需求六层信号叠加判断周期位置 — 各层领先滞后关系不同"
      transferable_to: ["所有半导体公司的周期定位"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "进攻型护城河(持续执行依赖) vs 防御型护城河(存量锁定)是两个完全不同的物种"
        implication: "护城河评估需先分类再评分 — 进攻型给增长溢价, 防御型给垄断溢价, 不能用同一把尺子"
      - insight: "同一公司不同分部可以有性质完全不同的护城河(AMD: CPU进攻强/GPU防御弱/FPGA中)"
        implication: "SOTP估值时每个分部应独立评估护城河类型和对应PE倍数"
      - insight: "x86 ISA双寡头壁垒是'生存权护城河'而非'竞争力护城河' — 保证不消失但不保证份额"
        implication: "评估制度性壁垒时区分'准入壁垒'和'竞争壁垒' — 准入壁垒决定底部, 竞争壁垒决定upside"

    valuation_insights:
      - insight: "方法离散度>2x时给区间比给点估计更诚实 — 4.42x离散度下任何单一目标价都是伪精度"
        implication: "对高不确定性公司, 报告核心产出应从'目标价'转向'假设映射+条件范围'"
      - insight: "Reverse DCF对快速增长但利润未正常化的公司尤其有价值 — 翻转问题从'值多少'到'价格赌什么'"
        implication: "TTM P/E和Forward P/E差距>3x的公司, 强制使用Reverse DCF作为主估值框架"
      - insight: "GAAP/Non-GAAP/Forward三个P/E讲三个不同故事 — 用哪个决定你在赌什么"
        implication: "对大型M&A后公司, 必须拆解GAAP vs Non-GAAP差距来源(摊销/SBC/重组)并评估各自持久性"

