    - dimension: "利润率质量"
      position: "NVDA (62%) >> AVGO (40%) >> AMD (10.7%) > INTC (亏损)"
      reasoning: "NVDA平台垄断溢价 + AVGO定制ASIC高转换成本 + AMD无生态锁定被迫折价"

    - dimension: "估值吸引力(风险调整)"
      position: "INTC (如果18A成功) > AMD (如果ROCm突破) > NVDA (已充分定价)"
      reasoning: "均为条件性 — INTC最高期望回报但最高执行风险; AMD中等; NVDA最确定但最贵"

