    buy_triggers:
      - trigger: "DC CapEx放缓导致P/E回归工业均值(SLB式叙事降温)"
        price_zone: "$265-300 (P/E 22-25x)"
        reasoning: "身份溢价蒸发后,核心业务(电气+航空)仍值$265-300;在此价位PEG降至合理区间"
      - trigger: "宏观衰退导致全面性下跌(非ETN特有问题)"
        price_zone: "$220-250 (P/E 18-21x)"
        reasoning: "危机倍数下买入→航空MRO+电气更换需求提供收入底线→反弹潜力>50%"
      - trigger: "Boyd整合失败+商誉减值$3-4B导致恐慌性卖出"
        price_zone: "$250-280"
        reasoning: "减值是非现金一次性冲击,核心电气+航空业务不受影响→市场过度反应=买入机会"
    hold_conditions:
      - "DC收入占比持续提升(每季度>0.5pp)"
      - "EA margin维持>27%(供需平衡后不崩塌)"
      - "Boyd协同年化>$60M(正轨信号)"
      - "B2B ratio维持>1.0x(积压质量健康)"
