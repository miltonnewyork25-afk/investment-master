      trigger: "传统行业公司P/E大幅高于行业均值+有新叙事加持(AI/电动化/etc)"
      origin: "ETN 66.5% AI权重 vs 28% DC收入=38pp缺口=每股$90纯叙事溢价"
      generalization: "所有因新叙事被重估的传统公司——量化缺口后可判断叙事脆弱度,缺口>25pp=高风险"

    - habit: "Reverse DCF后计算增长溢价占比"
      trigger: "做完Reverse DCF反推隐含增长率后"
      origin: "ETN增长溢价占EV 72%——工业公司中极为罕见,暴露科技级定价风险"
      generalization: "增长溢价>60%的非订阅模式公司都应被标记——增长率每miss 1pp的敏感性远高于预期"

    - habit: "并购估值锚定历史倍数而非当前交易倍数"
      trigger: "公司宣布大型收购且行业处于CapEx高点"
      origin: "Boyd 22.5x vs Cooper 12x→容错空间从极大缩至极小→概率加权NPV为负"
      generalization: "周期高点的'战略溢价'往往在周期回落后变成'愚蠢溢价'——用上一周期低点倍数作为检验锚"

    - habit: "积压增速>>收入增速时,追问恐惧囤积比例"
      trigger: "积压同比增速>收入同比增速2x以上"
      origin: "ETN积压+31% vs 收入+10%→半导体2021类比→可靠积压可能仅50-60%"
      generalization: "供应约束行业的积压创纪录≠需求创纪录——分层评估可靠性(Tier 1/2/3)是必要步骤"

  quality_feedback:
