# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "ETN是一家正在被AI叙事重新定价的百年工业公司——当前$373已把66.5%的AI权重定价进去，但实际DC收入仅占28%，你买的不是低估而是一个尚未完成的身份转型赌注，安全边际很薄"
  rating: "中性关注(偏审慎)"
  fair_value: "$336 (三锚加权) / $353 (概率加权)"
  expected_return: "-3.5%(情景加权) / -8.2%(三锚加权)"

  key_arguments:
    - claim: "身份溢价38pp缺口——市场给予66.5%AI权重但DC收入仅占28%"
      direction: bearish
      magnitude: 5
      mechanism: "AI叙事→P/E从25x扩至35.7x→溢价由叙事而非基本面驱动→每股$90(24%)是纯身份溢价"
      kill_switch: "DC收入占比突破35%+，缺口缩小至合理范围(<15pp)"

    - claim: "Boyd $9.5B收购概率加权NPV为负(-$0.77B)，IRR 6.6%<WACC 8.5%"
      direction: bearish
      magnitude: 4
      mechanism: "22.5x EBITDA是液冷并购最高倍数→在DC CapEx可能的周期高位支付→容错空间远小于Cooper(12x)"
      kill_switch: "Boyd Year 2实现>$160M年化协同+EBITDA>$500M→NPV翻正"

    - claim: "航空板块是被DC叙事遮蔽的优质引擎"
      direction: bullish
      magnitude: 4
      mechanism: "11.5% CAGR+610bps利润率改善+FAA认证壁垒(3-5年+$500万-$2000万)→MRO经常性收入→护城河最深的板块"
      kill_switch: "全球航空旅行需求结构性下降(极端黑天鹅)"

    - claim: "利润率3-5pp可能是周期性而非结构性"
      direction: bearish
      magnitude: 3
      mechanism: "供不应求→超额定价权→29.8% EA OPM→供需2027-28平衡后正常化至25-27%→同业天花板SE 18%/ABB 15%"
      kill_switch: "EA OPM在供需平衡后仍维持>28%(结构性效率提升确认)"

    - claim: "PEG 2.18x比AI纯粹玩家VRT(1.80x)更贵——增长调整后ETN估值更高"
      direction: bearish
      magnitude: 4
      mechanism: "绝对P/E 35.7x看似'便宜于VRT 71x'但增长率更低→增长调整后ETN反而更贵→市场额外为身份转型期权付费"
      kill_switch: "ETN有机增长率持续>15%使PEG降至<1.8x"

  moat:
    composite_score: 7.5
    half_life: "10-15年(复合) | 转换成本>20年 | 认证壁垒>15年 | 供应约束2-4年 | 软件<3年"
    dimensions:
      - type: switching_cost
        strength: 5
        evidence: "安全关键行业+15-25年嵌入式安装基础+更换需全系统停机→经济成本+系统性风险双重锁定"
        vulnerability: "低压电气产品转换成本相对较低(标准化程度高)"
      - type: scale
        strength: 4
        evidence: "分销800+独立经销商+100年品牌→全球top-3覆盖; EBITDA margin 21.5%"
        vulnerability: "Schneider在全球规模更大(€36B vs $27B)且软件领先"
      - type: regulatory
        strength: 4
        evidence: "UL/IEC/FAA全覆盖,新进入者需4-6年; FAA认证尤其强大($500万-$2000万+3-5年)"
        vulnerability: "低压电气产品认证壁垒相对较低"
      - type: ip
        strength: 3
        evidence: "供应约束(开关柜24-36月/变压器36-72月)给在位者超常定价权——暂时但强大"
        vulnerability: "持久性有限2-4年; 供应缓解后壁垒消失,定价权回归正常"
      - type: network_effect
        strength: 1
        evidence: "Brightlayer软件平台远落后于Schneider EcoStruxure(4年晚,部署量差10-100x)"
        vulnerability: "最薄弱环节——软件差距可能被竞争者利用为突破口"

  valuation:
    reverse_dcf_implied: "市场隐含FCF 18% CAGR(固定10年) 或 Phase1 25%+Phase2 10% CAGR→增长溢价占当前EV的72%(工业公司通常40-60%,更接近科技股70-85%)"
    methods_used: ["Reverse DCF(三阶段)", "SOTP(Post-spin)", "FMP DCF", "简化DCF", "相对估值(Schneider可比)", "Boyd协同IRR", "双重身份框架", "四情景概率加权"]
    dispersion: "锚点离散度1.10x(三锚高度收敛) | 方法离散度1.59x(FMP DCF $233 vs SOTP $370)"
    consensus_vs_ours: "市场给ETN 66.5% AI权重(P/E 35.7x) | 我们认为合理AI权重应与DC收入占比(28%)更接近→身份溢价38pp由叙事驱动"
    entry_zone: "$265-300 (P/E 22-25x, 工业身份定价)"
    catalyst: "SLB式叙事蒸发: DC CapEx放缓→订单增速正常化→P/E从35x回归22-25x→2027-2028入场窗口"

  action_framework:
