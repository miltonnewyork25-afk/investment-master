        action: "减仓25%,下调积压质量假设"
      - signal: "Boyd商誉减值>$2B"
        severity: "action"
        action: "重新评估整体论文,考虑全部卖出"
      - signal: "Hyperscaler CapEx同比下降>15%(全行业)"
        severity: "emergency"
        action: "全部卖出,DC超级周期结束确认"
      - signal: "PE>40x且无增速改善催化"
        severity: "action"
        action: "减仓50%,估值泡沫区"
    position_sizing: "当前$373: 不买(期望回报为负) | $280: 半Kelly~15%仓位 | $250: 半Kelly~25%仓位"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "身份溢价的量化与脆弱性"
    chain: >
      传统工业公司获得AI叙事加持
      → P/E从工业锚22x扩至AI锚37x的中间值35.7x
      → 反推隐含AI权重=66.5%(P/E法)
      → 但DC收入实际仅占28%→缺口38.5pp
      → 缺口=纯叙事溢价(每股$90)
      → 叙事需要每季度DC数据维护→"每年续约"的估值合约
      → 一旦DC增速放缓→叙事违约→P/E崩塌→$90/share蒸发
    transferable_to: "所有传统行业公司被赋予科技/AI溢价的案例(工业/能源/材料被AI叙事重估)"
    reasoning_habit: "看到P/E溢价时,量化'市场隐含权重'与'实际收入占比'的缺口——缺口越大,叙事依赖越强,估值越脆弱"

  - id: "CC-2"
    name: "SLB历史类比——叙事驱动的周期顶部估值"
    chain: >
      页岩革命2012→SLB被重估为'结构性增长'→P/E从16x升至22x
      → 长线基金将SLB从周期股重分类为成长股
      → 2014年OPEC不减产→油价腰斩→SLB收入-43%
      → P/E无缓冲(EPS下降比P/E压缩更快)→2016年亏损
      → ETN与SLB的65%相似度: 传统工业+新叙事+定价太满太快
      → AI版OPEC冲击=Hyperscaler同步削减CapEx
    transferable_to: "所有因行业超级周期被重估的工业公司(能源服务/矿业/设备制造)"
    reasoning_habit: "任何'这次不一样'的身份转型叙事,都要找到最接近的历史类比并量化相似度——65%以上应高度警惕"

  - id: "CC-3"
    name: "并购估值的'周期顶部陷阱'"
    chain: >
      DC CapEx超级周期→液冷需求爆发→Boyd EBITDA高速增长
      → Eaton在需求高点以22.5x EBITDA收购(历史最高液冷倍数)
      → 概率加权NPV $8.73B < 收购价$9.5B → IRR 6.6% < WACC 8.5%
      → 如果2027-28年CapEx放缓→Boyd收入增速下降→隐含倍数飙升至30x+
      → Cooper(2012)成功因为12x买入→容错空间大; Boyd 22.5x→容错空间极小
      → Net Debt/EBITDA从1.79x升至3.2-3.4x→限制下行灵活性
    transferable_to: "所有在行业需求高点进行大型收购的工业公司"
    reasoning_habit: "评估并购时,先算'如果需求回归均值,这个倍数还合理吗'——在周期高点买入需要>2x的容错空间"

  - id: "CC-4"
    name: "增长溢价占比暴露估值属性"
    chain: >
      ETN零增长EV=$43.9B vs 实际EV=$156B
      → 增长溢价$112B(占72%)
      → 工业公司通常40-60%,ETN的72%更接近科技股(70-85%)
      → 这意味着买ETN=用科技股的价格买工业股的增长
      → 工业股增长的可预测性远低于SaaS/订阅→风险错配
      → 如果增长率miss 3pp(15%→12%)→增长溢价蒸发$25-30B→股价-$65-80
    transferable_to: "所有增长溢价占EV>60%的非科技公司"
    reasoning_habit: "做Reverse DCF时,计算'增长溢价占EV比例'——如果>60%但公司不是高可预测性模式(SaaS/订阅),标记风险错配"

  - id: "CC-5"
    name: "积压订单的'恐惧囤积'风险"
    chain: >
      供应约束→交期从6-8月延至24-36月→客户恐惧性下单
      → 积压增速31%>>收入增速10%→B/R ratio持续攀升
      → 但可靠积压可能仅50-60%(Tier 2/3存在取消风险)
      → 半导体2021先例: 积压创纪录→供应缓解后大规模取消
      → 如果积压缩减30%($4.6B取消)→FY2027-28收入-$2.3B/年
      → 更关键: ETN从未披露取消率→首次披露非零取消数=信息冲击
    transferable_to: "所有供应约束行业中积压创纪录的公司(半导体设备/变压器/工业设备)"
    reasoning_habit: "积压增速>>收入增速时,追问'有多少是恐惧囤积'——用半导体2021作为基准率检验"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "ETN 35.7x P/E合理——AI数据中心增长justify溢价"
      final: "66.5% AI权重 vs 28% DC收入=38pp身份溢价缺口，由叙事而非基本面驱动"
      pivot: "双重身份框架量化: 工业锚22x→AI锚37x→反推隐含AI权重→与实际DC收入对比暴露缺口"

    - initial: "Boyd收购是战略必需品+合理价格"
      final: "概率加权NPV为负(-$0.77B)，22.5x是液冷并购历史最高倍数"
      pivot: "四情景概率加权(Bull/Base/Bear/Worst)→NPV<收购价→IRR<WACC→价值摧毁"

    - initial: "$15.3B积压是坚如磐石的收入保障"
      final: "积压增速31%>>收入10%，可靠积压可能仅50-60%，恐惧囤积风险真实存在"
      pivot: "半导体2021类比+积压分层(Tier 1仅50-60%)+ETN从未披露取消率→不透明本身是风险"

  surprises:
    - finding: "ETN增长溢价占EV的72%——工业公司中极为罕见，更接近科技股水平"
      implication: "买ETN实际上是用科技股价格买工业股增长→增长率每miss 3pp,股价可能跌$65-80"

    - finding: "PEG 2.18x比VRT(1.80x)更贵——ETN在增长调整基础上比AI纯粹玩家更贵"
      implication: "绝对P/E的'便宜'是幻觉→市场额外为身份转型期权付费约+20-30%溢价"

    - finding: "RT-2发现Phase 1-3存在系统性看空偏差(CQ调整9:1看空vs看多)"
      implication: "CQ连续4Phase下降可能部分由确认偏误驱动→真实置信度可能比36.4%略高(38-42%)"

    - finding: "Boyd EBITDA $420M是C级数据(可能虚增)——如果实际为$360M,减值概率从25%升至40%"
      implication: "Boyd投资论文的关键变量(EBITDA)数据质量最低→结论脆弱度极高"

  blind_spots:
    - area: "Hyperscaler CapEx可持续性(2027-2028)"
      why_matters: "DC收入占比28%但增长溢价占EV 72%→CapEx放缓=估值基础崩塌"
      monitor: "Big Tech季度earnings中CapEx指引; AWS/Azure/GCP CapEx YoY增速"

    - area: "Boyd真实EBITDA及整合协同"
      why_matters: "C级数据($420M vs可能$360M)→IRR从8%恶化至6.3%→决定收购是'争议'还是'确定价值毁灭'"
      monitor: "FY2026 Q3-Q4 Boyd segment disclosure; 年化协同进度($60M+=正轨)"

    - area: "积压取消率(ETN从未披露)"
      why_matters: "不透明本身是风险——首次披露非零取消数=信息冲击→可能触发积压质量重估"
      monitor: "季度earnings call订单/积压数据; B2B ratio趋势"

    - area: "EA利润率正常化幅度"
      why_matters: "29.8%中3-5pp可能是周期性超额定价权→供需平衡后回吐→EPS影响-$0.50-1.00"
      monitor: "开关柜/变压器交期缩短趋势; 季度EA segment margin"

  sell_lessons:
    - scenario: "身份溢价38pp时不卖→DC增速放缓→P/E从35x回归22-25x→-30-38%"
      lesson: "身份转型中的工业公司,当隐含AI权重(66.5%)远超实际收入占比(28%)时,P/E的叙事维护成本极高——每季度都需要DC数据confirm"
      transferable: "所有因行业超级周期获得身份重估溢价的传统行业公司"
    - scenario: "并购在行业需求高点以历史最高倍数完成→需求回落→减值$3-4B"
      lesson: "在周期高点看到'战略必需品'叙事时,先算概率加权NPV——22.5x在需求回落后可能变成30x+"
      transferable: "所有在CapEx超级周期中进行大型并购的公司"
    - scenario: "积压创纪录但不减仓→供应缓解后恐惧囤积取消→收入miss"
      lesson: "积压增速>>收入增速(31% vs 10%)本身是预警信号——不透明的取消率比已知风险更危险"
      transferable: "所有供应约束行业中积压B/R持续攀升的公司"

