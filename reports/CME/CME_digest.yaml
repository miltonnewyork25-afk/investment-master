# --- Layer 1.5: 因果链保真 ---
# 结论会过期，推理过程不会。
# 这些因果链是报告270K分析中真正的"推理资产"——
# AI未来分析类似公司时，复用的是推理方式而非结论本身。
# 每条链 = 起点 → 传导机制 → 终点 + 可迁移场景

causal_chains:
  - id: "CC-1"
    name: "制度嵌入如何变成切换不可能"
    chain: >
      Dodd-Frank强制OTC衍生品通过CCP清算
      → Basel III给CCP头寸风险权重2-4%(vs 场外100%)
      → 银行用CME清算=省资本→不是选择而是经济必须
      → 同时持有利率+能源+股指期货=跨品类保证金offset省30-50%
      → 离开CME=失去全部offset=多缴数十亿保证金
      → 切换成本不是"高"而是"资本上不可能"
      → 每次金融危机后监管扩张(Dodd-Frank→Basel III→Treasury Clearing)=加深嵌入
      → 金融风险事件是CME护城河的加速器而非威胁(深度反周期)
    transferable_to: "所有受监管强制使用的基础设施(清算所/评级机构/支付网络)"
    reasoning_habit: "追问'客户不用的代价是什么' — 如果代价是监管处罚或资本损失而非仅仅不便，护城河性质不同"

  - id: "CC-2"
    name: "GAAP PE幻觉的识别逻辑"
    chain: >
      观察: CME EPS $11.16, PE 28x → 看似合理
      → 追问: EPS中有多少来自核心运营vs非经营性?
      → 发现: $900M保证金利息占运营利润20.2%→$1.89/share来自利息
      → 追问: 利息收入和运营收入的持久性一样吗?
      → 不一样: 利息在ZIRP下归零(半衰期<5年)，运营利润在ZIRP下仅温和下降(半衰期>25年)
      → 因此: 应该剥离→Core EPS $9.27→Core PE 33.8x
      → 投资含义: 你以为买的是28x PE，实际买的是34x核心业务+一张利率彩票
    transferable_to: "所有含非经营性收入的公司: 保险(浮存金)/支付(沉淀资金)/券商(客户资产利息)"
    reasoning_habit: "对每一项大额收入追问'这笔钱的持久性是什么' — 不同持久性应该给不同PE"

  - id: "CC-3"
    name: "品质最高≠回报最高的数学证明"
    chain: >
      数据: CME CQI 93(最高) 但5年回报+91%(倒数第二)
      → CBOE CQI ~70(更低) 但5年回报+208%(第一)
      → 追问: 为什么品质更低的公司回报更高?
      → 关键变量: CBOE在2022年发明了0DTE(从零到一的创新=增量增长)
      → CME没有创造任何新产品类别(增长全靠有机volume+利息)
      → 推论: 回报=f(买入价格, 增速) 而非f(护城河深度)
      → 对于垄断型公司: 增量创新>存量维持, 创新能力>护城河深度
      → 垄断三角Q×V×G: CME Q=9.3但G=5→机会分仅3.7
    transferable_to: "所有CQI>80但增速<10%的'品质陷阱'公司"
    reasoning_habit: "看到极高品质公司时，立刻追问'增速从哪来' — 没有增速引擎的垄断只值fair return"

  - id: "CC-4"
    name: "FMX概率校准的锚定方法"
    chain: >
      问题: FMX能获得多少CME份额? 如何赋概率?
      → 第一锚: 历史基准率 — 纯费率竞争从未颠覆过流动性集中的交易所
      → 唯一反例: Eurex vs LIFFE(1998, 18个月颠覆) — 但那是技术代际跳跃(电子vs人工)
      → FMX vs CME: 同为电子平台，无代际差距→反例不适用
      → 第二锚: BGC投入 — 数亿美元投资不会轻易放弃→不能赋<5%
      → 第三锚: 压力测试 — 2025年4月关税冲击中CME ADV创纪录，FMX无增量→危机验证
      → 校准: 15%概率获>5%份额, 期望值-2%(噪音)
      → 但保留尾部监控: FMX月度ADV连续3月>10,000手→重新评估
    transferable_to: "所有垄断面临新进入者的概率评估"
    reasoning_habit: "概率不能凭空赋值 — 必须有(1)历史基准率(2)反例分析(3)压力测试实证三重锚定"

  - id: "CC-5"
    name: "回购在高PE下毁灭价值的逻辑"
    chain: >
      CME年回购$2B+ @ PE 28x
      → 回购本质: 用$1买回内在价值$X的股权
      → 如果股价>内在价值: $1只买到<$1的价值=毁灭
      → η值=回购创造的价值/回购金额: η=0.59x@28x PE=每$1回购只创造$0.59
      → 41%的价值被毁灭→不如分红(分红η=1.0, 税后~0.8)
      → 推论: PE越高→回购越毁灭价值→应该从回购切换到分红
      → 但管理层偏好回购(EPS增速好看)→代理人问题
    transferable_to: "所有PE>25x且积极回购的公司"
    reasoning_habit: "看到大额回购时，算η值 — 如果<0.8，回购是在毁灭股东价值，不管管理层怎么说"

# --- Layer 2: 残差修正 (QJL) ---
# 这些是270K报告中最不可替代的洞见
# 无法从"金融基础设施垄断"的常识推导出

residuals:
  hypothesis_reversals:
    - initial: "28x PE买入全球最好的金融基础设施是合理的"
      final: "Core PE 33.8x才是真实买入价, 28x包含了利息周期彩票"
      pivot: "保证金利息$900M占运营利润20.2%, 且ZIRP下归零 → 必须剥离"

    - initial: "FMX是CME面临的重大竞争威胁"
      final: "FMX概率加权影响仅-2%, 且危机中流动性反而向CME集中"
      pivot: "2025年4月关税冲击=天然压力测试 — CME ADV创纪录而FMX无影响"

    - initial: "反垄断分拆对CME是负面的"
      final: "悖论: 分拆后清算所独立上市可能获得40x+估值 → 对股东可能是正面的"
      pivot: "清算所作为公共基础设施的独立估值逻辑(类比LSEG/LCH)"

  surprises:
    - finding: "利息留存率从10.1%跳升至15.7%(FY2024→FY2025) — NCH-1部分确认"
      implication: "如果结构性(非周期性), 每1pp留存率=~$56M净利=+$0.15 EPS → 利息引擎比表面更有价值"

    - finding: "回购η值0.59x @ 28x PE → 41%价值毁灭"
      implication: "CME每年$2B+回购在当前PE下是毁灭股东价值的 → 分红才是正确的资本返还方式"

    - finding: "飞轮摩擦力45% — CME声称有飞轮但增速靠外生波动率而非自驱动力"
      implication: "CME的增长叙事应该是'波动率看涨期权'而非'飞轮加速' → 估值倍数应反映周期性而非成长性"

    - finding: "CBOE 5年回报+208% vs CME仅+91% — 品质最高的交易所回报倒数第二"
      implication: "0DTE创新(增量增长)比垄断维持(存量增长)更能创造股东价值 → CME需要自己的'0DTE时刻'"

  blind_spots:
    - area: "Treasury Clearing实际份额"
      why_matters: "决定CME是'6%增速垄断'还是'9%增速垄断' → PE扩张1-2x的差别"
      monitor: "2026 Q3-Q4首批数据 | CME vs FICC份额比"

    - area: "利息留存率是周期性还是结构性提升"
      why_matters: "结构性=永久+$0.83 EPS | 周期性=2027回归→犯错窗口更深"
      monitor: "FY2026 10-K(2027 Q1发布) | 留存率是否在降息环境中维持>13%"

    - area: "CEO继任(Duffy 65岁)"
      why_matters: "Duffy是CME文化和战略连续性的核心 | 继任者风格决定资本配置方向"
      monitor: "管理层声明 | 内部晋升 vs 外部空降信号"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "PE>30x且增速<7%时不卖→持有回报仅10%/年(fair return)"
      lesson: "垄断型公司的卖出纪律=PE上限。品质不随PE变化，但回报随PE急剧变化"
      transferable: "所有CQI>80但有机增速<10%的垄断公司(MSCI/SPGI/MCO类)"
    - scenario: "利息周期高点不减仓→利息正常化后EPS下降→PE压缩→双杀"
      lesson: "含大量利率敏感性收入的公司，在利率周期高点应该review仓位。Core PE比GAAP PE更能预测下行风险"
      transferable: "保险/支付/券商等所有持有客户资金赚利息差的公司"
    - scenario: "CBOE用0DTE创新实现+208%回报 vs CME仅+91% — 守成者vs创新者"
      lesson: "长期持有垄断者的机会成本=错过行业内创新者的超额回报。定期比较同业回报差距"
      transferable: "同一行业中存在创新者与守成者并存的场景"

