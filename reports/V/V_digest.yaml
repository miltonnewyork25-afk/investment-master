# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: MA
      similarity: "同为四方模型支付双寡头，合计>80%全球份额，类似OPM(V 66% vs MA 59%)"
      key_difference: "MA收入增速更快(16% vs 10%=5.4pp差距扩大中) + PEG更低(2.13 vs 2.80)→MA在增速维度更便宜24%"

    - ticker: PYPL
      similarity: "同在支付栈(PYPL在L3/L4层)，都面临fintech竞争"
      key_difference: "PYPL不在网络层(L2)→利润率远低(15-20% vs 60-70%) + 无三方网络效应→护城河性质完全不同"

    - ticker: CME
      similarity: "同为金融基础设施双寡头/垄断，类似的'收费站'模型，反脆弱特征"
      key_difference: "CME是纯垄断(无MA级别对手)+利息收入占20%(V无此问题)+CME Core PE 33.8x暴露了类似的'表面便宜实际贵'"

  comparative:
    - dimension: "定价权"
      position: "MA > V > PYPL > SQ"
      reasoning: "V的CI侵蚀速度快于MA→份额领先方反而定价权被侵蚀更快(竞标代价)"

    - dimension: "增长质量"
      position: "MA (16%) > V (10%) > PYPL (~7%)"
      reasoning: "MA增速差5.4pp且扩大中→V的VAS有机增速22%(非28%)拉低了差距修复概率"

    - dimension: "护城河深度"
      position: "V (3.9) ≈ MA (~3.7) > CME在支付领域不可比"
      reasoning: "V网络效应更强(凭证4.6B vs MA ~3B)但MA监管风险更低(非DOJ靶心)"

    - dimension: "估值吸引力(PEG)"
      position: "MA (2.13x) > V (2.80x) > 支付栈上层公司不可比"
      reasoning: "V看似PE更低(28x vs 34x)但增速也更低(10% vs 16%)→PEG暴露V更贵"

  industry_position:
    quadrant: "最高品质 × 合理偏高估值 × 中等增速"
    archetype: "双寡头收费站 — #1份额但增速落后于#2，定价权被CI侵蚀"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF隐含FCF CAGR 7.6%→市场悲观来自CI侵蚀+监管恐惧而非增速怀疑→偏差在OPM而非revenue"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-2审计发现锚定+确认+叙事偏差→高估$15-25→P4校正后概率权重Bear从25%→30%/Bull从20%→15%"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "CI侵蚀温水煮青蛙: FY2021→2024年均+210bps→缓慢到每季度不引起关注→但累计630bps已结构性改变定价权"

  novel_patterns:
    - name: "支付栈四层利润率模型"
      description: "支付行业按L1-L4分层→L2(网络层)拿走60-70%利润→评估竞争威胁时先定位层级→L4向L2穿透是最大远期风险"
      transferable_to: ["所有平台行业的价值链层级分析", "云计算栈(IaaS/PaaS/SaaS)利润率分布", "广告技术栈(DSP/SSP/Exchange)"]

    - name: "CI竞标成本模型(寡头定价权侵蚀)"
      description: "双寡头中份额#1需要支付递增的CI(返利)来防止#2抢客→CI/毛收入趋势是定价权侵蚀的先行指标→每+1pp=净收入-1.5%"
      transferable_to: ["V vs MA", "波音vs空客(航空引擎返利)", "所有#1 vs #2增速差扩大的双寡头"]

    - name: "OPM正常化三重独立验证法"
      description: "一次性费用导致OPM骤降时→(1)季度逐笔还原(2)同业对标逻辑(3)历史5年均值→三重收敛=高置信度正常化"
      transferable_to: ["所有因和解/重组/减值导致OPM骤降的公司"]

    - name: "宏观代理识别(李录变量提纯)"
      description: "敏感性测试10变量→WACC占估值影响80%→'这不是stock picking问题而是macro bet'→stock picker无优势区域"
      transferable_to: ["所有低增速+高品质+高PE的大盘股(AAPL/MSFT/JNJ类)"]

    - name: "技术颠覆反脆弱历史验证法"
      description: "列出公司5次面对技术颠覆的历史→如果每次都成功整合→反脆弱性得到时间序列验证→但需识别'打破模式的唯一力量'"
      transferable_to: ["所有基础设施层公司面对技术颠覆时的评估", "银行面对fintech/CBDC"]

  framework_contributions:
    moat_insights:
      - insight: "护城河最弱维度(监管3.0)的退化速度远快于最强维度(网络效应4.7)——一纸法令vs需同时颠覆三方"
        implication: "护城河评估应单独评估'最弱环退化速度'——加权平均会掩盖快速退化的维度"
      - insight: "CI侵蚀是护城河内部的'慢性疾病'——不改变护城河结构但持续削弱其经济价值"
        implication: "护城河分析应区分'结构性完整'和'经济价值完整'——结构可能完好但经济回报在缩小"

    valuation_insights:
      - insight: "Reverse DCF隐含增速偏低但不极端(7.6% vs 实际10-12%)→偏差不在增速而在OPM/WACC→一次性费用被误读为结构性"
        implication: "Reverse DCF后应追问'偏差的来源维度是什么'——增速偏差vs利润率偏差有完全不同的投资含义"
      - insight: "分析师$400 vs 我$301→25%差距的核心是尾部风险定价(分析师不含CCCA/DOJ)"
        implication: "与一致预期对比时应拆解'哪些风险被定价/未被定价'而非笼统说'高估/低估'"

    screening_insights:
      - insight: "PEG比PE更能暴露双寡头的真实估值差——V PE 28x<MA 34x但V PEG 2.80>MA 2.13→V实际更贵"
        implication: "双寡头对比应强制使用PEG而非PE——增速差被PE掩盖"
      - insight: "品质评分B+C>80%但期望回报<0%='品质-价格脱钩'——好公司≠好投资"
        implication: "选股筛选应加入'品质-价格脱钩过滤器': 品质>80%但期望回报<5%→标记为等待型"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "看到OPM骤降时先拆解一次性vs结构性"
      trigger: "OPM同比下降>300bps"
      origin: "Visa FY2025 OPM从65.7%降至60%→拆解后发现$25.6亿超额拨备→正常化66.4%"
      generalization: "对所有含大额和解/重组/减值的公司→三重独立验证(季度还原/同业对标/历史均值)才能确认正常化水平"

    - habit: "双寡头分析必须追问'保持份额的成本'"
      trigger: "双寡头中#1份额稳定但#2增速更快"
      origin: "V份额稳定但CI/毛收入从21.5%飙至27.8%→份额稳定的代价是定价权被侵蚀"
      generalization: "市占率稳定≠一切正常。追问'为了维持份额付出了什么'——CI/返利/折扣趋势比份额本身更有信息量"

    - habit: "敏感性分析后判断'这是stock picking还是macro bet'"
      trigger: "单一宏观变量(利率/汇率/油价)影响>30%估值"
      origin: "Visa WACC±50bps→估值±$25-30(8-10%)→李录: '80%由宏观决定→不是stock picking问题'"
      generalization: "如果宏观变量主导估值→stock picker没有优势→要么认为自己能预测宏观(通常不能)→要么等价格极端低估时再入场"

    - habit: "飞轮分析加悖论检查"
      trigger: "公司推出帮助潜在竞争者成功的产品"
      origin: "Visa Protect for A2A+Tink→帮助A2A/开放银行成功=帮助替代自己的借记卡"
      generalization: "平台公司的新产品如果让竞争者更强大→飞轮净强度需扣除蚕食效应→不能给'飞轮加速'溢价"

  quality_feedback:
    strengths:
      - "D6风险评估9/10 — RT-1~RT-7完整+偏差校正-$19+黑天鹅6项+关税传导4渠道→红队有效改变了结论方向($306→$283)"
      - "D2框架完整性9/10 — 53章全覆盖+CQ全闭环+Phase流程完整+支付栈/品质矩阵等原创框架"
      - "DM密度1.95/千字 — 562锚点扎实, 超G3门控(450)"
      - "因果密度8.02/万字 — 接近KLAC标杆(9.28)，远超门控(5.0)"
    weaknesses:
      - "D8管理层评估7/10 — McInerney任期37月→决策样本不足→缺少与前任Kelly直接对比"
      - "D11进化贡献7/10 — 方法论创新主要在'框架应用'(支付栈模型)而非'框架发明'"
      - "D1数据8/10 — VAS/CI分层缺官方拆分→核心假设(VAS依附度50%/CI分层B4)基于推断"

  hypothesis_tested:
    confirmed:
      - hypothesis: "品质最高≠回报最高 (CME垄断三角)"
        evidence: "Visa品质B+C=86%但期望回报-7%→品质-价格脱钩→好公司+合理偏高价格=平庸回报"
        confidence_after: "高(三份报告独立确认: CME/KLAC/V)"

      - hypothesis: "Reverse DCF必须P1前置 (CRM v2.0铁律O)"
        evidence: "Ch01 RDCF有效揭示市场隐含悲观(FCF CAGR 7.6%)→为全报告定调→防止了bullish先入为主"
        confidence_after: "高(执行确认, 无反例)"

      - hypothesis: "飞轮悖论检测 (v19.6 CRM教训)"
        evidence: "发现Visa两个真实悖论(Visa Protect for A2A + Tink)→飞轮减速3.7→3.2-3.5→改变了估值溢价给法"
        confidence_after: "高(首次在非SaaS公司确认飞轮悖论)"

    extended:
      - hypothesis: "CI竞标成本侵蚀定价权 (通用)"
        extension: "V的CI从21.5%→27.8%量化了双寡头中#1维持份额的真实成本→扩展为'CI竞标成本模型'可迁移到所有双寡头"

      - hypothesis: "Core PE剥离非经营性收入 (CME)"
        extension: "Visa不需要Core PE(无大额利息收入)→但OPM正常化是同类问题: 剥离一次性费用后的'正常化EPS'才是真实估值基础"

    refuted:
      - hypothesis: "报告未直接否定已有假说"
        evidence: "N/A"
        lesson: "N/A"

  limitations:
    - "VAS分部收入明细未官方披露→依附度50%基于推断(真实值可能30-70%)→VAS独立估值变化±$10-20"
    - "Reverse DCF对WACC极敏感: WACC 8.0-9.5%→估值$276-$366→公允$301的精度远低于数字暗示"
    - "CCCA/DOJ概率(20-30%)无法精确估计: 改用10%或50%→估值变化$20-30→概率估计置信度约60%"
    - "正常化OPM假设(66.4%)是推断非官方确认→如果和解摊销持续>3年→新常态可能是62-63%"
    - "历史类比局限: 用FY2020(疫情需求崩塌)作衰退先例→关税衰退(供应侧冲击)机制不同→Visa防御性可能更弱或更强"
