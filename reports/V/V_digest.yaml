    entry_zone: "$270-$280 (PE 24-25x, 提供10%安全边际)"
    catalyst: "FY26Q2(2026年4月): OPM≥63%+CCCA受阻→上调至'关注'; OPM<60%→下调至'审慎关注'"

  action_framework:
