# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "CI竞标机制如何结构性侵蚀定价权"
    chain: >
      大型发卡行(JPM/BAC/Citi)在V和MA之间竞标
      → MA激进抢客(增速差从2.2pp扩大至5.4pp)
      → V被迫提高CI(返利)来锁定发卡行
      → CI/毛收入从FY2021 21.5%飙至FY2024 27.8%
      → 定价权一半被CI吃掉(Take Rate+10%但净收入仅+10%而非20%)
      → 每+1pp CI/毛收入=净收入-1.5%
      → CI本质是维持份额的"竞标成本"而非一次性折扣
      → 下一轮合约重签(FY2029-2031)可能进一步恶化
    transferable_to: "所有寡头中份额领先但增速落后的公司(#1 vs #2的定价权侵蚀)"
    reasoning_habit: "看到双寡头时，追问'保持份额的成本是多少'——CI/返利/折扣的趋势比份额本身更重要"

  - id: "CC-2"
    name: "支付栈四层模型——谁拿走最肥的一层"
    chain: >
      支付栈: L4商户界面(Stripe,利润2-10%) → L3收单处理(Fiserv,15-25%) → L2网络层(Visa,60-70%) → L1发卡银行(JPM,20-40%)
      → Visa在L2拿走最肥利润→因为每笔交易的interchange/数据处理费几乎是纯利
      → Stripe在L4只赚薄薄的API差价(TPV→收入转化仅0.37%)
      → 即使Stripe增速34%(远快于Visa 11%)→利润创造能力远不及Visa
      → 但Stripe正从L4向L2穿透(Treasury+Bridge稳定币+Financial Connections)
      → DOJ诉讼文件揭示Visa最恐惧的正是Big Tech/fintech从L4向L2穿透
    transferable_to: "所有平台行业(SaaS/云/广告)的价值链层级分析——找到'最肥的一层'并评估其可防御性"
    reasoning_habit: "分析竞争时先画价值链层级图——不同层的利润率差异揭示了真正的护城河位置"

  - id: "CC-3"
    name: "一次性费用如何被市场误读为结构性恶化"
    chain: >
      FY2025报告OPM从65.7%暴跌至60.0%(-570bps)
      → 市场恐慌: "盈利能力崩塌"
      → 拆解: ~$25.6亿超额Other Expenses(诉讼和解+收购整合)
      → 三重独立验证: 季度逐笔还原68.4% / 同业对标>MA 59% / 5年均值64.9%
      → 正常化OPM实际66.4%——核心盈利能力微幅改善
      → 但市场将一次性拨备当成结构性恶化→创造了Reverse DCF的隐含悲观
      → 投资含义: 如果OPM在FY26Q2确认≥63%→市场会修正悲观→估值上修
    transferable_to: "所有因一次性费用(和解/重组/减值)导致OPM骤降的公司——三重独立验证法可复用"
    reasoning_habit: "OPM骤降时，第一反应不是'盈利恶化'而是'拆解构成'——分离一次性vs结构性是估值精度的关键"

  - id: "CC-4"
    name: "飞轮悖论——VAS成功如何蚕食核心业务"
    chain: >
      Visa推出Visa Protect for A2A(为A2A交易提供风控)
      → A2A生态欺诈率下降→A2A更安全可靠
      → 消费者更愿意用A2A而非借记卡
      → Visa的A2A风控产品成功=Visa借记卡被更快替代
      → 同理: Tink(开放银行)成功=验证A2A模式=Visa卡替代品更成熟
      → 但悖论集中在借记卡(利润率最低)→净效应是"用VAS高毛利替代借记卡低毛利"
      → 飞轮净强度从3.7降至3.2-3.5→飞轮不会倒转但会减速
      → 估值含义: 不能给Visa"飞轮加速"溢价
    transferable_to: "所有平台公司推出'帮助竞争对手成功'的产品(AWS帮助潜在Amazon竞争者/Google Ads帮助YouTube竞争者)"
    reasoning_habit: "飞轮分析必须加'悖论检查'——新产品成功是否蚕食核心产品?"

  - id: "CC-5"
    name: "反脆弱性的基础设施层定位"
    chain: >
      电商(2000s)→移动支付(2010s)→P2P(Venmo)→BNPL(Affirm)→稳定币(2025)
      → 每一次"颠覆"都被Visa整合进生态(BNPL发虚拟Visa卡/Visa整合USDC结算)
      → 模式: Visa在基础设施层(L2)→上层应用无论如何变化→底层仍需可信结算清算网络
      → 反脆弱性得分6.8/10(技术适应最强8/10)
      → 但有一个结构性限制: A2A/CBDC如果实现"直连银行→无需中间网络"→基础设施层被绕过
      → CBDC是10年+的唯一能打破反脆弱性的力量
    transferable_to: "所有基础设施层公司(AWS/Azure/交易所清算)——评估'上层创新是否需要经过我这层'"
    reasoning_habit: "评估颠覆风险时，先定位公司在价值栈的层级——基础设施层的反脆弱性源于'上层创新仍需经过此层'"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "P1: OPM骤降可能是结构性恶化(初始怀疑)"
      final: "三重独立验证确认80%一次性——正常化OPM 66.4%，但P4将置信度从80%下调至65%"
      pivot: "季度逐笔还原68.4% + 同业对标 + 历史均值→三重收敛→但和解摊销持续2-3年增加不确定性"

    - initial: "VAS 28%增速证明第二曲线独立成功"
      final: "有机增速仅22-24%(扣除Pismo/Featurespace/Prosa)+依附度50%→独立性远低于管理层叙事"
      pivot: "RT-7替代解释: 收购贡献被掩盖+VAS一半收入依赖客户同时使用Visa卡网络"

    - initial: "P3估值偏差校正前: 概率加权$306(+0.5%)——接近合理"
      final: "RT-2发现锚定+确认+叙事偏差→高估$15-25→校正后$287→再加尾部折价$6.5→最终$283(-7.0%)"
      pivot: "认知偏差审计: P1中性偏积极出发→一路确认→Bear权重从25%上调至30%+Bull从20%下调至15%"

  surprises:
    - finding: "Visa是'宏观代理'而非典型个股——WACC±50bps影响$25-30/股(占估值8-10%)"
      implication: "Li Lu框架揭示: 80%价值由利率决定→stock picker无优势→Visa更适合macro trader"

    - finding: "Stripe $159B估值vs Visa $5,816B——PS更贵但PE>100x vs V 28x→增速vs利润质量的极端对比"
      implication: "支付栈不同层级的利润率鸿沟(2-10% vs 60-70%)说明: 即使Stripe增速3倍于Visa→价值创造效率远不及"

    - finding: "2025年稳定币交易量$33万亿——已超过V+MA合计→P1-P3完全忽略的维度"
      implication: "稳定币10年内对Visa直接威胁极低(<5%份额)但Visa已整合USDC结算→将威胁转化为收入渠道"

    - finding: "飞轮存在两个真实悖论(Visa Protect for A2A + Tink)——但净效应是正面的(低利润借记卡→高利润VAS)"
      implication: "飞轮不会倒转但在减速(3.7→3.2-3.5)→不能给飞轮加速估值溢价"

  blind_spots:
    - area: "VAS分部收入明细(官方未披露)"
      why_matters: "无法精确评估VAS独立性/有机增速→核心假设(依附度50%)基于推断"
      monitor: "FY2025 10-K(2025年11月) + FY2026 Investor Day"

    - area: "OPM Other Expenses明细(正常化置信度仅65%)"
      why_matters: "如果和解摊销持续>3年→'新常态'OPM可能是62-63%而非66%→估值下调$15-25"
      monitor: "FY26Q2 10-Q(2026年4月)"

    - area: "CCCA/DOJ联合概率(是否正相关)"
      why_matters: "如果国会和DOJ同时打击Visa→联合概率比独立假设更高→概率加权可能低估"
      monitor: "2026年中期选举+DOJ Discovery阶段泄露"

    - area: "Apple独立支付网络(5%概率但影响-15-25%)"
      why_matters: "Apple Pay Direct如绕过Visa直连银行→美国15-20%交易量流失→Token化防线被绕过"
      monitor: "Apple支付相关专利/招聘信号 + 银行合作公告"

  sell_lessons:
    - scenario: "PE>30x且增速<12%且CCCA悬而未决时不卖→持有=承担监管尾部风险无补偿"
      lesson: "支付双寡头的卖出纪律=监管风险定价。PE不补偿监管尾部风险时应减仓"
      transferable: "所有面临重大监管改革的垄断/双寡头(反垄断/拆分/准入放开)"
    - scenario: "CI/毛收入>30%时不减仓→定价权从'强'滑向'中等'→PE重定价-4-6x"
      lesson: "寡头中份额领先方的定价权侵蚀是渐进的→应在CI趋势确认后行动而非等CI到天花板"
      transferable: "所有#1 vs #2竞争中#2增速更快的行业(定价权侵蚀的先行指标是CI/返利趋势)"
    - scenario: "品质很高(B 34.5 + C 25.5)但估值无安全边际时不卖→持有回报仅=市场回报"
      lesson: "好公司+合理偏高价格=平庸回报。品质分和估值是独立维度——不要因为'好公司'而忽略'贵价格'"
      transferable: "所有品质评分>80%但PE在历史区间上沿的公司"

