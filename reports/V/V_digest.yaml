# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "Visa是接近完美的收费站，但$304已充分定价品质——CI结构性侵蚀+监管四重围堵+利率高企共同压制安全边际，等FY26Q2确认后再评估"
  rating: "中性关注"
  fair_value: "$283-$315, 中值$301"
  expected_return: "-7.0% (偏差校正后$283 vs $304)"

  key_arguments:
    - claim: "OPM骤降是一次性的——正常化OPM 66.4%，核心盈利能力未恶化"
      direction: bullish
      magnitude: 4  # 三重独立验证(季度还原68.4%/同业对标>MA 59%/5年均值64.9%)
      mechanism: "FY2025 OPM 60%含$25.6亿超额拨备(诉讼和解+收购整合)→剥离后正常化66.4%→市场将一次性费用误读为结构性恶化"
      kill_switch: "FY26Q2 OPM<60%→和解摊销持续>3年=新常态62-63%而非66%"

    - claim: "CI侵蚀是最大结构性风险——从FY2021的21.5%飙升至FY2024的27.8%"
      direction: bearish
      magnitude: 5  # RT-3评估8/10最高分+历史数据确认
      mechanism: "竞争(MA激进抢客)+监管(CCCA悬剑)+发卡行集中度提升→CI本质是Visa为维持份额支付的'竞标成本'→谈判地位结构性弱化"
      kill_switch: "下一轮大型发卡行合约重签期(FY2029-2031)→中间4-5年合约平稳期CI可能企稳"

    - claim: "监管四重围堵概率加权-5.0% EPS——CW-4脆弱度4/5"
      direction: bearish
      magnitude: 4  # 四重独立监管风险量化
      mechanism: "CCCA(20-30%概率削减信用卡收入12-20%)+DOJ反垄断(20-30%)+Interchange Settlement(10bps/5年)+EU DMA→联合概率加权约-5% EPS"
      kill_switch: "CCCA 2026年中受阻+DOJ和解<$3B→监管风险大幅缓解→评级可上调至'关注'"

    - claim: "Visa是'宏观代理'——80%价值由WACC/利率决定，非典型个股机会"
      direction: neutral
      magnitude: 4  # 李录框架敏感性分析确认
      mechanism: "WACC每变50bps→估值变$25-30/股→利率环境决定估值天花板($330@8.5% vs $410@7.5%)→stock picker标的转为macro bet"
      kill_switch: "如果Visa找到10%+有机增速引擎(如Treasury Clearing/VAS独立化)→增速>WACC敏感性→回归个股逻辑"

    - claim: "VAS 28%增速被高估——有机增速约22-24%，依附度50%"
      direction: bearish
      magnitude: 3  # RT-7替代解释确认
      mechanism: "报告增速含Pismo/Featurespace/Prosa收购贡献→有机22-24%→且50% VAS收入依赖客户同时使用Visa卡网络→独立性低于管理层叙事"
      kill_switch: "FY2026 10-K首次披露VAS分部收入明细→有机增速>25%=管理层叙事可信"

  moat:
    composite_score: 3.9  # 六维加权平均 (C=25.5/30)
    half_life: "10-15年(加权) | 网络效应>15年 | 监管壁垒5-10年"
    dimensions:
      - type: network_effect
        strength: 4.7
        evidence: "三方网络效应(4.6B凭证×150M+商户×14,500发卡行) + 233.8B笔/年交易 + 数据飞轮(45年积累)"
        vulnerability: "CCCA直接打击'发卡行↔持卡人'边(削弱30%) + AI降低风控数据门槛(99.9%→99.5%对多数商户'足够好')"
      - type: switching_cost
