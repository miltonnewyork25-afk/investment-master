# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF反推隐含永续FCF CAGR 6.35% vs 历史1.5% → 4x缺口=市场在赌范式级加速, 但5G先例警告单季创纪录不代表趋势"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1~RT-7七问对抗 + 双向校准(3下调+3上调+1维持) + 有效性门控(3/3 PASS) + 校准因子缩窄(+7-10pp→+3-5pp)"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "四场景条件估值(S1牛$287/S2基准$223/S3承压$163/S4极端$98) + 概率加权$205.3(未校准)→$217-228(校准后)"

  novel_patterns:
    - name: "承重墙脆弱度分析(5墙依赖链)"
      description: "从Reverse DCF反推五面承重墙 → 按脆弱度排序 → 发现3面(Services-Google-PE)互相依赖形成传导链 → 单一核心节点(Google协议)倒塌可触发二阶+三阶效应"
      transferable_to: ["所有估值隐含多个假设的高PE公司", "有单一大客户/合同依赖的公司"]

    - name: "PE溢价层级分解(坚实层vs脆弱层)"
      description: "将PE溢价拆解为4层(生态锁定4-5x坚实/AI期权3-4x脆弱/回购1.5-2x可计算/利率0.5-1x) → 按持久性和证伪条件分级 → 量化每层蒸发时的股价影响"
      transferable_to: ["所有PE显著高于历史均值的公司"]

    - name: "Q1信噪分离(季度数据外推的危险性量化)"
      description: "将Q1创纪录增速分解为信号(有机加速)和噪声(季节性+基数+补贴) → 历史先例锚定(FY2024 Q1+22.8%→全年+0.03%) → 噪声占比60-70%"
      transferable_to: ["所有依赖单季度创纪录数据做投资决策的场景"]

    - name: "轻资本AI战略悖论"
      description: "CapEx/OCF最低但隐性AI成本$30-39B → 轻资本是估值溢价来源(FCF高) → 但AI自主需要变重 → 变重则破坏溢价叙事 → 不变重则AI受制于竞品 → 二选一困境"
      transferable_to: ["所有轻资本模式公司面临AI投资压力时的战略悖论"]

    - name: "地缘风险9格矩阵(捕捉联合恶化)"
      description: "3x3矩阵(地缘强度x竞争强度x监管强度) vs 简单3情景 → 9格矩阵概率加权$53.5B < 3情景$58.8B → 差值$5.3B=联动额外下行被3情景低估"
      transferable_to: ["所有在地缘敏感市场有多重叠加风险的公司"]

  framework_contributions:
    moat_insights:
      - insight: "护城河复合性是最强防线(5层叠加, 竞品无法同时攻破) — 但要区分被动防御型(品牌+转换成本)和主动进攻型(网络效应+技术壁垒)"
        implication: "被动防御型护城河在竞品功能差距足够大时可能被克服(BlackBerry先例) — 评估护城河时应区分防御性质"
      - insight: "护城河有多重时间维度: 品牌/生态>10年, 芯片/供应链~5年, 定价权/隐私~3年"
        implication: "不同半衰期的护城河对估值的支撑力不同 — 短半衰期层面的恶化需更快反应"
      - insight: "AI可能重定义锁定层 — 从App Store中心切换到AI助手中心, 旧护城河被新护城河替代"
        implication: "平台型公司的护城河不是静态的 — 需评估'护城河迁移'的概率和时间表"

    valuation_insights:
      - insight: "SOTP天然低估平台型公司(1.92x溢价倍率) — 但溢价规模($1.83T)可分解为可验证部分和纯叙事部分"
        implication: "平台公司SOTP不应作为估值锚, 但SOTP+合理溢价(1.3-2.0x)可作为辅助方法"
      - insight: "6种估值方法一致性悲观 > 单一方法的精确度 — 方法间的趋同判断增强评级稳健性"
        implication: "估值结论的稳健性应看方法间一致性, 而非单一方法的精确假设"
      - insight: "PE参照系选择偏差显著改变结论 — 10Y均值(含硬件误定价期)vs后Services重估均值差异+20pp"
        implication: "PE参照系应明确标注使用哪个时段的均值以及为什么 — 参照系选择本身就是一个核心假设"

    screening_insights:
      - insight: "Reverse DCF隐含CAGR vs 历史实际CAGR的倍数差距是最硬的估值锚 — AAPL差距4x+"
        implication: "选股筛选加入'隐含vs实际CAGR差距': >3x标记为高风险(市场在赌未验证的加速), <1.5x标记为合理定价"
      - insight: "回购IRR < 无风险利率 = 价值毁灭信号 — AAPL IRR 2.99% < 国债4.48%"
        implication: "选股时计算回购IRR(=1/PE): 如果<无风险利率且回购>FCF 50%, 标记资本配置不当"
      - insight: "承重墙脆弱度极高(单一客户/合同>15%净利润) = 组合层面需降低仓位"
        implication: "选股加入'承重墙集中度'检查: 单一来源>15%净利润 → 标记非线性下行风险"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "对创纪录季度数据做信噪分离再外推"
      trigger: "任何季度收入/利润创历史新高"
      origin: "Q1 FY2026 +15.7%中60-70%是噪声 + 历史先例FY2024 Q1+22.8%→全年+0.03%"
      generalization: "单季度创纪录几乎永远不代表趋势 — 必须分离季节性/基数/一次性因素后才能判断有机加速"

    - habit: "Reverse DCF隐含增速vs历史实际增速的倍数差距判断估值合理性"
      trigger: "PE>25x 或 估值争议大"
      origin: "AAPL隐含6.35% vs 实际1.5% = 4.2x差距 → 6种方法无一支持当前估值"
      generalization: "倍数差距>2x=高风险(市场在赌加速), >4x=极高风险(市场在赌范式转变). 差距越大, 对催化剂验证的要求越高"

    - habit: "对大额收入源做承重墙分析而非简单风险矩阵"
      trigger: "单一收入源/客户/合同>15%净利润"
      origin: "Google协议占净利润18-23%且连接Services+估值+AI战略三条线 → 二阶效应(市值$300-500B)>直接效应($200-300B)"
      generalization: "风险矩阵(概率x影响)低估非线性传导 — 承重墙分析(直接+二阶+三阶效应)更能揭示真实下行幅度"

    - habit: "PE溢价做层级分解, 区分坚实层和脆弱层"
      trigger: "PE显著高于历史均值或同行"
      origin: "AAPL 33.46x PE溢价分解: 生态4-5x(坚实)+AI 3-4x(脆弱)+回购1.5-2x(可计算)+利率0.5-1x"
      generalization: "总溢价百分比是噪音 — 拆解后按持久性分级才有决策价值. 脆弱层的蒸发速度>>坚实层"

  quality_feedback:
    strengths:
      - "承重墙脆弱度分析(5墙+依赖链+核心节点识别) — 原创框架, 比传统风险矩阵更有信息量"
      - "Reverse DCF P1前置有效防止结论先行 — 4x CAGR缺口早期就锁定了偏bearish方向"
      - "红队对抗有效(RT-1~RT-7, 双向校准3↓3↑1→, 校准因子缩窄) — 避免了系统性悲观和表演性红队"
      - "DM锚点261个, 密度0.86/千字(合格) — H类55%/R类37%/S类9%数据分层透明"
      - "Mermaid图46个(远超25门控) — 可视化覆盖传导链/决策树/时间线/四象限"
    weaknesses:
      - "DM密度0.86/千字仅为合格线 — 距优秀(>1.0)仍有差距, 尤其Phase 1-2可提升"
      - "Apple不披露分部利润率 → Services毛利率74.7%是反推值 → SOTP估值基础存在不可消除的不确定性"
      - "AI期权溢价$319B属S类数据(主观判断) — 驱动最关键估值判断但精度最低"
      - "估值校准过程存在循环论证(因子1)和缺乏定量基础(因子3) — 被RT-2发现并修正, 但暴露了初始分析的偏差"
      - "CQ体系6/7偏空(系统性空头倾斜) — 虽经双向校准修正但初始设定已偏悲观"

  hypothesis_tested:
    confirmed:
      - hypothesis: "回购@高PE毁灭价值(CME CI-004, eta值框架)"
        evidence: "AAPL IRR 2.99%@33.46x PE < 国债4.48% — 数学上确认价值毁灭"
        confidence_after: "高(第三份报告独立确认: CME eta=0.59x + AAPL IRR<无风险利率)"

      - hypothesis: "Reverse DCF必须P1前置(CRM v2.0铁律O)"
        evidence: "AAPL Reverse DCF揭示4x CAGR缺口, 有效防止了被Q1创纪录数据锚定的bullish偏差"
        confidence_after: "高(连续多份报告执行确认)"

    extended:
      - hypothesis: "PE溢价可分解(CME Core PE vs GAAP PE)"
        extension: "从CME的'剥离非经营性收入'扩展到AAPL的'PE溢价层级分解(4层按持久性分级)' — 不仅看什么收入应该分离, 还看什么估值溢价是脆弱的"

      - hypothesis: "地缘风险9格矩阵比3情景更准确"
        extension: "AAPL中国风险: 9格矩阵$53.5B < 3情景$58.8B, 差值$5.3B证明联合恶化被简单模型低估"

    refuted: []

  limitations:
    - "Apple不披露分部利润率 → 所有分部级估值建立在推算基础上(Services毛利率~75%是反推值, 精度约+/-1.5pp)"
    - "无法获取Apple管理层对AI战略的内部评估、Google协议谈判进展、供应链一手调研 — 报告AI分析完全基于公开信息"
    - "概率加权假设S1-S4互斥且穷尽 — 实际市场结果可能落在场景之间或之外"
    - "CQ置信度30-56%的精度为+/-5-10pp — 伪精度风险"
    - "时间衰减: 基于2026-02-19数据快照, 关键验证窗口集中在2026年5-9月(Q2财报/WWDC/DOJ/iPhone 18)"
