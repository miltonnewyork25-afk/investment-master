      similarity: "同为科技平台巨头, 类似PE区间(33x vs 32x), 都面临AI投资回报验证"
      key_difference: "MSFT=AI基础设施卖铲人(Copilot/Azure有收入) vs AAPL=AI消费端(AI收入=$0) | MSFT CapEx/OCF 47%重资产 vs AAPL 11%轻资本"

    - ticker: GOOG
      similarity: "AAPL最大单一客户(搜索协议) + 同为移动生态双寡头(iOS/Android)"
      key_difference: "GOOG=搜索广告垄断(AI颠覆风险) vs AAPL=硬件+服务飞轮 | 两者通过Google协议深度绑定, DOJ裁决同时影响两家"

    - ticker: META
      similarity: "同为消费端科技平台, 类似用户基数量级(30亿级)"
      key_difference: "META=社交广告(数据丰富/隐私劣势) vs AAPL=隐私优先(品牌优势/AI数据不足) | ATT政策使两者成为竞争关系"

  comparative:
    - dimension: "护城河深度"
