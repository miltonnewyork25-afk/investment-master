# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "Google协议是承重墙而非收入线"
    chain: >
      Google支付$20-26B/年维持Safari默认搜索 → 几乎零成本纯利润 → 占净利润18-23%
      → 但不仅是收入: Google协议=Apple AI战略的隐性基础设施(搜索意图数据)
      → DOJ反垄断+AI搜索范式转变+Google支付意愿变化=三重威胁
      → 协议终止的二阶效应(轻资本模式动摇+PE叙事削弱)市值影响$300-500B > 直接收入损失影响$200-300B
      → Google协议同时连接Services收入链+估值脆弱链, 是风险网络的核心节点
    transferable_to: "所有依赖单一大客户/合同贡献超过净利润15%的公司"
    reasoning_habit: "对每笔大额收入追问'如果明天消失会发生什么' — 不仅看直接收入损失，更看二阶效应(叙事/估值/战略)是否更大"

  - id: "CC-2"
    name: "PE溢价分解暴露脆弱层"
    chain: >
      当前33.46x PE vs 10年均值23.78x → 溢价40.7%
      → 溢价分解: 生态锁定4-5x(坚实) + AI期权3-4x(脆弱) + 回购增厚1.5-2x(可计算) + 利率0.5-1x
      → AI期权溢价$430-580B建立在完整链条上(New Siri成功→AI差异化→换机+订阅→EPS加速)
      → 链条任一环断裂 → $30-40/股蒸发(12-15%)
      → 但RT-7发现: 10Y均值含2015-19"硬件误定价期", 后Services重估均值28-30x更合理
      → 修正后溢价从+40.7%缩小至+11.5-19.5% — 减轻但不消除bearish
    transferable_to: "所有PE显著高于历史均值的公司 — 溢价分解(哪部分坚实/哪部分脆弱)比总溢价百分比更有信息量"
    reasoning_habit: "PE溢价不是一个数字——拆解成分后检查每一层的持久性和证伪条件"

  - id: "CC-3"
    name: "飞轮的脆弱点在增长引擎切换"
    chain: >
      iPhone获客(24亿设备) → Services变现($109.2B) → 高利润率(~75%) → FCF($98.8B) → 回购增厚EPS → 高PE → R&D($31.4B) → 芯片领先 → 循环
      → 飞轮运转良好, 但增长引擎正从硬件销量→ARPU提升
      → 设备基数增长放缓(智能手机CAGR +2%) → Services增长越来越依赖ARPU而非用户扩张
      → ARPU提升难度>>用户扩张 → 增速可能从11.8%降至7-9%
      → 如果AI驱动Apple Intelligence Pro订阅成功 → ARPU跳跃式增长(但完全未验证)
    transferable_to: "所有平台型公司在用户基数饱和后面临的'从量到价'转型挑战"
    reasoning_habit: "飞轮分析不止看循环是否闭合 — 更看增长引擎正在从哪一层切换到哪一层，切换是否已验证"

  - id: "CC-4"
    name: "回购IRR在高PE下的价值毁灭"
    chain: >
      FY2025回购$90.7B(占FCF 107% — Apple在借债回购)
      → 33.46x PE下每$1回购回报率仅1/33.46=2.99%
      → 2.99% < 10年国债4.48% → 纯财务角度回购毁灭价值
      → 负股东权益($73.7B)使ROIC 518%/ROE 162%看似惊人, 但原始投入资本计算ROIC仅30-35%
      → 但压力场景下股价下跌 → 回购IRR提升(3.0%→4.4%) → 形成内生稳定器
    transferable_to: "所有PE>30x且年回购>FCF 50%的公司"
    reasoning_habit: "回购IRR = 1/PE — 与无风险利率比较。如果<无风险利率，回购是毁灭价值的，不管管理层怎么包装"

  - id: "CC-5"
    name: "中国风险的阈值式非线性放大"
    chain: >
      中国三重风险: 地缘(台海/关税) + 竞争(华为#1/HarmonyOS) + 监管(数据本地化)
      → 三维互相强化而非独立叠加
      → 关键特征: 阈值式而非渐变式 — 一旦地缘触发, 可在数周内从中性跳至悲观
      → 概率加权中国收入$58.8B(3情景) vs 9格矩阵$53.5B(捕捉联合恶化) → 差值$5.3B=联动额外下行
      → 印度市场部分对冲(份额3%→5-6%, 2028年可能$15B) → 但ASP$500-550远低于中国
    transferable_to: "所有在地缘敏感市场有>10%收入的公司 — 风险不是线性的，需测试联合恶化场景"
    reasoning_habit: "对地缘风险用9格矩阵(3风险x3强度)而非简单3情景 — 联合恶化概率往往被低估"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "Q1 FY2026 +15.7%确认Apple增长加速"
      final: "Q1噪声成分60-70%(季节性+基数+补贴), 真实有机加速仅+1-6pp"
      pivot: "RT-6信噪分离 + 历史先例FY2024 Q1 +22.8% vs 全年+0.03% — Q1数据外推极其危险"

    - initial: "33.46x PE vs 10年均值23.78x = 溢价40.7%偏高"
      final: "后Services重估(2020年后)均值28-30x才是合理参照 → 溢价缩小至11.5-19.5%"
      pivot: "RT-7替代解释: 10Y均值含2015-19硬件误定价期, 混入了Apple被错误定价为纯硬件公司的时段"

    - initial: "估值校准因子+7-10pp使期望回报从-22%改善至-10%~-14%"
      final: "校准因子中因子1(SOTP低估)构成循环论证/因子3(AI非线性)缺乏定量基础 → 缩窄至+3-5pp → 期望回报-14%至-18%"
      pivot: "RT-2认知偏差审计发现校准过程存在锚定效应和循环论证"

  surprises:
    - finding: "SOTP中间值$1,971B vs 市值$3,820B → 生态系统溢价$1,829B(市值的48%) → 溢价倍率1.92x"
      implication: "即使在最乐观SOTP假设下(iPhone 4.5x+Services 9.0x=$2,248B), 仍比市值低$1,572B(41%) → SOTP天然低估平台但48%的溢价规模值得追问: 多少是合理的生态系统价值, 多少是AI叙事泡沫?"

    - finding: "Apple隐性AI总成本$30-39B(R&D中AI占比+OpenAI/Google合作+芯片设计+Private Cloud Compute) — 并不轻"
      implication: "轻资本AI战略悖论: 维持轻资本→AI能力受制于竞争对手 | 追求AI自主→破坏被高度估值的轻资本模式 — 33.46x PE隐含Apple可以'搭便车', 这一假设的脆弱性被低估"

    - finding: "黑天鹅事件概率加权合计对期望值拖累约-14pp — 几乎被当前分析完全忽略"
      implication: "台海冲突(5-15%概率)+AI泡沫破裂(10-15%)+全球衰退(23.5%)等尾部风险的联合影响远超直觉"

    - finding: "6种估值方法无一支持$264.35的当前定价 — 一致性悲观"
      implication: "不是单一方法的偏差, 而是Reverse DCF/SOTP/条件估值/空头钢人/FMP DCF的趋同判断, 增强审慎关注评级的稳健性"

  blind_spots:
    - area: "New Siri产品质量和Apple Intelligence真实采用率"
      why_matters: "AI期权溢价$430-580B建立在AI换机+AI订阅成功的假设上 — 如果采用率<5%则$319B溢价蒸发"
      monitor: "WWDC 2026(2026-06) New Siri演示质量 + iOS版本分布 + 第三方采用率调研"

    - area: "Google协议谈判实际进展"
      why_matters: "决定$20-26B零成本利润和AI战略基础设施的存亡 — 报告分析完全基于公开信息"
      monitor: "DOJ救济方案草案(2026H2) + Apple-Google谈判信号"

    - area: "Apple分部利润率(Apple不披露)"
      why_matters: "Services毛利率74.7%是反推值 — Hardware毛利率假设每1pp变化使Services毛利率变化1.3pp → 影响SOTP和整体估值判断"
      monitor: "管理层电话会议措辞变化 + 税务文件间接推断"

  sell_lessons:
    - scenario: "PE>30x且永续FCF CAGR隐含>>历史实际(4x+缺口) — 估值预支了未验证的增长"
      lesson: "Reverse DCF隐含增速vs历史实际的倍数差距是最硬的估值锚 — 差距>2x时应考虑减仓, >4x时应积极减仓"
      transferable: "所有PE>30x的大型科技公司"
    - scenario: "大额回购@高PE(IRR<无风险利率) — Apple FY2025回购$90.7B@33.46x PE, IRR仅2.99%<国债4.48%"
      lesson: "回购IRR<无风险利率=价值毁灭的数学信号。管理层继续回购是代理人问题而非价值创造"
      transferable: "所有PE>25x且回购>FCF 50%的公司(参考CME eta值框架)"
    - scenario: "单一承重墙(Google协议)连接多条风险链且有可验证的崩塌路径"
      lesson: "投资组合中应对'承重墙脆弱度极高'的公司降低仓位 — 承重墙分析比传统风险矩阵更能揭示非线性下行"
      transferable: "所有有单一大客户/合同贡献>15%净利润的公司"

