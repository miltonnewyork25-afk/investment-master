      reasoning: "AAPL品牌+转换成本双维度领先; 但属被动防御型(品牌+转换成本)而非主动进攻型(网络效应+技术壁垒)"

    - dimension: "AI投资强度"
      position: "META (60.2%) > GOOGL (55.5%) > MSFT (47.4%) >> AAPL (11.4%)"
