# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "定价权反身性循环: 提价权如何自我毁灭"
    chain: >
      Amendment 35恢复7%/年提价权(2018)
      → 连续6年每年+7%: $7.85→$10.26(累计+31%)
      → AELP估算VRSN溢价135-190%[DM-REG-005]
      → Warren/Nadler致信DOJ要求调查[DM-REG-003]
      → 公众/政客关注度提升=政治反身性启动
      → 2030续约将是第一次在"公众充分关注"下的谈判
      → 结果大概率是"限价"(降至CPI)而非"打破"(历史base rate)
      → 提价权从7%降至~3%→EPS增速从9%降至5%→PE从27x压至22-24x
    transferable_to: "所有政府授权垄断的定价权评估: FICO/BT/Telstra/铁路/收费公路"
    reasoning_habit: "追问'提价权的政治容忍度边界在哪里' — 合同授予的定价权不等于永续的定价权, 政治反弹是定价权半衰期的决定因素"

  - id: "CC-2"
    name: "受管制垄断五阶段演化: 从授权到公用事业化"
    chain: >
      阶段0政府授权(1999)→阶段1自由定价(1999-2017)
      → 阶段2公众关注(2018-2025, 当前阶段)
      → 阶段3政治约束(2026-2035?: CPI限价+透明度)
      → 阶段4公用事业化(203X+?: 利润率被管制)
      → 跨国中位数从自由到限价=8-15年
      → VRSN从Amendment 35(2018)算已进入第8年=正处于限价窗口期
    transferable_to: "所有政府授权垄断型公司(电信/公用事业/收费公路/评级机构)"
    reasoning_habit: "评估政府授权垄断时, 先确定它在五阶段演化模型中的位置 — 位置决定了定价权的方向(扩张/稳定/收缩)"

  - id: "CC-3"
    name: "VRSN vs FICO: 反身性速度差异的根因"
    chain: >
      FICO反身性: 提价3年→CFPB介入→VantageScore替代→客户迁移(~5年周期)
      → VRSN反身性: 提价6年→Warren调查→无实质行动→(~10-15年周期)
      → 速度差异的根因: 替代成本不对称
      → FICO替代=$15M/银行(可行) vs VRSN替代=1.61亿域名迁移(不可行)
      → 加上ICANN是VRSN的共生体(年收$2亿注册费)而非独立监管者
      → 因此VRSN的反身性循环比FICO慢2-3倍→但不是不存在
    transferable_to: "任何需要评估'替代成本决定反身性速度'的垄断公司"
    reasoning_habit: "评估定价权侵蚀速度时, 核心变量是替代方案的可行性成本 — 替代成本越高, 反身性越慢, 但终点相同"

  - id: "CC-4"
    name: "域名的三层护城河与各层衰减速度"
    chain: >
      Layer 1(注册表层): .com数据库=唯一运营商=100%垄断→衰减最慢(制度嵌入)
      → Layer 2(品牌层): .com=互联网默认后缀→衰减中(.ai/.io分流, 创业公司选择.com从64%降至46%)
      → Layer 3(入口层): 域名=网站入口→衰减最快(AI助手直答绕过域名)
      → 关键洞见: 域名的"可见度"在下降但"依赖度"几乎不变(API/邮件/SSL证书仍依赖DNS)
      → 投资含义: Layer 1保护VRSN的收入, Layer 2/3的衰减压缩PE但不影响短期FCF
    transferable_to: "所有基础设施层公司(支付网络/清算所/云基础设施): 上层应用变化不一定影响下层协议"
    reasoning_habit: "分层评估护城河衰减速度 — 基础设施层(协议)衰减远慢于应用层(用户界面)"

  - id: "CC-5"
    name: "定价权剪刀差: 低端流失反而提升利润率"
    chain: >
      VeriSign提价7%/年→域名投机者(占20%, Stage 2)对价格敏感→不续约
      → 但大企业/中型企业(占43%, Stage 4-5)对$10.26/年无感→几乎100%续约
      → 流失的是低利润客户(投机域名续约率低/维护成本不变)
      → 保留的是高利润客户(续约率>95%)
      → 净效应: 域名基数可能缓慢萎缩但OPM反而上升
      → 域名萎缩≠收入等比下降→OPM从67.7%向70%收敛
    transferable_to: "所有提价后低端客户流失的垄断型公司(FICO/有线电视/报刊订阅)"
    reasoning_habit: "提价导致客户流失时, 追问'流失的是哪层客户' — 低端流失+高端留存=利润率改善"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "巴菲特减仓1/3是对VRSN基本面的看空信号"
      final: "PE 14x建仓→33x减仓1/3=估值纪律, 精确降至10%以下消除Form 4义务, 非基本面预警"
      pivot: "BRK同期系统性降仓位+减仓后仍持有9.0M股(9.6%)=仍在前十大持仓"

    - initial: "2030续约是VRSN的'生存风险'"
      final: "推定续约保证合同存续, 2030续约是'定价条款谈判'而非'是否续约'问题"
      pivot: "推定续约的法律效力=除非严重违约否则自动续约[DM-BIZ-007] — 19年零宕机使违约几乎不可能"

    - initial: "域名基数下降=收入下降=负面"
      final: "流失的主要是低利润投机域名, 保留高利润企业域名→OPM反升(定价权剪刀差)"
      pivot: "分层分析: 投机者占20%但价格敏感度最高→率先流失→OPM从67.7%向70%收敛"

  surprises:
    - finding: "VeriSign是全球唯一'五特征全满'的收费站型公司(对比Visa 2.5/5, CME 2/5)"
      implication: "解释了为什么FCF Margin(64.5%)远高于所有可比——完美度=直通率"

    - finding: "SGI=10(极度聚焦)的公司'应得'PE 35x+, 但实际PE仅27x→折价23%"
      implication: "折价来源=政治风险→政治风险被市场部分定价(但可能定价不足或过度)"

    - finding: "ICANN是VRSN的共生体而非独立监管者: 年收$2亿注册费+自身利益与VRSN一致"
      implication: "名义上的'监管者'不会主动挑战VRSN→反身性速度比表面看到的更慢"

    - finding: "2025年首次分红的时机: 在2030续约前4-5年开始'回馈'——与BT 1990年Ofcom限价前主动降价类似"
      implication: "管理层在为阶段2→3过渡做预防性让步——但历史显示主动让步通常不能阻止正式限价"

    - finding: "概率加权永续提价~3.5%恰好等于Reverse DCF隐含g(3.2-3.8%)——市场定价已'正确'反映2030不确定性"
      implication: "当前价格不存在显著错误定价→alpha只来自对2030结果的非共识判断"

  blind_spots:
    - area: "2030续约条款的具体内容"
      why_matters: "7%维持→PE 27x+ | CPI限价→PE 22x | 冻价→PE 18x — 差距达$100/股(+42%到-25%)"
      monitor: "NTIA/ICANN公开声明 | 2028大选结果 | 2029续约谈判启动后的官方文件"

    - area: "AI对域名需求的长期结构性影响"
      why_matters: "如果AI入口完全替代网站→.com需求可能结构性下降→但DNS协议层依赖不变"
      monitor: "AI Agent域名注册数据 | .com新注册中含'ai/bot/agent'的比例 | 年度域名基数净增/净减"

    - area: "管理层CEO继任(Bidzos兼任董事长+CEO)"
      why_matters: "Bidzos是极简主义管理风格的核心→继任者可能追求多元化(历史上垄断型公司继任者常犯这个错误)"
      monitor: "董事会组成变化 | 管理层关于战略方向的公开声明"

    - area: "$123M非现金项(递延收入重分类)"
      why_matters: "正常化FCF=$945M vs 报表FCF=$1.07B→影响估值$3(已在概率加权中折扣)"
      monitor: "FY2026 10-K是否持续出现类似非现金项"

  sell_lessons:
    - scenario: "巴菲特PE 14x→33x减仓1/3: 政府授权垄断也有PE天花板"
      lesson: "垄断型收费站的PE天花板≈增速×5(VRSN增速5%→PE 25-28x)。超过天花板减仓1/3, 保留核心仓位享受持续复利"
      transferable: "所有政府授权垄断(FICO/CME/MSCI): PE天花板由增速而非护城河深度决定"
    - scenario: "2030续约前3年(2027-2030)是最高不确定性区间"
      lesson: "政府授权垄断的合同到期前3-5年是风险溢价最高的时段——卖出时机应在不确定性释放前而非释放后"
      transferable: "所有有合同到期/许可证续期的特许经营权公司"
    - scenario: "VRSN增长引擎从量价双驱(2018-2021)变为纯价格驱动(2023-2025)"
      lesson: "当增长引擎从'量+价'变为纯'价'时, 增长的政治脆弱性急剧上升——纯提价增长更容易被定义为'剥削'"
      transferable: "所有依赖提价而非增量来驱动增长的垄断(有线电视/公用事业/收费公路)"

