# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含永续g=3.2-3.8% vs 历史FCF CAGR 7.1%→市场已折扣政治风险+域名停滞"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "温水煮青蛙路径: 提价限制+域名萎缩+利率上升三因素5-8年叠加→PE从27x逐年压至18x, 无单一触发事件"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "7个RT红队审查: 发现两处确认偏差(巴菲特减仓解读+Phase 1看多篇幅)→RT-4概率调整使评级从'关注'降至'中性关注'"

  novel_patterns:
    - name: "受管制垄断五阶段演化模型"
      description: "政府授权→自由定价→公众关注→政治约束→公用事业化。跨国中位数8-15年。用于定位垄断在生命周期中的位置, 预判定价权方向"
      transferable_to: ["所有政府授权垄断(电信/公用事业/收费公路/评级机构)", "特许经营权到期前的估值分析"]

    - name: "反身性速度与替代成本的函数关系"
      description: "定价权反身性速度=f(替代成本)。FICO替代$15M→反身性~5年; VRSN替代=不可能→反身性~10-15年。替代成本越高, 政治反弹从'激活'到'落地'的时间越长"
      transferable_to: ["FICO vs VantageScore", "CME vs FMX", "任何面临替代方案的垄断"]

    - name: "政治乐观溢价量化(概率加权PE法)"
      description: "将政治情景概率加权→得到2030后PE→与当前PE的差距=政治乐观溢价(VRSN为2.9x PE点)。溢价扩大=卖出信号"
      transferable_to: ["所有面临监管不确定性的公司(药品定价/银行监管/科技反垄断)"]

    - name: "SGI-PE折价识别(品质折价vs风险折价)"
      description: "SGI=10应得PE 35x+, 实际PE 27x→折价23%。折价来源是政治风险而非品质不足→可用于区分'市场低估品质'和'市场正确定价风险'"
      transferable_to: ["所有SGI>8但PE低于行业中位的极度聚焦公司"]

    - name: "定价权剪刀差(分层流失分析)"
      description: "提价导致低端流失+高端留存→OPM反升。域名萎缩≠收入等比下降, 因为流失的是低利润投机域名"
      transferable_to: ["有线电视(cord-cutting流失低ARPU客户)", "SaaS提价(SMB流失/Enterprise留存)", "所有分层定价权的公司"]

    - name: "渠道商透视法(谁在承受提价代价)"
      description: "从注册商(GoDaddy/Namecheap)视角审视VeriSign提价: 批发价占零售价35-85%→注册商利润空间被挤压→但注册商不能不卖.com→定价权通过渠道传导而不在渠道终止"
      transferable_to: ["所有通过渠道销售的垄断型公司: 评估定价权时必须包含渠道商视角"]

  framework_contributions:
    moat_insights:
      - insight: "一根支柱型护城河(C1=9.5但C2=3.0): 墙不倒就固若金汤, 墙若倒则无其他防线"
        implication: "护城河评估需要检测'集中度风险'——CQI可能掩盖单维度依赖。多维度分散(如CPRT)比单维度极强(如VRSN)更抗冲击"
      - insight: "域名的'可见度'在下降但'依赖度'几乎不变: 分层评估基础设施护城河"
        implication: "基础设施公司的护城河应按协议层/应用层/用户层分别评估衰减速度, 而非统一给半衰期"
      - insight: "监管者利益冲突(ICANN年收$2亿)实际上增强了护城河——名义监管者是共生体"
        implication: "评估监管型护城河时, 追问'监管者的经济利益是否与公司一致' — 如果一致, 监管风险被系统性高估"

    valuation_insights:
      - insight: "概率加权PE法量化政治乐观溢价: 当前PE - 情景加权PE = 溢价点数"
        implication: "对所有面临监管不确定性的公司, 可用此方法量化'市场在赌政治结果的哪一边'→溢价过大=卖出"
      - insight: "Reverse DCF隐含g与概率加权永续提价率收敛→市场定价'正确'"
        implication: "当两个独立方法指向相同结论时, alpha不来自发现错误定价, 而来自对关键变量(2030结果)的非共识判断"
      - insight: "巴菲特隐含PE区间(20-28x)作为估值锚: 入场于14x=3倍回报, 减仓于33x=价格纪律"
        implication: "对垄断型公司, 研究大师持仓行为可以提取隐含PE区间作为估值参照物"

    screening_insights:
      - insight: "FCF Yield 4.8% + 确定性>99% + 增长5%/年 = '带增长的国债'特征"
        implication: "筛选时增加'国债替代品'类别: FCF Yield>国债收益率 + 收入波动率<2% + 增速>CPI→在利率下行期尤其有吸引力"
      - insight: "SGI=10但PE折价>20% = 政治风险定价信号→如果认为风险被高估则是买入机会"
        implication: "选股筛选增加'SGI-PE折价扫描': SGI>8且PE<行业中位×0.8→深入研究折价原因(品质不足vs风险定价)"
      - insight: "CQI高(81)但C-Score低(7.3)='一根支柱型'→单点故障风险高于CQI暗示"
        implication: "选股时CQI>75的公司需要检查C-Score分散度——单维度集中>70%=标记单点风险"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "政府授权垄断先定位五阶段演化位置"
      trigger: "分析目标公司的定价权来自政府/制度授权而非市场竞争时"
      origin: "VRSN处于阶段2→3过渡期→历史base rate显示限价窗口8-15年→VRSN已进入第8年"
      generalization: "五阶段模型适用于所有政府授权垄断——电信/公用事业/收费公路/特许经营权"

    - habit: "评估定价权时追问替代成本→推算反身性速度"
      trigger: "公司有定价权且正在积极提价时"
      origin: "VRSN替代成本不可估量(1.61亿域名迁移) vs FICO仅$15M/银行→反身性速度差3倍"
      generalization: "替代成本是定价权半衰期的决定变量。替代成本越高→反弹越慢→但终点相同(限价)"

    - habit: "看到大师减仓时先算PE区间再判断信号"
      trigger: "巴菲特/大师级投资者减持头条新闻出现时"
      origin: "巴菲特VRSN: PE 14x入→33x减仓1/3→行为隐含PE 20-28x区间=估值纪律信号"
      generalization: "大师减仓更可能是价格纪律而非基本面预警——先看PE变化再看基本面变化"

    - habit: "垄断提价后分层分析客户流失"
      trigger: "垄断型公司提价后出现客户流失/基数下降时"
      origin: "VRSN定价权剪刀差: 投机者(20%, Stage 2)流失→大企业(43%, Stage 4-5)留存→OPM反升"
      generalization: "提价后的客户流失不一定是负面的——如果流失的是低利润客户, 净效应可能是利润率提升"

  quality_feedback:
    strengths:
      - "DM密度2.51/千字(超门控值66%) — 数据锚定极其扎实"
      - "因果密度7.50/万字(合格线以上) — 每个核心论点有完整证据链"
      - "五阶段演化模型+FICO类比+跨国对比 — 多角度验证核心论点(提价权反身性)"
      - "巴菲特13年518%回报解剖 — 从行为中提取隐含PE区间, 而非猜测动机"
      - "定价权分层(F500/中型/小企业/投机者)各自Stage评估 — 避免统一Stage掩盖结构差异"
    weaknesses:
      - "报告未含D1-D11自评记分卡 — 无法对标4.4分基线"
      - "AI对域名长期影响的分析偏定性 — 缺少量化场景(如AI Agent域名需求的具体数字模型)"
      - "渠道商深度章节(Ch40)篇幅较小 — 注册商利润空间/行为博弈可进一步量化"

  hypothesis_tested:
    confirmed:
      - hypothesis: "政府授权垄断最终结果是'限价'而非'打破' (历史base rate)"
        evidence: "BT/Telstra/Canadian telcos/美国铁路四案例均为限价→限价概率>80%"
        confidence_after: "高(四国独立案例确认)"

      - hypothesis: "品质最高≠机会最高 (CME垄断三角)"
        evidence: "VRSN CQI 81但增速仅5%→PE 27x(折价23% vs SGI应得35x+)→品质被增速和风险压制"
        confidence_after: "高(VRSN和CME独立确认)"

      - hypothesis: "定价权剪刀差: 高端加强+低端流失 (CRM/ADBE双验证v19.6)"
        evidence: "VRSN F500 Stage 5/投机者Stage 2→提价后投机者流失但OPM反升"
        confidence_after: "高(第三个独立案例)"

    extended:
      - hypothesis: "反身性循环速度∝替代成本 (FICO初始观察)"
        extension: "VRSN替代成本>>FICO(不可能vs $15M)→反身性慢3x — 从线性关系扩展到'替代成本存在阈值效应: 超过某个值后反身性速度趋近于零但不等于零'"

    refuted: []

  limitations:
    - "2030续约结果高度不确定 → 所有估值的核心假设(提价权路径)无法验证直到2029-2030年"
    - "AI对域名需求的长期影响无法量化 → 5年+时间尺度上的域名基数预测置信度极低"
    - "ICANN/NTIA内部决策过程不透明 → 政治情景概率赋值依赖历史类比而非直接信息"
    - "管理层极度沉默(CEO沉默域偏多) → 无法验证'主动让步'策略(如首次分红)背后的真实意图"
    - "$123M非现金项的原因未完全诊断 → 可能是一次性也可能持续, 影响FCF正常化水平"
