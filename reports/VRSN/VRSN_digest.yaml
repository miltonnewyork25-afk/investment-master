      bullish_threshold: "续约率稳定>73%(提价弹性几乎为零)"
      bearish_threshold: "续约率<65%(弹性恶化=提价上限接近)"
    - signal: "NTIA/国会关于VeriSign的公开声明/立法提案"
      bullish_threshold: "无新立法提案(政治注意力转移)"
      bearish_threshold: "DOJ正式调查或国会限价法案进入委员会"

  noise_signals:
    - signal: ".ai域名增速(3年+819%)"
      why_noise: "绝对规模仅为.com的0.34%[DM-COMP-001]→即使再翻10倍也不到.com的4%→不影响VeriSign收入"
    - signal: "季度DNS查询量波动"
      why_noise: "DNS查询不产生收入(按域名数收费不按查询量)→查询量是技术指标非财务指标"
    - signal: "Cloudflare零加价注册.com域名"
      why_noise: "Cloudflare打击的是注册商利润(GoDaddy), 不影响VeriSign的批发价$10.26→批发层垄断不受零售层竞争影响"

