# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "CRM在$194的定价基本合理——市场隐含CAGR 3.7%略低于有机增速~7%，但seat压缩风险+WACC敏感性使安全边际极薄。Agentforce是唯一能打破均衡的变量。"
  rating: "中性关注"
  fair_value: "$208(中位) / $193(概率加权)"
  expected_return: "+7.2%(中位) / -0.7%(概率加权) / +1.7%年化(5年)"

  key_arguments:
    - claim: "市场隐含CAGR 3.7%略悲观但不过度——考虑seat压缩后可能正确"
      direction: neutral
      magnitude: 5  # Reverse DCF硬数据 + WACC敏感性量化
      mechanism: "Reverse DCF翻译→隐含4个信念(增速降至3-4%/FCF margin封顶30%/终端倍数14x/$25B回购已定价) → WACC 10.5%时DCF精确等于$194"
      kill_switch: "Agentforce consumption ARR>$1.5B证明市场过度悲观→隐含CAGR应>7%→显著低估"

    - claim: "Agentforce是±$64/股的超级CQ——成败决定CRM是$130还是$260"
      direction: conditional
      magnitude: 5  # 单变量摆动等于其余7个CQ合计
      mechanism: "$800M ARR但67%免费+PMF 50:50+15个月3次调价→Einstein失败前科→但有独立定价(Flex Credits)→如果consumption加速→PMF确认→PE从14.7x→18-20x"
      kill_switch: "FY2027H1 consumption ARR<$850M(停滞)→重蹈Einstein覆辙→PE→10-12x"

    - claim: "飞轮悖论: Agent越成功→seat越少→核心收入越受压"
      direction: bearish
      magnitude: 4  # 首次发现的结构性矛盾 + MCO方法论验证
      mechanism: "管理层声称Platform→Data Cloud→Agent→Users自加速飞轮 → 3连接点验证: 1真实/1弱/1微弱 → 飞轮净强度~-0.2(弱负) → PE含~$22叙事溢价"
      kill_switch: "Agentforce consumption增速>seat压缩速度(净正)→飞轮悖论被数学解决"

    - claim: "OPM从2.1%→21.5%是SaaS史上最大变轨——75%结构性"
      direction: bullish
      magnitude: 4  # 唯一高置信度正面CQ(75%)
      mechanism: "S&M削减贡献52%(10.1pp)其中80%结构性(数字化+存量扩展) → 73%新bookings来自upsell→获客成本接近零→趋势自加速"
      kill_switch: "S&M削减触及增长底线(cRPO有机增速<+5%)→说明效率提升开始伤害增长"

    - claim: "不对称比3.5:1偏下行——买入错误代价$66 vs 不买错误代价$19"
      direction: bearish
      magnitude: 4  # 5情景概率加权量化
      mechanism: "S4(温和恶化23%→$155)+S5(SaaSpocalypse 10%→$120)的下行尾部拉低期望值 → 概率加权年化仅+1.7%显著跑输S&P500(+8%)"
      kill_switch: "Agentforce成功(S1+S2合计32%→$258-296)→不对称比反转为2:1偏上行"

  moat:
    composite_score: 7.1  # A-Score 43/70
    half_life: "旧护城河(工具嵌入)>10年但衰减中 | 新护城河(数据+AI)如成功>15年但尚未建立"
    dimensions:
      - type: switching_cost
        strength: 5
        evidence: "F500切换成本>10x年费→20年数据+流程重建+认证体系=不切换 [DM-MOAT-001]"
        vulnerability: "AI降低迁移成本(数据迁移工具自动化)→转换成本从10x→5x→3x中"
      - type: network_effect
        strength: 4
        evidence: "AppExchange 7800+应用→第三方集成越多→迁移越难→多边市场护城河"
        vulnerability: "AI-native平台可能绕过AppExchange生态(直接API集成)"
      - type: data
        strength: 3
        evidence: "Data Cloud($1.2B ARR, +120% YoY)统一客户数据→AI训练素材→潜在飞轮"
        vulnerability: "数据隐私法规可能切断跨产品数据统一→飞轮核心被法律切断(15%概率)"
      - type: scale
        strength: 3
        evidence: "OPM从2.1%→21.5%→规模效应释放中 | $41.5B收入基础"
        vulnerability: "规模不保护seat定价→AI替代是需求消失而非竞品替代"
      - type: pricing_power
        strength: 3
        evidence: "定价权剪刀差: F500 Stage 4(45%收入)可年涨5-8% / SMB Stage 2(20%收入)被HubSpot侵蚀"
        vulnerability: "SMB流失+mid-market被NOW蚕食→高定价权客户占比虽升→但总TAM缩小"

  valuation:
    reverse_dcf_implied: "市场隐含5年CAGR 3.7%——比有机增速(~7%)悲观3.3pp，比共识(10%)悲观6.3pp。四个隐含信念: 增速降至3-4%/FCF margin封顶30%/终端倍数14x/$25B回购已定价"
    methods_used: ["Reverse DCF", "SOTP", "DCF(Python)", "DCF概率加权", "可比公司(ADBE强制对标)", "5情景概率加权"]
    dispersion: "10.8%(基线) / 16.7%(含红队校准) — 均<30% PASS"
    consensus_vs_ours: "市场给14.7x PE=SaaSpocalypse折价一刀切 | 我们看到双速结构(旧引擎15x+新引擎20-25x)但Agentforce PMF未确认→暂不能判市场错"
    entry_zone: "$155-170 (PE 11-12x, S4情景定价)"
    catalyst: "Agentforce consumption ARR在FY2027H1加速>$1.5B + Service Cloud增速>+5% = 升级至'关注'"

  # ★ v1.2新增: 买卖决策框架 ★
  action_framework:
    verdict: "等待——不对称比3.5:1偏下行，5年概率加权年化仅+1.7%显著跑输市场"
    buy_triggers:
      - trigger: "Agentforce PMF确认: consumption ARR>$1.5B且Service Cloud增速>+5%"
        price_zone: "$194-210 (当前价格区间)"
        reasoning: "PMF确认→市场隐含CAGR从3.7%上调至>7%→PE从14.7x→18-20x→$258-296"
      - trigger: "温水煮青蛙恐慌: 连续2-3季增速-0.5pp→市场恐慌抛售"
        price_zone: "$150-170 (PE 11-12x)"
        reasoning: "如果是周期性而非结构性→FCF Yield>10%→安全边际充足→反转后空间大"
    hold_conditions:
      - "Agentforce consumption ARR季度环比增长(非停滞)"
      - "Service Cloud增速>+2%(seat压缩可控)"
      - "OPM维持>20%(结构性改善未逆转)"
      - "净债务/EBITDA<3.5x(ASR后杠杆可控)"
    sell_triggers:
      - signal: "Agentforce consumption ARR连续2季停滞(<$850M)"
        severity: "action"
        action: "减仓50%——重蹈Einstein覆辙概率大增→PE→10-12x"
      - signal: "Service Cloud增速<+2%(seat压缩失控)"
        severity: "warning"
        action: "减仓25%，观察1季度是否恶化"
      - signal: "F500去CRM化案例>5个(护城河侵蚀)"
        severity: "emergency"
        action: "全部卖出——Stage 4定价权崩塌=论点颠覆"
      - signal: "S&P评级负面展望(BBB+→BBB)"
        severity: "warning"
        action: "评估杠杆路径，如>3.5x则减仓"
    position_sizing: "当前不建议建仓(概率加权年化+1.7%<市场回报8%) | 如PMF确认@$194→半Kelly~15%仓位"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "飞轮悖论: Agent成功蚕食seat的自相矛盾"
    chain: >
      管理层声称Platform→Data Cloud→Agent→Users自加速飞轮
      → 验证连接1: Data Cloud→AI(真实但有限: 数据统一确实改善AI质量)
      → 验证连接2: AI Agent→客户增长(弱: Agent替代人工→减少seat需求→核心per-seat收入受压)
      → 验证连接3: 客户→数据(微弱: 客户产生的数据不自动回流改善AI)
      → 悖论: 1个Agent替代5个seat→企业节省$9,000但额外付$24,000?→定价不合理→客户抵触
      → 飞轮净强度~-0.2(弱负)→"数据复用"而非"自加速循环"
      → PE含~$22叙事溢价→如果飞轮不转→PE应从14.7x降至12-13x
    transferable_to: "所有声称'AI增强飞轮'的SaaS公司——检验新产品是否蚕食核心产品"
    reasoning_habit: "看到'AI飞轮'叙事时，追问'AI成功后核心产品的seat/用量会增还是减'——如果减=飞轮悖论"

  - id: "CC-2"
    name: "v1.0失败→v2.0方法论修正的因果链(铁律O起源)"
    chain: >
      v1.0: P1预设bullish($235)→选择性采集支持证据→P4红队推翻(-$59/-25%)→叙事断裂无法修复
      → 根因: 结论先行→确认偏差→红队被迫大幅修正→但已写4个Phase无法重建
      → 修正: 铁律O(Reverse DCF P1前置)→P1必须从市场隐含假设出发(中性)→证据驱动方向
      → 铁律H(ADBE P0对标)→最相似可比在P0就提供外部估值锚→防止脱锚
      → 铁律K(估值统一性)→全报告数字一版→P4修正必须回流P5
      → v2.0结果: 红队代价仅-$18(-8.5%)→温和校准而非推翻→"最好的红队发现很少错误因为前序分析已经很诚实"
    transferable_to: "所有多Phase分析——结论先行是分析质量的最大单点风险"
    reasoning_habit: "任何分析的第一步是Reverse DCF——先翻译市场在赌什么，再评估市场对不对。永远不要从'我认为值多少'开始"

  - id: "CC-3"
    name: "NRR缺失的信号分析——沉默本身是数据"
    chain: >
      CRM从不公开NRR(净收入留存率)
      → 如果NRR>120%→管理层必然大力宣传(NOW~130%/SNOW~130%都积极披露)
      → CRM不公开→最可能NRR在100-115%区间
      → 意味着客户留存但钱包份额扩张有限→不如NOW/SNOW的"land and expand"
      → CEO沉默域分析: 5个从不回答的问题中→NRR和AF渗透率如果公开可能导致进一步悲观
      → 推论: 市场的悲观可能还不够——因为有些负面信息被管理层有效隐藏
    transferable_to: "所有SaaS公司——管理层不公开的指标通常是表现不好的指标"
    reasoning_habit: "列出管理层'沉默域'(反复被问但从不回答的问题)——沉默本身是强信号，通常是负面信号"

  - id: "CC-4"
    name: "定价权剪刀差→OPM反直觉超预期"
    chain: >
      F500客户(45%收入)定价权Stage 4→切换成本>10x年费→可年涨5-8%
      SMB客户(20%收入)定价权Stage 2→HubSpot提供更便宜替代→流失加速
      → 反直觉: 低端流失→高利润客户占比上升→混合OPM可能反直觉达到26-28%
      → 但Wall Street解读增速下降→PE压缩→即使盈利能力改善
      → 因此CRM可能同时出现"利润改善+PE压缩"的分裂局面
    transferable_to: "所有有分层客户结构的SaaS/B2B公司(ADBE已独立验证相同模式)"
    reasoning_habit: "看到客户流失时，先问'流失的是高利润还是低利润客户'——低端流失可能反而改善利润率"

  - id: "CC-5"
    name: "ADBE镜像对标——同行业相似PE的纠偏作用"
    chain: >
      CRM和ADBE: 几乎相同增速(12% vs 12%)→几乎相同PE(14.7x vs ~15x)→几乎相同AI威胁叙事
      → v1.0没有ADBE对标→P1给出$235(PE~17.5x)→远高于ADBE→无法解释为什么增速更低的CRM应获更高PE
      → v2.0从P0引入ADBE→发现: ADBE在15x PE下没人喊"被低估"→CRM在14x喊"被低估"需要非常强的理由
      → 估值约束: CRM合理PE区间12-18x(被ADBE锚定) | 低端=AF失败 | 高端=AF成功
    transferable_to: "所有分析——最相似可比公司的PE是最强的外部估值锚"
    reasoning_habit: "给出目标价前，先找最相似可比(增速/PE/行业最接近)→如果可比PE=15x且你给20x→需要极强理由"

  - id: "CC-6"
    name: "温水煮青蛙——CRM特有的结构性风险"
    chain: >
      温水煮青蛙路径(15%概率): 每季度增速-0.5pp→5年累计增速从7%→2%
      → 为什么特别危险: CRM有太多"看起来在进步"的指标(AF deals增长/DC +100%/OPM扩张)来掩盖核心业务恶化
      → 历史类比: IBM 2013-2020→每年Watson"突破"+cloud"增长"→但mainframe萎缩→7年-40%→从未单季>-15%
      → 温水煮青蛙5年NPV: +2.3%(名义收支平衡)但跑输S&P500 49%
      → 真实代价不是"亏多少"而是"错过多少"→投资者看到"没亏"就不卖→隐性亏损(机会成本)
    transferable_to: "所有有多个'进步指标'可掩盖核心恶化的平台型公司"
    reasoning_habit: "区分'进步指标'和'核心指标'——如果核心指标(seat增速/NRR)在恶化，不管多少进步指标在改善都要警惕"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "v1.0: CRM显著低估，$235目标价(PE~17.5x)"
      final: "v2.0: CRM基本合理定价，$193-208概率加权→中性关注"
      pivot: "Reverse DCF P1前置→市场隐含3.7%略悲观但考虑seat压缩后可能合理 + ADBE对标→增速相同PE相似=没有理由说CRM更低估"

    - initial: "飞轮叙事: Platform→Data Cloud→Agent→Users自加速"
      final: "飞轮净强度~-0.2(弱负)→数据复用而非自加速循环→PE含~$22叙事溢价"
      pivot: "MCO飞轮验证方法论: 3连接点逐一量化→1真实/1弱/1微弱 + 飞轮悖论发现(Agent蚕食seat)"

    - initial: "OPM改善=增长将加速"
      final: "OPM改善的52%来自S&M削减→可能以增速为代价→效率提升≠增长提升"
      pivot: "S&M削减贡献分解: 80%结构性(数字化/存量扩展)+20%周期性→但cRPO/RPO分歧暗示客户承诺在缩短"

  surprises:
    - finding: "CRM终局分布比ADBE宽得多——10-30x PE区间 vs ADBE 15-25x"
      implication: "市场用'SaaSpocalypse折价'一刀切对待两者→如果终局分布不同→可能存在定价错误→但方向不确定"

    - finding: "飞轮悖论: Agent越成功→seat越少→核心收入越受压→飞轮的加速器同时是刹车器"
      implication: "所有声称'AI增强飞轮'的SaaS公司都应检验是否存在此悖论→如果存在→管理层叙事的PE溢价应打折"

    - finding: "73%新bookings来自upsell(非新客)→CRM增长引擎已从'获客'转向'提价'"
      implication: "获客停滞+提价加速→短期利润率改善→但长期TAM缩小→类似成熟消费品公司而非成长科技公司"

    - finding: "定价权剪刀差: F500 Stage 4固化 + SMB Stage 2侵蚀→低端流失反而改善OPM"
      implication: "CRM+ADBE独立发现相同模式→定价权分层评估应成为B2B SaaS标准框架"

  blind_spots:
    - area: "NRR真实数值"
      why_matters: "NRR<105%=客户扩展停滞→增长叙事根基动摇 | NRR>115%=市场过度悲观"
      monitor: "CRM如果在未来财报中首次公开NRR→无论数值都是重大信号(公开=改善/继续沉默=恶化)"

    - area: "Agentforce真实渗透率与付费率"
      why_matters: "$800M ARR中67%免费→真实付费ARR仅~$264M→PMF完全未确认"
      monitor: "FY2027H1: consumption ARR增速 | 免费→付费转化率 | Forrester/Gartner独立评估"

    - area: "NOW CRM模块的竞争实质化程度"
      why_matters: "NOW如果在财报中单独披露CRM收入→意味着已构成实质竞争→mid-market侵蚀加速"
      monitor: "NOW季报中CRM相关收入披露 | F500中NOW替代CRM部分功能的案例数"

    - area: "WACC敏感性——±50bps跨越全区间"
      why_matters: "WACC 10.0%→$211(低估7%) / 10.5%→$194(完美定价) / 11.0%→$178(高估8%)"
      monitor: "10Y Treasury + CRM信用利差 + 股权风险溢价"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "温水煮青蛙: 每季度增速-0.5pp但从无'该卖'的明确信号→5年隐性亏49%(机会成本)"
      lesson: "设置增速下限而非等待暴跌——连续3季增速低于隐含CAGR→启动减仓。IBM 2013-2020是教训"
      transferable: "所有有多个'进步指标'可掩盖核心恶化的平台型公司"
    - scenario: "结论先行导致v1.0失败——P1 bullish $235→P4推翻→已写4 Phase无法修复"
      lesson: "分析师最大的敌人是自己的第一印象。Reverse DCF中性起点=保险——红队代价从-25%降至-8.5%"
      transferable: "所有多Phase深度研究——v2.0的3个铁律(O/H/K)是通用防偏差工具"
    - scenario: "管理层用AI叙事掩盖核心恶化——AF deals增长/DC +100%→但seat仍在压缩"
      lesson: "区分'叙事指标'和'现金指标'——AF consumption ARR是现金指标，AF deals数量是叙事指标"
      transferable: "所有正在'转型'的公司——管理层总有新故事讲，但只有现金流不会说谎"

# --- Layer 2.5: 信号分级 (v1.2新增) ---
signal_hierarchy:
  alpha_signals:
    - signal: "Agentforce consumption ARR(KS-1)"
      why_alpha: "±$64/股摆动=所有CQ合计→单一指标决定CRM是$130还是$260。大多数分析师看AF deals数量(叙事)而非consumption(现金)"
      current_reading: "$800M ARR但67%免费→真实付费~$264M(PMF未确认)"
    - signal: "NRR(管理层沉默域)"
      why_alpha: "管理层从不公开→沉默本身是负面信号→如果首次公开=重大信号变化"
      current_reading: "推断100-115%区间(如果>120%一定会公开)"
    - signal: "cRPO与Total RPO增速分歧"
      why_alpha: "cRPO +16%但RPO仅+7.7%→如果因客户缩短合同期限→长期承诺在降低→seat压缩的前瞻信号"
      current_reading: "分歧存在且扩大(需持续监测)"

  confirmation_signals:
    - signal: "Service Cloud增速(KS-2)"
      bullish_threshold: ">+5%(seat压缩可控)"
      bearish_threshold: "<+2%(seat压缩失控→S4路径概率上升)"
    - signal: "FY2027 OPM(KS-3)"
      bullish_threshold: ">24%(结构性改善持续)"
      bearish_threshold: "<20%(S&M削减到底→增长见顶)"
    - signal: "净债务/EBITDA(KS-5)"
      bullish_threshold: "<2.5x(ASR后快速去杠杆)"
      bearish_threshold: ">3.5x(ASR毁灭资产负债表)"

  noise_signals:
    - signal: "AF deals数量/客户公告"
      why_noise: "管理层最擅长用deal wins讲故事→但deals≠revenue→只有consumption ARR反映真实采用"
    - signal: "Sell-side目标价调整"
      why_noise: "41家分析师consensus用不同WACC/增速→离散度极大→自己做Reverse DCF更准"
    - signal: "季度revenue beat/miss 1-2%"
      why_noise: "$41.5B基数上±$400M是噪音→看cRPO有机增速的方向趋势更有信号"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: ADBE
      similarity: "最相似可比——同为seat-based SaaS巨头(ARR>$20B)、同面临AI替代悖论、同在尝试seat→consumption转型、PE几乎相同(14.7x vs ~15x)"
      key_difference: "CRM的AI受益空间更大(AIAS +2.30 vs +0.51)但核心业务风险也更大(seat压缩更直接) | ADBE终局分布更窄(15-25x) vs CRM更宽(10-30x)"

    - ticker: NOW
      similarity: "企业SaaS平台+AI Agent竞争者+嵌入企业工作流"
      key_difference: "NOW NRR~130%(CRM推断<115%) | NOW CRM模块是CRM mid-market的直接威胁 | NOW PE>30x说明市场相信其AI转型→CRM PE 14.7x说明市场不相信"

    - ticker: MSFT
      similarity: "Copilot是Agentforce的最大竞争者+M365生态锁定企业客户"
      key_difference: "MSFT可以免费捆绑CRM功能(Azure VD教训)→CRM无法对等反击→非对称竞争"

  comparative:
    - dimension: "AI受益程度(AIAS)"
      position: "CRM (+2.30) > ADBE (+0.51) > 传统SaaS"
      reasoning: "CRM的B端(Agentforce新收入+数据飞轮)远大于ADBE→但S端也更大(seat直接被替代)"

    - dimension: "增长质量"
      position: "NOW (NRR~130%) > SNOW (NRR~130%) >> CRM (NRR推断<115%)"
      reasoning: "NRR缺失=扩展能力不如peer→增长更依赖新客而非存量扩展→但CRM基数($41.5B)远大"

    - dimension: "估值吸引力(当前)"
      position: "CRM (14.7x) ≈ ADBE (~15x) << NOW (>30x) << SNOW (>50x)"
      reasoning: "CRM和ADBE被'SaaSpocalypse折价'一刀切→如果AI转型成功两者都应re-rate→但方向不确定"

    - dimension: "护城河稳定性"
      position: "MSFT > NOW > CRM > ADBE"
      reasoning: "CRM护城河正在迁移(工具→数据)→脆弱窗口FY2026-2027→如果撑过则更强→如果被攻破则不可逆"

  industry_position:
    quadrant: "高嵌入性 × 中等增长 × 护城河迁移中"
    archetype: "转型期平台——从seat订阅收费站向AI consumption平台转变"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含CAGR 3.7% vs 有机~7%→差距3.3pp=seat压缩折价+AI不确定性折价"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "7个RT测试 + 7面承重墙概率校准 → 红队修正-$18(-8.5%) → 83%有效率(6/7有修正)"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "温水煮青蛙路径(15%概率): 每季度增速-0.5pp→5年跑输S&P500 49%→IBM 2013-2020类比"

    - pattern_id: "competitive_benchmarking.mirror_company"
      application: "ADBE镜像对标: 同PE+同增速+同AI威胁→ADBE在15x没人喊低估→CRM在14x需极强理由才能喊低估"

  novel_patterns:
    - name: "飞轮悖论(Flywheel Paradox)"
      description: "AI Agent成功蚕食核心per-seat收入——飞轮的加速器同时是刹车器。净强度~-0.2说明管理层叙事的飞轮实际是负净强度"
      transferable_to: ["所有per-seat SaaS声称AI增强飞轮的公司", "CRM v2.0→v19.6框架升级(飞轮悖论检测)"]

    - name: "NRR沉默信号(Silent NRR Signal)"
      description: "管理层反复被问但从不公开NRR→沉默本身是负面数据点。推断公式: 如果peer在NRR>120%时积极披露→不披露=大概率<115%"
      transferable_to: ["所有SaaS公司NRR评估", "管理层'沉默域'分析框架"]

    - name: "定价权剪刀差(Pricing Power Scissors)"
      description: "B4定价权按客户层分层后发现: 高端固化(Stage 4)+低端侵蚀(Stage 2)→低端流失反而改善OPM(反直觉)"
      transferable_to: ["所有有分层客户结构的B2B公司", "CRM+ADBE双验证→v19.6框架升级"]

    - name: "v1.0→v2.0方法论修正范式"
      description: "结论先行导致分析失败→3个铁律(O/H/K)从源头消除偏差→红队代价从-25%降至-8.5%→'最好的红队发现很少错误'"
      transferable_to: ["所有多Phase深度研究", "铁律O/H/K是通用分析质量保障工具"]

    - name: "护城河迁移量化(Moat Migration Quantification)"
      description: "旧护城河(工具嵌入)→新护城河(数据+AI)迁移中→脆弱窗口FY2026-2027→迁移进度~20%→交叉点FY2028→成功概率~45%"
      transferable_to: ["所有正在经历技术转型的平台公司", "ADBE方法论首创→CRM验证"]

    - name: "SaaS单位经济学强制(SaaS Unit Economics Mandate)"
      description: "CRM v1.0 NRR/GRR/CAC全缺→增长质量判断建立在猜测上→v2.0用间接法推断NRR<115%→升级为v19.6框架强制要求"
      transferable_to: ["所有SaaS Tier 3分析", "v19.6框架升级: Phase 1必须包含NRR推断+S&M效率+Magic Number"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "飞轮悖论检测——新产品成功是否蚕食核心产品。CRM的Agent成功→seat减少=加速器同时是刹车器"
        implication: "Phase 1飞轮分析增加'悖论检查': 飞轮净强度<0=管理层叙事溢价→报告中需量化溢价(PE倍数)"
      - insight: "护城河迁移有脆弱窗口——旧护城河衰减+新护城河未确立的时间窗口是竞争者进攻最佳时机"
        implication: "护城河评估增加'迁移进度%+交叉点年份+脆弱窗口时长'三个定量指标"
      - insight: "定价权必须按客户层分层——统一Stage掩盖了'剪刀差'(高端固化+低端侵蚀)"
        implication: "B4定价权评估从单一Stage→F500/大中型/SMB/微型各自Stage→加权B4"

    valuation_insights:
      - insight: "Reverse DCF P1前置消除结论先行偏差——v1.0红队-25% vs v2.0红队-8.5%"
        implication: "铁律O: 所有Tier 3分析P1 Ch1必须包含Reverse DCF结论。P1叙事不能比Reverse DCF暗示的方向偏离>1档"
      - insight: "最相似可比公司P0强制对标——ADBE锚定CRM合理PE区间12-18x"
        implication: "铁律H升级: Phase 0 shared_context必须包含最相似可比的估值对比表"
      - insight: "不对称比(买入错误代价/不买错误代价)是比期望回报更好的决策指标"
        implication: "CRM 3.5:1偏下行→即使期望回报微正→不应建仓。决策用不对称比而非期望回报"

    screening_insights:
      - insight: "SaaS公司不公开NRR=负面筛选信号——如果NRR好一定会公开"
        implication: "选股筛选增加'NRR披露状态'字段: 披露且>120%=加分 / 不披露=扣分假设<115%"
      - insight: "飞轮悖论公司应获得PE折价——管理层叙事溢价需量化扣除"
        implication: "发现飞轮悖论→管理层PE溢价估计(CRM~$22/~1.5x PE)→从目标PE中扣除"
      - insight: "seat-based SaaS正在经历结构性PE压缩(从25x→15-18x)→行业β下降"
        implication: "SaaS筛选需区分seat-based vs consumption-based→前者PE中枢下移→后者可能维持"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "Reverse DCF永远是第一步——先翻译市场在赌什么，再判断市场对不对"
      trigger: "开始任何公司分析时"
      origin: "v1.0结论先行失败→v2.0 Reverse DCF中性起点成功→红队代价从-25%降至-8.5%"
      generalization: "这不是SaaS特有的——所有分析都应该从市场隐含假设出发。Reverse DCF是通用'反偏差疫苗'"

    - habit: "看到'AI飞轮'叙事时，立刻追问'核心产品seat/用量增还是减'"
      trigger: "任何公司声称AI增强其平台/飞轮效应"
      origin: "CRM飞轮悖论: Agent成功→seat减少→飞轮加速器=刹车器 + MCO飞轮摩擦力验证方法论"
      generalization: "飞轮悖论可能是SaaS行业AI转型的普遍问题——如果AI产品替代了使用核心产品的人→核心产品必然萎缩"

    - habit: "管理层沉默域清单——列出反复被问但从不回答的问题"
      trigger: "分析管理层质量/信息透明度时"
      origin: "CRM 5个沉默域(NRR/AF渗透率/seat净增/GRR/有机vs无机拆分)→每个都指向负面"
      generalization: "适用于所有上市公司——沉默通常=数据不好看。信息理论: 有选择地不公开=公开负面信息的等价"

    - habit: "最相似可比公司是最强的估值锚——比DCF更稳定"
      trigger: "给出目标价前"
      origin: "CRM v1.0无ADBE对标→$235脱锚 | v2.0 P0引入ADBE→12-18x区间约束"
      generalization: "DCF对WACC极敏感(±50bps跨越全区间)→可比公司PE更稳定→应作为DCF的'外部约束'而非补充"

  quality_feedback:
    strengths:
      - "DM密度2.88/千字(优秀, 超目标92%) — 从v1.0的~0.5/千字提升464%"
      - "因果密度~8.0/万字(合格偏优) — 从v1.0的~3/万字提升173%"
      - "8项门控全PASS — 字符230K/DM 568/Mermaid 59/离散度16.7%"
      - "v1.0→v2.0方法论进化是框架级贡献 — 产出3个铁律(O/H/K)"
      - "飞轮悖论是首次发现的新模式 — 已升级为v19.6框架强制检测"
    weaknesses:
      - "置信度仅55% — WACC±50bps跨越全区间=分析精度受限于折现率假设"
      - "NRR/GRR/CAC仍为间接推断 — 最大数据盲点未解决(管理层不公开)"
      - "Agentforce数据质量: $800M ARR为管理层披露, 未经独立审计"
      - "单源风险: 财务数据主要依赖FMP API, 未与10-K原文逐条交叉验证"

  hypothesis_tested:
    confirmed:
      - hypothesis: "定价权分层评估(CRM+ADBE双验证)"
        evidence: "CRM: F500 Stage 4/SMB Stage 2 | ADBE: CC Professional提价/CC Consumer被Canva侵蚀 → 相同模式"
        confidence_after: "高(两份独立报告确认→升级为v19.6框架强制)"

      - hypothesis: "Reverse DCF P1前置防止结论先行(铁律O)"
        evidence: "v1.0红队-25%(失败) vs v2.0红队-8.5%(成功) → 同一公司AB测试"
        confidence_after: "高(CRM是铁律O的起源案例+CME v3.0执行确认)"

      - hypothesis: "飞轮摩擦力量化(MCO方法论)"
        evidence: "CRM飞轮净强度~-0.2(弱负) vs MCO 3连接中1真1弱1间接 → 方法论可跨行业迁移"
        confidence_after: "高(MCO→CRM验证方法论稳定性)"

    extended:
      - hypothesis: "回购η效率曲线(MCO→CRM)"
        extension: "CRM η=0.85(中性偏弱) vs MCO η=0.95 vs ADBE η=0.70 → 跨公司对标矩阵成型(AAPL 1.35/META 1.20/CRM 0.85/ADBE 0.70)"

      - hypothesis: "SaaS单位经济学是增长质量的核心指标"
        extension: "CRM NRR缺失→间接推断<115% → 升级为v19.6: SaaS公司Phase 1必须包含NRR推断+S&M效率+Magic Number"

    refuted:
      - hypothesis: "CRM v1.0: Salesforce被显著低估($235)"
        evidence: "v2.0 Reverse DCF起点→概率加权$193≈市价$194→市场基本正确定价"
        lesson: "结论先行偏差可以让分析师对同一公司得出完全不同的估值→方法论>能力"

  limitations:
    - "WACC不确定性: ±50bps跨越'低估→合理→高估'全区间→估值精度天然受限"
    - "Agentforce处于S-curve早期→线性外推可能严重偏离→PMF结论需等FY2027H1数据"
    - "NRR/GRR/CAC为间接推断→如果实际NRR<105%或>120%→结论可能需要大幅修正"
    - "AI对SaaS行业的影响处于范式转变早期→所有假设的半衰期<2年"
    - "v2.0虽然修正了v1.0的方法论缺陷→但仍依赖同一AI分析系统→系统性偏差无法自我检测"
