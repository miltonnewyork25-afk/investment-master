    - dimension: "利润率质量"
      position: "MSFT (45.6%) > GOOG (~30%) > META (~40%) >> AMZN (11.2%)"
      reasoning: "AMZN零售拖累整体OPM; 即便AWS OPM ~38%也远低于MSFT整体"

    - dimension: "FCF健康度"
      position: "META > MSFT > GOOG >> AMZN"
      reasoning: "AMZN FCF Yield 0.34%为科技巨头最低; MSFT ~2.5%, GOOG ~3.8%, META ~3.2%"

    - dimension: "AI基础设施投资强度"
      position: "AMZN ($200B) > MSFT ($120B) > GOOG (~$75B) > META (~$40B)"
