        severity: "warning"
        action: "重新评估AWS利润引擎叙事, S3概率上升"
      - signal: "连续3季度FCF<0且OCF增速<10%"
        severity: "action"
        action: "资本黑洞风险实质化, 减仓"
      - signal: "AI泡沫破裂(NVIDIA季度收入同比下降+AI CapEx行业周期拐点)"
        severity: "emergency"
        action: "全面重新评估, S4概率跃升"
    position_sizing: "期望回报+9.1%置信度52.45%→Kelly建议小仓位或等待; 不确定性结构中30%为无法消除的结构性不确定"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "CapEx→D&A延时炸弹的利润幻觉逻辑"
    chain: >
      FY2025 CapEx $131.8B→FY2026指引$200B
      → CapEx/D&A比率2.0x(资产基础膨胀速度是折旧速度2倍)
      → D&A将在未来2-3年追赶上来→增量D&A $30-40B/年
      → 假设OPM不变, FY2027-28 Net Income可能下降40-50%
      → P/E从28x推至40-50x→市场重新定价
      → 因此P/E 28x是"D&A延时炸弹爆发前"的快照, 不是稳态估值
    transferable_to: "所有处于CapEx重投资周期的公司(AI基础设施/半导体fab/物流扩张)"
    reasoning_habit: "看到P/E低于历史均值时, 追问'利润基础是否处于峰值或CapEx低谷' — CapEx/D&A比率>1.5x是利润不可持续的信号"

  - id: "CC-2"
    name: "飞轮的过载测试——投资加速但利润增速放缓"
    chain: >
      Amazon飞轮假设: 更多投资→更好体验→更多用户→更多利润→更多投资
      → 但CapEx/OCF从62%升至94.5%(逼近100%)
      → 飞轮的'投资→利润'转化环节出现断裂: 投资加速而OPM仅提升0.4pp
      → 如果CapEx/OCF突破100%, 飞轮从'正向循环'变为'资本消耗器'
      → 飞轮弱化还会反向放大: 零售薄利→减少投资→体验下降→用户流失→飞轮反转
    transferable_to: "所有声称有飞轮效应但CapEx/OCF>80%的公司"
    reasoning_habit: "飞轮分析不能只看正向循环——必须测试'过载点': 投资增速>利润增速持续多久飞轮会断裂"

  - id: "CC-3"
    name: "SOTP揭示零售的真实角色——流量基础设施而非利润中心"
    chain: >
      SOTP分部拆分: 总OI $80B - AWS OI $48.3B - 广告OI $37.7B(推断) = 零售OI -$6.0B
      → 零售扣除广告利润后是亏损的
      → 零售不是利润来源, 而是AWS和广告的流量基础设施
      → 因此零售的估值不应基于P/E, 而应基于'为广告和AWS带来的流量价值'
      → SOTP中零售残值$300B主要反映物流资产和Prime会员价值, 不是运营利润
    transferable_to: "所有有'亏损获客引擎+高margin变现引擎'结构的平台公司(拼多多/Uber/DoorDash)"
    reasoning_habit: "看到多业务公司时, 用SOTP剥离各业务真实贡献——表面最大收入的业务可能是亏损的流量基建"

  - id: "CC-4"
    name: "承重墙不可能三角——CapEx回归+D&A见顶+高ROIC最多满足两个"
    chain: >
      BW#1: CapEx在FY2027-28回归至$120-140B(CapEx回归)
      BW#7: D&A在FY2030左右见顶(利润率改善)
      CQ1: AI CapEx的增量ROIC>12%(投资回报)
      → 如果CapEx回归→D&A基数停止增长→D&A见顶→OPM可以扩张(#1+#7满足)
      → 但CapEx回归意味着AI投资减少→ROIC样本不足以验证→#1和#7排斥CQ1
      → 如果持续高CapEx($180B+)→ROIC可能验证→但D&A持续攀升→OPM扩张延迟→#7不满足
      → 三者最多同时满足两个=估值的结构性不可知
    transferable_to: "所有面临'投资回报期望vs利润率改善路径vs投资强度维持'三角矛盾的重资本公司"
    reasoning_habit: "识别投资论文中的不可能三角——如果三个关键假设逻辑上最多满足两个, 论文的隐含乐观度比表面高"

  - id: "CC-5"
    name: "巨头DCF的WACC主导定律"
    chain: >
      WACC从8.5%到9.5%(仅100bps)
      → DCF估值从$214/sh变为$152/sh→$390B市值差异(相当于一个Netflix)
      → 20小时深度业务分析的累计估值影响 < WACC选择中一个主观假设(ERP 4.5% vs 5.5%)
      → 因此巨头DCF点估值是伪精度→有价值的输出是WACC双锚区间和条件映射
    transferable_to: "所有$500B+市值的巨头公司(MSFT/GOOG/META/AAPL)"
    reasoning_habit: "对巨头公司, 永远先做WACC敏感性→如果WACC±50bps导致估值变动>15%, DCF点估值无决策价值"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "P/E 28x vs 5年均值44x = 历史性低估"
      final: "P/E 28x建立在CapEx高峰前的利润峰值上, FY2027增量D&A $30-40B可能将P/E推至40-50x"
      pivot: "CapEx/D&A比率2.0x暴露了D&A延时炸弹——利润基础不是稳态而是峰值"

    - initial: "FTC分拆是最大威胁"
      final: "SOTP分拆价值$2,452B > 当前EV $2,225B, 分拆反而是正面事件"
      pivot: "AWS独立$1,472B + 广告独立$630B + 零售独立$350B的加总超过当前合并估值"

    - initial: "红队校准前期望回报+11.4%(关注评级)"
      final: "红队校准后期望回报+9.1%(中性关注), S2从45%→42%, S3从30%→33%"
      pivot: "RT-2偏差审计识别4/5种偏差指向系统性偏乐观→概率再分配→评级翻转"

  surprises:
    - finding: "零售扣除广告利润后实际亏损$6.0B——零售不是利润中心而是流量基建"
      implication: "Amazon的估值叙事应从'三引擎利润'改为'AWS+广告双引擎利润+零售流量补贴'"

    - finding: "端点级离散度3.78x(全系列第二高, 仅次于APP)——确定性假象"
      implication: "方法中值收敛($185-$225)是'确定性假象', 真实不确定性远大于表面"

    - finding: "0/44卖方分析师给Sell评级——这是$2T+市值的结构性偏差而非基本面信号"
      implication: "卖方共识对Megacap天然偏多→共识目标价应系统性下调~16%"

    - finding: "Buffett减持AMZN的方法论不兼容——'10年FCF折现'框架拒绝为$200B CapEx周期付28x P/E"
      implication: "价值投资框架与AI军备竞赛公司存在方法论冲突→不同投资框架对同一公司可得出截然相反结论"

  blind_spots:
    - area: "增量CapEx ROIC——本报告最大的不确定性来源"
      why_matters: "ROIC>15%→显著低估; ROIC<10%→当前偏高; CQ1权重25%且置信度仅42%"
      monitor: "FY2026全年财报(2027年2月)首次可间接推算; AWS AI收入占比披露"

    - area: "广告OPM(50-65%)为D级数据质量推断"
      why_matters: "SOTP中广告贡献$565B(27%), OPM每变动15pp→SOTP净影响$65B"
      monitor: "Amazon未来是否单独披露广告分部利润率"

    - area: "D&A见顶时间——红队新增的第七面承重墙(BW#7)"
      why_matters: "OPM从11.2%→16%的路径隐含D&A在FY2030见顶, 如AI军备竞赛使CapEx维持$180-200B→D&A见顶延至FY2032+"
      monitor: "FY2027-2028 CapEx指引 + D&A年度增速趋势"

  sell_lessons:
    - scenario: "FCF从$32.9B崩塌至$7.7B(-76%)但股价未同步下跌"
      lesson: "市场对FCF崩塌的容忍度取决于叙事强度——'AI投资'叙事可以让市场忽略FCF 1-2年, 但不能忽略3年+"
      transferable: "所有处于CapEx重投资周期且FCF大幅下降的公司(TSM fab扩张/MSFT AI投资)"
    - scenario: "温水煮青蛙——概率加权影响最大的路径(25%×-28%=-7%市值)"
      lesson: "极端风险(分拆/崩溃)吸引注意力, 但渐进侵蚀(每季-0.5%份额+-30bps OPM)的概率加权影响更大"
      transferable: "所有有'每季度微小恶化'模式的公司——不触发警报但24个月累积致命"
    - scenario: "P/E处于5年低位不等于便宜——利润基础可能在峰值"
      lesson: "P/E低位的安全性取决于E的可持续性。CapEx/D&A>1.5x时, E正在被CapEx周期暂时推高"
      transferable: "所有CapEx/D&A>1.5x且P/E看似'便宜'的重资本公司"

