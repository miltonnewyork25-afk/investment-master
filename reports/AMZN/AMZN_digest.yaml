    - dimension: "估值吸引力(P/E)"
      position: "AMZN (28x) < GOOG (~22x) < MSFT (~32x) < META (~25x)"
      reasoning: "AMZN P/E最低但利润基础最脆弱(D&A延时炸弹); P/E低不等于便宜"

