      key_difference: "GOOG广告OPM公开透明 vs AMZN广告OPM为D级推断 | GCP第三(份额~12%) vs AWS第一(29%)"

    - ticker: META
      similarity: "广告业务类比锚(META OPM~40%用于推断AMZN广告OPM), 同为AI重投资者"
      key_difference: "META FCF充裕 vs AMZN FCF近零 | META单一引擎(广告) vs AMZN三引擎"

