    archetype: "平台飞轮 — 三引擎协同但CapEx过载风险正在测试飞轮极限"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF揭示: 实际FCF $7.7B需41% CAGR(不可能); 正常化FCF $35B需20% CAGR(乐观); 市场定价=赌CapEx暂时性"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "温水煮青蛙(S3): 每季-0.5%份额+-30bps OPM→24个月累积蒸发$460-760B→概率加权影响(-7%)远超极端风暴(-4%)"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-2检测5/6种偏差中4种偏向乐观→S2从45%→42%, 期望回报从+11.4%→+9.1%→评级从关注翻转至中性关注"

  novel_patterns:
    - name: "D&A延时炸弹(CapEx/D&A>1.5x利润幻觉)"
      description: "CapEx/D&A比率>1.5x时, 当前利润被CapEx周期暂时推高, P/E低位是假象——D&A将在2-3年追赶导致利润大幅下降"
      transferable_to: ["AI基础设施重投资公司(MSFT/GOOG)", "半导体fab扩张(TSM/INTC)", "所有CapEx/D&A>1.5x的公司"]

    - name: "承重墙不可能三角"
      description: "CapEx回归+D&A见顶+高ROIC三个关键假设最多同时满足两个→投资论文的隐含乐观度比表面高"
      transferable_to: ["所有重资本投资周期中的公司", "投资论文依赖>2个相互排斥假设的情况"]

    - name: "SOTP揭示隐藏亏损引擎"
      description: "多引擎公司用SOTP剥离各业务真实贡献→表面最大收入的业务可能是亏损的流量基建"
      transferable_to: ["平台公司(亏损获客+高margin变现)", "拼多多/Uber/DoorDash类模式"]

    - name: "巨头WACC主导定律"
      description: "$500B+市值公司DCF估值中, WACC选择(±100bps)的影响大于所有业务分析的累计影响→DCF点估值是伪精度"
      transferable_to: ["所有$500B+市值巨头", "MSFT已独立确认"]

    - name: "条件评级(巨头估值框架)"
      description: "对$2T+市值公司, 不给精确目标价→给'什么条件下变便宜/贵'的条件映射+投资者决策树"
      transferable_to: ["所有Megacap分析", "不确定性结构中>30%为结构性不可知的公司"]

  framework_contributions:
    moat_insights:
      - insight: "飞轮有过载点——CapEx/OCF>80%时飞轮的'投资→利润'环节可能断裂"
        implication: "飞轮分析增加'过载测试': 投资增速>利润增速持续2年+→飞轮可能从加速器变为资本消耗器"
      - insight: "SOTP可揭示'表面最大业务实际亏损'——零售$575B收入扣除广告利润后=-$6B"
        implication: "多引擎公司护城河评估应分业务做SOTP利润归因, 避免被合并报表的混合利润率误导"

    valuation_insights:
      - insight: "CapEx/D&A>1.5x是P/E不可持续的前瞻信号——D&A延时炸弹将在2-3年内推高P/E"
        implication: "所有处于CapEx重投资周期的公司, 应计算'D&A追赶后的P/E'作为稳态估值锚"
      - insight: "巨头DCF中WACC±100bps的影响>所有业务分析累计→DCF点估值无决策价值"
        implication: "巨头估值输出应为WACC双锚区间+条件映射, 不是单一目标价"
      - insight: "方法级离散度1.22x是'确定性假象', 端点级3.78x才是真实不确定性"
        implication: "报告离散度应同时报告方法级和端点级——前者容易误导投资者以为估值确定"

    screening_insights:
      - insight: "CapEx/OCF>90%且FCF Yield<1% = '资本黑洞'警示信号"
        implication: "选股筛选加入'FCF健康度'过滤: CapEx/OCF>80%且FCF Yield<1%→标记需深度审视CapEx回报率"
      - insight: "0/44卖方给Sell = 结构性偏差信号, 非基本面信号"
        implication: "对$1T+市值公司, 卖方共识Strong Buy不含增量信息→选股不应依赖卖方评级分布"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "P/E看似历史低位时, 立刻检查CapEx/D&A比率"
      trigger: "P/E<历史均值30%+且公司处于CapEx重投资周期"
      origin: "AMZN P/E 28x vs 5年均44x→看似便宜→但CapEx/D&A 2.0x暴露D&A延时炸弹"
      generalization: "CapEx/D&A>1.5x=利润基础可能在峰值, P/E低位是假象"

    - habit: "识别投资论文中的不可能三角"
      trigger: "估值依赖≥3个关键假设时"
      origin: "RT-3发现CapEx回归+D&A见顶+高ROIC最多满足两个"
      generalization: "如果论文的3个关键假设逻辑上互斥, 投资者在不自觉地为'最多实现2/3'支付'3/3全实现'的价格"

    - habit: "用SOTP做利润归因——找出表面最大业务是否实际亏损"
      trigger: "多引擎公司的合并OPM模糊各业务真实贡献时"
      origin: "SOTP剥离后发现零售OI=-$6B→零售是流量基建而非利润中心"
      generalization: "混合利润率掩盖了业务间的交叉补贴→SOTP利润归因比合并报表更接近真相"

    - habit: "红队后立刻检查是否翻转评级——边界案例对概率微调极敏感"
      trigger: "期望回报在评级边界(如+10%)附近"
      origin: "AMZN红队校准: S2 -3pp→期望回报从+11.4%降至+9.1%→评级从'关注'翻转至'中性关注'"
      generalization: "期望回报在评级门槛±5pp内=边界案例→红队调整即使很小也可能翻转结论→必须做概率敏感性表"

  quality_feedback:
    strengths:
      - "Reverse DCF双方法(实际FCF+正常化FCF)暴露了市场信念的数学边界——最有区分度的洞见"
      - "SOTP揭示零售隐藏亏损是全报告最反直觉的发现"
      - "红队七问+双向校准有效翻转了评级(关注→中性关注)——红队不是走过场"
      - "DM密度1.62/千字合格, 383个DM锚点覆盖全报告"
      - "条件评级框架+投资者决策树为巨头估值提供了新范式"
      - "32个Mermaid图表, 可视化充分"
    weaknesses:
      - "广告OPM 55%为D级数据质量——SOTP中27%的价值建立在未验证估计上"
      - "无Python验证DCF/SOTP计算——MSFT教训(8/9格计算错误)的风险未消除"
      - "CQ1(CapEx ROIC)置信度42%意味着核心判断本质上是猜测——分析深度受限于Amazon不披露"
      - "报告未含显式质量记分卡(D1-D11评分)"

  hypothesis_tested:
    confirmed:
      - hypothesis: "巨头DCF中WACC主导估值(MSFT首次发现)"
        evidence: "WACC±100bps→AMZN估值变动$390B(一个Netflix)→MSFT结论在AMZN独立确认"
        confidence_after: "高(两份巨头报告独立确认)"

      - hypothesis: "Reverse DCF是巨头分析最有价值的工具(KLAC首次发现)"
        evidence: "41% CAGR(不可能)和20% CAGR(乐观)精确定义了市场信念的上下界"
        confidence_after: "高(KLAC+AMZN独立确认)"

    extended:
      - hypothesis: "飞轮摩擦力量化(CME首次提出)"
        extension: "AMZN飞轮增加'过载测试'——不仅量化摩擦力, 还测试CapEx/OCF是否突破飞轮断裂点"

      - hypothesis: "Core PE剥离非经营性收入(CME首次提出)"
        extension: "AMZN版本: 不是剥离利息, 而是剥离D&A延时效应→'D&A追赶后P/E'是类似Core PE的概念"

    refuted: []

  limitations:
    - "$200B CapEx的增量ROIC完全不可观测——Amazon不披露, 市场无数据源, FY2026全年数据才能间接推算"
    - "广告OPM 55%是D级推断——SOTP中$565B(27%)建立在未验证假设上"
    - "概率分配(S1 12%/S2 43%/S3 33%/S4 12%)无频率统计基础——$200B CapEx周期在商业史上没有先例(样本量为零)"
    - "LLM数学计算基于模式匹配非精确运算——敏感性矩阵/概率加权EV应独立Excel验证"
