# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "AMZN在$201是效率定价——$200B CapEx的增量ROIC是唯一决定低估或高估的变量, 市场已合理定价双向不确定性"
  rating: "中性关注(条件性)"
  fair_value: "$219.6/sh (概率加权EV $2,355.5B)"
  expected_return: "+9.1%"

  key_arguments:
    - claim: "$200B CapEx是科技史上最大资本重置赌注, P/E 28x在D&A追赶前具有欺骗性"
      direction: bearish
      magnitude: 5
      mechanism: "FY2025 CapEx $131.8B→FY2026指引$200B→CapEx/D&A=2.0x→FY2027-28增量D&A $30-40B可能使Net Income下降40-50%→P/E从28x推至40-50x"
      kill_switch: "增量ROIC>15%且CapEx在FY2027-28回落至$120-140B"

    - claim: "FCF已从$32.9B崩塌至$7.7B(-76%), FCF Yield 0.34%为科技巨头最低"
      direction: bearish
      magnitude: 5
      mechanism: "CapEx/OCF从62%升至94.5%→FY2026概率加权FCF约-$50B→FCF真空期12-18个月→估值完全依赖信仰而非现金流"
      kill_switch: "FY2027 FCF回升至$40B+(CapEx回归+OCF增速>CapEx增速)"

    - claim: "AWS仍是全球最大云平台, RPO $244B(+40% YoY)提供2-3年收入可见性"
      direction: bullish
      magnitude: 4
      mechanism: "AWS Q4 $35.6B(+24% YoY)→年化$142B→RPO $244B锁定未来收入→自研芯片Graviton/Trainium $10B+三位数增长"
      kill_switch: "Azure在AI工作负载份额绝对反超AWS, 或AWS份额跌破25%"

    - claim: "广告业务$85B年化是被低估的利润引擎, OPM推断>50%"
      direction: bullish
      magnitude: 3
      mechanism: "广告高margin利润补贴零售薄利→SOTP中广告独立估值$565B(占27%)→零售扣除广告后实际亏损$6B"
      kill_switch: "广告OPM实际仅40%(D级数据质量, Amazon不披露)→独立估值下调$130B"

    - claim: "FTC分拆悖论——分拆反而可能释放股东价值"
      direction: conditional
      magnitude: 3
      mechanism: "AWS独立$1,472B + 广告独立$630B + 零售独立$350B = $2,452B > 当前EV $2,225B→分拆是正面事件"
      kill_switch: "FTC要求行为补救而非结构分拆→最恐怖情景不发生, 但慢性监管摩擦持续"

  moat:
    composite_score: 8.0
    half_life: ">10年(AWS迁移成本) | >15年(物流规模) | <5年(监管维度恶化中)"
    dimensions:
      - type: switching_cost
        strength: 5
        evidence: "AWS企业迁移成本$5-20M, 耗时12-24月, 数百种API/S3/IAM深度嵌入; 零售端Prime会员200M+用户生态锁定"
        vulnerability: "多云战略(Terraform/K8s)降低AWS锁定; Prime价格上涨弹性未知"
      - type: scale
        strength: 5
        evidence: "FY2025 Revenue $716.9B; AWS年化$142B; 物流网络覆盖全球; 低WACC(AA信用评级)→资本成本优势"
        vulnerability: "规模不等于效率——OPM 11.2%远低于MSFT 45.6%, 零售拖累整体利润率"
      - type: network_effect
        strength: 4
        evidence: "3P卖家→更多选择→更多买家→更多卖家飞轮运转近30年; 数据飞轮(AI时代放大)"
        vulnerability: "Temu/Shein用极致低价形成另一种飞轮; 价格网络效应可能被低价平台分流"
      - type: data
        strength: 4
        evidence: "AWS上PB级客户数据形成数据引力; 零售+广告交叉数据训练Rufus等AI工具"
        vulnerability: "数据隐私法规(GDPR/DMA)可能限制跨业务数据使用"
      - type: regulatory
        strength: 2
        evidence: "FTC反垄断诉讼(Oct 2026)可能限制FBA捆绑+价格匹配惩罚; AI监管不确定"
        vulnerability: "监管维度趋势恶化——从保护变为威胁, 合规成本上升"

  valuation:
    reverse_dcf_implied: "从实际FCF $7.7B出发需41% CAGR(不可能); 从正常化FCF $35B出发需20% CAGR(可辩护但乐观); 市场定价完全取决于'$200B CapEx是暂时性投资周期'这一单一信念"
    methods_used: ["Reverse DCF", "SOTP", "条件估值(四档情景)", "DCF双锚"]
    dispersion: "方法级1.22x($185-$225), 端点级3.78x($103-$389)"
    consensus_vs_ours: "共识Strong Buy目标$287 | 我们概率加权$219.6(+9.1%)中性关注 | 共识用P/E规避FCF近零事实, 概率加权后应下调~16%至$241"
    entry_zone: "$170以下(S3/S4情景, 需承重墙倒塌)"
    catalyst: "2027年2月FY2026全年财报+FY2027 CapEx指引——同时验证CapEx ROIC/AWS份额/FCF趋势"

  action_framework:
    verdict: "等待——效率定价, 非alpha机会; 决策优势仅来自对CapEx ROIC的独立判断"
    buy_triggers:
      - trigger: "增量ROIC>15%初步验证 + AWS份额企稳≥28% + OPM>13%"
        price_zone: "$200-$220 (当前区间, 但需3/4条件同时满足)"
        reasoning: "概率加权EV上移至$2,500-$2,700B, 期望回报跃升至+16%~+25%, 评级升格至关注"
      - trigger: "AI泡沫恐慌导致股价跌至$150以下(S3偏下)"
        price_zone: "$140-$160"
        reasoning: "非AI资产(零售+广告+存量AWS)提供$1,200-$1,500B底部支撑→$112-$140/sh, 安全边际充分"
    hold_conditions:
      - "AWS收入增速>20%且Azure增速差<15pp"
      - "CapEx/Revenue季度趋势不升破25%"
      - "合并OPM维持>10%(D&A未吞噬效率改善)"
      - "FTC未发出结构性分拆命令"
    sell_triggers:
      - signal: "FY2027 CapEx指引>$180B且FY2026 ROIC<10%"
