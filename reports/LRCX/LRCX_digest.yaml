# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "安装基数飞轮: Systems→CSBG→锁定→Systems"
    chain: >
      Systems业务以技术领先(Cryo Etch/Akara/ALTUS)赢得新设备订单
      → 每台新设备加入100K+腔室安装基数
      → CSBG在设备15-20年生命周期内持续产生备件+服务收入($72K/腔室/年)
      → 服务合同绑定原厂配件(第三方替代有良率风险)
      → CSBG增速(+16%)>安装基数增速(~5-7%)→ARPU持续扩张
      → 经常性收入降低整体周期性→支撑更高估值倍数
      → 更高估值→更强研发投入→维持技术领先→继续赢得新设备订单
    transferable_to: "所有'设备+服务'飞轮模型: 电梯(OTIS)、喷气引擎(GE Aerospace)、医疗设备(ISRG)"
    reasoning_habit: "看到设备公司时追问'安装基数货币化深度在增加还是停滞'——ARPU扩张>安装基数增速=飞轮加速;反之=飞轮减速"

  - id: "CC-2"
    name: "零安全边际的识别: 信念全数→单点即崩"
    chain: >
      观察: P/E 49.3x(历史极端) → 追问: 这个价格在赌什么?
      → Reverse DCF反推: 需要6个信念(WFE 8-10% CAGR+份额扩张+OPM 34-35%+CSBG 12-15%+FCF 28-30%+连续5年无下行)全部成立
      → 检验信念相关性: B1(WFE)+B6(不下行)高度相关→双杀概率40-50%
      → 历史检验B6: WFE 40年从未连续5年无>10%下行→B6是统计级反证
      → 结论: 安全边际=0,单一信念失败(B6)即触发-42%下行
      → 投资含义: 即使对公司完全看多,在P/E 49.3x入场期望值仍为负
    transferable_to: "所有P/E>30x的周期性公司(半导体/大宗/航运)"
    reasoning_habit: "高P/E时不问'公司好不好'而问'价格在赌几个信念同时成立'——信念数越多,零安全边际概率越高"

  - id: "CC-3"
    name: "温水煮青蛙: 渐进恶化为何比急跌更危险"
    chain: >
      起点: P/E 49.3x + WFE晚期扩张(P2.7)
      → T+6M: WFE增速放缓→P/E降至40-42x→股价跌3-8%(没有人发警报)
      → T+12M: WFE指引flat→P/E降至30-35x→跌幅17-27%(分析师下调但仍维持Buy)
      → T+24M: WFE确认下行→P/E降至22-28x→跌幅29-46%(共识转Hold但大部分下跌已完成)
      → 关键: 没有单一事件触发止损→每步都'可以忍受'→累积致命
      → 对比急跌: 急跌(如COVID)反而触发止损+V型恢复;温水煮青蛙没有V型
    transferable_to: "所有P/E>30x面临均值回归的周期股: SaaS成长股从40x→20x, 半导体设备从50x→25x"
    reasoning_habit: "对高估值周期股,建立6个时间节点×4维度的渐进恶化路径表——如果每步跌幅都不触发止损,那就是温水煮青蛙"

  - id: "CC-4"
    name: "AI溢价分解: 叙事驱动vs实质驱动"
    chain: >
      LRCX $302B市值中$189B(63%)是AI溢价(vs非AI基线~$113B)
      → 追问: AI溢价中多少有硬数据支撑?
      → 分解: 80%叙事驱动(AI CapEx→先进制程→刻蚀增长的传导逻辑) + 20%实质驱动(已确认的ALD/GAA订单)
      → LRCX在AI不可替代性评分3/5(二阶受益者: Hyperscaler→fab→设备)
      → AI溢价的叙事依赖度越高→叙事裂缝时估值冲击越大
      → 类比: 如果AI CapEx增速从+40%降至+15%(非下降,仅放缓)→叙事受损→$189B AI溢价可能缩水30-50%
    transferable_to: "所有AI受益者的溢价分解: GPU(NVDA直接)vs 半导体设备(LRCX/AMAT二阶)vs 基础设施(VRT/EATON三阶)"
    reasoning_habit: "对AI溢价追问'多少是叙事驱动'——叙事占比>50%时,估值对AI CapEx增速(非绝对值)的边际变化高度敏感"

  - id: "CC-5"
    name: "刻蚀alpha不对称的发现过程"
    chain: >
      假设: LRCX在WFE上行时跑赢(alpha>1)→是否在下行时也跑赢?
      → 数据: 上行alpha 1.20-1.35x(AI+3D NAND内容增长驱动)
      → 追问下行: NAND是WFE下行中削减最深的领域→LRCX NAND暴露度>50%
      → 发现: 下行alpha仅0.5-0.8x(NAND拖累>逻辑支撑)
      → 推论: LRCX不是'无论环境都跑赢',而是'上行超线性/下行超线性衰减'
      → 投资含义: 不能用上行alpha外推下行保护→在WFE顶部买LRCX=买一个下行杠杆
    transferable_to: "所有在细分领域有差异化暴露的设备/周期股"
    reasoning_habit: "看到上行alpha时立刻追问下行alpha——不对称性比平均值更重要"

