    - "P5双模型(-11.3% vs -29.5%)差距过大→概率分配的主观性是最终评级的最大不确定性源"
    - "看空确认偏误残余2.1:1→期望回报可能偏悲观10-15pp→实际评级可能在'审慎'与'中性'边界"
    - "AI CapEx CY2027增速不可预测→$189B AI溢价的估值敏感度极高但无法量化精确概率"
    - "TEL Certas商业化时间表不确定→NAND通道刻蚀护城河的半衰期可能是5年也可能是15年"
