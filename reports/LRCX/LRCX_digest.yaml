      trigger: "P/E>历史均值2x"
      origin: "LRCX P/E 49.3x需6个信念全部成立→任一失败即翻转→零安全边际"
      generalization: "高估值的风险不是公司变差,而是价格要求的信念数太多——信念数>4且高度相关=零安全边际"

    - habit: "建立温水煮青蛙时间节点表"
      trigger: "周期性公司P/E>30x + 周期位置偏晚期"
      origin: "LRCX T+6M(-3~8%)→T+12M(-17~27%)→T+24M(-29~46%)的渐进路径量化"
      generalization: "急跌触发止损→可控;渐进跌不触发止损→致命。量化每个时间节点的跌幅,如果没有一步触发止损=温水煮青蛙"

    - habit: "追问上行alpha时立刻追问下行alpha"
      trigger: "发现公司在行业上行时跑赢"
      origin: "LRCX上行alpha 1.2-1.35x但下行仅0.5-0.8x→NAND暴露度驱动不对称"
      generalization: "上行alpha和下行alpha可以完全不对称——在细分暴露度不同的周期股中尤其如此"

    - habit: "对经常性收入追问地缘政治中断场景"
      trigger: "公司在地缘敏感地区(中国/俄罗斯)有>15%经常性收入"
      origin: "CSBG中国服务中断路径——出口管制可扩展至服务合同"
      generalization: "经常性收入的'经常性'假设需包含政策情景——服务合同不是物理锁定,可被法规终止"

  quality_feedback:
    strengths:
      - "温水煮青蛙24月路径获excellence_catalog冠军(5.0/5.0) — 情景分析的标杆方法"
      - "DM密度2.04/千字+766个锚点 — 数据锚定扎实(A/B级覆盖92%)"
      - "10个框架体系(F1-F10)完整覆盖全分析维度 — v17.0全套方法最完整应用"
      - "Mermaid 44张 — 可视化分析覆盖全章节"
      - "能力边界标注(深挖区/诚实区)5/5 — 最佳实践"
    weaknesses:
      - "P5双模型冲突: P5_A(-11.3%)和P5_C(-29.5%)独立建模→43处修复 — 根因: Agent间无数值锚定协议"
      - "Phase 1未压缩: 70K中~30K是已有6份报告覆盖的半导体通识 — 未利用知识库引用机制"
      - "CSBG估值未调和: 三方法给出$30-126B的3x跨度未真正收敛 — 缺少客户调研法自下而上验证"
      - "看空偏误残余: P4校准后仍2.1:1偏空 — 期望回报逐Phase恶化(-9→-11→-29.5%)"

  hypothesis_tested:
    confirmed:
      - hypothesis: "Reverse DCF必须P1前置(铁律O)"
        evidence: "Ch9 Reverse DCF有效识别了6信念零安全边际,防止了P1结论先行偏差"
        confidence_after: "高(KLAC+LRCX双报告确认)"

      - hypothesis: "温水煮青蛙比急跌更危险(CME犯错模式4)"
        evidence: "LRCX量化路径表证明每步跌幅不触发止损但累积-29%至-46%"
        confidence_after: "高(从CME利息正常化扩展到半导体设备P/E压缩)"

    extended:
      - hypothesis: "安装基数护城河可以是'进攻型'而非仅'防守型'(KLAC insights)"
        extension: "LRCX CSBG增速>基数增速→ARPU扩张→从'备件替换'升级为'服务+升级+智能制造'→安装基数货币化深度持续增加"

      - hypothesis: "AI溢价分解适用于一阶受益者(NVDA)"
        extension: "扩展到二阶受益者(LRCX)→发现AI溢价63%/叙事80%→二阶受益者的叙事依赖度>一阶"

    refuted:
      - hypothesis: "LRCX在WFE下行中也能跑赢(因为刻蚀内容增长)"
        evidence: "下行alpha仅0.5-0.8x(NAND暴露度驱动)→上行/下行完全不对称"
        lesson: "不能用上行表现推导下行保护——需分别检验上行和下行alpha"

  limitations:
