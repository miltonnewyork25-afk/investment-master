# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→$129隐含15-19% CAGR, 市场定价减速(低于当前28%)→SBC调整后隐含53% FCF CAGR(极激进)"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "7个RT红队(真实PE/增速减速/Grafana终局/$47B合理性/治理/云优化2.0/概率重赋权)→红队EV $103-107→高估17-20%"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "10大风险协同矩阵+温水煮青蛙情景: R1(SBC)+R3(Grafana)+R4(OTel)+R8(云优化)同方向缓慢恶化→5年累积估值崩塌"

  novel_patterns:
    - name: "SBC薛定谔估值(口径驱动的极端离散)"
      description: "同一家公司在Non-GAAP口径(49x PE=合理)和Owner口径(188x PE=极贵)下得出完全相反的结论→离散度2.73x→估值结论100%取决于SBC哲学选择而非模型参数"
      transferable_to: ["所有SBC/Rev>15%的高增长SaaS", "任何非现金成本争议大的公司"]

    - name: "护城河租赁模型(C3×C7悖论)"
      description: "最强壁垒(C3生态锁定=4.5)和最弱壁垒(C7自维持性=2.0)是同一枚硬币两面→护城河是租来的不是买来的→每年需$1B R&D租金→估值中不应给永续假设"
      transferable_to: ["所有R&D/Rev>30%的创新驱动型科技公司", "NVDA/ADBE/CRM等需持续创新维持领先的公司"]

    - name: "产品网格锁定(多产品乘法效应)"
      description: "SaaS多产品锁定的迁移成本不是各产品之和(加法)而是产品间关联的乘积→10+产品客户的迁移成本是天文数字→但OTel标准化正在将'乘法锁定'拆解回'加法锁定'"
      transferable_to: ["所有多产品SaaS平台(CRM/INTU/ADBE/NOW)"]

    - name: "客户层金字塔(锁定/定价权的分层评估)"
      description: "DDOG的锁定是金字塔型: F500(9/10)→中型(6/10)→SMB(3/10); 定价权同样分层: Stage 3.5/2.5/2.0→加权后揭示'整体7分实际隐含底部漏洞'"
      transferable_to: ["所有客户结构分层明显的SaaS/B2B公司"]

    - name: "双层股权的SBC稀释免疫"
      description: "创始人持B类股(10x投票权)→SBC稀释不影响控制权→对SBC不敏感→A类股东每年被征收4.6%'SBC税'且无投票纠错机制"
      transferable_to: ["所有双层股权+高SBC的科技公司(GOOG/META/SNAP/PLTR)"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "护城河'租赁vs所有'分类——C3(锁定强度)×C7(自维持性)的交叉揭示护城河是否需要持续投入"
        implication: "护城河评估应同时测量深度(C3)和维持成本(C7)——深度高但维持成本>FCF=租赁型→估值窗口有限"
      - insight: "客户层分层评估B2/B4——统一评分掩盖金字塔结构(顶部极强+底部极弱)"
        implication: "B2/B4评分应按客户层加权(F500/中型/SMB)→分层后可能发现'7分的统一评分隐含3分的底部漏洞'"

    valuation_insights:
      - insight: "SBC口径选择比任何模型参数更决定估值结论——Non-GAAP vs Owner的离散度(2.73x)远超WACC/增速敏感性"
        implication: "对SBC/Rev>15%的SaaS公司, 估值报告应强制披露Non-GAAP和Owner口径的双重结果+诚实性声明"
      - insight: "方法独立性审计——5种方法中真独立只有~3.5种(DCF/RevDCF/PEG共享WACC/增速)"
        implication: "估值多样性不等于可信度——应量化方法间相关性矩阵, 披露'如果核心假设错误, 几种方法同时瓦解'"

    screening_insights:
      - insight: "Owner P/FCF vs Non-GAAP PE差距>3x = 'SBC风险被忽视'的筛选信号"
        implication: "选股筛选增加'SBC脆弱性过滤器': Owner P/FCF ÷ Non-GAAP PE > 3x → 标记为SBC风险未定价"
      - insight: "CQI 46 + PE 49x = 护城河溢价+24%(市场定价超出护城河支撑)"
        implication: "CQI/PE比值<1→市场给予的估值超出护城河可支撑的水平→需要增速或创新来填补差距"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "Non-GAAP利润时立刻计算Owner Economics"
      trigger: "SaaS公司SBC/Rev>15% 且 市场主要用Non-GAAP定价"
      origin: "DDOG Non-GAAP OPM 22% vs GAAP OPM -1.3% — 差距23pp全部来自SBC→Non-GAAP美化了23pp盈利能力"
      generalization: "SBC是真实成本→Owner FCF = GAAP FCF - SBC×(1-税率)→如果Owner P/FCF > 100x需要极强信心才能买入"

    - habit: "追问护城河的维持成本(C7)而非只看深度(C3)"
      trigger: "科技公司护城河看起来很深(高转换成本/多产品/大生态)"
      origin: "DDOG C3=4.5(最强)但C7=2.0(最弱)→护城河深度≠护城河持久性→每年~$1B租金"
      generalization: "护城河=深度×持久性。持久性低的深护城河是'租赁型'→不应给永续估值假设"

    - habit: "对usage-based SaaS用历史最大回撤做压力测试"
      trigger: "usage-based SaaS展示强增速+上行弹性时"
      origin: "DDOG FY2022→FY2023: 增速从63%→27%, 股价-55%→同一计费模式放大了两个方向"
      generalization: "usage-based的正凸性(AI爆发)和负凸性(优化周期)是对称的→投资决策应对称考虑"

    - habit: "双层股权公司追问'创始人对SBC稀释的敏感度'"
      trigger: "创始人高持股被引用为alignment证据"
      origin: "Pomel持B类股→投票权不被稀释→对SBC不敏感→SBC/Rev 22%持续5年无外部纠错机制"
      generalization: "创始人alignment需要区分'方向对齐'和'路径对齐'——B类股免疫稀释=路径不对齐"

  quality_feedback:
    strengths:
      - "SBC多层审查(5层解构)创造了报告最有区分度的洞见——Owner P/FCF 188x vs Non-GAAP PE 49x的对比让投资者无法忽视SBC"
      - "护城河C3×C7悖论('宽但浅, 贵且有时限')是原创框架贡献——可迁移到所有创新驱动型科技公司"
      - "估值离散度2.73x的根因诊断(SBC口径单一变量驱动)比简单报告数字更有价值——诚实性声明提升可信度"
      - "飞轮悖论检测正确识别DDOG与CRM的根本差异(usage-based vs per-seat)→避免了错误类比"
      - "DM密度1.35/千字(462个锚点)→数据锚定扎实"
    weaknesses:
      - "AI可观测性TAM的净新增vs替代问题仅定性处理(-5~10%对冲)→缺少行业级数据支撑"
      - "Grafana的企业级渗透速度预测依赖FedRAMP类比→缺少直接渠道数据(Grafana未上市无法验证)"
      - "CQI 46的具体因子构成未在Complete中呈现完整评分表(部分因子评分'待确认')"

  hypothesis_tested:
    confirmed:
      - hypothesis: "SBC是SaaS估值的关键隐藏变量(跨报告一致性)"
        evidence: "DDOG Owner P/FCF 188x vs Non-GAAP PE 49x; CRM 15年SBC收敛先例; 离散度100%由SBC口径驱动"
        confidence_after: "高(DDOG是最极端案例: 离散度3.8x, 5年零收敛)"

      - hypothesis: "Reverse DCF必须P1前置(CRM v2.0铁律O)"
        evidence: "Ch1 Reverse DCF有效防止了结论先行——如果没有先反推'市场在赌什么', P1可能直接写'DDOG被低估'"
        confidence_after: "高(DDOG Reverse DCF揭示市场定价'温和赌注'而非极端乐观→约束了全报告叙事)"

    extended:
      - hypothesis: "护城河租赁模型(CME双半衰期框架)"
        extension: "CME有'多引擎不同持久性'→DDOG是另一种变体: '深度高但维持成本>FCF=租赁型'→从半衰期概念扩展到维持成本概念"

      - hypothesis: "飞轮悖论检测(CRM v2.0)"
        extension: "CRM飞轮悖论(Agent替代seat)→DDOG验证了'反悖论': usage-based计费模式天然免疫AI蚕食→飞轮悖论的适用条件需加入'计费单元是否与人类活动挂钩'"

    refuted:
      - hypothesis: "Non-GAAP PE对高增长SaaS是合理估值指标"
        evidence: "DDOG Non-GAAP PE 49x(看似合理) vs Owner P/FCF 188x(极贵)→SBC/Rev>20%时Non-GAAP系统性误导"
        lesson: "SBC/Rev<12%时Non-GAAP是合理近似; SBC/Rev>15%时必须计算Owner Economics"

  limitations:
    - "SBC收敛时间表高度不确定: CRM用15年, NOW用6年, DDOG可能8-10年→这个变量决定'何时可买'但无法预测"
    - "AI可观测性TAM处于极早期(<$1B), 渗透率1-3%→5年后的TAM规模($3-12B的范围)不确定性极大"
    - "Grafana未上市→ARR/增速依赖第三方估算和融资轮披露→竞争分析数据质量低于上市公司对标"
    - "WACC 10%假设在利率环境变化中可能不稳定→敏感性分析显示WACC每变100bp影响公允价值$15-25/share"
    - "红队Bear权重40%→主观成分较大(基于历史IT周期频率类比, 非精确概率)"
