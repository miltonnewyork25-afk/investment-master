      transferable: "所有usage-based计费模式的SaaS公司"
    - scenario: "护城河趋势T从0.95降至0.92但仍>0.90时忽视"
      lesson: "护城河侵蚀是温水煮青蛙——OTel/Grafana/CloudWatch三个'温和'信号同方向叠加=实际侵蚀速度>任一单独信号暗示的"
      transferable: "所有面临开源+标准化双重压力的商业软件(MongoDB vs PostgreSQL, Elastic vs OpenSearch)"

# --- Layer 2.5: 信号分级 (v1.2新增) ---
signal_hierarchy:
  alpha_signals:
    - signal: "SBC/Revenue季度趋势+SBC绝对增速 vs Revenue增速差值"
      why_alpha: "SBC收敛是区分'合理估值'与'严重高估'的单一最重要变量。大多数分析师用Non-GAAP忽略SBC, 跟踪SBC增速差值可提前1-2季度捕捉收敛拐点"
      current_reading: "SBC增速仍略高于Revenue增速→收敛信号尚未出现(FY2025)"
    - signal: "NRR推断值(间接法: 收入增速-新客贡献)"
      why_alpha: "NRR是增长引擎质量的核心指标→NRR<110%=增长从'自维持'变为'依赖新客'→估值逻辑根本改变"
      current_reading: "~120%(71%增长来自存量扩展→自维持引擎健康)"
    - signal: "Owner P/FCF vs Non-GAAP PE的差距"
      why_alpha: "差距越大=SBC风险越被市场忽视→当差距>3x时(当前188x vs 49x=3.8x), 市场对SBC correction的脆弱性最高"
      current_reading: "3.8x差距(极端)→一旦市场开始用Owner视角定价, 回调幅度巨大"

  confirmation_signals:
    - signal: "季度收入增速(YoY)"
      bullish_threshold: ">25% YoY(beat管理层指引+5pp)"
      bearish_threshold: "<18%(match或miss指引→减速确认)"
    - signal: "AI客户占比($100K+ ARR中使用AI产品的比例)"
      bullish_threshold: ">20%(AI TAM进入早期多数)"
      bearish_threshold: "<15%(AI采纳停滞→TAM叙事弱化)"
    - signal: "RPO增速 vs 收入增速的比值"
      bullish_threshold: "RPO增速/收入增速>1.5x(收入管道加速充裕)"
      bearish_threshold: "<1.0x(管道枯竭→未来增速承压)"

  noise_signals:
    - signal: "单季度Non-GAAP OPM波动"
      why_noise: "Non-GAAP加回SBC→OPM 22%是美化数字, 任何改善可能只是会计时间差而非真实运营杠杆"
    - signal: "S&P 500纳入带来的股价上涨"
      why_noise: "被动资金流入提供短期支撑但不改变基本面→长期估值由FCF/增速决定"
    - signal: "单季度客户数增长波动"
      why_noise: "客户数增速~8%是稳态→重要的是NRR(存量质量)而非新客数量"

