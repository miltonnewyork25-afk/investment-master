      monitor: "KS-17: SBC绝对增速 vs Revenue增速差值——连续2季SBC增速<Revenue增速=收敛启动最早信号"

    - area: "AI可观测性TAM是净新增还是替代"
      why_matters: "如果70%替代而非新增→AI TAM从$8-12B缩至$3-5B→DDOG增速叙事被削弱"
      monitor: "AI原生客户占比(当前12%→阈值25%); LLM Obs活跃客户数(当前1000→阈值5000)"

    - area: "Grafana何时完成首个F500完整替换"
      why_matters: "零F500替换案例=DDOG企业护城河完整的关键证据; 首个案例出现=护城河叙事拐点"
      monitor: "Grafana公开客户案例+FedRAMP后政府合同+大企业参考客户"

  # ★ v1.2新增: 卖出时机教训 ★
