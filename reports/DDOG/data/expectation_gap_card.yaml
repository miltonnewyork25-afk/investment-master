# === R域: 企业现实 ===
reality:
  overall_trend: "mixed — 收入加速但利润率恶化，形成剪刀差"
  trend_confidence: "high"
  structural_vs_cyclical: "mixed — 云可观测性需求是结构性的，但当前增速部分由AI客户周期驱动"

  key_variables:
    - name: "收入增速"
      state: "accelerating"
      data: "Q1'25 +24.6% → Q2 +28.1% → Q3 +28.3% → Q4 +29.2% (季度环比加速)"
      source: "10-K/FMP quarterly income"
      evidence_grade: "fact"

    - name: "GAAP OPM"
      state: "deteriorating"
      data: "FY22 -3.5% → FY23 -1.6% → FY24 +2.0% → FY25 -1.3% (刚转正又转负)"
      source: "10-K"
      evidence_grade: "fact"

    - name: "FCF增速与FCF margin"
      state: "decelerating"
      data: "FCF: FY23 $632M(+79%) → FY24 $836M(+32%) → FY25 $1.00B(+20%) | FCF margin: 29.7% → 31.1% → 29.2%(略收缩)"
      source: "10-K cash flow"
      evidence_grade: "fact"

    - name: "SBC负担"
      state: "stable"
      data: "SBC~$750M = ~22%/Rev (基本未改善) | Owner earnings = NI $108M - SBC $750M = -$642M | OCF/SBC仅1.40x(NOW是2.78x) | 零回购,100%净稀释"
      source: "10-K + baggers_summary"
      evidence_grade: "fact"

    - name: "ROIC"
      state: "deteriorating"
      data: "ROIC TTM -8.33% (负值! 因GAAP营业利润为负)"
      source: "FMP key-metrics"
      evidence_grade: "fact"

  quality_signals:
    revenue_driver: "用量驱动(usage-based) — 客户越用越多,但也意味着缩减时收入立即下降"
    customer_concentration_risk: "high — AI相关大客户集中度高(管理层承认,市场已注意)"
    cash_flow_match: "OCF/NI = 9.75x — 极高,意味着GAAP NI几乎被SBC完全吞噬,FCF高度依赖'加回SBC'这一会计处理"
    sbc_burden: "SBC/Rev ~22%且无改善趋势 | 零回购 | 3年股份增长14.5% | 这是DDOG与NOW最大区别——NOW的SBC/Rev在下降且有回购覆盖94%"
    organic_vs_acquired: "以有机增长为主,收购规模小($118M FY2025)"

  most_telling_facts:
    - fact: "收入增速在加速(Q4 +29%)但GAAP OPM在恶化(-1.3%)且FCF margin在收缩(29.2%)"
      why_telling: "这意味着DDOG在'买增长'——每多赚1美元收入需要投入更多的研发和销售费用。研发/毛利比高达56.5%,是NOW(28.7%)的近2倍。增长质量在下降"
    - fact: "FY2026指引$4.06-4.10B暗示增速从28%骤降至18-20%,管理层自己在管理预期"
      why_telling: "管理层主动引导增速预期下降,可能是诚实的(真的会减速),也可能是保守指引然后beat(SaaS公司的老套路)。关键是分辨哪种情况"

# === G域: 剪刀差 ===
gap:
  variable_comparison:
    - factor: "增长速度"
      expectation: "市场隐含18-20% FCF CAGR(与FY26指引一致)"
      reality: "FY25收入增速28%且加速中,但管理层指引18-20%=管理层自己确认减速"
      gap_direction: "aligned"
      gap_size: "small — 市场定价与指引一致,除非认为指引保守(SaaS公司常见)"

    - factor: "盈利质量"
      expectation: "P/FCF 44x隐含市场信任FCF作为真实盈利"
      reality: "GAAP OPM为负(-1.3%),SBC $750M远超NI $108M,Owner earnings深度负值,ROIC负值"
      gap_direction: "E>R"
      gap_size: "large — 市场定价了'高质量增长',但利润率和资本回报数据讲的是另一个故事"

    - factor: "估值水位"
      expectation: "P/FCF 44x,EV/Sales 13.7x,FMP DCF $19.55"
      reality: "对一个ROIC为负、OPM为负、FCF增速减速至20%的公司而言,P/FCF 44x需要持续20%增长10年+才能回本"
      gap_direction: "E>R"
      gap_size: "medium — 估值已从高位大幅下调(-38%),但绝对水平仍然要求完美执行"

  scoring:
    direction_clarity: 3       # 收入加速vs利润恶化=方向混杂,不如NOW清晰
    magnitude: 3               # P/FCF 44x对20% FCF grower不算极端高估,但也不便宜
    persistence: 3             # 如果SBC持续22%+且OPM不转正,问题会持续
    verifiability: 4           # Q1'26财报可验证增速是否真的减速至指引水平
    composite_score: 3.25      # <3.5 = 证据尚不足以做强判断

  core_mispriced_variables:
    - variable: "盈利质量(SBC vs FCF的本质矛盾)"
      market_assumes: "FCF $1.0B = 真实盈利能力,SBC是'非现金费用'可忽略"
      reality_shows: "SBC $750M远超NI $108M → 公司的'利润'几乎全部以股权稀释形式付给了员工。3年股份增长14.5%,零回购。Owner PE为深度负值"
      why_market_wrong: "市场用P/FCF(44x)定价,但如果用P/Owner-Earnings定价,DDOG的估值接近无穷大。这不是'谁对谁错'的问题——而是'你如何定义盈利'的问题。但14.5%的股份稀释是真实的价值转移,投资者的持股比例每年缩减~4%"
      evidence_grade: "fact (财务数据) + inference (估值框架选择)"
      valuation_sensitivity: "如果市场开始对SaaS公司的SBC进行更严格的估值调整(类似2022年),DDOG的估值可能需要进一步压缩30-50%"

    - variable: "收入增速转折点(指引保守 vs 真实减速)"
      market_assumes: "18-20%增速(按指引定价)"
      reality_shows: "FY25收入增速28%且加速中——管理层指引可能保守(SaaS公司beat&raise常规操作)"
      why_market_wrong: "如果DDOG持续以25%+增速增长(而非18-20%),当前P/FCF 44x就合理了。但这是'推断'而非'事实'——赌指引保守的风险是如果指引是真的就没有安全边际"
      evidence_grade: "inference"
      valuation_sensitivity: "25%增速 vs 18%增速,5年后收入差异40%,估值影响巨大"

    - variable: "AI客户集中度"
      market_assumes: "AI相关收入有集中度风险但仍在增长"
      reality_shows: "管理层承认,Truist因此下调评级,但具体数据不公开"
      why_market_wrong: "无法确定市场是否错了——这是真正的信息不对称区域"
      evidence_grade: "assumption"
      valuation_sensitivity: "如果单一大客户贡献>10%收入且该客户削减支出,可能造成季度miss"

  one_sentence_judgment: "DDOG的预期差不在增速(市场定价已与指引一致),而在盈利质量——市场用P/FCF 44x定价一个GAAP亏损、SBC/Rev 22%、ROIC为负、零回购的公司,隐含着'SBC不算成本'的激进假设。如果这个假设被挑战(如2022年SaaS de-rating重演),当前价格仍有30-50%下行空间"

