# === 核心判断 ===
core_judgment: "市场定价大致合理——Reverse DCF隐含18-20% FCF CAGR，与管理层FY2026指引吻合。但DDOG暴露了一个关键模板问题：收入增速28%加速中，GAAP OPM却在恶化(-1.3%)，SBC占收入22%使Owner PE为深度负值——'高增长'表象下藏着'不赚钱'的现实，P/FCF 44x对一个ROIC为负的公司定价偏贵"
gap_type: "overpriced_optimism"
confidence: "medium"
confidence_reasoning: "收入加速是事实(高置信)，但GAAP OPM恶化+SBC极高也是事实(高置信)。偏差判断为medium是因为FCF仍健康($1B)，只是FCF的'质量'取决于你是否把SBC当成本——这是SaaS估值中最有争议的会计问题"

