    judgment_reasoning: "Reverse DCF隐含增速与管理层FY2026指引(18-20%)大致吻合，但前提是市场接受'FCF=真实盈利'这一假设。如果按Owner Earnings(NI-SBC=-$642M)衡量，当前价格无法被任何合理DCF justfy"

