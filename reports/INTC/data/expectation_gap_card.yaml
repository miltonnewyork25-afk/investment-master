  pattern_description: "不是'按旧规则给新世界定价'——而是'按新世界的期望给旧世界的公司定价'。市场看到18A HVM+CHIPS Act+CPU复兴叙事,就按'Intel将成为新世界的赢家'定价,但Intel目前的财务现实($220B市值/FCF -$4.9B)完全是旧世界的数字"
  pattern_confidence: "medium"

  impact_on_gap_judgment: "范式转移视角增加了复杂性而非清晰度: (1)CPU→GPU→ASIC转移不利于Intel核心CPU业务(负面) (2)但ASIC多元化可能创造代工需求(正面) (3)CPU复兴叙事可能真实但Intel不等于CPU(AMD也受益) (4)制造回流是真趋势但速度远慢于市场定价。净效果: 范式转移对INTC是双刃剑,市场可能只看到了正面而忽视了负面"

