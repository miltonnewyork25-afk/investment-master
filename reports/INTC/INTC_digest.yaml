# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "Intel是一个被$175.8B标价的$60-100B商业实体, 差额是尚未兑现的IFS期权+地缘溢价+散户情绪——三者中只有地缘溢价有锚, 其余可能蒸发"
  rating: "审慎关注(条件评级, PW=8发现系统)"
  fair_value: "概率加权~$13/股; 收敛区$14-30/股; 当前$46仅在8%最乐观情景上沿才合理"
  expected_return: "-72%(概率加权 vs $46.12)"

  key_arguments:
    - claim: "Products盈利 vs IFS烧钱的割裂——市场用一个价格给两个完全不同的实体定价"
      direction: bearish
      magnitude: 5
      mechanism: "Intel Products $49.1B收入/$12.7B营业利润(25.8%) 但IFS年亏$10.3B + $5.5B公司费用 → 合并后变亏损实体"
      kill_switch: "IFS FY2028外部收入>$3B或宣布全面拆分 → 分部定价清晰化"

    - claim: "五面承重墙联合概率仅2-3%——$46隐含的信念组合几乎不可能同时成立"
      direction: bearish
      magnitude: 5
      mechanism: "Reverse DCF隐含$15-18B稳态FCF需五墙全立(收入+利润率+IFS+FCF+稀释) → W3(IFS 13%)是钥匙墙 → W3倒塌→W2→W4连锁"
      kill_switch: "IFS盈亏平衡(W3成功) → 条件概率使联合概率跳升至5-8%"

    - claim: "护城河从技术壁垒(30%)迁移到制度壁垒(70%)——Intel的价值不在于能做什么, 而在于不能被允许消失"
      direction: conditional
      magnitude: 4
      mechanism: "A-Score 4.74/10, 12维中9维下降 → 三座残存堡垒(输入自主权/切换成本/合规门槛)全是制度性壁垒 → CHIPS Act+Secure Enclave锚定"
      kill_switch: "美中关系根本性缓和 + TSMC Arizona完全替代Intel的美国先进制程角色 + CHIPS Act被削减"

    - claim: "僵尸轨道(IBM式缓慢衰减)是最可能路径, 概率~55%"
      direction: bearish
      magnitude: 4
      mechanism: "Products维持正利润但份额缓慢流失 + IFS持续烧钱但政府不允许放弃 + 股价$20-40区间震荡3-5年 → 僵尸轨道公允值$14-18/股"
      kill_switch: "IFS FY2028外部收入>$3B(代工真的起来了) 或 Intel宣布全面拆分"

    - claim: "AI对Intel净效应为负(-0.12)——违反'AI利好半导体'直觉"
      direction: bearish
      magnitude: 3
      mechanism: "DCAI受GPU替代冲击(-3)被CCG/IFS/Altera微小正面(+1~+2)勉强抵消 → Intel在AI链条中是被替代者, 非受益者"
      kill_switch: "Crescent Island GPU性能接近NVIDIA B100/B200 → 改变AI格局定位"

  moat:
    composite_score: 4.74  # A-Score, 置信度调整后4.27
    half_life: "制度壁垒>10年 | x86切换成本5-8年(衰减中) | 技术壁垒<3年"
    dimensions:
      - type: regulatory
        strength: 4
        evidence: "CHIPS Act $7.86B+Secure Enclave $3B+税收抵免$25B → 唯一美国先进制程厂商 → A11=7(唯一上升维度)"
        vulnerability: "TSMC Arizona完全量产 → Intel不再是唯一选择; 政治环境变化削减CHIPS Act"
      - type: switching_cost
        strength: 3
        evidence: "x86企业IT迁移成本$2-5M(F500) → 5年平均留存高 → A2=7"
        vulnerability: "ARM架构在数据中心25%且年增70% → x86生态围墙正在被侵蚀; 按11%/年衰减率"
      - type: ip
        strength: 2
        evidence: "RibbonFET+PowerVia是真正工程成就(全球首个量产GAA+背面供电)"
        vulnerability: "良率65-75%(需>80%盈利) + 密度落后TSMC N2 31% + IP库几乎为零"
      - type: scale
        strength: 2
        evidence: "IDM模式: 全球少数同时拥有设计+制造能力的公司 → A1=7"
        vulnerability: "规模反噬: PP&E $105.4B资产负担 + IFS CapEx占总CapEx 60% → 固定成本过高"

  valuation:
    reverse_dcf_implied: "$46.12隐含$15-18B稳态FCF → 需五面承重墙同时站立(联合概率2-3%) → 市场在赌一个当前不存在的Intel"
    methods_used: ["Reverse DCF承重墙", "SOTP", "概率加权四情景", "护城河量化", "AI调整SOTP", "FMP DCF"]
    dispersion: "2.1x ($14-$30收敛区, 高于2.0x阈值 → 高度不确定)"
    consensus_vs_ours: "市场隐含IFS成功概率25-30% | 我们评估15%; 市场FY2029E收入$74.7B | 我们$58-65B; 分析师目标$20.4-71.5(离散度3.5x)"
    entry_zone: "$14-30/股收敛区; 政府入股锚$20-23; 僵尸轨道值$14-18"
    catalyst: "多数催化剂概率加权净期望值为负(-4%) — 催化剂丰富不等于利好"

  # ★ v1.2新增: 买卖决策框架 ★
  action_framework:
    verdict: "回避 — 概率加权下行72%, 即使去偏差修正后仍有~46%下行空间"
    buy_triggers:
      - trigger: "IFS季度外部收入突破$500M(年化$2B+)"
        price_zone: "$20-25(接近SOTP中值)"
        reasoning: "IFS商业化获初步验证 → 钥匙墙W3概率上修 → 联合概率跳升"
      - trigger: "Apple 18A正式确认签约"
        price_zone: "$25-30"
        reasoning: "IFS叙事获实质支撑 → 估值逻辑从僵尸轨道切换到部分成功路径"
      - trigger: "股价跌至$20-23(政府入股锚区间)"
        price_zone: "$20-23"
        reasoning: "政府底线提供安全边际 + 护城河量化$14/股已覆盖 → 下行有限"
    hold_conditions:
      - "IFS外部季度收入持续增长(非单季跳升)"
      - "18A良率突破80%(商业可行确认)"
      - "x86服务器份额维持>65%"
      - "Tan战略方向12个月+未变"
    sell_triggers:
      - signal: "18A良率确认<50%(Panther Lake延迟或低量出货)"
        severity: "action"
        action: "全部卖出, IFS叙事核心塌陷"
      - signal: "x86服务器份额跌破65%"
        severity: "warning"
        action: "减仓50%, 负反馈循环启动"
      - signal: "CEO第四次战略重大转向"
        severity: "action"
        action: "全部卖出, 组织耗散不可逆"
      - signal: "毛利率<35%连续4个季度"
        severity: "warning"
        action: "减仓50%, 盈利能力结构性恶化"
    position_sizing: "当前价位不建议建仓; $20-23区间可配置1-2%探索性仓位(政府底线保护)"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "承重墙连锁反应: W3是钥匙墙"
    chain: >
      IFS盈亏平衡(W3)是整个估值体系的钥匙
      → W3倒塌(IFS亏损持续): IFS CapEx占总CapEx 60%不可削减
      → W2倒塌: 合并营业利润率天花板~15%(IFS拖累), 达不到18-25%
      → W4倒塌: 营业利润率是FCF利润率前置条件, W2倒→W4必然不达标
      → 三面连锁倒塌: 估值从$34-47/股→$12-18/股
      → 联合概率从独立假设0.23%→条件建模2-3%(远低于直觉10-15%)
    transferable_to: "所有多分部公司(一个亏损分部拖累合并报表) — 如GE拆分前/Sony娱乐+电子"
    reasoning_habit: "看到多分部公司估值, 追问'哪个分部是钥匙墙' — 找到单点故障后做条件概率而非独立乘积"

  - id: "CC-2"
    name: "护城河迁移: 技术壁垒→制度壁垒"
    chain: >
      观察: Intel A-Score 4.74但三座堡垒(A1/A2/A11)仍在7分
      → 追问: 这三座堡垒的性质是什么?
      → A1输入自主权(IDM)+A2切换成本(x86企业)=传统技术壁垒, 但在衰减
      → A11合规门槛(CHIPS Act+国防)=制度壁垒, 且是唯一上升维度
      → 发现: 护城河核心已从技术(70%→30%)迁移到制度(30%→70%)
      → 估值含义: 锚点从"盈利能力"转向"政治意志+期权"
      → 方法: DCF不适用→应用"期权+溢价"框架
    transferable_to: "所有从市场竞争力转向政策保护的公司(波音/通用汽车/部分国防承包商)"
    reasoning_habit: "当护城河中多数维度下降但个别维度反升时, 追问'哪种壁垒在替代哪种' — 这决定了估值方法选择"

  - id: "CC-3"
    name: "联合概率远低于直觉的数学教训"
    chain: >
      市场参与者倾向独立评估每个假设: IFS 50/50, 良率 50/50, 份额 50/50...
      → 直觉: 整体也大约50/50
      → 但五个假设需同时成立→联合概率是乘积不是平均
      → 且假设间有因果依赖(W3→W2→W4) → 条件概率进一步压低
      → 结果: 直觉10-15% vs 实际2-3%
      → 含义: 市场本质上在赌"不需要所有信念成立"——但$46定价确实需要大部分成立
    transferable_to: "所有turnaround故事(需要多个条件同时满足才能兑现目标估值)"
    reasoning_habit: "turnaround公司估值时, 列出所有隐含信念→逐一赋概率→做联合概率(条件非独立) — 直觉与数学的偏差通常>5x"

  - id: "CC-4"
    name: "政府期权>商业价值的估值框架倒置"
    chain: >
      传统框架: 收入×利润率×倍数 = 商业价值, 政府补贴是加分项
      → 但Intel SOTP退守$14-24/股时, 商业价值$50-80B vs 政府确定性支持$38-57B
      → 政府支持价值≈商业价值 → 市值~50%由"政府不能让Intel倒"支撑
      → 框架应反转: 先锚定政府底线, 再叠加商业竞争力溢价/折价
      → 证伪需三条件同时: 美中缓和+CHIPS Act削减+TSMC Arizona替代(联合<5%)
    transferable_to: "所有国家安全关键企业(国防承包商/关键基础设施/唯一供应商)"
    reasoning_habit: "当政府支持占企业价值>30%时, 估值框架需要倒置——政府底线是锚, 商业能力是变量"

  - id: "CC-5"
    name: "催化剂丰富≠利好——概率加权期望值为负"
    chain: >
      市场叙事: Intel 2026-2027催化剂丰富=故事利好
      → 逐个催化剂概率加权: Apple 18A否认影响>确认影响(不对称)
      → 多数催化剂失败概率>成功概率, 且失败下行>成功上行
      → 净期望值约-4%
      → 含义: "催化剂多"是叙事优势但非数学优势; 时间是turnaround的敌人
    transferable_to: "所有催化剂密集的turnaround/speculative公司"
    reasoning_habit: "看到'催化剂丰富'时, 逐个算概率×impact而非简单列举 — 如果净EV为负, 催化剂其实是风险源"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "AI浪潮利好整个半导体行业, Intel作为芯片巨头也将受益"
      final: "AI净效应-0.12(中性微负): DCAI受GPU替代冲击(-3)抵消了其他分部微小正面"
      pivot: "6分部×5维度矩阵分析 → Intel在AI链条中是被替代者, 非受益者"

    - initial: "Intel转型成功取决于18A技术追赶TSMC"
      final: "护城河核心已从技术壁垒迁移到制度壁垒——真正的支撑是'不能被允许消失'"
      pivot: "A-Score 12维分析: A11(合规门槛)是唯一上升维度, 且护城河70%已来自制度壁垒"

    - initial: "催化剂丰富意味着turnaround可期"
      final: "概率加权催化剂净期望值-4%, 大多数催化剂失败概率>成功概率"
      pivot: "逐个催化剂概率×非对称影响计算: Apple 18A否认的下行>确认的上行"

  surprises:
    - finding: "五墙联合概率仅2-3%(vs直觉10-15%) — 条件概率建模揭示因果依赖的威力"
      implication: "turnaround估值中, 独立概率乘积是数学下界, 条件概率才是现实估计, 但结果通常令人不安地低"

    - finding: "机构(扣被动)Q3净减持18.6%, 对冲基金偏空 — 但散户通过期权P/C 0.64推高股价"
      implication: "聪明钱和散户的方向性分歧=定价脆弱性; 散户mania退潮窗口6-12个月"

    - finding: "Ohio旗舰工厂延迟5-6年(2025→2030-31), 比TSMC Arizona Phase 2晚3-4年"
      implication: "Intel可能在自己最大的差异化优势(美国本土先进制程)上被TSMC追平, 制度壁垒基础受损"

    - finding: "现有股东4年内被稀释近20%(4.06B→4.86B股) — 政府入股给管理层不给股东"
      implication: "政府入股@$20-23锚定买盘, 但资金用于Intel运营而非现有股东→稀释是隐性成本"

  blind_spots:
    - area: "18A真实良率"
      why_matters: "单一最大已知未知: <50%→所有IFS估值下调30-50%; >75%→IFS叙事获实质支撑"
      monitor: "Panther Lake量产出货量(H1 2026) + TrendForce季度更新"

    - area: "Apple 18A是否真正签约"
      why_matters: "IFS估值的单一最大催化剂: 签约=+$10-15B; 不签=叙事核心塌陷"
      monitor: "Apple供应链消息 + Intel IFS季度外部收入突变"

    - area: "Tan的真实战略意图"
      why_matters: "Cadence背景暗示可能转向设计优先/制造轻资产 → 估值逻辑根本改变"
      monitor: "12个月战略一致性 + Investor Day路线图 + IFS独立实体进展"

    - area: "政府支持的持久性"
      why_matters: "CHIPS Act是法律但拨付进度取决于政治; 2028新政府可能削减→$20-35B地缘溢价缩水"
      monitor: "国会年度拨款审议(2026.06) + 选举周期政策走向"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "turnaround股催化剂等待期超过12个月且基本面未改善 → turnaround疲劳"
      lesson: "催化剂等待期=时间成本。如果关键催化剂(18A良率/Apple签约)在12个月内未兑现, 市场叙事会从'即将好转'变成'又在画饼'"
      transferable: "所有turnaround故事 — 设定明确的催化剂验证时间窗口, 超时=重新评估"
    - scenario: "散户驱动+161%涨幅后机构持续减持 → 散户mania退潮导致均值回归"
      lesson: "散户多头vs机构空头的方向性分歧是定价脆弱性信号, 通常6-12个月内解决(向机构方向)"
      transferable: "所有散户持仓占比高且机构减持的股票(GME/AMC模式的温和版)"
    - scenario: "IFS烧钱但政府不允许关闭 → 持续价值毁灭但无止损触发"
      lesson: "政府支持的公司可能进入'不死不活'状态(IBM式) — 这比倒闭更危险, 因为投资者会持续等待永不到来的turnaround"
      transferable: "'太大不能倒'的公司(银行/国防/关键基础设施)"

