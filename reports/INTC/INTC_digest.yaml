    - signal: "IFS季度外部收入"
      bullish_threshold: "季度>$500M(年化$2B+)=突破"
      bearish_threshold: "季度<$150M(下降)=恶化"

  noise_signals:
    - signal: "分析师目标价调整"
      why_noise: "离散度3.5x($20.4-71.5), 70%持有=最大分歧股 → 共识不存在, 单一目标价无信息量"
    - signal: "日度股价波动"
      why_noise: "散户情绪驱动+叙事投资 → 日度波动反映情绪而非基本面"
    - signal: "Intel管理层对IFS的乐观表态"
      why_noise: "前任CEO也曾高度乐观(IDM 2.0愿景), 3年后被解职 → 管理层表态的预测价值极低"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: IBM
      similarity: "身份危机+缓慢衰减+转型叙事+CEO频繁更替 — Intel僵尸轨道的最佳参照"
      key_difference: "IBM无制造业务=轻资产衰减; Intel IFS=重资产赌注→下行更深但上行也更高"

    - ticker: AMD
      similarity: "x86生态同一赛道, 直接竞争"
      key_difference: "AMD纯设计(fabless)+专注CPU/GPU两条线 vs Intel IDM+六条线全铺 → AMD在每个竞争的维度上都更专注"

    - ticker: TSMC
      similarity: "先进制程代工直接竞争"
      key_difference: "TSMC 70.2%代工份额+15年客户积累+IP库完整 vs Intel IFS外部$0.9B+IP库几乎为零 → 竞争力差距可能不可逾越"

  comparative:
    - dimension: "护城河深度"
      position: "TSMC (A-Score ~8+) > ASML (~8.2) > KLAC (~7.5) > AMD (~6) > INTC (4.74)"
      reasoning: "Intel A-Score在半导体行业后25%分位, 12维中9维下降趋势"

    - dimension: "turnaround成功概率"
      position: "INTC僵尸轨道(55%) > 部分成功(17%) > 管理层目标(8%)"
      reasoning: "五墙联合概率2-3% vs IBM转型用了10年从$73B→$57B收入+Kyndryl分拆"

    - dimension: "估值吸引力"
      position: "概率加权$13 vs 市价$46 = -72% → 极不吸引"
      reasoning: "Forward PE ~92x, 即使FY2028E PE ~35x仍高于合理区间; SOTP中值$30(-35%)"

    - dimension: "政策保护强度"
      position: "INTC (A11=7, 唯一美国先进制程) > 其他半导体公司"
      reasoning: "CHIPS Act+Secure Enclave+政府入股=系统性重要实体, 但政策保护≠股东回报"

  industry_position:
    quadrant: "最高政策保护 × 最低竞争力 × 最宽可能性空间"
    archetype: "衰退帝国+政策托底 — 收入在萎缩但政府不允许倒闭"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→$46隐含$15-18B稳态FCF→五面承重墙联合概率2-3% → 市场在赌一个当前不存在的实体"

    - pattern_id: "scenario_analysis.zombie_path"
      application: "IBM 2012-2020参照→僵尸轨道概率55%→收入缓降+IFS烧钱+政策维持→$14-18/股"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "8模块偏差审计→净偏差仅0.5pp→双向抵消 → 即使去偏差修正, 下行仍~46%"

    - pattern_id: "competitive_benchmarking.multi_front_war"
      application: "五面同时进攻(AMD/NVIDIA/ARM/云自研/TSMC)→无一战场领先→A-Score 12维9维下降"

  novel_patterns:
    - name: "护城河迁移映射(技术→制度)"
      description: "当技术壁垒系统性衰退但制度壁垒强化时, 护城河核心从'能做什么'变成'不能被允许消失' → 估值方法需从DCF转向期权+溢价框架"
      transferable_to: ["波音(航空安全)", "通用汽车(就业)", "国防承包商(安全)", "所有政策依赖型公司"]

    - name: "承重墙连锁反应(钥匙墙分析)"
      description: "多面承重墙的因果依赖使联合概率远低于独立乘积 → 找到钥匙墙后做条件概率, 结果通常比直觉低5-10倍"
      transferable_to: ["所有多分部公司估值", "所有turnaround故事的隐含信念检验"]

    - name: "催化剂净期望值(丰富≠利好)"
      description: "逐个催化剂概率×非对称影响求和 → 当失败概率>成功概率且下行>上行时, 催化剂丰富反而是风险源"
      transferable_to: ["所有催化剂密集的speculative公司", "biotech pipeline分析"]

    - name: "散户vs机构方向性分歧指标"
      description: "期权P/C ratio+空头比(散户工具)vs 机构持仓变化+目标价(机构工具)的方向性分歧 → 分歧最大化时=定价脆弱性峰值"
      transferable_to: ["所有散户持仓占比高的meme/turnaround股"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "护城河可以'迁移'——技术壁垒衰退时制度壁垒可能接棒, 但两种壁垒的估值方法完全不同"
        implication: "护城河分析需追踪壁垒类型的构成变化, 不仅是强度变化; 制度壁垒用期权框架, 技术壁垒用DCF"
      - insight: "A-Score形态分析('堡垒型衰退': 少数维度极高+多数下降)比单一分数更有信息量"
        implication: "护城河评估报告应包含12维雷达图形态分析, 识别'堡垒'和'陷落阵地'"

    valuation_insights:
      - insight: "turnaround公司的隐含信念需做联合概率(条件非独立)而非直觉评估 — 直觉与数学的偏差通常>5x"
        implication: "所有turnaround估值应包含'承重墙联合概率测试', 列出隐含信念→逐一赋概率→条件概率建模"
      - insight: "发现系统(PW>=7)公司应提供条件评级而非单一评级 — 信息量在条件矩阵而非方向判断"
        implication: "高不确定性公司的报告格式应从'评级+目标价'改为'条件×评级矩阵+Kill Switch'"

    screening_insights:
      - insight: "Forward PE>50x + 机构减持>15% + 散户期权偏多 = turnaround叙事过热信号"
        implication: "选股筛选应加入'叙事温度'过滤器: PE极端+机构散户分歧→标记为叙事驱动而非基本面驱动"
      - insight: "政策保护强度(A11)作为独立筛选维度 — 高A11+低其他A-Score维度='政策托底型'"
        implication: "选股框架增加'政策保护度'维度, 与传统品质/估值/增速三维并列"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "turnaround公司的隐含信念做联合概率, 不信直觉"
      trigger: "分析turnaround/转型/多条件故事"
      origin: "五墙联合概率2-3% vs 直觉10-15% — 差距5x"
      generalization: "所有需要多个条件同时成立的投资论文, 联合概率=最诚实的估值校验"

    - habit: "护城河分析不仅看强度, 还要看类型构成变化"
      trigger: "护城河各维度方向不一致(部分上升部分下降)"
      origin: "Intel A-Score 12维中9维下降但A11上升 → 护城河从技术迁移到制度"
      generalization: "壁垒类型决定估值方法: 技术壁垒→DCF, 制度壁垒→期权, 混合→分部定价"

    - habit: "催化剂丰富时, 逐个算概率×非对称影响再求和"
      trigger: "看到'催化剂丰富'叙事"
      origin: "Intel催化剂净期望值-4% — 丰富但每个都失败概率>成功概率"
      generalization: "叙事优势≠数学优势。催化剂清单的净EV可能为负"

    - habit: "区分散户vs机构持仓信号的方向"
      trigger: "股价大涨但基本面未改善"
      origin: "Intel +161%涨幅但机构减持18.6%+对冲基金偏空 → 散户驱动"
      generalization: "散户与机构方向分歧最大化时, 中期解决通常向机构方向(6-12个月)"

  quality_feedback:
    strengths:
      - "发现系统(PW=8)应用出色 — 条件评级矩阵+Kill Switch+可能性空间映射比单一目标价信息量高一个量级"
      - "承重墙联合概率分析(CC-1) — 五墙因果依赖建模是报告最有区分度的分析工具"
      - "认知偏差系统审计(Ch.16) — 8模块逐章扫描+去偏差修正+诚实承认系统性悲观偏差"
      - "DM密度1.35/千字 — 97个锚点覆盖率90%+, 数据基础扎实"
    weaknesses:
      - "报告框架版本v17.3 — 早期框架, 缺少后续版本的SaaS单位经济学/飞轮悖论等分析维度"
      - "无正式记分卡(D1-D11) — 无法量化评估各维度质量"
      - "DM总数97偏低(vs 后期报告450+标准) — Phase 1-2数据锚定可以更密"
      - "概率赋值主观性较高 — 部分CQ置信度缺乏外部锚定(如CQ2 15%的基准率来源不够硬)"

  hypothesis_tested:
    confirmed:
      - hypothesis: "Reverse DCF P1前置有效防止结论先行偏差"
        evidence: "Ch.6 Reverse DCF→五面承重墙→后续分析始终围绕检验隐含信念"
        confidence_after: "高(多份报告验证)"
      - hypothesis: "联合概率远低于独立概率乘积(因果依赖)"
        evidence: "独立0.23% vs 条件概率2-3% — 因果链(W3→W2→W4)是关键传导"
        confidence_after: "高(首次量化验证)"

    extended:
      - hypothesis: "护城河评估需多维度形态分析(非单一分数)"
        extension: "Intel发现'堡垒型衰退'形态 → A-Score形态分析作为独立分析工具的价值"

    refuted: []

  limitations:
    - "18A良率使用TrendForce估计(55-65%), Intel从不公开确认 → 偏差可达10-15pp, 是单一最大不确定性"
    - "Apple 18A签约信息为媒体传闻(来源★★) → IFS估值单一最大催化剂无法独立验证"
    - "概率加权估值$13/股 vs 去偏差修正后$20-30 → 真实值可能在两者之间, 报告承认可能存在系统性悲观偏差"
    - "政治环境(CHIPS Act持久性/选举周期)无法可靠预测 → 制度壁垒估值有高度不确定性"
    - "框架版本v17.3, 早于多项框架改进(铁律K估值统一性/铁律N证据链等) → 方法论完备性低于后期报告"
