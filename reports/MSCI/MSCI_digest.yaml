    - claim: "垄断悖论: 品质最高≠投资最佳, 市场已充分定价品质"
      direction: bearish
      magnitude: 4  # 7+维度验证+跨公司确认(FICO)
      mechanism: "A-Score 8.55→市场给PE 36x→OEY Spread仅6.85%→持有回报11%/年(fair return) → 品质越确定→定价越充分→超额回报越难获得"
      kill_switch: "垄断悖论每2-4年有打破窗口(VIX>30+PE跌至5年低位) → 短暂买入机会"

    - claim: "利率是主控变量, 非管理层决定MSCI估值命运"
      direction: conditional
      magnitude: 4  # Reverse DCF + OEY + AUM beta三分析交叉验证
      mechanism: "WACC±1%→公允价值±$106/股 | 利率-200bps→评级升级(关注) | 利率+100bps→评级降级(偏审慎) | AUM beta→利率影响股市→影响收入"
      kill_switch: "永久高利率(Rf>4.5%持续5年+, 概率25-30%) → 中性→审慎关注"

    - claim: "Index=83%SOTP, 买MSCI≈买制度嵌入的永续现金流"
      direction: bullish
      magnitude: 4  # SOTP分部量化
      mechanism: "Index半衰期>50年(制度不可逆) + EBIT margin~81%(边际成本≈0) + Nash均衡(三寡头领地分化9/10稳定)"
      kill_switch: "S&C(<15年半衰期)如果政治争议加剧可能拖累整体估值 | 市场隐含7%集团折价"

    - claim: "回购在高PE下持续毁灭股东价值(CQ4=78%)"
      direction: bearish
      magnitude: 3  # 数学推导+管理层沉默域验证
      mechanism: "PE 36x→FCF Yield 2.8% vs 借债成本5.5% → 经济上'借5.5%买2.8%' | FY2025 $2.48B回购(历史最高) | 管理层激励~65%与EPS挂钩→明知故犯是理性选择"
      kill_switch: "管理层改善回购纪律(PE>35x不回购→转分红) | 股价大幅下跌使回购重新创造价值"

  moat:
    composite_score: 9.0  # CQI 66(前15%) + C1=5.0 + A-Score 8.55
    half_life: "Index >50年 | Analytics ~30年 | S&C <15年 | PA 未知"
    dimensions:
      - type: regulatory
        strength: 5
        evidence: "C1=5.0(覆盖公司最高), L5级制度嵌入 — 法规引用+IMA锁定+认知框架定义, $7T AUM追踪"
        vulnerability: "联合国金融稳定委员会创建公共基准(概率极低, 10年内<5%)"
      - type: network_effect
