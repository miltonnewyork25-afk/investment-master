  fair_value: "$579 (红队后, 三方法加权+黑天鹅-$11)"
  expected_return: "+3.3%"

  key_arguments:
    - claim: "制度嵌入是所有覆盖公司中最深的(C1=5.0, 四重叠加护城河唯一)"
      direction: bullish
      magnitude: 5  # 35家覆盖公司唯一四重叠加, L5级嵌入
      mechanism: "法规引用+$7T AUM锁定+认知框架定义+'新兴市场'概念即MSCI → 替换需修改法规+移动$Ts+改变投资者思维"
