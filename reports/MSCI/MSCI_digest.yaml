  nearest_neighbors:
    - ticker: CME
      similarity: "同为金融基础设施垄断收费站, 同为制度嵌入型, 类似PE区间"
      key_difference: "CME=清算垄断(五环互锁, CQI 93) vs MSCI=数据垄断(铸币税型, CQI 66) | CME有利息周期干扰, MSCI无 | CME增速5-7%<MSCI 10%但CME护城河更深"

    - ticker: MCO
      similarity: "双寡头垄断+制度嵌入(评级引用于法规)+类似分析框架"
      key_difference: "MCO增速~10%≈MSCI | MCO无集团折价(单一业务) | MCO护城河半衰期更均匀(信用评级验证性>ESG)"

    - ticker: FICO
      similarity: "极高CQI(75>MSCI 66)+制度嵌入+垄断定价权"
      key_difference: "FICO=垄断悖论极端案例(Q=10但V=2→机会分仅2.8 vs MSCI 5.4) | FICO期望回报-16%"

    - ticker: SPGI
      similarity: "评级+指数+数据三引擎 | 多引擎金融基础设施"
      key_difference: "SPGI收购IHS Markit后规模更大但集团折价更低(3-5% vs MSCI 7%) | SPGI增速靠并购, MSCI靠有机"

  comparative:
    - dimension: "护城河深度(制度嵌入)"
      position: "MSCI (C1=5.0) ≥ CME (CQI 93) > MCO (~80) > SPGI (~75) > FICO (75但单维度)"
      reasoning: "MSCI四重叠加(网络+规模+转换+制度)是35家覆盖公司唯一 | CME五环互锁也极深但制度嵌入稍浅(制度'要求'用CME vs '定义'用MSCI)"

    - dimension: "增长质量"
      position: "MSCI (有机10%) ≈ MCO (~10%) > SPGI (8%有机+并购) > ICE (7%并购驱动) > CME (5-7%依赖波动率)"
      reasoning: "MSCI有机增速最高且不依赖外生波动率, 但Reverse DCF隐含市场已折入减速预期"

    - dimension: "估值吸引力(机会分)"
      position: "MCO (5.9) > MSCI (5.4) > SPGI (4.5) > ICE (4.2) > CME (3.7) > FICO (2.8)"
      reasoning: "垄断三角Q×V×G: 品质最高的不一定机会最高 | MCO在V维度领先(估值相对合理)"

    - dimension: "垄断悖论严重度(品质已定价程度)"
      position: "FICO (最严重, V=2) > CME (V=4) > MSCI (V=5) > SPGI (V=4) > MCO (V=7, 最轻)"
      reasoning: "FICO CQI最高但PE也最高→品质完全资本化 | MCO品质稍低但估值更合理→仍有超额回报空间"

    - dimension: "利率敏感度"
      position: "CME (最敏感, 利息占运营利润20%) > MSCI (AUM beta, WACC±$106/股) > MCO/SPGI (发债量相关)"
      reasoning: "CME利率直接影响EPS | MSCI利率间接通过AUM和折现率影响 | MCO/SPGI利率通过债券发行量影响"

  industry_position:
    quadrant: "最高品质(C1=5.0) × 合理估值(PE warranted上沿) × 中等增速(有机10%但减速中)"
    archetype: "铸币税型垄断 — 收费权来自标准制定权而非产品优势"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含g 6.2% vs 有机~10%→市场已折入减速→当前价格'合理偏保守'"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "8个红队测试(RT-1~RT-3): 6个承重墙+2个偏差审计+空头钢人 → CQ净变动25pp(v1.0仅1.43pp) → 17.5x红队有效性提升"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "利率路径(CQ7): Fed降息→OEY Spread扩大→评级升级 vs Fed不降→WACC上升→评级降级 | 渐进传导"

  novel_patterns:
    - name: "垄断三角 Q×V×G"
      description: "品质(Q)×估值纪律(V)×增长期望(G)三维机会分→品质最高≠机会最高→解决'好公司vs好投资'的核心矛盾"
      transferable_to: ["所有CQI>70的垄断型公司", "品质陷阱识别", "CME/MCO/SPGI/FICO/ICE"]

    - name: "铸币税经济学(制度型垄断的收费权分析)"
      description: "区分'产品优势驱动的定价权'vs'标准制定权驱动的铸币税'→后者半衰期>前者10x→应给不同折现率"
      transferable_to: ["评级机构(MCO/SPGI)", "支付网络(V/MA)", "会计准则(IFRS)", "所有标准制定者"]

    - name: "双半衰期分部估值(多引擎持久性差异)"
      description: "同一公司不同引擎有>3x的半衰期差异→统一PE误导→应分引擎给PE→揭示隐含集团折价"
      transferable_to: ["CME(清算>30年/数据>15年/利息<5年)", "SPGI(评级vs指数vs数据)", "所有多引擎公司"]

    - name: "垄断悖论(品质定价的均衡与打破)"
      description: "垄断品质被市场充分定价后回报趋向fair return→但每2-4年VIX+PE压缩打破均衡→创造短暂买入窗口"
      transferable_to: ["所有CQI>60的垄断型公司的买入纪律"]

    - name: "管理层沉默域分析(信息不对称挖掘)"
      description: "管理层在earnings call中系统性回避的话题=最有分析价值的信号(回购效率/OPM天花板/内部人交易含义)"
      transferable_to: ["所有公司的CEO分析模块"]

    - name: "ESG保险化轨迹(从成长→合规→债券逻辑)"
      description: "ESG评级从自愿增值工具→监管合规工具的演化路径 | 增速下降但留存率上升 | 估值从SaaS倍数→公用事业倍数"
      transferable_to: ["所有经历从可选→强制演化的合规产品"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "制度嵌入有五层(L1操作→L5法规), MSCI在L4+L5同时有证据→C1=5.0→当前覆盖公司最高"
        implication: "护城河评估增加'嵌入层级'维度 — L5(法规级)嵌入半衰期>L4(行业标准)>L3(workflow)>L2(数据)>L1(操作)"
      - insight: "四重叠加护城河(网络+规模+转换+制度)比单维度深得多 — 攻破任一维度不足以颠覆"
        implication: "护城河分析应检测互锁冗余度而非仅评分单维度"
      - insight: "ESG方法论悖论: 越主观→越容易被质疑→但也越难被标准化→不可证伪=不可替代"
        implication: "主观性评分产品的护城河评估需要不同框架 — 不是'准确性'而是'被认可度'"

    valuation_insights:
      - insight: "垄断三角Q×V×G是评估垄断股投资时机的最有效三维框架"
        implication: "所有垄断股分析报告应计算机会分, 作为评级的量化辅助工具"
      - insight: "双半衰期揭示统一PE的误导性 — MSCI隐含7%集团折价来自S&C争议"
        implication: "多引擎公司估值应强制分引擎给PE, 揭示隐含折价/溢价"
      - insight: "OEY Spread是垄断股入场时机的单一最佳指标(综合品质+估值+增长)"
        implication: "建立OEY Spread阈值表: <6%=审慎, 6-8%=中性, 8-10%=关注, >10%=深度关注"

    screening_insights:
      - insight: "垄断悖论过滤器: CQI>70 + OEY Spread<7% = 品质已定价 → 等待而非追入"
        implication: "选股筛选增加'垄断悖论检查' — 高品质+低Spread=陷阱"
      - insight: "管理层沉默域: 连续3个earnings call回避同一话题=最强信号"
        implication: "定性筛选增加'沉默域密度' — 沉默域越多→隐藏问题越多"
      - insight: "回购利差(FCF Yield - 借债成本): 为负=资本配置毁灭价值"
        implication: "选股增加'回购效率'过滤: 利差<0且年回购>FCF 30%→标记资本配置风险"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "对制度嵌入逐层追问深度(L1-L5)"
      trigger: "公司自称'行业标准'或'不可替代'"
      origin: "MSCI C1五层分析: L1操作→L5法规, 在L4+L5同时有证据=最深"
      generalization: "制度嵌入的深度决定护城河半衰期 — L5>50年, L3<15年, L1<5年"

    - habit: "品质极高时立刻计算垄断三角机会分"
      trigger: "CQI>60 且 PE>25x"
      origin: "MSCI Q=9但V=5→机会分5.4 | FICO Q=10但V=2→机会分2.8"
      generalization: "品质是必要非充分条件。只有Q×V×G三者共振(机会分>7)时才构成买入信号"

    - habit: "多引擎公司逐引擎追问半衰期"
      trigger: "公司有≥2个引擎且增速差异>2x"
      origin: "Index >50年 vs S&C <15年 → 统一PE 36x掩盖了7%集团折价"
      generalization: "半衰期差异>3x的引擎应分别估值 — 统一PE系统性误导"

    - habit: "追问管理层沉默域"
      trigger: "管理层在earnings call中对显而易见的问题不讨论"
      origin: "MSCI回购效率/OPM天花板/内部人交易 — 三大沉默域各自暴露了管理层不愿面对的数学"
      generalization: "沉默=信号。管理层系统性回避的话题往往是最有分析价值的"

    - habit: "利率对估值的传导路径要量化到$/股"
      trigger: "利率敏感型公司的估值分析"
      origin: "WACC±1%→MSCI公允价值±$106/股 — 利率不是定性风险而是可量化的主控变量"
      generalization: "对利率敏感型公司, Reverse DCF的WACC敏感性分析是必做项, 不是可选项"

  quality_feedback:
    strengths:
      - "DM密度2.60/千字(754个DM) — v1.0的8.1x提升, 数据锚定极其扎实"
      - "CQ系统8个假说全生命周期演化(P1→P4) — 跨Phase置信度追踪是方法论标杆"
      - "红队有效性25pp(v1.0仅1.43pp) — 17.5x提升, 承重墙+偏差审计+空头钢人三层对抗"
      - "垄断三角框架(Ch20)是跨报告可复用的最有价值方法论贡献"
      - "四维估值一致性(Reverse DCF+SOTP+PE+OEY→同方向)验证结论稳健"
    weaknesses:
      - "v3.0核心价值是确认v2.0评级(中性关注), 增量洞见集中在方法论框架(垄断三角/双半衰期)而非评级变化"
      - "PA第二引擎(CQ5)仅32%置信度 — 数据有限(PCS+86%但单年), 对评级升级路径的判断时间不确定性高"
      - "BlackRock合同(CQ6)=4-6年后的高杠杆事件, 当前无法验证 — 事件风险定价难"

  hypothesis_tested:
    confirmed:
      - hypothesis: "垄断悖论: 品质最高≠回报最高(v1.0提出)"
        evidence: "v3.0用7+维度+FICO跨公司验证, CQ3从60%→80%"
        confidence_after: "高(三个版本持续确认, 未被推翻)"

      - hypothesis: "回购@高PE毁灭价值(MCO CI-004)"
        evidence: "MSCI回购利差为负(FCF Yield 2.8% vs 借债5.5%) + $6.25B回购+TSR≈大盘"
        confidence_after: "高(CME+MCO+MSCI三份报告独立确认)"

      - hypothesis: "Reverse DCF必须P1前置(CRM v2.0铁律O)"
        evidence: "Ch12 Reverse DCF有效防止v1.0的结论先行偏差(v1.0离散度115%→v3.0 17.1%)"
        confidence_after: "高(多份报告执行确认)"

    extended:
      - hypothesis: "双半衰期(CME v3.0)"
        extension: "MSCI双半衰期(Index>50年/S&C<15年)比CME(清算>30年/利息<5年)差异更极端→隐含集团折价更大(7% vs CME隐含较小)"

      - hypothesis: "垄断三角Q×V×G(MSCI v1.0原创)"
        extension: "v3.0用5家可比公司验证框架(MSCI/SPGI/MCO/FICO/ICE)→机会分与实际回报方向一致 → 框架从单公司工具升级为跨公司比较工具"

    refuted:
      - hypothesis: "品质信号全部可靠(生存品质47/50)"
        evidence: "红队偏差审计: 5个信号中2个是后验的(14年零下降/两次冲击正增长), 未经2008级全面信贷危机验证 → 调整至44/50"
        lesson: "后验品质信号应打折(7折) — 区分前瞻可靠vs后验可能失效"

  limitations:
    - "PA第二引擎(CQ5)数据有限 — PCS+86%是单年数据, S曲线类比ESG暗示增速可能3年内腰斩"
    - "BlackRock 2035合同续约 — 4-6年后的事件, 当前任何估值调整都是猜测"
    - "利率路径 — WACC±1%→FV±$106/股, 但利率预测能力=零 → 估值对外生变量高度敏感"
    - "垄断三角V维度依赖OEY Spread(受利率影响) → V的读数不稳定, 需要利率环境normalize后才有跨时间可比性"
    - "AI对指数行业的颠覆潜力 — 如果AI使个性化基准替代标准化指数, MSCI铸币税基础可能动摇 → 10年+时间尺度, 当前不可建模"
