# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "制度嵌入如何变成铸币税"
    chain: >
      MSCI定义'新兴市场/发达市场'分类
      → IMA/养老金将MSCI指数写入投资指引(Investment Management Agreement)
      → 改基准需要受托人批准+监管审批+重新配置$Ts AUM
      → 不是'贵不贵'的问题而是'可不可以替换'的问题(需修改法规)
      → 铸币税: 收费权来自标准制定权而非产品优势
      → 半衰期>50年(制度的更换速度远慢于技术)
      → 估值含义: 现金流久期极长, 应给低折现率(类似30年国债)
    transferable_to: "所有标准制定权垄断: 评级机构(MCO/SPGI)、会计准则(IFRS)、支付网络(V/MA)"
    reasoning_habit: "追问'是客户选择用还是必须用' — 如果'必须用'是法规/制度驱动的, 护城河性质从商业护城河升级为制度护城河"

  - id: "CC-2"
    name: "垄断悖论: 品质越高→定价越充分→回报越低"
    chain: >
      A-Score 8.55(覆盖公司前5%) → 市场完全识别品质
      → PE 36x(warranted 30-35x上沿) → 品质溢价已资本化
      → OEY+g仅11.15% → 确定性高但绝对回报不突出
      → 回报从20%+降至8-11%不是品质恶化而是定价充分
      → FICO跨公司验证(CQI 75/期望回报-16%=品质最高但投资最差)
      → 垄断悖论是均衡态但非永恒态: 每2-4年有打破窗口
    transferable_to: "所有CQI>70的垄断型公司(CME/SPGI/MCO/FICO/ICE)"
    reasoning_habit: "看到极高品质公司时, 立刻计算OEY Spread — 如果<7%, 品质已定价, 等待而非追入"

  - id: "CC-3"
    name: "双半衰期导致统一PE误导"
    chain: >
      Index半衰期>50年(制度嵌入不可逆) vs S&C半衰期<15年(方法论可替代+政治周期)
      → 市场给整体PE 36x, 但分部加权PE应为38.6x
      → 隐含7%集团折价(vs SPGI 3-5%)
      → 折价来源: S&C政治争议
      → ESG争议消退→折价压缩→释放$17-34/股
      → 投资含义: 不同持久性应给不同PE, 统一PE掩盖风险和机会
    transferable_to: "所有多引擎公司(CME清算vs数据vs利息 / SPGI评级vs指数vs数据)"
    reasoning_habit: "对多引擎公司, 追问每个引擎的半衰期 — 如果差异>2x, 统一PE是误导性的"

  - id: "CC-4"
    name: "ESG方法论护城河悖论"
    chain: >
      ESG评分没有客观'正确答案'(评级商间相关性仅0.6 vs 信用评级>0.9)
      → 方法论越主观→越容易被质疑→越难被标准化
      → MSCI策略: 不追求'最准'而追求'最被认可'(机构化)
      → EU SFDR参考MSCI方法论→合规需要>准确性
      → 从'成长股逻辑'变为'债券逻辑'(低增长但近乎永续)
      → S&C估值应用8-12x(公用事业)而非15-20x(成长SaaS)
    transferable_to: "所有主观性评分/评级产品(ESG评级/信用评级/大学排名)"
    reasoning_habit: "追问'产品价值来自准确性还是合规性' — 合规驱动的产品增速低但留存率极高, 应用不同估值逻辑"

  - id: "CC-5"
    name: "回购效率随PE非线性恶化"
    chain: >
      PE 36x→FCF Yield 2.8% vs 借债成本5.5%
      → 经济上='借5.5%买2.8%收益率资产'
      → 管理层沉默域: 不在earnings call讨论回购IRR(因为数字不好看)
      → CEO薪酬~65%与EPS挂钩→回购是理性选择(个人激励>股东利益)
      → $6.25B累计回购+零超额回报(TSR 8.6%/年≈大盘)
      → 不回购→积累$8.9B现金→利息节省→EPS+$2.1→股价+$75(+13%)
    transferable_to: "所有PE>25x且积极回购的公司(CME/FICO/V/MA)"
    reasoning_habit: "看到大额回购时, 算FCF Yield vs 借债成本 — 如果利差为负, 回购在毁灭价值"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "MSCI v1.0评级'关注(偏中性)', 公允价值$606, 期望+13.1%"
      final: "v3.0评级'中性关注', 公允价值$579, 期望+3.3%"
      pivot: "v1.0离散度115%→v3.0仅17.1%(方法论从正向DCF→Reverse DCF+SOTP) + 垄断悖论7+维度验证"

    - initial: "品质高→投资回报高"
      final: "品质高→定价充分→回报趋向fair return(垄断悖论)"
      pivot: "FICO跨公司验证(CQI 75但期望-16%) + OEY+g仅11.15%"

    - initial: "ESG是高增长引擎(FY2021 +28%)"
      final: "ESG正在保险化(FY2025 +6%), 从成长逻辑→债券逻辑"
      pivot: "S曲线完成一轮: 28%→6%(4年) + EU CSRD/ISSB标准化降低专有方法论价值"

  surprises:
    - finding: "MSCI是35家覆盖公司中唯一四重叠加护城河(网络+规模+转换+制度)"
      implication: "C1=5.0是'深到底'而非'很深', 10年内联合颠覆概率<5%"

    - finding: "回购$6.25B + TSR仅8.6%/年(≈大盘) — 不回购反而股价更高"
      implication: "高PE回购是'资本配置陷阱' — 管理层激励结构与股东利益系统性错配"

    - finding: "市场对MSCI隐含7%集团折价(分部加权PE 38.6x vs 整体36x)"
      implication: "ESG争议消退可释放$17-34/股 — 但反过来ESG争议加剧可能扩大折价"

    - finding: "管理层在PE 70x(2021)也回购$198M — 信号价值论不成立"
      implication: "回购是'机械执行'而非'价值判断', CEO薪酬结构(65%挂钩EPS)是根因"

  blind_spots:
    - area: "PA(Private Assets)是否能成为第二增长引擎"
      why_matters: "PA收入$292M(PCS+86%), 但S曲线类比ESG暗示增速可能从+86%→+15%(3年) | 如PA EBIT>$100M→评级升级"
      monitor: "PA季度run rate(>$350M=触发) | PCS新销售增速(连续2季>40%=PMF确认)"

    - area: "BlackRock 2035合同续约条件"
      why_matters: "BlackRock拥有Preqin(PA竞争筹码)+iShares分发网络(替代威胁) | 费率让步5%=-$26/股"
      monitor: "2030-2032年谈判开始的任何公开报道"

    - area: "利率路径: 永久高利率vs大幅降息"
      why_matters: "Rf变100bp→公允价值变$50+ | 永久高利率(25-30%概率)使评级从中性→审慎"
      monitor: "5Y Treasury(连续3月<3.0%=升级触发) | Fed dots | CPI趋势"

  sell_lessons:
    - scenario: "PE>35x且OEY Spread<7%时不卖→持有回报≈fair return(11%/年)"
      lesson: "垄断股的卖出纪律=OEY Spread阈值。品质不随PE变化但回报随Spread急剧变化"
      transferable: "所有CQI>60的垄断型公司(CME/SPGI/MCO/FICO/ICE)"
    - scenario: "管理层在PE>35x持续大额回购→价值毁灭累积→长期TSR跑输品质暗示水平"
      lesson: "回购效率是长期持有者的隐性成本。PE越高→回购越毁灭价值→应要求管理层转分红"
      transferable: "所有PE>25x且年回购>FCF 30%的公司"
    - scenario: "ESG保险化使S&C从28%增速降至6%→但不卖(因为Index仍好)"
      lesson: "多引擎公司的一个引擎衰退可能长期被忽略直到拖累整体估值。分引擎监控比整体PE更有效"
      transferable: "所有多引擎公司中有引擎半衰期差异>3x的情况"

