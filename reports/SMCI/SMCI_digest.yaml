# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含5Y CAGR 14%(共识30%打五折) + Terminal OPM 5.5% + GM 8-10%上限"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1~7双向对抗→识别Phase 1-3系统性偏空头3-5pp→CQ1从68%修正至63%,CQ3从62%修正至57%"

    - pattern_id: "scenario_analysis.probability_weighted_paths"
      application: "4路径情景(AI冠军$61/勤劳中间商$35/组装商宿命$15/崩溃$5) × 概率加权 = $33.9"

  novel_patterns:
    - name: "组装商估值陷阱(EV/GP vs EV/Sales)"
      description: "对GM<15%的组装商/分销商,EV/Sales系统性低估真实估值——必须用EV/GP衡量'为每单位增值支付多少'"
      transferable_to: ["所有低GM组装商(Flex/Jabil/Foxconn)", "分销商(Arrow/Avnet)", "EMS代工"]

    - name: "浪潮镜像(跨生态GM收敛验证)"
      description: "在不同芯片/市场/监管生态中找到相同产业链位置的公司,如果GM收敛则确认为行业结构性而非公司特异性"
      transferable_to: ["任何需要区分'公司问题'vs'行业问题'的利润率分析"]

    - name: "反向经营杠杆(边际GM<平均GM)"
      description: "计算边际GP贡献率并与平均GM比较——如果边际<平均,则规模增长在稀释而非提升利润率"
      transferable_to: ["依赖大客户的低毛利业务", "B2B大单驱动型公司"]

    - name: "护城河位置>护城河深度(BOM覆盖比例分析)"
      description: "护城河覆盖BOM比例决定其对利润结构的影响力——在价值链边缘(5-10% BOM)的强护城河不如在核心(70%+ BOM)的弱护城河"
      transferable_to: ["所有组件型/组装型公司", "供应链中间环节企业"]

    - name: "CEO交易记录信噪比>薪酬结构"
      description: "管理层实际SEC Form 4交易记录(买/卖频次+金额)的信息量远大于薪酬结构包装——言辞可包装,交易不会说谎"
      transferable_to: ["所有管理层评估", "特别是声称'利益一致'但有大额减持的公司"]

    - name: "不稳定均衡估值(概率加权收敛但情景极端分化)"
      description: "当多种估值方法高度收敛于市价($32-34)但底层情景离散度极高(276%,$5-$99),表明市价是'概率精确但方向不确定'的不稳定均衡——任何催化剂都会导致剧烈偏离"
      transferable_to: ["所有处于重大不确定性节点的公司(等待监管裁定/技术验证/客户验证)"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "护城河位置比深度更重要——SMCI在BOM 5-10%区域有强DLC护城河,但对总利润结构几乎无影响"
        implication: "护城河评估增加'BOM覆盖比例'维度: 护城河覆盖BOM<30%→降级其对利润和估值的影响权重"
      - insight: "零转换成本+标准化接口=市场份额从50%→7-10%的3年崩塌速度"
        implication: "当行业使用标准化接口(PCIe/NVLink)时,转换成本评分应直接给1/5——不要被'定制化'叙事误导"
      - insight: "速度优势(time-to-market)在每代GPU重置竞争时无法累积——每次都要重新证明"
        implication: "非累积性优势不构成护城河——评估时区分'可累积优势'(数据/网络效应)和'需重新证明优势'(速度/成本)"

    valuation_insights:
      - insight: "EV/GP对低GM公司是必须的主估值指标——EV/Sales系统性误导(23%便宜 vs 114%昂贵的翻转)"
        implication: "选股筛选中GM<15%的公司必须用EV/GP替代EV/Sales,否则会系统性买入'看似便宜实则昂贵'的组装商"
      - insight: "方法离散度46.6%+情景离散度276%='不稳定均衡'——不适合方向性押注,适合期权策略"
        implication: "当方法离散度>40%且方法中值≈市价时,不建仓(方向不确定)但可考虑跨式期权(波动确定)"
      - insight: "概率加权估值对概率分配极其敏感——5pp变化翻转投资结论"
        implication: "期望回报<5%时,概率加权估值框架的实用性下降——微小概率误判就足以翻转结论,应标注为'无人区'"

    screening_insights:
      - insight: "收入增长6倍+股价-55%=增收不增利的教科书案例——低GM+单一供应商依赖是价值陷阱信号"
        implication: "选股过滤器增加: GM<15% + 单一供应商采购占比>50% → 标记为'价值陷阱风险'即使收入高增长"
      - insight: "CEO 5年零买入=强负面信号——治理过滤器"
        implication: "选股增加'CEO交易记录'筛选: 股价YTD<-20%但CEO零买入 → 标记'管理层信心缺失'"
      - insight: "两次会计丑闻='惯犯模式'——第二次的折价应比第一次更高"
        implication: "治理筛选增加'惯犯系数': 单次丑闻折价10-15%; 两次15-25%; 三次排除"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "对低GM公司立刻切换到EV/GP估值"
      trigger: "GM<15%且EV/Sales看似极低"
      origin: "SMCI EV/Sales 0.75x(看似极便宜) → EV/GP 9.4x(实际溢价Dell 114%)"
      generalization: "GM越低,EV/Sales与真实估值的偏离越大。GM<15%时EV/Sales基本不可信"

    - habit: "计算边际GM而非仅看平均GM来诊断增长质量"
      trigger: "收入高速增长但利润率不升反降"
      origin: "SMCI Q2边际GM 4.3% < 平均GM 6.3% → 规模越大越不赚钱"
      generalization: "边际GM<平均GM=增长在稀释利润=价值破坏性增长。这比'GM下降'更精确地诊断问题"

    - habit: "用跨生态对照来区分公司问题和行业问题"
      trigger: "公司利润率恶化,需要判断是暂时还是永久"
      origin: "浪潮(Ascend生态)GM 6.85%与SMCI(CUDA生态)GM 6.3%收敛 → 行业结构性命运"
      generalization: "找不同芯片/平台/市场但相同产业链位置的对照公司——GM收敛=行业宿命,GM分化=公司特异"

    - habit: "追问护城河覆盖BOM的比例"
      trigger: "公司声称有技术差异化/护城河"
      origin: "SMCI DLC护城河强但仅覆盖BOM 5-10% → 对总GM贡献仅1.5-3pp → 护城河在错误维度"
      generalization: "护城河的位置(覆盖BOM比例)比深度更重要——在BOM边缘的强护城河可能毫无意义"

    - habit: "查CEO实际交易记录而非薪酬叙事"
      trigger: "管理层声称利益一致/对公司有信心"
      origin: "SMCI CEO $1薪酬(叙事=利益一致) vs 5年23卖0买(现实=零信心) + 关联方$983M"
      generalization: "SEC Form 4是管理层真实信心的最高信噪比信号。言辞免费,交易有成本"

  quality_feedback:
    strengths:
      - "CI-01组装商估值陷阱——全报告最强非共识洞见,具有行业通用方法论价值"
      - "CI-02浪潮镜像——独创的跨生态验证方法,说服力极强"
      - "红队7轮双向对抗有效——识别并修正Phase 1-3的系统性偏空头3-5pp"
      - "CQ框架演化追踪完整——5个CQ从P0到P5的置信度变化路径清晰可审计"
      - "因果链密度高——每个核心论点都有数据+逻辑+反面考量"
    weaknesses:
      - "DM密度0.56/千字偏低(警告区间)——187个DM锚点对333K报告不够密"
      - "DOJ概率分配为D级数据质量——概率加权估值的核心输入最主观"
      - "DCF对负FCF公司适用性有限——$21.8与其他方法偏离35%已知但未充分解决"
      - "报告头部评级/公允价值字段显示'待确定'未回填——组装时前后一致性问题"

  hypothesis_tested:
    confirmed:
      - hypothesis: "低GM组装商的EV/Sales系统性误导(新假说)"
        evidence: "EV/Sales显示SMCI便宜23%,EV/GP显示贵114%——方向完全翻转"
        confidence_after: "高(数学推导+Dell/HPE/Flex四家对比确认)"

      - hypothesis: "Reverse DCF P1前置有效防止结论先行(铁律O)"
        evidence: "Ch12 Reverse DCF有效建立了市场隐含假设的客观锚点,防止了'看多叙事主导'"
        confidence_after: "高(继CME后再次执行确认)"

    extended:
      - hypothesis: "护城河评估需要量化'位置'维度"
        extension: "从CME的'护城河在正确维度(清算=核心)'扩展到SMCI的'护城河在错误维度(DLC=边缘)' → 引入BOM覆盖比例量化"

    refuted: []

  limitations:
    - "DOJ调查结果不可预测——40-45%/40-45%/10-15%概率分配是D级主观判断,5pp误差可翻转结论"
    - "Q3 FY26 GM是全报告的硬分叉点,但报告无法预测其值——需等待2026-05-05数据"
    - "NVIDIA内部GPU分配策略是商业机密——SMCI的Tier 2B状态是否可逆无法从外部判断"
    - "DCF在负FCF公司上失灵——$21.8偏离其他方法35%,DCF结果应降权"
    - "自研芯片替代速度$51-71B为C级数据——Hyperscaler自研进展对SMCI的间接影响高度不确定"
    - "治理折价15-25%基于5个历史案例类比推断,样本量过小且无惯犯先例,置信区间极宽"
