    - signal: "分析师目标价中位($43)"
      why_noise: "卖方目标价行动滞后于基本面恶化(先调价后调级);多数使用EV/Sales而非EV/GP=系统性偏乐观"

# --- Layer 3: 关系网络 (内积保真) ---
