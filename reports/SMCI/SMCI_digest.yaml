      key_difference: "Dell=全平台(品牌+服务+渠道30%+收入) vs SMCI=纯组装(速度+DLC但GM 6% vs Dell ISG 10%+) | Dell护城河在利润高区域,SMCI在利润低区域"

    - ticker: "浪潮信息(Inspur)"
      similarity: "GPU服务器组装商,不同生态(Ascend vs CUDA)但相同产业链位置"
      key_difference: "浪潮GM从6.85%→3.45%=SMCI的前瞻性样本 | CI-02跨生态验证的核心参照"

    - ticker: Flex
      similarity: "EMS代工/组装,类似低GM profile(7.8%)"
      key_difference: "Flex EV/GP 6.6x < SMCI 9.4x | Flex更多元化,不依赖单一供应商"

  comparative:
    - dimension: "毛利率/增值能力"
      position: "Dell ISG (~22%) > HPE (~31%) > SMCI (~8%) ≈ 浪潮 (~6.85%) > Foxconn (~5%)"
      reasoning: "SMCI的GM正在向纯EMS代工水平收敛——产业链位置而非管理能力决定GM天花板"

    - dimension: "护城河深度"
      position: "Dell (品牌+服务+渠道) >> HPE (企业关系) > SMCI (DLC+速度) > ODM (纯成本)"
      reasoning: "Dell在9个维度中7个等于或超过SMCI,且强势区域利润贡献更高"

    - dimension: "EV/GP估值(真实估值)"
      position: "SMCI (9.4x) > Flex (6.6x) > Dell (4.4x) > HPE (3.2x)"
      reasoning: "增速调整后SMCI溢价7-40%而非114%——但增速放缓后溢价将扩大"

    - dimension: "治理质量"
