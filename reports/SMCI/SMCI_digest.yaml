      current_reading: "EV/GP 9.4x vs Dell 4.4x — 在FY26超高增速下勉强合理,FY27+增速放缓后将显得昂贵"
    - signal: "边际GM vs 平均GM(反向经营杠杆检测)"
      why_alpha: "大多数分析师只看平均GM趋势而不计算边际GM——边际GM 4.3%<平均6.3%暴露了增长的价值破坏性质"
      current_reading: "Q2 FY26边际GM 4.3%(需Q3验证是否为积压脉冲异常)"
    - signal: "CEO Form 4交易记录(5年23卖0买)"
      why_alpha: "市场关注$1薪酬的叙事而忽视实际交易——交易记录的信息量远大于薪酬结构"
      current_reading: "6个月卖出$36.8M | 股价-73%时仍零买入=极强负信号"

  confirmation_signals:
