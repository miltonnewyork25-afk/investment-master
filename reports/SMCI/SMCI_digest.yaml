# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "组装商估值陷阱的识别逻辑(CI-01)"
    chain: >
      观察: EV/Sales 0.75x看似极便宜
      → 追问: 收入中多少是SMCI自己的增值?
      → 发现: GM仅8%=92%收入是GPU过路资金(COGS)
      → 因此: 投资者实际购买的是GP而非Revenue
      → EV/GP = $20.3B/$2.16B = 9.4x
      → Dell EV/GP = $93.1B/$21.3B = 4.4x
      → 结论: EV/Sales显示SMCI比Dell便宜23%; EV/GP显示SMCI比Dell贵114%
      → 投资含义: 对低GM公司,EV/Sales是系统性误导指标,必须用EV/GP
    transferable_to: "所有GM<15%的组装商/分销商/EMS代工: Flex/Jabil/Foxconn/伟创力等"
    reasoning_habit: "看到EV/Sales极低时,立刻追问'收入中多少是自己的增值' — GM越低,EV/Sales越不可信,必须切换到EV/GP"

  - id: "CC-2"
    name: "浪潮镜像——跨生态GM收敛确认行业宿命(CI-02)"
    chain: >
      问题: SMCI的GM从18%降至6.3%是暂时的还是永久的?
      → 寻找独立验证: 浪潮信息(不同芯片Ascend/不同市场中国/不同监管)
      → 发现: 浪潮GM从6.85%进一步降至3.45%
      → 关键推理: 不同芯片+不同市场+不同监管 → 相同的GM 6-7%
      → 排除公司特异性: 不是SMCI的管理问题,是组装商的结构性命运
      → 均衡GM应设定为8-10%上限/5-7%下限,而非共识的12-15%恢复
    transferable_to: "任何需要验证利润率压缩是公司特异还是行业结构时——在不同生态/市场找到独立样本比较"
    reasoning_habit: "当一家公司利润率恶化时,找一个不同生态但相同行业位置的公司对照——如果收敛,说明是行业结构而非公司问题"

  - id: "CC-3"
    name: "反向经营杠杆——规模越大越不赚钱(CI-03)"
    chain: >
      传统假设: 收入增长→固定成本分摊→OPM提升(正向经营杠杆)
      → 检验: Q2 FY26收入$12.68B(环比+153%)但GM从9.3%降至6.3%
      → 边际收入GP贡献率: (Q2 GP - Q1 GP)/(Q2 Rev - Q1 Rev) = ~4.3%
      → 4.3%远低于平均6.3% → 边际收入的利润率更低
      → 原因: 大订单(Hyperscaler)议价权极端不对称+积压订单以更低价签约
      → 结论: 这不是正向经营杠杆而是反向经营杠杆——收入增长加速利润率下降
    transferable_to: "所有依赖大客户的低毛利业务——检查边际GM vs 平均GM,如果边际<平均=增长在稀释利润"
    reasoning_habit: "不要假设收入增长自动改善利润率——计算边际GP贡献率,如果<平均则增长是价值破坏性的"

  - id: "CC-4"
    name: "护城河在错误维度的BOM构成分析"
    chain: >
      SMCI有两个差异化: DLC液冷(BOM 5-10%) + 速度/模块化(BOM ~5%)
      → 合计可影响BOM ~10-15%
      → GPU占BOM 75%,定价权100%在NVIDIA
      → 即使DLC实现30% GM(极乐观),对总GM贡献仅30%×5-10% = 1.5-3pp
      → 所以DLC将GM从6-7%提升至8-10%而非15%+
      → 对比: Dell的优势维度(品牌/服务/渠道)利润贡献更高+持久性更强
      → 结论: 护城河的位置比护城河的深度更重要——在价值链边缘的护城河无法改变利润结构
    transferable_to: "所有组件型/组装型公司——检查护城河覆盖的BOM比例,如果<30%则护城河难以改变利润结构"
    reasoning_habit: "评估护城河时,追问'这个优势影响BOM的多少比例' — 在价值链边缘的强护城河不如在核心的弱护城河"

  - id: "CC-5"
    name: "CEO言行不一致作为治理风险的高信噪比信号(CI-04)"
    chain: >
      表面叙事: CEO $1年薪 → 利益一致
      → 检验: 5年交易记录 — 23次卖出、0次买入、6个月卖出$36.8M
      → 矛盾: 如果CEO真信$32是极度低估,为什么不买入?
      → 加重: 关联方交易$983M(Ablecom/Compuware)
      → 推论: $1薪酬是叙事管理而非利益一致
      → 投资含义: CEO内部人交易记录是治理质量的高信噪比信号——言辞可以包装,交易不会说谎
    transferable_to: "所有管理层声称'利益一致'但实际交易记录矛盾的公司——看Form 4而非PR"
    reasoning_habit: "看到管理层发出利好信号(低薪/增持声明)时,立刻查SEC Form 4实际交易记录——如果言行不一致,信交易不信言辞"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "EV/Sales 0.75x意味着SMCI极度低估"
      final: "EV/GP 9.4x显示SMCI比Dell贵114%——极低EV/Sales是低GM公司的结构性幻觉"
      pivot: "CI-01组装商估值陷阱: 92%收入是GPU过路资金,仅8%是增值"

    - initial: "Phase 1-3对GM结构性恶化的判断是准确的"
      final: "红队校准后CQ1从68%下调至63%——Phase 1-3可能将Q2 6.3%过度外推为新常态"
      pivot: "RT-1+RT-2+RT-3+RT-7均指向CQ1过度悲观; Q2含积压释放脉冲+大客户价格锁定的异常性"

    - initial: "DOJ刑事起诉概率20%"
      final: "红队校准后I3(刑事起诉)概率下调至10-15%,I1(不起诉)上调至40-45%"
      pivot: "特别委员会9000+小时调查结论有利 + NASDAQ已恢复合规 + DOJ 2年无公开动作暗示证据不够强"

  surprises:
    - finding: "收入4年增长6倍($3.6B→$40B)但2年股价回报-55.84%——增长完全真实但价值为零"
      implication: "这是'增收不增利'的教科书极端案例——GPU供应链位置决定了收入增长无法转化为股东价值"

    - finding: "边际GM仅4.3%(Q2 FY26),远低于平均GM 6.3%——反向经营杠杆的完美数据证据"
      implication: "传统'规模→利润改善'逻辑完全失效; 大订单议价权不对称使增长成为价值破坏而非创造"

    - finding: "浪潮信息在完全不同生态(华为Ascend芯片/中国市场)下GM收敛至6.85%→3.45%——与SMCI命运惊人一致"
      implication: "组装商GM<10%是产业链位置决定的结构性命运,而非公司/生态/市场的特异性问题"

    - finding: "市场份额从50%暴跌至7-10%(3年)但收入绝对值仍在增长——TAM增速掩盖了份额崩塌"
      implication: "在高速增长的市场中,份额下降可以被总量增长掩盖——不能只看收入增长,必须看份额趋势"

  blind_spots:
    - area: "DOJ调查最终结果"
      why_matters: "D级数据质量的概率分配(40-45%/40-45%/10-15%)是整个估值框架最主观的输入——5pp概率误判就足以翻转投资结论"
      monitor: "SEC/DOJ公告 | PACER法院系统 | 10-Q法律风险披露变更"

    - area: "Q3 FY26 GM——Q2的6.3%是底部还是新常态"
      why_matters: "GM是全报告的硬分叉点: >9%可能触发评级升级至'关注'; <6%可能降至'审慎关注'"
      monitor: "Q3 FY26财报(2026-05-05)——管理层指引+30bps至~6.6%"

    - area: "NVIDIA DGX Cloud发展轨迹和前向整合意愿"
      why_matters: "如果NVIDIA跳过OEM直销Hyperscaler,SMCI集成商角色彻底失效——收入2-3年萎缩40-60%"
      monitor: "NVIDIA GTC | NVIDIA财报DGX Cloud收入 | 行业渠道信息"

    - area: "Hyperscaler自研芯片替代GPU的速度"
      why_matters: "Google TPU/Amazon Trainium/Microsoft Maia等自研芯片可能绕过NVIDIA→绕过SMCI,估算$51-71B但C级数据"
      monitor: "Hyperscaler财报中自研芯片部署进度 | NVIDIA数据中心收入增速变化"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "收入高速增长但毛利率持续下降时未减仓——增收不增利的陷阱"
      lesson: "收入增长不等于价值创造。对低GM组装商,必须追踪边际GM而非总收入——边际GM<平均GM=增长在毁灭价值"
      transferable: "所有低GM(<15%)的分销/组装/代工公司(Flex/Jabil/Foxconn/伟创力)"
    - scenario: "CEO持续减持但市场忽视——从$118跌至$32期间CEO零买入23次卖出"
      lesson: "管理层内部交易记录是治理质量的最高信噪比信号。如果CEO在股价暴跌时不买反卖,这比任何分析师评级都更有信息量"
      transferable: "所有CEO/CFO内部交易与股价走势矛盾的公司"
    - scenario: "市场份额从50%暴跌至7-10%但因TAM增长收入仍涨——份额崩塌被总量掩盖"
      lesson: "高速增长市场中,必须同时追踪绝对收入和市场份额。只看收入增长会错过竞争力恶化的信号"
      transferable: "所有处于高速增长行业(AI/EV/云)但面临竞争加剧的公司"

# --- Layer 2.5: 信号分级 (v1.2新增) ---
