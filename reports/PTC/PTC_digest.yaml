      - insight: "R&D/Revenue是AI竞争力的前瞻指标——最低的公司在3-5年后面临最大竞争风险"
        implication: "筛选时增加'R&D强度'下限: 同业R&D排名末位→标记AI竞争风险"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "PE折价三步验证(EV/FCF→PEG→分解来源)"
      trigger: "任何公司PE看起来比可比便宜>15%"
      origin: "PTC PE 19x vs ADSK 27x看似28%折价→EV/FCF几乎相同→幻觉"
      generalization: "有债务/高SBC/利润率结构差异的公司, PE系统性失真→必须用现金流指标验证"

    - habit: "拆解SaaS转型中的增速成分"
      trigger: "ARR增速>7%的SaaS转型公司"
      origin: "PTC ARR 8.5% = 有机3.9%+迁移提价2.5pp+新产品2.1pp → 剔除一次性后增速减半"
      generalization: "所有永久→订阅转型公司的增速都应拆分: 有机+迁移提价+收购→迁移终将归零"

    - habit: "用下行beta而非平均beta选WACC"
      trigger: "SaaS财务特征但客户是周期性行业"
      origin: "PTC下行beta 2.09(工业股)vs上行beta<1.0(SaaS)→非对称→用下行beta"
      generalization: "'软件壳+周期核'公司的风险被低估如果用平均beta→下行beta是更诚实的风险衡量"

    - habit: "护城河分层(制度vs商业)量化估值底"
      trigger: "B2B软件公司有合规驱动的客户(国防/医疗/金融)"
      origin: "PTC 40-45% ARR制度嵌入→零增长永续$10.4B→下行有底"
      generalization: "合规型B2B软件的估值底部=制度嵌入ARR的永续贴现, 比一般SaaS高得多"

