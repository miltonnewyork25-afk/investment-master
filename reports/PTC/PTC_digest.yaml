    - claim: "护城河双层蛋糕: 底层(制度嵌入55-60%)几乎不可替代, 表层(商业嵌入40-45%)替代成本3-9x年付费"
      direction: bullish
      magnitude: 5
      mechanism: "ITAR(国防)+EU MDR(医疗器械)法规强制使用 → 40-45% ARR受制度保护 → 零增长永续值$10.4B(EV的54%)"
      kill_switch: "法规变更允许替代产品通过合规(极低概率) | 国防/医疗占比因其他行业增速更快而被稀释"

    - claim: "有机增速剔除SaaS迁移提价后仅3.9%, 迁移跑道剩余3-4年"
      direction: bearish
      magnitude: 4
      mechanism: "SaaS迁移提价贡献~2.5pp → 迁移65%完成 → FY2028后迁移提价贡献<1pp → ARR增速从8.5%缓降至6%"
      kill_switch: "Deferred ARR 3x兑现 → FY2027 ARR加速到11%+ | AI附加模块创造新提价来源1-2pp"

    - claim: "WACC是决定性变量: 9.5%(工业股)→审慎 vs 8.5%(SaaS)→中性, 1%差异=$22/sh(15%)"
      direction: conditional
      magnitude: 4
      mechanism: "下行beta从2018年1.28升至最近2.09 → 市场越来越把PTC当工业股定价 → 9.5% WACC合理甚至偏低"
      kill_switch: "Fed降息>150bp + PTC证明ARR在衰退中韧性(下行beta降至<1.0) → 市场重分类为SaaS"

    - claim: "回购效率η=0.51: EPS增长71%来自回购, 仅29%来自业务增长"
      direction: bearish
      magnitude: 3
      mechanism: "FCF Yield 4.8% < WACC 9.5% → 每$1回购仅创造$0.51价值 → 但回购是'最不坏的选择'(无更好配置)"
      kill_switch: "股价跌至$75(FCF Yield>9.5%) → η>1 → 回购变高效"

  moat:
    composite_score: 7.25
    half_life: "制度嵌入(A&D/医疗): >20年 | 商业嵌入(汽车/工业): 10-15年 | 技能锁定(CAD): 5-8年(代际衰减)"
