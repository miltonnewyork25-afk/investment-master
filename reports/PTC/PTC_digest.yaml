    entry_zone: "$110-125(DCF Base-SOTP区间, EV/FCF 16-18x)"
    catalyst: "FY2027 Q1 ARR>10%(Deferred ARR兑现) 或 Fed累计降息>150bp(WACC效应) 或 收购事件(30-40%溢价)"

