        evidence: "五层嵌入叠加: 技能$1-2M+数据$3-5M+流程$10-15M+合规$5-20M+生态$2-5M = 总替代成本$21-47M vs 年付费$5-15M = 3-9x"
        vulnerability: "新项目时客户可选竞品(增量市场护城河弱于存量市场)"
      - type: regulatory
        strength: 5
        evidence: "ITAR(国防)+EU MDR(医疗)+CMMC 2.0(国防供应链) → 40-45% ARR受制度保护, 合规追溯链断裂成本$50-100M"
