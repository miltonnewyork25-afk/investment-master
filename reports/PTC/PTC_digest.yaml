      transferable_to: ["所有有债务/高SBC/非现金摊销的软件公司", "PE看似便宜的价值陷阱候选"]

    - name: "护城河双层蛋糕(制度嵌入vs商业嵌入)"
      description: "将护城河按'法规强制(不可选择)'和'商业选择(可替代)'分层→制度嵌入部分按零增长永续贴现=估值硬底"
      transferable_to: ["国防IT(ITAR)", "医疗IT(FDA/EU MDR)", "金融合规(SOX/Basel)", "所有B2B合规软件"]

    - name: "SaaS迁移提价拆分(一次性vs可持续增速)"
