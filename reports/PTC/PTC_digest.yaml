  key_arguments:
    - claim: "PE折价28%是会计幻觉——EV/FCF 22.3x vs ADSK 22.6x几乎相同, PEG均为2.3x"
      direction: bearish
      magnitude: 5
      mechanism: "PE差异来自资本结构(40%)+SBC差异(30%)+增速差异(30%) → EV/FCF中和后无折价 → '便宜'是错觉"
