      transferable_to: ["所有永久→订阅转型中的软件公司"]

    - name: "下行beta非对称性(工业SaaS身份争议)"
      description: "财务像SaaS但下行像工业股→用下行beta选WACC→身份认知争议直接决定估值"
      transferable_to: ["工业SaaS/金融科技/能源科技等'软件壳+周期性核'公司"]

    - name: "回购η函数应用(低FCF Yield下的价值毁灭)"
      description: "η = FCF Yield / WACC → η<1时回购毁灭价值, 但可能仍是'最不坏的选择'"
      transferable_to: ["所有PE>20x且积极回购的软件公司"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "护城河应按'制度嵌入(法规强制)'和'商业嵌入(客户选择)'分层评估——两者持久性差10x+"
        implication: "护城河估值不应给统一分数, 应分层计算→制度嵌入按基础设施(永续)估值, 商业嵌入按SaaS(有增速)估值"
      - insight: "五层嵌入叠加(技能→数据→流程→合规→生态)创造了替代成本/年付费3-9x的超级锁定"
        implication: "评估软件护城河时, 逐层量化替代成本→单层弱不致命, 多层叠加才是真壁垒"

    valuation_insights:
      - insight: "PE折价必须用EV/FCF和PEG三步验证——PE独立看可能100%是会计幻觉"
        implication: "选股/估值时, 永远不要仅凭PE折价做判断→EV/FCF+PEG交叉验证是必须步骤"
      - insight: "WACC是工业SaaS估值的决定性变量——1%差异=15%估值差距"
        implication: "对'软件壳+周期核'公司, WACC选择比增速假设更影响结论→下行beta分析必须前置"

    screening_insights:
