# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "PE折价会计幻觉的识别逻辑"
    chain: >
      观察: PTC Forward PE 19.4x vs ADSK ~27x → 看似28%折价
      → 追问: 同样的业务为什么PE差这么多?
      → 分解: 资本结构差异(PTC净债务$1.2B vs ADSK净现金)贡献~40%
      → SBC差异(PTC 7.9% vs ADSK 10.9%)贡献~30%
      → 增速差异(PTC 8.5% vs ADSK 12%)贡献~30%
      → 验证: EV/FCF(22.3x vs 22.6x)中和了资本结构和SBC差异→几乎相同
      → 验证: PEG(2.3x vs 2.3x)中和了增速差异→完全相同
      → 结论: PE折价不是真折价, 市场定价已经精确, 以PE低为买入理由=为会计幻觉买单
    transferable_to: "所有PE看起来比可比公司便宜的情况——必须用EV/FCF和PEG交叉验证PE折价的真实性"
    reasoning_habit: "看到PE折价时, 立刻做三步验证: (1)EV/FCF是否也折价 (2)PEG是否也折价 (3)分解PE差异的来源(结构/SBC/增速/风险)"

  - id: "CC-2"
    name: "五层制度嵌入如何创造估值底部"
    chain: >
      PTC 40-45% ARR来自A&D(30-35%)和医疗器械(8-10%)
      → 这些行业受ITAR/EU MDR/CMMC法规强制
      → 合规追溯链断裂成本$50-100M >> 年付费$5-15M
      → 即使PTC产品变差, 客户也无法在不违反法规的情况下迁移
      → 40-45% ARR按零增长永续贴现(WACC 9.5%) = $10.4B
      → 仅制度嵌入部分就支撑EV的52-58%
      → 即使表层(商业嵌入)全部流失, 底层仍在
      → PTC的下行底部比一般SaaS公司高得多
    transferable_to: "所有受合规法规保护的B2B软件(医疗IT/国防IT/金融合规) — 分层评估制度嵌入vs商业嵌入的占比"
    reasoning_habit: "评估护城河时区分'制度嵌入(法规强制)'和'商业嵌入(客户选择)' — 两者的持久性和下行保护完全不同"

  - id: "CC-3"
    name: "SaaS迁移提价是一次性红利而非永续增长"
    chain: >
      PTC ARR增速8.5% = 有机3.9% + 迁移提价2.5pp + 新产品2.1pp
      → SaaS迁移已完成65%, 剩余3-4年跑道
      → 迁移提价从2.5pp逐年递减至FY2030的0.2pp
      → 需要新引擎(AI提价+Codebeamer合规)替代, 但置信度中等
      → ARR增速从8.5%→6.2%是'斜坡'非'悬崖', 但市场隐含8% FCF CAGR在FY2028后需OPM扩张补偿
      → Forward PE 19.4x可能不是折价, 而是市场正确定价了迁移红利窗口期
    transferable_to: "所有经历商业模式转型(永久→订阅/on-prem→SaaS)的软件公司 — 迁移提价贡献必须单独拆解, 不计入有机增速"
    reasoning_habit: "看到高增速SaaS转型公司, 追问'增速中有多少是迁移提价(一次性) vs 真实有机(可持续)' — 迁移提价终将归零"

  - id: "CC-4"
    name: "下行beta揭示身份认知争议"
    chain: >
      PTC财务特征像SaaS(95%经常性+84%毛利率+31% FCF margin)
      → 但下行beta从2018年1.28加速到最近2.09
      → 下跌时表现像工业股(beta>1), 上涨时表现像SaaS(beta<1)
      → 非对称风险特征 → 估值应用下行beta定价
      → WACC 9.5%(工业股)而非8.5%(SaaS)
      → 1%的WACC差异=$22/sh(15%估值差距)
      → 评级取决于'你认为PTC更像工业股还是SaaS' — 这不是对错问题, 是投资哲学
    transferable_to: "所有'软件壳+周期性核'的公司(工业SaaS/金融科技/能源科技) — 用下行beta而非上行beta选择WACC"
    reasoning_habit: "看到SaaS指标好但客户周期性强的公司, 分析上行和下行beta是否对称 — 不对称时用下行beta定价风险"

  - id: "CC-5"
    name: "温水煮青蛙: 最危险的场景不触发任何单一预警"
    chain: >
      Siemens每年PLM蚕食1-2%市占 + AI领先12-18月 + PTC R&D最低(16.7%)
      → 每季度ARR增速仅降0.3-0.5pp → 从8%到5%需5年
      → 每季度看起来'还行', 管理层说'下一季度会好转'
      → 5年累计: 股价-30~37%, 年化-7~-9%
      → 不触发任何单一KS信号 → 投资者反复补仓 → 价值陷阱
      → 检测方法: 用趋势线而非阈值 — 连续4Q增速环比下降即使绝对值>7%也应警惕
    transferable_to: "所有面临强大竞争对手慢性蚕食的市场#2/#3公司 — 温水煮青蛙比急性冲击更危险"
    reasoning_habit: "对市场#2/#3公司, 除了设KS阈值, 还要设趋势线检测 — 4Q连续环比下降=温水煮青蛙早期信号"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "PE 19x比ADSK 27x便宜28% → PTC被低估"
      final: "EV/FCF 22.3x≈ADSK 22.6x, PEG 2.3x=2.3x → PE折价是会计幻觉, 不存在真实折价"
      pivot: "分解PE差异: 资本结构(40%)+SBC(30%)+增速(30%) → EV/FCF中和后差异消失"

    - initial: "ARR增速8.5%是健康的中高增速"
      final: "有机增速仅3.9%, 迁移提价贡献2.5pp是一次性红利, 3-4年后消退"
      pivot: "定价权分层加权(F500 4.5%+中端4%+SMB 0%)=3.9% → 与8.5%差距全部来自迁移提价+新产品"

    - initial: "FY2025 OPM 35.9%是SaaS转型收割期的新常态"
      final: "35.9%含ASC 606时点效应和Q4季节性, 正常化Pro-forma约33-34%"
      pivot: "FY2026共识OPM仅26.4%(含IoT剥离), Pro-forma正常化33-34%更接近真实水平"

  surprises:
    - finding: "护城河价值占EV 54-80%——即使零增长也支撑$10.4B EV"
      implication: "PTC的下行主要来自增长期望重定价而非业务崩溃→Bear Case底部$95-107而非归零"

    - finding: "回购贡献EPS增长的71%——业务增长仅贡献29%"
      implication: "EPS CAGR 8%中5.7pp来自回购→EPS增长质量低→不应给高PE"

    - finding: "Onshape教育pipeline 1.5M学生/年的直接ARR贡献仅$6-12M(0.3-0.5%)"
      implication: "教育渗透的短期价值被严重高估, 真正价值是5-10年的代际替代(类似Solidworks 2000年代击败Pro/ENGINEER的历史)"

    - finding: "PTC R&D/Revenue 16.7%是四家可比公司中最低——CDNS 33.4%, ADSK 22%, DASTY 24.3%"
      implication: "短期OPM好看, 但长期AI竞争力存在系统性隐患→Siemens AI Copilot领先12-18个月的根因"

  blind_spots:
    - area: "产品级ARR(CEO沉默域)"
      why_matters: "不知道PLM/CAD/Onshape/Codebeamer各自ARR→无法验证增长故事→只能看总ARR"
      monitor: "管理层是否开始披露Onshape ARR(>$200M时没理由不展示)"

    - area: "SaaS迁移精确进度"
      why_matters: "迁移完成65%是推断值→实际可能50%或75%→直接影响剩余跑道估算"
      monitor: "PTC是否在投资者日披露SaaS渗透率数据"

    - area: "FY2026 Pro-forma OPM真实水平"
      why_matters: "33-34%还是26-28%决定了估值差$15-20/sh"
      monitor: "FY2026 Q2(Mar 2026季度)=首个完全不含IoT的报告→Pro-forma OPM答案"

  sell_lessons:
    - scenario: "PE看起来便宜但EV/FCF与可比相同→以为是折价其实是会计幻觉"
      lesson: "永远用EV/FCF和PEG交叉验证PE折价→如果只有PE便宜, 不是真便宜"
      transferable: "所有有债务/高SBC/非现金摊销的软件公司→PE系统性失真"
    - scenario: "SaaS迁移提价推高ARR增速→以为是有机增长"
      lesson: "拆解增速中的一次性成分(迁移提价) vs 可持续成分(有机+新产品)→迁移终将结束"
      transferable: "所有永久→订阅转型中的软件公司(Adobe, Autodesk历史, PTC当前)"
    - scenario: "温水煮青蛙: 每季度微miss但5年累计-30%"
      lesson: "设趋势线检测而非仅阈值——连续4Q增速环比下降是最早的预警"
      transferable: "所有市场#2/#3面临慢性蚕食的公司"

