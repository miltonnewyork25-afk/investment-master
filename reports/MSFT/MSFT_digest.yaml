# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→$3T倒推8项隐含信念→逐一反演失败条件+估值影响→B6为终端汇聚节点"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1至RT-7七维红队 + 六项偏差审计(锚定/确认/过度悲观/叙事/幸存者/过度自信)→净偏悲观2-4pp"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "S2 CapEx正常化(38%概率): CapEx渐进降速→D&A滞后传导→FCF缓慢恢复→非事件驱动的渐进修复路径"

  novel_patterns:
    - name: "CapEx→D&A→OPM→FCF四层传导链量化"
      description: "将CapEx投入映射到3-5年D&A传导路径, 量化OPM谷底时间(FY28)和幅度(-4pp), 以及FCF恢复条件(收入增速>D&A增速的赛跑)"
      transferable_to: ["META(AI/元宇宙CapEx)", "GOOG(TPU扩张)", "AMZN(AWS+物流CapEx)", "所有重资本投入周期的科技公司"]

    - name: "承重墙三层架构(W1/W2/W3)与脆弱度量化"
      description: "将$3T市值分解为三堵独立承重墙: W1 Azure($1.2T/40%), W2 Office($1.0T/33%), W3 CapEx→FCF($0.8T/27%), 按关联KS密度评估脆弱度"
      transferable_to: ["所有多业务线Mega-cap公司"]

    - name: "信念因果网络的终端汇聚节点识别"
      description: "8项信念构成因果网络, B6(FCF恢复)是4入1出的终端汇聚节点——所有其他信念失败最终传导至B6, 简化监控至2个代理变量(CapEx/Rev + FCF Margin)"
      transferable_to: ["所有多信念估值框架的复杂度降维"]

    - name: "Azure两速分离(AI vs 非AI增速拆分)"
      description: "将Azure增速拆分为AI贡献(约13pp)和非AI有机增速(约22%), 发现非AI增速在加速(co-migration), 单独支撑$1T+估值"
      transferable_to: ["AWS(AI vs 传统云拆分)", "GCP(Gemini vs 传统云拆分)", "所有含AI业务的云平台"]

    - name: "叙事放大器量化(财务影响×3-4x)"
      description: "Copilot直接财务贡献仅占总收入2%, 但作为AI货币化能力的证明信号, 估值影响是财务影响的3-4倍——量化了叙事通道vs利润通道的杠杆比"
      transferable_to: ["所有早期AI货币化的科技公司"]

    - name: "WACC作为评级最大单一杠杆的量化证明"
      description: "WACC从9.0%到10.0%→期望回报从+19%到-8.7%→跨越两个评级区间。证明在不确定性高的环境下, 折现率假设比基本面分析的边际信息贡献更大"
      transferable_to: ["所有高不确定性(方法离散度>2x)的公司估值"]

  framework_contributions:
    moat_insights:
      - insight: "四层嵌套锁定的非线性迁移成本: 每多一层锁定, 迁移成本非线性增长而非简单叠加"
        implication: "护城河评估应检测嵌套层数和层间耦合度, 而非单独评估每层强度"
      - insight: "价格弹性-0.2是企业软件锁定深度的最佳量化指标: 涨价15%仅损失3%需求"
        implication: "定价权评估可直接用价格弹性系数——<0.3为强锁定"

    valuation_insights:
      - insight: "承重墙三层架构将Mega-cap估值从单一数字分解为W1/W2/W3独立评估→每堵墙有独立KS和脆弱度"
        implication: "大型公司估值应先拆分承重墙再独立评估, 而非给出单一EV→避免遗漏结构性风险"
      - insight: "WACC是高不确定性公司估值的决定性参数——WACC±100bps的影响>所有基本面变量的合计影响"
        implication: "在方法离散度>2x的公司中, 应优先讨论WACC合理性而非基本面细节"

    screening_insights:
      - insight: "CapEx/Revenue拐点是科技股P/E变动的最强领先信号(MSFT从13%→26%对应P/E从38x→25x)"
        implication: "选股筛选增加'CapEx/Revenue变化率'指标——变化率>5pp/年且向上→P/E压缩风险"
      - insight: "P/E Mega5最低+OPM Mega5最高=质量折价信号——可能是逆向投资机会或价值陷阱"
        implication: "筛选'品质指标vs估值指标背离'的公司——高品质+低估值=等待CapEx验证的条件机会"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "看到CapEx激增时, 立刻追问D&A传导时间表和OPM谷底"
      trigger: "CapEx/Revenue YoY变化>5pp"
      origin: "MSFT CapEx从13%→26%→D&A滞后3-5年→OPM谷底FY28 42%"
      generalization: "CapEx的利润率影响不在投入年而在折旧年——分析重资本投入必须建D&A传导模型"

    - habit: "区分叙事影响和财务影响, 量化叙事杠杆比"
      trigger: "某产品/业务的市场关注度远超其收入贡献"
      origin: "Copilot仅占收入2%但估值影响3-4x——叙事放大器效应"
      generalization: "早期AI/创新产品的估值分析应分离'叙事通道'和'利润通道'——叙事恐慌/狂热创造的价格偏离可能远大于基本面"

    - habit: "用Reverse DCF先翻译市场信念, 再找因果网络的终端汇聚节点简化监控"
      trigger: "分析Mega-cap公司时面对信息过载"
      origin: "8项信念简化为2个代理变量(CapEx/Rev + FCF Margin)——因为B6是终端汇聚节点"
      generalization: "复杂信念网络可以通过拓扑分析找到1-2个代理变量——节省90%的监控精力"

    - habit: "单季极端数据用TTM校正, 避免被季度噪音影响判断"
      trigger: "单季度数据与TTM/年化数据出现>50%的偏差"
      origin: "Q2 FCF $5.9B(恐慌) vs TTM $77.4B(健康)——CapEx集中交付扭曲"
      generalization: "CapEx高波动行业必须用TTM而非单季做判断——季度波动是噪音, 年度趋势是信号"

  quality_feedback:
    strengths:
      - "DM密度2.28/千字(优秀) — 721个DM锚点, 数据锚定极扎实"
      - "Reverse DCF→8项信念反演→因果网络拓扑分析 — 方法论严谨"
      - "估值独立性审计(五方法→三锚)识别伪收敛 — 估值框架创新"
      - "16个Kill Switch + 10个Tracking Signal的完整监控体系"
      - "CI注册表10个非共识洞察, 按证据强度/估值影响排优先级"
    weaknesses:
      - "v10.0框架无11维记分卡, 无法与v19.x报告进行结构化质量对比"
      - "WACC选择的主观性是评级最大杠杆——从9.0%到10.0%跨越两个评级区间, 敏感性过高"
      - "CQ2(CapEx恢复)置信度50%标注为'盲点'——最关键变量反而分析最浅"
      - "Red Team RT-2识别报告偏悲观2-4pp但校正不够系统(仅概率微调)"

  hypothesis_tested:
    confirmed:
      - hypothesis: "Reverse DCF必须P1前置(铁律O)"
        evidence: "Ch10 Reverse DCF有效建立了信念框架, 全报告围绕信念验证展开"
        confidence_after: "高(MSFT 316K报告完整执行)"
      - hypothesis: "四层锁定的定价权极强(弹性<0.3)"
        evidence: "M365涨价弹性-0.2实证确认, 5年锁定耐久度95%"
        confidence_after: "高(历史涨价数据支撑)"

    extended:
      - hypothesis: "承重墙分析(MCO/CME)"
        extension: "从2层(MCO)→3层(MSFT W1/W2/W3), 增加了脆弱度量化(W3 3.5/5最高)和KS密度分析(W3关联5个KS最密集)"

    refuted:
      - hypothesis: "OpenAI对Azure有高度财务依赖"
        evidence: "Azure消耗仅3-5%, 脱离后增速仅降6-8pp, 叙事依赖>财务依赖"
        lesson: "明星合作伙伴的影响需分离叙事通道和财务通道——叙事依赖可能远大于财务依赖"

  limitations:
    - "FY28 CapEx/Revenue路径无法预测——这是评级升/降档的核心分叉但属于盲点"
    - "WACC选择9.5%的主观性极高——±100bps跨越两个评级区间"
    - "OpenAI IPO后行为不可预测——叙事恐慌的时机和幅度无法量化"
    - "GPU代际效率(2-3x)的实际兑现时间和幅度依赖NVDA/AMD产品路线图"
    - "AI Agent对M365长期颠覆概率(<25%)是定性判断, 无历史基准率"
