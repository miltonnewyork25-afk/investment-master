# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "$3T市值隐含八项信念, 2项稳固/2项脆弱/4项待验证, +4.4%期望回报=合理定价但无安全边际, FY28是决定性验证窗口"
  rating: "中性关注"
  fair_value: "$3,127B (概率加权EV) / $419每股"
  expected_return: "+4.4%"

  key_arguments:
    - claim: "CapEx→FCF转化是$3T估值最脆弱的承重墙(W3脆弱度3.5/5)"
      direction: bearish
      magnitude: 5
      mechanism: "CapEx从FY23 13%→FY26 26% Revenue(3倍于Cloud纪元) → D&A峰值FY28-29压OPM至42% → FCF Margin从30%压至<20% → P/FCF锁定40-48x"
      kill_switch: "CapEx/Revenue连续2Q下降至22%以下 + GPU代际效率2-3x兑现"

    - claim: "Azure两速化: 非AI增速22%单独支撑$1T+(CI-1)"
      direction: bullish
      magnitude: 4
      mechanism: "非AI Azure受co-migration驱动正在加速(19%→22%), 即使AI贡献归零, 非AI Azure仍可独立支撑IC分部$1T+估值"
      kill_switch: "非AI Azure增速连续2Q低于15%(co-migration耗尽)"

    - claim: "四层锁定使MSFT比市场认为的更有韧性(弹性-0.2)"
      direction: bullish
      magnitude: 5
      mechanism: "AD身份层(9/10) → 数据层(8/10) → M365协作(7/10) → 开发者(6/10)四层嵌套锁定 → 迁移成本$25-45M/千人企业 → 价格弹性仅-0.2"
      kill_switch: "AI Agent在5-10年内颠覆传统生产力软件(概率<25%)"

    - claim: "P/E 25.1x为Mega5最低, CapEx恐惧已部分定价"
      direction: bullish
      magnitude: 3
      mechanism: "P/E处于12年历史30百分位, 但OPM 45.6%/ROE 34.4%/CCC -48天均为Mega5最优 → 质量调整后合理P/E 28.5x → 均值回归潜力+19%"
      kill_switch: "FY28 CapEx/Revenue仍>25%(恐惧合理化→P/E不回归)"

    - claim: "Copilot价值=叙事放大器, 估值影响是财务影响的3-4x(CI-4)"
      direction: conditional
      magnitude: 4
      mechanism: "当前ARR仅$5.6-7.2B(总收入2%), 但渗透加速→市场确认AI回报→P/E扩张; 渗透失速→AI CapEx沉没成本叙事→P/E压缩"
      kill_switch: "FY28渗透率<8%(Base情景10-14%的下限)"

  moat:
    composite_score: 8.5
    half_life: ">15年(身份层锁定) | >10年(M365生态) | 5-10年(Azure AI竞争优势)"
    dimensions:
      - type: switching_cost
        strength: 5
        evidence: "AD/Entra ID→SSO→Intune→Teams四层嵌套锁定, 迁移成本$25-45M(千人企业), 耗时18-24月, 价格弹性-0.2"
        vulnerability: "AI Agent长期颠覆传统生产力软件(>5年时间窗)"
      - type: network_effect
        strength: 4
        evidence: "Teams/M365协作的间接网络效应+GitHub 1.5亿开发者+Power Platform应用正反馈锁定"
        vulnerability: "Google Workspace在中小企业渗透+Slack/Zoom替代方案"
      - type: scale
        strength: 4
        evidence: "OPM 45.6%(Mega5最高), P&BP OPM 60.3%, 增量margin极高, 54+数据中心地区"
        vulnerability: "AI CapEx正在稀释规模效应(CapEx/Revenue从6%→26%)"
      - type: data
        strength: 4
        evidence: "企业数据层(SharePoint/OneDrive)+开发者数据(GitHub)+LinkedIn职业数据=AI训练/微调独特优势"
        vulnerability: "数据隐私法规(GDPR/CCPA)限制跨产品数据利用"
      - type: ip
        strength: 3
        evidence: "OpenAI独占API至2032+IP使用权+$13B投资→27%持股(重组后)"
        vulnerability: "OpenAI IPO后多云战略+开源模型(Llama/Mistral)缩小闭源差距"

  valuation:
    reverse_dcf_implied: "市场隐含Revenue CAGR 9.6%(FY25-FY36) + OPM恢复至47-48% + FCF从$50B谷底恢复至$100B+; 隐含Azure 5Y CAGR需维持25%+"
    methods_used: ["Reverse DCF", "10Y FCFF DCF(WACC 9.5%)", "分部SOTP(纯同行乘数)", "RevDCF信念加权", "外部可比(Mega5+历史+PEG)", "OVM期权估值"]
    dispersion: "2.57x (情景极端S1 $1,750B↔S4 $4,500B)"
    consensus_vs_ours: "市场用GAAP P/E 25.1x定价CapEx恐惧 | 我们看到四层锁定$1.5T底部+P/E均值回归+19%潜力, 但WACC 9.5%下仅+4.4%"
    entry_zone: "P/E 22x以下(约$330/股)或FY28验证CapEx/Rev<22%后"
    catalyst: "CapEx/Revenue连续2Q下降 | M365涨价(2026年7月+$10.7B) | GPU代际效率兑现(FY28)"

  action_framework:
    verdict: "持有(已持有) / 等待(未持有) — +4.4%期望回报缺乏安全边际, 等FY28验证"
    buy_triggers:
      - trigger: "CapEx/Revenue连续2Q下降至22%以下 + Azure CC维持>35%"
        price_zone: "当前价格附近($380-420)"
        reasoning: "CapEx恐惧解除→P/E从25x恢复至28-30x→+10-19%回报"
      - trigger: "宏观恐慌(非MSFT基本面)导致P/E压至22x以下"
        price_zone: "$330以下"
        reasoning: "W2底部$1.5T(约$200/股)提供50%+安全边际, 四层锁定确保基座不动"
    hold_conditions:
      - "W2(Office/Windows)CQ5维持>70%(四层锁定完整)"
      - "Azure CC增速>25%(B1基准路径成立)"
      - "OPM维持>40%(KS-11未触发)"
      - "FCF覆盖股息(KS-3未持续触发)"
    sell_triggers:
      - signal: "FCF连续4Q<$10B且股息覆盖率<1.0x"
        severity: "action"
        action: "减仓50%, B6失败确认→评级自动降档至审慎关注"
      - signal: "CapEx/Revenue FY28仍>25%且OPM跌破40%"
        severity: "action"
        action: "减仓50%, B4+B6联合失败→估值→$2.2-2.5T"
      - signal: "Azure CC增速连续2Q<25%"
        severity: "warning"
        action: "重新评估B1, 若<20%则减仓25%"
      - signal: "M365流失率>2%/年(KS-6触发)"
        severity: "emergency"
        action: "全部卖出, W2底部假设被颠覆"
    position_sizing: "当前+4.4%不支持新建仓; 已持有者W2底部保护使持有风险可控"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "CapEx→D&A→OPM→FCF传导链(报告核心因果链)"
    chain: >
      AI军备竞赛→CapEx从$45B→$80B+/年(CapEx/Rev从13%→26%)
      → 资产折旧3-5年寿命→D&A从$40B/年攀升至$60-72B/年(FY28-29峰值)
      → D&A占Revenue从14%升至18-20%→OPM从46%压至42%(谷底FY28)
      → OPM下降+CapEx挤压→FCF Margin从30%压至<20%→P/FCF锁定40-48x
      → 恢复取决于: (a)收入增速>D&A增速的赛跑 (b)CapEx降速 (c)GPU效率逆转
    transferable_to: "所有处于重资本投入周期的科技公司(META AI/元宇宙, GOOG TPU, AMZN AWS扩张)"
    reasoning_habit: "看到CapEx激增时, 追问D&A传导时间表——CapEx的利润率影响不在投入年而在折旧年(滞后3-5年)"

  - id: "CC-2"
    name: "四层嵌套锁定如何将价格弹性压至-0.2"
    chain: >
      身份层(AD/Entra ID)→所有应用SSO入口(强度9/10)
      → 数据层(SharePoint/OneDrive/Exchange)→企业数据沉淀(强度8/10)
      → 协作层(Teams/M365)→工作流依赖(强度7/10)
      → 开发者层(GitHub/VS Code→Azure DevOps)→全栈锁定(强度6/10)
      → 四层叠加→迁移=重构身份+迁移数据+重建协作+重配开发管线
      → 总迁移成本$25-45M(千人企业)+18-24月→经济上不合理
      → 涨价15%仅损失3%需求→弹性-0.2→极强定价权
    transferable_to: "所有多层嵌套式企业软件平台(Salesforce生态/SAP ERP/Oracle DB)"
    reasoning_habit: "评估锁定时不看单一产品粘性, 看嵌套层数——每多一层迁移成本非线性增长"

  - id: "CC-3"
    name: "Copilot叙事放大器: 2%收入→3-4x估值杠杆"
    chain: >
      Copilot当前ARR $5.6-7.2B(仅占总收入2%)
      → 直接财务贡献微小→但Copilot是'AI货币化能力'的唯一公开证明信号
      → 渗透加速→市场确认'$80B CapEx有回报'→P/E扩张2-5x
      → 渗透失速→市场判定'AI CapEx是沉没成本'→P/E压缩→B4/B6连锁质疑
      → 估值影响=直接财务影响×3-4倍(叙事杠杆)
    transferable_to: "所有AI货币化处于早期的科技公司(GOOG Gemini/META AI助手)"
    reasoning_habit: "区分'财务影响'和'叙事影响'——早期AI产品的估值影响主要走叙事通道而非利润通道"

  - id: "CC-4"
    name: "Reverse DCF揭示八项隐含信念的脆弱度"
    chain: >
      $3T市值倒推→隐含Revenue CAGR 9.6% + OPM恢复47% + FCF $100B+
      → 分解为8项独立信念(B1-B8)→逐一反演'失败触发条件'
      → 发现B6(FCF恢复)是因果网络终端汇聚节点→4条链汇入B6
      → B6单独失败→估值→$2.2-2.5T(唯一具有独立翻转评级能力的信念)
      → 但B6'独立'失败不可能→必伴随B4(CapEx不降速)→B4+B6联合是最小充分集
    transferable_to: "所有Mega-cap公司的估值审计——从市值倒推找最脆弱信念而非正向推导"
    reasoning_habit: "用Reverse DCF先翻译'市场在赌什么', 再评估赌注合理性——避免正向DCF的确认偏差"

  - id: "CC-5"
    name: "OpenAI叙事依赖>财务依赖"
    chain: >
      OpenAI年化Azure消耗$3-5B(仅占Azure $99B的3-5%)
      → 去OpenAI后Azure增速从40%降至32-34%(仅损6-8pp)
      → 但CRPO中$281B(45%)看似高集中度→API独占至2032年+IP使用权=法律锁定
      → OpenAI脱离的真正风险不是收入(仅$5-8B)而是叙事('AI赢家'标签丧失)
      → 叙事恐慌期=建仓窗口(财务影响仅1.5-2%市值)
    transferable_to: "所有与AI明星公司深度绑定的公司(NVDA与大客户集中度)"
    reasoning_habit: "分离'财务依赖度'和'叙事依赖度'——叙事恐慌创造的价格偏离往往远大于财务基本面变化"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "Azure增速依赖AI贡献(18pp), AI放缓将拖累整体"
      final: "非AI Azure增速22%且在加速(co-migration), 即使AI归零仍支撑$1T+"
      pivot: "拆分AI/非AI增速后发现非AI Azure反而在加速(Q3 FY25 19%→Q1 FY26 22%)"

    - initial: "Q2 FY26 FCF $5.9B信号现金流质量恶化"
      final: "TTM FCF $77.4B(Margin 25.3%)远好于单季恐慌叙事, $5.9B源于CapEx集中交付"
      pivot: "TTM基准vs单季数据的巨大偏差——Q2 CapEx $29.9B环比+54%是集中交付非稳态"

    - initial: "OpenAI是Azure AI核心驱动力, 脱离将'摧毁'Azure增速"
      final: "OpenAI消耗仅占Azure 3-5%, 脱离后增速降至32-34%(仅损6-8pp)"
      pivot: "五维双向审计: API独占至2032年+IP使用权=法律锁定, 脱离影响仅2.5/5"

  surprises:
    - finding: "SOTP纯同行乘数仅$2,338B vs 市值$2,995B — $657B'溢出'需要协同+期权解释"
      implication: "$3T定价中$545B是平台协同溢价(23%)+$112B是OVM期权——投资者买的不仅是分部价值, 还有AI期权和生态协同"

    - finding: "MSFT P/E 25.1x是自FY19以来首次低于全部Mega5同行, 但质量指标(OPM/ROE/CCC)均为最优"
      implication: "市场对CapEx风险的折价可能过度——质量调整后合理P/E 28.5x→均值回归+19%"

    - finding: "WACC是评级最大的单一杠杆——从9.0%到10.0%, 期望回报从+19%跳至-8.7%, 跨越两个评级区间"
      implication: "MSFT的投资论点高度依赖系统性折现率判断, 基本面分析的边际信息贡献不如WACC选择"

    - finding: "CRPO $625B中45%来自OpenAI $281B承购——剔除后有机CRPO $344B(+28%)"
      implication: "标题增速+110%被OpenAI合同严重扭曲, 有机增速28%才是真实信号"

  blind_spots:
    - area: "FY28 CapEx/Revenue是否真的能降至22%以下"
      why_matters: "决定评级是升档至'关注'还是降档至'审慎关注'的核心分叉"
      monitor: "FY27 Q3-Q4 CapEx指引 + GPU代际效率实证数据"

    - area: "AI推理成本的下降速度(GPU效率+开源模型竞争)"
      why_matters: "决定Azure AI毛利率能否从45%提升至60%+ → OPM恢复路径"
      monitor: "Blackwell/Rubin单位成本数据 + Maia自研芯片量产进度(2027)"

    - area: "OpenAI IPO后的多云战略执行程度"
      why_matters: "叙事风险>财务风险, 但叙事恐慌可能创造-10%以上的短期价格偏离"
      monitor: "OpenAI IPO招股书中Azure消耗数据 + IPO后12-24月多云部署动向"

  sell_lessons:
    - scenario: "在CapEx爆炸初期(FY24)未减仓→P/E从38x压至25x(-34%)"
      lesson: "CapEx/Revenue拐点是科技股估值的领先信号——当CapEx/Revenue从13%跳升至22%(FY24), 就是P/E压缩的起点"
      transferable: "所有进入重资本投入周期的科技公司(META FY23元宇宙/GOOG TPU扩张)"
    - scenario: "单季数据恐慌(Q2 FCF $5.9B)不卖→TTM证明$77.4B仍健康"
      lesson: "CapEx集中交付的季度造成FCF极端波动——用TTM而非单季做决策, 避免被季度噪音震出"
      transferable: "所有CapEx高波动的公司(半导体设备/云基础设施)"

