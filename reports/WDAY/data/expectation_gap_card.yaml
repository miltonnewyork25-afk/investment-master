    - fact: "回购从$700M→$2,895M(4倍加速),管理层用行动说'股票便宜'"
      why_telling: "管理层没有用嘴说'被低估'——而是用$2.9B的回购投票。这比任何earnings call上的乐观表态都更可信。但创始人Duffield个人在卖,形成矛盾信号"

# === G域: 剪刀差 ===
gap:
  variable_comparison:
    - factor: "FCF增速"
      expectation: "市场隐含5-8% FCF CAGR (P/FCF 12.2x几乎不为增长付费)"
      reality: "FCF FY26增长27%, FCF margin扩张至29.1%, 共识Rev CAGR ~11%+margin扩张→FCF CAGR应≥12-15%"
      gap_direction: "E<<R"
      gap_size: "large"

    - factor: "盈利质量与资本回报"
      expectation: "市场把WDAY与DDOG/其他SaaS一刀切——全部面临SBC稀释+AI颠覆"
      reality: "WDAY回购$2.9B=SBC的208%, 股本-2.5%/yr | GAAP OPM +10.7% | ROIC 11.9% → 远好于DDOG(ROIC -8%, 零回购)"
      gap_direction: "E<<R"
      gap_size: "large — 市场没有区分'谁在回报股东'和'谁在稀释股东'"

    - factor: "增长持续性"
      expectation: "市场认为13%增速将继续减速，可能降至单位数"
      reality: "FY2027订阅指引$9.93-9.95B暗示~13-14%增速(稳定,未进一步减速)"
      gap_direction: "aligned to slightly E<R"
      gap_size: "small — 增速确实在放缓,但市场似乎在定价'更差'而非'放缓'"

    - factor: "相对估值(★核心错配)"
      expectation: "WDAY(P/FCF 12.2x)和NOW(P/FCF 23.7x)面对同一个AI叙事,但估值差2倍"
      reality: "WDAY的FCF margin(29%)接近NOW(34.5%), 但WDAY有回购覆盖208%而NOW仅94% → WDAY的真实股东回报可能更高"
      gap_direction: "E<<R (相对于NOW)"
      gap_size: "large — 如果AI恐惧适用于所有seat-based SaaS,为什么NOW的P/FCF是WDAY的2倍?"

  scoring:
    direction_clarity: 4       # FCF加速+margin扩张+回购加速=方向明确
    magnitude: 5               # P/FCF 12.2x vs SaaS行业25-50x=差距巨大
    persistence: 4             # margin扩张趋势已持续4年,回购在加速
    verifiability: 4           # 下季财报可验证增速/margin趋势
    composite_score: 4.25      # >>3.5 = 强烈值得深挖

  core_mispriced_variables:
    - variable: "资本回报质量(回购vs SBC的净效果)"
      market_assumes: "SaaS公司的SBC都一样——都在稀释股东"
      reality_shows: "WDAY回购=SBC的208%,股本在缩减。DDOG回购=SBC的0%,股本在膨胀。市场给了两者相似的de-rating,但它们的股东价值创造方向完全相反"
      why_market_wrong: "市场按'行业叙事'(AI kills SaaS)定价,没有按'公司特定现金流行为'定价。WDAY在用$2.9B回购告诉市场'我们的股票便宜'——市场没有听"
      evidence_grade: "fact"
      valuation_sensitivity: "如果市场给予WDAY与NOW相同的P/FCF(23.7x), WDAY估值=$2.78B × 23.7 = $65.9B = 每股$249 (当前$128, 上行95%)"

    - variable: "从'增长公司'到'现金流复合机器'的再定位"
      market_assumes: "增速从16%降至13%=负面信号=增长故事结束"
      reality_shows: "OPM从-3.6%扩张至10.7%,FCF margin从21%扩至29%——WDAY正在完成从'增长优先'到'盈利增长'的转型,类似Oracle 2015-2020的路径"
      why_market_wrong: "市场仍按'高增长SaaS'标准评判WDAY(增速减速=坏),但如果按'现金流复合机器'标准评判(margin扩张+回购=好),当前估值荒谬的低"
      evidence_grade: "fact (财务数据) + inference (Oracle类比)"
      valuation_sensitivity: "如果市场接受'成熟SaaS=现金流复合'叙事,P/FCF应从12x重估至18-25x→上行50-100%"

    - variable: "创始人卖出 vs 公司回购的矛盾"
      market_assumes: "创始人Duffield持续卖出=看空自己的公司"
      reality_shows: "Duffield个人卖出(可能是遗产规划/多元化) vs 公司层面回购$2.9B。公司行为(回购)比个人行为(卖出)更代表基本面判断"
      why_market_wrong: "可能没有错——Duffield卖出确实是负面信号。但需区分'个人财务规划'和'对公司前景的判断'"
      evidence_grade: "inference"
      valuation_sensitivity: "如果Duffield停止卖出或开始买入,将成为强确认信号"

  one_sentence_judgment: "WDAY是三家SaaS中预期差最清晰的案例——P/FCF 12.2x定价一个FCF增速27%、margin在扩张、回购=SBC两倍的公司,市场按'AI杀死SaaS'一刀切定价但完全忽视了WDAY正在从'增长公司'成功转型为'现金流复合机器'的事实"

