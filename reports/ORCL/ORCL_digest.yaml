# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "Oracle的数据库护城河存量极深但增量已失，AI基础设施豪赌(CapEx $21B+)隐含31.5% CAGR无历史先例——当前$154定价需要4个激进条件同时成立(联合概率18-25%)"
  rating: "审慎关注"
  fair_value: "概率加权$385B EV(~$132/股，Phase 5校准后) | 三锚基准$335B EV(~$117/股)"
  expected_return: "-15.0%(风险调整后概率加权) | 下行风险/上行收益比2.1:1"

  key_arguments:
    - claim: "数据库+ERP存量护城河仍深，迁移成本$5-500M+，金融核心系统粘性9.2/10"
      direction: bullish
      magnitude: 4
      mechanism: "PL/SQL代码锁定+RAC技术壁垒+合规审计依赖+ERP迁移失败率55-75% → 企业级客户10年尺度内无法离开"
      kill_switch: "PostgreSQL获得等同Oracle的金融合规认证 | 云原生数据库技术代际跳跃 | 新应用100%不选Oracle(增量已失)"

    - claim: "AI CapEx陷阱风险——$120B投入的ROI概率加权仅5.9%，低于WACC 9.5%"
      direction: bearish
      magnitude: 5
      mechanism: "CapEx从$11B→$21.2B(7.2倍) → OCI增速已从76%→68%放缓 → GPU utilization率未披露 → 资产减值$15-25B风险"
      kill_switch: "OCI FY2028收入达$30B+(证明转化效率超预期) | AI基础设施稀缺性溢价持续至2030"

    - claim: "内部人36:1交易分化是Oracle历史极值——credibility最大红旗"
      direction: bearish
      magnitude: 4
      mechanism: "71卖/2买→机构投资者质疑→分析师下调评级→股价adjustment→债务成本上升→FCF进一步恶化"
      kill_switch: "内部人交易回归正常(10:1以内) | 大额内部人买入出现(>$10M)"

    - claim: "Reverse DCF隐含31.5% CAGR五年，需Oracle从$57B→$226B——无历史先例"
      direction: bearish
      magnitude: 5
      mechanism: "市场隐含5年收入翻4倍=新增SAP+Salesforce体量 → $50B+基数上30%+ CAGR历史上无企业软件公司实现过"
      kill_switch: "AI产业创造全新增长范式 | OCI FY2027收入达$30B+(证明CAGR可持续)"

    - claim: "高杠杆在高利率环境下从优势变脆弱——D/E 432%, Net Debt/EBITDA 3.9x, 评级缓冲仅8%"
      direction: bearish
      magnitude: 4
      mechanism: "总债务$104B→$124B(6月+$20B) → 利息覆盖3.24x距Baa1警戒线3.0x仅8% → 新债利率5.24%远超存量3.4% → 利息成本结构性爬升"
      kill_switch: "FY2027 EBITDA>$30B + FCF转正 + 股权融资成功稀释杠杆"

  moat:
    composite_score: 6.5  # 数据库7.5 + ERP 7.8(Fusion粘性) + OCI 3.0(未形成) 加权
    half_life: "数据库存量>15年 | ERP/SaaS>10年 | OCI护城河尚未建立 | 中间件<5年(衰退中)"
    dimensions:
      - type: switching_cost
        strength: 5
        evidence: "金融核心系统迁移$100-500M/3-7年周期; ERP迁移失败率55-75%; PL/SQL代码锁定+RAC技术壁垒; Fusion平均合同期7.2年(行业3-4年)"
        vulnerability: "新应用100%不选Oracle DB(增量已失); 中型客户迁移成本较低(粘性5.1/10); PostgreSQL在新部署份额已超Oracle"
      - type: regulatory
        strength: 4
        evidence: "金融Fine-Grained Auditing+TDE加密通过数十年合规审查; FedRAMP High + IL5/IL6国防认证; 监管机构审查员熟悉Oracle安全架构"
        vulnerability: "迁移到新数据库=重新安全认证(隐性成本极高但非不可能); 国产数据库替代在政府市场的长期威胁"
      - type: scale
        strength: 3
        evidence: "OCI 46个专属云区域; $21B+ CapEx构建AI基础设施规模; GPU产能200K+ H100等效"
        vulnerability: "OCI份额仅2-3%, AWS/Azure规模10-20x于OCI; 规模经济尚未建立(CapEx/Revenue 37%为科技大厂最高)"
      - type: data
        strength: 3
        evidence: "Oracle DB客户数十年历史数据形成数据重力; 企业级数据迁移复杂度极高"
        vulnerability: "数据重力锁定的是存量客户而非增量客户; 多云策略(DB@AWS/Azure)降低了OCI原生平台数据锁定"

  valuation:
    reverse_dcf_implied: "市场隐含5年收入CAGR 31.5%($57B→$226B), 需EPS从$4.34→$17-21——历史上$50B+基数企业软件无先例"
    methods_used: ["Reverse DCF", "DCF(三情景)", "SOTP(四分部)", "Comparable(同业折价)", "Black-Scholes期权估值", "四场景概率加权"]
    dispersion: "高——DCF基准$117 vs 概率加权$132 vs P2概率加权$197 | S1-S4跨度$55-$481"
    consensus_vs_ours: "市场赌转型成功概率65%(@$154) | 我们评估35%(@$117-132公允) | 核心分歧在OCI增速可持续性和AI CapEx ROI"
    entry_zone: "S1情景价$55-75(FCF持续负+评级下调) | DCF基准$117(28% OCI CAGR验证)"
    catalyst: "FY2026 Q3 OCI增速<50%→叙事崩塌→-25%调整窗口 | 信用评级下调(30%概率FY2027)→强制抛售"

  # ★ v1.2新增: 买卖决策框架 ★
  action_framework:
    verdict: "规避——期望回报-15%, 下行概率75%, 承重墙极脆弱"
    buy_triggers:
      - trigger: "OCI增速连续3Q>55% + FCF转正(FY2027验证)"
        price_zone: "$100-120 (P/E 18-22x, 三锚DCF区间)"
        reasoning: "只有在价格充分反映执行风险后(>-30%调整)且基本面初步验证后才考虑"
      - trigger: "AI CapEx泡沫破裂导致科技板块系统性下跌"
        price_zone: "$70-90 (S1-S2过渡区间)"
        reasoning: "Oracle Database现金奶牛($19.4B/年)在极端低估下提供价值底线"
