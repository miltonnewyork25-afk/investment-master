  confirmation_signals:
    - signal: "季度FCF(含CapEx趋势)"
      bullish_threshold: "FCF转正+CapEx环比下降(投资周期见顶)"
      bearish_threshold: "FCF持续为负+CapEx加速(投资无底洞)"
    - signal: "信用评级动作(Moody's/S&P/Fitch)"
      bullish_threshold: "展望从负面回升至稳定(验证财务韧性)"
      bearish_threshold: "下调至Baa3/BBB-(投资级底线) | 下调至垃圾级(触发强制抛售)"
    - signal: "RPO季度变化(含客户集中度)"
      bullish_threshold: "RPO增长>20% + 集中度下降(广泛需求)"
      bearish_threshold: "RPO增长<10%或主要客户scale-back(需求放缓)"

  noise_signals:
    - signal: "分析师目标价共识($301.81, 隐含+88%)"
      why_noise: "卖方88%看涨但共识隐含CAGR 31.5%无历史先例。自己做Reverse DCF比看卖方更可靠"
    - signal: "短期股价波动(年内$345→$154已下跌56%)"
      why_noise: "价格修正反映叙事降温但未到达基本面底——看OCI季度数据而非股价走势"
    - signal: "AI合作公告(Stargate等)"
      why_noise: "公告创造短期兴奋但实际收入确认需2-3年——看RPO转化率而非PR频率"

