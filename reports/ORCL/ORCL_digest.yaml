# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "数据库护城河的四层嵌套与时间衰减"
    chain: >
      PL/SQL代码锁定(>15年半衰期)
      → RAC/Exadata技术壁垒(正在被缩小, ~10年)
      → DBA人才锁定(新一代成长, ~5-10年弱化)
      → 合规审计依赖(金融/政府, >15年)
      → 存量护城河极深但增量完全失守(新应用不选Oracle)
      → 护城河不是在"崩塌"而是在"老化"——存量客户无法离开但新客户不会进入
      → 估值含义: License Support是现金奶牛但终将枯竭, 给10-15年折现而非永续
    transferable_to: "所有面临新兴替代品但存量锁定深的传统软件(IBM/CA/Micro Focus类)"
    reasoning_habit: "护城河分析必须区分'存量深度'和'增量流入'——两者可以同时一个极高一个为零"

  - id: "CC-2"
    name: "RPO质量折扣——标题数字vs经济价值的35%差距"
    chain: >
      RPO $523B标题数字极度亮眼(+438%)
      → 但OpenAI单一合同占57%(极端集中度)
      → OpenAI盈利路径不清(年收入$12-15B vs $300B合同)
      → RPO质量加权后折扣35%→有效RPO约$342B
      → 仍为FY2025收入的6x→充足但远低于标题暗示的9x
      → 投资含义: RPO集中度=不是广泛需求拉动而是少数大赌注的集中签约
    transferable_to: "所有RPO/积压大幅增长的公司——必须检查客户集中度和支付能力"
    reasoning_habit: "看到标题数字(RPO/积压/订单)先问: 前5大客户占多少? 客户有能力履约吗?"

  - id: "CC-3"
    name: "ROE幻觉——高杠杆驱动的69% ROE vs真实ROIC 14.5%"
    chain: >
      ROE 69%表面惊人
      → 杜邦分解: 权益乘数8.0x是核心驱动(接近银行杠杆水平)
      → D/E 432%(FY2022曾为负权益)→ 回购导致留存收益-$31.3B
      → 剥离杠杆后ROIC仅14.5%→ 与SAP接近, 无超额回报
      → 如果将杠杆还原至行业平均D/E 30%, 标准化ROE约15-18%
      → 投资含义: P/B和ROE极端值完全由资本结构驱动而非经营优势
    transferable_to: "所有ROE>30%但D/E>200%的公司——杠杆ROE不是真实盈利能力"
    reasoning_habit: "看到极高ROE立刻做杜邦分解——如果权益乘数>3x, ROE是杠杆幻觉"

  - id: "CC-4"
    name: "DPO操作虚增OCF——现金流质量的隐性恶化"
    chain: >
      Oracle DPO从38.6天暴涨至169.8天
      → 应付账款膨胀隐含$3-4B OCF虚增
      → 表面OCF $20.8B质量看似良好(OCF/NI=1.45x)
      → 但扣除DPO效应后"真实"OCF约$16B
      → 减去维护性CapEx $8B→真实FCF仅$8B
      → DPO不可持续(供应商关系恶化风险+评级机构调整)
      → FCF恢复比财报显示更困难
    transferable_to: "所有DPO突然大幅延长的公司——检查是运营效率还是供应商融资依赖"
    reasoning_habit: "OCF增长时必查应付账款变化——DPO延长=借供应商的钱美化现金流"

  - id: "CC-5"
    name: "多云策略是防守非进攻——Database@AWS/Azure的真实定位"
    chain: >
      OCI份额仅2-3%, 无法正面竞争AWS/Azure
      → 多云策略: 将Oracle DB嵌入竞争对手云平台
      → 表面是TAM扩展(数据库客户群扩至AWS/Azure用户)
      → 实际是防守(阻止客户迁移至PostgreSQL)
      → 同时降低客户对OCI原生平台的锁定(双刃剑)
      → 多云数据库817%增速但基数极小
      → Larry提出$20B/5年目标但这部分利润率低于OCI原生
      → 投资含义: "云份额"需区分IaaS份额(难)和云收入(含多云, 较易)
    transferable_to: "所有被迫在竞争对手平台'寄生'获取客户的公司"
    reasoning_habit: "区分'进攻性增长'和'防守性增长'——后者维持收入但不创造新护城河"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "RPO $523B(+438%)证明Oracle AI转型需求强劲"
      final: "RPO质量加权折扣35%至$342B, OpenAI单一合同占57%构成极端集中度风险"
      pivot: "前5大客户占RPO 70-80% + OpenAI年收入$12-15B远不足以支撑$300B合同 → 标题RPO是少数大赌注而非广泛需求"

    - initial: "ROE 69%说明Oracle经营效率远超同行"
      final: "杜邦分解暴露权益乘数8.0x, 真实ROIC仅14.5%与SAP接近"
      pivot: "D/E 432% + FY2022负权益(-$6.2B) → 69% ROE是杠杆幻觉而非经营优势"

    - initial: "P/E 30x对14%增长率合理(PEG 2.12)"
      final: "与MSFT对比后发现Oracle P/E溢价20%但增长/利润率/FCF/杠杆全方位不如→公允P/E应为20-23x(隐含$107-122)"
      pivot: "MSFT全维度优于Oracle但P/E更低 → Oracle溢价只能由AI增长期权解释 → 期权估值$110-150B/$38-53每股"

  surprises:
    - finding: "Oracle FQ2 FY2026单季CapEx $12B(7.2倍于18月前), CapEx/Revenue达37%为科技大厂最高"
      implication: "AI基础设施投资强度已超出公司体量——如果OCI份额未达5%+, 大量CapEx可能无法转化为收入, 触发$15-25B资产减值"

    - finding: "DPO从38.6天暴涨至169.8天, 隐含$3-4B OCF虚增"
      implication: "Oracle现金流改善部分是会计操作而非运营改善——评级机构通常会调整异常DPO"

    - finding: "Cerner(Oracle Health)收购隐含ROI仅4.3% < WACC 9%——仍未创造价值"
      implication: "Oracle最大收购($28.3B)执行不力, 管理层资本配置能力存疑, VA项目更损害联邦市场声誉"

    - finding: "AI新客户粘性仅3.4/10——合同导向/技术标准化/替代性强, 与金融核心客户9.2/10形成极端反差"
      implication: "'高粘性存量+低粘性增量'结构性挑战: Oracle新增收入来自最易流失的客户群"

  blind_spots:
    - area: "OCI毛利率(Phase 4标记为C级数据——最弱环影响$80B估值)"
      why_matters: "OCI是否能达到AWS级别规模效应决定AI CapEx能否收回——但Oracle未分部披露OCI毛利率"
      monitor: "FY2026-2027财报中OCI分部利润率披露 | 季度CapEx效率比(CapEx增量/OCI收入增量)"

    - area: "OpenAI合同真实执行率——$300B合同年均$60B远超OpenAI年收入$12-15B"
      why_matters: "如果执行率<40%, RPO质量将严重恶化, 估值支撑坍塌"
      monitor: "OpenAI年化收入增速 | 融资动态 | Oracle与OpenAI联合声明中的合同调整信号"

    - area: "Larry Ellison健康与继任(81岁, 持股40.34%, 真正的战略决策者)"
      why_matters: "双CEO制本质上仍由Larry掌控→ Larry退出=战略连续性中断→ 历史双CEO成功率<30%"
      monitor: "SEC Form 4 Larry交易 | Proxy Statement继任披露 | Oracle World出席频率"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "内部人极端减持(36:1)但股价仍在高位→持有不卖→随后基本面恶化"
      lesson: "内部人交易分化创历史极值时, 无论叙事多好都应减仓。内部人最了解真实经营状况, 行为比语言可信"
      transferable: "所有内部人买卖比>20:1的公司——尤其是管理层同时给出乐观指引时(说一套做一套)"

    - scenario: "AI CapEx cycle高点不减仓→CapEx回报不达预期→资产减值+FCF恶化→双杀"
      lesson: "大规模CapEx投入期(CapEx/Revenue>25%)是风险最高时期, 而非增长最快时期。投资回报通常比管理层承诺晚2-3年"
      transferable: "所有处于大规模CapEx周期的公司(云/AI/半导体)——在CapEx见顶前而非后减仓"

    - scenario: "FCF为负但市场给成长溢价(P/E 30x)→FCF恢复延迟→信用评级下调→融资成本螺旋上升"
      lesson: "FCF为负+高杠杆+高PE是最危险的组合——一旦增长叙事动摇, 三个因素互相放大: PE压缩+评级下调+融资成本上升"
      transferable: "所有FCF<0 + Net Debt/EBITDA>3x + P/E>25x的公司——风险不是线性而是指数级"

