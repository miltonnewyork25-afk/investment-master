    archetype: "传统帝国的AI豪赌——存量护城河深但增量完全依赖执行"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF揭示$154隐含31.5% CAGR五年, 无历史先例→市场定价过度乐观"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1~RT-7全面执行, 7/7新发现, 双向校准+2CQ上调纠正系统悲观, CQ净变动-3.6pp"

    - pattern_id: "scenario_analysis.probability_weighted"
      application: "S1-S4四场景×Phase 4红队概率校准(S1从25%→35%)→概率加权$385B vs市值$442B→-13%"

  novel_patterns:
    - name: "RPO质量加权折扣"
      description: "对RPO/积压按客户质量(信用/规模/集中度)加权, 发现$523B标题值折扣35%至$342B有效值——标题RPO不等于可确认收入"
      transferable_to: ["所有RPO/积压大幅增长的SaaS/云公司", "大型政府/军事合同公司"]

    - name: "杠杆ROE幻觉识别(杜邦分解→ROIC)"
      description: "ROE 69%杜邦分解后发现权益乘数8.0x是核心驱动→ROIC仅14.5%→杠杆还原后ROE 15-18%与SAP接近"
      transferable_to: ["所有D/E>200%且ROE>30%的公司", "重资产+高杠杆行业(航空/房地产/金融)"]

    - name: "DPO虚增OCF检测"
      description: "DPO从39天→170天隐含$3-4B OCF虚增→真实operating FCF约$16B而非$20.8B→现金流质量比报表更差"
      transferable_to: ["所有DPO突然延长>50天的公司", "CapEx密集型行业(供应商赊账=融资手段)"]

    - name: "客户粘性分层与'高粘低增'结构"
      description: "四层客户粘性矩阵(金融9.2→ERP 7.8→中型SaaS 5.1→AI新客3.4)揭示增长来自最易流失客户→收入质量与增速负相关"
      transferable_to: ["所有有新旧客户群的公司", "传统企业拓展新市场时"]

    - name: "多云策略的'围魏救赵'定位(防守非进攻)"
      description: "DB@AWS/Azure表面是TAM扩展, 实际是阻止客户完全迁移PostgreSQL→防守性而非进攻性→利润率更低但保持关系"
      transferable_to: ["所有被迫在竞争对手平台提供服务的公司", "传统软件的多云转型策略评估"]

    - name: "AI CapEx陷阱框架(ROI概率加权vs WACC)"
      description: "概率加权AI CapEx ROIC仅5.9% < WACC 9.5%→即使考虑上行, AI投资仍可能value destructive→只有5%概率S4能产出>10%回报"
      transferable_to: ["所有大规模AI基础设施投资公司(AMZN/MSFT/GOOG/META)", "CapEx密集型转型投资评估"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "护城河评估必须区分'存量深度'和'增量流入'——Oracle DB存量锁定极深(9.2/10)但新应用完全不选Oracle"
        implication: "护城河评估增加'流入/流出'维度——只有存量深度没有增量流入的护城河=缓慢衰退(给有限半衰期而非永续)"
      - insight: "客户粘性必须按层分评——同一公司不同客户群粘性可差3-6倍(金融9.2 vs AI新客3.4)"
        implication: "护城河分析应按客户层加权——增长来自低粘性客户时, 总体护城河实际在弱化"

    valuation_insights:
      - insight: "RPO/积压标题数字需质量加权——客户集中度+信用能力折扣可达35%"
        implication: "所有RPO/backlog增长故事需先做质量加权, 否则估值建立在虚高基数上"
      - insight: "杜邦分解+ROIC是识别杠杆ROE幻觉的核心工具——D/E>200%时ROE完全不可信"
        implication: "高杠杆公司估值应基于ROIC而非ROE——ROE在高杠杆下是噪音"

    screening_insights:
      - insight: "FCF<0 + D/E>300% + P/E>25x = 三重危险组合——风险互相放大而非线性叠加"
        implication: "选股筛选增加'三重危险过滤器'——三项同时触发时自动标记为高风险规避"
      - insight: "内部人买卖比>20:1是6-9个月领先的负面信号(2001/2008 Oracle先例)"
        implication: "选股筛选增加'内部人行为异常'过滤: 买卖比>20:1 + 管理层同时给乐观指引 = credibility折价"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "看到RPO/积压大增时先检查前5大客户集中度"
      trigger: "RPO增速>100%"
      origin: "Oracle RPO +438%但OpenAI单一合同占57%→'广泛需求'叙事被推翻"
      generalization: "标题指标(RPO/ARR/积压)增速越快越要检查质量——极端增速往往来自少数大客户而非广泛需求"

    - habit: "ROE>40%立刻做杜邦分解→检查权益乘数"
      trigger: "ROE显著高于行业(>2x行业均值)"
      origin: "Oracle ROE 69%→杜邦分解→权益乘数8.0x→ROIC仅14.5%→杠杆幻觉"
      generalization: "极高ROE在D/E>100%的公司几乎一定是杠杆驱动——用ROIC评估真实盈利能力"

    - habit: "DPO突然延长时追问OCF质量"
      trigger: "DPO同比变化>50天"
      origin: "Oracle DPO从39→170天, 隐含$3-4B OCF虚增, 真实FCF比报表更差"
      generalization: "DPO延长=向供应商借钱→OCF质量需要WC调整后评估→对FCF为负的公司尤其关键"

    - habit: "大规模CapEx投入期优先计算概率加权ROIC vs WACC"
      trigger: "CapEx/Revenue>20%"
      origin: "Oracle AI CapEx概率加权ROIC 5.9% < WACC 9.5%→即使含上行情景, 投资仍可能毁灭价值"
      generalization: "管理层的CapEx承诺需要用概率加权ROIC验证——如果概率加权ROIC<WACC, 投资在期望值上是毁灭性的"

  quality_feedback:
    strengths:
      - "竞争格局深度扎实——SAP/MSFT/CRM/NOW/Snowflake多维度量化对比, 估值倍数有独立锚定"
      - "红队七问全部有效(7/7新发现), 双向校准纠正系统悲观, 净CQ变动3.4pp显示真实挑战"
      - "客户粘性四层分析(补充模块S1)是全报告最有区分度的创新——将定性护城河量化为客户层级"
      - "DM密度1.72/千字(优秀), 445个锚点覆盖充分"
    weaknesses:
      - "OCI毛利率为C级数据(Phase 4识别)——$80B估值建立在未验证的利润率假设上"
      - "Phase 5场景概率校准与Phase 2存在不一致(S1从20%→35%), 虽有红队理由但主观性较强"
      - "报告未包含正式记分卡评分——无法定量评估D1-D11各维度"
      - "估值离散度较高——DCF $117 vs P2概率加权$197, 跨度68%"

  hypothesis_tested:
    confirmed:
      - hypothesis: "高杠杆在高利率环境下从优势变脆弱"
        evidence: "Oracle D/E 432% + 新债利率5.24%(vs存量3.4%) + 利息覆盖3.24x距警戒线8% → 利息成本结构性爬升"
        confidence_after: "高(Oracle是最极端案例)"

      - hypothesis: "Reverse DCF必须P1前置(铁律O)"
        evidence: "P1 Reverse DCF揭示31.5% CAGR无先例→有效防止了后续分析的乐观偏差"
        confidence_after: "高(Oracle案例强化确认)"

    extended:
      - hypothesis: "RPO质量需要折扣(MSCI/CME报告中提及)"
        extension: "Oracle将RPO质量折扣从概念发展为量化方法: 按客户信用×集中度×履约能力加权→35%折扣"

      - hypothesis: "护城河有多重半衰期(CME三重半衰期)"
        extension: "Oracle展示更极端的分化: 数据库存量>15年 vs OCI 0(未建立) vs 中间件<5年(衰退中)→同一公司内护城河从极深到不存在"

    refuted:
      - hypothesis: "SaaS NRR>110%说明增长质量健康"
        evidence: "Oracle NRR分层后发现: OCI NRR 130-150%驱动整体数字, 但这来自AI新客(粘性3.4/10, 最易流失)→高NRR≠高质量增长"
        lesson: "NRR分层比NRR总数更重要——如果高NRR来自低粘性客户, 增长质量被高估"

  limitations:
    - "OCI分部毛利率未披露(C级数据)→ $80B OCI估值建立在行业类比而非公司数据上"
    - "OpenAI合同真实执行率无法验证→RPO质量折扣的35%可能偏保守也可能偏激进"
    - "双CEO制仅运行6个月(2024年9月启动)→数据不足以判断长期有效性"
    - "AI CapEx ROI验证需要2-3年→当前概率加权ROIC 5.9%可能在OCI规模化后大幅变化"
    - "Larry Ellison健康状况无公开信息→8%概率/-45%影响为历史类比而非精确估算"
    - "框架版本v17.0(报告时)→v19.7(当前)间框架演进未回溯应用"
