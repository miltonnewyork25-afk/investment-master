# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "A型不确定性如何使传统估值失效"
    chain: >
      Tesla 88-94%市值来自未产生收入的业务(FSD/Robotaxi/Optimus)
      → 这些业务在不同情景下是质的不同的公司(出行平台毛利率~60% vs 汽车商毛利率~20%)
      → 不同情景不是"同一个Tesla"的快慢版本, 而是不同物种
      → DCF要求预测收入结构, 但收入结构本身是未知数
      → 双重不确定性(结构不确定+数字不确定)使任何点估值="精确的错误"
      → 正确方法: 映射可能性空间的结构, 而非押注某个点
    transferable_to: "所有可能性宽度>7/10的公司(PLTR/Rivian/SpaceX等A型不确定性资产)"
    reasoning_habit: "看到mega-cap中>50%市值来自未验证业务时, 停止用传统DCF → 切换到发现系统(可能性空间映射)"

  - id: "CC-2"
    name: "Reverse DCF翻译市价隐含假设的诊断力"
    chain: >
      市价$425 + WACC 10.5% + g 2.5%
      → 反推: 10年Rev CAGR 21% + 终端OPM 22% + FY2035 Rev $630B
      → 对标: 仅Amazon从$100B+做到过21% CAGR + 终端OPM 22%当前仅NVIDIA(59%)级别
      → FY2035收入$630B = 丰田($274B) + 大众($322B)之和, 且利润率高4-5倍
      → 隐含FSD L4规模运营 + Cybercab年产>100万 + Optimus年产>100万 + 汽车利润率恢复
      → 多重未验证假设需同时成立, 且条件间存在共享依赖(非独立)
      → 概率之积远低于单项概率 → 市价极端激进
    transferable_to: "所有P/E>100x或P/S>10x的mega-cap估值诊断"
    reasoning_habit: "对任何高倍数公司, 先用Reverse DCF翻译'市场在赌什么', 再判断假设是否合理 — 而非正向DCF算'值多少钱'"

  - id: "CC-3"
    name: "共模失效如何构成纯视觉方案的物理天花板"
    chain: >
      Tesla FSD用8个摄像头(全部可见光380-700nm)
      → 暴雨/浓雾/逆光中8个摄像头同时退化(共模=同一物理原理)
      → NHTSA 2025 L4要求: 单一关键传感器类别故障时仍安全运行
      → 8个摄像头=单一传感器类别 → 不满足冗余定义
      → Waymo用LiDAR+摄像头+毫米波雷达三模态冗余绕过
      → Tesla能否用计算冗余(更多数据+更大模型)替代传感器冗余 → 开放AI科学问题
      → 如果不能 → FSD/Robotaxi/Optimus三条赛道同时受阻(共享AI技术栈)
    transferable_to: "所有依赖单一传感器模态的自动驾驶/机器人公司"
    reasoning_habit: "评估技术路线时, 区分'工程问题(可优化)'和'物理约束(需架构重构)' — 后者不能被更多资金/时间解决"

  - id: "CC-4"
    name: "EPS分散度比PE更能揭示估值不确定性"
    chain: >
      Tesla P/E 386x看似极端 → 但P/E是点估值÷点盈利
      → FY2028分析师EPS分散度8.17x($1.34-$10.94)
      → 即专业分析师对3年后盈利有8倍分歧
      → 中值EPS在分散度>5x时统计信息含量接近零
      → 任何基于"正确"EPS的估值模型都在假装知道答案
      → 分散度本身是最重要的估值信号: 它度量"不可知的程度"
      → FY2030分散度骤降至1.47x → 不确定性集中在FY2028-2029窗口(多引擎点火时点)
    transferable_to: "所有分析师EPS分散度>3x的公司"
    reasoning_habit: "在看PE之前先看EPS分散度 — 如果分散度>5x, PE是噪音, 分散度才是信号"

  - id: "CC-5"
    name: "能源垂直闭环为什么是Tesla唯一已验证的AI产品"
    chain: >
      市场将Tesla AI叙事锚定在FSD → 但FSD仍为L2+(未验证)
      → Autobidder: 每5分钟自主出价+无人工干预+已在生产环境运行(已验证)
      → 5层垂直闭环(Megapack+Autobidder+Powerwall+VPP+Supercharger) → 无竞品同时拥有
      → 能源3年CAGR 48.5%(全分部最高) + 毛利率高于汽车
      → 按"已证明的AI变现能力"排序: Autobidder(L3/S2) > FSD(L2-L3/S1)
      → 但能源仅占收入13.5% → 在估值中权重最低
      → 悖论: 最确定的高增长引擎在估值中权重最低; 最不确定的引擎在估值中权重最高
    transferable_to: "所有存在'已验证低收入业务 vs 未验证高估值业务'矛盾的公司"
    reasoning_habit: "按'已证明的变现能力'而非'叙事热度'排序公司的AI资产 — 叙事溢价可以消失, 已验证收入不会"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "Tesla是AI领导者——市场定价合理"
      final: "AI营收加权净分仅+1.16(中性); 62-68%市值($960B)无AI收入锚定"
      pivot: "Phase 3分部级AI冲击矩阵: 产生收入的分部(汽车70.7%)受AI影响最小(+1); AI影响最大的分部(FSD 2.6%)几乎不产生收入"

    - initial: "FSD 7.1B英里数据是不可复制的壁垒"
      final: "数据量≠数据质量; Waymo用1/56的数据在L4精度上远超Tesla; 边际数据价值递减"
      pivot: "Waymo ~50M英里数据已实现商业化无人运营 vs Tesla 7.1B英里仍为L2+ → 质>量"

    - initial: "PP&E $51.5B→$40.6B说明Tesla在大规模处置资产"
      final: "会计重分类事件: PP&E-$10.9B + 其他非流动资产+$17.0B + 资本租赁归零 → 租赁会计处理变更, 非实质处置"
      pivot: "Phase 4交叉验证: PP&E按正常路径应为$53.9B, 差距$13.3B与其他非流动资产增量$17.0B时间吻合"

  surprises:
    - finding: "Optimus TRL应修正为4而非管理层声称的4-5 — Gen 3预计2027年, 外部试点最早2028年"
      implication: "人形机器人商业化时间表比管理层叙事延迟18-24个月, $100-300B的Optimus估值溢价时间折现需更大"

    - finding: "ROIC从~20%(FY2022)持续降至6.6%(FY2025), 连续2年+低于WACC~10.5%——Tesla在消耗而非创造股东价值"
      implication: "与台积电重投资期对比: TSM ROIC仍>20%; Tesla问题是存量业务(汽车)ROIC也在下降, 不仅仅是新投资拉低均值"

    - finding: "内部人Q3'25买入发生在$210-270(A/D 2.0), 但Q1-Q2'25在$300-500有162笔净卖出 — 聪明钱'舒适价值区间'远低于$425"
      implication: "内部人行为暗示公允价值锚点$250-350, 当前$425在重度卖出区间之上"

    - finding: "Dojo $5B+投入后关闭(2025.08) — 管理层会在技术路线失败时纠错, 但代价巨大"
      implication: "如果纯视觉FSD也失败, Tesla有纠错先例(加LiDAR), 但这将根本改变成本结构和竞争定位"

  blind_spots:
    - area: "纯视觉FSD能否达L4(U1, 所有未知中权重最大)"
      why_matters: "如果能 → FSD数据优势不可复制, Robotaxi/Optimus路径全部打开; 如果不能 → 需加LiDAR或放弃L4, 估值结构根本改变"
      monitor: "FSD v15+干预间隔英里数(TS1); NHTSA L4认证进展; Tesla硬件配置变更(KS1)"

    - area: "FY2028-2029'多引擎同时点火'是否发生"
      why_matters: "EPS分散度8.17x集中在此窗口; 市价隐含的收入拐点(FY2029 +51.5% YoY)需要FSD+Robotaxi+Optimus同步突破"
      monitor: "Cybercab量产爬坡(TS4); FSD订阅渗透率(TS2); Optimus外销时间(KS5)"

    - area: "Musk注意力分配对Tesla执行力的实际影响"
      why_matters: "同时管理Tesla/SpaceX/xAI/Neuralink/DOGE — 不可知但可能是Tesla命题中权重最大的变量"
      monitor: "Tesla Earnings Call中Musk参与度; xAI融资/合并动态; DOGE任期是否结束"

    - area: "AI训练成本长期趋势(scaling law是否继续成立)"
      why_matters: "决定FSD/Optimus的R&D效率; FSD v14参数量10x且R&D+41%说明训练成本在加速上升而非下降"
      monitor: "Tesla R&D支出增速 vs FSD性能改善速度; AI行业training cost趋势"

  sell_lessons:
    - scenario: "内部人在$210-270集中买入后股价涨至$425 — 当前价格远超聪明钱买入区间"
      lesson: "内部人买入信号的价值在于买入价格, 不在于方向 — 在$210-270买和在$425买是完全不同的命题"
      transferable: "所有有大量内部人交易数据的公司: 追踪买入价格区间而非仅追踪买卖方向"
    - scenario: "P/E 386x + ROIC<WACC持续3年 — 但因'AI叙事'市场不卖"
      lesson: "在A型不确定性资产上, 传统估值信号(PE/ROIC)的纠偏力极弱 — 叙事可以压制基本面很久"
      transferable: "所有可能性宽度>7/10的高倍数公司: 传统估值方法可能长期无效"
    - scenario: "能源业务3年CAGR 48.5%但仅占收入13.5% — 真正有价值的引擎被低估"
      lesson: "公司中最确定的高增长分部可能被叙事更热的分部遮蔽 — SOTP比统一PE更能发现隐藏价值"
      transferable: "所有多业务线公司中存在'被忽视的高增长分部'的情况"

# --- Layer 2.5: 信号分级 ---
signal_hierarchy:
  alpha_signals:
    - signal: "FSD supervised每次干预间隔英里数(TS1)"
      why_alpha: "是FSD从L2+向L4进化的唯一直接可量化度量; 每提升1个数量级代表质的飞跃; L4商业运营隐含要求>10万英里/干预"
      current_reading: "FSD v13-v14约50-200英里(社区追踪), 距L4安全阈值差3个数量级"
    - signal: "FY2028 EPS分散度趋势"
      why_alpha: "当前8.17x是S&P 500中极端异常值(正常1.5-3x); 分散度收窄=不确定性消退; 分散度扩大=分歧加剧"
      current_reading: "8.17x(13位分析师) — 反映市场对'多引擎点火'时点的极度分歧"
    - signal: "Autobidder管理资产规模+VPP节点数(TS6)"
      why_alpha: "唯一被确认有网络效应+数据飞轮的Tesla业务; 管理资产规模直接度量软件粘性和竞争壁垒"
      current_reading: "数GWh级资产; VPP 50,000+台Powerwall(德国+荷兰)"

  confirmation_signals:
    - signal: "汽车毛利率ex-credits季度趋势"
      bullish_threshold: ">20%连续2Q(Q4'25的20.12%被确认为趋势而非噪音)"
      bearish_threshold: "<15%连续2Q(KS2触发 — 现金牛功能失效)"
    - signal: "Cybercab Austin周产量(TS4)"
      bullish_threshold: ">500辆/周@2026年底(量产正常爬坡)"
      bearish_threshold: "<500辆/周@2026年底(地狱模式 — Robotaxi时间表推迟≥12个月)"
    - signal: "FSD $99/月订阅渗透率(TS2)"
      bullish_threshold: ">30%(网络效应启动: 更多订阅→更多数据→更好体验)"
      bearish_threshold: "<10%(对大多数车主不值得 → 收入天花板低)"

  noise_signals:
    - signal: "季度交付量绝对值"
      why_noise: "Tesla已从增长期进入成熟期(汽车); 交付量波动主要反映促销/季节性而非结构变化; 关注利润率趋势而非交付量"
    - signal: "Musk社交媒体声明/时间线承诺"
      why_noise: "承诺兑现率接近0%(2020百万Robotaxi/2022 Cybertruck/2024 Optimus均未兑现); Musk声明是叙事信号非执行信号"
    - signal: "短期PE倍数(386x)"
      why_noise: "A型不确定性资产的PE反映叙事而非估值; EPS分散度8.17x说明分母(EPS)本身无意义"

# --- Layer 3: 关系网络 (内积保真) ---
