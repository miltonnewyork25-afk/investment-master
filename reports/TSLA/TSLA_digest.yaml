        reasoning: "如果纯视觉达L4, FSD数据优势(7.1B英里)成不可复制壁垒, Robotaxi/Optimus路径全部打开"
      - trigger: "内部人再次出现A/D>2.0的集中买入(参照Q3'25模式)"
        price_zone: "$210-270(Q3'25内部人买入区间)"
        reasoning: "聪明钱在低位的集中买入是2018年以来最可靠的Tesla入场信号"
    hold_conditions:
      - "纯视觉FSD方案未被放弃(KS1未触发)"
      - "汽车毛利率维持>15%(KS2未触发)"
      - "FCF不连续3Q为负或$44B现金缓冲充足(KS3)"
