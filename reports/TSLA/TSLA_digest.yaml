      key_difference: "Amazon电商在AWS建设期营收仍20%+ CAGR增长; Tesla汽车FY2025首次负增长 — Tesla缺少'增长型现金牛'为新业务提供自然资金循环"

    - ticker: "Intel(2021-2024)"
      similarity: "核心业务(CPU/汽车)被竞品(AMD/BYD)侵蚀 + 投入数百亿重建新能力(代工/Robotaxi) — 最悲观的历史类比"
      key_difference: "Intel双线失败(既没稳住CPU也没突破代工); Tesla能源业务已验证成功 — Tesla比Intel有更多'安全出口'"

    - ticker: BYD
