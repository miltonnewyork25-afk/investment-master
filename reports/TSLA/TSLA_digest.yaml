    entry_zone: "不适用(发现系统不给入场建议) | 参考: 内部人Q3'25买入区间$210-270; Core SOTP(已有收入业务)$91-169B即$28-52/股"
    catalyst: "Q2 2026事件密集期: Cybercab量产(4月)+Q1财报+Robotaxi加州Polymarket截止(6/30) — 叙事方向分水岭"

  # ★ v1.2新增: 买卖决策框架 ★
  action_framework:
    verdict: "发现系统: 不提供买/卖/持有建议 — 提供可能性空间结构+14个Kill Switch+7个追踪信号"
    buy_triggers:
      - trigger: "FSD干预间隔突破10,000英里(L4安全阈值的10%) — 纯视觉天花板被突破的首个硬证据"
