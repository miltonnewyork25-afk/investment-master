      magnitude: 4  # 物理推导, 但未被最终证实/证伪
      mechanism: "8摄像头共享电磁波谱(可见光380-700nm) → 暴雨/浓雾/逆光同时退化 → NHTSA L4要求单一传感器故障仍安全 → 纯视觉=共模失效"
      kill_switch: "FSD v15+实现>10万英里/干预(达L4安全阈值) → 纯视觉天花板被数据量/模型规模突破"

  moat:
    composite_score: 5  # 6种可识别护城河, 无一为"强", 多数在削弱
    half_life: "分裂: 数据(FSD)>10年(如果纯视觉成功) | 能源软件>5年 | 充电网络~5年(开放后稀释) | 品牌<3年(政治极化) | 制造成本<3年(BYD追赶)"
    dimensions:
