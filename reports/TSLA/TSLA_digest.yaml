        evidence: "NACS成为标准(75K+连接器); FSD订阅粘性待验证"
        vulnerability: "NACS开放=充电壁垒下降; FSD $99/月留存率未知"
      - type: brand
        strength: 2  # 忠诚度从61%降至54%, Musk政治极化
        evidence: "汽车行业唯一'科技品牌'定位; 600M+累计车主"
        vulnerability: "Musk政治参与→品牌极化加剧; 欧洲/美国部分州销量承压"
      - type: ip
        strength: 3  # 端到端FSD架构+Autobidder算法
        evidence: "FSD v14端到端NN(10x扩展); Cortex集群67,000+ H100等效GPU"
        vulnerability: "Dojo D1失败先例说明Tesla芯片能力有边界; 开源趋势可能削弱算法壁垒"

  valuation:
