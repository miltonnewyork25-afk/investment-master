    entry_zone: "$225-245 (Forward Non-GAAP PE 18-20x)"
    catalyst: "(a) FY2027H1 Hyperscaler CapEx增速首次放缓至+10-15% (b) VMware软件确认负增长 (c) SBC/Rev突破12%连续2季"

  # v1.2新增: 买卖决策框架
