# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "Broadcom是一台三层收费站——市场按'双引擎AI增长'定价(62x PE)，但实际只有1.5个引擎在运转，Owner PE 80.5x暴露了2.7倍的Non-GAAP幻觉"
  rating: "审慎关注(偏中性)"
  fair_value: "$224 (-33%)"
  expected_return: "-12%(Non-GAAP框架) 至 -33%(Owner FCF框架), 中位数约-22%"

  key_arguments:
    - claim: "AI ASIC是唯一真增长引擎，但市场按'双引擎'定价"
      direction: bearish
      magnitude: 5
      mechanism: "剥除VMware并购效应后有机增长仅~6.4% CAGR，VMware Q1 FY2026同比仅+1%，传统半导体近零增长→增长引擎覆盖率仅43.5%"
      kill_switch: "VMware有机增长恢复至>5% YoY + AI ASIC保持>35% CAGR→双引擎叙事成立"

    - claim: "SBC制造2.7倍PE幻觉——Non-GAAP PE ~30x vs Owner PE 80.5x"
      direction: bearish
      magnitude: 5
      mechanism: "SBC/Revenue 11.8%且Q1 YoY +70%(收入仅+29%=增速剪刀差2.4倍)，$27B未确认余额锁定至少5年，Owner FCF $19.3B vs 报告FCF $26.9B差距11.9pp"
      kill_switch: "FY2027Q1 VMware保留到期后SBC/Rev回落至<8%→过渡性确认，Non-GAAP接近真实"

    - claim: "网络芯片是最深护城河但仅占15%收入——护城河-收入-估值错配"
      direction: conditional
      magnitude: 4
      mechanism: "Tomahawk/Jericho 90%份额+UEC标准主导+SONiC生态锁定→衰减函数近零→但ASIC(衰减lambda=0.07/yr)占42%收入锚定估值"
      kill_switch: "NVIDIA Spectrum-X在开放以太网市场份额>10%→网络垄断假设需重估"

    - claim: "Hock Tan是不可复制的核心资产也是最大单点故障"
      direction: bearish
      magnitude: 4
      mechanism: "73岁CEO合同延至2030年，6次收购eta均值1.37(标准差0.09)，三板斧未制度化→继任折价约$110B(~7%)"
      kill_switch: "明确内部继任计划+继任者展示独立收购整合能力→key-man折价消除"

    - claim: "62x PE隐含联合概率仅5-8%的完美执行情景"
      direction: bearish
      magnitude: 4
      mechanism: "Reverse DCF隐含AI ASIC 18-22% CAGR持续十年+SBC回归6-8%+VMware 5-8%有机增长→三赌注中两个半可能错"
      kill_switch: "AI推理S曲线如移动互联网般创造永久性算力需求基座→增长叙事不破裂"

  moat:
    composite_score: 6.0  # C维度18.0/30
    half_life: "网络>15年 | ASIC~8-10年(衰减中) | VMware~5-7年(提价侵蚀中) | 传统半导体<3年"
    dimensions:
      - type: switching_cost
        strength: 4
        evidence: "四层加权4.0/5: 网络5.0(Arista $6.8B采购+SONiC锁定)+ASIC 4.5(NRE $50-150M沉没+18-24月替代周期)+VMware 3.5(18-24月迁移)+传统2.0(Apple已自研WiFi)"
        vulnerability: "VMware提价150-1500%系统性降低锁定，Nutanix单季新增1000+客户创8年新高；ASIC外围层已被MediaTek突破"
      - type: scale
        strength: 4
        evidence: "全球最大Fabless半导体$64B收入，R&D/Rev仅17.2% vs Marvell 40-50%，可同时推进6+前沿ASIC项目"
        vulnerability: "规模优势在传统半导体层(Apple WiFi自研)已不构成壁垒"
      - type: ip
        strength: 3.5
        evidence: "20年+定制芯片设计know-how+客户芯片架构spec数据(Google TPU/Meta MTIA/OpenAI Titan核心架构细节)=隐性IP壁垒"
        vulnerability: "知识存在于团队而非制度中→人才流失=知识流失"
      - type: network_effect
        strength: 2.5
        evidence: "网络芯片间接生态效应: 更多OEM用Tomahawk→更多SONiC兼容→更多ISV支持，接近OS级生态锁定"
        vulnerability: "ASIC设计几乎无网络效应(0.5/5)，VMware ISV生态正弱化(ISV同时认证Nutanix+K8s)"

  valuation:
