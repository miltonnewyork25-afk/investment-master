      bearish_threshold: "负增长(KS-02触发→双引擎叙事完全破裂, 当前仅+1%距阈值1pp)"
    - signal: "SBC/Revenue季度趋势"
      bullish_threshold: "<8%(正常化确认→Non-GAAP接近真实)"
      bearish_threshold: ">12%连续2季(KS-03触发→永久成本确认→估值框架迁移)"

  noise_signals:
    - signal: "Non-GAAP EPS beats"
      why_noise: "Non-GAAP剥除SBC+摊销→人为抬高EPS→beat只说明卖方模型也用Non-GAAP→循环论证"
    - signal: "AI收入绝对值(合并披露)"
      why_noise: "管理层合并ASIC+网络报告AI收入→掩盖了最有价值的网络层+最脆弱的ASIC层的分化→看分项趋势比看总量更重要"
    - signal: "卖方目标价调整"
      why_noise: "29/31 Buy评级+1.2% FCF Yield < 无风险利率→卖方共识过度乐观→目标价的信息量接近零"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: NVDA
      similarity: "同为AI半导体赛道, 类似PE区间(62x vs 65x), 同属Hyperscaler供应商"
      key_difference: "NVDA=窄而极深(GPU+CUDA不可替代), AVGO=宽而分散(3层混合体)。NVDA护城河是'唯一选择', AVGO是'最佳选择但有替代'。NVDA SBC/Rev仅4-5%(AVGO的1/3)"

    - ticker: MRVL
      similarity: "同为ASIC设计服务商, 直接竞争AI定制芯片市场"
      key_difference: "MRVL仅做ASIC设计(无网络芯片全栈co-design), R&D/Rev 40-50%(AVGO 17.2%), 只能聚焦2-3个客户(AVGO 6+)"

    - ticker: TXN
      similarity: "同为多元化半导体, 但'多元化'含义完全不同"
      key_difference: "TXN=宽而浅(10万+SKU长尾), AVGO=窄而深(3-4高价值节点各垄断)。TXN 28x PE是通才定价, AVGO 62x PE需要AI增长溢价支撑"

  comparative:
    - dimension: "护城河持久性(10年视角)"
      position: "AVGO网络层 > NVDA CUDA > AVGO ASIC层 > AVGO VMware > AVGO传统半导体"
      reasoning: "网络UEC标准+SONiC锁定衰减近零; CUDA用户锁定深但开源替代渐起; ASIC lambda=0.07/yr结构衰减"

    - dimension: "估值透支度(PE/有机增速)"
      position: "AVGO (62x/6.4%有机=9.7x) > NVDA (65x/高增速=较低PEG) > TXN (28x/中增速=合理PEG)"
      reasoning: "AVGO看似与NVDA PE接近, 但有机增速远低→估值透支最严重"

    - dimension: "SBC对估值的扭曲度"
      position: "AVGO (2.7x差距) >> NVDA (~1.3x差距) > TXN (~1.1x差距)"
      reasoning: "SBC/Rev: AVGO 11.8% >> NVDA 4-5% > TXN ~1%→AVGO的会计口径选择对估值影响最大"

  industry_position:
    quadrant: "高估值 × 中护城河 × 高SBC扭曲 × 单承重墙(AI ASIC增速)"
    archetype: "三层嵌套收费站——收费权分层衰减, 估值锚定在最脆弱层"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→62x PE隐含AI ASIC 18-22% CAGR十年→联合概率仅5-8%=完美执行定价"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "温水煮青蛙引擎联动: ASIC份额65→50% + VMware +1→负 + Hock Tan继任折价→累计-39%无单一触发点"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "5类偏差全偏悲观方向, 系统性低估约5-10pp, 与RCL教训一致→期望回报从-19.8%上修至-14%"

  novel_patterns:
    - name: "1.5引擎解剖(增长引擎覆盖率)"
      description: "对高增速公司剥除并购效应+一次性提价效应→计算有机增长引擎覆盖率(真引擎收入/总收入)→覆盖率<50%=估值倍数应打折"
      transferable_to: ["Danaher", "Constellation Software", "Roper Technologies", "所有并购+提价驱动增长的公司"]

    - name: "三层OPM瀑布(Non-GAAP→Owner→GAAP的PE差距倍数)"
      description: "计算Non-GAAP PE / Owner PE / GAAP PE三层→差距倍数>1.5x=SBC是'房间里的大象'→投资者必须选择世界观"
      transferable_to: ["Snowflake", "Palantir", "ServiceNow", "所有SBC/Rev>8%的科技公司"]

    - name: "收购整合效率函数eta(t)"
      description: "eta = (OPM_post - OPM_pre) / (OPM_target - OPM_pre)。eta>1.0=超额整合, 标准差<0.15=高度可复制。量化serial acquirer的整合能力"
      transferable_to: ["CSU", "DHR", "ROP", "TransDigm", "所有serial acquirer"]

    - name: "护城河-收入-估值错配分析"
      description: "按业务层拆分护城河强度×衰减率×收入贡献→识别'估值锚定在最脆弱层'的结构性风险"
      transferable_to: ["所有多层业务公司"]

    - name: "S曲线预消费风险"
      description: "计算当前PE已隐含S曲线展开到多少百分比→预消费>50%=即使增长如期实现投资者回报约零"
      transferable_to: ["NVDA推理GPU", "VRT液冷", "所有S曲线早期但估值已反映终局的AI基建股"]

    - name: "ASIC锁定衰减函数(lambda)"
      description: "参照Qualcomm/Intel历史推算定制芯片设计锁定的年化衰减率→lambda=0.07/yr意味着每年约2-3%份额结构性流失"
      transferable_to: ["Marvell", "ARM CDS弹性函数校准", "所有面临客户内化风险的ASIC/IP供应商"]

  # v1.2新增: 框架升级贡献
  framework_contributions:
    moat_insights:
      - insight: "异质性混合体护城河需要按层独立评估——四层壁垒来源不同、衰减速度不同、应对策略不同"
        implication: "加权平均不够, 必须判断'稳定的X分还是正在向Y分滑落的X分'"
      - insight: "巴菲特真伪护城河测试: 真护城河=客户主动选择(网络层) vs 锁定租金=客户被困(VMware提价后)"
        implication: "区分'客户不走因为你好'和'客户不走因为走不了'——后者的护城河半衰期更短"
      - insight: "最强护城河贡献最小收入是结构性估值陷阱——估值锚定在脆弱层而非持久层"
        implication: "多层公司应按层做SOTP估值, 用不同倍数反映不同衰减率"

    valuation_insights:
      - insight: "Non-GAAP与Owner PE的差距倍数是科技公司估值的'照妖镜'——2.7倍差距=$232B的分析师共谋成本"
        implication: "对所有SBC/Rev>5%的科技公司, 双口径估值应成为标配"
      - insight: "S曲线预消费风险量化: 当前PE隐含的S曲线展开比例决定了'即使增长如期的回报上限'"
        implication: "增长投资的核心问题不是'增长是否真实'而是'增长是否已被定价'"
      - insight: "多估值方法间25%+ CV = 低确定性→条件评级比单一评级更有信息量"
        implication: "估值离散度>20%时, 'if A then X, if B then Y'格式比'目标价$Z'更诚实"

    screening_insights:
      - insight: "有机增长引擎覆盖率<50% + PE>40x = '增长叙事脆弱'信号"
        implication: "选股筛选增加'有机增长引擎覆盖率'维度——剥除并购后有机增速<10%且PE>40x→标记为高风险"
      - insight: "SBC-to-Revenue加速度(SBC增速/收入增速>1.5x) = 盈利质量恶化先行指标"
        implication: "选股时增加SBC增速剪刀差筛选——持续>1.5x的公司Non-GAAP估值不可信"
      - insight: "eta函数标准差<0.15 + 个人依赖度高 = 可量化的key-man风险"
        implication: "serial acquirer筛选增加'方法论制度化程度'维度——高eta+低标准差+高个人依赖=定价必须包含继任折价"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "看到高增速时立刻剥除并购效应计算有机增速"
      trigger: "总收入增速>20%且近期有大型并购"
      origin: "AVGO +29% YoY→剥除VMware→有机仅~6.4% CAGR, '双引擎'实为'1.5引擎'"
      generalization: "并购型增长和有机增长应获得不同PE倍数——高增速不等于高质量增长"

    - habit: "对科技公司计算Non-GAAP与Owner PE的差距倍数"
      trigger: "SBC/Revenue>5%"
      origin: "AVGO Non-GAAP PE ~30x vs Owner PE 80.5x=2.7倍差距=$232B估值争议"
      generalization: "差距倍数>1.5x时, 估值结论完全取决于框架选择——应双口径并行而非选边站"

    - habit: "多层业务公司按层评估护城河衰减率而非给统一评分"
      trigger: "公司有3+个业务层且壁垒来源不同"
      origin: "AVGO网络衰减近零 vs ASIC lambda=0.07/yr vs VMware被提价侵蚀→统一评分掩盖层间分化"
      generalization: "加权平均护城河分数是信息损失——需要知道每层的独立衰减函数才能判断趋势方向"

    - habit: "serial acquirer用eta函数量化整合能力+追问制度化程度"
      trigger: "CEO以收购整合为核心价值创造方式"
      origin: "Hock Tan eta=1.37(标准差0.09)但三板斧完全个人化→高能力+高风险"
      generalization: "eta高+标准差低+未制度化=定价必须包含继任折价; 对比CSU(已制度化)→折价应更低"

  quality_feedback:
    strengths:
      - "CI洞见质量高——CI-03 S曲线预消费风险(8.5/10)和CI-02 SBC盲区量化(8.0/10)是强原创贡献"
      - "DM密度1.69/千字, 超过1.5/千字基线"
      - "三个非共识假说全部有完整5阶段证据演化(置信度从P0.75到P5的追踪)"
      - "估值四方法加权+明确的不确定性区间(CV 25.1%)比给单一目标价更诚实"
    weaknesses:
      - "A-Score仅7.1/10, CQI 56.4%——品质并非顶级, 与62x PE定价不匹配"
      - "估值确定性低(CV 25.1%), -14%到-33%的区间过宽→对投资者的操作指导有限"
      - "5年P&L预测精度约+/-30%, $175B Base vs $253B Bull在误差范围内重叠"
      - "圆桌v2.0的7位大师框架是AI模拟思想实验而非真实对话"

  hypothesis_tested:
    confirmed:
      - hypothesis: "Non-GAAP PE vs Owner PE差距在高SBC公司制造估值幻觉"
        evidence: "AVGO 2.7倍差距(Non-GAAP ~30x vs Owner 80.5x), SBC增速剪刀差2.4x"
        confidence_after: "高(AVGO是最极端案例, 可推广到所有SBC/Rev>8%的科技公司)"

      - hypothesis: "并购型增长获得与有机增长相同PE是定价错误"
        evidence: "总增速+29%但有机CAGR仅~6.4%, 增长引擎覆盖率43.5%"
        confidence_after: "高(可推广到Danaher/CSU/Roper等serial acquirer)"

    extended:
      - hypothesis: "护城河衰减函数可量化(KLAC/MCO先例)"
        extension: "AVGO展示了同一公司内不同业务层有截然不同的衰减函数——从近零(网络)到lambda=0.07/yr(ASIC)到加速侵蚀(VMware)——从单一衰减率扩展到层间异质性"

      - hypothesis: "key-man风险可通过eta函数定量评估(新方法)"
        extension: "eta均值量化能力强度, 标准差量化可复制性, 制度化程度量化持续性——三维key-man评估框架"

    refuted: []

  limitations:
    - "框架版本v18.2(非最新v19.7), 部分质量门控标准(如G1 270K字符)未达到(报告208K)"
    - "估值区间-14%到-33%由框架选择(Non-GAAP vs Owner FCF)决定, 非基本面不确定性——报告无法替投资者做这个世界观选择"
    - "ASIC衰减函数lambda=0.07/yr基于Qualcomm/Intel历史, AI ASIC无直接先例→可能系统性偏高或偏低"
    - "Hock Tan继任折价$110B(~7%)是理论估计, 无法用历史数据校准(样本量=0)"
