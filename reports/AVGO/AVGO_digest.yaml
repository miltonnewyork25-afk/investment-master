# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "1.5引擎解剖——并购+提价增长幻觉的穿透方法"
    chain: >
      总增长+29% YoY → 剥除VMware并购效应(FY2024 $17B新增)
      → 剥除VMware订阅转换提价(150-1500%一次性效应)
      → 有机增长仅~6.4% CAGR(FY2022-2024)
      → AI ASIC是唯一真增长引擎(43.5%收入贡献100%有机增长)
      → 市场按"双引擎"定价(62x PE)实际是"1.5引擎"定价
      → 增长引擎覆盖率<50% = 估值倍数应打折
    transferable_to: "任何通过并购+提价制造增长叙事的公司(Danaher, CSU, Roper)"
    reasoning_habit: "看到高增速时立刻追问'有机增速是多少'——剥除并购效应和一次性提价后的增速才是真实增长引擎的强度"

  - id: "CC-2"
    name: "SBC三层OPM瀑布——2.7倍PE幻觉的识别"
    chain: >
      Non-GAAP OPM 65.6% → 减摊销13pp(会计噪音, 可争议)
      → Owner OPM 52.9% → 减SBC 12pp(真实经济成本)
      → GAAP OPM 39.9%
      → 三层差距=22pp=PE从~30x到80.5x(2.7倍)
      → $232B的"分析师共谋成本"(29/31 Buy评级用Non-GAAP)
      → 投资者必须选择世界观: SBC是零成本还是真实稀释?
    transferable_to: "所有高SBC科技公司(Snowflake, Palantir, ServiceNow, NVDA)"
    reasoning_habit: "对每家科技公司计算Non-GAAP与GAAP的PE差距倍数——如果>1.5x说明SBC是'房间里的大象'"

  - id: "CC-3"
    name: "护城河收入占比错配——最强壁垒贡献最少收入"
    chain: >
      网络芯片: 定价权4.5/5, 衰减函数近零, 份额90%, UEC标准主导
      → 但仅占约15%收入
      → ASIC: 份额60-70%, +106% YoY, 但衰减lambda=0.07/yr, 定价权3.5/5
      → 占约42%收入 = 估值锚定在最脆弱层
      → 管理层合并AI收入披露掩盖了这个错配
      → 如果网络独立估值=基础设施垄断者定价(更高倍数)
    transferable_to: "任何多层业务公司的层间护城河-收入-估值错配分析"
    reasoning_habit: "分析多业务公司时逐层评估护城河强度vs收入贡献——估值锚定在哪一层决定了风险特征"

  - id: "CC-4"
    name: "收购整合效率函数eta(t)——serial acquirer的量化评估"
    chain: >
      定义: eta(t) = (OPM_post - OPM_pre) / (OPM_target - OPM_pre)
      → Hock Tan 6次收购eta均值1.37, 标准差0.09
      → eta>1.0 = 整合后OPM超越华尔街目标(收购超额完成)
      → 标准差极低(0.09) = 方法论高度可复制
      → 但三板斧未制度化(存在于Tan个人判断中)
      → eta的边界条件: 当被收购资产已是高margin(>60%)时提升空间受限
      → 73岁CEO = eta函数的存续时间有限
    transferable_to: "任何serial acquirer评估(CSU, DHR, ROP, TransDigm)"
    reasoning_habit: "评估收购型CEO时用eta函数量化整合能力——均值衡量能力强度, 标准差衡量可复制性, 个人依赖度衡量持续性"

  - id: "CC-5"
    name: "S曲线预消费风险——增长如期实现但投资者回报为零"
    chain: >
      AI推理ASIC S曲线当前在5-10%渗透率
      → 62x PE已经隐含S曲线从5%展开到50%+的全部价值
      → 即使增长完全如期实现, 投资者回报约等于零
      → 因为市场已经"预消费"了未来增长
      → 只有增长超越隐含假设(CAGR>25%)才能创造正回报
      → 这等于赌一个联合概率5-8%的完美执行情景
    transferable_to: "任何处于S曲线早期但估值已反映终局的AI基建股(NVDA推理GPU, VRT液冷)"
    reasoning_habit: "看到'S曲线早期'的成长故事时, 立刻计算'当前PE已经预消费了S曲线的多少百分比'——预消费>50%=增长兑现也无回报"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "Broadcom是AI双引擎增长公司(市场共识)"
      final: "实际是'1.5引擎收费站'——AI ASIC是唯一真引擎, VMware提价红利已近耗尽"
      pivot: "剥除并购效应后有机增长仅~6.4% CAGR + VMware Q1 FY2026同比仅+1%"

    - initial: "Non-GAAP PE ~30x是合理估值(29/31分析师共识)"
      final: "Owner PE 80.5x暴露真实估值水平, 2.7倍差距是世界观选择而非技术争论"
      pivot: "SBC/Rev 11.8%且Q1 YoY +70%增速剪刀差2.4倍 + $27B未确认余额 + R&D人员占SBC 66%"

    - initial: "ASIC设计锁定=永续护城河(市场叙事)"
      final: "ASIC锁定有衰减函数(lambda=0.07/yr, 每年2-3%份额结构性流失), 网络芯片才是真正的永续护城河"
      pivot: "MediaTek已获Google TPU I/O模块订单 + Google正在系统性降低Broadcom依赖度 + 网络UEC标准锁定无衰减"

  surprises:
    - finding: "Owner PE 80.5x vs Non-GAAP PE ~30x的2.7倍差距——$232B的'分析师共谋成本'"
      implication: "29个Buy分析师选择性使用Non-GAAP可能是AI时代最大的集体估值盲区"

    - finding: "最强护城河(网络, 衰减近零)仅贡献15%收入, 估值锚定在最脆弱层(ASIC, lambda=0.07/yr)"
      implication: "管理层合并AI收入披露恰恰掩盖了最有价值的竞争优势——分拆披露可能释放价值"

    - finding: "Hock Tan三板斧eta均值1.37标准差仅0.09——收购整合能力高度可复制但完全个人化"
      implication: "当方法论高度可复制但未制度化时, key-man风险不是'可能'而是'确定'的定价因子"

    - finding: "Arista CEO公开称Broadcom定价'horrendous'但仍签下$6.8B采购——抱怨但无法离开"
      implication: "B2B定价权的最强实证不是客户满意而是客户不满但不离开"

  blind_spots:
    - area: "AI CapEx周期拐点的精确时间"
      why_matters: "决定B1承重墙何时受压——FY2028(Bear) vs FY2030+(Bull)的差异是$100B+估值差距"
      monitor: "Hyperscaler季度CapEx指引+AI ASIC订单补充速率"

    - area: "市场估值regime是否会从Non-GAAP迁移到Owner FCF"
      why_matters: "-14%(Non-GAAP) vs -33%(Owner FCF)的差距完全由框架选择决定, 框架迁移概率不可预测"
      monitor: "卖方分析师是否开始引用Owner Earnings口径 + 机构投资者讨论中SBC出现频率"

    - area: "ASIC锁定衰减函数lambda=0.07/yr的准确性"
      why_matters: "基于Qualcomm/Intel历史推算, AI ASIC缺乏直接历史先例, 真实衰减可能更快或更慢"
      monitor: "MediaTek在Google TPU的份额扩展速度 + 客户自研团队规模变化"

    - area: "Hock Tan继任的实际影响"
      why_matters: "10-15% key-man折价是理论估计, 实际影响取决于继任者身份和市场情绪"
      monitor: "管理层继任计划声明 + 内部晋升 vs 外部空降信号"

  # v1.2新增: 卖出时机教训
  sell_lessons:
    - scenario: "温水煮青蛙引擎联动——每一步都'正常'但终点-39%"
      lesson: "AI ASIC份额缓慢从65%降至50% + VMware增长+1%→0%→负 + Hock Tan 73→78岁→继任折价——没有任何单一事件触发卖出信号, 但累积效应-39%"
      transferable: "所有多层业务中各层缓慢同步衰减的公司——永远不会有'明确卖出信号'的渐进恶化最危险"

    - scenario: "PE>95百分位+有机增速被并购掩盖→估值透支增长"
      lesson: "62x PE处于历史>95百分位, 5年PE均值仅约35x(偏离均值+77%)——均值回归的统计概率显著偏向下行"
      transferable: "所有通过并购制造高增速但有机增速平庸的公司"

    - scenario: "SBC增速剪刀差2.4x(SBC +70% vs 收入+29%)持续恶化"
      lesson: "当SBC增速持续超过收入增速时, 表面盈利质量在系统性恶化——等到市场发现时可能已晚"
      transferable: "所有AI人才密集型公司——SBC-to-Rev加速度是盈利质量恶化的先行指标"

