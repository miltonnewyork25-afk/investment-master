      current_reading: "70% vs 15-20%, 差距约50pp — 市场系统性高估AI全面兑现概率"
    - signal: "CEO/CTO持股变化(零买入+系统性减持)"
      why_alpha: "最有信息优势群体的行为信号 — 学术研究支持内部人12个月预测力 > 卖方评级"
      current_reading: "CEO减持70.8%, CTO减持69.8%, 全年零公开市场买入"
    - signal: "DR/Revenue比率季度变化"
      why_alpha: "DR是EOS锁定效应的实时仪表盘 — DR增速vs收入增速的比值直接反映护城河健康度"
      current_reading: "59.7%(FY2025), 从FY2020的28.1%持续上升 — 锁定效应在增强"

  confirmation_signals:
    - signal: "NVIDIA Spectrum-X DC Ethernet季度份额"
      bullish_threshold: "份额增速放缓至<+50% YoY且<30%(天花板确认)"
      bearish_threshold: "份额>35%且开始渗透非AI DC(存量替换启动)"
    - signal: "ANET季度Revenue增速"
      bullish_threshold: ">22% YoY(结构性增长确认, 解释A获支撑)"
      bearish_threshold: "<15% YoY连续2季(增速失速, Bear case启动)"
    - signal: "单季Hyperscaler CapEx同比增速"
      bullish_threshold: ">20% YoY(AI投资周期持续)"
      bearish_threshold: "同比下降>15%(脉冲假设获支撑)"

  noise_signals:
    - signal: "卖方目标价调整(82%买入评级)"
      why_noise: "卖方普遍使用GAAP PE+共识增速 → 不区分增长质量+概率分配 → 目标价集体偏乐观"
    - signal: "单季AI网络收入绝对值"
      why_noise: "AI网络收入$1.5B的边界定义模糊(ANET未单独披露) → 绝对值波动是噪音, 看份额趋势"
    - signal: "日度/周度股价波动"
      why_noise: "PE 52x在成长因子轮动中波动极大 → 看季度基本面变化而非价格"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: CSCO
      similarity: "网络设备龙头, 企业+DC全覆盖, 历史类比核心参照(Cisco 1998)"
      key_difference: "CSCO=成熟+多系统分裂+campus统治 vs ANET=成长+EOS单一代码库+DC领先但campus进攻中"

    - ticker: NVDA
      similarity: "AI基础设施核心受益者, DC硬件供应商"
      key_difference: "NVDA=GPU+网络垂直整合+AI训练主导 vs ANET=纯网络+Ethernet+推理/非AI更有优势 | Spectrum-X使二者从合作变为直接竞争"

    - ticker: PANW
      similarity: "网络安全平台化转型(硬件→软件订阅), 可比估值区间"
      key_difference: "PANW已实现软件订阅化分拆(ARR>$4B) vs ANET的EOS软件价值仍嵌入硬件售价中"

  comparative:
    - dimension: "AI基础设施受益强度"
      position: "NVDA (GPU+网络全栈) > ANET (Ethernet网络) > CSCO (传统DC/campus)"
      reasoning: "NVIDIA在AI训练主导+捆绑扩展推理 | ANET在推理前端有优势但后端失守 | Cisco几乎缺席AI"

    - dimension: "护城河深度"
      position: "CSCO (campus统治30年) > ANET (EOS 3.5/5, 7.5年半衰期) > NVDA网络 (Spectrum-X 2年历史)"
      reasoning: "Cisco的campus嵌入=制度级 | ANET的EOS有真实但可衰减的转换成本 | NVIDIA网络太新缺乏护城河"

    - dimension: "估值吸引力"
      position: "CSCO (PE 16x) > ANET (PE 52x但增速28%) > NVDA (PE 30x但增速120%+)"
      reasoning: "CSCO便宜但增速低 | ANET贵且增速质量存疑 | NVDA贵但增速无争议"

    - dimension: "客户集中度风险"
      position: "ANET (42%前2客户) >> NVDA (~35%但分散性更好) > CSCO (高度分散)"
      reasoning: "ANET的MSFT(26%)+Meta(16%)集中度在恶化 | 客户集中=脆弱性而非优势"

  industry_position:
    quadrant: "高增速 × 高估值 × 护城河中等 × 客户集中"
    archetype: "AI基础设施受益者 — 搭车而非造车(顺势搭车vs全力押注)"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF → 市场隐含CAGR 18.9% → 需7信念同时成立 → 联合概率仅6.7%"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "温水煮青蛙场景: 增速28%→22%→15%→12%缓慢下降, PE 52x→35x→28x渐进压缩"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1~RT-7红队七问 + 承重墙脆弱度3.82/5.0 + 认知偏差6/8类 + 双向校准(空方倾向7:3)"

    - pattern_id: "competitive_benchmarking.chinese_competitor_deep_dive"
      application: "不适用(非中国竞争者) — 但NVIDIA Spectrum-X深度分析(5路径×概率)使用了类似竞品量化框架"

  novel_patterns:
    - name: "Cisco 1998多维类比评分 (★★★★★冠军技术)"
      description: "4维度(PE区间/增速/份额/估值结构)定量匹配评分(★系统) + 3结构差异标注 — 防止类比成为确认偏差工具"
      transferable_to: ["任何当前高增长公司vs历史同类的类比分析", "PE>40x的企业IT公司泡沫检测"]

    - name: "Token经济Jevons悖论框架"
      description: "单价暴跌但总量爆炸的三重乘数模型(推理时计算缩放×Agent循环×企业渗透) → 区分训练vs推理的受益逻辑"
      transferable_to: ["所有AI基础设施投资分析", "云计算/CDN/边缘计算等按量计费的基础设施"]

    - name: "行为-言辞矛盾三维检测"
      description: "R&D/Revenue方向 × CEO/CTO持股方向 × CapEx投入方向的三维矛盾评分 — 言辞看多但行为不匹配=信号"
      transferable_to: ["所有管理层声称看到重大机会的公司", "内部人交易信号分析"]

    - name: "B3/B7矛盾四象限映射"
      description: "将两个强矛盾信念(-2关系)拆解为离散概率空间(NVIDIA赢/输 × AI周期长/短)而非二元判断"
      transferable_to: ["任何信念矩阵中存在-2(强矛盾)关系的分析"]

    - name: "DR锁定效应护城河假设(NCH-1)"
      description: "非共识: DR增速远超收入增速 = 护城河本质是合同锁定而非技术粘性 — DR/Revenue比率是护城河实时仪表盘"
      transferable_to: ["高DR/Revenue比率的SaaS/平台公司", "转换成本量化分析"]

    - name: "概率反演(scipy.optimize)"
      description: "从4情景×价格×约束求解市场隐含概率分布 → 70% Bull vs 15%揭示55%概率差距"
      transferable_to: ["PW4+情景模式分析", "任何需要还原市场隐含假设的估值分析"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "护城河本质可能是合同锁定(DR)而非技术粘性(EOS) — DR增速8.3x vs 收入增速3x的不对称揭示了真正的锁定机制"
        implication: "评估软件公司护城河时, DR/Revenue比率趋势可能比技术架构分析更能揭示真实锁定强度"
      - insight: "EOS护城河在现有客户'防守'有效(转换成本4.5/5)但在AI新增客户'进攻'端严重不足"
        implication: "护城河评估应区分存量防守vs增量进攻 — 存量强不代表增量也强, 两者的半衰期不同"
      - insight: "LLM/AI Agent可能在5年内降低软件转换成本(替代人力运维=降低EOS的人力锁定)"
        implication: "评估技术护城河时需考虑AI对转换成本本身的侵蚀 — 'AI让一切更容易'包括让切换供应商更容易"

    valuation_insights:
      - insight: "概率反演揭示市场隐含概率(70% Bull) vs 分析师评估(15%) — 55%差距比绝对估值更有诊断价值"
        implication: "高PE成长股的估值争议本质是概率分配争议而非模型参数争议 — 概率反演比调参数更有信息量"
      - insight: "方法离散度(1.41x)和情景离散度(2.25x)衡量不同类型的不确定性 — 前者可通过更好分析缩小, 后者不可"
        implication: "报告应区分方法论不确定性和事件不确定性 — 混淆二者会高估分析的精度"
      - insight: "PE/AI比(每1%AI相关性获得的PE倍数)是衡量AI估值溢价的新指标 — ANET 2.5x是L3层最高"
        implication: "AI受益者估值分析应计算PE/AI比 — 区分合理AI溢价和过度AI溢价"

    screening_insights:
      - insight: "CEO+CTO同时大幅减持>50%+全年零买入 = 信息不对称红旗 — 内部人12月预测力>卖方"
        implication: "选股筛选应增加'内部人行为矛盾'过滤器: 管理层大幅减持+言辞看多=标记为review"
      - insight: "42%客户集中度 + 前2客户增速占总增速>60% = 增长质量虚高"
        implication: "高增速公司应计算'剥离大客户后增速' — 若差距>10pp则增长质量存疑"
      - insight: "PE>50x + 历史先例(Cisco 1998)PE压缩概率极高 — 企业IT领域PE>50x维持5年案例几乎不存在"
        implication: "选股时企业IT/网络设备PE>45x应自动标记为'估值泡沫检测'"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "看到AI受益者时立刻区分训练vs推理受益逻辑"
      trigger: "公司被标签为'AI基础设施受益者'"
      origin: "Token经济Jevons悖论 — 推理基础设施需求结构与训练完全不同, 受益者也不同"
      generalization: "AI不是单一主题 — 训练/推理/Agent各有不同基础设施需求, 不能用'AI利好'一刀切"

    - habit: "看到PE>45x时立刻做概率反演而非正向DCF"
      trigger: "成长股PE>45x且市场共识看多"
      origin: "ANET Reverse DCF → 市场隐含70% Bull vs 我们15% → 揭示55%概率差距是估值争议的数学根源"
      generalization: "高PE成长股的核心问题不是'值多少钱'而是'市场在赌什么概率' — 概率反演比目标价更有诊断价值"

    - habit: "看到管理层'AI变革'言辞时交叉验证R&D/持股/CapEx三维行为"
      trigger: "管理层在earnings call中频繁提及AI/变革/历史机遇"
      origin: "ANET管理层言辞看多但CEO/CTO减持70%+ + R&D费用率下降 + CapEx仅1.33%"
      generalization: "言辞免费, 行为有成本 — 当两者矛盾时, 信行为不信言辞"

    - habit: "历史类比必须4维定量+结构差异, 否则是确认偏差"
      trigger: "分析中需要引用历史类比(如Cisco 1998/1999年互联网泡沫)"
      origin: "Cisco 1998类比4维高度匹配但3个结构差异阻止了Cisco式泡沫化路径 — 不做差异分析就会错误推导"
      generalization: "类比是最强大也最危险的分析工具 — 强大因为直觉强, 危险因为选择性记忆"

  quality_feedback:
    strengths:
      - "Reverse DCF信念反演(7信念闭环+概率反演) — 本报告最核心洞见, 有效防止结论先行偏差"
      - "Cisco 1998多维类比(4维★评分+3差异) — 冠军级历史类比方法论(4.5/5)"
      - "Token经济Jevons悖论(三重乘数模型) — 前沿变量分析, 区分训练vs推理受益逻辑"
      - "DM密度1.72/千字(478个锚点) — 数据锚定扎实"
      - "红队七问+双向校准 — 承重墙3.82/5.0和温水煮青蛙35%是关键产出"
    weaknesses:
      - "D1估值弱 + D6催化弱 + D7风险弱 + D10时机弱 — 不是分析不到位而是基本面确实不支持"
      - "情景概率分配为D级(纯主观) — 核心估值方法(M5权重25%)依赖最弱数据环"
      - "时间框架不一致(用10年DCF估值但EOS有效性假设5年后高度不确定) — 方法论层面矛盾"
      - "Campus市场分析相对薄弱(Phase 1-3中被系统性忽视, P4红队才识别) — 被忽视的多头因素"

  hypothesis_tested:
    confirmed:
      - hypothesis: "Reverse DCF必须P1前置(CRM v2.0铁律O)"
        evidence: "Ch9 Reverse DCF有效防止了从Bull $150-175开始分析的确认偏差"
        confidence_after: "高(连续执行确认有效)"

      - hypothesis: "温水煮青蛙比黑天鹅更可能发生(MCO报告)"
        evidence: "35%概率的渐进恶化路径vs12-15%概率的黑天鹅 — 温水煮青蛙是最高概率的看空情景"
        confidence_after: "高(ANET和MCO独立确认)"

    extended:
      - hypothesis: "Cisco 1998类比框架"
        extension: "从定性类比扩展为4维定量匹配(★系统)+3结构差异标注 — 成为可复用的冠军技术"

      - hypothesis: "内部人行为分析"
        extension: "从单维度(买/卖)扩展为三维矛盾检测(R&D方向×持股方向×CapEx方向)"

    refuted:
      - hypothesis: "AI利好网络设备商一刀切"
        evidence: "训练集群利好NVIDIA(捆绑优势), 推理集群利好ANET(Ethernet优势) — 不能笼统说'AI利好ANET'"
        lesson: "AI受益分析必须区分训练/推理/Agent不同场景, 每个场景的竞争格局完全不同"

  limitations:
    - "NVIDIA Spectrum-X份额增长来源(增量vs存量)无法从公开数据区分 → 核心竞争判断悬而未决"
    - "DR合同期限结构未披露 → NCH-1(DR锁定效应护城河假设)可验证性受限"
    - "AI CapEx ROI尚处于'信仰'而非'证据'阶段 → 周期长度判断本质上是猜测"
    - "管理层减持动机不可观测 → 可能是理性套现/税务规划而非悲观信号"
    - "时间框架不一致: 10年DCF但EOS有效性/AI周期/NVIDIA竞争的关键假设在3-5年内面临验证"
    - "概率分配(Bull 20%/Base 45%/Bear 35%)无量化基础率校准 → M5估值权重25%依赖最弱数据环"
