# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "EOS护城河(转换成本4.5/5)和47% FCF margin的优质公司, 但PE 52x定价了接近完美的AI兑现, 42%客户集中度和NVIDIA份额侵蚀使安全边际不足"
  rating: "审慎关注"
  fair_value: "$100-107 (5方法加权$97, 概率加权$105-107)"
  expected_return: "-23%至-24% (vs $137.23)"

  key_arguments:
    - claim: "PE 52x隐含市场赌70% Bull概率, 我们评估仅15-20%"
      direction: bearish
      magnitude: 5  # 概率反演+5方法交叉验证
      mechanism: "Reverse DCF隐含10年Revenue CAGR 18.9% → 需7个信念同时成立 → 联合概率仅~6.7%"
      kill_switch: "AI确为10年超级周期+ANET在推理前端网络建立主导地位 → FY2028 EPS $5.50+ justify当前PE"

    - claim: "NVIDIA Spectrum-X正以相变速度侵蚀ANET DC份额"
      direction: bearish
      magnitude: 5  # 硬数据: 0→25.9%份额, +647% YoY
      mechanism: "GPU+网络捆绑销售 → 超大规模客户买GB200时顺便配Spectrum-X → ANET份额从21.3%降至19.2%(2季-2.1pp)"
      kill_switch: "Spectrum-X天花板28-33%(仅限AI新增) + ESUN标准化利好品牌Ethernet + Enterprise Campus安全区NVIDIA无产品"

    - claim: "42%收入集中于MSFT(26%)+Meta(16%), 集中度在恶化而非改善"
      direction: bearish
      magnitude: 4  # 硬数据+PPDA确认市场低估
      mechanism: "MSFT CapEx+82%导致权重被动上升 → 剥离前2客户后ANET增速仅13% → 内部化概率5年内25-35%"
      kill_switch: "Campus分散化成功使前2客户浓度3年降至<30% + AI CapEx持续增长抵消内部化风险"

    - claim: "EOS+DR锁定构成真实但非永久的护城河(3.5/5, 半衰期7.5年)"
      direction: bullish
      magnitude: 4  # DR $5.37B(8.3x增长)+转换成本$2-5M量化
      mechanism: "DR从$651M→$5.37B(5年8.3x) → 客户预付多年EOS/CloudVision合同 → 锁定效应+技术粘性双重护城河"
      kill_switch: "SONiC+LLM网络管理工具在3-5年内缩小功能差距 → EOS人力转换成本护城河被AI替代"

    - claim: "Token经济Jevons悖论为推理基础设施创造结构性需求, ANET在前端网络有先发优势"
      direction: conditional
      magnitude: 3  # 结构性趋势明确但ANET份额捕获不确定
      mechanism: "Token单价降1000x但总支出+320% → 推理>训练(2026年首超) → 推理集群分布式特征天然适合Ethernet(非InfiniBand)"
      kill_switch: "NVIDIA将捆绑策略扩展至推理网络(ConnectX-8+Spectrum-X800全覆盖) → ANET连推理前端也失守"

  moat:
    composite_score: 7.0  # 3.5/5换算
    half_life: "7.5年(EOS>5年, DR合同1-3年, 技术差异化3-5年)"
    dimensions:
      - type: switching_cost
        strength: 4.5  # 4.5/5
        evidence: "eAPI/Python脚本>10K行不可跨平台复用, 迁移需重写自动化+重培训团队+重集成监控, 成本$2-5M"
        vulnerability: "SONiC成熟+LLM网络管理Agent可能在5年内降低人力转换成本"
      - type: data
        strength: 4  # DR锁定效应
        evidence: "DR $5.37B(DR/Revenue 59.7%), 5年增长8.3x, CloudVision渗透3K+客户"
        vulnerability: "DR合同期限未披露, 若1-2年期则锁定效应远弱于3-5年期"
      - type: scale
        strength: 3  # EOS单一代码库规模效应
        evidence: "R&D费用率从22.5%降至13.7%, 绝对值从$521M增至$1.24B"
        vulnerability: "merchant silicon策略降低了硬件差异化壁垒"
      - type: network_effect
        strength: 2.5  # 有限的数据反馈飞轮
        evidence: "超大规模客户部署→EOS功能优化→更好产品→更多客户, GitHub EOS相关repo 2000+(vs SONiC ~500)"
        vulnerability: "网络效应远弱于CME/Visa级别, 更多是技术领先而非真正的网络锁定"

  valuation:
    reverse_dcf_implied: "市场隐含10年Revenue CAGR 18.9%, 需7个信念同时成立(AI持续+Ethernet赢+份额稳+客户不流失+margin维持+campus成功+EOS锁定)"
    methods_used: ["Reverse DCF", "3阶段DCF(Python)", "SOTP", "可比公司", "情景加权(P4红队调整)"]
    dispersion: "1.41x方法离散度($78-$110), 2.25x情景离散度($68-$153)"
    consensus_vs_ours: "市场隐含70% Bull概率+18.9% CAGR | 我们评估15-20% Bull+15-18% CAGR → 核心分歧在情景概率分配"
    entry_zone: "$85-100 (PE 25-30x, 对应Base-Bear区间)"
    catalyst: "FY2026 Q1财报(2026年5月)鉴别AI需求结构vs周期 | NVIDIA份额数据确认天花板 | AI CapEx ROI首批量化报告"

  # ★ v1.2新增: 买卖决策框架 ★
  action_framework:
    verdict: "审慎观望 — 品质确认(FCF 47%+EOS护城河)但估值过高(PE 52x vs 公允$97-107), 等待PE压缩至25-30x"
    buy_triggers:
      - trigger: "AI CapEx周期见顶+NVIDIA份额侵蚀叙事导致PE压缩"
        price_zone: "$85-100 (PE 25-30x)"
        reasoning: "Base情景DCF $106+Campus增长缓冲 → PE 25-30x提供安全边际 + FCF Yield>4%"
      - trigger: "FY2026增速连续2季<15%导致成长股投资者抛售"
        price_zone: "$70-85 (PE 20-25x)"
        reasoning: "Bear情景但EOS护城河完整+Campus增长解耦AI → 被过度抛售的优质公司"
    hold_conditions:
      - "EOS转换成本有效(DR/Revenue>50%且持续增长)"
      - "Campus增速>30%(AI解耦缓冲有效)"
      - "DC Ethernet份额>15%(NVIDIA未突破天花板)"
      - "毛利率>60%(硬件溢价未被白盒/SONiC瓦解)"
    sell_triggers:
      - signal: "NVIDIA Spectrum-X DC Ethernet季度份额突破35%且ANET<15%"
        severity: "action"
        action: "减仓50%, NVIDIA捆绑优势扩展至非AI领域=护城河基础动摇"
      - signal: "MSFT宣布类似Nitro的内部网络硬件项目"
        severity: "action"
        action: "减仓50%, 26%收入客户内部化=收入断崖风险"
      - signal: "PE>65x且无增速加速催化"
        severity: "warning"
        action: "减仓25%, Cisco 1998教训: PE从65x→12x"
      - signal: "DR/Revenue比率连续2季下降>5pp"
        severity: "warning"
        action: "重新评估EOS锁定效应, 若DR质量下降则减仓"
    position_sizing: "当前PE下Kelly为负(强烈不买) | PE 25-30x时重新评估"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "Token经济Jevons悖论 → 推理基础设施结构性需求"
    chain: >
      Token单价下降1000x(GPT-4→GPT-4o-mini)
      → 但总支出反增320%(Jevons悖论)
      → 三重乘数: 推理时计算缩放(3-172x) × Agent循环(15x) × 企业渗透(5→40%)
      → 推理占AI计算从33%→67%(2027)→75%(2028)
      → 推理集群特征: 分布式+小规模+前端密集 ≠ 训练集群(集中+大规模+后端密集)
      → Ethernet的延迟劣势在推理中几乎不存在
      → 推理前端网络是净新市场(CAGR>40%)
      → ANET的campus+enterprise+CloudVision统一管理能力天然契合推理分布式特征
    transferable_to: "所有AI基础设施受益者的需求结构分析 — 区分训练vs推理的不同受益逻辑"
    reasoning_habit: "看到AI需求时追问'训练还是推理' — 两者的基础设施需求/竞争格局/受益者完全不同"

  - id: "CC-2"
    name: "Cisco 1998多维类比 → 高增长网络公司估值天花板"
    chain: >
      Cisco 1998 = 互联网基础设施之王, PE ~55x, 流量全过路由器
      → ANET 2025 = AI基础设施关键节点, PE 52x, 数据全过交换机
      → 4维类比评分: PE区间(★★★★★) + 增速(★★★★) + 份额(★★★★) + 估值结构(★★★★★)
      → 但3个结构差异阻止Cisco式泡沫化:
        差异1: 42%客户集中度(Cisco分散) → 增长天花板更低
        差异2: NVIDIA Spectrum-X(Cisco无同级对手) → 份额下降是现实
        差异3: AI CapEx周期(Cisco是长期趋势) → 周期性更强
      → 结论: ANET 2025≈Cisco 1998但不会走向200x PE → 52x可能就是顶部附近
    transferable_to: "任何当前高增长公司vs历史同类的类比分析 — 需4维定量匹配+结构差异标注"
    reasoning_habit: "历史类比不是找相似点就够了 — 必须定量匹配度+结构差异分析, 否则类比是确认偏差的温床"

  - id: "CC-3"
    name: "DR锁定效应 vs EOS技术锁定 → 护城河本质判断"
    chain: >
      共识: EOS单一代码库是ANET核心护城河
      → 但DR从$651M→$5.37B(8.3x)增速远超收入增速
      → 追问: 客户留下是因为EOS好还是因为已预付多年合同?
      → 验证: 两种锁定并存, 但EOS技术锁定持久性>5年 > DR合同锁定1-3年
      → 关键: DR锁定是可观测的(财务指标), EOS技术锁定是推断的(技术架构)
      → 投资含义: DR/Revenue比率是护城河健康度的实时仪表盘
    transferable_to: "所有高DR/Revenue的SaaS/平台公司 — DR是锁定效应的硬证据, 但需区分合同锁定vs技术锁定"
    reasoning_habit: "看到高DR时追问'客户是被锁住还是自愿续费' — 前者是防守型护城河(可能流失), 后者是进攻型护城河(会扩展)"

  - id: "CC-4"
    name: "内部人行为-言辞矛盾 → 信息不对称信号"
    chain: >
      管理层言辞: "AI变革性机会""网络是AI基础设施核心"
      → 但CEO Ullal卖出70.8%直接持股, CTO Duda卖出69.8%
      → R&D/Revenue从22.5%降至13.7%(AI机会这么大为什么不加大研发?)
      → CapEx从$32M增至$120M但仍仅1.33%(fabless模型几乎未变)
      → $10.7B现金囤积不分红不大收购(VeloCloud仅~$300M级别)
      → 结论: 行为-言辞矛盾评级中度 — 更像"顺势搭车"而非"全力押注AI"
    transferable_to: "所有管理层声称看到重大机会但投资行为不匹配的公司"
    reasoning_habit: "管理层说什么不重要, 看他们做什么 — R&D方向/持股变化/CapEx投入三维度交叉验证言辞"

  - id: "CC-5"
    name: "温水煮青蛙 → 高增长股最危险的下跌模式"
    chain: >
      概率35%的渐进恶化路径(非黑天鹅):
      → 2026: AI增速从28%放缓至22%(仍看似强劲) → PE维持45-48x
      → 2027: NVIDIA份额扩至30%+campus增速放缓 → 增速降至15% → PE压缩至35x
      → 2028: AI CapEx开始正常化+白盒渗透加速 → 增速降至12% → PE压缩至28x
      → 累计效果: 股价从$137缓跌至$95-105(-23-31%), 但过程无明确"卖出信号"
    transferable_to: "所有PE>40x的成长股估值分析 — 温水煮青蛙比黑天鹅更可能发生且更难应对"
    reasoning_habit: "对成长股不要只问'什么会崩盘' — 更要问'什么会缓慢恶化到投资者来不及反应'"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "ANET是AI基础设施的核心赢家, AI网络TAM扩大利好ANET"
      final: "AI TAM扩大但NVIDIA捆绑销售使ANET在AI领域份额萎缩, TAM扩大的主要受益者是NVIDIA"
      pivot: "NVIDIA Spectrum-X从0到25.9%份额仅6个月, +647% YoY — 这是相变而非渐进竞争"

    - initial: "FY2025收入增长28.6%证明AI需求结构性强劲"
      final: "增长的三种竞争性解释(结构性/周期叠加/峰值捕获)中, 后两者数据支撑更强"
      pivot: "RT-7替代解释挑战: 剥离前2客户后增速仅13% + AI网络$1.5B边界定义模糊"

    - initial: "EOS技术粘性是ANET核心护城河"
      final: "DR合同锁定效应(8.3x增长)可能比EOS技术粘性更重要 — 真正护城河是预付合同而非技术"
      pivot: "NCH-1: DR增速远超收入增速 = 客户被合同锁住而非被技术吸引"

  surprises:
    - finding: "NVIDIA DC Ethernet份额在6个月内从0→25.9%, 增速是ANET的22倍 — 这是相变级别"
      implication: "GPU+网络捆绑改变了竞争规则, ANET在AI后端集群的结构性劣势可能不可逆"

    - finding: "CEO/CTO 2025年分别减持70%+直接持股, 全年零公开市场买入"
      implication: "最有信息优势的人在高位系统性减仓 — 行为-言辞矛盾是不可伪造的信号"

    - finding: "Token经济Jevons悖论: 单价降1000x但总支出+320%, 推理将在2026年首超训练"
      implication: "推理基础设施是净新市场(CAGR>40%), 推理集群的分布式特征天然适合Ethernet — 这是ANET最强的结构性论点"

    - finding: "DIO 230天(vs行业60-90天, Cisco 50天) — 战略性超额备货还是消化不良?"
      implication: "Purchase Commitments从$4.8B升至$6.8B证实备货激进, 但若AI CapEx见顶则变为库存风险"

  blind_spots:
    - area: "NVIDIA Spectrum-X增长来源: 增量蚕食还是存量替换"
      why_matters: "若仅AI新增(增量), ANET传统DC安全; 若存量替换, 份额压缩将远快于预期"
      monitor: "Dell'Oro Q1-Q2 2026季度份额报告(2026年7-10月) — NVIDIA份额来源拆分"

    - area: "DR合同平均期限分布"
      why_matters: "1-2年期则锁定效应远弱于3-5年期 — NCH-1假设的可验证性完全取决于此"
      monitor: "ANET 10-K/投资者日是否披露DR期限结构"

    - area: "AI CapEx ROI何时从信仰变为证据"
      why_matters: "决定AI CapEx是3-5年持续周期还是2年脉冲 → PE能否维持40x+的核心问题"
      monitor: "McKinsey/Gartner 2026年中AI ROI量化报告 + 超大规模客户FY2026 H2 CapEx指引"

    - area: "MSFT网络设备内部化时间表"
      why_matters: "26%收入客户 × 内部化 = 收入断崖$1.1-1.3B/年, 对应市值损失$20-26B"
      monitor: "MSFT Azure网络ASIC项目公开信息 + Amazon Nitro类比进展"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "温水煮青蛙(概率35%): 增速从28%→22%→15%→12%缓慢下降, 无明确卖出信号"
      lesson: "高增长股最危险的下跌不是崩盘而是缓慢恶化 — 每个阶段看起来'还行'但累计效果是-23~31%"
      transferable: "所有PE>40x的成长股 — 需预设增速阈值作为卖出纪律(如连续2季<15%)"
    - scenario: "内部人系统性减持70%+但机构仍在买入 — 谁对了?"
      lesson: "当最有信息优势的人和最有资金的人方向相反, 历史基础率显示内部人12个月预测力优于卖方评级"
      transferable: "CEO/CTO同时大幅减持>50%+全年零买入 = 应该review仓位而非找理由解释"
    - scenario: "Cisco 1998教训: PE从65x→12x, 即使公司基本面最终没问题"
      lesson: "网络设备商PE>50x的历史先例结局都是估值压缩 — 问题不是公司好不好, 是你买的贵不贵"
      transferable: "企业IT领域PE>50x且能5年后维持的案例几乎不存在"

