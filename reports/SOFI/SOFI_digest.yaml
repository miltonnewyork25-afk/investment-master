      - signal: "GAAP净利润连续2季为负→盈利连续性中断"
        severity: "emergency"
        action: "减仓至最小持仓≤1%"
      - signal: "Galileo连续2季账户净减少→BaaS平台竞争力丧失"
        severity: "warning"
        action: "下调Tech Platform估值15-20%"
      - signal: "PE>50x且无增速加速催化→估值泡沫化"
        severity: "action"
