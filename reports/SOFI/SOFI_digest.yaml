        evidence: "97%直存绑定+40%交叉购买率+1.47产品/会员→每增一个产品转换成本指数级上升"
        vulnerability: "J.D. Power数据显示SoFi正在向Chime流失支票账户客户(单产品用户粘性弱)"
      - type: scale
        strength: 3.5
        evidence: "Q4 EBITDA利润率31%(+60% YoY)显示运营杠杆兑现"
        vulnerability: "EBITDA margin仍远低于成熟银行/科技平台水平"
      - type: data
        strength: 3
        evidence: "跨产品数据图谱(贷款+存款+投资+消费)支撑AI承保，Konecta AI平台产品化"
        vulnerability: "AI承保从未经历真正衰退压力测试，数据优势在极端环境下有效性未知"
