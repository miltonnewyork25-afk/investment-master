  # 买卖决策框架
  action_framework:
    verdict: "等待买入 — 公司优秀(增长/管理/Smart Money均8分)但零安全边际，等$17-18入场"
    buy_triggers:
      - trigger: "股价回调至$17-18且基本面未恶化(NCO<3%+NIM>5.3%+会员>25%)"
        price_zone: "$17-18"
        reasoning: "概率加权Bear $16.96附近=安全边际14-19%+基本面强→Batch 1试探仓0.5-1.0%"
      - trigger: "非衰退驱动的恐慌下跌至$13-16(情绪/板块轮动)"
        price_zone: "$13-16"
        reasoning: "SOTP Bear $14.95附近=深度价值+信贷周期未恶化→Batch 2加仓0.5-1.0%"
      - trigger: "崩溃至<$13且无KS触发(NCO<5%+管理层未下调指引)"
        price_zone: "<$13"
        reasoning: "恐慌=机会→Batch 3加至总3-5%核心仓位"
    hold_conditions:
      - "NCO on-BS持续<3.5%(信贷健康)"
      - "会员增速>15%(飞轮运转)"
      - "NIM>5.0%(利差优势存续)"
      - "FS收入占比持续上升(费用化转型不逆转)"
    sell_triggers:
      - signal: "On-BS NCO连续2季>3.5%→信贷恶化确认"
