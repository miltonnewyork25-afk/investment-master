# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Forward PE 37.7x隐含ROE快速爬升至>12%+护城河3.5-4.0→市场在为5年后的成熟态提前定价"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "NCO从2.80%渐进恶化→温水煮青蛙→突破3.5%时触发KS→减仓窗口在拐点前而非确认后"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "10项自省清单: 4项确认偏差+3项中度风险→整体偏乐观→Phase 4修正SOTP从$21.12→$20.0-20.5"

  novel_patterns:
    - name: "混合估值幻觉(单一PE掩盖多分部差异)"
      description: "转型公司用单一PE定价时，高PE分部的溢价和低PE分部的折价互相掩盖→SOTP拆分暴露真实估值水平"
      transferable_to: ["所有跨业务类型的转型公司", "银行转科技/制造转服务等模式过渡中的公司"]

    - name: "超额资本化ROE压低效应(DuPont分解)"
      description: "年轻银行CET1远超监管要求→权益乘数低→ROE被数学压低→用静态ROE同构比较得出'差银行'结论是谬误"
      transferable_to: ["所有CET1>15%的年轻银行", "IPO后超额融资的金融公司"]

    - name: "存款Beta不对称(直存锁定→降息扩NIM)"
      description: "高直存比例(>90%)→存款Beta显著低于行业→降息时资产端跟降但负债端不跟→NIM反向扩张"
      transferable_to: ["所有高直存比例的数字银行", "工资账户为主的银行(vs高息揽储为主的银行)"]

    - name: "B2B平台质量升级vs竞争溃败的区分框架"
      description: "客户数下降+收入上升=质量升级(ARPU提升)；客户数下降+收入下降=竞争溃败。看收入方向，再看流失客户ARPU"
      transferable_to: ["所有B2B SaaS/PaaS平台出现客户流失时"]

    - name: "估值框架之争(银行PE vs 科技PE)比基本面分歧更重要"
      description: "当Bull和Bear的EPS预测接近但目标价差距巨大时，核心分歧是框架选择而非基本面→监控框架收敛度(Buy/Sell阵营SOTP方法论采用率)"
      transferable_to: ["所有跨类别的转型公司(投资者用不同框架定价同一公司)"]

  framework_contributions:
    moat_insights:
      - insight: "银行牌照是Fintech护城河的根基——170bps成本优势驱动整个飞轮，而非品牌或产品"
        implication: "评估Fintech护城河时，先问'有没有银行牌照'→有牌照的Fintech和没有牌照的在完全不同的竞争层面"
      - insight: "多产品交叉购买率(40%)比单一产品NPS更能预测转换成本的演进"
        implication: "护城河评估应增加'产品/会员比'和'交叉购买率'作为转换成本的领先指标"
      - insight: "网络效应在非双边平台公司中被系统性高估——SoFi会员间无直接网络效应"
        implication: "评估'平台'型公司时，先问'用户之间有没有直接互动' — 没有则网络效应最多2.5/5"

    valuation_insights:
      - insight: "混合估值幻觉: 三分部用单一PE定价会系统性误判"
        implication: "所有含多种商业模式的转型公司应用SOTP而非单一倍数——PE差距>2x的分部必须拆开定价"
      - insight: "ROE<CoE时期的银行不应回购——每$1回购的ROE低于投资者要求的12%回报"
        implication: "银行估值应检查'ROE vs CoE'→ROE<CoE时回购=毁灭价值→资本配置加分项应为零"

    screening_insights:
      - insight: "Forward PE>30x + ROE<CoE = '增长溢价气球'——需要每个假设都兑现才能维持"
        implication: "选股筛选增加'PE vs ROE一致性检查': PE暗示的ROE路径是否与当前ROE趋势一致"
      - insight: "转型公司的FS收入占比是比PE更好的估值锚点——占比>50%才能支撑科技溢价"
        implication: "选股时增加'转型进度条': 非核心(高PE)收入占比→决定给银行PE还是科技PE"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "低ROE时先做DuPont分解再下结论"
      trigger: "银行/金融公司ROE低于行业均值"
      origin: "SoFi ROE 4.6%看似差银行→DuPont揭示72%差距来自超额资本化而非盈利能力"
      generalization: "ROE低有三种原因(利润率低/周转率低/杠杆低)——投资含义完全不同,不能用ROE数字直接比较"

    - habit: "转型公司用SOTP而非单一PE定价"
      trigger: "公司有两个以上商业模式且PE倍数差距>2x"
      origin: "SoFi Forward PE 37.7x是'混合估值幻觉'→SOTP揭示合理PE 20-25x"
      generalization: "单一PE在转型公司中系统性失效——分部PE差距越大,混合幻觉越严重"

    - habit: "看到用户数量下降先看收入方向"
      trigger: "B2B平台客户/用户/账户数同比下降"
      origin: "Galileo账户-23%但收入+19%→不是溃败是质量升级"
      generalization: "数量下降+收入上升=质量升级(积极); 数量下降+收入下降=竞争溃败(消极)。收入方向是第一判断依据"

    - habit: "银行利率敏感性分析先看存款结构(直存比例+Beta)"
      trigger: "分析银行在降息/加息周期中的NIM方向"
      origin: "SoFi 97%直存→Beta 50%→降息时NIM扩张(与共识相反)"
      generalization: "存款结构(直存vs高息揽储)决定NIM方向,而非利率方向本身。高直存=低Beta=降息利好"

  quality_feedback:
    strengths:
      - "10维度综合评分框架(61.2/100)提供清晰的量化评级基础"
      - "16个Kill Switch覆盖8/8 Bear论点, 10字段详细格式=可执行的监控清单"
      - "6个非共识洞察(NCI-1至NCI-6)每个含完整数据链+'市场为何错'论证"
      - "7个CQ闭环(5要素: 回答+置信度路径+KS+验证+反思)=分析过程透明可追溯"
      - "Phase 4行为金融偏差检查(10项, 4项确认偏差)→估值从$21.12修正至$20.0-20.5"
    weaknesses:
      - "CQ平均置信度仅51.4%, 无一达高确信(>70%)→报告结论的确定性偏低"
      - "飞轮天花板(CQ-7)覆盖不足: 仅2个高度相关模块,缺少TAM饱和专项分析"
      - "AI承保有效性的独立验证不足——主要依赖公司披露数据,缺少第三方ABS表现追踪"
      - "DM密度1.44/千字合格但未达优秀(>1.5)——部分段落数据锚定可以更密"

  hypothesis_tested:
    confirmed:
      - hypothesis: "混合SOTP比单一PE更适合转型公司定价"
        evidence: "三分部拆分后合理PE 20-25x vs 市场37.7x→差距暴露框架误用"
        confidence_after: "高(SOTP/DCF/AI修正三方法收敛于$20-21区间)"

      - hypothesis: "银行牌照是Fintech核心护城河(监管壁垒>品牌>网络效应)"
        evidence: "SoFi的170bps成本优势驱动整个飞轮→失败案例(LC/Simple/Wealthfront)共性=无独立牌照"
        confidence_after: "高(三个失败案例反向验证)"

    extended:
      - hypothesis: "存款Beta决定银行NIM方向"
        extension: "SoFi的97%直存→Beta~50%→降息扩NIM。从'Beta影响幅度'扩展到'Beta决定方向(扩张vs压缩)'"

    refuted:
      - hypothesis: "用户/账户数量下降一定是负面信号"
        evidence: "Galileo账户-23%但收入+19%=质量升级而非溃败"
        lesson: "B2B平台需用'收入方向+ARPU变化'而非'账户数量'判断健康度"

  limitations:
    - "AI承保从未经历失业率6%+的衰退——所有信贷质量判断基于温和环境数据,衰退韧性是猜测"
    - "CQ平均置信度51.4%表明核心判断均非高确信——估值框架(CQ-1)和信贷周期(CQ-2)结论可能显著偏离"
    - "Galileo新客户pipeline依赖管理层口头披露(~10个),无法独立验证"
    - "FS收入高增长(+78%)的持续性难以预测——高基数效应可能导致FY2026增速骤降"
    - "温度计(+0.60看多)与深度分析(61.2/100中性)的分歧未完全调和——反映量化指标与定性判断的系统性差异"
