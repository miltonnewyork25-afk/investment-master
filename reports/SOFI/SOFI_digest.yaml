    position_sizing: "总目标2.0-3.5%，分3批逆向建仓，禁止在$20+一次性建满"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "银行牌照→飞轮引擎的经济基础"
    chain: >
      OCC国家银行牌照(2022)
      → 存款资金成本比批发融资低170bps
      → NIM 5.72%(远超传统银行)
      → 高NIM转化为获客预算(CAC $181)
      → 低CAC→LTV/CAC 7.4x→高效获客
      → 交叉销售(40%交叉购买率)→更多存款
      → 正反馈闭环 — 但依赖NIM维持>5%
    transferable_to: "所有从无牌照到持牌的Fintech转型公司(LC/HOOD未来若获牌)"
    reasoning_habit: "追问'经济引擎的根源是什么' — SoFi飞轮的真正动力源不是品牌/产品，而是牌照带来的170bps成本优势"

  - id: "CC-2"
    name: "ROE 4.6%的估值悖论——超额资本化压低ROE"
    chain: >
      观察: ROE仅4.6%→看似差银行
      → 追问: ROE低是因为盈利差还是资本结构?
      → 发现: CET1 22.8%是JPM(15.2%)的1.5倍、监管最低(7%)的3.3倍
      → DuPont分解: ROE差距的72%来自权益乘数差异(SoFi 4.83x vs JPM 11x)
      → 因此: ROE是被资本结构"压低"的数学结果，非盈利能力差
      → 投资含义: 管理层有充足空间通过资本优化(而非业务改善)提升ROE
      → 但: 在ROE<CoE(12%)期间，回购会毁灭价值→资本优化的时机窗口在FY2028+
    transferable_to: "所有超额资本化的年轻银行/保险公司(ROE被资本结构而非盈利能力压低)"
    reasoning_habit: "看到低ROE时先做DuPont分解 — 区分'盈利能力差'和'资本结构保守'是完全不同的投资含义"

  - id: "CC-3"
    name: "混合估值幻觉——三分部应分别定价"
    chain: >
      市场用单一Forward P/E 37.7x定价
      → 但SoFi有三个分部: Lending(48%) + FS(40%) + Tech(12%)
      → Lending应按银行12x、FS按Fintech 20-25x、Tech按BaaS 5-7x EV/Rev分别定价
      → 混合后合理Forward P/E 20-25x，非37.7x
      → 37.7x是"混合估值幻觉"——既不反映银行也不反映科技
      → Bull(JPM $31/40x)和Bear(BofA $20/22x)的分歧不是基本面预测分歧，而是估值框架选择之争
    transferable_to: "所有跨业务类型的转型公司(从一种商业模式向另一种过渡中)"
    reasoning_habit: "看到高PE转型公司时，问'这个PE在为哪个分部定价' — 单一倍数掩盖分部差异是常见估值陷阱"

  - id: "CC-4"
    name: "降息周期下的NIM不对称扩张"
    chain: >
      共识: 降息压缩银行NIM
      → SoFi特殊性: 存款Beta预计仅~50%(vs 行业70-80%)
      → 原因: 97%直存比例→工资账户锁定→客户不会因25bps就换银行
      → 资产端跟随基准下降100bps，负债端仅下降50bps
      → 结果: NIM不是被压缩而是扩张+50bps
      → 但: 激进降息(4+次)→NIM压缩超过量增长→反而偏负面
    transferable_to: "所有高直存比例的数字银行(存款结构决定NIM方向，而非利率方向本身)"
    reasoning_habit: "分析利率敏感性时，追问'这家银行的存款Beta是多少' — 存款结构(直存vs高息揽储)决定降息净影响方向"

  - id: "CC-5"
    name: "Galileo账户流失是质量升级而非竞争溃败"
    chain: >
      数据: Galileo启用账户-23%(165M→128M)
      → 市场解读: 竞争败退信号
      → 但同期收入+19%→ARPU必然大幅上升
      → 流失客户ARPU仅$0.20-0.30(预付卡/小型Fintech)
      → 留存客户是高ARPU银行/政府客户(如财政部Direct Express 340万账户)
      → 本质: 从"账户堆量"向"ARPU×质量"的战略升级
      → 验证信号: Q1 ARPU≥$0.90+新客户签约
    transferable_to: "所有B2B平台出现客户流失但收入增长的情况(区分数量下降vs质量升级)"
    reasoning_habit: "看到用户/客户数量下降时，先看收入方向 — 如果收入上升，追问'流失的是什么客户，留下的是什么客户'"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "Forward P/E 37.7x说明市场高度看好"
      final: "37.7x是混合估值幻觉，SOTP合理PE 20-25x，当前零安全边际"
      pivot: "三分部拆分定价(Lending 12x + FS 20-25x + Tech 5-7x)暴露单一倍数的误导性"

    - initial: "Galileo账户下滑-23%是重大负面信号"
      final: "低价值客户清洗+ARPU提升=商业模式升级信号"
      pivot: "收入+19%与账户-23%的'剪刀差'只有一个解释:单位经济改善"

    - initial: "ROE 4.6%证明SoFi是差银行"
      final: "DuPont分解显示ROE差距72%来自超额资本化(CET1 22.8%)而非盈利能力"
      pivot: "权益乘数4.83x vs JPM 11x→ROE被资本结构压低是数学必然"

  surprises:
    - finding: "97%直存比例→存款Beta仅~50%→降息时NIM扩张而非压缩(与行业共识相反)"
      implication: "SoFi的利率敏感性方向与传统银行相反——温和降息是净正面，这被市场定价错误"

    - finding: "投资温度计+0.60(看多)与深度分析61.2分(中性)之间的分歧"
      implication: "15个标准化指标无法覆盖信贷周期建模/管理层质量/飞轮天花板→温度计作为补充信号而非替代深度分析"

    - finding: "BofA(22x/$20)和JPMorgan(40x/$31)的分歧本质不是基本面预测分歧而是估值框架选择之争"
      implication: "两方EPS预测接近→框架选择(银行PE vs 科技PE)比基本面预测更能解释股价方向"

    - finding: "SCLP 2025-1 ABS交易获AAA评级、利差仅87bps——机构对贷款资产质量认可度极高"
      implication: "On-BS NCO 2.80%可能高估真实信贷风险，ABS市场定价暗示信贷质量优于表面数据"

  blind_spots:
    - area: "AI承保在深度衰退(失业率6%+)中的表现"
      why_matters: "从未经历真正压力测试→NCO可能非线性恶化→EPS影响-55%"
      monitor: "月度BLS失业率 | 季度on-BS NCO趋势 | Vintage累计损失vs 7%容忍线"

    - area: "Galileo新客户pipeline能否兑现"
      why_matters: "管理层披露~10个新客户但未具体量化→$1B收入路径高度依赖新签约"
      monitor: "Q1 2026启用账户趋势(企稳125M+还是继续下滑) | 新客户收入贡献"

    - area: "Chime IPO后竞争格局变化"
      why_matters: "Chime携$11.6B市值+$864M融资直接竞争→可能加速抢夺SoFi单产品用户"
      monitor: "Chime FY2026收入增速 | J.D. Power年度Banking Study客户流向"

    - area: "费用化转型实际速度"
      why_matters: "FS收入占比从43%到70%+的路径可能比预期慢1-2年→科技溢价验证延迟"
      monitor: "季度FS收入占比 | 产品/会员比从1.47向1.6+提升路径"

  sell_lessons:
    - scenario: "在零安全边际(公允值$20.0-$21.3 vs 股价$20.86)时追涨→下行不对称"
      lesson: "优秀公司在合理估值时买入只能获得fair return。安全边际为零=你在赌所有乐观假设都兑现"
      transferable: "所有增速强劲但PE已充分定价增长的高估值成长股"
    - scenario: "信贷周期见顶时持有高Beta无担保贷款公司→NCO非线性恶化导致双杀"
      lesson: "AI承保不等于信贷免疫——在失业率拐点前减仓，而非等NCO数据确认"
      transferable: "所有依赖消费信贷的Fintech/银行(LC/HOOD/ALLY)"
    - scenario: "科技溢价未被验证(FS占比停滞<55%)时持有→估值按银行框架重估至15-20x"
      lesson: "转型公司的溢价需要里程碑验证——每个季度检查FS占比，不达标则溢价应递减"
      transferable: "所有声称从低PE业务转型为高PE业务的公司"

