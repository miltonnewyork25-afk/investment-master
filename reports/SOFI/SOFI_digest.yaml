  fair_value: "$20.0-$21.3"
  expected_return: "~0-5%上行 / -18.7%概率加权下行(不对称偏下行)"

  key_arguments:
    - claim: "收入增长强劲(+38%)且管理层执行力出色(35买0卖/连续8季超预期)"
      direction: bullish
      magnitude: 4
      mechanism: "银行牌照→存款成本降170bps→高NIM→利润再投获客→飞轮正反馈→会员+35%/收入+38%"
      kill_switch: "CAC同比上升30%+或会员增速降至15%以下→飞轮减速确认"

    - claim: "Forward P/E 37.7x vs 银行均值10.27x，当前价格已完美定价Base Case"
      direction: bearish
      magnitude: 5
      mechanism: "ROE 4.6%远低于CoE 12%→当前正在消耗而非创造经济利润→科技溢价需FY2030 ROE突破CoE才能合理化"
      kill_switch: "FS收入占比突破50%+ROE加速至>8%→科技溢价获得基本面支撑"

    - claim: "信贷周期是未经压力测试的最大风险——AI承保从未经历失业率6%+的真正衰退"
      direction: bearish
      magnitude: 4
      mechanism: "无担保消费贷款NCO已环比+20bps→温和衰退NCO升至5.5-6.5%→年化信贷损失增加$425-925M→EPS-55%"
      kill_switch: "on-BS NCO持续在2.5%以下且失业率<4.5%→信贷风险可控确认"

    - claim: "Smart Money高度看多(JPM增持5.1%+1,252家机构+41%)"
      direction: bullish
      magnitude: 3
      mechanism: "JPMorgan同时增持+升级评级(conviction高)→D.E. Shaw/Jane Street量化基金加仓→机构用真金白银投票"
      kill_switch: "机构持仓占比连续2季下降或主要持有者减仓→共识反转信号"

    - claim: "飞轮天花板——高质量客群TAM可能仅30-50M，25M目标对应50-83%渗透率"
      direction: conditional
      magnitude: 3
      mechanism: "超过50%渗透需价格竞争而非差异化→CAC上升→LTV/CAC恶化→飞轮从加速变为减速"
      kill_switch: "产品/会员比从1.47升至1.7+→即使绝对会员增速放缓，LTV仍在扩张"

  moat:
    composite_score: 6.8  # 3.42/5转换为10分制
    half_life: "5-10年(转型期护城河，趋势加宽但尚未固化)"
    dimensions:
      - type: regulatory
        strength: 4
        evidence: "OCC国家银行牌照降低资金成本170bps，新Fintech获牌需2-3年+数千万美元"
        vulnerability: "监管风向可一次选举180度转向(Trump 2.0友好但非永久)"
      - type: switching_cost
