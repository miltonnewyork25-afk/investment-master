      why_noise: "BofA($20)和JPM($31)的分歧是框架分歧非信息分歧→自己做SOTP比看卖方更准"
    - signal: "加密交易量/SoFiUSD"
      why_noise: "加密业务仍在早期且收入贡献微小→即使大幅增长也不改变核心估值"

