  confirmation_signals:
    - signal: "季度有机增长(整体+分板块)"
      bullish_threshold: ">2.5% + 量转正(增长恢复确认)"
      bearish_threshold: "<1%连续3季(结构性确认 → KS-01触发)"
    - signal: "毛利率季度趋势"
      bullish_threshold: ">52%(关税成本被成功传导+效率改善)"
      bearish_threshold: "<50%(成本结构性恶化 → KS-03触发)"
    - signal: "自有品牌年度美元份额(PLMA/Circana)"
      bullish_threshold: "增速放缓至<$5B/年(侵蚀减速)"
      bearish_threshold: ">24%(欧洲化轨迹确认 → KS-07触发)"

  noise_signals:
    - signal: "RSI超买/超卖"
      why_noise: "消费必需品在利率下降环境中经常长期维持高RSI — 2019年PG RSI多次>70持续数月不回落, 不适合作为长期投资判断依据"
    - signal: "单季EPS beat/miss"
      why_noise: "关税影响的季度分布不均匀 → 单季EPS波动不改变结构性增长轨迹, 看全年趋势"
    - signal: "卖方目标价调整"
      why_noise: "22位分析师0 Sell → 系统性偏多 | 目标价$148-$186差距26%=共识分散 | 卖方不区分周期性vs结构性增长放缓"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: UL
      similarity: "同为全球消费品巨头, 类似品类覆盖(洗涤/个护/美容)"
      key_difference: "UL有机增长+4.5%(量+3.5%) vs PG 0%(量-1%) → UL新兴市场渗透创造PG缺乏的增量空间"

    - ticker: KMB
      similarity: "同为纸品/纸尿裤核心品类, 类似自有品牌威胁暴露"
      key_difference: "KMB PE 21.5x更符合低增长定价 | PG 23.5x可能仍包含增长溢价 → KMB是PG重新定价的参照"

    - ticker: CHD
      similarity: "同为美国消费品, 类似品类(洗涤/个护)"
      key_difference: "CHD量增+4%证明消费品行业量增长并非不可能 → CHD用创新敏捷性弥补品牌规模差距"

  comparative:
    - dimension: "有机增长质量"
      position: "CL (+5.8%) > UL (+4.5%) > CHD (+3.9%) >> PG (0%)"
      reasoning: "PG是唯一有机增长为零且量跌的消费品巨头 → 品类组合结构性不利"

    - dimension: "定价权"
      position: "CL (口腔护理强定价) > UL (新兴市场定价空间) > CHD (量驱动不依赖提价) > PG (品类级碎片化)"
      reasoning: "PG 59%收入来自定价权最弱的板块 → 加权定价权行业垫底"

    - dimension: "自有品牌抗性"
      position: "CL (口腔护理技术壁垒高) > CHD (品类聚焦+创新快) > PG (纸品/洗涤暴露最大) > KMB (纸品核心)"
      reasoning: "PG的F&HC+BFF(59%收入)恰是自有品牌替代最容易的品类"

    - dimension: "估值吸引力(PEG)"
      position: "CHD < CL < UL < PG (4.47x最高)"
      reasoning: "PG PE最低(23.5x)但增速也最低→PEG暴露为低增长付高价"

  industry_position:
    quadrant: "最大规模 × 最低增速 × 中等估值"
    archetype: "减速中的防御复利机器 — 品牌坚固但燃料(有机增长)耗尽"

# --- Layer 4: 基向量映射 (稀疏表示) ---
