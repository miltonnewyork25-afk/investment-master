      - insight: "DDM对消费品极度敏感(ke-g利差) — g从5%降至3%估值跌50% → 增长假设是最关键变量"
        implication: "消费品DDM必须做增长率±1%敏感性测试, 且长期g不应超过最近3年有机增长均值"

    screening_insights:
      - insight: "PEG>3.5x + 有机增长<2% + 自有品牌暴露>50%收入 = '品牌溢价陷阱'"
        implication: "消费品筛选增加'品牌溢价陷阱过滤器': PEG/有机增长/自有品牌暴露三维筛选"
      - insight: "同行对比中量增长>0%是消费品增长质量的最低门槛 — 量跌=定价权可能已过度使用"
        implication: "消费品选股增加'量增长为正'硬门槛, 量跌的消费品公司不应获得增长溢价"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "CPG定价权按品类拆解而非公司级评估"
      trigger: "分析师说'PG有定价权'时"
      origin: "PG五板块PVM拆解: Beauty正弹性 vs BFF定价权归零 → 59%收入定价权极弱"
      generalization: "多品类公司的任何公司级属性(定价权/增速/margin)都可能掩盖品类级分裂 → 永远按品类/分部拆分"

    - habit: "自有品牌威胁判断看留存率而非份额"
      trigger: "评估自有品牌对品牌商的威胁时"
      origin: "88%自有品牌购买者计划维持/增加+质量感知收敛→结构性而非周期性"
      generalization: "消费行为的持久性由留存率决定 — 高留存(>80%)=不可逆 | 低留存(<50%)=周期性"

    - habit: "PE折价立刻用PEG交叉验证"
      trigger: "PE低于历史均值5%以上时"
      origin: "PG PE -8% vs 历史但PEG 4.47x → 折价是低增长的合理定价"
      generalization: "PE低不等于便宜 — PE/增长联动判断才有效, 尤其对低增速消费品"

    - habit: "重组效果用历史转化率校准"
      trigger: "公司宣布大规模重组/成本节省计划时"
      origin: "PG三轮重组(2012/2014/2017)均未加速有机增长 → 节省→利润率但非增长"
      generalization: "公司过去重组的增长转化率是预测未来重组效果的最佳基准率"

  quality_feedback:
    strengths:
      - "873个数据标注, DM密度3.48/千字 — 远超1.5门控, 数据锚定极为扎实"
      - "13张反常识洞察卡系统性挑战传统认知 — 品类级定价权碎片化和自有品牌棘轮效应是最高价值洞见"
      - "8个Bear Case+极端压力测试+18个Kill Switch — 对抗审查覆盖全面"
      - "PPDA(定价背离分析)从股价反推隐含假设并量化背离 — 方法论有高度迁移价值"
    weaknesses:
      - "报告使用旧版框架(v21.0争议驱动), 评分体系(55/100)与当前5档评级标准不完全对齐"
      - "Reverse DCF未作为独立模块前置(铁律O) — DDM逆推隐含增长是最接近的替代但不如完整Reverse DCF"
      - "因果推理密度未量化检测 — 洞察卡和Bear Case因果链扎实但正文部分可能有断言未论证"

  hypothesis_tested:
    confirmed:
      - hypothesis: "品牌溢价在消费降级时代面临结构性而非周期性侵蚀"
        evidence: "自有品牌留存率88% + 质量感知收敛(仅38%仍认为品牌更好) + 份额增速3x品牌商"
        confidence_after: "高(多源硬数据确认)"

      - hypothesis: "重组不创造增长(MCO/ADBE类推)"
        evidence: "PG三轮重组(2012/14/17)增长转化率<30%, 最新$1.5B重组大概率重复"
        confidence_after: "高(PG自身3次历史验证)"

    extended:
      - hypothesis: "PEG比PE更能暴露真实估值(CME发现)"
        extension: "PG中进一步确认: PE 23.5x看似便宜但PEG 4.47x暴露为低增长付高价 → 消费品中PEG>3.5x=品牌溢价陷阱"

    refuted:
      - hypothesis: "消费必需品在衰退中总是跑赢(传统认知)"
        evidence: "PG 2008年从$72跌至$46(-36%) → 真正衰退中防御性被基本面恶化击穿"
        lesson: "低Beta消费品的防御性有条件限制 — 仅在轻度放缓中有效, 深度衰退中无效"

  limitations:
    - "使用旧版框架(v21.0), 未执行当前v19.7标准的Reverse DCF P1前置和Phase 0.75核心矛盾结晶"
    - "无Python验证的DCF/FCFF模型 → 估值区间($136-$188)离散度较高(28%)"
    - "中国市场恢复潜力(Greater China)的分析受限于本土消费品竞争数据可得性"
    - "Tide EVO真正的增量vs品类内迁移效应无法从当前公开数据中区分 → 需等F&HC品类份额数据"
    - "AI推荐引擎对CPG分销的实际影响目前仍是早期推测 → 3-5年内可量化验证"
