    - name: "K型消费分化下的品牌组合困境"
      description: "高端化(26%收入)和大众市场(59%收入)战略互相矛盾 → 无法同时服务上层和中间市场 → 夹心层定位最脆弱"
      transferable_to: ["所有同时拥有高端线和大众线的消费品公司"]

    - name: "防御性溢价击穿模型"
      description: "低Beta消费品在轻度放缓中获得防御溢价, 但真正衰退中基本面恶化(消费降级→自有品牌加速)击穿防御→先涨后跌陷阱"
      transferable_to: ["KO", "CL", "GIS", "所有低Beta消费必需品"]

  framework_contributions:
    moat_insights:
      - insight: "CPG护城河应按品类评估而非公司级 — PG整体'中强'掩盖了分销护城河'快速崩塌'(-3至4分/年)的事实"
        implication: "消费品护城河评估增加品类分层维度, 找出侵蚀速度最快的单一护城河类型"
      - insight: "自有品牌威胁的判断标准是消费者留存率而非份额水平 — 留存>80%=结构性迁移"
        implication: "自有品牌风险评估从份额跟踪升级为留存率跟踪, 后者是前瞻指标"
      - insight: "AI推荐引擎是分销护城河的最大中期威胁 — 物理货架优势被数字化绕过"
        implication: "消费品护城河评估增加'AI推荐渗透率'维度, 电商占比>20%时分销护城河应显著折价"

    valuation_insights:
      - insight: "PE折价需要PEG交叉验证 — PE低于历史但PEG>3x时折价是合理定价而非低估"
