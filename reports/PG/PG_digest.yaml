      transferable_to: ["UL", "KMB", "CLX", "CHD", "所有多品类消费品公司"]

    - name: "自有品牌单向棘轮效应量化"
      description: "通过留存率(尝试后维持/增加购买比例)判断自有品牌威胁是周期性还是结构性 → 留存>80%=不可逆迁移"
      transferable_to: ["KMB", "CLX", "GIS", "K", "所有面临自有品牌竞争的品牌商"]

    - name: "重组→增长转化历史率"
      description: "用公司自身历史重组记录校准未来重组效果预测 → 3次重组增长转化率<30%=第4次不应建模为增长催化剂"
