    - signal: "总IFRS收入增速"
      why_noise: "50%+是System Fund过手收入(收支平衡) → 看Fee Revenue(+7%)而非总收入"
    - signal: "负权益的绝对值"
      why_noise: "资产轻模型+激进回购的数学结果 → Altman Z 4.83证明偿付无虞 → 看利息覆盖率和FCF/分配比"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: HLT
      similarity: "同为酒店特许经营轻资产模型, 品牌矩阵+忠诚度计划结构高度相似"
      key_difference: "HLT=最聚焦执行(24品牌/6.7% NUG) vs IHG=追赶者(21品牌/4.7% NUG) | HLT P/E 52x vs IHG 29x"

    - ticker: MAR
      similarity: "全球酒店三巨头, 特许+管理混合模型, 类似宏观敏感性"
      key_difference: "MAR=最大规模(1.6M rooms/30+品牌) vs IHG=最高fee效率(64.8% margin) | MAR增速来自规模惯性, IHG需加速增长"

    - ticker: QSR
      similarity: "同为轻资产品牌特许经营(餐饮vs酒店), 类似回购驱动EPS增长模式"
      key_difference: "QSR=更分散的加盟商基础+更短合约周期 | IHG=更集中的大业主+更长PIP投资周期"

  comparative:
    - dimension: "Fee效率(Margin)"
      position: "IHG (64.8%) > HLT (~62%) > MAR (~57%)"
      reasoning: "IHG特许经营纯度最高(99%非自有) → 成本结构最轻 → Fee margin三巨头最高"

    - dimension: "规模/管线"
      position: "MAR (1.6M rooms/596K管线) > HLT (1.18M/515K) > IHG (1.03M/342K)"
      reasoning: "规模差距=采购议价力+企业合同谈判力+忠诚度网络密度的差距"

    - dimension: "增长质量(NUG)"
      position: "HLT (6.7%) > IHG (4.7%) > MAR (4.3%)"
      reasoning: "HLT在美国新建+印度/中国先发 → IHG加速中但基数小 → MAR规模大增速慢"

    - dimension: "估值吸引力(PEG)"
      position: "IHG (2.5x) > MAR (2.8x) > HLT (3.1x)"
      reasoning: "IHG PE最低且增速中等 → PEG三巨头最优 → 市场可能过度惩罚老三标签"

    - dimension: "忠诚度规模"
      position: "HLT (243M+) > MAR (220M+) > IHG (160M+)"
      reasoning: "忠诚度网络效应=会员数×酒店密度 → IHG在两个维度都是第三"

  industry_position:
    quadrant: "最高fee效率 × 最低规模 × 中等增速 × 最低估值"
    archetype: "效率追赶者 — 单位经济最优但总量最小,估值反映了规模折价+叙事折价"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF → 市场隐含系统增长5%+终端19x → 修正为4%/16x → 隐含$170-180(vs当前$143)"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1~RT-7双向校准: 偏多-$5~-8(WACC/SOTP/引擎交互) vs 偏空+$15~+27(RevPAR/NUG/A-Score) → 净偏悲观+$3~7"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "不适用(IHG无温水煮青蛙路径) — 但'回购庞氏'(BB-3)是慢性风险: 负权益-$1.5B→-$2.7B的2年恶化"

  novel_patterns:
    - name: "A-Score vs P/E差距筛选器"
      description: "量化品质差距(A-Score)与估值差距(P/E)的不对称度 → 不对称度>1.5x = 非基本面折价信号"
      transferable_to: ["任何行业同业比较", "价值投资筛选器", "制度折价/情绪折价识别"]

    - name: "有效独立引擎计算"
      description: "用引擎间相关系数矩阵计算有效独立引擎数 → 打破管理层多引擎叙事的加法幻觉"
      transferable_to: ["SaaS多产品增长", "平台多变现模式", "多品牌集团", "所有宣称N个增长引擎的公司"]

    - name: "ZREIP行业比较(特许vs运营)"
      description: "将保险精算移植到权益估值 → 量化特许经营vs重资产运营的尾部风险差异(IHG 1/27 RCL)"
      transferable_to: ["QSR(特许)vs餐饮运营(自营)", "物业管理(轻)vs REIT(重)", "品牌授权vs自营零售"]

    - name: "回购效率的估值函数"
      description: "回购效率=f(1/PE) → PE越低每$1回购消灭越多股本 → 低估值公司的回购是复利加速器,高估值公司的回购是价值毁灭器"
      transferable_to: ["所有有回购计划的公司", "与CME报告的回购eta值互为验证"]

    - name: "忠诚度系统LTV估值法"
      description: "活跃会员数×单会员LTV → 忠诚度系统总价值 → 占市值比例 → 揭示'免费'获得剩余业务"
      transferable_to: ["航空里程计划", "Starbucks Rewards", "Amazon Prime", "所有订阅/会员制公司"]

  framework_contributions:
    moat_insights:
      - insight: "酒店特许经营的护城河是'宽而浅'——品牌+忠诚度+分销覆盖面广,但在每个单一维度都不是最强"
        implication: "护城河评估应区分'广度型'(多维度中等强度)和'深度型'(单维度极强) — 广度型更难被单点攻破但也更难建立差异化"
      - insight: "特许经营模型的尾部风险本质上低于重资产运营(ZREIP 1/27倍) — 市场可能系统性高估了轻资产模型的下行风险"
        implication: "轻资产特许经营的风险溢价应低于重资产运营商 → P/E折价中应扣除尾部风险错定价部分"

    valuation_insights:
      - insight: "A-Score差距vs P/E差距的不对称度是识别非基本面折价的通用工具"
        implication: "不对称度>1.5x = 筛选信号 → 可作为quantitative screen加入选股框架"
      - insight: "多引擎增长公司的CAGR应使用有效独立引擎数(非名义引擎数)计算"
        implication: "管理层guidance的简单加法应除以引擎相关性修正因子 → 避免3-5pp的增速高估"

    screening_insights:
      - insight: "P/E最低+Fee Margin最高+PEG最优 = 被叙事惩罚的效率领先者"
        implication: "选股筛选加入'效率折价过滤器': fee margin行业最高但P/E行业最低 → 标记为叙事折价候选"
      - insight: "ZREIP<$0.2/股/年的轻资产公司 = 尾部风险被高估的候选"
        implication: "量化尾部风险成本并与同行重资产公司比较 → 差异>10x = 市场错定价信号"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "A-Score差距vs估值差距的不对称度分析"
      trigger: "同行业公司间存在>20%的P/E差距"
      origin: "IHG品质差距12% vs P/E差距34% → 2.8:1不对称度暴露了20pp非基本面折价"
      generalization: "品质差距/估值差距比值<0.5 = 非基本面折价>50% → 值得深入调查折价来源"

    - habit: "追问多引擎增长的引擎间相关性"
      trigger: "管理层宣称3+个增长引擎的简单加法CAGR"
      origin: "IHG 4引擎12-15%被修正为1.8有效引擎9-12% — 相关系数0.408导致3pp高估"
      generalization: "不做引擎独立性测试就接受管理层CAGR = 系统性高估增速。越多引擎越需要测试"

    - habit: "用ZREIP量化轻资产vs重资产的尾部风险差异"
      trigger: "评估轻资产特许经营公司的下行风险"
      origin: "IHG ZREIP $0.08 vs RCL $2.2 (27x差异) — 特许模型尾部风险远低于认知"
      generalization: "对轻资产模型的尾部风险评估不应套用重资产模型的框架 → 需要单独量化"

    - habit: "检查回购效率的PE函数而非只看回购金额"
      trigger: "公司年回购>FCF的30%"
      origin: "IHG@29x消灭4.2%股本/年 vs HLT@52x仅2.3% → 同样$1回购效率差1.8x"
      generalization: "与CME报告的eta值概念互为验证 — 回购效率是PE的递减函数,高PE回购是价值毁灭"

  quality_feedback:
    strengths:
      - "DM密度1.78/千字(优秀级别) — 数据锚定扎实,899个DM锚点覆盖全报告"
      - "CI-02(A-Score筛选器)和CI-03(有效独立引擎) — 高度可迁移的通用分析框架"
      - "红队双向校准完整 — RT-1~RT-7覆盖数据验证+逻辑一致+乐观检测+悲观检测+概率校准"
      - "ZREIP从RCL报告成功移植至酒店行业 — 方法论跨行业迁移的标杆"
    weaknesses:
      - "分析师覆盖仅5人导致共识质量低 — 估值锚定缺乏足够外部验证"
      - "Greater China前景的数据深度不足 — 仅用-1.6%和Q4 +1.1%判断拐点,缺乏华住/锦江竞品深度对标"
      - "折价修复催化剂时间表高度不确定 — 无法区分1年修复和5年+修复→持有期成本被低估"

  hypothesis_tested:
    confirmed:
      - hypothesis: "回购@低PE是价值增值的(CME CI-005的反面验证)"
        evidence: "IHG@29x回购效率4.2%/年 vs HLT@52x仅2.3% → 低PE下回购确实高效"
        confidence_after: "高(CME+IHG双向验证: 高PE回购毁灭价值, 低PE回购创造价值)"

      - hypothesis: "ZREIP可跨行业迁移(从RCL邮轮→IHG酒店)"
        evidence: "IHG ZREIP $0.08成功计算且与RCL $2.2形成27x差异的经济直觉一致"
        confidence_after: "高(两个行业独立验证)"

    extended:
      - hypothesis: "品质最高≠回报最高(CME垄断三角)"
        extension: "IHG作为老三品质最低但PEG最优→投资回报不仅不等于品质,甚至可能负相关(品质溢价被过度定价)"

    refuted: []

  limitations:
    - "催化剂时间表不可预测 — 40%非基本面折价的修复可能需1-5年+,持有期机会成本无法量化"
    - "Greater China RevPAR预测依赖宏观假设 — 中国消费复苏路径高度不确定"
    - "回购可持续性取决于利率环境 — 如果利率长期维持>5%, FCF/分配缺口将扩大→回购引擎可能被迫缩减"
    - "WACC 9.5% vs 8.5%的1pp差异对应$15-20/share估值差 — 单参数敏感性过高"
    - "HLT/MAR的估值本身可能回归(PE压缩) — IHG的相对折价缩小但绝对回报可能同步下降"
