# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "品质差距<估值差距 = 非基本面折价的识别方法"
    chain: >
      A-Score量化品质差距: IHG 6.78 vs HLT ~7.8 = 差距12%
      → P/E差距: 29x vs 52x = 差距34%
      → 12% << 34% → ~20pp无法用品质差距解释
      → 追问: 这20pp来自哪里?
      → 制度折价(非S&P500+LSE+5人覆盖) ~5pp
      → 叙事折价(老三标签+增速不及HLT) ~8pp
      → 情绪折价(Holiday Inn品牌老化感知) ~5-7pp
      → 推论: 非基本面折价是可修复的,但需要催化剂和时间(2-5年)
    transferable_to: "所有行业内存在显著估值差距的同业比较(A-Score差距vs P/E差距的不对称=筛选信号)"
    reasoning_habit: "看到大P/E折价时,先量化品质差距(A-Score/CQI) — 如果品质差距<估值差距的一半,存在非基本面折价机会"

  - id: "CC-2"
    name: "有效独立引擎数量化(打破管理层增长叙事)"
    chain: >
      管理层宣称4引擎(系统增长+RevPAR+费率+回购) = 12-15% CAGR
      → 但引擎间不独立: RevPAR↓ → 加盟商延迟开业 → 系统增长↓
      → 计算引擎间相关系数: 均值0.408
      → 有效独立引擎 = 4/(1+3×0.408) = 1.80
      → 完整周期CAGR = 9-12%(非12-15%)
      → 简单加法高估了约3pp
      → 投资含义: 市场给29x P/E可能已经隐含了这个下调,而非共识的12-15%
    transferable_to: "所有宣称多引擎增长的公司(SaaS多产品/平台多变现/多品牌集团)"
    reasoning_habit: "听到管理层列举多个增长引擎时,立刻追问引擎间相关性 — 高相关=有效引擎少于宣称=增速被高估"

  - id: "CC-3"
    name: "特许经营模型的尾部风险定价(ZREIP行业比较)"
    chain: >
      特许经营不承担客房运营固定成本(房租/人工/水电)
      → 零收入事件中: 邮轮=100%停航→收入归零; 酒店=RevPAR暴跌但不归零
      → 2020验证: IHG RevPAR -52%但fee收入仅-35%(弹性系数0.67)
      → ZREIP年化保险费: IHG $0.08/股 vs RCL $2.2/股 (差异27x)
      → 推论: 市场对酒店尾部风险的定价可能参照了邮轮/航空,严重高估
      → 每降低1pp风险溢价 = P/E+0.5x = +$2.5/share
    transferable_to: "所有轻资产特许经营(QSR/物业管理/品牌授权) vs 重资产运营商的尾部风险比较"
    reasoning_habit: "评估尾部风险时,追问'零收入事件中这家公司的成本结构会怎样' — 固定成本越低,尾部风险越小"

  - id: "CC-4"
    name: "低P/E下回购效率的复利优势"
    chain: >
      IHG年回购~$907M @ P/E 29x → 消灭4.2%股本/年
      → HLT年回购~$2B @ P/E 52x → 仅消灭2.3%股本/年
      → 同样$1回购,IHG消灭的股本是HLT的1.8倍
      → 复利效应: 5年后IHG累计消灭~19%股本 vs HLT ~11%
      → 如果P/E不变, 仅回购贡献EPS CAGR: IHG ~4.4% vs HLT ~2.4%
      → 推论: 低估值下的回购是沉默的价值创造引擎,但前提是杠杆可持续
    transferable_to: "所有PE<30x且积极回购的公司(回购效率=f(1/PE),PE越低效率越高)"
    reasoning_habit: "评估回购时,不只看金额看效率 — 用'股本消灭率'(回购金额/市值)而非回购金额本身"

  - id: "CC-5"
    name: "信用卡联名费+忠诚度积分=隐形利润催化剂"
    chain: >
      IHG与Chase联名信用卡→持卡人购物→IHG获得积分销售收入
      → 2024起积分收入从System Fund转入报告分部(会计重分类)
      → 2028E信用卡+积分贡献$237M+利润(占EBIT 18%)
      → 这是100%增量、高margin(~80%)、与RevPAR无关的收入
      → 市场可能尚未为此给予信用(因为变化刚发生1-2年)
      → 推论: 如果市场开始定价信用卡增量,P/E可从29x修复至32-35x
    transferable_to: "所有拥有忠诚度计划的消费品/零售公司(Starbucks Rewards/Amazon Prime/航空里程)"
    reasoning_habit: "追问忠诚度计划的直接变现路径 — 会员数不重要,变现效率(ARPU×margin)才重要"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "43%折价主要由基本面差距驱动,估值基本合理"
      final: "基本面差距仅解释55-60%的折价,剩余40%是制度+情绪+叙事折价"
      pivot: "A-Score差距12% vs P/E差距34% → 品质不能解释一半以上的估值差距"

    - initial: "管理层12-15% EPS CAGR目标可信"
      final: "引擎间相关性导致有效CAGR 9-12%,高估约3pp"
      pivot: "引擎间相关系数0.408 → 有效独立引擎1.80而非4 → 简单加法高估增速"

    - initial: "负权益(-$2.7B)是资产负债表危机信号"
      final: "负权益是激进回购的数学结果而非资不抵债; 真实资产(品牌/忠诚度/合约)不在表上"
      pivot: "Altman Z 4.83(安全区) + Piotroski F 7/9 + BBB稳定评级 + 利息覆盖6.0x"

  surprises:
    - finding: "IHG Fee Margin 64.8%是三巨头中最高的,高于HLT ~62%和MAR ~57%"
      implication: "市场给IHG最低P/E但IHG fee效率最高 → 效率被规模叙事掩盖 → 潜在重估催化"

    - finding: "RevPAR增长中结构性成分占73%,周期性仅27%"
      implication: "市场将RevPAR+0.6%视为纯周期疲软,实际增长质量远好于表面数字 → 增长折价过度"

    - finding: "IHG员工仅12,587人(MAR的3%/HLT的7%)管理100万间客房"
      implication: "资产轻模式推到极致 → 每员工管理80间客房(MAR仅4间) → 运营杠杆极高"

    - finding: "忠诚度系统总价值~$11.5B(53%市值),基于40M活跃会员×$288 LTV"
      implication: "忠诚度不只是积分计划而是经济引擎 → 如果市场单独为忠诚度定价,剩余业务几乎是免费的"

  blind_spots:
    - area: "折价修复的催化剂时间表"
      why_matters: "40%非基本面折价存在但修复可能需1年(加入S&P500)也可能5年+"
      monitor: "S&P 500纳入公告 | 分析师覆盖人数变化(5人→10人+) | 英国→美国主上市迁移信号"

    - area: "Greater China RevPAR恢复力度"
      why_matters: "占收入~14%但RevPAR -1.6%; 复苏至+3%可贡献全球+0.4pp → P/E+0.5-1x"
      monitor: "Q1-Q2 2026 Greater China RevPAR(Q4已转正+1.1%) | 华住/锦江定价行为"

    - area: "回购可持续性(负权益持续恶化)"
      why_matters: "总权益-$2.7B且FCF/总分配仅74% → 缺口$307M/年靠发债填补 → 利率上升可压缩回购空间"
      monitor: "年度FCF/总分配比率(跌破65%=预警) | 净债务/EBITDA(升破3.5x=行动)"

    - area: "Airbnb向高端商务差旅渗透的速度"
      why_matters: "当前Airbnb对IHG RevPAR拖累仅0.1-0.2pp/年,但Chesky已宣布进军酒店领域"
      monitor: "Airbnb高端住宿收入增速 | 企业差旅政策变化 | 短租监管方向"

  sell_lessons:
    - scenario: "特许经营公司在RevPAR冻土上用借债回购维持EPS增长 → 一旦利率/评级约束触发,增长引擎骤停"
      lesson: "回购驱动的EPS增长要检查可持续性: FCF/总分配<65%+净债务/EBITDA>3.5x=回购庞氏预警信号"
      transferable: "所有借债回购的轻资产公司(QSR/品牌授权/平台)"
    - scenario: "P/E从29x修复到35x(历史天花板)后不卖 → 折价修复一次性收益消失,回归EPS增速驱动"
      lesson: "折价修复的利润是一次性的。估值修复完成=战略review时点,不是加仓时点"
      transferable: "所有估值折价修复型投资(制度折价/情绪折价/老三折价)"
    - scenario: "持有老三等待超越老二/老一 → 规模差距可能因管线不足而继续扩大"
      lesson: "老三有alpha但有天花板。如果管线增速持续落后(342K vs 515K vs 596K),规模差距扩大→永久折价合理化"
      transferable: "所有行业第三名公司的长期持有决策"

