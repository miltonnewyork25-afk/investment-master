# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "FICO是美国品质最高的制度垄断公司之一,但在$1,441你购买的不是'制度垄断投资期权'(那已在2014-2023兑现),而是'赌制度不会改变'——赔率(52x PE)不在你这边"
  rating: "审慎关注(偏中性)"
  fair_value: "$1,222 (五方法加权)"
  expected_return: "-16%(12M) | -3.3%/年(3Y) | +2.5%/年(5Y)"

  key_arguments:
    - claim: "制度垄断自我加固悖论: 嵌入越深被制度变化影响越大(CI-01)"
      direction: bearish
      magnitude: 5
      mechanism: "C1高→B4定价权释放→OPM 20%→47%→引发政治/竞争反弹(FHFA+Hawley+10诉讼)→C1被打开→B4衰减"
      kill_switch: "VantageScore技术验证失败(按揭违约预测不及FICO) OR FHFA政策逆转(新政府)"

    - claim: "定价权投资期权时间衰减: OPM从20%到47%剩余空间有限(CI-02)"
      direction: bearish
      magnitude: 4
      mechanism: "OPM位置比从0.29→0.67(理论天花板70%),Stage 2.3距天花板3.0仅0.7→890%提价已大部分释放"
      kill_switch: "DLP成功重建定价链(绕过征信局→重获Stage 1.0的提价空间)"

    - claim: "Scores-Software价值断裂: 86%利润来自一个资产(CI-03)"
      direction: bearish
      magnitude: 4
      mechanism: "Scores OPM~85% vs Software OPM~32%→合并OPM 47%掩盖了Software的平庸→SOTP揭示投资者在为Scores付极端溢价"
      kill_switch: "Platform ARR持续+25%且DBNRR>120%→Software从'拖累'变为独立增长引擎"

    - claim: "52x TTM PE包含巨大PE压缩风险"
      direction: bearish
      magnitude: 5
      mechanism: "增速自然放缓至10%(FY2030共识7-8%)→市场不会给10%增长公司50x PE→PE从50x→30x=-40%即使EPS翻倍"
      kill_switch: "DLP+FICO 10T双成功→收入重回+20%→高PE合理化"

    - claim: "Forward PE 27x使估值不极端+护城河仍有10+年半衰期"
      direction: conditional
      magnitude: 3
      mechanism: "FY2026E EPS $41.53(+54%)→Forward PE仅27x→如果达成则估值可接受; L4操作层替换需5-15年→时间缓冲"
      kill_switch: "FY2026E EPS下调(VS侵蚀+提价放缓)→Forward PE重回35x+"

  moat:
    composite_score: 8.2
    half_life: "10-15年(复合) | L2监管3-5年 | L4操作5-15年 | L5认知10-20年"
    dimensions:
      - type: regulatory
        strength: 5
        evidence: "GSE法定要求FICO评分30年(1995-2025); FHA/VA仍要求FICO; QM规则纳入FICO"
        vulnerability: "FHFA已批准VantageScore 4.0(2025.7)——L2监管层已被打开一条缝"
      - type: switching_cost
        strength: 5
        evidence: "银行风险模型30年基于FICO校准; 切换需重新验证PD/LGD/EAD模型(成本数百万/12-24个月); MBS池规格引用FICO"
        vulnerability: "如果GSE提供FICO-VS分数映射表→降低校准成本"
      - type: brand
        strength: 3
        evidence: "'我的FICO分数是多少'已是美国文化习语; Credit Karma让1亿+消费者接触VS但多数不知区别"
        vulnerability: "品牌嵌入语言层但消费者不是购买决策者(贷款机构才是)"
      - type: scale
        strength: 4
        evidence: "零边际成本(评分=算法x数据); CapEx仅0.5%收入; 增量利润趋近100%"
        vulnerability: "VantageScore同样零边际成本(征信局自有数据+自有算法)"
      - type: pricing_power
        strength: 5
        evidence: "PtW 89.2/100; 890%提价7年零客户流失; 版税$0.50→$4.95+$33/funded loan"
        vulnerability: "Stage 2.3距天花板3.0仅0.7; 行业协会MBA/CHLA/ICBA持续施压; 10个反垄断诉讼"

  valuation:
    reverse_dcf_implied: "市场隐含10Y Revenue CAGR~14%(偏乐观) + OPM终值55-60% + C1维持>=4.0(最核心假设)"
    methods_used: ["Reverse DCF", "SOTP", "概率加权(5情景)", "可比公司", "FCF Yield"]
    dispersion: "~25% ($920-$1,510 SOTP区间)"
    consensus_vs_ours: "市场看FICO=27x Forward PE的垄断 | 我们看FICO=52x TTM PE的制度赌注,且制度正在被打开"
    entry_zone: "$1,100-1,200 (Forward PE 22-24x)"
    catalyst: "VantageScore GSE实施→份额数据公开 | OPM季度环比下降 | 反垄断集体认证"

  action_framework:
    verdict: "等待——品质已确认(A-Score 51.1/70)但估值偏高且制度风险上升,等价格回落至Forward PE 22-24x"
    buy_triggers:
      - trigger: "股价回落至Forward PE 22-24x区间(VantageScore恐慌或市场调整)"
        price_zone: "$1,100-1,200"
        reasoning: "五方法收敛中值$1,222; 此区间提供10-15%安全边际+护城河半衰期10+年的时间缓冲"
      - trigger: "VantageScore实施失败(GSE采纳率<5%持续2年)+FICO 10T获批"
        price_zone: "$1,300-1,400"
        reasoning: "C1回升至4.5-5.0→制度溢价重建→当前价格变合理"
      - trigger: "极端恐慌: 股价跌至$900以下(PE 18-20x)"
        price_zone: "$900以下"
        reasoning: "Buffett买入区间; 即使C1→3.5,SOTP低端$1,060仍提供15%+上行"
    hold_conditions:
      - "C1制度嵌入维持>=4.0(VantageScore GSE份额<15%)"
      - "OPM维持>=44%(定价权未实质性衰减)"
      - "ND/EBITDA<3.5x(杠杆可控)"
      - "管理层资本配置不进一步激进化(回购不超FCF 150%)"
    sell_triggers:
      - signal: "VantageScore GSE份额>15%且增速加速(季度环比+3pp)"
        severity: "action"
