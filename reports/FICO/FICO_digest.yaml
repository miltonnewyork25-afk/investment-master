# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含CAGR 14% vs 共识13.8%→隐含C1>=4.0+OPM→55-60%→制度不变是最核心赌注"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1至RT-7双向校准,净效果+1.6%→从高估18%修正为16%; 识别TTM PE锚定偏差+VS渗透速度过高"

    - pattern_id: "scenario_analysis.death_spiral_path"
      application: "R1+R4+R5风险协同→6阶段死亡螺旋→股价-65%; 概率15%但影响极端"

  novel_patterns:
    - name: "定价权阶段模型v1.0 (M2)"
      description: "Stage 1-5生命周期+5指标量化(OPM位置比/市场认知/提价加速度/监管热度/竞争位移)→识别定价权在生命周期的精确位置"
      transferable_to: ["所有B4>=3.5公司", "SPGI(Stage 1.0-1.5)", "MSCI(Stage 1.5-2.0)", "Bloomberg(Stage 1.5)"]

    - name: "C1制度嵌入五层结构 (C1-L)"
      description: "L1基础设施/L2监管/L3合同/L4操作/L5认知——每层独立评分+替换难度+时间表,识别'哪一层被打开'"
      transferable_to: ["所有制度嵌入公司", "SPGI(L2最强)", "MSCI(L4最强)", "Bloomberg(L4最强)"]

    - name: "估值溢价三层分解 (M5)"
      description: "将高倍数分解为基本面溢价+制度溢价+认知溢价,分别评估持久性→识别哪层溢价最脆弱"
      transferable_to: ["所有制度垄断公司", "高PE公司的溢价归因"]

    - name: "B4a/B4b分层(定价权强度 vs 耐久性)"
      description: "B4a=当前可以提价多少(强度) vs B4b=定价权可以持续多久(耐久性)→捕捉FICO B4a=5但B4b=3.5的关键区别"
      transferable_to: ["所有B4>=3.5公司", "Visa/MA定价权评估"]

    - name: "CI-01制度自我加固悖论(C1xB4反身性)"
      description: "高C1保护高B4→B4过度释放引发政治反弹→C1下降→B4衰减=自我毁灭循环"
      transferable_to: ["所有制度垄断公司面临'提价过度引发政治注意'的风险"]

    - name: "eta回购效率曲线 (M4, 迁移自HLT)"
      description: "eta(回购创造价值/回购金额)随股价递减; FICO FY2025 eta=61.8%(vs FY2024 114.3%)→高估时回购毁灭价值"
      transferable_to: ["所有负权益+高PE+大额回购的公司"]

  framework_contributions:
    moat_insights:
      - insight: "C1制度嵌入是一种超越传统护城河分类的新类别——Morningstar/Greenwald/Mauboussin三大框架都有盲点"
        implication: "护城河评估增加'制度嵌入'独立维度,用五层结构(L1-L5)精确定位哪层被打开"
      - insight: "定价天花板由政治学决定而非经济学——FICO $38/$380K房贷=0.01%成本,经济上完全可承受"
        implication: "定价权评估增加'政治天花板'子项,与经济天花板/竞争天花板并列"
      - insight: "护城河收窄的共识跨越三大框架(Morningstar/Greenwald/Mauboussin),但收窄速度高度不确定(线性vs非线性)"
        implication: "制度垄断的护城河衰减应建模为'两种速度':温水煮青蛙(70%)vs非线性崩塌(30%)"

    valuation_insights:
      - insight: "合并OPM掩盖价值断裂——SOTP必须拆开才能看到真实定价:Scores PE 30-35x + Software中端SaaS"
        implication: "多业务线公司中利润贡献>70%来自单一业务时,必须SOTP估值→合并PE有误导性"
      - insight: "定价权Stage决定了'未来OPM扩张空间'→Stage越高投资期权时间价值越低"
        implication: "对高OPM公司估值时加入Stage因子——Stage>2.5的公司不应给'持续OPM扩张'的PE溢价"
      - insight: "Forward PE(27x) vs TTM PE(52x)差距暴露了选择性展示偏差——投资者应同时看两者"
        implication: "估值时永远同时展示TTM和Forward PE,避免锚定偏差"

    screening_insights:
