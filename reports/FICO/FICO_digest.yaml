      - signal: "ND/EBITDA>3.5x且Scores收入增速<5%(杠杆+收入双恶化)"
        severity: "action"
        action: "减仓50%——R1+R4死亡螺旋前兆"
      - signal: "反垄断集体诉讼获集体认证(三倍赔偿基于890%提价)"
        severity: "warning"
        action: "减仓25%,评估和解规模(参考Visa/MC $8.5B先例)"
      - signal: "PE>60x且增速<10%(纯估值泡沫)"
        severity: "action"
        action: "全部卖出——PE极端+增速放缓=双杀必然"
    position_sizing: "当前价格不买(期望回报-16%) | @$1,150约半Kelly"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "制度垄断自我加固悖论(C1xB4反身性)"
    chain: >
      GSE法定要求FICO(30年, C1=5.0)
      → 无竞争=无提价约束→B4定价权沉睡(1989-2017, $0.50不变)
      → 新管理层觉醒→版税890%提价/7年(B4释放)
      → OPM从20%→47%→利润暴增→市场兴奋(PE 18x→52x)
      → 但提价引发政治注意(Hawley)+行业反弹(MBA/CHLA)+竞争反弹(FHFA批准VS)
      → C1从5.0→4.5→B4未来耐久性受损(PtW 89→75预测)
      → 制度嵌入保护了定价权→定价权过度释放动摇了制度嵌入=自我毁灭循环
    transferable_to: "所有制度垄断公司的定价权释放路径(评级机构/指数/支付网络)"
    reasoning_habit: "看到制度垄断公司开始激进提价时,立刻追问'这会引发政治反弹吗'——定价天花板由政治学决定,经济学几乎从不是约束"

  - id: "CC-2"
    name: "定价权阶段模型(Stage 1-5生命周期)"
    chain: >
      Stage 1潜伏(定价远低于价值)→Stage 2觉醒(试探提价)→Stage 3加速(超通胀提价)
      → Stage 4天花板(提价引发实质抵制)→Stage 5衰退(被竞争/监管侵蚀)
      → FICO在Stage 2.3,距天花板3.0仅0.7
      → 意味着:最容易赚的钱(Stage 1→2)已经赚完,剩余是越来越难的钱
      → 投资期权的时间价值在加速衰减(OPM位置比0.29→0.67)
    transferable_to: "所有具有定价权的B4>=3.5公司(SPGI Stage 1.0-1.5, MSCI Stage 1.5-2.0)"
    reasoning_habit: "不只问'有没有定价权',还要问'在定价权的什么阶段'——Stage 1-2是投资期权,Stage 3-4是风险"

  - id: "CC-3"
    name: "SOTP揭示估值幻觉(Scores vs Software价值断裂)"
    chain: >
      合并报表: OPM 47%, PE 52x → 看起来是一个高品质垄断公司
      → 拆开: Scores OPM~85%贡献86%利润, Software OPM~32%贡献14%利润
      → Software独立估值$4-7B(中端SaaS), Scores估值$25-32B(制度垄断溢价)
      → 投资者实际在为Scores付$28-33B(PE 30-35x on Scores earnings alone)
      → 同时Software提供的"安全边际"远小于直觉暗示(仅$4-7B/约15%总EV)
      → 合并估值掩盖了:如果C1下降→Scores贬值→整体跌幅>你以为的
    transferable_to: "所有多业务线公司中一个业务主导利润的情况(MCO评级vs MA)"
    reasoning_habit: "合并OPM好看时,拆开看单业务——利润集中在哪个资产?那个资产的独立风险是什么?"

  - id: "CC-4"
    name: "R1+R4+R5死亡螺旋(风险协同效应)"
    chain: >
      VantageScore获25%份额(R1)→Scores Rev -20%→EBITDA -30%
      → ND/EBITDA从3.09x→4.2x(R4触发)→评级下调BBB-→BB+
      → 再融资成本+200bp→利息覆盖→3.4x→回购暂停
      → EPS增速下降6-8pp→增长叙事崩溃(R5触发)
      → PE从50x→25x→股价-65%
      → SBC行权减少→管理层流失→战略执行力下降→正反馈加速
    transferable_to: "所有高杠杆+高PE+单一收入来源的公司"
    reasoning_habit: "不只独立评估每个风险的概率,还要画风险协同矩阵——最危险的不是单个风险而是风险组合"

  - id: "CC-5"
    name: "估值溢价三层分解(M5方法论)"
    chain: >
      FICO EV/EBITDA 41x = 基本面溢价(25x) + 制度溢价(10x) + 认知溢价(6x)
      → 基本面溢价(OPM+FCF+零CapEx)相对稳定
      → 制度溢价(C1=4.5)正在被FHFA/VS侵蚀→如果C1→3.0则10x→2x
      → 认知溢价("下一个Visa"叙事)→增速放缓时蒸发→6x→0x
      → 最大风险不是基本面恶化,而是制度溢价+认知溢价同时消失=EV/EBITDA从41x→27x→股价-35%
    transferable_to: "所有享受制度溢价的公司(评级/指数/支付)"
    reasoning_habit: "高倍数公司先做溢价分解——哪部分是基本面?哪部分是制度?哪部分是叙事?然后分别评估持久性"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "52x PE买入信用评分垄断是合理的(毕竟Visa也是30x+)"
      final: "SOTP揭示Scores独立PE 30-35x+Software拖累; 且FICO增速(8.7%)远低于Visa(10%+)→52x不合理"
      pivot: "Scores-Software价值断裂: 86%利润来自Scores,合并PE掩盖了真实定价"

    - initial: "VantageScore永远不会超过10%份额(转换成本太高)"
      final: "16%概率加权2030份额(红队校准后); FHFA已行动=政府推动,非纯市场竞争"
      pivot: "RT-2识别贷款机构惰性确实被低估→份额从18.5%修正至16%,但方向不变"

    - initial: "FICO管理层是顶级管理层(14年+36x股价)"
      final: "战略天才(4.5/5)+资本配置激进(2.5/5)+零内部人购买=3.2/5综合"
      pivot: "举债$645M填充回购缺口@$1,400+股价+内部人5年零购买=激励不对齐信号"

  surprises:
    - finding: "FICO版税从$0.50涨到$4.95(890%/7年)且零客户流失——制度垄断定价权的极端案例"
      implication: "定价权Stage模型中Stage 2.3是确认的,但剩余空间0.7意味着最容易的钱已赚完"

    - finding: "ND/EBITDA从1.2x(FY2019)加速至3.09x(FY2025)——12年最高,距评级阈值仅0.9x"
      implication: "杠杆轨迹若不逆转,FY2027可能达3.5-4.0x→评级下调触发R4杠杆螺旋"

    - finding: "回购$1,415M = FCF $770M的1.84x——缺口$645M靠举债,且内部人5年零购买"
      implication: "管理层用股东的钱(举债)在52x PE回购,但不用自己的钱买——经典激励不对齐"

    - finding: "C1每降0.5分→Scores估值下降$5-7B($200-280/share)——制度嵌入的估值弹性极大"
      implication: "FHFA事件仅C1从5.0→4.5就导致$6B市值蒸发——验证了C1量化方法"

  blind_spots:
    - area: "VantageScore 2030年GSE实际份额"
      why_matters: "决定C1是4.5(护城河完好)还是3.5(加速侵蚀)→Scores估值差$10B+"
      monitor: "2026秋GSE实施→2027年底首批份额数据; KS-FICO-01季度追踪"

    - area: "DLP实际迁移率"
      why_matters: "DLP成功→FICO重建定价链→Stage重置; DLP失败→征信局报复+双重负面"
      monitor: "推出18个月后(FY2027H1)的实际交易量; FICO earnings call管理层commentary"

    - area: "反垄断集体诉讼赔偿规模"
      why_matters: "集体认证+三倍赔偿基于890%提价=潜在数十亿; 但DOJ已关闭调查=混合信号"
      monitor: "PACER法院文件; 集体认证阶段(关键里程碑); 和解动向"

    - area: "C1衰减速度是线性还是非线性"
      why_matters: "线性=温水煮青蛙(10+年); 非线性=Netscape式崩塌(2-3年)→估值影响10倍差距"
      monitor: "VantageScore季度份额增速是否加速(tipping point检测)"

  sell_lessons:
    - scenario: "在52x PE不减仓→如果增速放缓至10%→PE压缩至30x→股价-40%即使EPS增长"
      lesson: "高PE公司的卖出纪律=增速是否能支撑倍数。PE/增速比>3x是危险信号"
      transferable: "所有PE>40x且增速<15%的公司"
    - scenario: "制度垄断定价权开始引发政治反弹时不减仓→政治注意力是C1侵蚀的领先信号"
      lesson: "定价天花板由政治学决定。看到Hawley/FHFA/行业协会同时行动=Stage 3→4的转折信号"
      transferable: "所有制度嵌入公司(评级机构/交易所/支付网络)"
    - scenario: "管理层零内部人购买+举债回购@历史高位→公司'看好自己'但管理层不出钱"
      lesson: "回购是管理层利益(EPS好看)不是股东利益(在高估时回购=毁灭价值)——算eta值验证"
      transferable: "所有大额回购且内部人零购买的公司"

