        implication: "选股增加'定价权Stage<2.0 + C1>=4.0'筛选条件→寻找'2014年的FICO'"
      - insight: "ND/EBITDA加速上升(斜率而非水平)是杠杆风险的领先信号"
        implication: "选股增加'ND/EBITDA三年变化>1.5x'排除条件→FICO从1.2x→3.09x应触发预警"
      - insight: "内部人零购买+大额回购=激励不对齐信号"
        implication: "选股增加'回购/FCF>150% + 内部人零购买(2年)'排除条件"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "对制度垄断公司追问'定价权在什么阶段'"
      trigger: "遇到C1>=4.0 + B4>=4.0 + 高OPM增速的公司"
      origin: "FICO 890%提价/7年看似无限→但Stage模型揭示剩余空间仅0.7→投资期权时间衰减"
      generalization: "定价权不是二元(有/没有),而是有生命周期。Stage越高剩余价值越低,投资期权越不值钱"

    - habit: "高倍数时先做溢价分解"
      trigger: "PE>40x 或 EV/EBITDA>30x"
      origin: "FICO EV/EBITDA 41x分解为基本面(25x)+制度(10x)+认知(6x)→制度+认知占39%但持久性最差"
      generalization: "高倍数公司的回报风险不在基本面恶化,而在'溢价蒸发'——分清哪部分是持久的基本面,哪部分是可蒸发的制度/叙事"

    - habit: "看到制度垄断激进提价时,追问政治天花板"
      trigger: "任何制度嵌入公司的年提价>20% 或 OPM年增>3pp"
      origin: "FICO 890%提价引发Hawley+FHFA+MBA+10诉讼=CI-01反身性循环验证"
      generalization: "制度垄断的定价天花板由政治学决定。监管机构/国会议员的注意力=定价权衰减的领先指标"

    - habit: "内部人行为和资本配置交叉验证"
      trigger: "回购>FCF且内部人零购买(2年+)"
      origin: "FICO举债$645M回购@52x PE但管理层5年零购买=最极端的激励不对齐案例"
      generalization: "管理层说'股价被低估所以回购'但自己不买=信号vs行动不一致。算eta值量化回购是创造还是毁灭价值"

  quality_feedback:
    strengths:
      - "Ch11护城河五层结构(L1-L5)原创且可迁移——三大护城河框架对比是标杆级分析深度"
      - "Ch4定价权Stage模型v1.0(5阶段+5指标)是新的分析工具——跨行业对比验证有效"
      - "Ch15制度垄断横向六维对比(FICO vs SPGI/MSCI/Bloomberg/Visa)——结论'FICO是最差风险回报配置'有量化支撑"
      - "DM密度1.19/千字合格(>0.8阈值)"
    weaknesses:
      - "因果推理密度2.82/万字偏低(<5.0合格线)——部分章节断言多于论证"
      - "红队净效应+1.6%偏小——可能说明Red Team强度不够(vs CME +$19更有实质)"
      - "Software业务分析深度不足——Platform vs Non-Platform的分化趋势值得更深挖掘"

  hypothesis_tested:
    confirmed:
      - hypothesis: "回购@高PE毁灭价值(CME CI验证)"
        evidence: "eta从FY2024 114.3%骤降至FY2025 61.8%——高PE下回购效率急剧下降"
        confidence_after: "高(三份报告独立确认: HLT+CME+FICO)"

      - hypothesis: "Reverse DCF必须P1前置(CRM铁律O)"
        evidence: "Ch8 Reverse DCF有效翻译市场信念→揭示C1不变是最核心赌注→防止预设方向偏差"
        confidence_after: "高(执行确认)"

    extended:
      - hypothesis: "C1制度嵌入是护城河的独立维度(CME验证)"
        extension: "FICO C1有五层结构(L1-L5)→从CME的'制度嵌入'单一概念扩展为五层分层评估"

      - hypothesis: "品质最高不等于回报最高(CME垄断三角)"
        extension: "FICO品质极高(OPM 47%/FCF 39%/CapEx 0.5%)但52x PE→信息垄断中最差风险回报,验证了CME发现"

    refuted: []

  limitations:
    - "VantageScore GSE实际份额无法预测(2026秋才开始实施)→所有情景分析中VS份额假设置信度低(40%)"
    - "DLP是全新商业模式(2025.10推出,无历史参考)→CI-04概率赋值高度不确定(35%置信度)"
    - "反垄断赔偿规模无法量化(法律不确定性极高,30%置信度)→和解可能从$200M到$5B+"
    - "C1衰减速度的线性vs非线性假设对估值影响10倍——但无法事前区分,只能事后观察"
    - "因果推理密度2.82/万字低于合格线(5.0)——部分分析可能断言多于论证"
