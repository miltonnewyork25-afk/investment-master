    - dimension: "地缘风险暴露"
      position: "TSM (最高) >> Samsung (中) > Intel (低) > ASML (极低)"
      reasoning: "TSM 80%+产能在台湾, 唯一的'归零级'地缘风险持有者"

    - dimension: "AI受益纯度"
      position: "NVDA > TSM > AMD > ASML > Intel"
      reasoning: "TSM AI广义覆盖61%收入但含大量间接受益; NVDA数据中心>80%直接AI"

    - dimension: "估值吸引力(当前)"
      position: "Intel (历史低位) > AMD (合理) > TSM (公允偏贵) > NVDA (溢价) > ASML (溢价)"
      reasoning: "TSM PE 28x在历史高位, FCF Yield 1.88%, 安全边际不足"

  industry_position:
