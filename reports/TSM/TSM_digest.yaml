# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "全球最优秀的半导体公司，但$355买入=公允价格买顶级品质，安全边际不足——等$280-340再建标准仓"
  rating: "中性关注"
  fair_value: "$370/ADR (+4.2%)"
  expected_return: "~4%@$355(公允) | ~15%/年@$280-340(标准仓)"

  key_arguments:
    - claim: "AI算力节流阀——全球90%先进芯片+100%CoWoS封装必须经过TSM"
      direction: bullish
      magnitude: 5  # 硬数据: 3nm ~90%份额, CoWoS 130K wpm全售罄, 护城河8.98/10
      mechanism: "制程垄断(90%先进节点) + CoWoS封装垄断(无替代) + $590M设计成本转换壁垒 → 客户锁定18-36月 → 4年连续涨价3-10%"
      kill_switch: "Samsung 2nm良率>80% + Intel 18A获2+大客户 → 垄断溢价侵蚀(概率15-20%)"

    - claim: "AI增长70-75%是结构性的，受制程垄断和封装瓶颈保护"
      direction: bullish
      magnitude: 4  # CEO确认AI收入2026翻倍, 超算CapEx $650-725B
      mechanism: "训练→推理转换创造第二增长引擎 + CoWoS瓶颈使TSM成为AI供应链速率决定步骤 → FY2026E营收+28-30%"
      kill_switch: "超算CapEx增速<15% + NVIDIA DIO>160天 → AI消化期提前到来(概率20-25%)"

    - claim: "当前$355已充分定价品质——Reverse DCF隐含预期合理，无显著低估"
      direction: bearish
      magnitude: 4  # Reverse DCF隐含5年FCF CAGR 19.3% vs 共识19.1%
      mechanism: "Forward PE 28x + EV/Sales 12.4x(历史新高) + FCF Yield 1.88%(远低于10Y美债4.3%) → 安全边际<5%"
      kill_switch: "AI溢价从3.5%扩张至12.5% → 目标$416(+17%)"

    - claim: "台海地缘风险定价不足——概率加权损失-16.7% vs 隐含折价仅10-15%"
      direction: bearish
      magnitude: 3  # Polymarket 11.5%, 低概率但高影响
      mechanism: "87%正常+13%极端的二元分布 → 封锁=-40~-50%/冲突=-80~-90% → 期望损失-16.7% → 当前PE隐含折价不足"
      kill_switch: "海外产能2028达20%'生存线' + Polymarket持续<10% → 折价结构性收窄"

    - claim: "2027-2028年竞争格局从'TSM独占'转向'TSM主导+有限替代'"
      direction: conditional
      magnitude: 3  # Samsung SF2P 70%良率是信号, Intel 18A获Apple
      mechanism: "Samsung 2nm良率突破70% + Intel 18A获Apple赢单 → 先发规模优势非不可复制 → 定价权边际弱化"
      kill_switch: "Samsung/Intel 2026年底良率均<70% → 追赶再延迟2年 → 垄断窗口延长"

  moat:
    composite_score: 8.98  # Phase 3 M10五维量化
    half_life: "制程领先2-4年 | 封装(CoWoS/SoIC)>5年 | 客户锁定18-36月/设计周期"
    dimensions:
      - type: ip
        strength: 5
        evidence: "3nm良率差40pp(TSM >90% vs Samsung ~50%); N2率先量产良率70-80%; R&D效率7% vs Intel 31%"
        vulnerability: "先发规模优势而非不可复制技术——Samsung掌握GAA理论基础, 问题是工程执行"
      - type: switching_cost
        strength: 5
        evidence: "$590M 3nm设计成本 + 18-36月PDK锁定 + 30年DTCO数据积累不可复制"
        vulnerability: "客户多元化动力(NVIDIA投资Intel Foundry $5B)可能在2-3年内削弱绝对定价权"
      - type: scale
        strength: 5
        evidence: "$52-56B CapEx(全球最高) + 毛利率58-65% + CoWoS 130K wpm产能无可匹敌"
        vulnerability: "海外fab成本高30-50% → 混合毛利率承压2-3pp(2028年海外占比达20%)"
      - type: network_effect
        strength: 4
        evidence: "EDA三巨头优先适配 + CoWoS生态 + IP优先验证 → 设计生态正反馈"
        vulnerability: "Samsung/Intel若获大客户量产验证, 可启动自身生态循环"
      - type: brand
        strength: 4
        evidence: "纯代工模式(不与客户竞争) + 71%总份额 + ~100%客户保留率"
        vulnerability: "纯代工承诺若因自研芯片诱惑打破(极低概率), 信任基础崩塌"

  valuation:
    reverse_dcf_implied: "隐含5年FCF CAGR 19.3%, 营收CAGR ~20%, 终端净利率~43% — 均在共识±20%内, 定价合理"
    methods_used: ["SOTP v3.0(4分部)", "AI调整SOTP", "偏差修正SOTP", "DCF概率加权", "分析师共识", "Bear-adjusted", "Reverse DCF", "OVM期权估值"]
    dispersion: "29.6% ($317-$652, 传统$349 vs AI增强$519)"
    consensus_vs_ours: "市场看TSM=28x PE半导体周期股 | 我们看TSM=传统估值$349公允+AI期权$53-$170待兑现+地缘折价不足"
    entry_zone: "$280-340 (标准仓) | $220-280 (核心仓)"
    catalyst: "回调窗口: AI消化期(2027H2) | 地缘恐慌(Polymarket spike) | 竞争噪音(Samsung 2nm量产消息)"

  # ★ v1.2新增: 买卖决策框架 ★
  action_framework:
    verdict: "等待买入 — 品质已确认(护城河8.98/10), 等待价格回落到$280-340建标准仓"
    buy_triggers:
      - trigger: "AI消化期: 超算CapEx增速放缓→TSM指引下调→sell-side下调"
        price_zone: "$280-340 (PE 20-24x)"
        reasoning: "AI结构性需求不变但周期性回调→PE压缩→安全边际>15%"
      - trigger: "地缘恐慌: Polymarket台海概率spike但未实质恶化"
        price_zone: "$220-280 (PE 16-20x)"
        reasoning: "市场过度反应地缘噪音→实质风险不变→反脆弱入场"
      - trigger: "竞争噪音: Samsung 2nm量产消息引发市场担忧"
        price_zone: "$300-340"
        reasoning: "良率达标到大规模量产+客户验证还需2-3年→短期噪音"
    hold_conditions:
      - "先进节点(<=7nm)份额>80%"
      - "毛利率>55%(连续2Q)"
      - "CoWoS利用率>80%"
      - "Polymarket台海入侵概率<25%"
      - "NVIDIA占比<30%且无可行替代方案"
    sell_triggers:
      - signal: "Polymarket台海入侵概率>25%"
        severity: "action"
        action: "减仓50%, Polymarket>40%则清仓"
      - signal: "Samsung 2nm良率>80% + Qualcomm/AMD转单>10%"
        severity: "warning"
        action: "重评护城河, 如份额降至<80%则减仓30%"
      - signal: "超算CapEx增速<0%(AI需求断崖)"
        severity: "action"
        action: "减仓50%, 重评AI结构性论点"
      - signal: "毛利率连续2Q<55%"
        severity: "warning"
        action: "重评估值, 检查良率/海外fab/定价权问题"
      - signal: "PE>35x且无增速提升催化(AI溢价过度定价)"
        severity: "action"
        action: "减仓50%, 锁定利润"
    position_sizing: "当前$355: 1%观察仓(安全边际不足) | $280-340: 标准仓3-5% | $220-280: 核心仓5-8%(组合上限, 地缘风险)"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "CoWoS从'附加服务'到'系统集成商'的价值重估"
    chain: >
      AI模型规模化→单芯片算力不足→需要多芯片封装(chiplet)
      → CoWoS是唯一能将HBM+GPU+互连集成的先进封装技术
      → TSM垄断CoWoS>80%产能(130K wpm, 全年售罄)
      → 客户选TSM不仅看制程, 更看"制程+封装+测试"全栈能力
      → TSM从"代工商"变为"AI算力系统集成商"
      → 封装护城河追赶5年+(vs 制程2-4年), 更持久
      → 市场仍按"代工商"估值(PE 28x), 未反映系统集成商溢价
    transferable_to: "所有从单一供应转向全栈集成的垄断企业(如从组件供应商升级为平台)"
    reasoning_habit: "追问'客户选你到底买的是什么' — 如果买的不仅是产品而是整合能力, 护城河性质从'技术领先'升级为'生态锁定'"

  - id: "CC-2"
    name: "地缘风险的二元定价模型(非线性折价)"
    chain: >
      台海风险是低概率高影响事件 → 线性折价(如PE打8折)不适合
      → 应用二元模型: 87%正常(PE应=行业40x) + 13%极端(PE→0-5x)
      → 概率加权期望损失-16.7% → 当前PE 28x隐含折价10-15% → 定价不足
      → 但海外产能扩张(2026 10%→2028 20%)每年收窄折价1.5-2.5%
      → Arizona fab不是利润最优选择而是"市场准入条件"(投资换准入)
      → 地缘风险不可对冲只可管理 → 仓位控制(上限5-8%)+期权对冲
    transferable_to: "所有面临低概率高影响政治风险的公司(俄罗斯上市公司/中东石油/南海航运)"
    reasoning_habit: "低概率高影响风险用二元概率模型而非线性折价 — PE打折掩盖了真实的尾部风险分布"

  - id: "CC-3"
    name: "垄断定价权的'绝对窗口'有限论"
    chain: >
      TSM先进节点90%份额 → 2026-2029四年连续涨价3-10%
      → 但NVIDIA投资Intel Foundry $5B(供应链培育)
      → 先用低价值I/O die验证Intel工艺 → 如果成功则迁移compute die
      → 一旦NVIDIA有可信Plan B → TSM涨价谈判筹码弱化
      → "绝对定价权"窗口可能只剩2-3年(vs 市场假设5年+)
      → 定价权从Stage 5(绝对垄断)可能降至Stage 4(强但有替代)
    transferable_to: "所有客户正在培育替代供应商的垄断企业(如单一来源合同到期前)"
    reasoning_habit: "客户培育替代供应商的投资(即使很小)是定价权天花板的领先信号 — 看动作不看金额"

  - id: "CC-4"
    name: "AI周期的'高原期'而非'尖峰期'判断"
    chain: >
      传统半导体周期: V型或倒V型(快速见顶→快速衰退)
      → AI周期不同: 客户投资基于FOMO而非纯ROI → 触发下行的条件更苛刻
      → 训练→推理转换创造第二增长引擎(推理需求从1/3→2/3)
      → 高原期(plateau)而非尖峰(spike): AI CapEx增速放缓但不暴跌
      → TSM影响: 利用率从95%降至80-85%而非<70%(传统周期底部)
      → 毛利率温和收窄(3-5pp)而非断崖(10pp+)
    transferable_to: "所有受新范式驱动的周期性行业(如2000年互联网基础设施/2010年移动通信基站)"
    reasoning_habit: "周期分析先判断驱动力性质(FOMO vs ROI) — FOMO驱动的周期下行更慢但恢复也更难"

  - id: "CC-5"
    name: "海外扩产的'投资换准入'定价模型"
    chain: >
      美国政府要求TSM在Arizona建厂 → 不是商业最优而是市场准入条件
      → Arizona成本比台湾高30-50% → 海外产能20%目标(2028年)
      → 混合毛利率承压2-3pp(结构性, 非周期性)
      → 但换来: 关税豁免(20%→15%) + 政府背书("不能让TSM失败")
      → 地缘折价每年收窄1.5-2.5% → 5-10年后PE修复可能>毛利率损失
      → 短期EPS损失 vs 长期PE扩张 = 时间维度的价值交换
    transferable_to: "所有被政府要求本地化生产的全球垄断企业(如汽车/能源/药品供应链回流)"
    reasoning_habit: "强制本地化的成本不止看毛利率损失 — 同时计算PE折价收窄的长期价值"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "TSM先进节点~90%份额使护城河不可攻破"
      final: "护城河极强但'先发规模'而非'不可复制技术' — Samsung掌握GAA理论, Intel获Apple赢单"
      pivot: "Samsung SF2P 2nm良率突破70% + Intel 18A获Apple里程碑协议 → Phase 4下调置信度10pp"

    - initial: "AI增长85%置信度可持续3-5年"
      final: "AI增长75-78%置信度, 18-24月安全窗口, 2028年后面临ROI审视"
      pivot: "Phase 4对抗审查: AI泡沫概率20-25% + DeepSeek效率冲击的Jevons Paradox未被硬数据证实"

    - initial: "地缘风险被市场过度定价(PE折价14-21% vs 概率加权-11.4%)"
      final: "地缘风险定价不足(概率加权EL -16.7% vs 隐含折价10-15%)"
      pivot: "Phase 4更新Polymarket→11.5% + Buffett完全退出TSM + 概率模型从线性折价修正为二元分布"

  surprises:
    - finding: "封装护城河(CoWoS/SoIC)比制程更持久: 追赶5年+ vs 制程2-4年"
      implication: "市场用'制程代差'给TSM估值, 但真正的长期价值在封装垄断 → CoWoS独立估值可能$50-80B"

    - finding: "NVIDIA投资Intel Foundry $5B是定价权天花板的领先信号"
      implication: "TSM的'绝对定价权'窗口可能只剩2-3年 → 4年涨价计划的后半段面临阻力"

    - finding: "Phase 1-3系统性低估竞争追赶速度 → Phase 4下调6个CQ置信度3-12pp"
      implication: "分析AI受益者时存在结构性确认偏误 → 对抗审查不是可选而是必须"

    - finding: "AI收入覆盖61%(广义)而非市场常引用的'high-teens%'(狭义加速器)"
      implication: "TSM的AI暴露度被市场低估约3x → AI周期下行对TSM的冲击也被低估"

  blind_spots:
    - area: "CoWoS供需何时平衡"
      why_matters: "供不应求=定价权极强; 供需平衡=定价权回归正常 → 毛利率差3-5pp"
      monitor: "季度法说会CoWoS利用率披露; 竞品封装产能(ASE/Amkor)扩张进度"

    - area: "DeepSeek效率冲击的实质影响"
      why_matters: "如果高效模型使训练需求'见顶更早', HPC营收拐点可能提前至2027H2"
      monitor: "NVIDIA DIO趋势; 超算AI CapEx占总CapEx比; 推理量增速vs单次推理成本下降率"

    - area: "Intel 18A从Apple入门级扩展到旗舰级的概率"
      why_matters: "入门级=噪音; 旗舰级=实质竞争 → 先进节点份额可能从90%降至80-85%"
      monitor: "Intel 18A良率(>80%?); Apple之外第二大外部客户公告; Qualcomm/AMD分单信号"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "PE 28x + EV/Sales 12.4x历史新高 + FCF Yield 1.88% — 品质极高但价格已充分定价"
      lesson: "品质极高的垄断企业在估值历史新高时, 唯一的意外方向是向下。安全边际<5%时不应追入"
      transferable: "所有CQI>80且PE处于5年高位的垄断型公司"
    - scenario: "AI周期高点持有→如果AI消化期到来→PE从28x压缩至22-24x→下行20-30%"
      lesson: "AI受益股在周期高点应review仓位规模。结构性受益≠不受周期影响——70%结构性仍有30%周期性"
      transferable: "所有'结构性增长'叙事中含周期性成分的公司(AI/新能源/云计算)"
    - scenario: "地缘恐慌中未买入→错过折价入场→后续PE修复创造超额回报"
      lesson: "低概率高影响风险的恐慌性抛售是最佳入场窗口 — 前提是基本面论点不变且有仓位管理"
      transferable: "所有面临二元政治风险的高品质公司"

# --- Layer 2.5: 信号分级 (v1.2新增) ---
signal_hierarchy:
  alpha_signals:
    - signal: "CoWoS供需状态(利用率/交期/涨价幅度)"
      why_alpha: "CoWoS是AI供应链物理瓶颈, 供需状态直接决定TSM定价权强度。大多数分析师关注制程节点而非封装"
      current_reading: "2026全年售罄, 扩产至130K/月, 涨价10-20% — 极度供不应求"
    - signal: "NVIDIA对Intel Foundry的订单扩展(从I/O die到compute die)"
      why_alpha: "TSM'绝对定价权'窗口的最佳前瞻指标。$5B投资是开始不是终点"
      current_reading: "仅I/O die(低价值), compute die未转移 — 窗口仍开放"
    - signal: "Polymarket台海冲突概率趋势方向"
      why_alpha: "地缘折价的市场定价锚。概率方向(上升/下降)比绝对值更重要"
      current_reading: "11.5%, 从30%(2025-10)持续下降 — 趋势利好但绝对值仍高"

  confirmation_signals:
    - signal: "季度毛利率(指引vs实际)"
      bullish_threshold: ">64%(超指引上沿=定价权+良率双确认)"
      bearish_threshold: "<60%(低于指引下沿=N2良率或海外fab问题)"
    - signal: "超算CapEx增速(季度YoY)"
      bullish_threshold: ">30% YoY(AI投资加速)"
      bearish_threshold: "<15%(AI消化期启动) | <0%(AI需求断崖)"
    - signal: "NVIDIA DIO(天数)"
      bullish_threshold: "<140天(需求强劲, 库存健康)"
      bearish_threshold: ">160天(库存积压, AI需求放缓信号)"

  noise_signals:
    - signal: "日度/周度ADR价格波动"
      why_noise: "TSM受宏观/地缘/AI情绪三重驱动→日度波动是噪音, 看季度基本面"
    - signal: "Sell-side目标价调整"
      why_noise: "17位分析师范围$200-$450, 离散度极大→个别调整无信息量。用自建Reverse DCF替代"
    - signal: "成熟节点(28nm+)需求/价格变化"
      why_noise: "成熟节点毛利率远低于先进节点→对利润影响<5%。AI投资者应只关注<=7nm动态"

