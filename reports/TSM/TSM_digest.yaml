    archetype: "AI算力节流阀 — 全球AI增长的物理瓶颈, 收费确定但地缘风险不可消除"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含5年FCF CAGR 19.3% vs 共识19.1%→定价合理, 无显著错误定价"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "AI消化期: 超算CapEx增速逐步放缓→TSM指引下调→sell-side下调→PE压缩→$280-340入场窗口(2027H2)"

    - pattern_id: "competitive_benchmarking.chinese_competitor_deep_dive"
      application: "Samsung+Intel双线追赶: 5情景×概率(Samsung 2nm良率/Intel 18A客户/组合场景)量化竞争格局演变"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "8个独立Bear Case + 行为金融偏差校正(确认偏误-$45, 锚定+$6) → Phase 4将6个CQ置信度下调3-12pp"

  novel_patterns:
    - name: "封装护城河>制程护城河(半衰期倒置)"
      description: "市场关注制程代差(2-4年可追赶), 但封装垄断(CoWoS/SoIC)追赶需5年+且无EUV类设备可缩短差距"
      transferable_to: ["所有制造业中'集成能力'比'单一技术'更重要的垄断企业", "汽车(整车vs零部件)/航空(发动机总装)"]

    - name: "二元地缘风险定价(非线性折价)"
      description: "低概率高影响地缘风险不应用线性PE折价, 应用概率加权二元模型(正常态×概率 + 极端态×概率)计算期望损失"
      transferable_to: ["所有面临政治二元风险的上市公司", "新兴市场ADR(俄罗斯/中东)", "台湾/韩国半导体"]

    - name: "投资换准入(强制本地化的隐含价值交换)"
      description: "政府强制本地化=短期成本(毛利率-2~3pp)+长期价值(地缘折价收窄+政府背书)的时间维度交换"
      transferable_to: ["CHIPS Act受益/受损者", "欧洲绿色供应链本地化", "印度制造业强制本地化"]

    - name: "AI暴露度的广义vs狭义测量"
      description: "管理层披露的狭义AI收入(加速器占high-teens%)严重低估AI实际辐射(广义61%=HPC+CoWoS+间接)"
      transferable_to: ["所有自称'AI受益'的公司", "需要区分直接/间接AI收入的估值分析"]

    - name: "绝对定价权窗口(客户培育替代信号)"
      description: "垄断定价权的有效期=客户培育出可信替代供应商的时间。$5B投资不看金额看意图"
      transferable_to: ["单一来源依赖的客户-供应商关系", "药品/军工独家供应商"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "封装护城河半衰期>制程护城河——市场定价关注制程代差, 真正的长期壁垒在封装集成"
        implication: "半导体护城河评估应增加'集成能力'维度, 权重≥20%(当前框架未单独列出)"
      - insight: "护城河8.98/10但置信度从P3 90%降至P5 78% — '先发规模'而非'不可复制'意味着护城河有衰减速率"
        implication: "极高护城河评分不等于永久——应附加'衰减速率'指标(年化多少pp份额流失)"

    valuation_insights:
      - insight: "二元地缘风险用概率加权模型比线性PE折价更准确——期望损失可量化"
        implication: "所有含政治二元风险的公司应用(正常态PE×概率 + 极端态PE×概率)替代简单PE折价"
      - insight: "传统估值$349 vs AI增强估值$519 — AI期权价值是分歧核心($170/ADR差距)"
        implication: "AI受益者的估值应明确分离'Core营运价值'和'AI期权价值'两部分, 分别给PE"

    screening_insights:
