      key_difference: "NVDA=AI软件生态平台(设计) vs TSM=AI硬件制造平台(生产) | TSM定价权受制于NVDA替代培育"

    - ticker: Samsung(非上市对标)
      similarity: "直接竞争者, 同为先进代工+封装"
      key_difference: "Samsung=IDM(自产自销冲突) vs TSM=纯代工(客户信任) | 良率差40pp(3nm) | Samsung追赶速度是TSM估值的最大变量"

  comparative:
