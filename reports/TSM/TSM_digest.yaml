        implication: "AI选股筛选应建立'广义AI收入占比'指标(直接+间接), 管理层披露往往低估实际暴露"
      - insight: "地缘折价结构性收窄(海外产能从10%→20%)是可量化的催化剂"
        implication: "面临地缘折价的高品质公司, '折价收窄路径'(本地化进度)是独立的买入信号维度"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "对垄断企业追问'绝对定价权还剩几年'"
      trigger: "客户投资替代供应商(不论金额大小)"
      origin: "NVIDIA投资Intel Foundry $5B — 金额小但意图大, TSM绝对定价权窗口可能只剩2-3年"
      generalization: "任何客户培育Plan B的行动都是定价权天花板的领先信号, 看动作不看金额"

    - habit: "低概率高影响风险用二元模型定价"
      trigger: "地缘/政治/监管等不可预测的'开关型'风险"
      origin: "台海风险线性折价(PE打8折)掩盖了13%概率下ADR→$50的真实分布"
      generalization: "二元风险的'期望损失'比'折价幅度'更能量化真实风险暴露"

    - habit: "区分广义vs狭义业务暴露度"
      trigger: "管理层给出狭义收入占比(如'AI占high-teens%')"
      origin: "TSM广义AI 61% vs 狭义high-teens% — 3x差距改变了AI周期下行的冲击估计"
      generalization: "管理层有动力低报某些暴露度(降低周期性感知) — 自建广义测量是必须的"

    - habit: "Phase 4对抗审查后系统性下调置信度"
      trigger: "Phase 1-3完成后、所有CQ看起来都很'确定'时"
      origin: "TSM 6个CQ在Phase 4后下调3-12pp — 确认偏误在AI受益者分析中尤为严重"
      generalization: "对抗审查不是形式——每次应至少让1/3的CQ置信度下降, 如果全部不变说明审查不够严格"

  quality_feedback:
    strengths:
      - "D3护城河86/100 — 五维量化8.98/10, 封装vs制程持久性差异化发现"
      - "D2增长质量82/100 — AI结构性70-75%/周期性25-30%的精确拆分"
      - "D5管理层88/100 — 刘德音战略评估+纯代工承诺分析"
      - "8个CQ全闭环, 平均置信度73.9%, Phase 4下调反映了审慎"
    weaknesses:
      - "DM密度0.28/千字(远低于0.8门控) — DM锚点标注严重不足, 需backfill"
      - "D1估值吸引力52/100 — 在$355入场安全边际不足, 'buy right'纪律得分低"
      - "D10时机因素38/100 — 52周新高+RSI 65.8+EV/Sales历史新高=时机不利"
      - "D7风险可控性48/100 — 台海地缘风险不可对冲, 只能通过仓位管理"

  hypothesis_tested:
    confirmed:
      - hypothesis: "品质最高≠入场时机最佳 (CME垄断三角)"
        evidence: "TSM护城河8.98/10但估值吸引力52/100, 综合评级'中性关注'而非'推荐'"
        confidence_after: "高(两份报告独立确认: CME CQI 93=中性关注, TSM 8.98=中性关注)"

      - hypothesis: "Reverse DCF必须P1前置 (CRM v2.0铁律O)"
        evidence: "Reverse DCF隐含CAGR 19.3%与共识匹配 → 有效防止了'TSM被低估'的确认偏误"
        confidence_after: "高(连续执行确认)"

    extended:
      - hypothesis: "护城河有多重半衰期 (CME双半衰期)"
        extension: "TSM的多重半衰期: 封装>5年 / 制程2-4年 / 定价权2-3年(绝对)→5年(相对) — 从'双'进一步细化为'按维度差异化'"

    refuted:
      - hypothesis: "地缘风险被市场过度定价 (Phase 1-3初始判断)"
        evidence: "Phase 4修正: 概率加权EL -16.7% > 隐含折价10-15% → 实际是定价不足"
        lesson: "分析地缘风险时存在'理性化偏差' — 倾向于认为市场过度恐慌, 但二元模型显示市场可能还不够恐慌"

  limitations:
    - "DM密度0.28/千字严重不足(框架要求≥0.8) → 数据锚定可追溯性差, 需在v3.0中backfill"
    - "Phase 4无独立红队标注(RT-编号缺失) → 对抗审查结构化程度不如CME v3.0"
    - "台海地缘概率依赖Polymarket(单一来源) → 如果Polymarket自身被操纵, 概率锚失效"
    - "广义AI收入61%的测量依赖主观分类(哪些间接受益算AI?) → 可能高估或低估实际暴露"
    - "DCF概率加权$652因地缘调整方法差异导致范围极宽($465-$1,315) → 权重仅10%合理但说明估值确定性有限"
