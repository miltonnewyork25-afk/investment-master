# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "NOW是SaaS行业品质最高的公司之一(NRR 125%/GRR 98%/SBC收敛至14.7%), 但$110已price-in合理预期——综合中枢$95意味着高估14%, 等价格回到品质匹配区间"
  rating: "中性关注"
  fair_value: "$95 (偏差校正中枢)"
  expected_return: "-14% (当前$110 vs 综合$95)"

  key_arguments:
    - claim: "NRR 125%是估值的第一性原理——敏感度是ITSM份额的4.7倍"
      direction: bullish
      magnitude: 5
      mechanism: "存量客户年增25%→不依赖新客的确定性增长引擎→F500平均4.2模块(理论上限12+)→扩展空间仍有3x"
      kill_switch: "NRR连续2季度<120%(CRM前车之鉴: NRR从120%→110%→估值腰斩)"

    - claim: "SBC收敛14.7%接近offset 100%临界点——可能触发从投机定价到价值定价的范式转换"
      direction: bullish
      magnitude: 4
      mechanism: "SBC/Rev 4年从19%→14.7%→offset 94%→FY2026-2027突破100%→每股盈利从被稀释变为真实增长→PE结构性重估(参照ADBE 2018-2019)"
      kill_switch: "AI人才竞争加剧→SBC在13-14%触底反弹 | Armis团队整合需额外股权激励"

    - claim: "Reverse DCF显示$110隐含18-20% CAGR=管理层指引→市场定价基本合理, 非显著低估"
      direction: bearish
      magnitude: 4
      mechanism: "FCF yield 3.75%<10年国债4.3%→投资者赌FCF持续高速增长→市场已完全相信20%增长叙事→无估值折扣可赚"
      kill_switch: "Now Assist ACV突破$1B→证明市场未定价的AI增量→估值锚上移"

    - claim: "Armis $7.75B是历史风格转变——首次大型M&A整合风险不可忽视"
      direction: bearish
      magnitude: 3
      mechanism: "前最大收购的15x+金额跃迁→OT安全与IT workflow架构差异大→SaaS大型M&A历史成功率仅40%→失败=goodwill减值+EPS受损"
      kill_switch: "Armis整合后ARR增速维持>30%+OT产品GA发布→整合成功确认"

    - claim: "AI Agent蚕食per-seat模式是系统性SaaS风险, 但NOW的数据壁垒提供转型时间窗口"
      direction: conditional
      magnitude: 3
      mechanism: "AI替代L1工单→seat需求减少→但ITSM 10年工单数据+CMDB是AI Agent不可替代燃料→蚕食和增强同时发生→Now Assist per-interaction定价对冲seat流失"
      kill_switch: "AI自动处理率>70%且Pro Plus溢价<40%→飞轮净强度<0→蚕食>增强"

  moat:
    composite_score: 5.7  # CQI 58/100, 护城河20/35
    half_life: "ITSM核心>10年 | AI数据飞轮待验证(3-5年) | per-seat定价模式<5年"
    dimensions:
      - type: switching_cost
        strength: 5
        evidence: "迁移成本=ACV的3-5倍, F500平均300+自定义workflow, 迁移耗时18-24个月/$5-15M"
        vulnerability: "AI Agent+新平台提供低成本迁移工具(中期5年+风险)"
      - type: data
        strength: 4
        evidence: "CMDB+10年工单历史+跨7个product family的结构化数据→每年40-70亿训练信号→竞品无法获取同等企业数据"
        vulnerability: "通用LLM(GPT-5)准确率接近NOW领域模型(当前差距85-90% vs 70-75%, 在缩小)"
      - type: scale
        strength: 4
        evidence: "ITSM市占率~80%, 第二名BMC<10%, F500渗透85%→垄断级份额"
        vulnerability: "Microsoft Copilot从Office生态自然延伸至IT管理(5年+时间窗口)"
      - type: pricing_power
        strength: 4
        evidence: "Pro Plus 60%溢价+Now Assist $600/seat/年叠加→ROI 80倍→价格谈判几乎无障碍"
        vulnerability: "AI Agent替代seat后定价模式需从per-seat转向per-interaction"
      - type: network_effect
        strength: 1.5
        evidence: "几乎不存在直接网络效应, 数据飞轮(更多客户→更多工单数据→AI更准)是间接效应"
        vulnerability: "飞轮速度慢、边际效应递减, 不是核心护城河驱动力"

