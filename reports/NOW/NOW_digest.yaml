    position_sizing: "当前$110不建仓(高估14%) | $90-95半仓(PEG 1.1-1.2x) | $80以下满仓(Bear Case底线区间)"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "NRR是估值第一性原理的完整证据链"
    chain: >
      NRR 125%→存量客户每年自然增长25%(不依赖新客)
      → 在$13B收入规模下, 存量基数是增量的数倍→存量引擎变化>>增量变化
      → NRR每降5pp→公允价值降14%, 而ITSM份额每降5pp→仅降3%(敏感度4.7倍)
      → CRM实证: NRR从120%→110%→有机增速25%→11%→PE 40x→25x→市值蒸发$100B+
      → NRR不只是指标, 是自我强化飞轮: NRR高→估值高→股票收购→产品扩展→NRR更高(正反馈)
      → NRR低→估值低→无法收购→扩展放缓→NRR更低(负反馈)
    transferable_to: "所有依赖Land&Expand模式的SaaS公司(CRM/DDOG/WDAY/SNOW)"
    reasoning_habit: "看到SaaS公司时, 先找NRR而非PE — NRR决定增长引擎的可持续性, PE只是结果"

  - id: "CC-2"
    name: "SBC offset 100%是SaaS从增长期到复利期的分水岭"
    chain: >
      SBC本质是股东稀释成本→回购用来对冲稀释→offset率=回购/SBC
      → offset<100%: 企业赚的钱通过新股给了员工=持续稀释→估值依赖"未来收敛"预期=投机性定价
      → offset≥100%: 企业开始回收稀释→每股盈利真实增长→估值基于当期真实盈利=价值性定价
      → NOW FY2025 offset 94%→FY2026-2027可能触达100%→范式转换
      → 参照: Adobe 2018-2019 offset>100%后PE从25x→35x
    transferable_to: "所有SBC/Rev>10%且有收敛趋势的SaaS公司(DDOG/CRWD/SNOW/WDAY)"
    reasoning_habit: "跟踪SaaS公司时计算offset率(回购/SBC) — 从<100%到>100%的跨越比SBC绝对水平更重要"

  - id: "CC-3"
    name: "AI Agent蚕食per-seat但增强数据护城河的双面性分析"
    chain: >
      AI Agent替代L1工单→seat需求减少→per-seat收入受损(M1蚕食)
      → 但AI Agent需要CMDB数据才能运行→企业必须维护更完整CMDB→数据锁定加深(M2增强)
      → AI Agent交互日志回流NOW平台→训练数据飞轮启动→竞争者越难追赶
      → 净效应取决于: Now Assist per-interaction收入增速 vs seat流失速度
      → 当前证据: Now Assist +100% YoY vs seat流失尚未出现→转型在领先
      → BlackBerry类比适用性仅15%: BB的license在硬件层(设备被替代=归零), NOW的license在数据层(AI不替代CMDB, 反而增加依赖)
    transferable_to: "所有per-seat/per-user定价的SaaS面对AI Agent威胁时(CRM/WDAY/ZS)"
    reasoning_habit: "看到'AI替代XX'叙事时, 追问替代发生在哪一层 — 如果在数据层而非功能层, 被替代者可能反而受益"

  - id: "CC-4"
    name: "Reverse DCF前置如何防止结论先行偏差"
    chain: >
      先正向估值→容易锚定在自己的结论上→确认偏差
      → 先Reverse DCF→翻译"市场在赌什么"→市场隐含18-20% CAGR≈管理层指引
      → 硬约束: 不能说"NOW被严重低估"(因为市场已定价合理预期)
      → bullish论点必须建立在"市场未看到的增量"之上→更诚实的分析
      → NOW实例: 如果先做正向DCF得$105→可能写"10%低估"→但Reverse DCF显示$110=合理→避免了false bullish
    transferable_to: "所有Tier 3分析的Phase 1(铁律O)"
    reasoning_habit: "估值永远从Reverse DCF开始 — 先理解市场信念, 再判断自己是否比市场更对"

  - id: "CC-5"
    name: "飞轮悖论检测: Now Assist的加速器+刹车器双面性"
    chain: >
      正向飞轮: Now Assist成功→AI处理更多工单→客户ROI提升→更多模块购买→ACV增长
      → 反向飞轮: Now Assist成功→需要更少IT人员→seat数减少→ITSM收入下降
      → 当前净飞轮强度>0: Now Assist ACV增速(+100%)>> seat流失(尚未出现)
      → 但3-5年后: 如果AI自动处理率>70%且Pro Plus溢价<40%→净强度可能<0
      → 关键窗口: NOW必须在飞轮净强度转负前完成per-seat→per-interaction定价转型
    transferable_to: "所有声称AI是增长引擎但AI同时可能替代核心收费单元的SaaS公司(CRM Agentforce)"
    reasoning_habit: "看到'AI增强飞轮'叙事时, 立刻检查反向飞轮 — 新产品成功是否蚕食核心产品的收费基础"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "NOW PEG 1.31x=明显低估, 应该积极买入"
      final: "PEG低但Reverse DCF显示$110≈合理定价, 低PEG反映AI蚕食折价而非被忽视"
      pivot: "Reverse DCF隐含18-20%=管理层指引→市场没错, 只是为AI不确定性打了折扣"

    - initial: "AI Agent是NOW的生存威胁(类似BlackBerry→iPhone)"
      final: "BlackBerry类比适用性仅15%——NOW的license在数据层而非硬件层, AI Agent反而增加CMDB依赖"
      pivot: "替代层级分析: BB硬件层(设备被替代=归零) vs NOW数据层(AI需要CMDB=锁定加深)"

    - initial: "SBC 14.7%仍是重大问题, 压制GAAP利润"
      final: "SBC收敛方向比绝对水平更重要, offset 94%→100%的跨越将触发定价范式转换"
      pivot: "SBC offset率的非线性临界点发现(Adobe先例: offset>100%→PE 25x→35x)"

  surprises:
    - finding: "NRR敏感度是ITSM份额的4.7倍——失去NRR比失去80%市占率更致命"
      implication: "SaaS估值的核心驱动力是存量扩展能力而非市场份额, 监控NRR优先于监控竞争格局"

    - finding: "SBC offset 100%是SaaS行业从增长期到复利期的分水岭, NOW在FY2026-2027可能触达"
      implication: "这个临界点尚未被市场充分定价——连续2季度offset>100%可能触发PE结构性重估"

    - finding: "CEO McDermott $20M公开市场买入@$105是SaaS行业3年最大CEO主动买入"
      implication: "提供估值软底线$100-105, 但需20% discount(promoter型CEO, SAP时期买入后股价持平)"

    - finding: "飞轮悖论: Now Assist成功=加速器同时是刹车器(AI溢价vs seat流失)"
      implication: "净飞轮当前>0但3-5年后可能收窄, per-seat→per-interaction转型速度是关键变量"

    - finding: "GM从79.2%降至77.5%(-1.7pp)可能是AI推理成本的早期信号"
      implication: "如果AI推理成本不随规模摊薄, GM可能继续承压至75-76%→利润改善叙事受挑战"

  blind_spots:
    - area: "Now Assist真实客户留存数据(attach rate仅15%)"
      why_matters: "决定AI溢价是'demo cool'还是'revenue real'→支撑或瓦解估值倍数"
      monitor: "FY2026 Q1-Q2 Now Assist ACV增速+attach rate变化"

    - area: "Armis整合效果(首次大型M&A)"
      why_matters: "整合失败→goodwill减值+管理层精力分散→估值下调10-15%"
      monitor: "FY2026 Q3 OT安全产品GA发布+Armis ARR增速"

    - area: "AI Agent替代seat的实际速度"
      why_matters: "决定per-seat→per-interaction转型窗口是否充足(3年vs18个月)"
      monitor: "客户案例中NOW部署后seat数量变化+AI自动处理率"

  sell_lessons:
    - scenario: "SaaS公司NRR从120%+降至<110%时不卖(CRM前车之鉴)"
      lesson: "NRR是SaaS估值第一性原理——NRR下降5pp=公允价值降14%, 而份额下降5pp仅降3%。NRR恶化信号出现时应立即减仓, 不要等PE压缩"
      transferable: "所有Land&Expand模式SaaS(CRM/DDOG/WDAY/SNOW/ZS)"
    - scenario: "品质最高但估值最贵的SaaS不在回调时减仓(持有到估值过度)"
      lesson: "PEG是最公平的SaaS估值比较尺度——PE低不等于便宜(CRM PE 19x但PEG 2.11x), 增速调整后才能看到真实估值水平"
      transferable: "所有增速差异大的SaaS板块内部比较"
    - scenario: "大型M&A公告后不减仓(SaaS大型M&A历史成功率仅40%)"
      lesson: "首次大型M&A是风格转变本身就是风险信号——不需要等整合失败, 风格转变本身值得5-10%的risk discount"
      transferable: "所有历史以tuck-in为主突然转向大型M&A的公司"

# --- Layer 2.5: 信号分级 ---
signal_hierarchy:
  alpha_signals:
    - signal: "NRR间接推算值(每季度)"
      why_alpha: "NOW不再披露精确NRR→用间接法(订阅增速-新客ACV/前年收入)推算→连续2季<120%比任何AI新闻都更值得警惕"
      current_reading: "~125%(FY2025, 健康)"
    - signal: "SBC offset率(回购/SBC, 每季度)"
      why_alpha: "offset从<100%→>100%是非线性临界点, 市场尚未对此定价→Adobe先例显示PE可扩张40%"
      current_reading: "94%(FY2025, 接近临界点)"
    - signal: "Now Assist attach rate(每季度)"
      why_alpha: "当前15%→30%+的路径决定AI溢价是否持久→大多数分析师只看ACV绝对值不看attach rate"
      current_reading: "~15%(FY2025, 早期)"

  confirmation_signals:
    - signal: "收入增速YoY"
      bullish_threshold: ">20%(维持高增速叙事)"
      bearish_threshold: "<17%连续2季(增速失速确认)"
    - signal: "SBC/Revenue"
      bullish_threshold: "<13%(收敛加速, 接近offset 100%)"
      bearish_threshold: ">16%(收敛逆转, AI人才竞争)"
    - signal: "GRR(续约率)"
      bullish_threshold: "维持>97%(客户锁定)"
      bearish_threshold: "<94%(迁移成本护城河被突破)"

  noise_signals:
    - signal: "ITSM市占率季度波动"
      why_noise: "80%垄断份额在1-2年内不会有意义变化, BMC/JSM的份额变化是个位数级别"
    - signal: "Sell-side目标价调整"
      why_noise: "大多数分析师用Non-GAAP估值不考虑SBC→系统性高估NOW的盈利→自己做Owner FCF更准"
    - signal: "单季度GM波动"
      why_noise: "季度GM受云基础设施扩张节奏影响→看年度趋势而非单季度"

