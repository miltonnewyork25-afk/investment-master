        reasoning: "AI变现从demo cool→revenue real→支撑倍数维持或扩张→估值锚上移"
      - trigger: "SBC offset连续2季度>100%"
        price_zone: "当前价格或更高均可"
        reasoning: "从投机定价→价值定价的范式转换→PE结构性重估(ADBE先例: 25x→35x)"
    hold_conditions:
      - "NRR维持>120%(存量引擎健康)"
      - "SBC/Rev继续收敛(年降>50bp)"
      - "GRR维持>96%(客户不流失)"
      - "Armis整合里程碑按时完成(FY2026 Q3 OT产品GA)"
