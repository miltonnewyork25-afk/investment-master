      bearish_threshold: "AI产品增长停滞或蚕食传统产品"
      why_matters: "这直接回答'NOW是AI受益者还是受害者'的核心问题"
      next_data_point: "Q1-Q2'26 earnings calls"

    - signal: "内部人买入动向"
      current_reading: "过去8个季度零买入(totalPurchases=0)"
      bullish_threshold: "CEO/CFO开放市场买入>$500K"
      bearish_threshold: "持续零买入+管理层加速卖出"
      why_matters: "内部人行为是管理层对公司价值最诚实的表达。在-51%的位置上仍然零买入=管理层不认为被严重低估"
      next_data_point: "SEC Form 4 持续监控"

    - signal: "SaaS板块整体估值重估"
      current_reading: "SaaS板块处于熊市，整体de-rating"
      bullish_threshold: "板块止跌+资金回流"
      bearish_threshold: "板块继续创新低"
      why_matters: "NOW的下跌50%有~40%来自板块re-rating而非公司特定因素。板块回暖是NOW重估的必要(非充分)条件"
      next_data_point: "IGV ETF / BVP Cloud Index 持续监控"

  confirming_indicators:
    - signal: "FY2026全年收入指引"
      expected_if_thesis_correct: "上调或维持$15.5B+ → 管理层对增长有信心"
      expected_if_thesis_wrong: "下调至<$15B → 增速正在减速"

    - signal: "FCF margin FY2026"
      expected_if_thesis_correct: "维持>33% → 利润率扩张趋势持续"
      expected_if_thesis_wrong: "<30% → 开始出现margin压缩"

    - signal: "大型企业客户的AI采购行为"
      expected_if_thesis_correct: "企业增加NOW支出(AI需要更多工作流编排) → 价格vs量都增长"
      expected_if_thesis_wrong: "企业减少NOW seat数(AI替代人工=更少seat需求) → 量下降"

  falsification:
    - condition: "连续2Q订阅收入增速<15%且cRPO增速<14%"
      implication: "增速放缓是结构性而非季节性的，AI确实在压缩SaaS需求。预期差判断被证伪"
      time_window: "2026 Q1-Q2(未来6个月)"

    - condition: "FCF margin连续2Q收缩>200bps且GAAP OPM下降"
      implication: "AI竞争正在压缩定价权/利润率——市场的恐惧正在变成现实"
      time_window: "2026 Q1-Q3(未来9个月)"

    - condition: "管理层大幅下调FY2026收入指引(>5%)"
      implication: "内部人看到了市场看到的问题，指引下调=认输信号"
      time_window: "下一次财报(Q1'26)"

    - condition: "主要竞争对手(Microsoft/Salesforce)推出直接替代NOW工作流的AI原生产品，且获得显著企业客户牵引"
      implication: "NOW的护城河(工作流平台锁定)正在被AI原生竞品绕过——结构性风险从'可能'变成'正在发生'"
      time_window: "12个月"

  monitoring_horizon: "2-3个季度(6-9个月)"
  next_reassessment_trigger: "Q1'26财报发布(预计2026年4月)——这是最重要的单一验证事件"

