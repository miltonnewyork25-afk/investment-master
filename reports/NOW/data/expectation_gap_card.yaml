      next_data_point: "Q1'26财报(预计2026年4月)"

    - signal: "cRPO(current Remaining Performance Obligation)增速"
      current_reading: "Q4'25 cRPO增速~22%(推测，基于FY2026指引)"
      bullish_threshold: ">20% (订单管线健康)"
      bearish_threshold: "<15% (订单管线减速=收入前瞻恶化)"
