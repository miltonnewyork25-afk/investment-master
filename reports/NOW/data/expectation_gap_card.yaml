confidence: "medium"
confidence_reasoning: "收入增速20%+稳定+FCF加速是事实(高置信)；但AI对SaaS定价模型的长期影响是真实的结构性不确定性(降低置信)；零内部人买入也削弱了'管理层认为被低估'的信号"

