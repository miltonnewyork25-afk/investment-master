  bull_case_core: "NOW是AI agents需要的编排层(orchestration layer)——工作流、审计、跨系统集成只会更复杂，不会消失"
  bear_case_core: "AI agents可能直接绕过工作流软件——为什么还要为seat license付费？更少的知识工人=更少的seat=结构性收入压力"
  market_most_confident_about: "SaaS行业整体面临AI定价压力(行业级重估)"
  market_most_uncertain_about: "NOW到底是AI的受害者还是受益者——这个问题的答案决定估值差异可能>100%"
  narrative_vs_price_consistency: "一致——悲观叙事+低估值。但26/30分析师仍给Buy评级=共识行为与价格信号矛盾(分析师没有下调目标价到这么低)"

# === R域: 企业现实 ===
reality:
  overall_trend: "stable"
  trend_confidence: "high"
  structural_vs_cyclical: "mixed — 收入增长是结构性的(企业数字化+AI需求)，但估值压缩是行业周期性的(SaaS板块整体de-rating)"

  key_variables:
    - name: "收入增速"
      state: "stable"
      data: "FY22 +23.8% → FY23 +23.8% → FY24 +22.4% → FY25 +20.9% | Q1'25 +18.6% → Q2 +22.4% → Q3 +21.8% → Q4 +20.7%"
      source: "10-K/FMP income statements"
      evidence_grade: "fact"

    - name: "FCF增速与FCF margin"
      state: "accelerating"
      data: "FCF: FY22 $2.17B → FY23 $2.70B(+24%) → FY24 $3.42B(+27%) → FY25 $4.58B(+34%) | FCF margin: 30.0% → 30.1% → 31.1% → 34.5%"
      source: "10-K/FMP cash flow statements"
      evidence_grade: "fact"

    - name: "GAAP OPM"
      state: "accelerating"
      data: "FY22 4.9% → FY23 8.5% → FY24 12.4% → FY25 13.7%"
      source: "10-K"
      evidence_grade: "fact"

    - name: "SBC负担"
      state: "stable"
      data: "SBC/Rev: FY22 19.3% → FY23 17.9% → FY24 15.9% → FY25 14.7% (持续下降)。但Owner PE为负(NI $1.75B - SBC $1.96B = -$207M)。公司回购$1.84B覆盖SBC 94%"
      source: "10-K cash flow / income"
      evidence_grade: "fact"

    - name: "ROIC"
      state: "stable"
      data: "ROIC TTM 27.2% — 对SaaS公司而言非常强，说明资本效率高"
      source: "FMP key-metrics"
      evidence_grade: "fact"

  quality_signals:
    revenue_driver: "主要是量驱动(新客户+产品扩展)，辅以定价——FY2026指引$15.5B+订阅收入"
    customer_concentration_risk: "low — 大型企业客户基础广泛(Fortune 500覆盖率高)"
    cash_flow_match: "OCF/NI = 3.11x (非常健康——SBC是最大非现金调整项，不影响现金)"
    sbc_burden: "SBC/Rev 14.7%下降中，但SBC绝对额$1.96B>NI $1.75B → Owner PE为负。回购$1.84B覆盖94%缓解稀释"
    organic_vs_acquired: "以有机增长为主，FY2025收购$1.08B(Armis等)，占FCF 24%，规模可控"

  most_telling_facts:
    - fact: "FCF FY2025 $4.58B，同比+34%，FCF margin从31.1%扩张到34.5%"
      why_telling: "如果AI真的在压缩SaaS价值，最先反映的应该是FCF减速或margin收缩——但事实恰恰相反，两者都在加速。市场的'AI颠覆'叙事尚未在财务数据中得到任何验证"
    - fact: "FY2026指引订阅收入$15.5B+，隐含~17%增速——管理层对增长持续性有信心"
      why_telling: "管理层愿意给出强指引说明近期管线能见度高。但零内部人买入与强指引形成微妙矛盾"

# === G域: 剪刀差 ===
gap:
  variable_comparison:
    - factor: "FCF增速"
      expectation: "市场隐含~10% CAGR (反推自当前EV/FCF 23.7x)"
      reality: "实际FCF增速34%(FY25)，共识收入CAGR 18%+margin稳定/扩张→FCF CAGR应≥15%"
      gap_direction: "E<R"
      gap_size: "large"

    - factor: "利润率方向"
      expectation: "市场隐含margin压缩(AI竞争→定价权下降)"
      reality: "GAAP OPM加速扩张(4.9%→13.7%), FCF margin扩张(30%→34.5%), SBC/Rev持续下降"
      gap_direction: "E<R"
      gap_size: "medium"

    - factor: "增长持续性"
      expectation: "市场隐含增长快速减速(AI替代seat→收入结构性下降)"
      reality: "收入增速稳定在20%+，管理层指引FY26 $15.5B+(~17%增速)"
      gap_direction: "E<R"
      gap_size: "medium"

    - factor: "竞争护城河持续性"
      expectation: "市场认为AI可能侵蚀NOW的工作流平台价值"
      reality: "尚无证据。NOW正在将自己定位为AI Control Tower/编排层"
      gap_direction: "uncertain"
      gap_size: "unknown — 这是真正的未知项，可能需要2-3年验证"

  scoring:
    direction_clarity: 4       # 财务数据方向非常清晰——FCF加速、margin扩张、增速稳定
    magnitude: 4               # P/FCF 24x对20%+增长者historically极便宜
    persistence: 3             # 需要持续2-3Q确认增速不减速
    verifiability: 4           # 下季财报(Q1'26)即可初步验证
    composite_score: 3.75      # ≥3.5 = 值得深挖

  core_mispriced_variables:
    - variable: "FCF增速与FCF margin方向"
      market_assumes: "AI竞争将压缩SaaS利润率，FCF增速将放缓至10%"
      reality_shows: "FCF增速34%且margin在扩张(30%→34.5%)，没有任何财务指标显示压缩正在发生"
      why_market_wrong: "市场把'AI可能在未来颠覆SaaS'当作'AI正在颠覆SaaS'来定价。恐惧在价格中，但恐惧的证据不在财务中"
      evidence_grade: "fact (财务数据) + inference (市场定价逻辑)"
      valuation_sensitivity: "如果FCF CAGR是15%而非市场隐含的10%，5年后FCF ~$9.2B vs $7.4B，差异25%+终端倍数可能重估"

    - variable: "NOW在AI时代的定位"
      market_assumes: "SaaS per-seat模型将被AI agents淘汰"
      reality_shows: "NOW正在将自己重新定位为AI编排层(AI Control Tower)，收购Armis/Veza加强安全/权限。AI agents越多，跨系统工作流编排可能越重要"
      why_market_wrong: "KeyBanc的'结构性AI颠覆'论点是有道理的，但把所有SaaS一刀切地de-rating忽视了'谁编排AI agents'这个问题——NOW是最强候选"
      evidence_grade: "inference — AI编排层的价值尚未被收入验证"
      valuation_sensitivity: "如果NOW成功转型为AI编排平台，估值可能从P/FCF 24x重估至35-40x(历史中位数)"

    - variable: "内部人行为与市场底部信号"
      market_assumes: "管理层不认为股价便宜(零买入)"
      reality_shows: "零内部人买入(过去8个季度purchases=0)。公司层面回购$1.84B(FY25)，但主要用于抵消SBC而非增厚每股价值"
      why_market_wrong: "这一点市场可能没错——内部人不买是真实的谨慎信号"
      evidence_grade: "fact"
      valuation_sensitivity: "如果内部人开始买入，将成为强确认信号"

  one_sentence_judgment: "市场以P/FCF 24x定价一个FCF增速34%、margin扩张中、收入增速20%+的公司——隐含的AI颠覆恐惧在财务数据中找不到任何支撑，属于'叙事领先于现实'的过度悲观，但AI的长期定价影响是真实的未知项，需要持续监控"

