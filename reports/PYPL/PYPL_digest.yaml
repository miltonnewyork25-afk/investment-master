# 投资研究摘要卡 v1.2 — PayPal Holdings
# 压缩比: 175K → ~11K (16x)
# 设计原理: TurboQuant两阶段压缩
#   Layer 1 = PolarQuant (主信号: 方向×强度)
#     └─ 新增: action_framework (买/卖/持有决策框架)
#   Layer 1.5 = 因果链保真 (推理过程, 非结论)
#   Layer 2 = QJL (残差: 反直觉修正)
#     └─ 新增: sell_lessons (卖出时机教训)
#   Layer 2.5 = 信号分级 (alpha/确认/噪音)
#   Layer 3 = 内积保真 (跨公司关系)
#   Layer 4 = 基向量 (已知模式 + 新模式)
#     └─ 新增: framework_contributions (护城河/估值/选股框架升级)
#   Layer 5 = Meta-learning (这份报告教了AI什么)
# ============================================================

