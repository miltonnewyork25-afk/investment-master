# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "AI CapEx的两面性——广告AI已验证vs通用AI是赌注"
    chain: >
      Advantage+覆盖400万广告主(30%广告收入)
      → ROAS +22%/CPA -17% → 广告主深度依赖AI黑盒 → 转换成本上升
      → 但$125B CapEx中仅$35-40B直接服务广告AI
      → 剩余$40-50B流向通用AI(5-10年回报周期) + Avocado团队<6个月
      → 广告AI ROI被通用AI投入稀释
      → 投资者为整体CapEx买单但仅60-70%有明确回报路径
      → 关键验证: FY2026 ARPP增速≥12%证明广告AI持续创造增量
    transferable_to: "所有大额CapEx投入中混合短期ROI可验证项目和长期战略赌注的公司(如GOOGL Waymo/AWS AI基建)"
    reasoning_habit: "追问CapEx中有多少比例有明确的短期ROI路径 — 混合CapEx公司需要拆分评估而非统一PE"

  - id: "CC-2"
    name: "FCF断崖如何从'暂时性'恶化为'结构性'"
    chain: >
      FY2025 FCF $43.6B(-16.3%) → FY2026E FCF ~$6B(-86%)
      → 如果ARPP增速放缓至<10%(S型曲线效应)
      → CFO增速从+27%降至+8-10% → 但CapEx已签约锁定($27B Blue Owl + $14.2B CoreWeave)
      → CapEx不可逆 + CFO放缓 = FCF持续为负
      → 回购从$26B→$10-20B → SBC $18B抵消回购 → 净稀释转正
      → 量化基金FCF因子触发自动卖出 → 估值双杀(EPS下+PE压缩)
    transferable_to: "所有处于重资本投入周期的科技公司(AMZN AWS扩张期/GOOGL数据中心建设期)"
    reasoning_habit: "看到FCF断崖时追问'CapEx有多少已锁定不可逆' — 签约义务将暂时性FCF下降变为结构性"

  - id: "CC-3"
    name: "RL累计亏损$84B的期权思维vs沉没成本"
    chain: >
      RL累计亏损$83.6B → FY2026E再亏$19B → 年底$102.6B
      → 沉没成本谬误: 过去的$84B不应影响未来决策
      → 正确框架: RL关停期权价值 = 关停后EPS增量+$5.89(约$150/股) - 已投入但可回收的资产
      → 关停SOTP: $71.4B(概率25%) vs 2029扭亏$28.5B(50%) vs Metaverse成功$487.5B(25%)
      → 概率加权RL值$107B → 隐含市场定价仅$40B(占市值2.4%)
      → 投资含义: RL是免费期权(市场已几乎完全折价) → 真正风险不在RL而在CapEx
    transferable_to: "所有拥有大额亏损但有关停期权的业务线(如AMZN Alexa/GOOGL Other Bets)"
    reasoning_habit: "面对累计巨亏业务线时用期权框架(关停价值vs持续价值)而非情绪判断 — 市场可能已完全折价=免费期权"

  - id: "CC-4"
    name: "分析师0 Sell作为逆向指标的概率机制"
    chain: >
      62 Buy / 5 Hold / 0 Sell → 95%看多
      → 历史研究: 0 Sell时未来12个月跑输大盘概率55-60%
      → 机制: 所有正面因素已被充分定价 → 增量信息只能是负面 → 非对称下行
      → 目标价$700-$1,144(离散度63.4%)反映AI ROI的巨大分歧
      → 共识$859隐含P/E ~34x → 远超我们$675-711(P/E ~27-28x)
      → 卖方推荐偏差 + 极端共识 = 应作为估值上限约束而非锚点
    transferable_to: "所有分析师覆盖>30人且0 Sell的大盘股"
    reasoning_habit: "看到极端看多共识(0 Sell)时立刻启动逆向思维 — 问'如果共识是错的, 错在哪'"

  - id: "CC-5"
    name: "Zuckerberg双层股权的非线性风险"
    chain: >
      61%投票权 + 无日落条款 → 外部股东无制衡
      → 牛市时被解读为"远见领导力溢价"(2023效率年纠偏)
      → 熊市时被解读为"独裁治理折价"(2021-2022元宇宙豪赌-77%)
      → 治理风险是凸性的: 正面有限(5-8%溢价) vs 负面巨大(15-20%折价)
      → FY2025 insider selling $2B/年 + 92%外部股东反对 → 信号矛盾
      → 投资含义: 治理折价应按最差情景计算而非平均值
    transferable_to: "所有创始人控制型公司(GOOGL/SNAP/Zillow)"
    reasoning_habit: "创始人控制型公司的治理风险评估用凸性而非线性 — 正面天花板低但负面无底线"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "Phase 1-3估值: +18%上行空间, META被温和低估"
      final: "Phase 4校准后: 仅+2~8%上行空间, 接近公允定价"
      pivot: "行为金融校准(-5%锚定效应) + 反证概率加权(-$64/股) + 诉讼准备金上调(-$2/股) 共压缩$105/股"

    - initial: "AI CapEx全部是价值创造投入"
      final: "仅60-70%有明确ROI路径, 30-40%是回报不确定的战略赌注"
      pivot: "Phase 4 CapEx拆解: $35-40B直接广告AI vs $40-50B通用AI/Superintelligence, 回报周期相差3-5倍"

    - initial: "Reality Labs $84B亏损是重大负面"
      final: "RL是免费期权——市场已折价至仅$40B(市值2.4%), 关停期权价值+$5.89 EPS"
      pivot: "SOTP三情景概率加权: RL值$107B但市场仅定价$40B → 风险不在RL而在主业CapEx"

  surprises:
    - finding: "Instagram互动率从2.94%暴跌至0.61%(-79% YoY) — 降幅远超预期"
      implication: "即使DAP仍在增长(+7%), 用户参与质量正在恶化 → 广告单位价值的可持续性存疑"

    - finding: "AI广告(Advantage+)年化$60B但可能含大量旧收入重归因而非真增量"
      implication: "ROAS +22%的边际效应可能从0-30%渗透率(+22%)到30-60%(+5-8%)急剧递减(S型曲线)"

    - finding: "SOTP $747 vs DCF $482偏差36.3% — META估值方法间矛盾是所有Mag7中最大的"
      implication: "偏差来源: RL在SOTP中贡献$107B期权价值但在DCF中表现为持续现金流出 → 估值框架选择本身就是投资观点"

    - finding: "市场隐含AI溢价$100/股 vs 分析估算仅$36/股 — 差额$64/股"
      implication: "市场对META的AI变现预期远超基本面支撑 → 若AI叙事受挫(Avocado失败), $64/股溢价蒸发风险"

  blind_spots:
    - area: "Advantage+$60B中真实增量vs重归因的比例"
      why_matters: "如果50%是重归因 → 实际AI广告增量仅$30B → CapEx ROI降低一半"
      monitor: "第三方ROAS审计(Measured/Northbeam); Advantage+关闭后A/B测试广告效果差异"

    - area: "Avocado实际性能和发布时间"
      why_matters: "决定META是'AI平台公司'还是'AI应用公司' → 估值框架完全不同"
      monitor: "LMSYS Chatbot Arena排名; HuggingFace下载量; 企业采用率调查(a16z/Retool)"

    - area: "IG互动率暴跌是算法切换还是真实参与下降"
      why_matters: "算法优先Saves/Shares → 互动率指标变化不代表真实参与下降; 但若是真实下降 → 广告价值基础动摇"
      monitor: "IG日均使用时长(vs TikTok); 广告CPM季度趋势; 18-24岁MAU同比变化"

    - area: "FY2026实际CapEx执行节奏($115B vs $135B差距$20B)"
      why_matters: "$20B差距=FCF从$15B(正)到-$5B(负)的分水岭"
      monitor: "季度CapEx实际支出 vs 线性化指引; 数据中心建设进度(Blue Owl/Hyperion/CoreWeave)"

  sell_lessons:
    - scenario: "FoA利润率从53.7%拐头向下至51.6%时不重新评估 → 趋势延续至38-42%(FY2026E)"
      lesson: "利润率拐点是周期信号——第一次下降是预警, 第二次下降是确认。对于CapEx扩张期公司, 利润率拐头=重新计算FCF的信号"
      transferable: "所有处于CapEx扩张周期且利润率拐头的科技公司"
    - scenario: "分析师共识0 Sell + P/E接近5年均值 = 拥挤多头, 增量只能是负面"
      lesson: "极端看多共识时不该追高——安全边际为零意味着任何负面催化剂都直接冲击持仓"
      transferable: "所有分析师覆盖>30人且0 Sell的大盘蓝筹"
    - scenario: "CapEx不可逆性(数据中心签约)在衰退来临时变成经营杠杆陷阱"
      lesson: "评估CapEx时必须区分'可取消'和'已锁定'——已锁定的CapEx在衰退中是双杀因子(收入降+成本刚性)"
      transferable: "所有签有长期基建合同的公司(云基础设施/半导体/电信)"

