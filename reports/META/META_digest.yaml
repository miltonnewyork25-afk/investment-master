# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "市场隐含AI溢价$100/股 vs 分析估算$36/股 → 市场对AI变现的信念远超基本面支撑"

    - pattern_id: "scenario_analysis.probability_weighted_sotp"
      application: "RL三情景概率加权(关停25%/扭亏50%/成功25%) → $107B → 市场仅定价$40B = 免费期权"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "Phase 4行为金融校准: 锚定效应-5% + 确认偏误(DCF被淡化) + 情绪评分6.4 → 从$780压缩至$675"

    - pattern_id: "competitive_benchmarking.tiktok_threat"
      application: "TikTok日均81min vs IG 55min → 时长差距+47%但META DAP仍增长+7% → '赢了用户数但输了时间份额'"

  novel_patterns:
    - name: "印钞机→烧钱机切换期的估值框架"
      description: "高利润率公司进入大规模CapEx投入期时, FCF断崖但CFO仍强 → 应区分'造现金能力(CFO)'和'可分配现金(FCF)' → 用CFO估值验证长期价值, 用FCF估值确定短期入场风险"
      transferable_to: ["GOOGL(AI CapEx扩张)", "AMZN(AWS扩张期)", "所有CFO强/FCF弱的CapEx周期公司"]

    - name: "AI CapEx拆分评估(直接ROI vs 战略赌注)"
      description: "总CapEx中需拆分有明确短期ROI的部分(广告AI)和回报不确定的战略赌注(通用AI) → 分别给PE → 加权得混合估值"
      transferable_to: ["GOOGL(搜索AI vs DeepMind)", "MSFT(Azure AI vs OpenAI投资)", "所有AI CapEx大户"]

    - name: "SOTP-DCF偏差作为信念分歧指标"
      description: "SOTP含期权价值(看涨假设)而DCF仅反映当期现金流(保守假设) → 偏差>30%说明公司内含高度不确定的期权性业务 → 偏差本身是投资观点的映射"
      transferable_to: ["所有含高不确定性业务线的多元化公司"]

    - name: "16个Kill Switch三级阈值体系"
      description: "L1(预警/加强监控) → L2(升级/减仓) → L3(执行/最小持仓) → 将模糊的风险管理转化为可执行的仓位调整规则"
      transferable_to: ["所有复杂多风险维度的大盘股分析"]

    - name: "分析师0 Sell逆向信号量化"
      description: "覆盖>50人且0 Sell → 历史上未来12个月跑输大盘概率55-60% → 极端共识本身是逆向指标 → 安全边际应从共识折价而非溢价"
      transferable_to: ["所有分析师覆盖>30人且极端看多的大盘股"]

  framework_contributions:
    moat_insights:
      - insight: "IG互动率-79%揭示了网络效应'用户数增长'和'用户参与质量'可以背离"
        implication: "护城河评估需区分'用户规模护城河'(MAU/DAP)和'用户深度护城河'(时长/互动率) — 前者可能掩盖后者的恶化"
      - insight: "AI广告工具(Advantage+)创造了新型转换成本——广告主对AI黑盒的依赖"
        implication: "AI时代的转换成本从'数据迁移'升级为'方法论重建' — 评估转换成本时需加入'AI依赖度'维度"

    valuation_insights:
      - insight: "SOTP-DCF偏差36.3%不是需要'解决'的问题, 而是投资观点的映射"
        implication: "对含高不确定性业务线的公司, 应同时呈现SOTP和DCF而非强制取一个 — 偏差本身是对投资者的有用信息"
      - insight: "Phase 4行为金融校准从+18%压缩至+2~8% — Phase 1-3系统性高估了上行空间"
        implication: "深度研究的Phase 4对抗审查应成为标准 — 未经对抗审查的估值系统性偏乐观"

    screening_insights:
      - insight: "CapEx/营收比率>50% + FCF断崖 = 'CapEx周期风险'信号"
        implication: "选股筛选应加入'CapEx/营收比率'上限过滤 — >40%时标记为'CapEx投入期, 等FCF回复再入场'"
      - insight: "分析师0 Sell + 目标价离散度>50% = 极端不确定性但被单边定价"
        implication: "选股时加入'共识矛盾指标' — 0 Sell但目标价极度分散 = 市场在赌而非在定价"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "对CapEx拆分评估——短期ROI可验证部分 vs 长期战略赌注部分"
      trigger: "CapEx/营收>30%且含AI/R&D等回报不确定的投入"
      origin: "META $125B CapEx中仅$35-40B(28-32%)直接服务广告AI有明确ROI → 整体CapEx ROI被稀释"
      generalization: "不拆分CapEx就无法判断ROI — 适用于所有混合短期/长期投入的大额资本支出"

    - habit: "看到0 Sell极端共识时启动逆向思维"
      trigger: "分析师覆盖>30人且卖出评级为0"
      origin: "META 62 Buy/0 Sell但Phase 4将上行从+18%压缩至+2~8% → 共识与深度分析差距达$148/股"
      generalization: "极端共识=所有正面已定价 → 增量只能是负面 → 安全边际从共识折价而非溢价"

    - habit: "用Phase 4对抗审查校准Phase 1-3的系统性乐观偏差"
      trigger: "Phase 1-3估值完成后、最终评级前"
      origin: "META Phase 1-3 +18%上行经Phase 4压缩至+2~8% → 证明未对抗审查的估值偏乐观12-16pp"
      generalization: "所有深度研究需要Phase 4级别的行为金融+红队校准 — 否则结论系统性偏多"

    - habit: "区分'造现金能力(CFO)'和'可分配现金(FCF)'"
      trigger: "CFO强劲(+27%)但FCF断崖(-16%)"
      origin: "META CFO $116B(史新高)但FCF $44B(-16%)→$6B(FY2026E) → 造现金能力无问题, 问题是CapEx吞噬"
      generalization: "对CapEx周期公司, CFO验证长期价值(业务本质), FCF确定短期风险(入场时机)"

  quality_feedback:
    strengths:
      - "10维度评分体系覆盖全面——从6维度升级至10维度后捕获催化剂/聪明钱/时机等原框架遗漏的信号"
      - "16个Kill Switch × 三级阈值体系 — 风险管理从定性变为可执行的仓位调整规则"
      - "22个可验证预测(P-META-001至022) — 每个预测含概率/时间窗/验证方式/若成真若不成真, 报告可被事后验证"
      - "Phase 4行为金融校准有效——将+18%上行压缩至+2~8%, 防止了确认偏差导致的过度乐观"
    weaknesses:
      - "SOTP-DCF偏差36.3%未完全解决 — 两种方法给出截然不同的结论($747 vs $482), 取加权平均是折衷而非解答"
      - "Advantage+$60B中真增量vs重归因比例缺乏硬数据 — 这是估值的关键假设但依赖合理推断而非硬数据"
      - "框架版本v24.0与当前项目框架v19.7不一致 — 报告使用的评分体系(0-100/100)与当前标准(D1-D11/110)不同, 不可直接对比"
      - "DM密度1.35/千字合格但非优秀 — 低于标杆CME v3.0的2.82/千字"

  hypothesis_tested:
    confirmed:
      - hypothesis: "Phase 4对抗审查能有效压缩Phase 1-3的乐观偏差"
        evidence: "META +18%→+2~8%, 压缩12-16pp; CME报告同样经Phase 4校准"
        confidence_after: "高(两份独立报告确认)"

      - hypothesis: "RL期权框架(关停/扭亏/成功概率加权)优于简单NPV"
        evidence: "SOTP中RL概率加权$107B vs DCF中RL为负值 → 期权框架捕获了关停期权的正面价值"
        confidence_after: "高(META RL是最极端的测试案例——$84B亏损但仍有正期权价值)"

    extended:
      - hypothesis: "AI广告是差异化优势(非commodity)"
        extension: "META Advantage+ ROAS +22%但Google PMax/TikTok Smart+均提供类似功能 → AI广告可能从'差异化'→'基准线'(commodity化趋势)"

    refuted:
      - hypothesis: "FCF断崖=价值毁灭(简单映射)"
        evidence: "CFO $116B(+27%)证明造现金能力史上最强 → FCF断崖纯粹是CapEx节奏问题而非业务恶化 → 不能简单映射为'毁灭价值'"
        lesson: "区分'业务恶化导致的FCF下降'(真危险)和'战略投入导致的FCF下降'(可能是机会) — 看CFO趋势区分"

  limitations:
    - "所有数据截止2026-02-08, AI领域技术迭代极快, 报告中的前沿模型对比可能在数月内过时"
    - "Advantage+$60B增量vs重归因的比例缺乏第三方硬数据, 这是估值的关键假设"
    - "报告使用v24.0评分体系(0-100), 与项目当前标准不同, 质量分数不可与其他报告直接对比"
    - "Avocado发布时间和性能完全取决于Meta内部执行, 无法从外部数据预测"
    - "NM青少年案判决+MDL连锁效应的赔偿区间极宽($2-17.6B), 法律风险量化置信度低"
