# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "市场以身份A(税务软件)的18x PE定价一家正在向身份B(SMB金融操作系统)转型的公司——略偏保守但并非严重错误, 因为身份B的三个验证条件零条已完全确认"
  rating: "中性关注(偏积极)"
  fair_value: "SOTP $490 / PW EV $480"
  expected_return: "+5-8%"

  key_arguments:
    - claim: "Reverse DCF隐含FCF CAGR仅4-5%, 实际12.8% — 市场定价偏保守"
      direction: bullish
      magnitude: 4  # Reverse DCF数学硬证据, 但偏保守≠严重低估
      mechanism: "市场隐含FCF CAGR 4-5% vs 实际12.8% → 盈亏平衡仅需7.0% → 即使增速从+31%逐年衰减至+5%, 5年复合仍超盈亏平衡"
      kill_switch: "AI报税+IRS Direct File导致TT收入断崖(占利润50%+) → FCF增速真的降至4-5%以下"

    - claim: "SBC $2.0B(10.4%/Rev)侵蚀真实股东回报 — 回购$2.8B中$2.0B仅抵消稀释"
      direction: bearish
      magnitude: 4  # 数学推导, 可量化
      mechanism: "真实净回购仅$0.8B → 真实回购yield 0.6%(非表面2.2%) → SBC年增15-18%快于收入增速 → 剪刀差扩大"
      kill_switch: "SBC/Revenue降至<8% 或 SBC增速降至<收入增速"

    - claim: "CPA会计师网络(46K事务所/75%推荐QB)是AI短期无法替代的物理壁垒"
      direction: bullish
      magnitude: 4  # 有DM锚点, 推荐基于培训投入和迁移成本而非技术
      mechanism: "会计师推荐QB基于自身培训投入+客户迁移成本(3-7年数据重建/$2-5M) → 决策不受AI技术进步影响 → 低CAC获客渠道持续"
      kill_switch: "Xero或AI原生工具在美国建立可比会计师网络(需5-10年) | 会计行业本身被AI颠覆"

    - claim: "Mailchimp $12B收购隐含$7.3B减值风险 — FY2026 10-K是披露时点"
      direction: bearish
      magnitude: 3  # 非现金但影响管理层信任+被动卖出
      mechanism: "当前估值$4.7B(3.5x Rev) vs $12B收购价 → 减值触发被动指数卖出+管理层评分下调"
      kill_switch: "Mailchimp增速恢复至>15% 或 e-commerce/marketing stack整合产生显著协同"

    - claim: "AI颠覆TurboTax是时间问题而非概率问题 — 时间不确定性压制估值倍数"
      direction: bearish
      magnitude: 3  # 方向确定但时间高度不确定(3年 vs 10年)
      mechanism: "IRS Direct File已存在 + AI报税能力逐年提升 → TT从'必需品'变'可选品'不可逆 → 理性投资者不为不确定到期的看涨期权支付高溢价"
      kill_switch: "IRS Direct File因政治原因被终止(共和党胜选) + AI报税准确率5年内无法达到99.9%"

  moat:
    composite_score: 7.3  # 5层结构, AI迁移进度30-35%
    half_life: "10-15年(复合) | C2合规>20年 | C5会计师网络>15年 | C3功能锁定<5年(AI侵蚀)"
    dimensions:
      - type: switching_cost
        strength: 4
        evidence: "三层锁定: 数据迁移(3-7年历史/$2-5M) + 生态重建(Payments/Payroll/Capital) + 会计师切换 → QB年留存率82%, IES 88%"
        vulnerability: "AI降低操作复杂性→功能锁定(C3)在<5年内被侵蚀; Open Banking数据可携带性削弱数据锁定"
      - type: network_effect
        strength: 4
        evidence: "46K CPA事务所75%推荐QB → 会计师-SMB-QB三方网络; 700K+会计师通过QB OA管理客户 → 低CAC获客渠道"
        vulnerability: "网络效应高度集中在美国(86.49%用户); Xero在澳/英已复制类似会计师网络"
      - type: brand
        strength: 3
        evidence: "TurboTax/QuickBooks在美国SMB/消费者中品牌认知度极高; 55M+税务申报用户"
        vulnerability: "品牌在AI时代的价值递减 — 如果AI能免费做到同样效果, 品牌溢价缩小"
      - type: regulatory
        strength: 4
        evidence: "C2合规壁垒: e-filer授权+州税务合规+IRS对接 → 新进入者需逐州获取资质"
        vulnerability: "IRS Direct File绕过整个e-filer生态; 如果政府扩大免费报税, 监管壁垒反而成为行业萎缩的一部分"
      - type: data
        strength: 3
        evidence: "60PB结构化金融数据(40年积累) + 70K属性/用户 + 600亿预测/天 → GenOS/Intuit Assist"
        vulnerability: "Open Banking法规(CFPB 1033)可能强制数据可携带; AI可能仅需实时银行API数据无需历史积累"

  valuation:
    reverse_dcf_implied: "市场隐含FCF CAGR 4-5%(盈亏平衡7.0%), 隐含OPM终端35-37%, 终端增速2-3% — 定价了增速断崖但未发生"
    methods_used: ["Reverse DCF", "SOTP(5分部)", "概率加权(4情景)", "可比公司(ADBE/CRM)", "历史估值带", "Python验证"]
    dispersion: "报告未给出精确离散度 — SOTP $490 vs PW $480 vs Bull $580 vs Bear $370"
    consensus_vs_ours: "市场看身份A(税务软件)给18x | 我们看混合身份(A→B转型中)给18-22x合理区间 | 当前18x处于偏下位置"
    entry_zone: "$380-400 (14-15x PE, 身份A定价) — 安全边际充足的入场区"
    catalyst: "CK增速维持>20%连续2季 | IES ARR突破$300M | QBO生态留存率>82%"

  # ★ v1.2新增: 买卖决策框架 ★
  action_framework:
    verdict: "持有(已持有) / 等待买入(未持有) — 基本面改善+估值底部区域, 但+5-8%期望回报不足以新建仓"
    buy_triggers:
      - trigger: "身份B三条件中任一明确验证(CK>20%×2季 / IES ARR>$300M / QBO留存>82%)"
        price_zone: "$440-470 (当前价位附近)"
        reasoning: "验证信号确认→PE从18x扩张至20-22x→上行空间扩大至+15-25%"
      - trigger: "Mailchimp减值导致恐慌卖出(FY2026 10-K, 2026年9月)"
        price_zone: "$380-400 (14-15x PE)"
        reasoning: "减值是非现金事件不影响FCF→恐慌创造入场窗口→身份A定价但获得身份B免费期权"
      - trigger: "AI恐慌(GPT-5级模型发布→TurboTax颠覆叙事)"
        price_zone: "$350-380 (12-14x PE)"
        reasoning: "市场过度外推短期AI能力→C2合规壁垒+C5会计师网络提供5-7年缓冲→中期FCF不受影响"
    hold_conditions:
      - "收入增速维持>12%(当前16%)"
      - "QBO生态留存率>78%(当前79%)"
      - "TurboTax市占率>55%(当前62%)"
      - "SBC/Revenue<12%(当前10.4%)"
    sell_triggers:
      - signal: "QBO留存率<78% + TT市占率<55%(双重验证护城河侵蚀)"
        severity: "action"
        action: "减仓50% — 护城河核心假设被证伪"
      - signal: "SBC/Revenue>12%且持续上升"
        severity: "warning"
        action: "重新计算真实股东回报率, 如果真实回购yield<0.3%则减仓25%"
      - signal: "IRS Direct File覆盖>40%符合条件纳税人 + AI报税工具渗透率>10%"
        severity: "action"
        action: "减仓50% — TurboTax从必需品变可选品的时间线加速"
      - signal: "FY2027增速<8%(增速断崖开始)"
        severity: "emergency"
        action: "全部卖出 — 市场隐含4-5%增速被确认, 18x PE变高估"
    position_sizing: "当前价位期望回报+5-8%→Kelly偏低→建议观察仓(2-3%) | $380-400区间→半Kelly(8-10%)"

# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "CPA网络如何构成AI无法颠覆的物理分发壁垒"
    chain: >
      会计师基于自身培训投入(数年学习QB)选择推荐QB给客户
      → 推荐决策不取决于产品技术先进性, 而取决于会计师自身效率
      → 46K事务所×75%推荐率=34.5K事务所作为QB低CAC获客渠道
      → 客户通过会计师进入QB→三层锁定(数据+生态+会计师)激活
      → 即使竞品技术更好, 会计师不会为了客户的利益承担自身的切换成本
      → AI改变的是终端用户体验, 不改变会计师的工作流锁定和推荐激励
      → 唯一颠覆路径: AI替代会计师本身(而非替代QB) — 需要10年+
    transferable_to: "所有依赖专业中介分发的软件(医疗IT→医生推荐/法律科技→律师推荐/ERP→咨询顾问推荐)"
    reasoning_habit: "追问'谁做购买决策'而非'谁是终端用户' — 如果决策者和用户不同, 颠覆必须先颠覆决策者的激励结构"

  - id: "CC-2"
    name: "SBC隐性侵蚀真实股东回报的数学"
    chain: >
      表面: 回购$2.8B, 回购yield 2.2%, 覆盖SBC的141%
      → 追问: $2.8B中有多少是真正返还股东的?
      → 发现: SBC $2.0B→$2.8B回购中$2.0B仅抵消稀释→净回购$0.8B
      → 真实回购yield仅0.6%(非2.2%)→表面数字夸大了3.7倍
      → 更糟糕: SBC年增15-18%快于收入增速→剪刀差扩大
      → 因此: 每股FCF增速系统性低于公司级FCF增速→长期持有者被隐性稀释
      → 投资含义: 科技公司的回购不能用面值评估, 必须先扣除SBC offset
    transferable_to: "所有SBC>5%收入的科技公司(CRM/ADBE/NOW/SNOW/DDOG)"
    reasoning_habit: "看到回购数字时先问'其中多少是抵消SBC的' — 真实回购=总回购-SBC, 只有净值才是股东回报"

  - id: "CC-3"
    name: "双重身份估值框架 — PE区间由身份认知驱动"
    chain: >
      INTU当前18x PE → 市场以身份A(税务软件)定价
      → 身份A对标: ADBE 14.4x(质量更高但PE更低)→18x不算便宜
      → 身份B对标: CRM 25x(企业平台)→18x严重低估
      → 关键问题: 身份B需要三条件验证(IES/CK/GenOS)→当前零条确认
      → 因此PE区间= 14-15x(纯身份A) → 18-22x(混合) → 25x(身份B上限)
      → 当前18x=市场给了一点身份B期权价值, 但不多
      → 催化剂: 三条件任一验证→PE扩张至22-25x→上行30-50%
    transferable_to: "所有处于商业模式转型中的公司(硬件→服务/产品→平台/线下→线上)"
    reasoning_habit: "当公司声称在'转型'时, 列出转型需要验证的具体条件, 然后检查已验证了几条 — 零条验证=市场怀疑合理"

  - id: "CC-4"
    name: "AI护城河迁移的时间差陷阱"
    chain: >
      INTU护城河5层中, C3功能锁定正被AI侵蚀(半衰期<5年)
      → 同时INTU在建设C4数据锁定(GenOS/60PB数据/Intuit Assist)作为替代
      → 但侵蚀速度由外部力量驱动(AI技术进步, INTU无法控制)
      → 而建设速度由内部执行力驱动(用户采用率, INTU部分可控)
      → 时间差陷阱: 如果侵蚀>建设→净护城河下降→即使方向正确也来不及
      → 当前评估: AI迁移进度30-35%, 窗口期5-7年→紧但可行
      → 非线性风险: 如果GPT-5级别模型提前到来→窗口可能缩短至2-3年→迁移来不及
    transferable_to: "所有传统护城河正在向数字护城河迁移的公司(银行→数据/媒体→流媒体/零售→电商)"
    reasoning_habit: "当公司在'新旧护城河交接'时, 分别估计侵蚀速度和建设速度 — 如果侵蚀不可控但建设可控, 关注外部技术突破的非线性风险"

  - id: "CC-5"
    name: "Bench倒闭证明AI颠覆SMB会计的单位经济学陷阱"
    chain: >
      Bench(AI记账公司)服务12K客户, 收入$15-20M
      → AI记账准确率99%≠100% → 每客户仍需人工审核
      → 客户付费意愿$200-400/月 < AI+人工混合成本 → 单位经济学失败
      → Bench 2024年12月倒闭 → 证明"AI替代QB"的第一波进攻已失败
      → 原因: 会计(accounting)的精确性要求(100% vs 99%)意味着AI无法完全替代人工
      → INTU的防线: 不是AI做不到, 而是做到99%的AI仍需INTU的合规/审计基础设施
      → 真正的威胁不是"AI替代QB", 而是"AI使QB的复杂功能变得不必要"
    transferable_to: "所有面临AI颠覆威胁的专业服务软件(法律科技/医疗IT/审计软件)"
    reasoning_habit: "当评估AI颠覆某行业时, 追问'99%准确率够不够' — 如果该行业要求100%(会计/医疗/法律), AI替代的经济学可能不成立"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "INTU Forward PE 18x是10年最低 → 被严重低估"
      final: "18x PE偏保守但非严重错误 — ADBE质量更高PE更低(14.4x)证明18x不算便宜"
      pivot: "铁律H可比对标: ADBE增速相当(12% vs 16%)但毛利率89%/OPM 36%/ROE 59%全面碾压INTU → 18x溢价来自期权价值而非品质"

    - initial: "Mailchimp收购是战略失误 → 管理层资本配置能力差"
      final: "Mailchimp价值毁灭已发生(减值$7.3B)但管理层2026年行为转折(终止10b5-1+加速回购)提供了部分纠偏信号"
      pivot: "终止10b5-1是成本非零的信号(放弃流动性)→比口头表态更可信 — 但需跟踪股价回升后是否重设卖出计划"

    - initial: "AI是TurboTax的最大威胁"
      final: "AI的双刃效应: GenOS提升ARPC(+) vs 免费AI报税威胁TT(-) → 飞轮净效应当前为正但5年后可能转负"
      pivot: "Bench倒闭证明AI记账单位经济学失败 + C2合规壁垒(e-filer授权)短期保护TT → 真正威胁是IRS Direct File(政策)而非AI(技术)"

  surprises:
    - finding: "递延收入$8.1B(43%年收入), 4年增长+636% — 远超同期收入增速"
      implication: "递延收入暴增可能反映预付费周期拉长(从月付转年付)而非真正的客户锁定增强 — 需要区分真粘性vs会计口径效应"

    - finding: "CEO Goodarzi过去5年7笔交易全部是卖出, 0笔买入 — 但2026-03突然终止全部10b5-1"
      implication: "行为转折(从纯卖出→停止卖出)是最强的管理层信心信号 — 但可能是低成本信号博弈(股价已跌30%+, 卖出价格不好)"

    - finding: "INTU的增长质量中NRR(间接推算SSE 108-112%)证明存量扩展>新客获取"
      implication: "NRR>105%意味着飞轮在运转(客户在花更多钱) — 但INTU不公开NRR, 间接推算有不确定性"

    - finding: "IES中端突破的承重墙成功概率仅12-17%, 但成功时贡献$24-50B EV"
      implication: "IES是一个深度虚值期权 — 概率低但回报极高 → 期权思维定价而非DCF定价"

  blind_spots:
    - area: "NRR真实水平"
      why_matters: "NRR>110%=飞轮健康 vs NRR<100%=增长靠烧钱 → 增长质量完全不同的两个故事"
      monitor: "INTU若在10-K中开始披露NRR是最强正面信号; 退出率/churn任何恶化是负面信号"

    - area: "IRS Direct File政策走向"
      why_matters: "2028总统大选决定Direct File是扩大(民主党)还是缩减(共和党) → TurboTax最大二元风险"
      monitor: "Direct File覆盖州数变化 / IRS预算变化 / 2028大选民调"

    - area: "GenOS AI货币化路径"
      why_matters: "Intuit Assist活跃度上升但货币化路径未完全打通 → 决定AI是成本中心还是收入引擎"
      monitor: "Intuit Assist MAU / AI驱动ARPC提升可量化数据 / GenOS功能渗透率"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "身份转型验证失败(IES/CK/GenOS三条件2年内零确认) → PE回归身份A(14-15x)"
      lesson: "转型公司如果长期无法验证新身份, 市场会重新按旧身份定价 → 给转型故事设明确的时间窗口和验证标准"
      transferable: "所有声称在'转型'但缺乏验证数据的公司(传统银行→fintech/硬件→服务)"
    - scenario: "SBC/Revenue持续上升且管理层不行动 → 每股价值被隐性稀释"
      lesson: "SBC是科技公司最隐蔽的价值毁灭器 — 不影响FCF但影响每股价值。必须跟踪SBC增速vs收入增速的剪刀差"
      transferable: "所有SBC>8%收入的科技公司"
    - scenario: "Mailchimp减值公告触发短期恐慌 → 恐慌卖出后反弹"
      lesson: "非现金减值事件不影响FCF→恐慌卖出是入场机会而非卖出信号。但减值暴露管理层M&A失误→长期需调低资本配置评分"
      transferable: "所有有大额商誉且收购表现不佳的公司"

# --- Layer 2.5: 信号分级 (v1.2新增) ---
signal_hierarchy:
  alpha_signals:
    - signal: "Reverse DCF隐含FCF CAGR vs 实际FCF CAGR的差距"
      why_alpha: "市场隐含4-5%但实际12.8%→差距暴露市场对增速持久性的过度悲观或对SBC侵蚀的隐性定价"
      current_reading: "差距约8pp — 显著, 但SBC/WACC/Mailchimp三重修正后实际alpha仅+5-8%"
    - signal: "CK增速趋势(季度同比)"
      why_alpha: "CK是身份B转型的最关键验证 — 从收购后整合阵痛恢复至+23-27%, 但减速(27→23%)暗示恢复见顶"
      current_reading: "+23%(Q2 FY2026), 需要Q3-Q4维持>20%确认结构性增长"
    - signal: "管理层内部交易行为(Form 4)"
      why_alpha: "CEO 5年纯卖出→2026-03突然终止所有卖出 — 行为信号比口头指引更可信"
      current_reading: "2026-03终止10b5-1(正面) — 但需跟踪是否在股价回升后重设卖出"

  confirmation_signals:
    - signal: "QBO生态留存率"
      bullish_threshold: ">82%(GBS交叉销售降低churn)"
      bearish_threshold: "<78%(竞争或AI替代侵蚀粘性)"
    - signal: "TurboTax联邦e-file市占率"
      bullish_threshold: ">60%(维持主导地位)"
      bearish_threshold: "<55%(Direct File+AI报税结构性蚕食)"
    - signal: "SBC/Revenue比率"
      bullish_threshold: "<9%(稀释压力缓解)"
      bearish_threshold: ">12%(稀释加速→每股价值增速系统性落后)"

  noise_signals:
    - signal: "季度收入beat/miss幅度"
      why_noise: "INTU收入高度季节性(Q3税季占35%)→季度波动大但不影响年度趋势。看全年增速而非单季beat"
    - signal: "Sell-side目标价调整"
      why_noise: "大多数卖方不区分SBC调整后真实盈利 → 目标价基于GAAP/Non-GAAP EPS → 系统性高估每股价值增速"
    - signal: "AI竞品发布(如ChatGPT报税功能)"
      why_noise: "AI报税的真正瓶颈是合规授权(e-filer)而非技术能力 → 没有e-filer授权的AI工具无法提交申报 → 关注IRS政策变化而非技术发布"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: ADBE
      similarity: "同为创意/生产力SaaS垄断, 类似增速(12% vs 16%), 类似转型叙事(AI威胁+AI机会)"
      key_difference: "ADBE质量全面碾压(毛利89%/OPM 36%/ROE 59%)但PE更低(14.4x vs 18x) → INTU溢价来自CK/IES期权"

    - ticker: CRM
      similarity: "同为平台型SaaS, 企业级客户, AI转型叙事(Einstein/Agent vs GenOS/Intuit Assist)"
      key_difference: "CRM=Enterprise(F500 90%+用Salesforce) vs INTU=SMB(客户粘性和单客价值远低) → CRM 25x PE是INTU身份B的上限"

    - ticker: PAYC
      similarity: "同为SMB SaaS(Payroll/HR), 类似客户画像"
      key_difference: "PAYC聚焦Payroll单一赛道 vs INTU多产品生态 → PAYC增速更快但TAM更小"

  comparative:
    - dimension: "护城河深度"
      position: "ADBE (品牌+创意工作流) > INTU (会计师网络+合规) > CRM (企业CRM平台) > PAYC (Payroll单点)"
      reasoning: "ADBE的创意工作流锁定比INTU的会计工具锁定更深(Photoshop生态30年vs QB生态15年)"

    - dimension: "增长质量"
      position: "INTU (+16%/NRR~110%) > CRM (+12%/NRR不详) ≈ ADBE (+12%/NRR~110%) > PAYC (+10%)"
      reasoning: "INTU增速最高且NRR>100%证明存量扩展驱动 — 但SBC侵蚀使每股增速打折"

    - dimension: "估值吸引力"
      position: "CRM (11.7x PE) > ADBE (14.4x PE) > INTU (18x PE) > PAYC (~25x PE)"
      reasoning: "INTU PE最高但增速也最高 → PEG可能合理 — 但对标ADBE更便宜+更高质量, INTU溢价有限"

    - dimension: "AI风险暴露"
      position: "INTU (高: TT/QB核心受威胁) > CRM (中: Agent可能蚕食seat) > ADBE (中: 创意AI) > PAYC (低: 合规驱动)"
      reasoning: "INTU的两个核心业务(报税/记账)都在AI颠覆的直接路径上 — 同时也是AI增强的直接受益者(双刃)"

  industry_position:
    quadrant: "高品质 × 中等估值 × 转型期"
    archetype: "SMB金融操作系统(转型中) — 从工具公司到平台公司, 身份A和身份B的PE区间差2倍"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含FCF CAGR 4-5% vs 实际12.8%→盈亏平衡7.0%→市场偏保守但三重修正后alpha仅+5-8%"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "7个RT攻击(增速腰斩/SBC/Mailchimp/商誉/AI颠覆TT/QB高市占/概率重赋权)→估值从P2的$503/$528下调至$490/$480"

    - pattern_id: "moat.switching_cost_layered"
      application: "三层锁定(数据迁移+生态重建+会计师切换)→留存率82-88%→但C3功能锁定AI半衰期<5年"

  novel_patterns:
    - name: "双重身份估值框架(Identity A/B PE Band)"
      description: "公司处于商业模式转型时, PE不由单一可比锚定, 而由'旧身份PE→新身份PE'的区间决定。转型验证条件的确认进度驱动PE在区间内的位置"
      transferable_to: ["所有商业模式转型公司", "硬件→服务(AAPL)", "产品→平台(SHOP)", "传统金融→fintech(SOFI)"]

    - name: "CPA网络作为AI免疫分发壁垒"
      description: "专业中介(会计师/医生/律师)的推荐决策基于自身培训投入而非产品技术先进性 → AI改变终端用户体验但不改变中介推荐激励 → 中介网络是AI时代最持久的分发壁垒"
      transferable_to: ["医疗IT(Epic→医生推荐)", "法律科技", "ERP(SAP/Oracle→咨询顾问推荐)"]

    - name: "SBC offset真实回购分析"
      description: "科技公司回购中扣除SBC offset后的净回购才是真实股东回报 → 真实回购yield = (总回购-SBC)/市值 → 可能比表面数字低3-5倍"
      transferable_to: ["所有SBC>5%收入的科技公司(SNOW/DDOG/NOW/CRM/ADBE)"]

    - name: "护城河AI迁移速度评估(时间差陷阱)"
      description: "传统护城河被AI侵蚀(外部驱动, 不可控) vs 新AI护城河建设(内部驱动, 部分可控) → 如果侵蚀>建设=净护城河下降 → 非线性技术突破可能突然缩短窗口期"
      transferable_to: ["所有传统护城河正在向AI/数字护城河迁移的公司"]

    - name: "Bench倒闭→AI颠覆精确性行业的单位经济学陷阱"
      description: "AI准确率99%≠100%→精确性行业(会计/医疗/法律)每客户仍需人工审核→混合成本>客户付费意愿→单位经济学失败"
      transferable_to: ["医疗AI(99%诊断准确率不够)", "法律AI(合同审查)", "审计AI"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "专业中介网络(CPA/医生/律师)是AI时代最持久的分发壁垒 — 因为中介决策基于自身培训投入, 不受终端用户AI体验变化影响"
        implication: "护城河评估增加'中介网络AI免疫性'维度 — 有中介网络的公司(INTU/Epic/SAP)比纯终端用户产品(TurboTax DIY)更抗AI颠覆"
      - insight: "护城河AI迁移需要评估'时间差' — 侵蚀速度(外部)vs建设速度(内部) → 如果两者都不可控, 风险最高"
        implication: "对所有面临AI转型的护城河公司, 增加'迁移速度评估'步骤: 分别估算侵蚀和建设的半衰期"

    valuation_insights:
      - insight: "双重身份公司的PE不能用单一可比锚定 — 应建立'身份A PE → 身份B PE'的区间, 由验证条件进度决定位置"
        implication: "对转型公司估值, 先定义两个身份的PE锚(通常差2-3倍), 再评估转型验证进度决定当前合理PE"
      - insight: "SBC offset后的真实回购yield比表面低3-5倍 — 科技公司的股东回报被系统性夸大"
        implication: "所有科技公司估值需计算'真实回购yield = (总回购-SBC)/市值', 作为股东回报的修正指标"

    screening_insights:
      - insight: "Forward PE at 10-year low + 收入增速加速 = 可能的身份错定价信号"
        implication: "筛选条件: PE处于10年低位 + 收入增速>12% + 有可验证的商业模式转型叙事 → 值得深入调研"
      - insight: "SBC/Revenue>10%且增速>收入增速 = 隐性稀释风险标记"
        implication: "选股时增加SBC稀释筛选: SBC增速/收入增速>1.1x → 标记每股价值增速被打折"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "看到PE处于历史低位时, 先对标可比公司验证'真的便宜吗'"
      trigger: "PE at N-year low"
      origin: "INTU 18x PE看似10年最低 → 但ADBE 14.4x质量更高PE更低 → 18x的'便宜'是相对于自身历史, 不是相对于同行"
      generalization: "永远用可比公司PE锚定, 不要用自身历史PE锚定 — 自身PE下降可能是行业重估而非个股低估"

    - habit: "评估转型公司时列出验证条件并检查确认进度"
      trigger: "公司声称在'转型'或管理层pitch'第二曲线'"
      origin: "INTU身份B需要三条件(IES/CK/GenOS)→零条确认→市场怀疑合理 → 这解释了为什么18x而非25x"
      generalization: "转型故事的PE溢价应与验证进度成正比 — 零验证=零溢价, 1/3验证=1/3溢价, 全部验证=全额溢价"

    - habit: "追问'AI颠覆需要什么精确度' — 99%≠100%在某些行业是致命差距"
      trigger: "分析AI对某行业的颠覆威胁"
      origin: "Bench倒闭: AI记账99%准确但100%要求的行业需要人工审核→混合成本>收入→单位经济学失败"
      generalization: "会计/医疗/法律/审计等'精确性行业'的AI颠覆时间线比市场预期更长 — 不要将通用AI进步直接外推到精确性行业"

    - habit: "科技公司回购先扣SBC再评估"
      trigger: "科技公司公布大额回购计划"
      origin: "INTU回购$2.8B, 表面yield 2.2%, 实际净回购$0.8B, 真实yield 0.6%"
      generalization: "所有科技公司: 真实回购 = 总回购 - SBC。如果真实回购<0, 公司实际上在净增发, 不管回购数字多大"

  quality_feedback:
    strengths:
      - "DM密度1.46/千字(接近合格线但覆盖扎实) — 494个DM锚点, 关键论点均有数据支撑"
      - "Reverse DCF P1前置有效防止确认偏差 — 从P1的+16%期望回报经P4三重修正降至+5-8%, 证明框架纠偏机制运作正常"
      - "红队7个RT攻击全部有独立推导 — RT-2(SBC)/RT-3(Mailchimp)/RT-5(AI颠覆)提供了实质性的估值下调依据"
      - "CPA网络分析深入(46K事务所/75%推荐/三层锁定) — 护城河分析区分了存量锁定vs增量吸引"
    weaknesses:
      - "报告未给出明确的质量总分和D1-D11各项分数 — 无法与其他报告直接对比"
      - "估值离散度未显式计算(SOTP $490 vs PW $480 vs Bull $580 vs Bear $370 — 范围过宽)"
      - "NRR为间接推算(108-112%) — 核心增长质量指标的置信度有限"
      - "管理层评分D7仅6.4/10(Mailchimp+SBC拖累) — 需要更长时间验证2026-03行为转折的持续性"

  hypothesis_tested:
    confirmed:
      - hypothesis: "Reverse DCF P1前置有效防止确认偏差(CRM v1.0教训/铁律O)"
        evidence: "P1期望回报+16%→P4修正后+5-8%, 框架纠偏机制正常运作"
        confidence_after: "高(连续多份报告确认)"

      - hypothesis: "SBC offset是科技公司隐性价值毁灭(多报告验证)"
        evidence: "INTU真实回购yield仅0.6%(表面2.2%的27%) — 与CRM/ADBE案例一致"
        confidence_after: "高(三份报告独立确认)"

    extended:
      - hypothesis: "定价权分层评估(v19.6 CRM+ADBE)"
        extension: "INTU新增'客户类型'维度: F500(Stage 3.5)/SMB(Stage 2.5)/微型(Stage 2.0) → 定价权剪刀差不仅存在于高端vs低端, 也存在于大客户vs小客户"

      - hypothesis: "飞轮悖论(v19.6 CRM)"
        extension: "INTU飞轮悖论: AI提升ARPU(+) vs AI降低切换成本(-) → 与CRM(Agent成功→seat减少)结构类似但驱动机制不同"

    refuted: []

  limitations:
    - "NRR为间接推算(SSE 108-112%/Consumer 102-105%), INTU不公开披露 → 增长质量判断的核心数据置信度有限"
    - "IES中端突破数据极少(88%留存率样本量不足, ARR未披露) → IES期权定价高度依赖假设"
    - "AI颠覆TurboTax的时间线无法缩窄(3年 vs 10年) → 这一不确定性本身就是估值折价的主要来源"
    - "Mailchimp减值金额为估算($7.3B) — 实际减值取决于INTU如何定义报告单元(合并vs独立可能差别巨大)"
    - "WACC每变50bps估值变$25-30/股(5-6%) — 在当前利率环境不确定性下, WACC选择本身就是最大的估值变量"
