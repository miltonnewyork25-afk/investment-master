# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: PINS
      similarity: "同为兴趣导向平台(非社交图谱), 类似IPO后增速减速曲线, 早期广告变现阶段"
      key_difference: "PINS是个人策展(静态图片收藏) vs RDDT是社区讨论(动态意见流) | PINS利润率更稳定但增速更低 | RDDT有AI数据授权+版主风险(PINS没有)"

    - ticker: SNAP
      similarity: "同为非META阵营社交平台, 类似SBC稀释问题, IPO后增速衰减先例"
      key_difference: "SNAP仍亏损(OPM -11%) vs RDDT已盈利(OPM 32%) | SNAP的AR/硬件投入=更低效率 | SNAP的IPO后减速曲线(IPO+3年增速-40pp)是RDDT的预警参照"

    - ticker: META
      similarity: "同为广告变现平台, RDDT的终端利润率对标"
      key_difference: "META ARPU $60+ vs RDDT $6(10x差距) | META有平台级网络效应(38亿用户) vs RDDT是社区级(10万+独立社区) | META自主流量 vs RDDT 63%依赖Google"

  comparative:
    - dimension: "用户变现效率(ARPU)"
      position: "META ($60+) >> SNAP ($12) > PINS ($7.7) > RDDT ($6)"
      reasoning: "Reddit ARPU最低但增速最高(+42% YoY), 提升空间3-4x(收敛至SNAP水平$18-24)"

    - dimension: "利润率质量"
      position: "META (42%) > RDDT (32%, 快速上升) > PINS (23%) >> SNAP (-11%)"
      reasoning: "Reddit利润率跃升速度在社交平台历史上罕见, 但受益于收入增速(分母膨胀)而非费用控制"

    - dimension: "估值水平(Forward P/E FY26)"
      position: "RDDT (34.6x) > META (~25x) > PINS (~20x) > SNAP (亏损)"
      reasoning: "Reddit估值溢价源于增速(+70% vs META +20%+), 但增速减速时倍数压缩风险最大"

    - dimension: "流量自主性"
      position: "META (>90%自主) >> SNAP (~70%自主) > PINS (~60%自主) >> RDDT (37%自主, 63% Google)"
      reasoning: "Reddit的流量自主性在主要社交平台中最低, 是核心估值风险"

  industry_position:
    quadrant: "最高增速 × 最高估值 × 最低流量自主性"
    archetype: "早期变现平台 — 广告引擎正加速但护城河含外部依赖"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含CAGR 30-31%→非极端但需完美执行→四座承重墙逐墙施压"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1~RT-7完整七问: 承重墙压力测试+偏差审计(6项)+空头钢人(5论点)+黑天鹅(6事件, 联合52.7%)+替代解释(3指标双读)"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "Google AI Overview渐进截流: 零点击率58%→65%→75% → Reddit搜索流量温水煮青蛙式萎缩"

  novel_patterns:
    - name: "版主经济学建模(供给函数+级联风险)"
      description: "对无偿UGC贡献者的经济学建模: 4因子供给函数(社区认同/权力感/技能积累/替代成本) + 级联风险因果链 + 经济量化(10万版主×$5K=$500M)"
      transferable_to: ["Wikipedia", "Stack Overflow", "开源社区", "所有依赖志愿者贡献的平台"]

    - name: "DAU质量分层(Logged-in vs Logged-out)"
      description: "总DAU增速可能掩盖用户质量分化——分层后发现真实社区用户增速(+14%)远低于标题数字(+19%), Logged-out用户粘性接近零(搜索单次访问)"
      transferable_to: ["所有DAU中含大量非注册/搜索导入用户的平台", "Google搜索流量依赖型公司"]

    - name: "SBC隐形估值陷阱(GAAP FCF vs 真实FCF 2x差距)"
      description: "SBC>Revenue 15%时, GAAP P/FCF产生系统性误导——扣SBC后真实估值可能是GAAP口径的2倍, 加上稀释效应进一步侵蚀每股价值"
      transferable_to: ["所有SBC/Revenue>15%的高增长科技公司"]

    - name: "护城河分类: 自建壁垒 vs 外部恩惠"
      description: "Google搜索整合不通过Swap Test——它是外部平台的恩惠而非内部能力构建的壁垒。应区分两类并给予不同的持久性评估"
      transferable_to: ["所有依赖外部平台分发的公司(应用商店依赖/社交分发依赖/SEO依赖)"]

    - name: "AI数据衰减曲线(训练数据的一次性消耗特征)"
      description: "AI训练数据消耗模式更接近一次性采购(边际递减)而非SaaS持续订阅——LLM引用率从14%骤降至2%是实证信号"
      transferable_to: ["所有将'AI数据授权'作为增长叙事的数据资产公司"]

    - name: "Kill Switch三核监控体系(流量核/变现核/内容核)"
      description: "12个KS分组为3个核心(每核4个), 单核WARN/双核WARN/三核FAIL的递进式风险响应框架"
      transferable_to: ["所有多风险源公司的监控体系设计"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "护城河应区分'自建壁垒'和'外部恩惠'——Google搜索整合看似护城河实为依赖, Swap Test可有效识别"
        implication: "护城河评估增加'控制力'维度: 自建(高控制)→给分 | 外部恩惠(零控制)→归入风险而非护城河"
      - insight: "无偿贡献者支撑的高利润率包含'未支付负债'——版主$500M隐含成本说明OPM 32%部分来自外部化成本"
        implication: "平台利润率分析增加'隐含贡献者成本'检查: 如果补偿贡献者=OPM降X%, 则X%是隐形负债"
      - insight: "社区级网络效应弱于平台级但崩溃也是局部的——Reddit 10万社区独立运作=风险分散但增长不聚合"
        implication: "网络效应评估增加'粒度'维度: 平台级(强但全局风险)/社区级(弱但局部风险)"

    valuation_insights:
      - insight: "扣SBC后真实FCF可以是GAAP口径的一半——RDDT的78x vs 39x是最极端的案例之一"
        implication: "高增长科技公司估值必须计算SBC-adjusted FCF, SBC/Revenue>15%时GAAP P/FCF有系统性误导"
      - insight: "OVM期权估值仅$8/股(vs $28/股市场缺口)——证明溢价不能被期权解释, 市场在支付情绪溢价"
        implication: "当OVM无法解释市价-SOTP缺口的>50%时, 缺口大概率是情绪溢价而非隐含期权"

    screening_insights:
      - insight: "流量来源集中度>50%=系统性风险因子——Reddit 63%Google依赖导致一次算法更新-47%市值"
        implication: "选股筛选增加'流量来源集中度'过滤: 单一来源>50%→标记为高依赖风险, 要求更高安全边际"
      - insight: "SBC/Revenue>15%+内部人净卖出=估值质量警告信号"
        implication: "选股时组合检查: SBC/Rev>15% AND 内部人6个月净卖出>净买入 → 标记估值质量风险"
      - insight: "IPO后社交平台增速衰减有规律可循: SNAP IPO+3年增速-40pp, PINS类似"
        implication: "社交平台选股应建立'IPO后增速衰减曲线模板', 对标减速规律评估当前估值隐含的增速假设"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "DAU增长时立刻追问用户质量分层"
      trigger: "平台报告DAU增长>15%且依赖外部流量来源"
      origin: "RDDT总DAU +19%但Logged-in仅+14%, 55%+是零粘性搜索访客——标题数字掩盖了真实增长质量"
      generalization: "所有DAU增长都应分层(注册/匿名/搜索导入/深度/一次性)——单一DAU数字的信息量极低"

    - habit: "看到高利润率时追问'谁在免费工作'"
      trigger: "平台OPM>25%且核心内容由用户/志愿者创造"
      origin: "Reddit OPM 32%但版主回报$0——补偿成本$500M接近全年利润 → 利润率含'未支付负债'"
      generalization: "UGC平台的利润率分析必须检查贡献者经济学——未支付的贡献=隐形负债, 不是运营效率"

    - habit: "P/FCF合理时立刻检查SBC占比"
      trigger: "科技公司P/FCF<40x且SBC/Revenue>15%"
      origin: "RDDT GAAP P/FCF 39x看似合理, 扣SBC后78x → 2倍差距完全改变估值结论"
      generalization: "高SBC公司的GAAP FCF有系统性误导——扣SBC后真实FCF才是股东可分配的现金流"

    - habit: "区分护城河自建 vs 外部恩惠"
      trigger: "公司最大竞争优势依赖外部平台(搜索/分发/监管)"
      origin: "Reddit Google搜索整合不通过Swap Test——不是内部能力而是'地主给的好租约'"
      generalization: "护城河评估增加Swap Test+'控制力'维度: 外部恩惠不计入护城河评分"

  quality_feedback:
    strengths:
      - "DM密度3.32/千字(极高水平) — 813个DM锚点覆盖全报告核心数据"
      - "方法论创新: 版主经济学建模(首创) + DAU质量分层 + SBC真实FCF调整 — 三个独立洞见构成非共识CI基础"
      - "红队七问(RT-1~7)完整执行 — 承重墙压力测试+偏差审计+空头钢人+黑天鹅+替代解释, 对抗性深度充分"
      - "10种估值方法交叉验证 — 离散度2.91x反映核心广告业务确定性较高, 不确定性集中在增速和倍数"
      - "Kill Switch三核监控体系(12个KS分3核) — 递进式风险响应框架, 可迁移设计"
    weaknesses:
      - "框架版本v10.0(报告时间2026-02) — 早于v19.x多项改进(铁律N证据链/铁律M反膨胀/CQI体系)"
      - "无CQI评分 — 报告未使用v17.0+的CQI量化品质框架"
      - "概率赋值主观性较强(特别是Google SEO 4场景概率和版主风险) — 缺乏三重锚定(历史基准率/反例分析/压力测试)"
      - "报告未给出质量数字评分(D1-D11) — 无法与后续报告横向比较"

  hypothesis_tested:
    confirmed:
      - hypothesis: "SBC扣除后真实估值远高于GAAP口径(AMD先例)"
        evidence: "RDDT P/FCF 39x(GAAP) vs 78x(真实) — 2倍差距是AMD之后的又一极端案例"
        confidence_after: "高(两份报告独立确认SBC隐形估值陷阱模式)"

      - hypothesis: "IPO后社交平台增速衰减有规律(SNAP/PINS先例)"
        evidence: "RDDT FY25 +70% → 共识FY26 +41% → FY30 +20% — 衰减曲线与SNAP/PINS高度一致"
        confidence_after: "高(SNAP/PINS/RDDT三例确认)"

    extended:
      - hypothesis: "Reverse DCF承重墙分析(v10.0标准方法)"
        extension: "四墙中增加'用户增长质量'分层(Logged-in vs Logged-out)——传统承重墙用总DAU, 分层后墙3脆弱度从'中-高'升至'高'"

    refuted:
      - hypothesis: "AI数据授权是SaaS式经常性收入(市场共识)"
        evidence: "Q4'25增速骤降至+8% + LLM引用率从14%→2% + 合成数据崛起63% → 更接近一次性消耗"
        lesson: "训练数据的消耗模式应分类: 持续需要(如实时数据feed)vs 一次性训练(如历史语料) — 大部分AI数据授权是后者"

  limitations:
    - "Google算法是黑箱——63%流量依赖的最大风险源不可预测, AI只能概率范围而非精确时间"
    - "版主行为不可建模——10万+去中心化志愿者群体的集体行动不能用历史频率推断"
    - "AI内容渗透速度不可精确预判——14.7%到30%的时间线取决于AI工具进化和Reddit检测能力, 两者都在快速变化"
    - "所有前瞻性财务预测来自卖方共识——AI无独立预测能力优于卖方, 估值精度受限于输入假设质量"
    - "CQ加权置信度仅29.6%(P0.5 40.7%→P5 29.6%, -11.1pp)——报告本身承认对结论的置信度较低"
