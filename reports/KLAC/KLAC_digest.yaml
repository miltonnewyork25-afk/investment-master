      current_reading: "最近一次WFE下行(CY2023)KLA有机收入负增长——基准率仍为5/5"
    - signal: "先进封装TAM的口径校正($8-10B vs管理层$12B)"
      why_alpha: "管理层$12B被广泛引用→校正后增长空间缩小25-33%→影响长期估值模型"
      current_reading: "SEMI/Yole验证$8-10B,口径差异已量化"

  confirmation_signals:
    - signal: "季度Revenue beat/miss vs共识"
      bullish_threshold: "连续3Q beat>5%→FY2027E EPS上修至$50+→P/E(FY2027E)降至29x"
      bearish_threshold: "FQ3 miss>3%→增长放缓信号→P/E压缩启动"
    - signal: "服务业务季度增速(连续增长记录)"
      bullish_threshold: "52Q+连续增长延续→SaaS化叙事增强→估值质量溢价合理"
      bearish_threshold: "增长中断→服务独立性假设受质疑"
    - signal: "先进封装收入占比"
      bullish_threshold: ">15%→从'补充引擎'变'主导引擎'→增长叙事质变"
      bearish_threshold: "<5%且增速<10%→先进封装增长故事破产"

  noise_signals:
    - signal: "卖方目标价调整($1,612-$1,715)"
      why_noise: "卖方普遍用Forward P/E且不做WACC敏感性→目标价系统性偏乐观→自己做Reverse DCF更准"
    - signal: "日度/周度股价波动"
      why_noise: "半导体设备高Beta→日度波动主要反映板块情绪而非KLA特有信息→看季度级别趋势"
    - signal: "AI CapEx总额新闻(Hyperscaler announcements)"
      why_noise: "KLA是AI的间接受益者(传导延迟2-4Q)→AI CapEx新闻对NVDA是alpha,对KLA是噪音"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: AMAT
      similarity: "同为半导体设备前道,类似客户群(TSMC/三星/Intel)"
      key_difference: "AMAT=全品类(沉积+刻蚀+检测) vs KLA=聚焦检测→KLA利润率更高(FCF 31% vs AMAT ~25%)但增速更依赖检测TAM扩张"

    - ticker: LRCX
      similarity: "同为半导体设备专注型(刻蚀聚焦),类似市值体量"
      key_difference: "LRCX PEG 0.74x vs KLA PEG 1.57x→LRCX估值效率2倍于KLA→同等增长敞口下LRCX性价比显著更高"

    - ticker: ASML
      similarity: "同为半导体设备垄断(护城河>8.0),P/E都显著高于行业均值"
      key_difference: "ASML=物理极限垄断(EUV唯一)不可复制 vs KLA=积累型垄断(数据)理论上可追赶"

  comparative:
    - dimension: "护城河深度"
      position: "ASML (8.80) > KLAC (8.40) > AMAT (6.70) > LRCX (6.30)"
      reasoning: "ASML物理垄断>KLA数据积累>AMAT/LRCX规模+技术"

    - dimension: "估值效率(PEG)"
      position: "LRCX (0.74x) > AMAT (1.05x) > KLAC (1.57x) > ASML (1.66x)"
      reasoning: "KLA P/E最高(42.5x)但增速不是最快→PEG暴露估值效率低下"

    - dimension: "利润率质量"
      position: "KLAC (FCF 31%, CapEx/Rev 3%) > ASML > AMAT > LRCX"
      reasoning: "KLA极轻资产模式+服务订阅=行业最优财务质量(ROE 100.7%, ROIC 78.3%)"

    - dimension: "抗周期能力"
      position: "KLAC(检测必需品) > ASML(EUV不可替代) > AMAT > LRCX"
      reasoning: "检测占fab CapEx仅5-7%→经济不对称→WFE下行时检测削减幅度最小(但仍为负增长)"

  industry_position:
    quadrant: "最高利润率 × 最高估值 × 中等增速"
    archetype: "积累型垄断 — 数据飞轮+检测必需品+被动资金推升"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含WFE份额28-32%→在过程控制TAM约束下不可能→暴露P/E 42.5x的不可持续性"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "CI-007温水煮青蛙: P/E渐进压缩+毛利率缓慢侵蚀→最可能路径(30-40%)=没有明确卖出信号"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "系统性悲观校正: 2/3分析偏空→上调CQ +1pp(58.2%→59.2%)→但核心结论(高估)不变"

  novel_patterns:
    - name: "管理层叙事的历史证伪法"
      description: "用全部历史下行周期交叉验证管理层的'抗周期'声称——5/5次负增长直接否定'+8-10%基准增速'"
      transferable_to: ["所有声称有独立增长引擎抗周期的公司", "半导体设备全行业"]

    - name: "TAM口径解构(管理层vs第三方)"
      description: "管理层TAM常包含更广口径(设备+材料+测试)→用SEMI/Yole等第三方窄口径交叉→真实TAM通常小25-40%"
      transferable_to: ["所有管理层宣传TAM的高增长公司", "特别是新兴领域(先进封装/AI基础设施)"]

    - name: "WACC隐含法(市场在赌什么折现率)"
      description: "不是用WACC算目标价,而是反推市场隐含WACC→检验隐含ERP是否在历史合理区间→如果ERP过低=估值脆弱"
      transferable_to: ["所有P/E>30x且DCF敏感性极高的公司"]

    - name: "被动资金正反馈的可逆性评估"
      description: "ETF流入→股价→权重→更多流入的正反馈循环是可逆的→识别边际定价者是谁决定了估值脆弱性"
      transferable_to: ["所有主题ETF权重较高的公司(AI/半导体/新能源/ESG)"]

    - name: "服务业务SaaS化的隐藏估值"
      description: "半导体设备的服务业务(75%订阅+95%续约)可按SaaS估值方法独立定价→揭示被市场忽视的经常性收入价值"
      transferable_to: ["所有有高续约率服务业务的工业/设备公司"]

    - name: "CQ确定性分裂诊断"
      description: "CQ离散度31pp(73%垄断持久性 vs 42%估值合理性)→投资回报高度依赖单一变量(估值)→护城河确定性≠回报确定性"
      transferable_to: ["所有高CQI但高估值的公司(品质确定但价格不确定)"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "积累型垄断(数据+算法+验证)理论上可追赶但需8-12年——与物理垄断(ASML EUV)性质不同"
        implication: "护城河评估应区分'不可复制'(物理垄断)和'可追赶但时间极长'(积累垄断)——后者需监控追赶者进度"
      - insight: "数据网络效应是最强也最敏感的维度——通用AI可能在5-10年内将其削弱"
        implication: "对数据壁垒型公司,必须加入'AI侵蚀速度'作为护城河半衰期的核心变量"
      - insight: "检测设备的不对称定价权(占CapEx 5-7%但不买=良率崩塌)保护周期性Beta但不保护绝对增长"
        implication: "区分'定价权保护'(不砍预算)和'增长驱动'(增加预算)——前者只降低下行幅度,不保证上行"

    valuation_insights:
      - insight: "方法离散度2.35x说明精确目标价无意义——价值在于揭示'所有方法都低于市价'"
        implication: "极高离散度时,报告的价值不是给目标价,而是揭示估值方向(全部方法指向同一方向=信号强)"
      - insight: "WACC隐含法比正向DCF更能暴露估值脆弱性——170bps差异=75%估值差异"
        implication: "高P/E公司必须做WACC隐含分析作为估值的第一步(而非最后一步)"
      - insight: "Forward DCF与FMP机械DCF高度一致可能是'共享保守假设'而非'互相验证'"
        implication: "两个模型结果一致时要追问'假设是否独立'——共享假设的一致性没有信息量"

    screening_insights:
      - insight: "PEG>1.5x + P/E>2x历史中位数 = 估值效率极低的高品质公司(品质陷阱的设备版)"
        implication: "选股筛选增加'P/E vs 历史中位数'倍数过滤——>2x时即使品质优秀也应等待"
      - insight: "边际定价者是被动ETF资金时,估值脆弱性被常规波动率指标低估"
        implication: "选股时检查'被动资金占比'——主题ETF权重>4%的公司估值脆弱性需额外折扣"
      - insight: "服务业务75%订阅+95%续约=隐藏的SaaS资产→可按SaaS估值独立定价"
        implication: "设备公司选股时增加'服务收入占比×续约率'作为质量因子——高值公司底部更有支撑"

# --- Layer 5: Meta-learning (这份报告教了AI什么) ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "管理层增长叙事必须用全部历史下行周期验证"
      trigger: "管理层声称'即使行业下行,我们的独立引擎仍能增长'"
      origin: "KLA 5引擎叙事在5/5次WFE下行中全部失败——管理层从未在下行周期中兑现承诺"
      generalization: "任何'抗周期'声称都必须有≥1次实际下行期的正增长证据→否则只是未经验证的营销话术"

    - habit: "高P/E公司的第一步是WACC隐含分析而非正向DCF"
      trigger: "P/E>30x或显著超过历史中位数"
      origin: "KLA Forward DCF在WACC 9.5%下$835 vs 7.8%下$1,464→170bps=75%→折现率假设比增长假设更重要"
      generalization: "高P/E公司的估值辩论本质上是折现率辩论而非增长辩论→先锁定'市场在赌什么折现率'"

    - habit: "追问边际定价者是谁"
      trigger: "公司在主题ETF中权重>3%或所在板块有大量主题资金流入"
      origin: "KLA被动ETF资金$1.0-1.2B(3年)→边际定价者是趋势跟随型→情绪转向时P/E压缩快且不连续"
      generalization: "边际定价者类型决定了估值下行的速度和形态——被动/趋势型=快速不连续,基本面型=缓慢连续"

    - habit: "TAM口径必须多源交叉验证"
      trigger: "管理层在电话会上宣布TAM数字且市场广泛引用"
      origin: "KLA管理层声称先进封装TAM $12B→SEMI($5-6B)/Yole($8-10B)验证后仅$8-10B→高估25-33%"
      generalization: "管理层TAM通常用最广口径(利于叙事)→第三方窄口径通常小25-40%→影响长期增长模型"

  quality_feedback:
    strengths:
      - "因果推理密度9.28/万字(全报告最高标杆)——每个论点有完整的数据+逻辑+反面证据链"
      - "DM密度2.17/千字(553个锚点)——数据锚定极其扎实"
      - "护城河分析五维度量化+竞品横向对比+敏感性分析+5年预期变化——护城河分析深度标杆"
      - "偏差审计系统性+量化(识别2/3偏空并修正)——红队不是表演而是真正校准"
      - "Reverse DCF暴露WFE份额28-32%隐含假设的荒谬性——估值分析最有区分度的洞见"
    weaknesses:
      - "DCF未用Python验证(v16.0框架限制)——FCFF/折现因子基于手动推算可能有舍入误差"
      - "WFE周期25年仅5-6次完整周期→样本量不足以支撑统计推断"
      - "CQ概率校准含主观判断——不同分析师可能得出不同结论"

  hypothesis_tested:
    confirmed:
      - hypothesis: "检测设备定价权在WFE下行中受保护(占CapEx 5-7%的不对称性)"
        evidence: "5/5次WFE下行期检测削减幅度<沉积/刻蚀→Beta<1确认"
        confidence_after: "高(5/5历史一致)"

      - hypothesis: "服务订阅业务跨周期稳定(52Q连续增长)"
        evidence: "52个季度连续增长跨越多个WFE上下行周期→周期独立性最强的引擎"
        confidence_after: "高(52Q跨多周期验证)"

    extended:
      - hypothesis: "积累型数据壁垒>专利壁垒(知识经济类公司)"
        extension: "KLA的30年缺陷数据库构成8-12年追赶壁垒→从软件(CSGP/Veeva)扩展到硬件+软件混合(检测设备)"

    refuted:
      - hypothesis: "管理层声称的'独立增长引擎'可抗周期"
        evidence: "5/5次WFE下行期KLA有机收入负增长→五引擎在下行中不独立"
        lesson: "周期性公司的'独立引擎'声称几乎从不在下行中兑现——需历史验证不能信口头叙事"

  limitations:
    - "WFE周期预测本质上不可靠——25年仅5-6次完整周期,样本量不足以做统计推断"
    - "地缘政治风险(台湾30%+中国26%收入集中)无法精确概率化——台海冲突概率和出口管制演进都是deep uncertainty"
    - "通用AI对检测壁垒的侵蚀速度是5-10年级别的不确定性——可能是最重要的长期变量但最难预测"
    - "DCF未用Python验证(v16.0框架限制),WACC选择有较大主观性(合理范围7.8-12.3%)"
    - "系统性悲观偏差已识别并部分校正(+1pp CQ),但校正本身可能引入反向偏差"
