# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "积累型垄断如何变成不可追赶"
    chain: >
      30年fab缺陷数据持续积累(15,000台装机基地)
      → 数据训练Klarity算法→准确率>99.5%(竞品96%)
      → 客户用KLA数据建立良率模型(6-18月验证)
      → 新fab默认选KLA(避免重新验证)
      → 更多数据回流→算法更准→份额从50%→63%(2010→2024)
      → 竞争者需8-12年积累同等数据→追赶窗口被锁死
    transferable_to: "所有靠数据积累形成壁垒的公司(Palantir/Veeva/CSGP/检测类)"
    reasoning_habit: "问'数据壁垒的时间维度是什么'——如果需要10年积累且数据不可购买,这比任何专利都强"

  - id: "CC-2"
    name: "WFE零增长叙事的历史证伪"
    chain: >
      管理层声称: WFE零增长下自有引擎仍可驱动+8-10%增速
      → 追问: 历史上WFE下行时KLA表现如何?
      → 5/5次WFE下行期(2009/2013/2016/2019/2023)KLA有机收入均为负增长
      → 追问: 为什么5引擎独立性假设失败?
      → 因为检测需求=f(WFE规模)×f(技术复杂度)→WFE下行时第一项抵消第二项
      → 修正: WFE零增长下真实基准增速+0~+4%(非+8-10%)
      → 投资含义: 下行情景估值需大幅下调,抗周期性被市场高估
    transferable_to: "所有声称有'独立增长引擎'对冲行业周期的公司——历史验证是最硬的证据"
    reasoning_habit: "管理层的增长叙事必须用历史下行周期数据交叉验证——如果从未在下行中生效,就不能假设未来会生效"

  - id: "CC-3"
    name: "WACC敏感性暴露估值的真实锚点"
    chain: >
      Forward DCF@WACC 9.5%=$835/share(-43%)
      → Forward DCF@WACC 7.8%=$1,464(刚好匹配市价)
      → 差距仅170bps但估值差75%
      → 追问: WACC 7.8%合理吗?
      → 无风险利率4.5%→WACC 7.8%意味着ERP仅3.3%(历史低位)
      → 推论: 当前市价几乎完全取决于折现率假设而非基本面预测
      → 投资含义: 利率上行50bps就能让估值下跌20%+(无需基本面恶化)
    transferable_to: "所有P/E>30x的高估值公司——DCF在高估值时对WACC极端敏感"
    reasoning_habit: "高P/E公司必须做WACC敏感性分析——如果结论在WACC变100bps时翻转,估值锚点不可靠"

  - id: "CC-4"
    name: "检测设备的不对称定价权逻辑"
    chain: >
      检测设备占fab CapEx仅5-7%
      → 不买检测的代价=良率崩塌(一条先进产线每月潜在损失数千万美元)
      → 不买检测的代价远大于检测成本(不对称)
      → 因此fab不会在检测上砍预算
      → 在WFE下行周期中检测削减幅度<沉积/刻蚀
      → KLA的周期性Beta<1(相对WFE整体)
      → 但Beta<1不等于正增长——5/5次仍为负增长,只是跌得少
    transferable_to: "所有成本占比低但失败代价极高的必需品(检测/安全/合规类)"
    reasoning_habit: "追问'不买的代价是什么'——如果不买的代价>>买入成本,定价权受保护;但定价权保护不等于收入增长"

  - id: "CC-5"
    name: "被动资金正反馈循环的可逆性"
    chain: >
      半导体ETF(SOXX/SMH)净流入$35-40B(3年)→KLA获~$1.0-1.2B被动买入
      → ETF流入→推高股价→提升ETF权重→更多流入=正反馈
      → 追问: 正反馈可逆吗?
      → 可逆: 板块情绪转向→卖压→股价下跌→降低权重→减少配置→更多卖压=反向螺旋
      → 投资含义: KLA的边际定价者是趋势跟随型(非基本面驱动)→情绪转向时P/E压缩快且不连续
    transferable_to: "所有在主题ETF中权重较高的公司(AI/半导体/新能源)"
    reasoning_habit: "追问'边际定价者是谁'——如果边际定价者是被动资金/趋势跟随者,估值的脆弱性远高于基本面暗示的水平"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "KLA自有增长引擎(5引擎)可在WFE零增长下驱动8-10%增速"
      final: "5/5次WFE下行期均负增长,修正后基准增速仅+0~+4%"
      pivot: "历史回测5/5次WFE下行——最硬的证据直接否定管理层叙事"

    - initial: "先进封装TAM $12B(管理层声称),KLA增长空间广阔"
      final: "SEMI($5-6B)/TechInsights($8-10B)交叉验证后TAM $8-10B,增长空间缩小25-33%"
      pivot: "口径差异(设备vs设备+材料+测试)导致管理层高估TAM"

    - initial: "分析框架系统性偏空(2/3结论偏空)——可能低估了KLA"
      final: "偏差审计后上调CQ+1pp(58.2%→59.2%),但核心结论不变——系统性悲观≠结论错误"
      pivot: "DCF方法论天然低估高增长公司是已知缺陷,但修正WACC至8.5%后仍仅$1,175(vs市价$1,464)"

  surprises:
    - finding: "CD-SEM份额口径混淆: 市场引用45%含OCD,纯SEM口径仅15-20%(Hitachi 70%)"
      implication: "e-beam攻击的是SEM市场→KLA在纯SEM口径的真实份额远低于市场认知→竞争威胁被低估"

    - finding: "Forward DCF $691与FMP机械DCF $692几乎完全一致"
      implication: "两个'独立'模型共享了相同的保守假设→不是互相验证而是共振偏差→$692不应被视为公允价值,而是保守底线"

    - finding: "服务业务SaaS化被低估: 75%订阅+95%续约+52Q连续增长+独立估值$19.7B(占市值10%)"
      implication: "服务业务是隐藏的高质量资产——在WFE下行时提供真正的底部支撑"

    - finding: "温水煮青蛙路径概率最高(30-40%): 非突然崩跌而是P/E渐进压缩+毛利率缓慢侵蚀"
      implication: "最可能路径=缓慢均值回归→没有明确的卖出信号→持有者容易温水煮青蛙"

  blind_spots:
    - area: "WFE周期顶部的精确时间点"
      why_matters: "CY2027-2028可能是第4-5年(接近历史均值)→决定P/E压缩何时启动"
      monitor: "TSMC/三星CapEx指引同比变化 | SEMI设备账单数据月度趋势"

    - area: "先进封装检测在下一次WFE下行中的独立性"
      why_matters: "如果先进封装需求在WFE下行中仍增长→5引擎叙事首次部分验证→改变周期性判断"
      monitor: "先进封装检测收入在WFE下行季度的同比表现"

    - area: "通用AI对检测算法壁垒的侵蚀速度"
      why_matters: "数据网络效应是护城河最强也最敏感的维度(9.0分)→AI缩小差距=护城河核心受损"
      monitor: "AMAT/竞品的AI检测产品发布 | 客户验证通过率 | 准确率差距变化"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "P/E 42.5x(历史中位2.1倍)持有→温水煮青蛙→P/E渐进压缩→回报被估值均值回归吞噬"
      lesson: "周期性设备商在P/E>2x历史中位数时,盈利增长可能无法跑赢估值压缩。应设定P/E上限纪律"
      transferable: "所有周期性公司在P/E显著超过历史中位数时——即使基本面完好"
    - scenario: "大量获利盘(成本<$800)未止盈→概率加权期望回报-38.5%意味着持有期望值为负"
      lesson: "当概率加权期望回报<0时,持有是在用确定性收益赌不确定性上行。税务成本是止盈唯一合理理由"
      transferable: "所有已大幅获利且期望回报转负的持仓"
    - scenario: "边际定价者是被动ETF资金→情绪转向时P/E压缩快且不连续"
      lesson: "判断'谁是边际定价者'比判断'基本面如何'更能预测短期下行幅度。被动资金占比高=波动率被低估"
      transferable: "所有主题ETF权重较高的公司(AI/半导体/新能源)"

