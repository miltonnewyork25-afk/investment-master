# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "广度保险vs深度利剑——通才折价的永久性检验"
    chain: >
      AMAT八产品线覆盖全流程→每线#2-#3→R&D $3.57B分散八线=每线仅50-60%专注型竞对
      → 组合波动率σ从20%降至16%(保险价值=13%波动率优势)
      → 但WFE份额19%五年持平=广度未转化为增量(利剑失效)
      → 市场定价: P/E 29.9x vs LRCX 48.3x/KLAC 42.5x/ASML 48.1x=30-40%通才折价
      → 通才折价60%合理+40%过度——在广度创造增量的证据出现前, 市场可能完全正确
    transferable_to: "所有多产品线公司的广度vs深度权衡(3M/Honeywell/Danaher)"
    reasoning_habit: "看到多线覆盖时追问: 广度带来了份额增长还是仅防御了份额下滑? 如果后者, 广度是保险而非资产"

  - id: "CC-2"
    name: "方法独立性审计——看似收敛实则共享假设"
    chain: >
      五方法估值: DCF $127 / SOTP $191 / 产品线 $177 / 可比 $310-335 / Reverse DCF隐含$355
      → 表面看"五方法交叉验证"——实则DCF/SOTP/产品线法共享90%+核心假设(同一套收入/利润率/WACC/终值)
      → 它们是"同一个分析做了三遍"而非三个独立视角
      → 真正独立的方法只有2.5个: 内生价值锚(DCF族)和市场定价锚(可比法)和Reverse DCF(桥梁)
      → $150-170(内生) vs $310(市场) = $140-180/股"隐性溢价"才是核心张力
      → 方法收敛≠结论可靠——要检查假设独立性而非结论一致性
    transferable_to: "所有使用多方法估值的报告——方法独立性审计应该是标准步骤"
    reasoning_habit: "每次估值收敛时追问: 这些方法共享了多少假设? 如果>50%共享, 收敛是幻觉不是验证"

  - id: "CC-3"
    name: "出口管制单向棘轮——中国收入的不可逆下行"
    chain: >
      BIS出口管制: 2022加严→2023加严→2025加严(附属公司规则)→从未放松
      → $253M罚款=合规漏洞被堵+合规团队更保守审查
      → 即使管制不再加严, 国产替代以每年+10pp自给率推进(北方华创PVD/中微刻蚀/华海清科CMP)
      → 双重不可逆: 政策只紧不松 + 国产替代一旦突破就不会回头
      → 中国收入从30%→low-20s%→可能18%=五年CAGR -12%至-16%
      → 投资含义: 不应把中国收入恢复作为乐观情景, 它是确定性下行曲线
    transferable_to: "所有面临出口管制的半导体公司(LRCX/KLAC/ASML/LAM) + 中国收入占比>20%的科技公司"
    reasoning_habit: "看到地缘风险时检查是否有'棘轮效应': 政策是否只在一个方向移动? 如果是, 概率加权应偏保守"

  - id: "CC-4"
    name: "FCF隐含增速vs历史增速的巨大缺口"
    chain: >
      Reverse DCF: 当前$283.5B市值隐含FCF CAGR 18.8%(5年)
      → 历史FCF CAGR仅4.5%(FY2021-2025)
      → 差距=14.3pp——需要WFE份额扩张+利润率突破28%+中国不恶化同时成立
      → 任何单一信念失败即将评级推入审慎关注(信念反演分析)
      → 当前定价对负面意外几乎零容忍
    transferable_to: "所有市场隐含增速远超历史增速的高估值公司"
    reasoning_habit: "Reverse DCF后立刻对比历史增速——差距>10pp=市场在赌结构性变化, 要追问变化证据"

  - id: "CC-5"
    name: "NVDA桥梁——传导链价值放大50-100x"
    chain: >
      AMAT先进封装设备$1.5-2.0B → CoWoS产能 → HBM制造 → GPU算力
      → HBM4的19步新增工序中AMAT覆盖75%
      → AMAT $1设备产出→对应$50-100的GPU算力价值
      → 这意味着AMAT是AI算力供应链的关键瓶颈节点
      → 但市场将此视为TSMC/NVDA的故事而非AMAT的故事→埋没折价
    transferable_to: "所有处于关键供应链瓶颈位置但被市场归因于下游公司的上游供应商"
    reasoning_habit: "识别传导链中的瓶颈节点——如果上游$1投入产出下游$50+价值, 上游可能被低估"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "EPIC Center $5B投资是近期正面催化剂"
      final: "EPIC当前收入贡献=$0, Samsung合作仅一个月, 正向期望应延迟至FY2028——是FY2028+期权而非当期资产"
      pivot: "红队RT-2创新溢价偏差审计: $0收入事实 + 报告PDRM将+$1.11B/yr与已materialized的负向风险抵消是不审慎的"

    - initial: "五方法估值收敛验证了结论可靠性"
      final: "DCF/SOTP/产品线法共享90%+假设=同一个分析做了三遍, 真正独立方法仅2.5个"
      pivot: "方法独立性审计发现: 真正的张力是内生$150-170 vs 市场$310的二元分歧, 不是五个方法的多元交叉"

    - initial: "AGS独立估值可达$31.9B(EV/Revenue 5x)"
      final: "AGS含40-50%硬件备件, 不应享有纯服务公司倍数, 合理区间$19-26B(3-4x)"
      pivot: "红队AGS估值审计: 5x倍数适用于纯SaaS/订阅服务, 不适用于含大量硬件备件的混合服务"

  surprises:
    - finding: "通才折价可能是永久性结构特征而非暂时性错误定价——WFE 19%份额5年持平是最硬的证据"
      implication: "不应期待通才折价'等周期好转就消失'——19%持平是结构特征, 市场定价可能完全正确"

    - finding: "红队原始建议8个CQ全部下调0个上调——暴露系统性悲观偏差"
      implication: "红队审计本身也有偏差, 需要双向校准机制(过度悲观检测)防止红队成为系统性看空工具"

    - finding: "方法离散度5.3x是已完成报告中最高的(GOOGL 2.1x/PLTR 3.8x/APP 3.3x)"
      implication: "高离散度=估值不确定性极高→应降低仓位sizing而非选择最乐观或最悲观的方法"

    - finding: "BW2+BW8双崩塌极端场景市值$89B(vs报告估计的$130-150B)——报告低估了乘数效应"
      implication: "利润率压缩+估值倍数压缩在同时发生时有乘数效应, 不能简单线性加总"

  blind_spots:
    - area: "WFE周期精确拐点"
      why_matters: "六层雷达73%ile=P3中后期, 但见顶时间差6个月→收入差$3-5B→估值差$40-60/股"
      monitor: "TSMC/Samsung/Intel CapEx季度指引 + SEMI WFE季度更新"

    - area: "EPIC Center实际商业化时间表"
      why_matters: "EPIC是$5B赌注, 从$0到可量化收入需2-3年 | Samsung首家→是否有TSMC/Intel跟进决定期权价值"
      monitor: "EPIC Center客户公告 + FY2027-28是否有独立收入披露"

    - area: "HBM4是否延长DRAM CapEx周期"
      why_matters: "如果HBM4需全新设备(非升级)→DRAM CapEx峰值推迟至CY2028-2029→34%敞口多受益12-18月"
      monitor: "HBM4量产时间表(CY2026H2) + DRAM设备季度支出趋势"

  sell_lessons:
    - scenario: "WFE周期P3中后期(73%ile)仍持有→周期见顶后P/E从30x压缩至18-20x"
      lesson: "周期股在超级周期中后期的卖出纪律=不等见顶确认就开始减仓。73%ile≈开始警惕, 85%ile≈开始减仓"
      transferable: "所有半导体设备股(LRCX/KLAC/ASML) + 周期性资本品公司"
    - scenario: "持有高估值周期股等待催化剂(EPIC/GAA)兑现→催化剂延迟而周期先到"
      lesson: "催化剂有时间表(EPIC 2-3年), 周期也有时间表(WFE 12-18月有效期)——如果周期时间表更短, 周期风险先到"
      transferable: "所有有长期催化剂但短期面临周期风险的公司"
    - scenario: "中国收入从45%Q1峰值→30%→low-20s%仍未减仓——单向棘轮下每次等都错过最佳卖点"
      lesson: "面对单向棘轮风险(出口管制), 应在第一次加严时就部分减仓, 而非等待'缓和信号'(不会来)"
      transferable: "所有面临地缘政治单向棘轮风险的跨国公司"

