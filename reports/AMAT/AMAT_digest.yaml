# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→隐含FCF CAGR 18.8% vs 历史4.5%→七项信念中任一失败即触发评级下调"

    - pattern_id: "scenario_analysis.probability_weighted"
      application: "四场景概率加权(周期逆转15%/现状45%/延续30%/超级周期10%)→EV $277.6B vs $283.5B市值"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1至RT-7七问全覆盖 + 双向校准识别系统性悲观偏差(8个CQ原始全下调→校准后2个上调)"

  novel_patterns:
    - name: "方法独立性审计(Method Independence Audit)"
      description: "DCF/SOTP/产品线法共享90%+假设→看似三方法收敛实则'同一个分析做了三遍'→真正独立方法仅2.5个(内生锚+市场锚+Reverse DCF桥梁)"
      transferable_to: ["所有使用多方法估值的报告", "估值框架方法论升级"]

    - name: "通才折价永久性检验"
      description: "多线覆盖公司的估值折价是暂时性错误定价还是永久性结构特征? 关键证据=份额是否随时间增长。AMAT 19%五年持平=广度未转化为增量=折价可能永久"
      transferable_to: ["3M/Honeywell/Danaher等多元化工业公司", "多线覆盖vs聚焦型的战略选择评估"]

    - name: "红队全下调偏差检测(All-Downward Bias)"
      description: "红队原始建议8个CQ全部下调0个上调→暴露系统性悲观偏差→需要'过度悲观检测'作为红队的红队"
      transferable_to: ["所有使用红队审计的报告", "红队方法论设计"]

    - name: "传导链价值放大倍数(Supply Chain Value Multiplier)"
      description: "上游$1设备投入→下游$50-100算力价值→AMAT是AI算力瓶颈节点但市场归因给TSMC/NVDA→埋没折价"
      transferable_to: ["所有处于关键供应链瓶颈但被市场忽视的上游公司"]

    - name: "出口管制单向棘轮效应"
      description: "地缘政策从未放松(2022/2023/2025三次加严)→概率分布应反映棘轮特征(加严概率远高于放松)→不应给放松>15%概率"
      transferable_to: ["所有面临地缘管制的跨国公司", "地缘风险概率评估框架"]

  framework_contributions:
    moat_insights:
      - insight: "广度护城河的价值=组合波动率降低(保险功能), 不是份额增长(进攻功能)"
        implication: "评估多线覆盖公司时, 应先确认广度是否转化为份额增长——如果没有, 广度的估值溢价应仅限于下行保护"
      - insight: "WFE份额多年持平=广度策略零增量效果的硬证据, 且可能是永久性结构特征"
        implication: "多线覆盖公司的通才折价是否合理, 最直接的检验=份额是否随时间增长"

    valuation_insights:
      - insight: "方法独立性审计: 共享假设>50%的方法'收敛'是幻觉不是验证"
        implication: "多方法估值时必须检查假设独立性——真正独立=使用不同输入源(自己的假设 vs 市场的定价)"
      - insight: "5.3x离散度=估值不确定性极高→仓位sizing应比正常更保守"
        implication: "离散度>3x时, Kelly公式会给出很低的仓位——应尊重数学而非强行建仓"

    screening_insights:
      - insight: "通才折价(P/E 30%+低于同业)可能是永久性而非暂时性——需要份额增长证据才能赌折价收窄"
        implication: "选股时通才折价公司不应自动视为'被低估'——先检查份额趋势"
      - insight: "中国收入>25% + 出口管制棘轮=结构性收入下行→应在筛选时给负分"
        implication: "地缘风险筛选: 中国收入占比>25% + 已有罚款记录→标记为高风险"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "方法独立性审计——估值收敛时追问假设共享度"
      trigger: "多方法估值看似收敛(差距<20%)"
      origin: "AMAT DCF/SOTP/产品线法共享90%+假设→'三方法收敛'实为同一分析做三遍→真正独立方法仅2.5个"
      generalization: "每次多方法估值收敛时, 检查: (1)输入数据是否来自同一来源 (2)假设是否可以独立变化 (3)真正独立的方法有几个"

    - habit: "红队偏差检测——检查红队是否有系统性方向偏差"
      trigger: "红队建议全部或绝大多数指向同一方向(全下调/全上调)"
      origin: "AMAT红队8个CQ原始全下调0上调→暴露系统性悲观偏差→双向校准后2个上调+1.0pp"
      generalization: "红队也有偏差。如果所有调整方向一致(全看空或全看多), 需要'红队的红队'——过度悲观/乐观检测"

    - habit: "Reverse DCF隐含增速vs历史增速的差距检验"
      trigger: "Reverse DCF完成后"
      origin: "AMAT隐含18.8% vs 历史4.5%→差距14.3pp=市场在赌结构性变化但证据不足"
      generalization: "差距>10pp=市场在赌结构性变化, 要追问(1)变化的具体驱动(2)历史有无先例(3)联合概率是否合理"

    - habit: "出口管制棘轮检验——判断地缘风险是否单向"
      trigger: "公司面临出口管制且中国收入>20%"
      origin: "AMAT出口管制2022/2023/2025三次加严从未放松→棘轮效应→概率分布应偏保守"
      generalization: "检查政策历史: 如果过去N次调整全部同一方向, 不应给反向>15%概率"

  quality_feedback:
    strengths:
      - "方法独立性审计是报告最大方法论创新——首次系统性揭示多方法收敛的假设共享问题"
      - "红队RT-1至RT-7七问全覆盖+双向校准提升了对抗审查的平衡性"
      - "DM密度2.16/千字——数据锚定扎实(658个DM锚点)"
      - "Reverse DCF信念反演(七项信念×碎裂分析)是估值章节亮点——追问'几块信念碎裂改变评级'"
      - "CQ系统从P0(50.5%)→P4(63.1%)的完整演化记录——每个调整都有数据支撑"
    weaknesses:
      - "EPIC Center创新溢价偏差——将$0收入项目的+$1.11B/yr期望与已materialized的负向风险在PDRM中抵消"
      - "AGS估值上限偏高(5x EV/Revenue不适用于含硬件服务)——最终被红队修正至$19-26B"
      - "无质量记分卡(D1-D11)——早期报告缺少标准化质量评估"
      - "离散度5.3x是历史最高——说明估值不确定性管理有改善空间"

  hypothesis_tested:
    confirmed:
      - hypothesis: "Reverse DCF必须P1前置(CRM教训)"
        evidence: "Ch10 Reverse DCF有效揭示市场隐含FCF CAGR 18.8%→防止了正向DCF先入为主"
        confidence_after: "高(执行确认)"

      - hypothesis: "红队需要双向校准(防止系统性偏差)"
        evidence: "原始红队8个CQ全下调→双向校准识别2个上调→校准后更平衡(+1.0pp)"
        confidence_after: "高(AMAT是首个发现并系统性修正红队偏差的报告)"

    extended:
      - hypothesis: "通才折价在半导体设备行业中存在"
        extension: "不仅存在(30-40%折价), 而且可能是永久性结构特征——19%份额5年持平是关键新证据"

      - hypothesis: "多方法估值提高可靠性"
        extension: "仅在方法假设独立时成立——AMAT揭示共享假设>90%的方法'收敛'是幻觉→引入方法独立性审计概念"

    refuted:
      - hypothesis: "五方法收敛=结论可靠(传统估值假设)"
        evidence: "DCF/SOTP/产品线法共享90%+假设→收敛反映假设一致性而非结论可靠性"
        lesson: "方法独立性比方法数量更重要——2个真正独立的方法>5个共享假设的方法"

  limitations:
    - "WFE周期精确拐点不可预测(六层雷达73%ile是位置不是时间)——12-18月有效期"
    - "EPIC Center商业化时间表不确定——$0到可量化收入需2-3年, 期间估值只能按期权处理"
    - "出口管制政策变动有效期仅6-12个月——政策风险不可长期预测"
    - "方法离散度5.3x=估值不确定性极高——概率加权EV $277.6B的置信区间很宽"
    - "无标准化质量记分卡(D1-D11)——无法与后续报告直接比较质量"
