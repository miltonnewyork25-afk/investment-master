# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF引擎级分解→市场隐含10年CAGR 28.5%→需收入达$63-76B→在移动广告TAM中需复制META级增速→不现实"

    - pattern_id: "scenario_analysis.probability_weighted"
      application: "四情景概率加权EV $136.5B精确对应当前$132B→市场已效率定价→但概率分布宽度($55-350B)意味着催化剂敏感度极高"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-2发现Phase 1-3存在bearish确认偏差→做空报告在文献中占比过高(30%)→市值-42%后未充分调整bullish证据"

    - pattern_id: "competitive_benchmarking.chinese_competitor_deep_dive"
      application: "五方对决(META/Google/TTD/Moloco/Unity)×6维度矩阵→非对称竞争框架(不同位置争夺同一钱包不同切片)"

  novel_patterns:
    - name: "护城河错位定价(算法vs中介)"
      description: "市场将公司定价为AI公司(算法溢价),但真正的壁垒在中介层网络效应(分发+数据+SDK锁定)→估值锚点错位"
      transferable_to: ["AI驱动的SaaS公司(AI是产品还是渠道?)", "平台型广告公司(自有流量vs中介)", "所有AI概念股(区分AI算法壁垒vs数据壁垒)"]

    - name: "D30归因偏差——跨品类扩展的数学陷阱"
      description: "广告平台在核心品类(短反馈循环)成功→跨品类(长反馈循环)时,归因窗口不匹配导致模型效率下降,真实增量性被系统性高估"
      transferable_to: ["所有广告科技跨品类扩展", "AI模型从高频数据场景迁移到低频场景的效率衰减"]

    - name: "边际ROAS对数衰减模型"
      description: "广告花费规模化时,ROAS按对数递减(库存质量分层+受众耗竭+竞价密度三层机制)→小规模试点ROAS不可线性外推"
      transferable_to: ["所有广告平台的规模化分析", "任何边际收益递减的平台经济学分析"]

    - name: "MoPub式'收购并关闭'——份额来源决定护城河性质"
      description: "通过收购并关闭最大竞品获得份额(MAX从MoPub获得60%)→份额结构性稳固但在反垄断审查下可能被追溯质疑"
      transferable_to: ["所有通过'消灭竞品'而非有机增长获得市场份额的公司"]

    - name: "平台政策红利的双刃剑"
      description: "从平台政策变化中获益(ATT→AXON相对优势)的公司,同一方向的更深收紧可能逆转优势——成就和毁灭来自同一股力量"
      transferable_to: ["所有依赖平台生态的公司(iOS/Android/AWS/Azure)", "监管变化的受益者(受益可逆转)"]

  framework_contributions:
    moat_insights:
      - insight: "AI公司的护城河应区分算法壁垒(可追赶,半衰期2-3年)和中介/数据壁垒(网络效应,半衰期5+年)"
        implication: "护城河评估不能统一给'AI壁垒'一个分数——应按壁垒层分别评估,加权计算"
      - insight: "供给侧垂直整合(MAX中介+AXON优化+Adjust归因)创造六维交叉锁定——比任何单一维度更持久"
        implication: "垂直整合公司的护城河评估应检测'交叉锁定'(解绑一层不够,需同时解绑全部)的冗余度"
      - insight: "持续创新型护城河(需不断升级证明优越性)与结构型护城河(一次建成长期有效)的估值应不同"
        implication: "持续创新型给shorter half-life和higher discount rate; R&D/收入比值是持续创新型护城河的健康度指标"

    valuation_insights:
      - insight: "B型Discovery System中概率加权EV≈市价不等于'合理'——需看概率分布的不对称性方向"
        implication: "高不确定性公司的估值需补充不对称性分析(上行概率×幅度 vs 下行概率×幅度)作为决策变量"
      - insight: "引擎级Reverse DCF分解(游戏$58B+电商$12-27B+CTV$3-5B+期权$42-59B)使投资者能独立评估每个引擎"
        implication: "多引擎公司应引擎级分解→使隐含期权定价显性化→与基本面估值对比检测'信仰溢价'"
      - insight: "Fwd P/E和TTM P/E讲述截然不同故事时(19x vs 40x),需追问哪个更可信——答案取决于共识是否会被下修"
        implication: "选股筛选应标记Fwd P/E和TTM P/E差距>50%的公司为'共识敏感型'——需评估下修风险"

    screening_insights:
      - insight: "平台依赖度100%(iOS+Android)的公司面临存亡级政策风险——应在筛选中折价"
        implication: "筛选增加'平台依赖度'维度: 100%依赖单一/双平台→标记为高风险; 自有平台→折价更小"
      - insight: "R&D/收入<5%的科技公司要么效率极高,要么在消耗护城河存量而非投资增量"
        implication: "筛选增加'R&D可持续性'检查: 持续创新型护城河+R&D<5%=红旗"
      - insight: "电商期权隐含定价可通过SoTP反推(市值-核心业务合理估值=隐含期权)→与基本面期权估值对比"
        implication: "SoTP反推隐含期权定价应成为多引擎公司的标准筛选步骤——隐含/基本面>2x=信仰溢价警告"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "看到AI公司时,追问'如果AI被追平还剩什么'"
      trigger: "公司被市场定价为AI公司(P/E溢价归因于AI能力)"
      origin: "CI-1: AXON可在3-5年被追平,但MAX中介60%份额+SDK锁定不可复制→真实壁垒不在AI"
      generalization: "区分'AI是产品'vs'AI是分发渠道的附属'——后者的壁垒在渠道不在AI"

    - habit: "广告平台跨品类扩展时,检查归因窗口与品类复购周期的匹配度"
      trigger: "广告公司宣布从核心品类(游戏/社交)扩展到新品类(电商/CTV)"
      origin: "D30归因偏差: 游戏D7→电商D30, 反馈慢4-5x, 真实增量性仅30-50%"
      generalization: "归因窗口与品类复购周期不匹配→模型效率下降→增量性被高估→规模化后客户流失"

    - habit: "小规模ROAS不可线性外推——用边际衰减模型验证规模化潜力"
      trigger: "看到惊人的广告ROAS数据(尤其是试点/beta阶段)"
      origin: "AXON电商ROAS 5.5x(@$5K)→1.6x(@$2.5M), 衰减71%——库存分层+受众耗竭+竞价密度三层机制"
      generalization: "所有广告平台的ROAS都按对数递减——scale时永远比trial差"

    - habit: "从平台政策获益时,同时评估'政策再加一档'的反向风险"
      trigger: "公司从Apple/Google/AWS等平台政策变化中获益"
      origin: "CI-6: APP从ATT获益→但下一轮收紧(应用内fingerprinting)可能逆转红利"
      generalization: "平台政策红利是反脆弱的反面——成就和毁灭来自同一股力量"

  quality_feedback:
    strengths:
      - "Discovery System B型方法论——概率加权四情景替代单一目标价,承认了真实不确定性"
      - "引擎级Reverse DCF分解——将$229B EV拆至游戏/电商/CTV/期权四层,使隐含假设显性化"
      - "7个CI从Phase 0到Phase 5的完整验证演化——每个非共识假说都有明确的验证/弱化/否定路径"
      - "DM密度2.39/千字(1258个锚点)——数据基础扎实,远超1.5/千字门槛"
      - "做空报告钢人检验(Ch20)——假设做空者完全正确的方法论提供了概率框架而非情绪反应"
    weaknesses:
      - "Phase 1-3的$228B锚定→Phase 4发现市值已-42%→叙事需大幅修正——市场速度快于分析节奏"
      - "电商数据空白——$1B ARR来自管理层口头声明,CQ2置信度仅30%——基础数据可靠性本身不确定"
      - "AXON技术黑箱——算法架构基于公开专利/招聘JD/第三方评论推理重构,非直接代码/架构文档"
      - "中国关联风险评估较浅(DM-REG-044)——CFIUS/国会风险可能被低估"

  hypothesis_tested:
    confirmed:
      - hypothesis: "护城河在中介平台而非AI算法(CI-1)"
        evidence: "Moloco可3-5年追平AXON算法但推出中介层需更长时间; MAX SDK锁定+MoPub遗产是更持久壁垒"
        confidence_after: "中(55%——需MAX份额未来2年维持55%+确认)"

      - hypothesis: "概率加权EV可精确定价高不确定性公司"
        evidence: "四情景加权EV $136.5B vs 当前$132B差距仅3.4%——市场已接近效率定价"
        confidence_after: "高(方法论验证,数学清晰)"

    extended:
      - hypothesis: "平台政策双刃剑(从ATT红利推广)"
        extension: "ATT不仅帮助了APP(CI-6),其15-25%的红利可能来自灰色实践→合规化将缩小红利→政策红利和政策风险是同一枚硬币的两面"

    refuted:
      - hypothesis: "DPO 360天是制度性优势=免费浮存金(CI-4)"
        evidence: "经济DPO仅120-180天,实际浮存金$249M(非$747M),年化价值约$12M; 无合同/监管保障"
        lesson: "会计指标(DPO)与经济现实(实际浮存金)可能差异巨大——不能直接将会计DPO等价于经济优势"

  limitations:
    - "电商核心数据(收入/留存/ROAS)来自管理层口头声明而非财报披露——CQ2的基础不可靠"
    - "AXON算法黑箱——技术分析基于推理重构而非直接架构文档,灰色实践程度不确定"
    - "SEC调查信息极度有限——概率建模基于历史案例统计,每个SEC调查有独特因素"
    - "Moloco作为未上市公司数据不完整——竞争格局中最大不确定性来源"
    - "中国关联风险未充分评估——CFIUS/国会调查是未定价的尾部风险"
    - "报告跨越$228B→$132B市值周期——Phase 1-3的bearish基调在$132B下可能过度,Phase 4修正但叙事连贯性受影响"
