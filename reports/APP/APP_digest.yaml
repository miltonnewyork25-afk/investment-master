      bullish_threshold: "2026 Q4仍无Wells Notice(关闭概率升至30-40%)"
      bearish_threshold: "Wells Notice发出+正式指控(S1概率上调)"
    - signal: "WWDC 2026 Apple隐私政策更新"
      bullish_threshold: "未宣布应用内fingerprinting限制"
      bearish_threshold: "宣布应用内SDK层面数据采集禁令+12个月执行期"

  noise_signals:
    - signal: "短期股价波动(日度/周度)"
      why_noise: "Beta 2.49意味着宏观因素(利率/大盘情绪)对短期股价影响>基本面; 做空报告引发的单日波动是情绪而非信号"
    - signal: "管理层电商ARR口头声明"
      why_noise: "从未在财报中单独披露电商收入; 口头声明的定义标准不明(注册vs活跃vs付费); 等第三方验证"
    - signal: "Sell-side目标价调整"
      why_noise: "分析师共识隐含电商期权$32-49B→远超基本面估值$5-25B→sell-side定价含大量叙事溢价"

