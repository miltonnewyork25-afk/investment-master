# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "AI分裂体定价错误的因果链"
    chain: >
      Adobe同一公司内6条业务线对AI反应截然不同(CC消费-9/Firefly+9.4)
      → 市场用二元框架('好or坏')→无法处理分裂体→默认用最差业务线PE定价
      → Forward PE 9.6x定价了'统一受害者'→但AIAS净影响+0.42='偏受益'
      → 单一PE对分裂体必然错误→必须双引擎SOTP(Consumer 6-8x+Enterprise 20-23x)
      → SOTP $527远高于单一PE $252→$275差额=分裂体被误定价的金额
    transferable_to: "所有同时被AI利好和利空冲击的公司(CRM/ADSK/INTU等SaaS)"
    reasoning_habit: "遇到'AI对X公司好还是坏'的问题时→先拆业务线逐条评估→然后检查市场是否在用最差业务线定价全公司"

  - id: "CC-2"
    name: "SPOF信念冲突——市场隐含假设的内部矛盾检验"
    chain: >
      Reverse DCF反推市场隐含g≈0%
      → 市场必须同时相信4个信念: FCF不增长+利润率下降+AI是负面+增速归零
      → 但Q1 OPM 47.4%创新高(否定信念2)+FCF+26%(否定信念1)+管理层100% beat(否定信念4)
      → 4个信念之间存在逻辑矛盾(FCF不增长但OPM创新高?)
      → 市场至少需要放弃1个信念→放弃任何1个→PE都应>12x
      → 从$252到PE 12x=$304→至少+20%的'逻辑必然'上行
    transferable_to: "所有极低PE公司——用Reverse DCF反推隐含假设→检验假设间逻辑一致性→SPOF测试"
    reasoning_habit: "看到极低估值时不要直接说'低估'——先反推市场在赌什么→再检验这些赌注是否自洽"

  - id: "CC-3"
    name: "护城河迁移的时间错配风险"
    chain: >
      旧护城河(CC工具层/品牌)线性衰减→从FY2026就开始(-5-10%/年)
      → 新护城河(GenStudio治理层/CC信任层)指数增长→但FY2028-2029才真正加速
      → FY2026-2027是'真空期'——旧流失>新增长
      → 如果真空期内出现负面催化剂(CEO失败/GenStudio失速/Canva突破)
      → 市场不会等到FY2028就判'迁移失败'→PE进一步压缩
      → 投资时机的核心矛盾: 最便宜的时候也是最不确定的时候
    transferable_to: "所有正在进行护城河迁移的公司(从旧业务转向新业务)"
    reasoning_habit: "护城河迁移不是'新替代旧'那么简单——追问时间错配: 旧的什么时候衰、新的什么时候起、中间有没有真空期"

  - id: "CC-4"
    name: "偏好型vs制度型嵌入——护城河半衰期的根本差异"
    chain: >
      Adobe的C1嵌入60%是偏好型(用户习惯/品牌忠诚)→半衰期5-10年
      → FICO的C1嵌入50%是制度型(监管强制/法律要求)→半衰期>30年
      → 偏好型可被替代品侵蚀(只需用户换工具)→制度型需修改法律才能绕过
      → 这解释了FICO PE 25x vs Adobe PE 9.6x的核心逻辑
      → Content Credentials如被EU AI Act采纳→偏好型升级为制度型→半衰期从8→22年→PE从9.6x→15-20x
      → 制度化是Adobe估值'相变'的关键条件
    transferable_to: "所有软件/SaaS公司的护城河评估——区分偏好型(可侵蚀)vs制度型(几乎永久)"
    reasoning_habit: "评估护城河时追问'客户不用需要什么代价'——如果只是不便(偏好型)vs监管处罚(制度型)→估值倍数应截然不同"

  - id: "CC-5"
    name: "模型超市策略比自研模型是更深的护城河"
    chain: >
      AI模型会commoditize(每6个月新SOTA)→自研最强模型是不可持续的竞争策略
      → Adobe在PS中集成Firefly+Gemini+FLUX+Runway=模型超市
      → 类比: iPhone AppStore>任何单个App→因为平台聚合了生态
      → 竞品要挑战Adobe→不是要做'更好的模型'→而是要复制'模型超市+30年专业工作流'
      → 模型可替换但工作流一旦嵌入企业流程极难更换
      → AIAS B3从v1.0的+2上调至+3→模型超市给Adobe'模型commoditize也不怕'的缓冲
    transferable_to: "所有面临AI模型替代风险的软件公司——平台聚合策略vs单一模型策略"
    reasoning_habit: "看到公司说'我们有最强AI模型'时→问'如果模型commoditize怎么办'→平台聚合>单一模型"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "Adobe v1.0: 关注(偏深度关注)→期望回报+68%→CQI 3.2/5"
      final: "v2.0: 关注→期望回报+50%→CQI 2.9/5→更保守更诚实"
      pivot: "v1.0骨架扩写导致实际质量~3.0(自评4.55)→v2.0修正Consumer倍数(8-12x→6-8x)+AIAS(+0.75→+0.42)+C1五层分析揭示偏好型嵌入60%"

    - initial: "Adobe CC有强护城河(CQI 3.2)"
      final: "CC护城河以偏好型为主(60%)→半衰期仅8年→CQI降至2.9"
      pivot: "C1五层FICO式分析: 偏好型60%+操作习惯20%+制度型仅10%→加权半衰期~8年(vs FICO ~30年)"

    - initial: "AIAS v1.0净影响+1.04(未红队)→Adobe是强AI受益者"
      final: "AIAS v1.1净影响+0.42(红队后)→'AI重组者偏受益'但区间包含负值[-0.35,+1.00]"
      pivot: "三路径红队折扣30%: 企业端乐观偏差(-0.10)+确认偏差(-0.04)+IBM路径锚定(-0.04)→+FVF一线验证校准"

  surprises:
    - finding: "Forward PE 9.6x——利润率全维度SaaS行业#1的公司获得了估值倒数#1的定价"
      implication: "矛盾只能通过'市场认为利润率不可持续(AI侵蚀)'解释→但Q1 OPM 47.4%创新高直接反驳→定价错误"

    - finding: "GenStudio ARR突破$1B(+30%)但市场几乎未定价——因为合并分部后DX数据不可见"
      implication: "Enterprise Engine(GenStudio+Foundry+AEP)的价值被'Digital Media标签'掩盖→类似AWS被'电商'标签掩盖"

    - finding: "分裂定价权——高端3.5/5+低端2.0/5→加权3.0/5→市场用低端2.0定价全公司"
      implication: "高端(F500)ETLA定价权在加强(AI附加值)→低端(SMB/Consumer)被Canva免费挤压→定价权也是分裂体"

    - finding: "Adobe回购/OCF连续2年>100%(FY2024 117%/FY2025 113%)——借钱回购"
      implication: "唯一连续2年回购超OCF的科技巨头→资本配置纪律极差→$35.7B回购如用于AI→Firefly可能9/10而非当前水平"

  blind_spots:
    - area: "新CEO人选和战略方向"
      why_matters: "CEO是置信度最大拖累(35%→拉低总置信度到55%)→决定Adobe走Microsoft路径还是IBM路径"
      monitor: "2026.6-9 CEO公告 | 内部(Belsky/Wadhwani) vs 外部(AI-native/SaaS) | 战略方向声明"

    - area: "GenStudio增速持续性(仅1Q数据)"
      why_matters: "GenStudio是整份报告估值的'承重墙'——增速<15%→Enterprise Engine倍数从20x→15x→SOTP下调$100-150/股"
      monitor: "FY2026 Q2-Q3 GenStudio ARR增速 | NRR是否>110% | 付费客户数(从未披露)"

    - area: "CC专业seat是正增长还是负增长(Adobe不披露)"
      why_matters: "seat增长→收入增长=价量齐升; seat下降→仅靠提价=可持续性差→市场最大恐惧"
      monitor: "ARR增速vs收入增速差异(ARR>收入=净新增为正) | Q2 FY2026数据"

    - area: "AI推理成本对利润率的真实影响"
      why_matters: "市场恐惧'AI成本吃掉利润'→但Ch11验证推理成本<1pp OPM影响→需持续监控"
      monitor: "季度OPM趋势(当前47.4%) | Nvidia合作后推理成本是否下降"

  sell_lessons:
    - scenario: "v1.0质量~3.0但自评4.55→骨架扩写导致碎片化→v2.0全面重写"
      lesson: "骨架扩写(先写结构再填内容)=质量最差的写法→深度优先(完整推导链)才能产生真正的分析价值"
      transferable: "所有深度研究报告的方法论——一次写对>多轮补丁"

    - scenario: "SaaSpocalypse中Adobe从$423→$252(-41%)→市场恐慌+行业系统性重估"
      lesson: "行业性恐慌中约20pp PE压缩可逆(利率+CEO)→但需要区分可逆vs不可逆成分→不可逆(增速回归)不应在回测中计入'低估'"
      transferable: "所有遭遇行业性PE压缩的高质量公司——拆解PE下跌成分判断可逆性"

    - scenario: "Adobe在$400+时无人说高估→在$252时所有人说AI会杀死Adobe"
      lesson: "PE 9.6x已经定价了大量负面信息→下行空间(-$70)远小于上行空间(+$130)→恐慌创造不对称机会"
      transferable: "所有FCF Yield>8%的高利润率公司在恐慌中的行为模式"

