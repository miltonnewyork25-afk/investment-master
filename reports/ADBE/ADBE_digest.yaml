      current_reading: ">$1B ARR, +30% (仅1Q数据)"
    - signal: "CC专业seat净增长(推断)"
      why_alpha: "市场最大恐惧='seat在流失'→但Adobe不披露→只能通过ARR vs 收入增速差异推断→大多数分析师不做这个推断"
      current_reading: "推断为持平或微正(ARR增速≈收入增速)→但不确定"
    - signal: "Firefly独立ARR及Credit弹性"
      why_alpha: "Firefly从嵌入功能升级为独立产品(Standard/Pro/Premium)→Credit变现弹性决定ARR天花板→Unlimited Promo结束后弹性数据即将可得"
      current_reading: ">$250M ARR, QoQ+75% | Unlimited Promo 2026.3.18结束"

  confirmation_signals:
    - signal: "季度OPM趋势"
      bullish_threshold: ">45%(维持或创新高→AI成本担忧证伪)"
      bearish_threshold: "<42%(连续2Q→竞争压力/AI成本开始侵蚀)"
    - signal: "FCF年化增速"
      bullish_threshold: ">5%(核心赌注'FCF>2%增长'轻松跨过)"
      bearish_threshold: "<0%(FCF下降→市场'零增长'假设被确认)"
    - signal: "新CEO公告及背景"
      bullish_threshold: "AI-native或企业SaaS背景+6个月内确定"
      bearish_threshold: "PE背景/非科技+搜索>9个月"

  noise_signals:
    - signal: "Canva MAU数字"
      why_noise: "Canva 265M MAU远超Express 80M→但Canva用户主要是SMB/Consumer(低ARPU)→不直接竞争Adobe Enterprise(占ARR 51%)"
    - signal: "AI模型排行榜(Midjourney/DALL-E vs Firefly)"
      why_noise: "模型超市策略意味着Adobe不需要最强模型→只需要最好的聚合平台+工作流→模型排名是噪音"
    - signal: "Daily股价波动与卖方目标价调整"
      why_noise: "卖方用单一PE估值分裂体→系统性失真→Goldman $220用最悲观假设→自己算比看卖方更准"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: CRM
      similarity: "同为AI分裂体SaaS, 增速接近(12% vs 12%), PE接近(13x vs 9.6x)"
      key_difference: "CRM飞轮悖论(Agent成功→seat减少=加速器同时是刹车器) | Adobe的分裂在业务线间而非同一业务线内"

    - ticker: ADSK
      similarity: "同为创意/设计SaaS, 面临AI冲击, PE被压缩"
      key_difference: "ADSK更纯粹的CAD/建筑→AI影响更可预测 | Adobe业务线更分散→分裂体现象更极端"

    - ticker: INTU
      similarity: "同为高利润率SaaS(80%+ margins), 有强品牌+切换成本"
      key_difference: "INTU护城河更深(TurboTax=税务制度嵌入)+AI影响更正面(SMB会计自动化→TAM扩大) | PE 25x+反映市场认可"

  comparative:
    - dimension: "利润率"
      position: "ADBE (OPM 47%/FCF 42%) > INTU (40%/35%) > CRM (30%/28%) > ADSK (35%/25%)"
      reasoning: "Adobe利润率在SaaS行业全维度#1→但估值倒数#1→矛盾最极端"

    - dimension: "AI影响清晰度"
      position: "INTU (正面) > ADSK (中性偏正) > CRM (分裂) ≈ ADBE (分裂最极端)"
      reasoning: "ADBE 6条业务线×5种AI影响=30个评估点→复杂度最高→市场用最简单框架定价→错误最大"

    - dimension: "估值吸引力(Forward PE)"
      position: "ADBE (9.6x) >> CRM (13x) > ADSK (20x) > INTU (25x)"
      reasoning: "ADBE PE 9.6x是SaaS行业最低→但利润率最高→PE/利润率比值是所有同行中最极端的错配"

    - dimension: "护城河持久性"
      position: "INTU (制度型/税务) > ADBE (偏好型+制度潜力) > CRM (平台生态) > ADSK (工作流)"
      reasoning: "INTU税务嵌入类似FICO→半衰期>20年 | ADBE如果Content Credentials制度化→可接近INTU"

  industry_position:
    quadrant: "最高利润率 × 最低估值 × 最高AI不确定性"
    archetype: "AI分裂体——同一公司内受害侧(CC Consumer)和受益侧(Firefly/GenStudio)共存→市场无法定价→默认用最差情景"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含g≈0%→但FCF+26%/OPM创新高→隐含假设与现实严重矛盾"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "7个RT红队→AIAS从+0.60→+0.42(-30%)→三路径折扣(企业端/确认偏差/IBM锚定)各自有数据锚定"

    - pattern_id: "competitive_benchmarking.chinese_competitor_deep_dive"
      application: "不适用(无中国竞品)→但Canva深度分析(265M MAU/Magic Layers/免费Affinity)使用了类似竞品量化框架"

  novel_patterns:
    - name: "AI分裂体双引擎SOTP"
      description: "对AI影响方向分裂的公司→拒绝单一PE→按受害侧(低倍数)+受益侧(高倍数)分别估值→差额=市场错定价金额"
      transferable_to: ["CRM", "ADSK", "所有同时被AI利好和利空的SaaS"]

    - name: "AIAS v1.1 (AI Software Impact Assessment System)"
      description: "5种威胁(S1-S5)+4种受益(B1-B4)×N条业务线→含FVF一线验证+演绎衰减系数+动态权重模拟→标准化AI冲击量化"
      transferable_to: ["CRM(已预评)", "NOW(已预评)", "ADSK(已预评)", "所有SaaS公司"]

    - name: "SPOF信念冲突检验(从KLAC迁移)"
      description: "反推市场隐含的N个信念→检验信念间逻辑一致性→如果存在矛盾→市场至少需要放弃1个→每放弃1个→PE修复一段"
      transferable_to: ["所有极低估值公司——检验市场悲观假设的自洽性"]

    - name: "C1五层嵌入分析(从FICO迁移)"
      description: "将C1(制度嵌入)拆为5层: 制度型/操作习惯/偏好型/合同/网络→按层计算半衰期→加权→揭示护城河真实持久性"
      transferable_to: ["所有B2B SaaS的切换成本评估——区分偏好型(可侵蚀)vs制度型(几乎永久)"]

    - name: "分裂定价权(高端vs低端分层)"
      description: "定价权不给统一Stage→按客户层(F500/大中型/SMB/Consumer)分层评估→加权→可能发现'定价权剪刀差'"
      transferable_to: ["CRM(F500 Stage4/SMB Stage2)", "所有客户层差异大的SaaS"]

    - name: "护城河迁移量化追踪+真空期识别"
      description: "旧护城河衰减(线性)+新护城河增长(指数)→交叉点分析→识别真空期(旧>新)→量化迁移净效应"
      transferable_to: ["所有正在进行商业模式转型的公司"]

  framework_contributions:
    moat_insights:
      - insight: "偏好型嵌入(60%)vs制度型嵌入(10%)→半衰期差3-4倍→解释了同是'强护城河'但PE可以差2.5倍(FICO 25x vs ADBE 9.6x)"
        implication: "护城河评估必须区分嵌入类型→偏好型给低倍数/制度型给高倍数→单一'护城河评分'不够"
      - insight: "护城河可以迁移(从工具层→治理层→信任层)→但迁移有真空期→真空期是最大风险"
        implication: "护城河分析应加入时间维度——不只是'当前多强'而是'正在变强还是变弱+变化速度'"
      - insight: "模型超市>单一最强模型→平台聚合是AI时代的正确护城河策略"
        implication: "评估AI公司护城河时→问'如果模型commoditize后还剩什么'→工作流+平台聚合>模型质量"

    valuation_insights:
      - insight: "AI分裂体不能用单一PE→必须双引擎SOTP→差额=$275=巨大的方法论误差"
        implication: "所有AI冲击方向分裂的公司应强制双引擎估值→发现被单一PE掩盖的错定价"
      - insight: "SPOF信念冲突检验比正向DCF更有力→因为它检验市场假设的自洽性而非分析师假设的正确性"
        implication: "极低估值公司优先用SPOF→Reverse DCF+信念分解+矛盾检验→比正向DCF更客观"
      - insight: "FCF Yield 9.3%+'FCF增速2%就够了'→将复杂AI辩论简化为单一可验证低门槛问题"
        implication: "估值结论应该可以简化为一个投资者能自己验证的简单问题"

    screening_insights:
      - insight: "利润率#1但PE倒数#1=极端矛盾→在任何合理情景下都指向低估→筛选器应标记此类公司"
        implication: "选股筛选增加'利润率-PE矛盾'因子: 利润率排名前20%但PE排名后20%→标记为错定价候选"
      - insight: "AI分裂体是SaaS行业的新常态→需要专门的筛选逻辑(AIAS预评)"
        implication: "选股框架增加'AI分裂度'维度→高分裂度+正净影响→错定价概率最高"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "遇到'AI对X好还是坏'时→拒绝二元回答→拆业务线逐条AIAS评估"
      trigger: "任何面临AI冲击的多业务线公司"
      origin: "Adobe 6条业务线AIAS从-9到+9.4→净影响+0.42→二元框架完全失效"
      generalization: "AI冲击几乎从不是'统一好'或'统一坏'→分裂是常态→单一PE是系统性错误"

    - habit: "看到极低PE时→先Reverse DCF反推隐含假设→再SPOF检验假设自洽性"
      trigger: "Forward PE < 行业均值50%"
      origin: "ADBE PE 9.6x隐含g=0%→但FCF+26%+OPM创新高→4个隐含信念互相矛盾"
      generalization: "极低PE不意味着低估→但如果隐含假设自相矛盾→大概率是市场定价过度悲观"

    - habit: "护城河分析必须区分嵌入类型→然后问'半衰期是多少'"
      trigger: "评估任何B2B SaaS的切换成本/制度嵌入"
      origin: "ADBE偏好型60%→半衰期8年 vs FICO制度型50%→半衰期30年→PE差2.5x"
      generalization: "护城河评分相同的两家公司→嵌入类型不同→PE应该不同→必须拆分评估"

    - habit: "v2.0重写>v1.x补丁——第一次写对比多轮补丁更有效"
      trigger: "v1.0质量<3.5分时决策: 补丁还是重写?"
      origin: "ADBE v1.0自评4.55/实际~3.0→骨架扩写导致碎片化→v2.0全面重写→质量显著提升"
      generalization: "深度优先(完整推导链)+铁律#6(禁止骨架扩写)+铁律#7(禁止Phase内中断)=质量基础"

  quality_feedback:
    strengths:
      - "AIAS v1.1——首创AI冲击量化框架并在CRM/NOW/ADSK上验证可迁移性→方法论原创性极高"
      - "SPOF信念冲突检验(从KLAC迁移)——证明市场4个隐含信念自相矛盾→最有说服力的低估论证"
      - "双引擎SOTP解决分裂体估值问题——方法论对症下药"
      - "C1五层嵌入分析(从FICO迁移)——揭示偏好型60%→半衰期仅8年→比v1.0的笼统3.2更诚实"
      - "v2.0比v1.0全面保守(CQI 3.2→2.9/推荐$440→$400/AIAS+0.75→+0.42)→更诚实"
    weaknesses:
      - "v1.0质量~3.0(自评4.55)——骨架扩写导致碎片化→v2.0虽修正但说明第一次未写对"
      - "GenStudio数据仅1Q→Enterprise Engine论点的基础偏弱→红队RT-1正确指出这一点"
      - "CEO置信度35%严重拖累总置信度→报告对此无法给出更多分析(信息不存在)"
      - "DM密度~1.08/千字→合格但不优秀(vs CME 2.82)→部分章节数据锚定仍可加密"

  hypothesis_tested:
    confirmed:
      - hypothesis: "分裂定价权(CRM v2.0发现) — 高端加强+低端流失"
        evidence: "ADBE高端3.5/5(ETLA AI附加值)+低端2.0/5(Canva免费挤压)→独立验证相同模式"
        confidence_after: "高(CRM+ADBE双验证)"

      - hypothesis: "Reverse DCF必须P1前置(铁律O)"
        evidence: "Ch10 Reverse DCF有效翻译市场信念(g=0%)→防止了v1.0的结论先行偏差"
        confidence_after: "高(多份报告确认)"

      - hypothesis: "骨架扩写=质量最差的写法(铁律#6)"
        evidence: "v1.0骨架扩写→实际~3.0 vs 自评4.55→v2.0深度优先→质量显著提升"
        confidence_after: "高(反面案例确认)"

    extended:
      - hypothesis: "飞轮悖论(CRM发现)"
        extension: "ADBE的分裂体是飞轮悖论的变体→不是同一产品的加速+制动→而是不同产品线各自方向不同→分裂体概念比飞轮悖论更泛化"

      - hypothesis: "C1五层嵌入(FICO/CPRT)"
        extension: "ADBE应用C1五层→偏好型60%→半衰期8年→加入'制度化升级路径'(Content Credentials)→C1分析从静态扩展为动态(可升级)"

    refuted:
      - hypothesis: "v1.0 AIAS净影响+1.04→Adobe是强AI受益者"
        evidence: "v2.0红队+FVF+演绎衰减→+0.42且区间含负→'偏受益'而非'强受益'"
        lesson: "未红队的AIAS高估~60%(+1.04 vs +0.42)→AIAS必须含红队折扣才可信"

  limitations:
    - "CEO交接是最大不确定性→报告对此无法提供更多分析(信息尚不存在)→只能概率加权6种情景"
    - "GenStudio仅1Q数据→Enterprise Engine论点需FY2026 Q2-Q3连续验证→可能被证伪"
    - "AIAS v1.1仅在4家公司(ADBE/CRM/NOW/ADSK)上验证→框架可靠性需更大样本"
    - "CC seat增长无法直接获得(Adobe不披露)→只能间接推断→推断误差可能±5pp"
    - "Content Credentials制度化概率(~30%)是主观估计→实际可能更高或更低→对估值影响±$100/股"
