      current_reading: "+$231M(FY2025), 需要Revenue翻倍或SBC削减50%才能实质性改善"

  confirmation_signals:
    - signal: "有机Bookings增速(剔除价格效应)"
      bullish_threshold: ">30% YoY连续2季(有机增速强劲确认)"
      bearish_threshold: "<20% YoY(增速正常化快于预期→长期CAGR 13-18%锚定)"
    - signal: "18+用户占比(独立验证口径)"
      bullish_threshold: ">35%(年龄扩展叙事获验证→TAM对标社交平台)"
      bearish_threshold: "<25%(品牌锁定在'儿童游戏'→TAM锚定儿童娱乐)"
    - signal: "广告Revenue季度规模"
      bullish_threshold: "年化>$500M(增长引擎叙事获部分验证)"
      bearish_threshold: "年化<$200M(三重约束压制天花板确认)"

  noise_signals:
    - signal: "DAU绝对数增长"
      why_noise: "DAU增长可能由低龄下探+地理扩张驱动→不代表经济价值增长; 74.5%从未消费→看付费渗透率比看DAU更有信息量"
    - signal: "卖方目标价调整"
      why_noise: "卖方普遍用报告FCF+管理层年龄口径→130%+定价鸿沟说明卖方框架系统性偏乐观"
    - signal: "Bookings绝对增速(含价格效应)"
      why_noise: "FY2025 +55%含15-20ppt价格上调→有机增速+35-40%更有信息量→看有机增速而非报告增速"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: SNAP
      similarity: "同为年轻用户社交/内容平台, 同样高SBC/Revenue(SNAP ~30%), 同样面临广告变现和年龄验证挑战"
      key_difference: "SNAP已盈利但增速更低 | RBLX有UGC内容飞轮但SBC问题更根本(23.1% vs 30%但RBLX从未压缩)"

    - ticker: META
      similarity: "卖方类比标杆——'RBLX是下一个META'。双边平台+广告变现+网络效应"
      key_difference: "META SBC/Rev起点18%→降至9%路径短且可见 | RBLX从23.1%降至合理水平需Revenue翻倍→类比不成立"

    - ticker: U
      similarity: "同为游戏平台/引擎, 同样面临开发者生态和变现挑战"
      key_difference: "Unity是工具(卖铲子) vs RBLX是平台(运营矿场) | Unity开发者技能可迁移 vs Luau不可迁移"

  comparative:
    - dimension: "开发者分成率"
      position: "Fortnite UEFN 74% >> Steam 70% >> YouTube 55% >> Roblox 25-30%"
      reasoning: "Roblox分成率为行业最低, 44-49pp差距构成开发者叛逃的经济动力"

    - dimension: "DAU质量(付费渗透率)"
      position: "Roblox 25.5%付费 < 多数F2P基准(30-40%)"
      reasoning: "74.5%从未消费的DAU不产生直接经济价值→DAU增长≠收入增长"

    - dimension: "SBC/Revenue"
      position: "SNAP ~30% > RBLX 23.1% > META ~18% > GOOG ~12%"
      reasoning: "RBLX处于中偏高位置, 但关键在于RBLX是唯一一家SBC历史从未下降的"

    - dimension: "估值吸引力(SBC调整后)"
      position: "含SBC: RBLX EV/真实FCF 无意义 >> 不含SBC: EV/FCF 32.9x(可比高增长SaaS)"
      reasoning: "SBC处理方式决定RBLX是'合理估值的高增长股'还是'不可估值的亏损股'"

  industry_position:
    quadrant: "高增长 × 高SBC × 窄护城河(收窄中) × 密集监管压力"
    archetype: "UGC平台飞轮——增长强劲但真实盈利力存疑, 护城河依赖锁定而非忠诚"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF双轨(Revenue+Bookings口径)→市场隐含Rev CAGR 20%+FCF Margin 25%→与SBC/开发者分成/监管结构性压力系统性矛盾"

    - pattern_id: "scenario_analysis.four_scenario_framework"
      application: "S1熊市(20%,$15B)→S2偏空(40%,$30B)→S3偏多(30%,$65B)→S4牛市(10%,$110B)→概率加权$45.5B"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "RT-1~RT-7七问独立审计→承重墙脆弱度从3.50上调至3.65→监管影响从-$11.4B因确认偏差下调15%至-$9.7B"

  novel_patterns:
    - name: "SBC薛定谔估值开关"
      description: "当SBC/Revenue>20%且SBC绝对值增速>Revenue增速时, SBC处理方式成为估值的核心变量——含SBC和不含SBC产生2-3倍估值差距, 比增长假设和折现率更能决定估值"
      transferable_to: ["SNAP", "UBER", "LYFT", "DASH", "所有SBC/Rev>20%的科技公司"]

    - name: "怨恨性留存vs热情性留存"
      description: "区分开发者/用户留在平台是因为离不开(专有语言/迁移成本)还是因为不想离开(回报优势/忠诚度)——前者的护城河会随技术进步(AI翻译)衰减, 后者不会"
      transferable_to: ["Salesforce(Apex)", "Apple(Swift锁定)", "所有依赖专有工具链的平台"]

    - name: "监管正相关尾部放大器"
      description: "多维度同源监管风险(来自同一立法浪潮)不能用独立概率相乘→正相关性使联合概率远高于独立假设→市场系统性低估同源监管的尾部风险"
      transferable_to: ["TikTok(儿童安全+国安)", "META(隐私+反垄断+AI)", "加密行业(SEC+CFTC+IRS)"]

    - name: "DAU空心化检测(品牌忠诚度分层)"
      description: "将DAU按忠诚度分层(情感/习惯/免费锁定)→50%+无实质锁定=DAU增长不等于护城河加宽→付费渗透率比DAU更有信息量"
      transferable_to: ["所有F2P平台", "所有报告MAU/DAU作为核心指标的公司"]

    - name: "口径选择本身是立场声明"
      description: "当Revenue和Bookings差距>30%时, 使用哪个口径不是分析选择而是投资立场——必须同时展示两种口径的估值结果并解释差异"
      transferable_to: ["SaaS(ARR vs GAAP Rev)", "游戏(Bookings vs Rev)", "所有递延收入占比>50%的公司"]

  framework_contributions:
    moat_insights:
      - insight: "怨恨性留存(锁定)和热情性留存(忠诚)的护城河半衰期完全不同——AI代码翻译正在瓦解Luau锁定"
        implication: "评估开发者/用户护城河时, 必须区分留存驱动力是锁定还是忠诚——锁定型护城河的半衰期需单独估算且随技术进步缩短"
      - insight: "DAU品牌忠诚度分层揭示50%+用户无实质锁定——DAU增长≠护城河加宽"
        implication: "评估网络效应时, 必须检查DAU质量(忠诚度分布+付费渗透率)而非仅看DAU数量"
      - insight: "护城河4.5/10且3年预测4.0/10——收窄趋势对终端价值影响>对近期收入影响"
        implication: "DCF终端价值应反映护城河趋势方向——收窄护城河的终端增长率应低于行业标准"

    valuation_insights:
      - insight: "SBC/Revenue>20%时报告FCF是幻觉——SBC处理方式贡献估值离散度65%"
        implication: "高SBC公司必须同时展示含/不含SBC两种估值, 并明确标注SBC是估值核心变量而非假设输入"
      - insight: "Bookings +55%中价格上调贡献15-20ppt→有机增速+35-40%"
        implication: "DCF建模应使用有机增速(剔除价格效应)作为基准→对递延确认模式的公司尤其重要"
      - insight: "方法离散度4.3x(含Track B)→估值结论本身的置信度有限→评级应反映不确定性"
        implication: "离散度>3x时评级应降格为'跟踪但不行动'类型, 不适合给明确方向性建议"

    screening_insights:
      - insight: "SBC/Revenue>20% + 报告FCF刚转正 = 'FCF幻觉'信号——需要SBC调整后FCF才能判断真实盈利力"
        implication: "选股筛选增加'SBC幻觉过滤器': SBC/FCF>0.5时标记为'报告FCF不可靠'"
      - insight: "8/8 CQ全确认=统计极端结果——以当前价格买入需同时反对全部8个风险"
        implication: "当系统性分析确认全部核心风险时, 无论增速多高都不应建仓——等待至少2/8翻转"
      - insight: "分析师共识与实证估值差距>100%=极端信号——要么市场错了要么分析框架有根本分歧"
        implication: "选股时标注'共识分歧>50%'的标的——不是买入/卖出信号, 而是'需要独立判断SBC立场'的信号"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "看到报告FCF转正时立刻检查SBC/FCF比值"
      trigger: "公司宣布FCF转正/盈利拐点且SBC/Revenue>15%"
      origin: "RBLX报告FCF $1.36B但真实FCF仅+$231M——SBC/FCF=0.83x暴露幻觉"
      generalization: "高SBC公司的报告FCF是最常见的估值陷阱之一——SBC/FCF>0.5时必须用调整后口径"

    - habit: "区分怨恨性留存和热情性留存"
      trigger: "平台声称有强大的开发者/用户生态且使用专有技术栈"
      origin: "RBLX 500万注册开发者叙事 vs 29K实际变现 + Luau锁定≠忠诚"
      generalization: "专有语言/工具链创造的锁定随技术进步衰减——AI代码翻译正在瓦解所有专有语言壁垒"

    - habit: "评估多源监管风险时检查正相关性"
      trigger: "公司面临≥3个来自同一立法浪潮的监管压力"
      origin: "RBLX四层监管(COPPA+MDL+州AG+国际)来自全球儿童保护浪潮→不能用独立概率定价"
      generalization: "同源监管风险的联合概率远高于独立假设→是最被低估的尾部放大器"

    - habit: "对管理层选择汇报最有利口径保持警惕"
      trigger: "管理层口径与独立验证数据差距>10%"
      origin: "RBLX '42%用户17+'(自报) vs 27%(独立验证)→15pp差距中核心不可解释差距3-5pp"
      generalization: "口径选择本身就是信号——当管理层持续选择最有利口径时, 实际情况通常比最有利口径更差"

  quality_feedback:
    strengths:
      - "CI注册表8个CI全部含'共识观点/我们的发现/如果我们错了/投资行动含义'四层结构——标杆: 非共识洞察应该到这个完整度"
      - "SBC数据v1.2经四源交叉验证修正(FMP+AlphaQuery+MotleyFool+APIC)——标杆: 异常数据必须多源校验"
      - "Reverse DCF双轨(Revenue+Bookings)暴露口径选择的估值影响——标杆: 递延收入公司需双口径估值"
      - "DM锚点613个,密度1.60/千字(超1.5/千字门控)——数据锚定扎实"
      - "方法离散度4.3x被诚实报告并降低评级置信度——不掩盖不确定性"
    weaknesses:
      - "v1.0/v1.1 SBC数据$2.65B严重错误——MacroTrends口径混淆未被即时发现→教训: 异常值必须即时标红"
      - "护城河评估4.5/10的拆分权重有主观成分——网络效应/转换成本/品牌的权重缺乏量化依据"
      - "广告TAM天花板$500M-$1.0B的精度有限——COPPA执法力度未知使上界不确定"

  hypothesis_tested:
    confirmed:
      - hypothesis: "报告FCF转正不等于真实盈利力(SBC幻觉假说)"
        evidence: "RBLX报告FCF $1.36B→真实FCF仅+$231M, SBC/FCF=0.83x"
        confidence_after: "高(极端案例, SBC/Rev 23.1%)"
      - hypothesis: "管理层口径选择系统性偏乐观(年龄/增速/生态规模)"
        evidence: "42% vs 27%年龄差距 + Bookings +55%含价格效应 + 500万注册vs29K变现"
        confidence_after: "高(三个维度独立确认)"

    extended:
      - hypothesis: "平台网络效应可以是收窄而非加宽的(与多数平台叙事相反)"
        extension: "RBLX证明DAU高增长+护城河收窄可以共存→DAU增长由低质量用户驱动时网络效应反而被稀释"

    refuted:
      - hypothesis: "Meta类比对所有高SBC科技公司成立(SBC终将收敛)"
        evidence: "META SBC/Rev起点18%且5年内降至9% | RBLX 23.1%且CAGR +35%从未下降→收敛路径不存在"
        lesson: "Meta类比需要验证收敛路径的可见性——没有可见路径的SBC收敛承诺不可信"

  limitations:
    - "SBC $1.13B为估算级(v1.2修正后), 精确值可能在$1.0-1.3B区间→23.1%比率的结论不受精确值波动影响但存在量级误差"
    - "监管概率(级联8-12%)基于历史类比和主观判断→COPPA 2.0和MDL是前所未有的组合, 无直接可比案例"
    - "广告TAM天花板$500M-$1.0B高度依赖COPPA执法力度假设——如果上下文定向广告突破COPPA约束, 天花板可能提升至$1.5-2.0B"
    - "护城河3年预测4.0/10的置信度低(★☆☆)——GTA 6 ROME和AI工具对UGC生态的影响无法可靠预测"
    - "报告框架版本v10.0(非最新v19.7)——部分分析模块和质量门控尚未应用"
