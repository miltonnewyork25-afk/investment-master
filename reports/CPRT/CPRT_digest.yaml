  fair_value: "$38.6 (概率加权)"
  expected_return: "+2.7% @$37.57"

  key_arguments:
    - claim: "双塔护城河(土地+网络效应)是B2B平台中最难复制的组合"
      direction: bullish
      magnitude: 5  # 48K英亩自有土地+NIMBY+750K全球买方+170国
      mechanism: "物理密度网络(250+场地,30英里覆盖)→更快服务→吸引更多保险公司→更多车辆供应→吸引更多买方→ASP溢价+14%→正反馈。土地不可再生+NIMBY使新进入者无法复制"
