# --- Layer 1: 主信号 (PolarQuant) ---
thesis:
  one_sentence: "CPRT是品质最高的B2B平台(A-Score 55.55)但安全边际不足(+2.7%)——品质已确认，等待价格回落到$30以下再行动"
