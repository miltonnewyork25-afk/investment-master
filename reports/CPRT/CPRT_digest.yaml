        evidence: "48K+英亩土地(IAA仅13,600)×90%自有 | NIMBY效应使新建残值场几乎不可能 | 250+场地,任何事故车30英里内有场地"
        vulnerability: "纯线上拍卖技术消除物理场地需求——但需5-10年级别的技术变革"
      - type: network_effect
        strength: 5
        evidence: "750K+买方×170国 | 强双边:更多买方→更高ASP(+14%溢价)→更多卖方 | 跨境流动性创造全球价格发现效率"
        vulnerability: "飞轮进入成熟稳态——750K买方在平坦段,新增1%买方仅提升ASP 0.05-0.1%。IAA买方池在追赶(~300-400K)"
      - type: switching_cost
