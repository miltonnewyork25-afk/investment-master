# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "物理+网络的双塔互强化——为什么这种护城河比纯平台更持久"
    chain: >
      48K英亩自有土地(90%)→密度网络(30英里覆盖)→更快拖车+更快处理
      → 保险公司偏好更快处理(减少仓储成本)→更多车辆供应给CPRT
      → 更多供应→吸引更多买方(750K,170国)→竞价更激烈→ASP溢价+14%
      → 更高ASP→保险公司获得更高回收额→更偏好CPRT
      → 正反馈循环。关键区别: 土地是物理瓶颈,NIMBY阻止新建
      → 纯线上平台(Uber/Airbnb)可被复制,物理密度网络不可被复制
      → 但Progressive证明: 飞轮不保护单个客户——只保护系统整体
    transferable_to: "所有物理基础设施+双边市场组合的公司(Waste Management/Republic Services/拍卖行业)"
    reasoning_habit: "评估双边市场护城河时,追问'物理瓶颈在哪里'——没有物理瓶颈的双边市场(纯数字平台)护城河持久性更低"

  - id: "CC-2"
    name: "双寡头中转换成本的幻觉——Progressive的启示"
    chain: >
      传统分析: 系统集成+历史数据+服务关系=高转换成本
      → Progressive反证: ~90%份额从CPRT转至IAA,顺利完成
      → 为什么? 双寡头市场中替代选择唯一且随时可用
      → 关键洞见: 转换成本=f(替代选择数量)——替代选择越少,每个替代越ready
      → 垄断(0替代)→转换成本∞; 双寡头(1替代)→转换成本≈0
      → 推论: 双寡头护城河来自规模/效率差距,不来自客户锁定
      → CPRT护城河的真正承重墙是W1(土地)+W2(规模),不是W4(锁定)
    transferable_to: "所有双寡头市场(Boeing/Airbus, Visa/Mastercard, MCO/SPGI, 可口可乐/百事)"
    reasoning_habit: "在双寡头市场中,'客户锁定'几乎总是被高估——因为唯一的替代方永远在等待接单。测试方法: 问'如果客户要切换,替代方需要多长时间ready?'如果答案<6个月,锁定是幻觉"

  - id: "CC-3"
    name: "TLF×覆盖率净效应的非直觉——方向可能为负"
    chain: >
      TLF↑(全损率上升)→更多事故车进入拍卖→利好CPRT
      → 但TLF作用于"有碰撞险的事故车"
      → 同时: 保险覆盖率↓(29%消费者降级/取消保险)→分母缩小
      → 净效应=TLF↑ × 覆盖率↓=不确定
      → 数学: TLF+1.6pp(FY2025)但碰撞险覆盖可能-2-3pp→净效应负
      → 这是CI-01"量缩价升"的核心脆弱点
      → 市场将TLF上升解读为纯正面→忽略了分母在缩小
    transferable_to: "所有'渗透率×基数'型增长故事——渗透率提升但基数萎缩时净效应可能为负(如SaaS NRR提升但客户数下降)"
    reasoning_habit: "看到'渗透率提升'叙事时,立刻追问'基数在变化吗'——很多增长故事忽略了分母变化"

  - id: "CC-4"
    name: "隐含租金还原法——发现重资产公司的隐藏价值"
    chain: >
      CPRT自有48K英亩土地→以1990s起历史成本入账→账面$3.7B
      → PropCo/OpCo分离: 如果CPRT租赁而非自有这些土地→隐含租金$280-340M/年
      → Cap rate 6-7%→土地公允价值$4.0-6.0B→溢价$0.3-2.3B
      → 这意味着CPRT的真实P/E(扣除土地价值后)比GAAP P/E低2-3x
      → 类比CME的Core PE概念: 剥离非核心资产后看真实运营估值
      → 投资含义: 重资产公司的GAAP估值可能系统性低估真实价值
    transferable_to: "所有拥有大量实物资产的B2B平台(仓储REITs/数据中心/废物管理)"
    reasoning_habit: "遇到重资产公司时,先做PropCo/OpCo分离——账面值vs公允价值的差距可能是隐藏的安全边际"

  - id: "CC-5"
    name: "条件反周期vs绝对反周期——历史回测揭示真相"
    chain: >
      叙事: CPRT是反周期资产(衰退→更多事故车→利好)
      → GFC实测: 收入-5.3%(轻微负面),非反周期
      → COVID实测: 收入+10.1%(但因时间线保护+ASP暴涨,是顺二手车周期)
      → 2022通胀: 收入+30%(顺二手车价格周期)
      → 修正: CPRT不是反周期,是"条件反周期"——取决于二手车价格和TLF的方向
      → D1从x1.1下调至x1.05
      → 推论: 温和衰退对CPRT净效应≈0(TLF对冲保险覆盖下降); 深度衰退-3%至-5%
    transferable_to: "所有声称'反周期'的公司——必须用历史数据回测验证,不能仅凭叙事"
    reasoning_habit: "看到'反周期'标签时,要求至少3次历史衰退的实际财务数据——叙事型反周期(理论上应该)vs实证型反周期(历史上确实)"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "CPRT拥有强客户锁定——保险公司无法轻易切换"
      final: "双寡头中转换成本≈零——Progressive证明了切换可以顺利完成"
      pivot: "Progressive将~90%份额从CPRT转至IAA,RBA2026年被BofA称为'第一个无失真表现年'"

    - initial: "CPRT是反周期资产——衰退利好业务"
      final: "CPRT是条件反周期——取决于二手车价格和TLF方向,D1从x1.1下调至x1.05"
      pivot: "GFC -5.3%(轻微负面) | COVID +10%(时间线保护+ASP暴涨,顺周期) | 2022 +30%(顺二手车价格)"

    - initial: "TLF上升=纯正面"
      final: "TLF×覆盖率净效应可能为负——分母(有碰撞险的车辆)在缩小"
      pivot: "29%消费者降级/取消保险, 8%从全险转仅责任险, 26%选择$1000+免赔额"

  surprises:
    - finding: "CPRT是所有B2B基准公司中唯一一家护城河主要来自物理稀缺性(土地+NIMBY)而非制度/品牌/网络的公司"
      implication: "护城河分析框架需要一个新的原型: '物理密度网络'——不同于制度嵌入(FICO)或品牌网络(IHG),其持久性来自不可再生的物理资产"

    - finding: "飞轮进入成熟稳态——750K买方在平坦段,新增1%买方仅提升ASP 0.05-0.1%"
      implication: "CPRT的流动性飞轮从'加速'转为'匀速'——网络效应的边际贡献递减意味着增长必须来自TLF/国际扩张等外部驱动,而非飞轮自驱动"

    - finding: "OPM差距收敛放缓: 2023→2024 -6.3pp, 2024→2025仅-0.5pp——RBA的低垂果实已采完"
      implication: "RBA追赶有天花板——8pp+结构性差距(利息成本+土地成本)需5-10年才能缩小。CPRT的运营优势比份额优势更持久"

    - finding: "CPRT当前P/E 23.5x已无对RBA的溢价——市场在给CPRT打折价(52周低位附近)"
      implication: "问题不是'溢价会缩小多少'而是'当前折价是否过度'——如果DOJ和解+量恢复,有估值重构空间+17-28%"

  blind_spots:
    - area: "DOJ调查最终结果(已静默2.5年)"
      why_matters: "如果运营限制(非仅罚款)→国际买方受限25%→收入-15%至-20%→股价$23-28"
      monitor: "10-Q/10-K中DOJ披露措辞变化 | 和解公告 | 2026年下半年应有进展"

    - area: "ASP增长中混合效应vs真实价值提升的占比"
      why_matters: "如果混合效应>50%→ASP增长不可持续→增速从10%降至2-4%→P/E应在15-18x→$24.8"
      monitor: "Q3 FY2026同车型ASP趋势 | 低价值车退出速度是否放缓"

    - area: "State Farm RFP结果"
      why_matters: "State Farm是最大车险客户——如果分配20%给IAA,比Progressive影响更大"
      monitor: "State Farm公告 | CPRT季度单位量变化 | 行业会议透露"

  # ★ v1.2新增: 卖出时机教训 ★
  sell_lessons:
    - scenario: "Progressive转移后未立即评估多米诺风险→如果GEICO/State Farm跟进,损失加倍"
      lesson: "双寡头中大客户切换=信号弹,不是孤立事件。第一个切换后立刻评估前5大客户切换概率"
      transferable: "所有双寡头+客户集中度>50%的B2B公司"
    - scenario: "品质优秀(A-Score最高)但安全边际不足(+2.7%),如果建仓→被短期风险套住"
      lesson: "品质≠时机。A-Score/CQI高分只说明'什么值得买',不说明'什么时候买'。等价格比等品质更重要"
      transferable: "所有高品质但高估值的公司(CME的'品质陷阱'教训的另一面)"
    - scenario: "TLF叙事吸引人但天花板不确定——如果在叙事高点买入,天花板提前到达则被套"
      lesson: "世俗趋势型增长故事(TLF/数字化/渗透率)最大风险不是逆转而是减速。减速比逆转更难识别但同样影响估值"
      transferable: "所有依赖渗透率提升的公司(5G/EV/云计算渗透率故事)"

# --- Layer 2.5: 信号分级 (v1.2新增) ---
signal_hierarchy:
  alpha_signals:
    - signal: "Q3 FY2026美国保险单位量YoY增速"
      why_alpha: "直接验证/证伪CI-01'量缩价升'——量恢复=暂时冲击,量持续下降=结构性转型。决定P/E应在18x还是25x"
      current_reading: "Q2 FY2026: -10.7%(单季) | 排除CAT后: +1.3%——方向不明,Q3将是分水岭"
    - signal: "RBA/IAA OPM季度趋势"
      why_alpha: "OPM差距收敛速度决定双寡头均衡位置。差距从18.8pp开始:如果加速收敛至<12pp→CPRT定价权下降→份额迁移加速"
      current_reading: "收敛放缓(2024→2025仅-0.5pp),但RBA单位量+4.7%是警示信号"
    - signal: "DOJ调查进展(和解vs运营限制)"
      why_alpha: "二元结果决定国际买方命运——罚款=噪音(FCF可覆盖) vs 运营限制=飞轮反转(-15%至-20%收入)"
      current_reading: "静默2.5年,10-Q措辞最模糊('unable to predict'),Trump政府可能温和处理"

  confirmation_signals:
    - signal: "TLF季度趋势"
      bullish_threshold: ">25%且逐季上升(TLF加速确认)"
      bearish_threshold: "连续3季度环比下降(天花板提前到达)"
    - signal: "CPRT ASP YoY增速(排除CAT)"
      bullish_threshold: ">5%且混合效应<30%(真实价值提升)"
      bearish_threshold: "<2%且量未恢复(量价双降)"
    - signal: "管理层回购行为"
      bullish_threshold: "持续回购@$35以下(CI-03时机大师验证)"
      bearish_threshold: "回购在$40+时加速(纪律破裂,资本毁灭)"

  noise_signals:
    - signal: "单季度CAT(飓风)收入波动"
      why_noise: "CAT收入高度季节性且不可预测——Q2 FY2026收入-3.6%但排除CAT后+1.3%。看12M trailing而非单季度"
    - signal: "RBA股价表现"
      why_noise: "RBA股价受整合进度/债务/管理层变动多重因素影响,不直接反映IAA对CPRT的竞争威胁强度"
    - signal: "分析师目标价($33-62)"
      why_noise: "区间极宽(88%),说明卖方共识本身不确定——自己做估值比看卖方更准"

# --- Layer 3: 关系网络 (内积保真) ---
relationships:
  nearest_neighbors:
    - ticker: WM
      similarity: "同为物理基础设施垄断+NIMBY壁垒+双寡头(WM vs RSG ≈ CPRT vs IAA)+条件反周期"
      key_difference: "WM的护城河更依赖监管(垃圾填埋许可)+长期合约 vs CPRT更依赖流动性网络效应 | WM增速更低(3-5%)但估值更高(P/E ~28x)"

    - ticker: ICE
      similarity: "同为B2B平台+金融基础设施+双边市场网络效应"
      key_difference: "ICE是纯数字平台(无物理资产) vs CPRT是重资产+数字混合 | ICE的护城河来自制度嵌入(监管强制)+数据 vs CPRT来自物理稀缺性+流动性"

    - ticker: MCO
      similarity: "同为双寡头垄断(MCO/SPGI ≈ CPRT/IAA)+B2B框架可比"
      key_difference: "MCO/SPGI转换成本极高(制度嵌入,SEC要求评级) vs CPRT/IAA转换成本低(Progressive已证明) | MCO无物理资产 vs CPRT重资产"

  comparative:
    - dimension: "护城河持久性"
      position: "CPRT C6物理壁垒 > CPRT C2网络效应 > MCO制度嵌入 > CPRT W4客户锁定"
      reasoning: "物理壁垒(土地+NIMBY)>20年不可复制 | 网络效应在成熟但仍强(750K买方) | 制度嵌入可被监管变更 | 客户锁定已被实证可突破"

    - dimension: "增长质量"
      position: "MCO (~10%) > ICE (~8%) > CPRT (5-7%, Reverse DCF隐含) > CME (5-7%)"
      reasoning: "CPRT增速依赖TLF世俗趋势(外生)+国际扩张 | 有结构性驱动但面临覆盖率逆风"

    - dimension: "估值吸引力"
      position: "CPRT (P/E 23.5x, +2.7%) > CME (P/E 28x, Core 33.8x) > MCO > ICE"
      reasoning: "CPRT在52周低位附近,已无对RBA的P/E溢价——可能是最接近合理估值的时候"

    - dimension: "A-Score/品质"
      position: "CPRT (55.55/70) > FICO > CME > MCO > ICE(B2B基准)"
      reasoning: "C2+C6双5分+D1反周期修正→品质最高但增速不匹配(类CME品质陷阱的初期)"

  industry_position:
    quadrant: "最高品质 × 接近合理估值 × 中等增速"
    archetype: "物理基础设施垄断——不是'收费站'(CME)而是'废水处理厂'(不可或缺但低调)"

# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含Rev CAGR 6.5-7.5% vs 分析团队认为5-7%(TLF×覆盖率净效应)→市场可能略乐观"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "7个系统性偏差全指向看多→12%下调→但方法论改进: 对主观方法(DCF Bull)-15-20%, 对客观方法(LBO/替代成本)-5-8%"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "Progressive多米诺: Progressive转移→示范效应→GEICO/State Farm重新评估→双供应商成行业标准→CPRT从65%→55%→温水煮青蛙式份额流失"

  novel_patterns:
    - name: "双塔护城河(物理+网络互强化)"
      description: "物理密度网络(土地)和双边市场网络效应形成两座独立但互补的'塔'——单塔受损不致命(Progressive攻击W4但W1/W2未受损),但两塔联合提供冗余保护"
      transferable_to: ["Waste Management/RSG(物理+合约)", "港口/机场运营商(物理+网络)", "所有重资产+平台混合模型"]

    - name: "双寡头转换成本幻觉"
      description: "双寡头市场中,替代选择唯一且随时可用→转换成本≈零。护城河来自规模/效率差距,不来自客户锁定"
      transferable_to: ["Boeing/Airbus", "Visa/Mastercard(但支付有制度嵌入)", "MCO/SPGI(但有制度嵌入)", "所有纯双寡头"]

    - name: "隐含租金还原法(PropCo/OpCo分离)"
      description: "对自有大量实物资产的公司,计算如果租赁这些资产的隐含租金→cap rate还原→发现账面值与公允价值的差距→隐藏安全边际"
      transferable_to: ["仓储REITs/数据中心(Digital Realty)", "废物管理(WM)", "所有拥有大量自有土地/建筑的公司"]

    - name: "渗透率×基数净效应模型"
      description: "渗透率(TLF)提升是正面叙事,但如果基数(有碰撞险的车辆)在萎缩,净效应可能为负。必须建模'渗透率×基数'而非仅看渗透率"
      transferable_to: ["所有渗透率提升叙事: SaaS NRR×客户数, 5G覆盖率×ARPU, EV渗透率×总汽车保有量"]

    - name: "危机信任不可购买(Layer 5锁定)"
      description: "在飓风等极端事件中被验证过的'不掉链子'信任记录需10-20年+多次大型事件才能建立,一次失败即可摧毁——这是一种不可用资本购买的护城河维度"
      transferable_to: ["保险公司品牌(GEICO/State Farm)", "云基础设施(AWS/Azure可靠性记录)", "军工供应商(战场验证)"]

    - name: "Nash脆弱窗口(双寡头博弈的时间维度)"
      description: "双寡头均衡不是静态的——当老二完成整合/去杠杆后会进入'进攻期'。识别这个窗口(2028-2029 for CPRT)可以前瞻性地调整仓位"
      transferable_to: ["所有经历并购整合的双寡头第二名(RBA/IAA, Sprint→T-Mobile, Lam Research/KLA整合后)"]

  # ★ v1.2新增: 框架升级贡献 ★
  framework_contributions:
    moat_insights:
      - insight: "物理+网络双塔互强化是比纯网络效应更持久的护城河——单塔受损不致命"
        implication: "护城河评估应增加'冗余度'维度——多维护城河的真正价值在于冗余保护而非单维度深度"
      - insight: "双寡头市场中客户锁定是幻觉——Progressive用实证证明转换成本≈零"
        implication: "评估双寡头护城河时,将'转换成本'权重降至最低,重点评估规模/效率差距的持久性"
      - insight: "飞轮有成熟稳态——750K买方在平坦段,边际贡献递减"
        implication: "网络效应评估需区分'加速阶段'(高边际贡献)和'稳态阶段'(低边际贡献)——给不同阶段不同的增长倍数"

    valuation_insights:
      - insight: "隐含租金还原法揭示重资产公司的隐藏价值——CPRT账面$3.7B vs 公允$4.8-6.0B"
        implication: "对所有自有大量实物资产的公司,加入PropCo/OpCo分离估值作为安全边际检查"
      - insight: "P4偏差校准应区分方法主观性——DCF Bull(-15-20%) vs LBO(-5-8%),而非统一12%下调"
        implication: "偏差校准框架升级: 为每种估值方法设定不同的校准系数,而非一刀切"
      - insight: "估值重构('拍卖公司'23.5x→'基础设施垄断'28-30x)需要催化剂才能实现,无催化剂=隐含溢价不兑现"
        implication: "估值重构不等于当前低估——必须识别催化剂(DOJ和解/量恢复)才能给予目标倍数"

    screening_insights:
      - insight: "A-Score(品质)最高≠安全边际最大——CPRT A-Score 55.55但+2.7%不足以建仓"
        implication: "选股框架: 品质筛选(A-Score)只是第一步,必须叠加估值筛选(期望回报>15%)才能行动"
      - insight: "双寡头+客户集中度>50%=份额迁移风险——Progressive模式可在任何双寡头中重演"
        implication: "选股风险过滤器: 双寡头+前5客户>40%份额→标记'Progressive风险'→要求更高安全边际"
      - insight: "条件反周期(D1=x1.05)比绝对反周期(D1=x1.1)更常见——必须历史回测验证"
        implication: "筛选时不接受未经回测的'反周期'标签——要求至少3次衰退实际数据"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "在双寡头市场中,将转换成本默认设为低,除非有制度嵌入(MCO/FICO)证明否则"
      trigger: "分析双寡头竞争格局时"
      origin: "Progressive ~90%份额顺利转至IAA——双寡头中替代选择唯一且随时可用"
      generalization: "纯双寡头(无制度强制)的护城河来自运营效率差距和规模差距,不来自客户锁定"

    - habit: "渗透率提升叙事必须检查基数变化"
      trigger: "看到'渗透率从X%提升到Y%=利好'的论证时"
      origin: "TLF从22%→24%是正面,但碰撞险覆盖率可能-2-3pp→净效应不确定甚至为负"
      generalization: "净增长=渗透率变化×基数变化——只看渗透率忽略基数=高估增长"

    - habit: "对重资产公司做PropCo/OpCo分离估值"
      trigger: "遇到自有大量土地/建筑且以历史成本入账的公司"
      origin: "CPRT 48K英亩土地账面$3.7B,公允$4.8-6.0B——差距$1-2.3B是隐藏的安全边际"
      generalization: "历史成本记账的实物资产=潜在的隐含价值。PropCo/OpCo分离是发现这种价值的标准工具"

    - habit: "'反周期'标签必须用至少3次衰退的实际数据回测验证"
      trigger: "公司/行业声称具有反周期属性"
      origin: "CPRT叙事说反周期,GFC实测-5.3%(轻微负面),COVID+10%(顺周期),2022+30%(顺周期)→修正为条件反周期"
      generalization: "叙事型反周期(理论上应该)的价值远低于实证型反周期(历史上确实)——D1修正系数应基于实证"

  quality_feedback:
    strengths:
      - "护城河分析创新性高——双塔+飞轮架构是独特的分析框架,C2×C6互强化的洞见可迁移"
      - "红队(RT-1~RT-7)有效——5/5脆弱度的'量缩价升'假设识别+Bear Steelman五条裂缝有实质杀伤力"
      - "B2B平台框架v1.0首测成功——I×L双轴评分区分度高,隐含租金SOTP极有价值"
      - "竞争分析深入——Nash均衡三层+Progressive转移深度解剖+RBA OPM收敛路径量化"
    weaknesses:
      - "DM密度极低(0.15/千字)——远低于0.5阻断线,数据锚定严重不足"
      - "缺少显式D1-D11质量记分卡——无法量化比较"
      - "期权价值估算主观性高——国际扩张50%成功概率缺乏锚定"
      - "Phase间章节有重复——CI注册表在多个Phase重复出现(铁律M违反)"

  hypothesis_tested:
    confirmed:
      - hypothesis: "品质最高≠机会最高 (CME垄断三角教训)"
        evidence: "CPRT A-Score 55.55(10家最高)但期望回报仅+2.7%——品质已确认但安全边际不足"
        confidence_after: "高(CME+CPRT双重确认)"

      - hypothesis: "Reverse DCF必须P1前置 (CRM v2.0铁律O)"
        evidence: "Ch14 Reverse DCF有效识别了市场隐含6.5-7.0% CAGR——与P3概率加权5.8-7.2%高度一致,验证市场定价合理"
        confidence_after: "高(执行确认)"

    extended:
      - hypothesis: "飞轮摩擦力量化 (CME v3.0)"
        extension: "CPRT飞轮从'加速→匀速'的成熟稳态是一种新类型——CME飞轮摩擦力45%(外生驱动),CPRT飞轮边际贡献递减(内生饱和)"

    refuted:
      - hypothesis: "双寡头中客户锁定提供强护城河"
        evidence: "Progressive ~90%转移证明双寡头中转换成本≈零——唯一替代方永远ready"
        lesson: "双寡头护城河的真正来源是运营效率差距+规模差距,不是客户锁定(除非有制度嵌入)"

  limitations:
    - "DM密度0.15/千字——数据锚定严重不足,大量判断缺乏显式来源标注"
    - "DOJ调查结果无法预测(已静默2.5年)——运营限制vs罚款是二元风险,无法概率加权"
    - "ASP增长中混合效应vs真实价值提升的占比未精确量化——这是CI-01的核心脆弱点"
    - "国际扩张期权价值$1.4/share基于50%成功概率——主观判断,无可比案例锚定"
    - "B2B平台框架v1.0仅有CPRT一个样本——参数校准需ICE/MCO/CSGP更多样本"
