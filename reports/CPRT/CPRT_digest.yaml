    - claim: "Progressive转移证明客户锁定(W4)可被突破,双寡头中转换成本接近零"
      direction: bearish
      magnitude: 4  # Progressive ~90%转至IAA,实证证明
      mechanism: "双寡头市场中只有一个替代→转换成本≈零→Progressive成功转移给所有保险CFO提供了'可以切换'的信号→双供应商策略可能成为新常态→CPRT份额从65%→55%"
      kill_switch: "Progressive在IAA服务质量不满意后回流(BofA预期可能回到50/50) | IAA整合失败→服务退步→保险公司回到CPRT"

    - claim: "'量缩价升'新常态可持续性存疑——ASP+6%中混合效应可能占>50%"
      direction: bearish
      magnitude: 5  # 红队评为5/5脆弱度,整个论文的承重墙
      mechanism: "保险覆盖率结构性下降(29%消费者降级/取消保险,8%从全险转仅责任险)→进入拍卖池的车辆减少→ASP增长部分来自低价值车退出(混合效应)而非真实单车价值提升→混合效应是一次性的→增速将回落至2-4%"
      kill_switch: "TLF持续加速(>26%)完全对冲覆盖率下降 | 车龄持续上升至14年+→老车全损率跳升"

    - claim: "TLF(全损率)从24.2%到32%提供7年结构性增长跑道"
      direction: bullish
      magnitude: 4  # CCC行业数据+ADAS校准+车龄三重驱动
      mechanism: "ADAS校准渗透35.6%(+8.7pp YoY)→修复成本飙升→更多车被判全损→TLF上升→每1pp=行业增量4-5%→7年累计+27%行业单位增量"
      kill_switch: "ADAS成本随技术成熟下降30-40%(3-5年) | AV渗透>50%→事故频率降15-20%→TLF在27-28%见顶 | EV电池回收独立产业链形成→车辆不经传统拍卖"

    - claim: "土地银行是免费看涨期权:账面$3.7B,公允价值$4.8-6.0B"
      direction: bullish
      magnitude: 3  # SOTP验证但幅度小于初始假设
      mechanism: "48K英亩90%自有土地以历史成本入账(1990s起)→PropCo/OpCo分离估值→隐含租金$280-340M/年→cap rate 6-7%→土地公允价值$4.0-6.0B→溢价$1-3B未反映在股价中"
      kill_switch: "商业地产大幅贬值(衰退+利率飙升) | 环保法规变更要求场地修复(增加负债而非资产)"

  moat:
    composite_score: 6.7  # 20/30 (67%)
    half_life: "8-12年(综合) | C6物理壁垒>20年(最坚固) | C2网络效应10-15年(略减) | W4客户锁定<5年(最脆弱,Progressive已实证)"
    dimensions:
