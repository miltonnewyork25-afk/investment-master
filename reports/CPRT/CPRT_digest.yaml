        evidence: "保险公司-拍卖商系统集成(API对接/理赔流程/VIN数据流) | 但Progressive证明切换成本远低于'基础设施垄断'叙事暗示"
        vulnerability: "双寡头市场中替代方案唯一且可用→转换成本≈零(Progressive实证) | 如果IAA回收率追平到1-2pp差距,锁定彻底消失"
      - type: data
        strength: 3
        evidence: "25年+拍卖/车辆/买家行为数据 | IntelliSeller AI定价工具 | 但数据不如FICO评分那样排他——IAA也在积累类似数据"
        vulnerability: "竞争对手可积累相似数据(IAA有RBA全球数据) | 数据优势非排他"
      - type: regulatory
        strength: 2
        evidence: "保险行业惯例使用外包拍卖商(但非制度强制) | 环保/场地许可构成进入壁垒"
        vulnerability: "非制度嵌入型——保险公司可绕过拍卖商自行处置,只是选择不这样做。对比FICO/MCO的制度强制使用"

  valuation:
    reverse_dcf_implied: "市场隐含Revenue CAGR 6.5-7.5%×10年: TLF到28-30%+ASP+2-3%/yr+国际+1-2%+OPM维持36-37%+无重大份额损失"
    methods_used: ["Reverse DCF", "DCF(概率加权)", "SOTP(PropCo/OpCo)", "可比公司", "历史估值带", "LBO", "替代成本"]
    dispersion: "方法离散度130%($17.8-$41.0) | 情景离散度123%($24-$53.5)"
    consensus_vs_ours: "市场把CPRT当'拍卖公司'定价(P/E 23.5x) | 我们认为应是'基础设施垄断'(28-30x) | 但P4偏差校准后两者收敛"
    entry_zone: "$30以下 (P/E ~17x, FCF Yield ~6%)"
    catalyst: "DOJ和解(重估最强催化)+Q3 FY2026(2026年5月,量恢复验证)+飓风季(6-9月,CI-04危机信任验证)"

  # ★ v1.2新增: 买卖决策框架 ★
  action_framework:
