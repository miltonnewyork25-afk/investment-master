      kill_switch: "如果侵蚀从边缘层扩散到核心层(Top 20%留存率<90%) → 剪刀差逻辑失效 → OPM崩塌"

  moat:
    composite_score: 4.0  # 5分制, 加权(L3权重更高)
    half_life: "L1面料>5年 | L2 DTC>5年 | L3品牌身份~2-3年(正在被侵蚀) | L4数据>5年 | L5规模>10年"
    dimensions:
