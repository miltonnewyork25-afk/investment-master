# --- Layer 1.5: 因果链保真 ---
causal_chains:
  - id: "CC-1"
    name: "品牌护城河五层分层诊断法"
    chain: >
      品牌不是单一壁垒→拆分为5层(面料技术/DTC体验/品牌身份/数据忠诚/规模经济)
      → 逐层评估健康度+被侵蚀速度+修复难度
      → 发现L3(品牌身份)是唯一被快速侵蚀的层(3/5)
      → 其余4层仍完好(4-5/5)
      → 因此品牌不是Gap式全面崩塌(5层同时衰退)而是局部受伤(1层恶化)
      → 但L3是PE乘数最大的层(心智=溢价)→L3衰退对估值的影响>其余4层之和
      → 修复L3需要品牌重塑(高难度/2-3年)→催化来自新CEO
    transferable_to: "所有品牌型消费品公司(NKE/SBUX/EL/LVMH)的品牌健康诊断"
    reasoning_habit: "品牌不是'强/弱'的二元判断——必须拆层检验, 因为不同层被侵蚀的速度和可修复性完全不同"

  - id: "CC-2"
    name: "DTC份额作为品牌护城河的领先指标"
    chain: >
      观察: 美洲comp -3%(滞后指标)看似温和
      → 但DTC份额10个月从30%→24%(-6pp)才是真正信号
      → 因为DTC是护城河载体(直接客户关系→数据→个性化→忠诚度循环)
      → 份额丢失=正反馈循环被打断
      → 而Alo从8%→14%(+6pp)=近乎1:1替代
      → 但线性外推危险: 初期流失可能是边缘客户(价格敏感/低频/低利润)快速清洗
      → 真正检验: FY2026 Q1 DTC份额是否在22-24%企稳
      → 企稳=侵蚀止于边缘层→空头减弱 | 继续下降=侵蚀扩散至核心→论点坍塌
    transferable_to: "所有DTC占比>50%的品牌(NKE/DECK/EL)——DTC份额变化比总comp更早揭示品牌健康"
    reasoning_habit: "别只看comp(滞后)——找渠道份额变化(领先)。谁在抢你的客户比你卖了多少更重要"

  - id: "CC-3"
    name: "低估观察评级——低估≠即将修复的逻辑"
    chain: >
      数学: 6种方法5种指向上行, PW EV $227(+37%)→量化触发"深度关注"(>+30%)
      → 但定性检查: 品牌可修复65%(非90%)、CEO空缺、comp仍在恶化
      → 历史基准率: 消费品牌负comp恢复成功率仅56%(8案例)
      → PYPL先例: +66%但同样"低估观察"——品牌checkout仍收缩/CEO刚换
      → 因此: 低估是必要条件但非充分条件——修复需要催化(CEO+comp回正)
      → 在催化出现前→低估可能持续数年(NKE 2024-2026)
      → 正确姿态: 承认数学事实+保持方向敬畏→跟踪信号而非赌反转
    transferable_to: "所有PW EV>+30%但核心业务指标仍在恶化的公司——CME/PYPL/LULU同类处理"
    reasoning_habit: "估值吸引力和投资时机是两个独立问题——前者用数学, 后者用信号。混淆二者=抄底抄在半山腰"

  - id: "CC-4"
    name: "品牌消费品的comp→PE传导机制"
    chain: >
      comp从+15%降至-3%→市场线性外推→PE从40x压缩至12x
      → 但comp和PE的关系不是线性的——comp -3%不应该对应PE 12x(NKE comp -3%仍有PE 28x)
      → 差异源: CEO空缺+activist+DTC份额流失三重恐惧叠加→叙事性超调
      → 如果三重恐惧中任意两个消除(CEO确定+comp企稳)→PE可能从12x→19-24x(+50-100%)
      → 因此LULU的PE压缩中→基本面恶化只解释~30%→叙事恐慌解释~70%
    transferable_to: "所有经历多重负面事件叠加的品牌消费品——分解PE压缩中'基本面vs叙事'的贡献"
    reasoning_habit: "PE压缩时追问'基本面恶化解释了多少+叙事恐慌解释了多少'——叙事恐慌部分是可逆的"

  - id: "CC-5"
    name: "定价权剪刀差(低端流失=OPM利好的反直觉逻辑)"
    chain: >
      份额丢失→市场默认=坏事
      → 但分层看: 底部30%客户(促销驱动/低频)平均毛利率仅40%(vs全价58%)
      → 这些客户流失→收入-5.4%但利润仅-3.8%→OPM因mix改善上升~50bps
      → 但危险: 如果侵蚀从边缘层(Phase 1)扩散到核心层(Phase 2)→定价权崩塌(Phase 3)→OPM崩
      → 因此剪刀差只在"边缘清洗"情景成立(60%)→在"核心侵蚀"情景失效(40%)
    transferable_to: "所有经历客户流失的品牌公司——分层看'谁在流失'比'流失多少'更重要"
    reasoning_habit: "客户流失不是均匀的——追问'流失的是高利润还是低利润客户'→答案决定流失是利好还是利空"

# --- Layer 2: 残差修正 (QJL) ---
residuals:
  hypothesis_reversals:
    - initial: "PE 12x是世代级买入机会(初评倾向'关注/偏积极')"
      final: "PE 12x是显著低估但反转信号缺失→'低估观察'(从Phase 1-2的'关注'降级)"
      pivot: "红队RT-1发现DTC份额-6pp是最强空头论据(4/5)→CQ-1从65%→60%、CQ-5从70%→65%→定性下调"

    - initial: "国际扩张=利润稀释(消费品行业共识)"
      final: "中国Segment Margin 37.5%≈Americas→国际扩张是利润增厚"
      pivot: "10-K审计级地理分部数据→不是管理层口头承诺→市场嵌入的国际扩张利润折价是定价错误"

    - initial: "Alo/Vuori是生存级威胁(可能重演UA颠覆NKE的故事)"
      final: "Alo是品牌叙事威胁但非产品/规模威胁——5条件分析仅1条待观察, UA完整路径概率8-12%"
      pivot: "UA路径需5个条件中≥4个同时满足→LULU仅管理层1项待观察→联合概率极低"

  surprises:
    - finding: "品质-估值脱钩66pp是报告库中最大的——A-Score 68th percentile vs PE 2nd percentile"
      implication: "市场定价隐含'品质将大幅恶化'(A-Score从48降至35)→如果品质稳定→PE恢复空间巨大"

    - finding: "男装+14%($2.7B)增量$380M已超过美洲女装comp -5%造成的~$250M损失——男装在对冲女装"
      implication: "LULU不是单引擎公司→男装+中国双引擎可部分对冲美洲女装→comp回正的门槛比表面低"

    - finding: "CEO宣布日期望回报+10.7%且正偏态(上行50%概率/下行仅10%)——经典不对称催化"
      implication: "催化事件的期权价值~$20/share→市场可能未price-in这个不对称性"

    - finding: "Alo 63%客户同时浏览LULU——这些双栖客户在Alo完成首购→转化率下降本质是竞品截流而非需求消失"
      implication: "需求端没死→品牌切换是可逆的(如果产品力/品牌刷新成功)→与Gap(需求消失)本质不同"

  blind_spots:
    - area: "DTC份额是企稳还是继续下降"
      why_matters: "KS-01=整个论点的承重墙→份额跌破20%=论点坍塌→公允从$228→$185"
      monitor: "FY2026 Q1财报(2026年6月) | Bloomberg Second Measure月度跟踪"

    - area: "新CEO身份与市场预期的偏差"
      why_matters: "品牌型CEO催化+12-25% vs 财务型CEO催化+5-8%→CEO类型决定催化幅度差3-4x"
      monitor: "Elliott公开声明 | 猎头行业消息 | 2026年AGM(6月)"

    - area: "关税政策走向(最弱假设A6)"
      why_matters: "越南(35%产能)如果也被加税→冲击$250-350M/年→远超当前$167M→OPM压缩至17-18%"
      monitor: "美国贸易政策声明 | USTR行动 | 越南对美贸易顺差数据"

    - area: "品牌在Z世代中的吸引力(慢变量)"
      why_matters: "Z世代是未来10年核心消费群→如果LULU在Z世代中永久丧失心智→品牌S曲线进入衰退期"
      monitor: "Google Trends(LULU vs Alo搜索量) | TikTok内容量 | NPS分龄段数据"

  sell_lessons:
    - scenario: "品牌消费品PE从40x降至12x时未在PE 22-25x减仓→持有人经历-70%回撤"
      lesson: "品牌溢价PE(30-50x)不是永久的——当comp转负+竞品崛起→PE压缩可能极其剧烈。品牌消费品应在comp首次转负时review仓位, 而非等待comp恢复"
      transferable: "所有PE>30x且增速依赖品牌溢价(而非技术壁垒)的消费品公司"
    - scenario: "低估但无反转信号时过早建仓→持有成本(时间+波动)可能消耗期望回报"
      lesson: "低估观察类公司(PYPL/LULU)的正确姿态是等待信号而非赌反转——NKE从PE 22x到恢复花了12个月, 期间波动剧烈"
      transferable: "所有PW EV>+20%但核心业务指标仍在恶化的公司"
    - scenario: "品牌消费品的DTC份额开始快速下降时是关键卖出窗口"
      lesson: "DTC份额是品牌健康的领先指标——在comp还看似温和时DTC份额已在崩塌(LULU comp -3%但DTC -6pp)→DTC是更早的预警"
      transferable: "所有DTC占比>50%的品牌消费品——DTC份额变化应纳入卖出纪律"

# --- Layer 2.5: 信号分级 ---
signal_hierarchy:
