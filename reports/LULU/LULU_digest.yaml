    - signal: "Americas DTC高端运动服饰份额(季度)"
      why_alpha: "比comp更早揭示品牌健康→10个月-6pp时comp仅-3%→DTC份额是2-3个季度的领先指标。大多数分析师只看comp"
      current_reading: "24%(从30%下降6pp, 10个月)"
    - signal: "品质-估值脱钩度(A-Score percentile vs PE percentile)"
      why_alpha: "66pp脱钩是报告库最大→如果品质稳定则PE必须恢复→可量化的均值回归空间"
      current_reading: "A-Score 68th vs PE 2nd = 66pp脱钩"
    - signal: "中国Segment Margin趋势"
      why_alpha: "市场默认国际=利润稀释→37.5% Margin颠覆共识→如果Margin维持→每$1B中国增收=$375M利润增厚"
      current_reading: "37.5%(≈Americas, 审计级数据)"

  confirmation_signals:
    - signal: "Americas quarterly comp"
      bullish_threshold: "≥-1% 连续2Q(企稳确认)"
      bearish_threshold: "≤-5% 连续2Q(加速恶化)"
    - signal: "新品全价售罄率"
      bullish_threshold: "≥70%(产品力恢复, vs历史80%+)"
      bearish_threshold: "<50%(创新机器失灵)"
    - signal: "美国NPS"
      bullish_threshold: "企稳≥+25(当前+32, 从+50+下降)"
      bearish_threshold: "<+15(品牌心智崩塌)"

  noise_signals:
    - signal: "日度股价波动(特别是meme stock关联)"
      why_noise: "LULU短期价格受activist新闻/关税消息驱动→与基本面脱钩→看季度数据不看日度"
    - signal: "Alo估值/融资消息"
      why_noise: "Alo私有融资估值被VC膨胀→不反映真实竞争力→看DTC份额变化而非Alo估值"
    - signal: "Wilson公开批评"
      why_noise: "Wilson的批评('LULU lost its cool')虽然刺耳但诊断可能对→关键是board能否行动, 不是Wilson说了什么"

