        vulnerability: "L3是最脆弱层——Alo正在偷走年轻客户酷感; 如果品牌身份层继续恶化→连锁反应影响其他层"
      - type: switching_cost
        strength: 4
        evidence: "3000万Essential Membership会员(美国成年人~12%); Top 20%客户留存92%; 80%客户注册忠诚计划; DTC数字渗透39-42%→直接掌握客户数据"
        vulnerability: "线上时代门店体验的锁定效应减弱; 忠诚计划是防御性而非进攻性(不能吸引新客)"
      - type: ip
        strength: 4
        evidence: "Nulu/Everlux/Nulux/PowerLu/SenseKnit自研面料系列; 估计R&D $150-200M/年 vs Alo整体收入~$1B; 面料技术领先但非不可逾越"
        vulnerability: "Alo Airbrush/Vuori DreamKnit在缩小差距; 消费者对面料差异的感知有限(leggings功能差异<品牌差异)"
      - type: data
        strength: 4
        evidence: "DTC渗透39-42%→直接客户数据(购买历史/尺码/偏好); 个性化推荐+再营销提升复购; 竞品作为私有公司数据积累远远落后"
        vulnerability: "数据价值取决于是否被有效利用——如果产品团队不根据数据调整→数据是沉没资产"

  valuation:
    reverse_dcf_implied: "市场隐含永续增速仅2-3%, 要求美洲永久负增长+品牌溢价被完全侵蚀+无CEO改善——四个极端假设同时成立的概率偏低"
    methods_used: ["Reverse DCF", "DCF(Python)", "PE Band 18x", "EV/EBITDA 12x", "SOTP修正", "概率加权EV(5情景)"]
    dispersion: "24.4% ($186-$287) PASS"
    consensus_vs_ours: "市场看LULU=品牌永久衰退(PE 12x) | 我们看LULU=暂时受伤但护城河4/5完好的品牌(公允PE 16-20x)"
    entry_zone: "$140-165 (PE 10-12x, 含关税+品牌双重折价)"
    catalyst: "CEO宣布(概率65% in 2026 H2, SBUX先例+12-25%) | Americas comp回正(60%概率18-24月)"

  action_framework:
    verdict: "等待反转信号 — 低估已确认(+37%), 但方向不明确, 等待≥2个反转信号确认后再行动"
    buy_triggers:
      - trigger: "CEO宣布+市场正面反应(+10%+) 且 DTC份额企稳≥22%"
        price_zone: "$165-185 (PE 12-14x)"
        reasoning: "两个反转信号同时确认→品牌修复路径可信度大幅上升→PE恢复至16-19x的概率>65%"
      - trigger: "股价跌至$130-140(关税恐慌或季报miss)但基本面未恶化"
        price_zone: "$130-140 (PE 10-11x)"
        reasoning: "安全边际扩大至+63-75%→即使品牌修复概率仅50%→PW EV仍显著>买入价→赔率极有吸引力"
    hold_conditions:
      - "护城河综合评分≥3.5/5(当前4.0)"
      - "FCF >$500M/年(当前$960M)"
      - "中国comp >+10%(当前+24%)"
      - "Gross Margin >53%(当前56.6%)"
    sell_triggers:
