      kill_switch: "中国comp跌破+10%且加速放缓(KS-05) | 中美关系恶化导致品牌被制裁"

    - claim: "Elliott activism是$20-40/share的离散催化事件(SBUX先例)"
      direction: conditional
      magnitude: 3  # 依赖CEO身份和时间, 不确定性高
