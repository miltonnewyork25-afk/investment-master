# --- Layer 4: 基向量映射 (稀疏表示) ---
pattern_decomposition:
  known_patterns:
    - pattern_id: "valuation.belief_inversion"
      application: "Reverse DCF→市场隐含永续增速2-3%→翻译为'品牌永久衰退'→但4/5护城河完好+中国增长引擎→隐含假设脆弱度高"

    - pattern_id: "red_team.systematic_bias_calibration"
      application: "7问红队→概率修正仅-3~6%(Phase 1-2已平衡)→Reverse DCF P1前置(铁律O)有效防止了结论先行偏差"

    - pattern_id: "scenario_analysis.boiling_frog_path"
      application: "品牌消费品的PE压缩不是一次性→而是comp持续为负→每季财报确认→PE逐步下行→从40x到12x用了2年=温水煮青蛙"

  novel_patterns:
    - name: "品牌护城河五层分层诊断(L1-L5)"
      description: "面料技术/DTC体验/品牌身份/数据忠诚/规模经济五层分别评估健康度+侵蚀速度+修复难度→综合判断品牌是'全面崩塌'还是'局部受伤'"
      transferable_to: ["NKE", "SBUX", "EL", "LVMH", "所有品牌型消费品"]

    - name: "DTC份额作为品牌领先指标(比comp早2-3Q)"
      description: "comp是滞后指标(反映已发生的交易)→DTC份额是领先指标(反映品牌选择偏好)→LULU DTC份额-6pp时comp仅-3%"
      transferable_to: ["NKE", "DECK", "EL", "所有DTC>50%的品牌"]

    - name: "低估观察评级方法论(PYPL/LULU双验证)"
      description: "当PW EV>+30%(数学低估)但核心业务指标仍在恶化+催化时间不确定→评级应为'低估观察'而非'深度关注'→等待≥2个反转信号确认"
      transferable_to: ["所有PW EV>+20%但核心KPI恶化的公司"]

    - name: "定价权剪刀差(低端流失=OPM利好)"
      description: "客户流失不均匀→底部客户(低利润/促销驱动)先走→加权利润率反而上升→但仅在'边缘清洗'阶段成立→核心侵蚀开始后失效"
      transferable_to: ["所有经历客户流失的品牌", "SaaS公司SMB流失"]

    - name: "叙事性PE超调量化(基本面vs恐慌分解)"
      description: "LULU PE压缩-71%中→基本面恶化仅解释~30%→叙事恐慌(CEO+activist+comp三重)解释~70%→恐慌部分可逆"
      transferable_to: ["所有经历多重负面事件叠加的公司"]

    - name: "CEO催化期权定价(SBUX先例法)"
      description: "activist介入+CEO空窗→CEO宣布=离散催化→用SBUX先例(+25%)+概率加权→量化催化期权价值→LULU约$20/share"
      transferable_to: ["所有activist介入+CEO更替的公司"]

  framework_contributions:
    moat_insights:
      - insight: "品牌护城河应拆为5层分别评估——不同层被侵蚀速度和修复难度完全不同"
        implication: "品牌分析从'强/弱'二元判断→升级为五层矩阵(健康度×侵蚀速度×修复难度)"
      - insight: "品牌身份层(L3)虽然分数最低但PE影响最大——心智=溢价定价权"
        implication: "护城河评估应对L3(品牌身份/心智)给予更高权重, 因为PE乘数主要由心智层驱动"
      - insight: "3000万会员+95% DTC是Alo/Vuori最难复制的部分——数据飞轮是隐性护城河"
        implication: "DTC品牌的护城河评估应包含会员基数+数据积累深度——这比品牌酷感更持久"

    valuation_insights:
      - insight: "消费品牌负comp恢复历史基准率56%(8案例)——应作为CQ概率赋值的锚"
        implication: "品牌恢复概率不能凭感觉→必须锚定历史基准率→高于/低于基准的偏差需要具体理由"
      - insight: "CEO催化期权可以被量化(SBUX先例法)并加入公允价值"
        implication: "activist+CEO空窗公司的估值应包含催化期权附加值→不纳入=低估了不对称性"
      - insight: "品质-估值脱钩度(A-Score percentile vs PE percentile)是筛选候选的有效信号"
        implication: "选股框架增加'脱钩度>50pp'筛选条件→高品质+低估值=深度调研候选"

    screening_insights:
      - insight: "DTC份额变化应纳入消费品品牌监控——比comp早2-3Q预警品牌侵蚀"
        implication: "选股跟踪清单增加DTC份额季度监控——份额-3pp/季度=进入KS警戒"
      - insight: "品质-估值脱钩>50pp + 反转信号缺失 = '低估观察'候选池"
        implication: "建立低估观察watchlist: 季度检查反转信号→≥2个确认→升级为'关注'→研究买入"
      - insight: "多重负面事件叠加(CEO+activist+comp+竞品)时PE超调概率极高——恐慌部分可逆"
        implication: "选股时关注'三重恐惧叠加'的公司——如果恐惧中仅1个是基本面驱动→PE恢复空间大"

# --- Layer 5: Meta-learning ---
meta_learning:
  reasoning_habits_acquired:
    - habit: "对品牌消费品拆5层评估护城河而非整体打分"
      trigger: "分析任何品牌溢价型公司(PE中含品牌溢价>30%)"
      origin: "LULU品牌身份层(L3)3/5但其余4层4-5/5→整体打分掩盖了局部脆弱性"
      generalization: "品牌护城河分析应拆层→每层独立评估→加权(L3权重最高)→识别'局部受伤'vs'全面崩塌'"

    - habit: "看到comp下滑时立刻追问DTC份额变化(领先指标)"
      trigger: "消费品公司comp连续2Q为负"
      origin: "LULU comp -3%看似温和但DTC份额-6pp揭示更严重的品牌侵蚀——comp是滞后指标"
      generalization: "对DTC占比>50%的公司→DTC份额变化比comp更早反映品牌健康→应优先跟踪"

    - habit: "低估+方向不明时选择'等待信号'而非'赌反转'"
      trigger: "PW EV>+20%但核心业务指标仍在恶化"
      origin: "LULU+37%但反转信号缺失→如果Phase 1-2就给'深度关注'→可能让投资者在半山腰抄底"
      generalization: "低估观察是一种纪律: 承认数学事实+保持方向敬畏→等待信号确认后再行动"

    - habit: "对客户流失分层看'谁在流失'——边缘vs核心决定利空程度"
      trigger: "品牌/SaaS公司出现客户流失或份额下降"
      origin: "LULU定价权剪刀差: 底部30%客户(低利润)流失→OPM反而上升→但仅在边缘清洗阶段成立"
      generalization: "客户流失=坏事是默认假设→但要追问: 流失的客户贡献多少利润?→低利润客户流失可能是净利好"

  quality_feedback:
    strengths:
      - "Reverse DCF P1前置有效——红队修正仅-3~6%, 远小于RCL(+8-16pp), 证明铁律O消除了结论先行偏差"
      - "品牌护城河五层分层诊断原创且可迁移——逐层量化健康度+侵蚀速度+修复难度"
      - "DTC份额领先指标发现——揭示了comp作为滞后指标的局限性"
      - "低估观察评级方法论与PYPL校准——建立了'低估但无方向'的系统处理方式"
      - "DM密度1.47/千字(合格), 355个DM锚点覆盖品牌/竞争/财务/治理/估值"
    weaknesses:
      - "DM总数355低于450门控——数据锚定密度有提升空间(特别是竞品定量数据)"
      - "品牌'酷感'量化深度有限——Google Trends/TikTok数据仅定性描述, 未建立可跟踪的量化指标"
      - "关税影响(A6, 最弱假设)的概率赋值主观性高——政治走向无信息优势"
      - "无独立质量记分卡(D1-D11)→无法精确定位薄弱维度"

  hypothesis_tested:
    confirmed:
      - hypothesis: "低估观察评级适用于'低估+无方向'的公司(v19.7, PYPL首创)"
        evidence: "LULU +37%但反转信号缺失→与PYPL(+66%)同类处理→评级校准一致"
        confidence_after: "高(两份报告独立确认同一评级方法论)"

      - hypothesis: "Reverse DCF P1前置(铁律O)消除结论先行偏差(CRM v1.0教训)"
        evidence: "红队修正仅-3~6%→Phase 1-2已均衡→无需大幅上调/下调"
        confidence_after: "高(CME + LULU双确认)"

      - hypothesis: "定价权分层评估(v19.6)揭示隐藏的客户经济学(CRM+ADBE)"
        evidence: "LULU定价权: Top 20% Stage4 / 50% Stage2.5 / 底部30% Stage1-2→加权Stage ~3→发现'剪刀差'"
        confidence_after: "高(CRM/ADBE/LULU三确认, 不同行业均适用)"

    extended:
      - hypothesis: "品牌消费品的PE压缩含大量叙事成分(可逆)"
        extension: "LULU PE压缩-71%中叙事恐慌占~70%(三重恐惧叠加)→从NKE单一案例扩展为可量化的分解框架"

    refuted: []

  limitations:
    - "DTC份额数据来自第三方(Bloomberg Second Measure), 非官方→可能有口径偏差"
    - "品牌恢复概率(65%)锚定于8个历史案例→样本量小→统计置信度有限"
    - "CEO催化效应依赖SBUX单一先例→LULU与SBUX的可比性有限(品牌受伤程度不同)"
    - "关税情景概率完全为分析师判断→政治走向无信息优势→可能显著偏离实际"
    - "中国Segment Margin 37.5%可能未完全分摊全球总部费用→真实Margin可能低3-5pp"
    - "无独立D1-D11质量记分卡→报告质量评分缺乏精确性"
